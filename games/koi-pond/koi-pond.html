  function drawFireflies() {
    if (mood.night < 0.02) { return; }
    var n = mood.night, i;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // The pale fish near the top, glowing faintly.
    for (i = 0; i < fish.length; i++) {
      var f = fish[i], v = seen(f.z);
      if (v < 0.3 || (f.k.bodyC[0] + f.k.bodyC[1] + f.k.bodyC[2]) < 500) { continue; }
      var gx = f.qx[3], gy = f.qy[3], gr = f.L * 0.6;
      var gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      gg.addColorStop(0, 'rgba(200,220,255,' + (0.16 * n * v).toFixed(3) + ')');
      gg.addColorStop(1, 'rgba(200,220,255,0)');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.arc(gx, gy, gr, 0, TAU);
      ctx.fill();
    }
    for (i = 0; i < fliesTonight; i++) {
      var fl = flies[i], a = fl.on * n;
      if (a < 0.02) { continue; }
      var x = W * (0.05 + 0.9 * (0.5 + 0.5 * Math.sin(fl.p * 1.3 + fl.u * 9))), y = H * (0.05 + 0.9 * (0.5 + 0.5 * Math.sin(fl.q * 1.1 + fl.v * 9)));
      var r = U * 0.03;
      var g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(235,255,140,' + (0.9 * a).toFixed(3) + ')');
      g.addColorStop(0.15, 'rgba(210,255,100,' + (0.45 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(180,255,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // Sound, all synthesised, so the game is never silent and never waits
  // on a download. A Japanese garden: a koto heard from across it, playing
  // a short phrase now and then with a note bent up the way a player
  // presses the string; once in a while a shakuhachi, a breathy bamboo
  // flute, holding a long note; and under them a quiet drone. Then the
  // pond itself: a plip for every pellet, a bloop for every gulp, the tiny
  // kiss of a fish at your finger, the cat, splashes, and rain.
  //
  // By day the music uses the yo scale, bright and folk-like. As dusk
  // falls it changes to the in scale, the wistful one a koto is known for.
  // Both have five notes, the plips of food landing use whichever is
  // playing, and the drone is built only from the notes the two share, so
  // nothing can ever clash.
  // ------------------------------------------------------------------
  var AC = null, master = null, verb = null, padBus = null, fxBus = null, musBus = null, noise = null;
  var rainGain = null, nextChord = 0, chordIdx = 0, nextPluck = 0, nextFlute = 0, lastPlip = 0, lastGulp = 0, lastKiss = 0;
  var ROOT = 50;                    // D
  var YO = [0, 2, 5, 7, 9];         // D E G A B
  var IN = [0, 1, 5, 7, 8];         // D E-flat G A B-flat
  // Open fifths and fourths on D, G and A, which both scales contain.
  var CHORDS = [
    [38, 45, 50, 57],
    [43, 50, 55, 57],
    [38, 45, 50, 55],
    [45, 50, 57, 62]
  ];
  var CHORD_LEN = 18, CHORD_GAP = 12;

  function curScale() { return mood.night > 0.5 ? IN : YO; }

  function note(base, i, sc) {
    sc = sc || curScale();
    var oct = Math.floor(i / 5), d = ((i % 5) + 5) % 5;
    return base + sc[d] + 12 * oct;
  }

  function pan(x) {
    return clamp((x / W - 0.5) * 1.2, -0.7, 0.7);
  }

  // Routes a voice through a panner if the browser has one.
  function out(node, x, bus) {
    if (AC.createStereoPanner && x !== undefined) {
      var p = AC.createStereoPanner();
      p.pan.setValueAtTime(pan(x), AC.currentTime);
      node.connect(p);
      p.connect(bus);
    } else {
      node.connect(bus);
    }
  }

  function noiseBuffer(secs) {
    var len = Math.floor(AC.sampleRate * secs), buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) { d[i] = Math.random() * 2 - 1; }
    return buf;
  }

  function impulse(secs, decay) {
    var len = Math.floor(AC.sampleRate * secs), buf = AC.createBuffer(2, len, AC.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    }
    return buf;
  }

  function initAudio() {
    if (AC) {
      if (AC.state === 'suspended' && !document.hidden) { AC.resume(); }
      return;
    }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { return; }
    try { AC = new Ctx(); } catch (e) { AC = null; return; }
    var t = AC.currentTime;

    // Some older Safaris only unlock once a buffer has actually played.
    var blip = AC.createBufferSource();
    blip.buffer = AC.createBuffer(1, 1, AC.sampleRate);
    blip.connect(AC.destination);
    blip.start(0);

    var comp = AC.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-18, t);
    comp.ratio.setValueAtTime(4, t);
    comp.connect(AC.destination);

    master = AC.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(0.6, t + 3);
    master.connect(comp);

    verb = AC.createConvolver();
    verb.buffer = impulse(3, 2.6);
    var verbOut = AC.createGain();
    verbOut.gain.setValueAtTime(0.45, t);
    verb.connect(verbOut);
    verbOut.connect(master);

    padBus = AC.createGain();
    padBus.gain.setValueAtTime(0.24, t);
    var padLp = AC.createBiquadFilter();
    padLp.type = 'lowpass';
    padLp.frequency.setValueAtTime(800, t);
    padBus.connect(padLp);
    padLp.connect(master);
    padLp.connect(verb);

    // The pond's own sounds, a little dry and a little in the reverb.
    fxBus = AC.createGain();
    fxBus.gain.setValueAtTime(1, t);
    fxBus.connect(master);
    var fxWet = AC.createGain();
    fxWet.gain.setValueAtTime(0.35, t);
    fxBus.connect(fxWet);
    fxWet.connect(verb);

    // The koto and the flute: clear rather than muffled like the drone,
    // and further back in the garden, so more of them is reverb.
    musBus = AC.createGain();
    musBus.gain.setValueAtTime(0.8, t);
    musBus.connect(master);
    var musWet = AC.createGain();
    musWet.gain.setValueAtTime(0.7, t);
    musBus.connect(musWet);
    musWet.connect(verb);

    // Rain: only the top of the noise, a soft hiss, and silent unless it
    // is actually raining.
    noise = noiseBuffer(3);
    var src = AC.createBufferSource();
    src.buffer = noise;
    src.loop = true;
    var hp = AC.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(2500, t);
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(7000, t);
    rainGain = AC.createGain();
    rainGain.gain.setValueAtTime(0.0001, t);
    src.connect(hp);
    hp.connect(lp);
    lp.connect(rainGain);
    rainGain.connect(master);
    src.start(t);

    nextChord = t + 0.5;
    nextPluck = t + 4 + Math.random() * 4;
    if (AC.state === 'suspended') { AC.resume(); }
  }

  function live() { return AC && master && AC.state === 'running'; }

  // Pure tones only, as in Murmuration: a sine and a quiet one an octave
  // up. Anything richer beats against itself on the low notes and hums.
  function padNote(t, midi, len) {
    var f = mtof(midi), g = AC.createGain(), level = midi < 45 ? 0.15 : 0.12;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(level, t + len * 0.35);
    g.gain.setValueAtTime(level, t + len * 0.55);
    g.gain.linearRampToValueAtTime(0.0001, t + len);
    g.connect(padBus);
    [[1, 1], [2, 0.2]].forEach(function (v) {
      var o = AC.createOscillator(), og = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * v[0], t);
      og.gain.setValueAtTime(v[1], t);
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + len + 0.1);
    });
  }

  // A koto string: a bright, twanging start with a tiny click of the
  // plectrum, the upper partials dying away first, leaving a round tone
  // that rings on. With a bend, the player presses the string down behind
  // the bridge just after plucking it, and the note slides up to the next
  // one in the scale.
  function pluck(t, midi, level, x, bus, bend, ring) {
    var f = mtof(midi), g = AC.createGain(), len = ring || 2.6;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(level, t + 0.004);
    g.gain.exponentialRampToValueAtTime(level * 0.4, t + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    out(g, x, bus || fxBus);
    [[1, 1, len, 'triangle'], [2, 0.4, len * 0.4, 'sine'], [3, 0.2, len * 0.2, 'sine'], [4, 0.1, 0.15, 'sine']].forEach(function (v) {
      var o = AC.createOscillator(), og = AC.createGain();
      o.type = v[3];
      o.frequency.setValueAtTime(f * v[0] * 1.008, t);
      o.frequency.exponentialRampToValueAtTime(f * v[0], t + 0.04);
      if (bend) {
        o.frequency.setValueAtTime(f * v[0], t + 0.15);
        o.frequency.exponentialRampToValueAtTime(f * v[0] * Math.pow(2, bend / 12), t + 0.34);
      }
      og.gain.setValueAtTime(v[1], t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + v[2]);
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + v[2] + 0.05);
    });
    if (noise) {
      var c = AC.createBufferSource(), hp = AC.createBiquadFilter(), cg = AC.createGain();
      c.buffer = noise;
      hp.type = 'highpass';
      hp.frequency.setValueAtTime(3000, t);
      cg.gain.setValueAtTime(level * 0.25, t);
      cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.02);
      c.connect(hp);
      hp.connect(cg);
      out(cg, x, bus || fxBus);
      c.start(t, Math.random() * 2);
      c.stop(t + 0.03);
    }
  }

  // A koto phrase: three to five notes wandering up and down the scale,
  // unhurried and a little uneven, sometimes with a note bent up, sometimes
  // one plucked twice quickly, and the last left to ring.
  var STEPS = [-2, -1, -1, 1, 1, 2, 0];
  function kotoPhrase(t) {
    var sc = curScale(), i = 5 + Math.floor(Math.random() * 4), n = 3 + Math.floor(Math.random() * 3);
    var x = W * (0.2 + 0.6 * Math.random());
    for (var k = 0; k < n; k++) {
      var last = k === n - 1, m = note(ROOT, i, sc), bend = 0;
      if (!last && Math.random() < 0.25) { bend = note(ROOT, i + 1, sc) - m; }
      pluck(t, m, last ? 0.08 : 0.065, x, musBus, bend, last ? 3.4 : 2.2);
      if (!last && !bend && Math.random() < 0.15) { pluck(t + 0.13, m, 0.045, x, musBus, 0, 1.4); }
      t += 0.34 + Math.random() * 0.32 + (Math.random() < 0.2 ? 0.35 : 0);
      i = clamp(i + STEPS[Math.floor(Math.random() * STEPS.length)], 3, 11);
    }
  }

  // The shakuhachi: a long, breathy note. It starts a little flat and
  // slides up onto the pitch, a slow vibrato grows as it is held, and the
  // breath is heard as well as the tone, strongest as it begins.
  function flute(t, midi, dur, x) {
    var f = mtof(midi), g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.45);
    g.gain.setValueAtTime(0.05, t + dur - 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    out(g, x, musBus);
    var vib = AC.createOscillator();
    vib.frequency.setValueAtTime(4.8, t);
    [[1, 1], [2, 0.16], [3, 0.05]].forEach(function (v) {
      var o = AC.createOscillator(), og = AC.createGain(), vg = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * v[0] * 0.94, t);
      o.frequency.exponentialRampToValueAtTime(f * v[0], t + 0.4);
      vg.gain.setValueAtTime(0, t);
      vg.gain.setValueAtTime(0, t + 0.9);
      vg.gain.linearRampToValueAtTime(f * v[0] * 0.012, t + dur * 0.85);
      vib.connect(vg);
      vg.connect(o.frequency);
      og.gain.setValueAtTime(v[1], t);
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + dur + 0.05);
    });
    vib.start(t);
    vib.stop(t + dur + 0.05);
    if (noise) {
      var b = AC.createBufferSource(), bp = AC.createBiquadFilter(), bg = AC.createGain();
      b.buffer = noise;
      b.loop = true;
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(f * 2, t);
      bp.Q.setValueAtTime(1.5, t);
      bg.gain.setValueAtTime(0.0001, t);
      bg.gain.exponentialRampToValueAtTime(0.03, t + 0.12);
      bg.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
      bg.gain.setValueAtTime(0.01, t + dur - 0.6);
      bg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      b.connect(bp);
      bp.connect(bg);
      out(bg, x, musBus);
      b.start(t, Math.random() * 2);
      b.stop(t + dur + 0.05);
    }
  }

  function scheduleMusic() {
    if (!live()) { return; }
    var now = AC.currentTime;
    if (nextChord < now) { nextChord = now + 0.1; }
    if (nextPluck < now) { nextPluck = now + 1 + Math.random() * 3; }
    if (nextFlute < now) { nextFlute = now + 20 + Math.random() * 20; }
    while (nextChord < now + 0.5) {
      var ch = CHORDS[chordIdx % CHORDS.length];
      for (var k = 0; k < ch.length; k++) { padNote(nextChord, ch[k], CHORD_LEN); }
      chordIdx += 1;
      nextChord += CHORD_GAP;
    }
    if (nextPluck < now + 0.5) {
      kotoPhrase(nextPluck);
      nextPluck += 8 + Math.random() * 8;
    }
    if (nextFlute < now + 0.5) {
      // One long note, and sometimes a second a step below it. Kept clear
      // of the koto, which waits until the flute has finished.
      var fi2 = 3 + Math.floor(Math.random() * 4), d1 = 2.6 + Math.random() * 1.2, x = W * Math.random();
      flute(nextFlute, note(ROOT + 12, fi2), d1, x);
      var end = nextFlute + d1;
      if (Math.random() < 0.5) {
        var d2 = 2.4 + Math.random() * 1.2;
        flute(nextFlute + d1 - 0.25, note(ROOT + 12, fi2 - 1), d2, x);
        end += d2;
      }
      nextPluck = Math.max(nextPluck, end + 1.5);
      nextFlute += 30 + Math.random() * 30;
    }
  }
  setInterval(scheduleMusic, 250);

  // A pellet landing: the rising "plip" of a drop, at a note of the scale.
  function plip(x, tone) {
    if (!live()) { return; }
    var t = Math.max(AC.currentTime + 0.005, lastPlip + 0.03);
    lastPlip = t;
    var f = mtof(note(ROOT + 24, Math.floor(tone * 6)));
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * 0.7, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.2);
  }

  // A gulp at the surface: a round, low bloop. Deeper down, a softer one.
  function gulpSound(x, k) {
    if (!live()) { return; }
    var t = AC.currentTime + 0.01;
    if (t - lastGulp < 0.08) { return; }
    lastGulp = t;
    var f = 170 + Math.random() * 60;
    var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 2.3, t + 0.09);
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(400 + 1600 * k, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32 * k, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(lp);
    lp.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.2);
  }

  function kissSound(x) {
    if (!live()) { return; }
    var t = AC.currentTime + 0.01;
    if (t - lastKiss < 0.22) { return; }
    lastKiss = t;
    var f = 420 + Math.random() * 120;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.8, t + 0.05);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.12);
  }

  // The little one's moments: four notes rising, gently.
  function chime(x) {
    if (!live()) { return; }
    var t = AC.currentTime + 0.05;
    for (var i = 0; i < 4; i++) { pluck(t + i * 0.16, note(ROOT + 12, 5 + i), 0.11, x, musBus); }
  }

  function plop(x) {
    if (!live()) { return; }
    var t = AC.currentTime + 0.01;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(260, t);
    o.frequency.exponentialRampToValueAtTime(130, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.22);
  }

  // The cat's voice. Each kind is a pitch that moves over its length,
  // shaped by one or two resonances so it sounds like a throat rather than
  // a whistle, and some have the roll of a trill. Every one is pitched a
  // little differently each time. Given a list, it picks one, never the
  // same as the last thing it said.
  var CAT_VOICES = {
    mrrp: { f: [260, 430], dur: 0.24, roll: 28, form: [[1100, 1.5, 1]], gain: 0.12 },
    trill: { f: [380, 560, 470], dur: 0.38, roll: 32, form: [[1300, 2, 1]], gain: 0.11 },
    mewQ: { f: [620, 860], dur: 0.3, form: [[1000, 4, 1], [2600, 5, 0.6]], gain: 0.12 },
    meow: { f: [560, 880, 600], dur: 0.45, form: [[950, 4, 1], [2500, 5, 0.6]], gain: 0.14 },
    mewHigh: { f: [800, 1050, 900], dur: 0.25, form: [[1200, 4, 1], [2900, 5, 0.6]], gain: 0.12 },
    mrow: { f: [360, 520, 320], dur: 0.6, form: [[800, 3, 1], [2200, 4, 0.5]], gain: 0.14 },
    grumble: { f: [230, 200], dur: 0.45, roll: 22, form: [[700, 1.5, 1]], gain: 0.1 },
    yowl: { f: [480, 900, 1050, 700], dur: 0.85, form: [[1000, 4, 1], [2800, 5, 0.7]], gain: 0.16 },
    chirp: { f: [700, 1000], dur: 0.12, form: [[1500, 3, 1]], gain: 0.1 }
  };
  var lastVoice = '';

  function catVoice(x, kind) {
    if (typeof kind !== 'string') {
      var opts = kind.filter(function (k) { return k !== lastVoice; });
      kind = opts[Math.floor(Math.random() * opts.length)];
    }
    lastVoice = kind;
    if (!live()) { return; }
    if (kind === 'chatter') { chatterSound(x); return; }
    if (kind === 'purr') { purrSound(x); return; }
    var v = CAT_VOICES[kind], t = AC.currentTime + 0.02, i;
    var dur = v.dur * (0.9 + Math.random() * 0.2), pitch = 0.92 + Math.random() * 0.16;
    var o = AC.createOscillator(), g = AC.createGain(), body = AC.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(v.f[0] * pitch, t);
    for (i = 1; i < v.f.length; i++) {
      o.frequency.exponentialRampToValueAtTime(v.f[i] * pitch, t + dur * i / (v.f.length - 1));
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v.gain, t + 0.04);
    g.gain.setValueAtTime(v.gain, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(body);
    var am = null;
    if (v.roll) {
      // The roll: switched on and off many times a second, inside the
      // envelope so it stops when the sound does.
      am = AC.createOscillator();
      var amg = AC.createGain();
      am.type = 'square';
      am.frequency.setValueAtTime(v.roll, t);
      amg.gain.setValueAtTime(0.4, t);
      body.gain.setValueAtTime(0.6, t);
      am.connect(amg);
      amg.connect(body.gain);
    }
    v.form.forEach(function (fm) {
      var bp = AC.createBiquadFilter(), lv = AC.createGain();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(fm[0] * pitch, t);
      bp.Q.setValueAtTime(fm[1], t);
      lv.gain.setValueAtTime(fm[2], t);
      body.connect(bp);
      bp.connect(lv);
      lv.connect(g);
    });
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + dur + 0.02);
    if (am) { am.start(t); am.stop(t + dur + 0.02); }
  }

  // Chattering at a fish it cannot reach: a quick run of little clicks.
  function chatterSound(x) {
    var n = 5 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) {
      var t = AC.currentTime + 0.05 + i * 0.075 + Math.random() * 0.012;
      var o = AC.createOscillator(), bp = AC.createBiquadFilter(), g = AC.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(950, t);
      o.frequency.exponentialRampToValueAtTime(700, t + 0.04);
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(2000, t);
      bp.Q.setValueAtTime(3, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(bp);
      bp.connect(g);
      out(g, x, fxBus);
      o.start(t);
      o.stop(t + 0.06);
    }
  }

  // A contented purr, while it sits: a soft rumble pulsing twenty-odd
  // times a second.
  function purrSound(x) {
    if (!noise) { return; }
    var t = AC.currentTime + 0.05, dur = 3 + Math.random() * 1.5;
    var src = AC.createBufferSource(), lp = AC.createBiquadFilter(), hp = AC.createBiquadFilter();
    var body = AC.createGain(), am = AC.createOscillator(), amg = AC.createGain(), g = AC.createGain();
    src.buffer = noise;
    src.loop = true;
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(700, t);
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(120, t);
    am.type = 'square';
    am.frequency.setValueAtTime(24, t);
    amg.gain.setValueAtTime(0.5, t);
    body.gain.setValueAtTime(0.5, t);
    am.connect(amg);
    amg.connect(body.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.5);
    g.gain.setValueAtTime(0.07, t + dur - 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(lp);
    lp.connect(hp);
    hp.connect(body);
    body.connect(g);
    out(g, x, fxBus);
    src.start(t, Math.random() * 2);
    src.stop(t + dur + 0.05);
    am.start(t);
    am.stop(t + dur + 0.05);
  }

  // A wet cat shaking itself: a fluttering rush of spray.
  function shakeSound(x) {
    if (!live() || !noise) { return; }
    var t = AC.currentTime + 0.02, dur = 1.1;
    var src = AC.createBufferSource(), bp = AC.createBiquadFilter(), body = AC.createGain();
    var am = AC.createOscillator(), amg = AC.createGain(), g = AC.createGain();
    src.buffer = noise;
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(2600, t);
    bp.Q.setValueAtTime(0.8, t);
    am.type = 'square';
    am.frequency.setValueAtTime(14, t);
    amg.gain.setValueAtTime(0.5, t);
    body.gain.setValueAtTime(0.5, t);
    am.connect(amg);
    amg.connect(body.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp);
    bp.connect(body);
    body.connect(g);
    out(g, x, fxBus);
    src.start(t, Math.random() * 1.5);
    src.stop(t + dur + 0.05);
    am.start(t);
    am.stop(t + dur + 0.05);
  }

  // A splash: a burst of the airy part of the noise, and a plop under it.
  function splashSound(x, k) {
    if (!live() || !noise) { return; }
    var t = AC.currentTime + 0.01, dur = 0.3 + 0.35 * k;
    var src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = noise;
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(1800, t);
    bp.frequency.exponentialRampToValueAtTime(700, t + dur);
    bp.Q.setValueAtTime(0.8, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22 * k + 0.05, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp);
    bp.connect(g);
    out(g, x, fxBus);
    src.start(t, Math.random() * 2);
    src.stop(t + dur + 0.05);
    plop(x);
  }

  function rainDrop(x) {
    if (!live()) { return; }
    var t = AC.currentTime + Math.random() * 0.05;
    var f = 1400 + Math.random() * 1600;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * 0.6, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.025);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.025, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.1);
  }

  var soundClock = 0;
  function updateSound(dt) {
    soundClock += dt;
    if (soundClock < 0.1 || !AC || !rainGain) { return; }
    soundClock = 0;
    rainGain.gain.setTargetAtTime(0.0001 + 0.05 * mood.rain, AC.currentTime, 0.5);
  }

  // ------------------------------------------------------------------
  // A turned screen keeps everything where it was, in proportion.
  // ------------------------------------------------------------------
  function rescaleWorld(o) {
    var sx = (PX1 - PX0) / Math.max(1, o.x1 - o.x0), sy = (PY1 - PY0) / Math.max(1, o.y1 - o.y0), k = U / o.u, i, j;
    function mx(x) { return PX0 + (x - o.x0) * sx; }
    function my(y) { return PY0 + (y - o.y0) * sy; }
    for (i = 0; i < fish.length; i++) {
      var f = fish[i];
      setSize(f);
      for (j = 0; j < N; j++) { f.px[j] = mx(f.px[j]); f.py[j] = my(f.py[j]); }
      keepIn(f.px[0], f.py[0], U * 0.015);
      f.px[0] = KX; f.py[0] = KY;
      for (j = 1; j < N; j++) {
        var bx = f.px[j] - f.px[j - 1], by = f.py[j] - f.py[j - 1], bd = Math.sqrt(bx * bx + by * by) || 1e-6;
        f.px[j] = f.px[j - 1] + bx / bd * f.seg;
        f.py[j] = f.py[j - 1] + by / bd * f.seg;
      }
      f.wx = mx(f.wx); f.wy = my(f.wy); f.rx = mx(f.rx); f.ry = my(f.ry); f.ex = mx(f.ex); f.ey = my(f.ey);
      f.v *= k;
      shapeFish(f);
    }
    for (i = 0; i < pellets.length; i++) {
      var p = pellets[i];
      p.x = mx(p.x); p.y = my(p.y); p.fx = mx(p.fx); p.fy = my(p.fy); p.r *= k; p.vx *= k; p.vy *= k;
    }
    for (i = 0; i < leaves.length; i++) {
      leaves[i].x = mx(leaves[i].x); leaves[i].y = my(leaves[i].y); leaves[i].size *= k;
    }
    lastFeed.x = mx(lastFeed.x); lastFeed.y = my(lastFeed.y);
    ripples = [];
    sparkles = [];
    drops = [];
    bubbles = [];
    // The visitors take a turned screen as their cue to go, and come back
    // to the new shape of pond later.
    for (i = 0; i < fish.length; i++) { if (fish[i].leap >= 0) { fish[i].leap = -1; fish[i].z = 0.3; } }
    if (catAround()) { cat.state = 'away'; cat.next = 20; cat.x = -999; cat.hx = -999; }
    if (dfly.state !== 'away') { dfly.state = 'away'; dfly.next = 15; dfly.x = -999; }
    for (var id in fingers) { if (fingers.hasOwnProperty(id)) { fingers[id].alive = false; } }
    fingers = {};
  }

  // ------------------------------------------------------------------
  // Fingers. A tap throws food. A finger left on the glass is a hand in
  // the water: it sends out a slow ripple now and then, the fish that
  // trust you come to it, and a finger drawn across the pond leaves a
  // wake that the tame ones follow.
  // ------------------------------------------------------------------
  function updateFingers(dt) {
    for (var id in fingers) {
      if (!fingers.hasOwnProperty(id)) { continue; }
      var g = fingers[id];
      g.held += dt;
      if (g.held > 0.35) {
        g.rip -= dt;
        if (g.rip <= 0) { addRipple(g.x, g.y, U * 0.06, 0.5); g.rip = 1.3; }
      }
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    var x = e.clientX, y = e.clientY;
    // A tap on the cat is a try at shooing it, not food.
    if (catHit(x, y)) { catTapped(x, y); return; }
    if (dragonflyHit(x, y)) { dragonflyStartle(x, y); return; }
    fingers[e.pointerId] = { x: x, y: y, held: 0, alive: true, rip: 0, trail: 0 };
    dragonflyStartle(x, y);
    scatter(x, y);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not every browser */ }
  });
  canvas.addEventListener('pointermove', function (e) {
    var g = fingers[e.pointerId];
    if (!g) { return; }
    var dx = e.clientX - g.x, dy = e.clientY - g.y;
    g.trail += Math.sqrt(dx * dx + dy * dy);
    g.x = e.clientX; g.y = e.clientY;
    if (g.trail > U * 0.035) {
      g.trail = 0;
      if (edgeDist(g.x, g.y) > 0) { addRipple(g.x, g.y, U * 0.035, 0.5); }
    }
  });
  function lift(e) {
    var g = fingers[e.pointerId];
    if (g) { g.alive = false; }
    delete fingers[e.pointerId];
  }
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  canvas.addEventListener('lostpointercapture', lift);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // A phone will not make a sound until a finger has asked for one, and
  // on some it has to be the lifting of the finger that asks.
  ['touchend', 'pointerup', 'click'].forEach(function (name) {
    document.addEventListener(name, initAudio, true);
  });

  document.addEventListener('visibilitychange', function () {
    if (!AC) { return; }
    if (document.hidden) { AC.suspend(); }
    else { AC.resume(); }
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 220);
  });

  // ------------------------------------------------------------------
  // Frame loop
  // ------------------------------------------------------------------
  var last = 0, sizeCheck = 0;

  function frame(now) {
    var dt = last ? (now - last) / 1000 : 0.016;
    last = now;
    dt = clamp(dt, 0.001, 0.05);
    // Some browsers report no size at all while the page first loads, and
    // do not always say when they find one. So every half second the pond
    // checks for itself whether the screen is the size it was dug for.
    sizeCheck += dt;
    if (sizeCheck > 0.5) {
      sizeCheck = 0;
      if (Math.abs(window.innerWidth - W) > 1 || Math.abs(window.innerHeight - H) > 1) {
        clearTimeout(resizeTimer);
        layout();
      }
    }
    var t0 = window.performance ? performance.now() : 0;
    update(dt);
    draw(dt);
    updateSound(dt);
    // If the device is struggling, the second layer of dancing light and
    // the cloud reflections are let go rather than the fish stuttering. A
    // single huge frame is the browser busy elsewhere, so it is left out.
    var work = window.performance ? performance.now() - t0 : 0;
    if (!lowPower && window.performance && !document.hidden && work < 60) {
      workSum += work;
      workFrames += 1;
      if (workFrames >= 120) {
        slowWindows = workSum / workFrames > 12 ? slowWindows + 1 : 0;
        if (slowWindows >= 2) { lowPower = true; }
        workSum = 0; workFrames = 0;
      }
    }
    requestAnimationFrame(frame);
  }
  var workSum = 0, workFrames = 0, slowWindows = 0;

  function update(dt) {
    var i;
    updateMood(dt);
    flowT += dt;
    lastFeed.age += dt;
    updateFingers(dt);
    updatePellets(dt);
    for (i = 0; i < fish.length; i++) {
      var f = fish[i];
      f.think -= dt;
      if (f.think <= 0) { f.think = 0.25; think(f); }
      steer(f, dt);
    }
    updateRipples(dt);
    updateBubbles(dt);
    stepWaves(dt);
    updatePads(dt);
    updateLeaves(dt);
    updateRain(dt);
    updateSparkles(dt);
    updateDrops(dt);
    leapCool -= dt;
    updateCat(dt);
    updateDragonfly(dt);
    updateFireflies(dt);
  }

  updateMood(0);
  layout();
  spawnFish();
  spawnLeaves();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
