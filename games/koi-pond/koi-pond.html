    if (Math.abs(f.z - pz) > (p.z < 0.05 ? 0.12 : 0.2)) { return; }
    eat(f, p);
  }

  function eat(f, p) {
    var top = p.z < 0.05, i;
    p.gone = true;
    f.target = null;
    f.dared = false;
    f.hold = 0;
    f.gulp = 0;
    addTrust(f, (top ? 0.065 : 0.045) * f.k.learn);
    gulpSound(p.x, top ? 1 : 0.35);
    if (top) { addRipple(p.x, p.y, U * 0.07, 1); }
    // The others learn from watching, the little one most of all, and it
    // is always watching from somewhere.
    for (i = 0; i < fish.length; i++) {
      var o = fish[i];
      if (o === f) { continue; }
      var ox = o.px[0] - p.x, oy = o.py[0] - p.y;
      if (ox * ox + oy * oy < U * U * 0.0625) { addTrust(o, 0.01 * o.k.learn); }
      if (o.k.shy) { addTrust(o, 0.002); }
    }
    if (f.k.shy && top && !f.firstTop) { f.firstTop = true; milestone(f); }
    // Still wary, or frightened, it takes its prize and dashes off.
    if (braveNow(f) < BRAVE) {
      var away = f.a + Math.PI + (Math.random() - 0.5) * 1.2, dist = U * (0.12 + 0.4 * (BRAVE - f.trust));
      if (f.k.shy) { keepIn(shyHome.x + (Math.random() - 0.5) * U * 0.08, shyHome.y + (Math.random() - 0.5) * U * 0.08, f.L); }
      else { keepIn(f.px[0] + Math.cos(away) * dist, f.py[0] + Math.sin(away) * dist, f.L); }
      f.rx = KX; f.ry = KY;
      f.retreat = 0.5 + (BRAVE - f.trust) * 2.5;
    }
  }

  // A tame fish at your fingertip, mouthing at it.
  function kiss(f) {
    f.gulp = 0;
    addRipple(f.qx[0], f.qy[0], U * 0.04, 0.7);
    kissSound(f.qx[0]);
    if (f.k.shy && !f.firstKiss) { f.firstKiss = true; milestone(f); }
  }

  // ------------------------------------------------------------------
  // Food. A tap throws a small handful, which lands a pellet at a time
  // around the spot. It floats only for a few seconds, so a fish that
  // wants it from the top, near the hand, has to come up quickly; a third
  // of it sinks almost at once. Whatever is not taken drifts down into
  // the deep and out of sight, and what sinks near the lily pads is all
  // the little one dares to eat at first.
  // ------------------------------------------------------------------
  var pellets = [], MAXP = 60;
  var flowT = Math.random() * 100, CX = 0, CY = 0;

  // A garden pond has no current to speak of: only the faintest breath of
  // air across the top, which a floating leaf shows over a minute or so
  // and a pellet hardly at all. A stronger one read as the water flowing.
  function current(x, y) {
    var k = reduced ? 0.5 : 1;
    CX = (-(y - PCY) * 0.0015 + Math.sin(y / U * 5 + flowT * 0.3) * U * 0.0008) * k;
    CY = ((x - PCX) * 0.0015 + Math.sin(x / U * 4.3 - flowT * 0.27) * U * 0.0008) * k;
  }

  // Floating things slide off lily pads rather than sitting on them.
  function offPads(o, gap) {
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i], dx = o.x - p.x, dy = o.y - p.y, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      var r = p.r + gap;
      if (d < r) { o.x = p.x + dx / d * r; o.y = p.y + dy / d * r; }
    }
  }

  function scatter(x, y) {
    keepIn(x, y, U * 0.07);
    x = KX; y = KY;
    // Thrown round the fingertip rather than under it, where it could not
    // be seen landing.
    var n = 5 + Math.floor(Math.random() * 2), i, a0 = Math.random() * TAU, FR = fingerR();
    for (i = 0; i < n; i++) {
      var a = a0 + (i + Math.random() * 0.7) / n * TAU, r = FR * 0.9 + Math.random() * U * 0.06;
      keepIn(x + Math.cos(a) * r, y + Math.sin(a) * r, U * 0.055);
      var air = 0.12 + i * 0.045 + Math.random() * 0.06;
      pellets.push({
        x: KX, y: KY, fx: x, fy: y, z: 0, vx: 0, vy: 0, air: air, airMax: air,
        age: 0, sinkAt: Math.random() < 0.3 ? 1.5 + Math.random() * 1.5 : 6 + Math.random() * 5,
        sinking: false, bottom: 0, fade: 1, r: U * (0.0048 + Math.random() * 0.0008),
        tone: Math.random(), gone: false
      });
    }
    // Too much in the pond: what has lain longest on the bottom goes
    // first, then the oldest of the rest.
    while (pellets.length > MAXP) {
      var oldest = 0;
      for (i = 1; i < pellets.length; i++) {
        var a1 = pellets[i], a0 = pellets[oldest];
        if ((a1.z >= 1) > (a0.z >= 1) || ((a1.z >= 1) === (a0.z >= 1) && a1.age > a0.age)) { oldest = i; }
      }
      pellets.splice(oldest, 1);
    }
    lastFeed.x = x; lastFeed.y = y; lastFeed.age = 0;
    // A fish that trusts you has learned what a hand over the water means.
    for (i = 0; i < fish.length; i++) {
      var f = fish[i];
      if (f.trust > 0.5 && f.mode !== 'food' && f.retreat <= 0) {
        f.excite = 1.5; f.ex = x; f.ey = y;
        if (f.mode !== 'finger') { f.mode = 'rush'; }
      }
    }
  }

  function land(p) {
    offPads(p, U * 0.01);
    addRipple(p.x, p.y, U * 0.045, 0.8);
    plip(p.x, p.tone);
  }

  function updatePellets(dt) {
    for (var i = pellets.length - 1; i >= 0; i--) {
      var p = pellets[i];
      if (p.gone) { pellets.splice(i, 1); continue; }
      if (p.air > 0) {
        p.air -= dt;
        if (p.air <= 0) { land(p); }
        continue;
      }
      p.age += dt;
      if (!p.sinking) {
        // It stays where it fell, give or take the faintest drift; the
        // waves only rock it, which is drawn, not moved.
        current(p.x, p.y);
        p.vx += (CX - p.vx) * Math.min(1, dt * 2);
        p.vy += (CY - p.vy) * Math.min(1, dt * 2);
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        offPads(p, U * 0.008);
        if (p.age > p.sinkAt) { p.sinking = true; }
      } else if (p.z < 1) {
        p.z = Math.min(1, p.z + dt * 0.08);
        p.x += p.vx * dt * (1 - p.z);
        p.y += p.vy * dt * (1 - p.z);
      } else {
        // It lies on the bottom a while and then softens away.
        p.bottom += dt;
        if (p.bottom > 25) { p.fade -= dt / 5; }
        if (p.fade <= 0) { p.gone = true; }
      }
      keepIn(p.x, p.y, U * 0.05);
      p.x = KX; p.y = KY;
    }
  }

  // ------------------------------------------------------------------
  // Ripples. Every pellet, every gulp, every finger in the water and
  // every raindrop sends one out. Each is two things at once: a fine,
  // sharp ring drawn on the surface, and a dimple pressed into the water
  // itself (see the waves below), which spreads, crosses other ripples
  // and comes back off the bank. A passing ring nudges a leaf or a pad a
  // little, but not the food, which stays where it fell.
  // ------------------------------------------------------------------
  var ripples = [];

  function addRipple(x, y, size, strength) {
    ripples.push({ x: x, y: y, r: 0, max: size, life: 0, dur: 0.8 + size / U * 10, a: strength });
    if (ripples.length > 90) { ripples.shift(); }
    poke(x, y, Math.max(WV.cs * 1.3, size * 0.15), strength * WAVE_POKE * (0.5 + size / (U * 0.06)));
  }

  function pushBy(o, rp, k, dt) {
    var dx = o.x - rp.x, dy = o.y - rp.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-6 || Math.abs(d - rp.r) > U * 0.012) { return; }
    var f = rp.a * (1 - rp.life / rp.dur) * U * k * dt;
    o.vx += dx / d * f;
    o.vy += dy / d * f;
  }

  function updateRipples(dt) {
    for (var i = ripples.length - 1; i >= 0; i--) {
      var rp = ripples[i];
      rp.life += dt;
      if (rp.life >= rp.dur) { ripples.splice(i, 1); continue; }
      var u = rp.life / rp.dur;
      rp.r = rp.max * (1 - (1 - u) * (1 - u));
      if (rp.a < 0.5) { continue; }
      var j;
      for (j = 0; j < leaves.length; j++) { pushBy(leaves[j], rp, 0.12, dt); }
      for (j = 0; j < pads.length; j++) { pushBy(pads[j], rp, 0.03, dt); }
    }
  }

  // Bubbles. Now and then a fish down in the deep lets out a breath of
  // them; they rise, glinting, and pop at the top in little rings, which
  // is sometimes the only sign there is a fish there at all.
  var bubbles = [];

  function bubbleUp(x, y, z) {
    var n = 1 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) {
      bubbles.push({ x: x + (Math.random() - 0.5) * U * 0.012, y: y + (Math.random() - 0.5) * U * 0.012, z: z, rise: 0.35 + Math.random() * 0.15 });
    }
  }

  function updateBubbles(dt) {
    for (var i = bubbles.length - 1; i >= 0; i--) {
      var b = bubbles[i];
      b.z -= b.rise * dt;
      if (b.z <= 0) {
        addRipple(b.x, b.y, U * 0.018, 0.5);
        bubbles.splice(i, 1);
      }
    }
  }

  function drawBubbles() {
    for (var i = 0; i < bubbles.length; i++) {
      var b = bubbles[i], s = seen(b.z), r = U * (0.002 + 0.002 * (1 - b.z));
      ctx.fillStyle = 'rgba(235,250,255,' + (0.15 + 0.6 * s).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, TAU);
      ctx.fill();
    }
  }

  // ------------------------------------------------------------------
  // Waves. The surface of the pond is a sheet of water simulated on a
  // coarse grid: each point is pulled level by its neighbours, overshoots
  // and swings back, which is all a ripple is. Anything that touches the
  // water presses a dimple into it and the rings spread from there by
  // themselves, cross one another, and come back off the bank. A fish
  // swimming just under the top drags a wake behind it the same way. The
  // lily pads lie flat on the water and calm it where they are.
  //
  // The sheet is drawn by its slopes, lit from the top left: water tilted
  // towards the light catches it, water tilted away is in shade. The grid
  // is far coarser than the screen and is smoothed when it is scaled up,
  // which is what keeps it cheap enough to run on a phone.
  // ------------------------------------------------------------------
  var WV = { cs: 4, gw: 0, gh: 0, a: null, b: null, damp: null, wet: null, can: null, g: null, img: null, acc: 0, padT: 0, wake: 0 };
  var WAVE_C2 = 0.1, WAVE_DAMP = 0.988, PAD_DAMP = 0.93, WAVE_GAIN = 0.45, WAVE_POKE = 1.1;

  function buildWaves() {
    var cs = Math.max(3, U / 110), i, j;
    WV.cs = cs;
    WV.gw = Math.ceil(W / cs) + 2;
    WV.gh = Math.ceil(H / cs) + 2;
    var n = WV.gw * WV.gh;
    WV.a = new Float32Array(n);
    WV.b = new Float32Array(n);
    WV.damp = new Float32Array(n);
    WV.wet = new Uint8Array(n);
    for (j = 1; j < WV.gh - 1; j++) {
      for (i = 1; i < WV.gw - 1; i++) {
        WV.wet[j * WV.gw + i] = edgeDist((i + 0.5) * cs, (j + 0.5) * cs) > -cs ? 1 : 0;
      }
    }
    WV.can = document.createElement('canvas');
    WV.can.width = WV.gw;
    WV.can.height = WV.gh;
    WV.g = WV.can.getContext('2d');
    WV.img = WV.g.createImageData(WV.gw, WV.gh);
    padDamp();
  }

  // Calm water under the pads, open water everywhere else.
  function padDamp() {
    if (!WV.damp) { return; }
    var cs = WV.cs, gw = WV.gw, gh = WV.gh, i, j, k;
    WV.damp.fill(WAVE_DAMP);
    for (k = 0; k < pads.length; k++) {
      var p = pads[k], r = p.r / cs, ci = p.x / cs, cj = p.y / cs;
      for (j = Math.max(1, Math.floor(cj - r)); j <= Math.min(gh - 2, Math.ceil(cj + r)); j++) {
        for (i = Math.max(1, Math.floor(ci - r)); i <= Math.min(gw - 2, Math.ceil(ci + r)); i++) {
          var dx = i + 0.5 - ci, dy = j + 0.5 - cj;
          if (dx * dx + dy * dy < r * r) { WV.damp[j * gw + i] = PAD_DAMP; }
        }
      }
    }
  }

  // Press a soft dimple into the water at x, y.
  function poke(x, y, r, amt) {
    if (!WV.a || amt === 0) { return; }
    var cs = WV.cs, gw = WV.gw, gh = WV.gh, ci = x / cs, cj = y / cs, rr = r / cs, R = Math.ceil(rr * 2), i, j;
    for (j = Math.max(1, Math.floor(cj - R)); j <= Math.min(gh - 2, Math.ceil(cj + R)); j++) {
      for (i = Math.max(1, Math.floor(ci - R)); i <= Math.min(gw - 2, Math.ceil(ci + R)); i++) {
        var k = j * gw + i;
        if (!WV.wet[k]) { continue; }
        var dx = i + 0.5 - ci, dy = j + 0.5 - cj;
        WV.a[k] -= amt * Math.exp(-(dx * dx + dy * dy) / (rr * rr));
      }
    }
  }

  // The slope of the water at a point, left in SX, SY, so floating
  // things can be drawn rocking on it.
  var SX = 0, SY = 0;
  function waveSlope(x, y) {
    SX = 0; SY = 0;
    if (!WV.a) { return; }
    var gw = WV.gw, i = Math.floor(x / WV.cs), j = Math.floor(y / WV.cs);
    if (i < 1 || j < 1 || i > gw - 2 || j > WV.gh - 2) { return; }
    var k = j * gw + i, a = WV.a;
    SX = a[k + 1] - a[k - 1];
    SY = a[k + gw] - a[k - gw];
  }

  function stepWaves(dt) {
    if (!WV.a || lowPower) { return; }
    WV.padT -= dt;
    if (WV.padT <= 0) { WV.padT = 1; padDamp(); }
    WV.acc += dt;
    var steps = 0;
    while (WV.acc >= 1 / 60 && steps < 3) { WV.acc -= 1 / 60; steps++; waveStep(); }
    if (steps === 3) { WV.acc = 0; }
  }

  function waveStep() {
    var a = WV.a, b = WV.b, gw = WV.gw, gh = WV.gh, damp = WV.damp, wet = WV.wet, c2 = WAVE_C2 * (reduced ? 0.6 : 1);
    for (var j = 1; j < gh - 1; j++) {
      var row = j * gw;
      for (var i = 1; i < gw - 1; i++) {
        var k = row + i;
        if (!wet[k]) { b[k] = 0; continue; }
        b[k] = (2 * a[k] - b[k] + c2 * (a[k - 1] + a[k + 1] + a[k - gw] + a[k + gw] - 4 * a[k])) * damp[k];
      }
    }
    WV.a = b;
    WV.b = a;
  }

  function drawWaves() {
    if (!WV.a || lowPower) { return; }
    var a = WV.a, d = WV.img.data, gw = WV.gw, gh = WV.gh, wet = WV.wet;
    var lit = 110 + 60 * clamp(mood.caus * 4, 0, 1) * (1 - mood.night * 0.6), gain = WAVE_GAIN;
    for (var j = 1; j < gh - 1; j++) {
      var row = j * gw;
      for (var i = 1; i < gw - 1; i++) {
        var k = row + i, p = k * 4;
        if (!wet[k]) { d[p + 3] = 0; continue; }
        // Facing the light (up and to the left) or turned away from it.
        var v = ((a[k + 1] - a[k - 1]) * 0.6 + (a[k + gw] - a[k - gw]) * 0.8) * gain;
        if (v > 0) {
          d[p] = 255; d[p + 1] = 255; d[p + 2] = 248;
          d[p + 3] = v > 1 ? lit : v * lit;
        } else {
          d[p] = 6; d[p + 1] = 24; d[p + 2] = 28;
          d[p + 3] = v < -1 ? 110 : -v * 110;
        }
      }
    }
    WV.g.putImageData(WV.img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(WV.can, 0, 0, gw, gh, 0, 0, gw * WV.cs, gh * WV.cs);
  }

  // ------------------------------------------------------------------
  // A few big fallen leaves afloat, turning slowly in the current. Far
  // bigger than a pellet and leaf-shaped, so nothing on the water can be
  // taken for food except food.
  // ------------------------------------------------------------------
  var leaves = [];

  function spawnLeaves() {
    leaves = [];
    var LEAF = [['#c8452c', '#8e2a1c'], ['#e2862e', '#a5541a'], ['#d8a933', '#9c7520'], ['#c86a2a', '#8a4318']];
    for (var i = 0; i < 4; i++) {
      keepIn(PX0 + Math.random() * (PX1 - PX0), PY0 + Math.random() * (PY1 - PY0), U * 0.06);
      leaves.push({
        x: KX, y: KY, vx: 0, vy: 0, rot: Math.random() * TAU, spin: (Math.random() - 0.5) * 0.3,
        size: U * (0.032 + Math.random() * 0.012), col: LEAF[i][0], vein: LEAF[i][1]
      });
    }
  }

  function updateLeaves(dt) {
    for (var i = 0; i < leaves.length; i++) {
      var p = leaves[i];
      current(p.x, p.y);
      p.vx += (CX - p.vx) * Math.min(1, dt * 0.6);
      p.vy += (CY - p.vy) * Math.min(1, dt * 0.6);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += (p.spin + (Math.abs(p.vx) + Math.abs(p.vy)) / U * 2) * dt * (reduced ? 0.4 : 1);
      offPads(p, p.size * 0.6);
      keepIn(p.x, p.y, p.size);
      p.x = KX; p.y = KY;
    }
  }

  // ------------------------------------------------------------------
  // Splashes: a leaping fish going out and coming back in, a cat's paw.
  // Droplets fly up and out, fall back, and each makes its own ring.
  // ------------------------------------------------------------------
  var drops = [];

  function splash(x, y, k) {
    var n = Math.round(8 + 12 * k);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU, s = U * (0.06 + Math.random() * 0.16) * k;
      drops.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, h: 0, vh: (0.5 + Math.random() * 0.9) * k });
    }
    addRipple(x, y, U * (0.06 + 0.1 * k), 1);
    addRipple(x, y, U * (0.03 + 0.05 * k), 0.8);
    splashSound(x, k);
  }

  function updateDrops(dt) {
    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.vh -= 3.2 * dt; d.h += d.vh * dt;
      if (d.h < 0) {
        if (edgeDist(d.x, d.y) > 0) { addRipple(d.x, d.y, U * 0.016, 0.4); }
        drops.splice(i, 1);
      }
    }
  }

  // Each pad is held by its stem: it drifts when pushed and comes back.
  // The pads ride the water. Each feels the height of the waves at four
  // points round its rim: it slides a little down the slope as a ripple
  // or a wake passes under it, turns a little if one side is lifted
  // further forward than the other, and rises and falls with the swell,
  // and its stem draws it gently back to where it grows.
  function updatePads(dt) {
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i], r = p.r * 1.05;
      var hE = waveHeight(p.x + r, p.y), hW = waveHeight(p.x - r, p.y);
      var hS = waveHeight(p.x, p.y + r), hN = waveHeight(p.x, p.y - r);
      // However big the splash, a pad is only ever nudged, not flung.
      var gx = clamp(hE - hW, -0.25, 0.25), gy = clamp(hS - hN, -0.25, 0.25);
      var k = U * 0.35 * (reduced ? 0.5 : 1);
      p.dx = p.x - p.ax; p.dy = p.y - p.ay;
      p.vx += (-p.dx * 0.8 - p.vx * 1.2 - gx * k) * dt;
      p.vy += (-p.dy * 0.8 - p.vy * 1.2 - gy * k) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.turn = (p.turn || 0) + ((gx - gy) * 0.6 - (p.turn || 0) * 2) * dt;
      p.rot += (p.spin + p.turn) * dt * (reduced ? 0.4 : 1);
      p.heave = (p.heave || 0) + (((hE + hW + hS + hN) * 0.25) - (p.heave || 0)) * Math.min(1, dt * 6);
      p.dip *= Math.exp(-dt * 3);
    }
  }

  // The height of the water at a point, from the wave sheet.
  function waveHeight(x, y) {
    if (!WV.a) { return 0; }
    var i = Math.floor(x / WV.cs), j = Math.floor(y / WV.cs);
    if (i < 1 || j < 1 || i > WV.gw - 2 || j > WV.gh - 2) { return 0; }
    return WV.a[j * WV.gw + i];
  }

  // ------------------------------------------------------------------
  // Rain, during the grey spell: drops all over the surface.
  // ------------------------------------------------------------------
  var rainAcc = 0;

  function updateRain(dt) {
    if (mood.rain < 0.02) { rainAcc = 0; return; }
    rainAcc += dt * 28 * mood.rain * (reduced ? 0.5 : 1);
    while (rainAcc >= 1) {
      rainAcc -= 1;
      var x = PX0 + Math.random() * (PX1 - PX0), y = PY0 + Math.random() * (PY1 - PY0);
      if (edgeDist(x, y) < U * 0.01) { continue; }
      addRipple(x, y, U * (0.014 + Math.random() * 0.02), 0.36);
      if (Math.random() < 0.3) { rainDrop(x); }
    }
  }

  // A glitter round the little one, the first time it eats from the top
  // and the first time it kisses your finger. The parent's cue to say so.
  var sparkles = [];

  function milestone(f) {
    var x = f.qx[0], y = f.qy[0];
    for (var i = 0; i < 10; i++) {
      var a = i / 10 * TAU + Math.random() * 0.4, r = U * (0.03 + Math.random() * 0.05);
      sparkles.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, life: 0, dur: 1.4 + Math.random() * 0.8, size: U * (0.008 + Math.random() * 0.008) });
    }
    addRipple(x, y, U * 0.12, 1);
    chime(x);
  }

  function updateSparkles(dt) {
    for (var i = sparkles.length - 1; i >= 0; i--) {
      sparkles[i].life += dt;
      if (sparkles[i].life > sparkles[i].dur) { sparkles.splice(i, 1); }
    }
  }

  // ------------------------------------------------------------------
  // Drawing. From the bottom up: the bed of the pond, the light on it,
  // the colour of the water, shadows, the fish from deepest to highest,
  // then everything on the surface, and the bank over the edge of it all.
  // ------------------------------------------------------------------
  var SUNX = 0.55, SUNY = 0.83, lowPower = false;
  var causT = Math.random() * 100, skyT = Math.random() * 100;
  var order = [];

  KINDS.forEach(function (k) {
    k.bodyC = hex(k.body);
    k.finC = hex(k.fin);
    k.netC = k.net ? hex(k.net) : null;
    (k.patches || []).forEach(function (p) { p[5] = hex(p[4]); });
  });

  // How wide a koi is along its length, seen from above: a blunt round
  // head, broad shoulders, and a long taper to the root of the tail.
  function girthAt(t) {
    if (t < 0.25) { return 0.6 + 0.4 * Math.sin(t / 0.25 * Math.PI / 2); }
    return 1 - Math.pow((t - 0.25) / 0.75, 1.5) * 0.8;
  }
  var GIRTH = [];
  for (var gi = 0; gi < N; gi++) { GIRTH.push(girthAt(gi / (N - 1))); }

  var LXa = new Float64Array(N), LYa = new Float64Array(N), RXa = new Float64Array(N), RYa = new Float64Array(N);

  // A point on the fish's own body, left in BX, BY, with BA the way the
  // body is pointing there.
  var BX = 0, BY = 0, BA = 0;
  function bodyAt(f, t, s) {
    var u = clamp(t, 0, 1) * (N - 1), i = Math.min(N - 2, Math.floor(u)), r = u - i;
    var x = f.qx[i] + (f.qx[i + 1] - f.qx[i]) * r, y = f.qy[i] + (f.qy[i + 1] - f.qy[i]) * r;
    var nx = f.nx[i] + (f.nx[i + 1] - f.nx[i]) * r, ny = f.ny[i] + (f.ny[i + 1] - f.ny[i]) * r;
    var w = f.half * girthAt(t) * s;
    BX = x + nx * w; BY = y + ny * w;
    BA = Math.atan2(f.qy[i] - f.qy[i + 1], f.qx[i] - f.qx[i + 1]);
  }

  function bodyPath(f) {
    var i, h = f.half;
    for (i = 0; i < N; i++) {
      var w = h * GIRTH[i];
      LXa[i] = f.qx[i] + f.nx[i] * w; LYa[i] = f.qy[i] + f.ny[i] * w;
      RXa[i] = f.qx[i] - f.nx[i] * w; RYa[i] = f.qy[i] - f.ny[i] * w;
    }
    var fx = f.qx[0] - f.qx[1], fy = f.qy[0] - f.qy[1], fl = Math.sqrt(fx * fx + fy * fy) || 1;
    fx /= fl; fy /= fl;
    f.tipX = f.qx[0] + fx * h * 0.5;
    f.tipY = f.qy[0] + fy * h * 0.5;
    ctx.moveTo(f.tipX, f.tipY);
    ctx.quadraticCurveTo(LXa[0] + fx * h * 0.4, LYa[0] + fy * h * 0.4, LXa[0], LYa[0]);
    for (i = 1; i < N - 1; i++) {
      ctx.quadraticCurveTo(LXa[i], LYa[i], (LXa[i] + LXa[i + 1]) / 2, (LYa[i] + LYa[i + 1]) / 2);
    }
    ctx.lineTo(LXa[N - 1], LYa[N - 1]);
    ctx.lineTo(RXa[N - 1], RYa[N - 1]);
    for (i = N - 2; i >= 1; i--) {
      ctx.quadraticCurveTo(RXa[i], RYa[i], (RXa[i] + RXa[i - 1]) / 2, (RYa[i] + RYa[i - 1]) / 2);
    }
    ctx.lineTo(RXa[0], RYa[0]);
    ctx.quadraticCurveTo(RXa[0] + fx * h * 0.4, RYa[0] + fy * h * 0.4, f.tipX, f.tipY);
    ctx.closePath();
  }

  // The tail fin, hung off the root of the tail on its spring (see
  // shapeFish). It bends along its length: the root turns a little, the
  // tips a lot, so it reads as a soft fin flowing rather than a paddle
  // being waved. The little one trails a longer, softer one.
  function tailPath(f) {
    var e = N - 1, bx = f.qx[e], by = f.qy[e], k = f.k;
    var len = f.L * (k.longFins ? 0.4 : 0.27), spread = k.longFins ? 0.5 : 0.42;
    var seg = Math.atan2(f.qy[e] - f.qy[e - 1], f.qx[e] - f.qx[e - 1]);
    var bend = f.tailA * (reduced ? 0.5 : 1);
    var root = seg + bend * 0.35, tip = seg + bend * (k.longFins ? 1.3 : 1);
    var w0 = f.half * 0.2, nx = -Math.sin(root), ny = Math.cos(root);
    ctx.moveTo(bx + nx * w0, by + ny * w0);
    ctx.quadraticCurveTo(bx + Math.cos(root + spread * 1.15) * len * 0.55, by + Math.sin(root + spread * 1.15) * len * 0.55,
      bx + Math.cos(tip + spread) * len, by + Math.sin(tip + spread) * len);
    ctx.quadraticCurveTo(bx + Math.cos(tip + spread * 0.35) * len * 0.8, by + Math.sin(tip + spread * 0.35) * len * 0.8,
      bx + Math.cos((root + tip) / 2) * len * 0.55, by + Math.sin((root + tip) / 2) * len * 0.55);
    ctx.quadraticCurveTo(bx + Math.cos(tip - spread * 0.35) * len * 0.8, by + Math.sin(tip - spread * 0.35) * len * 0.8,
      bx + Math.cos(tip - spread) * len, by + Math.sin(tip - spread) * len);
    ctx.quadraticCurveTo(bx + Math.cos(root - spread * 1.15) * len * 0.55, by + Math.sin(root - spread * 1.15) * len * 0.55,
      bx - nx * w0, by - ny * w0);
    ctx.closePath();
  }

  // A pair of fins at one place along the body. They spread wide while
  // the fish hangs still, sculling, and fold back along its sides when it
  // swims hard.
  function finPair(f, i, len, wid) {
    var fx = f.qx[i - 1] - f.qx[i + 1], fy = f.qy[i - 1] - f.qy[i + 1], fl = Math.sqrt(fx * fx + fy * fy) || 1;
    fx /= fl; fy /= fl;
    for (var side = -1; side <= 1; side += 2) {
      var w = f.half * GIRTH[i] * 0.8;
      var bx = f.qx[i] + f.nx[i] * w * side, by = f.qy[i] + f.ny[i] * w * side;
      var open = 0.25 + 0.5 * f.finOpen + (reduced ? 0 : Math.sin(f.flap + side * 0.7) * 0.18 * f.finOpen);
      var dx = f.nx[i] * side * open - fx * (1 - open), dy = f.ny[i] * side * open - fy * (1 - open);
      var dl = Math.sqrt(dx * dx + dy * dy) || 1;
      dx /= dl; dy /= dl;
      // A rounded paddle: out along its leading edge, round the end,
      // and back along the trailing edge to the body.
      var px = dy * side, py = -dx * side;
      if (px * fx + py * fy < 0) { px = -px; py = -py; }
      var ex = bx + dx * len, ey = by + dy * len;
      ctx.moveTo(bx + fx * len * 0.12, by + fy * len * 0.12);
      ctx.quadraticCurveTo(bx + dx * len * 0.55 + px * wid, by + dy * len * 0.55 + py * wid, ex + px * wid * 0.4, ey + py * wid * 0.4);
      ctx.quadraticCurveTo(ex + dx * wid * 0.5, ey + dy * wid * 0.5, ex - px * wid * 0.35, ey - py * wid * 0.35);
      ctx.quadraticCurveTo(bx + dx * len * 0.45 - px * wid * 0.5, by + dy * len * 0.45 - py * wid * 0.5, bx - fx * len * 0.15, by - fy * len * 0.15);
      ctx.closePath();
    }
  }

  function shadowStrength() { return clamp(0.45 + mood.caus * 2.4, 0.4, 1); }

  // How much of a fish can be seen through the water over it: all of it
  // at the top, a dim shape half way down, almost nothing near the
  // bottom. This is what makes one rising out of the deep an event.
  function seen(z) { return 1 - smooth(clamp((z - 0.08) / 0.62, 0, 1)); }

  function drawFishShadow(f) {
    var h = leapHeight(f), off = (1 - f.z) * U * 0.045 + U * 0.004 + h * U * 0.12;
    ctx.save();
    ctx.translate(SUNX * off, SUNY * off);
    ctx.fillStyle = 'rgba(8,24,22,' + ((0.08 + 0.12 * seen(f.z)) * (1 - 0.4 * h) * shadowStrength()).toFixed(3) + ')';
    ctx.beginPath();
    bodyPath(f);
    tailPath(f);
    ctx.fill();
    ctx.restore();
  }

  function drawFish(f) {
    var k = f.k, z = f.z, vis = seen(z), tint = 0.05 + 0.85 * (1 - vis), deep = mood.deep, i;
    var s = 1 + 0.1 * (1 - z) + 0.55 * leapHeight(f), cx = f.qx[4], cy = f.qy[4];
    ctx.save();
    ctx.globalAlpha = 0.22 + 0.78 * vis;
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.translate(-cx, -cy);

    // Fins, under the body, translucent.
    var finA = 0.72 - 0.3 * (1 - vis);
    ctx.fillStyle = rgba(mix(k.finC, deep, tint), finA);
    ctx.beginPath();
    tailPath(f);
    finPair(f, 2, f.L * (k.longFins ? 0.25 : 0.17), f.half * (k.longFins ? 0.75 : 0.62));
    finPair(f, 5, f.L * (k.longFins ? 0.13 : 0.09), f.half * 0.38);
    ctx.fill();

    // The body, with its colours laid on inside its outline.
    ctx.fillStyle = rgba(mix(k.bodyC, deep, tint));
    ctx.beginPath();
    bodyPath(f);
    ctx.fill();
    ctx.save();
    ctx.clip();
    if (k.patches) {
      // Each patch is a main blob with two smaller ones overlapping it
      // off-centre, so the colour comes out in ragged islands the way it
      // does on a real koi, not in polka dots.
      for (i = 0; i < k.patches.length; i++) {
        var p = k.patches[i];
        ctx.fillStyle = rgba(mix(p[5], deep, tint));
        ctx.beginPath();
        for (var b = 0; b < 3; b++) {
          var bt = p[0] + (b === 1 ? p[2] * 0.7 : b === 2 ? -p[2] * 0.55 : 0);
          var bs = p[1] + (b === 1 ? 0.3 : b === 2 ? -0.35 : 0);
          var bk2 = b ? (b === 1 ? 0.62 : 0.55) : 1;
          bodyAt(f, bt, bs);
          ctx.moveTo(BX + Math.cos(BA) * p[2] * f.body * bk2, BY + Math.sin(BA) * p[2] * f.body * bk2);
          ctx.ellipse(BX, BY, p[2] * f.body * bk2, p[3] * f.half * bk2, BA, 0, TAU);
        }
        ctx.fill();
      }
    }
    if (k.netC) {
      // The scales, each edged darker, in a net down the back.
      ctx.strokeStyle = rgba(mix(k.netC, deep, tint), k.metal ? 0.3 : 0.5);
      ctx.lineWidth = Math.max(0.6, f.half * 0.07);
      ctx.beginPath();
      var row = 0;
      for (var t = 0.18; t < 0.86; t += 0.075, row++) {
        for (var sc = -0.75 + (row % 2) * 0.15; sc <= 0.8; sc += 0.3) {
          bodyAt(f, t, sc);
          var r = f.half * 0.2;
          ctx.moveTo(BX + Math.cos(BA + Math.PI - 1.1) * r, BY + Math.sin(BA + Math.PI - 1.1) * r);
          ctx.arc(BX, BY, r, BA + Math.PI - 1.1, BA + Math.PI + 1.1);
        }
      }
      ctx.stroke();
    }
    // Light along the back and shade down the flanks give it roundness.
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,' + ((k.metal ? 0.3 : 0.13) * (1 - 0.6 * z)).toFixed(3) + ')';
    ctx.lineWidth = f.half * 0.75;
    ctx.beginPath();
    ctx.moveTo(f.qx[1], f.qy[1]);
    for (i = 2; i < 7; i++) { ctx.lineTo(f.qx[i], f.qy[i]); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(10,20,20,0.2)';
    ctx.lineWidth = f.half * 0.35;
    ctx.beginPath();
    bodyPath(f);
    ctx.stroke();
    ctx.restore();

    // The dorsal fin, a ridge down the middle of the back.
    ctx.strokeStyle = rgba(mix(k.finC, mix(deep, [20, 20, 20], 0.5), 0.35 + tint * 0.5), 0.35);
    ctx.lineWidth = Math.max(1, f.half * (k.longFins ? 0.32 : 0.22));
    ctx.beginPath();
    ctx.moveTo(f.qx[2], f.qy[2]);
    for (i = 3; i < 7; i++) { ctx.lineTo(f.qx[i], f.qy[i]); }
    ctx.stroke();

    // Eyes, set on either side of the head.
    var eye = rgba(mix([20, 22, 24], deep, tint * 0.6));
    for (var e = -1; e <= 1; e += 2) {
      bodyAt(f, 0.13, 0.7 * e);
      ctx.fillStyle = eye;
      ctx.beginPath();
      ctx.arc(BX, BY, Math.max(1, f.half * 0.14), 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * (1 - z)).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(BX + f.half * 0.04, BY - f.half * 0.04, Math.max(0.5, f.half * 0.06), 0, TAU);
      ctx.fill();
    }

    // The mouth opens round as it gulps.
    if (f.gulp >= 0) {
      var o = Math.sin(Math.PI * clamp(f.gulp / 0.4, 0, 1));
      ctx.fillStyle = rgba(mix(k.bodyC, [255, 210, 200], 0.4));
      ctx.beginPath();
      ctx.arc(f.tipX, f.tipY, f.half * 0.42 * o, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(40,20,25,0.85)';
      ctx.beginPath();
      ctx.arc(f.tipX, f.tipY, f.half * 0.27 * o, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function pelletAirPos(p) {
    var u = 1 - clamp(p.air / p.airMax, 0, 1);
    return { x: lerp(p.fx, p.x, u), y: lerp(p.fy, p.y, u), h: Math.sin(Math.PI * u) * 0.5 + (1 - u) * 0.6 };
  }

  function drawPellet(x, y, r, col, a) {
    ctx.fillStyle = rgba(col, a);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,225,170,' + (a * 0.6).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.4, 0, TAU);
    ctx.fill();
  }

  var PELLET = hex('#7e4521');

  function drawShadows() {
    var k = shadowStrength(), i, off = U * 0.045;
    ctx.fillStyle = 'rgba(8,24,22,' + (0.26 * k).toFixed(3) + ')';
    ctx.beginPath();
    for (i = 0; i < pads.length; i++) {
      var p = pads[i];
      ctx.moveTo(p.x + SUNX * off + p.r, p.y + SUNY * off);
      ctx.arc(p.x + SUNX * off, p.y + SUNY * off, p.r, 0, TAU);
    }
    for (i = 0; i < pellets.length; i++) {
      var q = pellets[i];
      if (q.sinking || q.gone) { continue; }
      var x = q.x, y = q.y, h = 0;
      if (q.air > 0) { var a = pelletAirPos(q); x = a.x; y = a.y; h = a.h; }
      var o2 = off * (1 + h * 3);
      ctx.moveTo(x + SUNX * o2 + q.r, y + SUNY * o2);
      ctx.arc(x + SUNX * o2, y + SUNY * o2, q.r, 0, TAU);
    }
    ctx.fill();
    for (i = 0; i < fish.length; i++) { drawFishShadow(fish[i]); }
  }

  function drawWater(dt) {
    ctx.drawImage(bottomCanvas, 0, 0, W, H);
    causT += dt * (reduced ? 0.25 : 1);
    if (mood.caus > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      causticLayer(patA, U * 0.34, causT * U * 0.012, causT * U * 0.007, mood.caus * 0.9);
      if (!lowPower) { causticLayer(patB, U * 0.47, -causT * U * 0.009, causT * U * 0.011, mood.caus * 0.7); }
      ctx.restore();
    }
    // The colour of the water itself: deep in the middle, clear in the
    // shallows, so the bottom fades from sight towards the centre.
    var g = ctx.createRadialGradient(PCX, PCY, 0, PCX, PCY, Math.max(PX1 - PX0, PY1 - PY0) * 0.6);
    g.addColorStop(0, rgba(mood.deep, 0.92));
    g.addColorStop(0.5, rgba(mix(mood.deep, mood.shallow, 0.35), 0.78));
    g.addColorStop(1, rgba(mood.shallow, 0.48));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function causticLayer(pat, tile, ox, oy, a) {
    var sc = tile / 192;
    ctx.globalAlpha = a;
    ctx.save();
    ctx.translate(ox % tile, oy % tile);
    ctx.scale(sc, sc);
    ctx.fillStyle = pat;
    ctx.fillRect(-tile / sc, -tile / sc, (W + tile * 2) / sc, (H + tile * 2) / sc);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // The sky on the surface: a sheen across it and the reflections of
  // clouds going slowly over.
  var CLOUDS = [
    { x: 0.1, y: 0.3, w: 0.5, h: 0.18, v: 0.006 },
    { x: 0.6, y: 0.7, w: 0.6, h: 0.2, v: 0.004 },
    { x: 0.9, y: 0.15, w: 0.4, h: 0.14, v: 0.005 }
  ];

  function drawSky(dt) {
    var g = ctx.createLinearGradient(PX0, PY0, PX1, PY1);
    g.addColorStop(0, rgba(mood.sky, mood.skyA * 1.4));
    g.addColorStop(0.45, rgba(mood.sky, 0));
    g.addColorStop(1, rgba(mood.sky, mood.skyA * 0.6));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < (lowPower ? 0 : CLOUDS.length); i++) {
      var c = CLOUDS[i];
      c.x += c.v * dt * (reduced ? 0.3 : 1);
      if (c.x - c.w > 1.1) { c.x = -c.w; }
      var cx = PX0 + c.x * (PX1 - PX0), cy = PY0 + (c.y + c.x * 0.3) % 1 * (PY1 - PY0);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(0.3);
      ctx.scale(c.w * U, c.h * U);
      var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      cg.addColorStop(0, rgba(mood.sky, mood.skyA * 0.9));
      cg.addColorStop(1, rgba(mood.sky, 0));
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  // The fine rings on top of the waves. Each crest catches the light on
  // the side facing it, up and to the left, and is shaded on the far
  // side, so a ring looks raised rather than drawn on. A bigger ripple is
  // a little train of rings, each fainter than the one before, and every
  // ring thins and fades as it spreads, the way its energy does.
  var LIT = -Math.PI * 0.75;
  function drawRipples() {
    var base = Math.max(0.8, U * 0.0026);
    for (var i = 0; i < ripples.length; i++) {
      var rp = ripples[i], u = rp.life / rp.dur, a = rp.a * Math.pow(1 - u, 1.4);
      if (rp.r < 1 || a < 0.01) { continue; }
      var trains = rp.max > U * 0.04 ? 3 : 1, gap = Math.max(base * 3, rp.max * 0.16);
      for (var n = 0; n < trains; n++) {
        var r = rp.r - n * gap;
        if (r < base * 2) { break; }
        var k = a * (1 - n * 0.3), lw = base * (1.2 - 0.5 * u);
        ctx.lineWidth = lw;
        ctx.strokeStyle = 'rgba(255,255,250,' + (k * 0.6).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, r, LIT - 1.9, LIT + 1.9);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,250,' + (k * 0.2).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, r, LIT + 1.9, LIT + TAU - 1.9);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(6,24,28,' + (k * 0.3).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, r - lw * 1.4, LIT + Math.PI - 1.6, LIT + Math.PI + 1.6);
        ctx.stroke();
      }
    }
  }

  function drawLeaf(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    var s = p.size, j;
    // A maple leaf: five pointed lobes, the middle one longest, with
    // deep notches between them, a stem and a vein to every point.
    var LOBE = [[0, 1], [0.95, 0.82], [-0.95, 0.82], [1.9, 0.52], [-1.9, 0.52]];
    function leafPath(ox, oy) {
      var order = [4, 2, 0, 1, 3], first = true;
      ctx.beginPath();
      for (var n = 0; n < order.length; n++) {
        var lb = LOBE[order[n]], a = lb[0], L = lb[1] * s;
        var pts = [[a - 0.36, L * 0.55], [a - 0.17, L * 0.68], [a, L], [a + 0.17, L * 0.68], [a + 0.36, L * 0.55]];
        for (var m = 0; m < pts.length; m++) {
          var x = ox + Math.cos(pts[m][0]) * pts[m][1], y = oy + Math.sin(pts[m][0]) * pts[m][1];
          if (first) { ctx.moveTo(x, y); first = false; } else { ctx.lineTo(x, y); }
        }
        if (n < order.length - 1) {
          var na = (a + LOBE[order[n + 1]][0]) / 2;
          ctx.lineTo(ox + Math.cos(na) * s * 0.3, oy + Math.sin(na) * s * 0.3);
        }
      }
      ctx.lineTo(ox + Math.cos(Math.PI) * s * 0.18, oy);
      ctx.closePath();
    }
    ctx.fillStyle = 'rgba(8,24,22,' + (0.2 * shadowStrength()).toFixed(3) + ')';
    leafPath(s * 0.35, s * 0.5);
    ctx.fill();
    ctx.fillStyle = p.col;
    leafPath(0, 0);
    ctx.fill();
    ctx.strokeStyle = p.vein;
    ctx.lineWidth = Math.max(0.8, s * 0.05);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (j = 0; j < LOBE.length; j++) {

    ctx.lineTo(-s * 0.6, 0);
    ctx.stroke();
    ctx.restore();

    g.addColorStop(1, p.hue < 0.5 ? '#4d7a33' : '#4a7838');

    ctx.moveTo(0, 0);

    ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(40,70,30,0.35)';

  function drawFlower(p, t) {

    ctx.fill();

    ctx.arc(0, 0, s * 0.2, 0, TAU);
    ctx.fill();

      ctx.fill();
    }
    ctx.restore();
  }

  function drawFingers() {

      if (!fingers.hasOwnProperty(id)) { continue; }

      // covers. Fish come to its rim and no further, so they are always
      // in sight round the finger rather than hidden under it.

      rg.addColorStop(1, 'rgba(255,255,255,' + (0.2 * a).toFixed(3) + ')');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(g.x, g.y, r, 0, TAU);
      ctx.fill();

  }

      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y + r);

      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y - r);

  var drawClock = 0;

  function draw(dt) {

    var i, p;

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawWater(dt);
    drawShadows();

    // What has sunk, faded by the depth of water over it.
    for (i = 0; i < pellets.length; i++) {
      p = pellets[i];
      if (!p.sinking || p.gone) { continue; }
      drawPellet(p.x, p.y, p.r * (1 - 0.25 * p.z), mix(PELLET, mood.deep, 0.25 + 0.6 * p.z), p.fade * (1 - 0.6 * p.z));
    }

    if (order.length !== fish.length) { order = fish.slice(); }
    order.sort(function (a, b) { return b.z - a.z; });
    for (i = 0; i < order.length; i++) { if (order[i].leap < 0) { drawFish(order[i]); } }
    drawBubbles();

    drawSky(dt);
    drawMoon();
    drawWaves();
    drawRipples();

    for (i = 0; i < pellets.length; i++) {
      p = pellets[i];
      if (p.sinking || p.gone) { continue; }
      if (p.air > 0) {
        var a = pelletAirPos(p);
        drawPellet(a.x, a.y, p.r * (1 + a.h * 0.8), PELLET, 1);
      } else {
        waveSlope(p.x, p.y);
        drawPellet(p.x + SX * U * 0.002, p.y + SY * U * 0.002, p.r, PELLET, 1);
      }
    }
    for (i = 0; i < leaves.length; i++) { drawLeaf(leaves[i]); }
    for (i = 0; i < pads.length; i++) { drawPad(pads[i]); }
    for (i = 0; i < pads.length; i++) { if (pads[i].flower) { drawFlower(pads[i], drawClock); } }

    for (i = 0; i < fish.length; i++) { if (fish[i].leap >= 0) { drawFish(fish[i]); } }

    drawFingers();
    drawSparkles();
    ctx.drawImage(bankCanvas, 0, 0, W, H);
    drawCat();
    drawDragonfly();
    if (mood.gradeA > 0.002) {
      ctx.fillStyle = rgba(mood.grade, mood.gradeA);
      ctx.fillRect(0, 0, W, H);
    }

  }

  function drawDrops() {
    var r = Math.max(1, U * 0.0035), i, d, o;
    ctx.fillStyle = 'rgba(8,24,22,0.18)';
    ctx.beginPath();
    for (i = 0; i < drops.length; i++) {

    }

  }

  function drawMoon() {

    var x = PX0 + (PX1 - PX0) * (0.5 + 0.22 * Math.sin(drawClock * 0.012)), y = PY0 + (PY1 - PY0) * 0.3, r = U * 0.05;

    g.addColorStop(0.3, 'rgba(255,250,225,' + (0.18 * mood.night).toFixed(3) + ')');

    ctx.beginPath();
    ctx.arc(x, y, r * 3, 0, TAU);
    ctx.fill();
  }

  // ------------------------------------------------------------------
  // The cat. Away most of the time; then it comes through the hedge onto
  // the bank and walks along the edge of the pond. Sometimes it sits and
  // watches the water, sometimes it crouches with its tail twitching, and
  // now and then it dabs a paw in. It never catches anything.
  //
  // The fish feel it. Near its side of the pond they go deep and keep
  // away, the little one hides under the pads, and the wary ones will not
  // take food near it. When it goes, they come back in their own time.

  // tap that is ignored makes the next more likely to work.
  // ------------------------------------------------------------------

    for (i = 0; i < n; i++) {

      rimPts.push(edgePts[2 * i] - NX * off, edgePts[2 * i + 1] - NY * off);
    }
    for (i = 0; i < n; i++) {

      var j = (i + 1) % n;
      acc += Math.sqrt(Math.pow(rimPts[2 * j] - rimPts[2 * i], 2) + Math.pow(rimPts[2 * j + 1] - rimPts[2 * i + 1], 2));
    }

    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (rimS[mid] <= s) { lo = mid; } else { hi = mid - 1; } }
    var j = (lo + 1) % n, seg = (j ? rimS[j] : rimLen) - rimS[lo] || 1, u = (s - rimS[lo]) / seg;
    var ax = rimPts[2 * lo], ay = rimPts[2 * lo + 1], bx = rimPts[2 * j], by = rimPts[2 * j + 1];
    RX = ax + (bx - ax) * u; RY = ay + (by - ay) * u;
    RA = Math.atan2(by - ay, bx - ax);
    edgeNormal(RX, RY);
    RW = Math.atan2(NY, NX);
  }

  var cat = {
    state: 'away', next: 30 + Math.random() * 25, t: 0, s: 0, dir: 1, run: 0,
    x: -999, y: -999, a: 0, aim: 0, head: 0, hx: -999, hy: -999, lookX: 0, lookY: 0,
    sx: 0, sy: 0, ex: 0, ey: 0, stride: 0, moving: 0, sit: 0, crouch: 0, flat: 0,
    dab: -1, dabbed: false, visit: 0, tail: 0, flick: 0, taps: 0, tapAt: -9, clock: 0,
    goalS: 0, fu: 0, fdur: 1, fh: 0, tumble: 0, pounced: false, wet: 0, shakeP: 0, rip: 0, dripT: 0
  };

  function catLen() { return U * 0.18; }

  function catAround() { return cat.state !== 'away'; }

  function catInWater() {
    var s = cat.state;
    return s === 'pounce' || s === 'fall' || s === 'swim' || s === 'climb';
  }

  // How frightening the cat is at a point: nothing when it is away, most
  // right in front of its face, more while it is crouching to pounce, and
  // most of all when it is actually in the pond.
  function catThreatAt(x, y) {
    if (!catAround()) { return 0; }
    var s = cat.state, wetNow = catInWater();

    var R = U * (wetNow ? 0.42 : 0.32 + 0.12 * cat.crouch);
    var dx = x - cat.hx, dy = y - cat.hy, d = Math.sqrt(dx * dx + dy * dy);

  }

  // The most visible fish near the cat, which is what it watches.
  function catQuarry() {
    var best = null, bd = U * 0.45;
    for (var i = 0; i < fish.length; i++) {
      var f = fish[i];
      if (seen(f.z) < 0.3) { continue; }
      var d = Math.sqrt(Math.pow(f.qx[2] - cat.hx, 2) + Math.pow(f.qy[2] - cat.hy, 2));

    }

  }

  function catGo(state, t) { cat.state = state; cat.t = t || 0; }

  function catArrive() {

    rimAt(cat.s);
    cat.ex = RX; cat.ey = RY;
    var out = CL_OUT();
    cat.x = RX - Math.cos(RW) * out; cat.y = RY - Math.sin(RW) * out;
    cat.a = RW;
    cat.dir = Math.random() < 0.5 ? 1 : -1;
    cat.visit = 25 + Math.random() * 25;
    cat.taps = 0;
    cat.pounced = false;
    catGo('enter');
  }

  function CL_OUT() { return BANK * 0.6 + catLen() * 1.4; }

  function catLeave(run) {
    rimAt(cat.s);
    var out = CL_OUT();
    cat.ex = RX - Math.cos(RW) * out; cat.ey = RY - Math.sin(RW) * out;
    cat.run = run ? 1 : 0;
    catGo(run ? 'shoo' : 'leave');
  }

  // What to do next while on the bank.
  function catNext() {
    if (cat.visit <= 0 || mood.rain > 0.2) { catLeave(false); return; }
    var r = Math.random(), q = catQuarry();
    if (q && r < 0.45) {
      catGo('stalk', 3 + Math.random() * 3);
      // Real cats chatter their teeth at prey they cannot reach.
      if (Math.random() < 0.5) { catVoice(cat.x, 'chatter'); }
    } else if (r < 0.75) {
      catGo('sit', 4 + Math.random() * 5);
      if (Math.random() < 0.2) { catVoice(cat.x, 'purr'); }
    } else {
      if (Math.random() < 0.35) { cat.dir = -cat.dir; }
      catGo('patrol', 3 + Math.random() * 4);
    }
  }

  // A tap on the cat does one of three things. Seldom, it shoos it: off

  // it slips and falls in the pond. Otherwise it is either put out and
  // stalks off to another part of the bank, grumbling, or it simply looks
  // round at you, flicks its tail, says something, and stays put. Each
  // tap makes the next likelier to shoo it.

    cat.taps += 1;
    cat.tapAt = cat.clock;

    if (Math.random() < Math.min(0.7, 0.12 + 0.12 * (cat.taps - 1))) {
      cat.flat = 1;
      if (onRim && Math.random() < 0.15) { catFallIn(); return; }
      catVoice(cat.x, ['meow', 'mewHigh', 'mrow']);
      catLeave(true);
    } else if (onRim && cat.state !== 'move' && Math.random() < 0.45) {
      cat.flat = 0.6;
      cat.lookX = x; cat.lookY = y;
      catVoice(cat.x, ['mrow', 'grumble']);
      cat.goalS = cat.s + (Math.random() < 0.5 ? 1 : -1) * rimLen * (0.2 + Math.random() * 0.25);
      catGo('move');
    } else {
      cat.lookX = x; cat.lookY = y;
      cat.flick = 1;
      catVoice(cat.x, ['mrrp', 'trill', 'mewQ']);
      if (cat.state === 'patrol' || cat.state === 'stalk') { catGo('sit', 3 + Math.random() * 3); }
    }
  }

      }
    }
  }

  // Rarely, from a stalk, the cat launches itself into the pond after the
  // fish it has been watching. It lands with a great splash a little way
  // out, and by then every fish is long gone.
  function catPounce(q) {
    var c = cat;
    c.pounced = true;
    c.fsx = c.x; c.fsy = c.y;
    keepIn(q.qx[2], q.qy[2], U * 0.08);

  // Shooed in too much of a hurry: it scrabbles, slips, and tumbles in
  // just off the bank.
  function catFallIn() {
    var c = cat;
    rimAt(c.s);
    c.fsx = c.x; c.fsy = c.y;
    c.fex = RX + Math.cos(RW) * (BANK * 0.4 + U * 0.06);
    c.fey = RY + Math.sin(RW) * (BANK * 0.4 + U * 0.06);
    c.fdur = 0.45; c.fu = 0; c.tumble = (Math.random() < 0.5 ? 1 : -1) * 8; c.run = 1;

    c.flat = Math.max(0, c.flat - dt * 0.5);

    if (c.state === 'away') {

        else {

      goal = Math.atan2(sy2, sx2);
      if (Math.abs(wrapAngle(goal - c.a)) < 1.4) {
        var sw = Math.min(sd, U * 0.07 * dt);
        c.x += sx2 / sd * sw; c.y += sy2 / sd * sw;
      }
      moving = 1.3;
      c.rip -= dt;
      if (c.rip <= 0) { c.rip = 0.32; addRipple(c.x + Math.cos(c.a) * CL * 0.3, c.y + Math.sin(c.a) * CL * 0.3, U * 0.05, 0.6); }
      poke(c.x, c.y, CL * 0.2, 0.25 * dt * 60);
      if (sd < U * 0.015 || c.t <= 0) { c.fsx = c.x; c.fsy = c.y; catGo('climb', 0.6); }
    } else if (c.state === 'climb') {
      // Scrambling out onto the bank.
      rimAt(c.s);
      var cu = clamp(1 - c.t / 0.6, 0, 1);
      c.x = lerp(c.fsx, RX, cu); c.y = lerp(c.fsy, RY, cu);
      goal = Math.atan2(RY - c.fsy, RX - c.fsx);
      moving = 2;
      if (c.t <= 0) { c.shakeP = 0; catGo('shake', 1.4); shakeSound(c.x); }
    } else if (c.state === 'shake') {
      // A good shake, drops flying everywhere, then off, damp and cross.
      rimAt(c.s);
      c.x = RX; c.y = RY;
      c.shakeP += dt * TAU * 8;
      c.dripT -= dt;
      if (c.dripT <= 0 && !reduced) {
        c.dripT = 0.05;
        var da = Math.random() * TAU, sp = U * (0.1 + Math.random() * 0.25);
        drops.push({ x: c.x, y: c.y, vx: Math.cos(da) * sp, vy: Math.sin(da) * sp, h: 0.2, vh: 0.4 + Math.random() * 0.6 });
      }
      if (c.t <= 0) {
        if (c.run) { catLeave(true); }
        else { catVoice(c.x, 'grumble'); catLeave(false); }
      }
    } else {
      // Sitting, stalking or dabbing: it turns to face the water, or
      // whatever it is watching in it.
      rimAt(c.s);
      c.x = RX; c.y = RY;
      var q = catQuarry();
      if (q) { c.lookX = q.qx[0]; c.lookY = q.qy[0]; }
      else if (c.flick <= 0) { c.lookX = c.x + Math.cos(RW) * U * 0.3; c.lookY = c.y + Math.sin(RW) * U * 0.3; }
      goal = RW + clamp(wrapAngle(Math.atan2(c.lookY - c.y, c.lookX - c.x) - RW), -0.7, 0.7);
      if (c.state === 'sit') {
        sitW = 1;
        if (c.t <= 0) { catNext(); }
      } else if (c.state === 'stalk') {
        crouchW = 1;
        if (c.t <= 0) {
          var prey = catQuarry();
          if (prey && !c.pounced && !reduced && Math.random() < 0.2) { catPounce(prey); }
          else if (Math.random() < 0.55) { c.dab = 0; c.dabbed = false; catGo('dab', 0.9); }
          else { catNext(); }
        }
      } else if (c.state === 'dab') {
        crouchW = 1;
        c.dab = clamp(1 - c.t / 0.9, 0, 1);
        if (!c.dabbed && c.dab > 0.4) {
          // The paw goes in. Everything near it bolts.
          c.dabbed = true;
          var px = c.x + Math.cos(c.a) * CL * 0.85, py = c.y + Math.sin(c.a) * CL * 0.85;
          splash(px, py, 0.35);
          scareFish(px, py, U * 0.3);
        }
        if (c.t <= 0) { c.dab = -1; catGo('sit', 2 + Math.random() * 3); }
      }
    }
    c.a += clamp(wrapAngle(goal - c.a), -3 * dt, 3 * dt);
    c.moving += (moving - c.moving) * Math.min(1, dt * 6);
    c.sit += (sitW - c.sit) * Math.min(1, dt * 3);
    c.crouch += (crouchW - c.crouch) * Math.min(1, dt * 3);
    c.stride += dt * TAU * 1.6 * c.moving * (reduced ? 0.6 : 1);
    c.tail += dt * (c.crouch > 0.5 ? 9 : 1.6) * (reduced ? 0.4 : 1);
    // Its head turns towards what it is looking at, within reason.
    var going = c.state !== 'sit' && c.state !== 'stalk' && c.state !== 'dab';
    var want = going ? (c.flick > 0 ? Math.atan2(c.lookY - c.y, c.lookX - c.x) : c.a) : Math.atan2(c.lookY - c.y, c.lookX - c.x);
    var hd = clamp(wrapAngle(want - c.a), -1, 1);
    c.head += (hd - c.head) * Math.min(1, dt * 4);
    var reach = CL * (0.42 + 0.08 * c.crouch);
    c.hx = c.x + Math.cos(c.a) * reach;
    c.hy = c.y + Math.sin(c.a) * reach;
  }

  function drawCat() {
    var c = cat;
    if (c.state === 'away') { return; }
    var CL = catLen(), sit = c.sit, cr = c.crouch, i, e;
    var flat = Math.max(c.flat, c.state === 'shoo' || c.wet > 0.3 ? 1 : 0);
    // A wet cat is darker, and a soaked one flat-eared and sorry for itself.
    var GINGER = rgba(mix(hex('#e09b55'), [70, 45, 25], c.wet * 0.4));
    var STRIPE = rgba(mix(hex('#b4662c'), [50, 30, 15], c.wet * 0.4));
    var CREAM = rgba(mix(hex('#f6e2c2'), [120, 100, 80], c.wet * 0.4));
    if (c.state === 'swim') { drawCatSwimming(c, CL, GINGER, STRIPE, CREAM); return; }
    var lift = 1 + 0.35 * (c.fh || 0);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.a);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Shadow, thrown out across the water while it is in the air.
    var so = (c.fh || 0) * U * 0.1;
    ctx.fillStyle = 'rgba(15,25,12,' + (0.25 * shadowStrength()).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(-CL * 0.02 + CL * 0.06 + so, CL * 0.08 + so * 0.5, CL * (0.42 - 0.1 * sit), CL * (0.18 + 0.06 * sit), 0, 0, TAU);
    ctx.fill();
    ctx.scale(lift, lift);
    if (c.state === 'shake') { ctx.rotate(Math.sin(c.shakeP) * 0.22 * clamp(c.t / 1.4, 0, 1)); }

    // The tail: a soft curve behind it as it walks, wrapped round its
    // feet when it sits, and held low and straight with the tip
    // twitching while it stalks.
    var tx = -CL * (0.42 - 0.12 * sit), ty = 0, ta = Math.PI, seg = CL * 0.11;
    ctx.strokeStyle = GINGER;
    ctx.lineWidth = CL * (0.075 + 0.03 * flat);
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    for (i = 0; i < 8; i++) {
      var u = i / 7;
      var walkB = Math.sin(c.tail * 2 - i * 0.6) * 0.16 * (reduced ? 0.4 : 1);
      var sitB = 0.42 + (u > 0.75 ? Math.sin(c.tail * 3) * 0.3 * c.flick : 0);
      var crB = u > 0.7 ? Math.sin(c.tail * 2.2 + i) * 0.45 * (reduced ? 0.3 : 1) : 0;
      ta += lerp(lerp(walkB, sitB, sit), crB, cr) + (u > 0.7 ? Math.sin(c.clock * 9) * 0.5 * c.flick : 0);
      tx += Math.cos(ta) * seg; ty += Math.sin(ta) * seg;
      ctx.lineTo(tx, ty);
    }
    ctx.stroke();
    ctx.strokeStyle = STRIPE;
    ctx.lineWidth = CL * 0.075;
    ctx.setLineDash([CL * 0.03, CL * 0.07]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Paws: stepping in diagonal pairs as it walks, tucked as it sits.
    var st = Math.sin(c.stride) * CL * 0.09 * c.moving / Math.max(1, c.moving);
    ctx.fillStyle = GINGER;
    var PAWS = [[0.24, 0.12, 1], [0.24, -0.12, -1], [-0.26, 0.13, -1], [-0.26, -0.13, 1]];
    for (i = 0; i < 4; i++) {
      var pxw = PAWS[i][0] * CL + st * PAWS[i][2], pyw = PAWS[i][1] * CL;
      var pxs = (i < 2 ? 0.26 : -0.08) * CL, pys = PAWS[i][1] * CL * (i < 2 ? 0.45 : 1.6);
      ctx.beginPath();
      ctx.ellipse(lerp(pxw, pxs, sit), lerp(pyw, pys, sit), CL * 0.055, CL * 0.04, 0, 0, TAU);
      ctx.fill();
    }

    // Body: chest and hips, a long low shape walking or crouching, a
    // round pear with big haunches sitting.
    var puff = 1 + 0.15 * flat;
    ctx.fillStyle = GINGER;
    ctx.beginPath();
    ctx.ellipse(CL * lerp(0.12, 0.06, sit) + cr * CL * 0.04, 0, CL * lerp(0.21, 0.17, sit), CL * 0.14 * puff, 0, 0, TAU);
    ctx.moveTo(CL * 0.1, 0);
    ctx.ellipse(-CL * lerp(0.15, 0.14, sit), 0, CL * lerp(0.26, 0.23, sit), CL * lerp(0.17, 0.23, sit) * puff, 0, 0, TAU);
    ctx.fill();
    // Shoulder blades up while it crouches.
    if (cr > 0.05) {
      ctx.fillStyle = 'rgba(180,100,40,' + (0.35 * cr).toFixed(3) + ')';
      for (e = -1; e <= 1; e += 2) {
        ctx.beginPath();
        ctx.ellipse(CL * 0.12, e * CL * 0.07, CL * 0.07, CL * 0.035, 0, 0, TAU);
        ctx.fill();
      }
    }
    // Tabby stripes across the back.
    ctx.strokeStyle = STRIPE;
    ctx.lineWidth = CL * 0.035;
    ctx.beginPath();
    for (i = 0; i < 6; i++) {
      var sx = CL * (-0.32 + i * 0.1), sw = CL * (i < 3 ? 0.11 + 0.05 * sit : 0.08);
      ctx.moveTo(sx - CL * 0.02, -sw);
      ctx.quadraticCurveTo(sx + CL * 0.03, 0, sx - CL * 0.02, sw);
    }
    ctx.stroke();

    // The paw going into the water.
    if (c.dab >= 0) {
      var reachP = CL * 0.48 * Math.sin(Math.PI * c.dab);
      ctx.strokeStyle = GINGER;
      ctx.lineWidth = CL * 0.07;
      ctx.beginPath();
      ctx.moveTo(CL * 0.22, CL * 0.07);
      ctx.lineTo(CL * 0.3 + reachP, CL * 0.05);
      ctx.stroke();
      ctx.fillStyle = CREAM;
      ctx.beginPath();
      ctx.arc(CL * 0.3 + reachP, CL * 0.05, CL * 0.045, 0, TAU);
      ctx.fill();
    }

    // Head, turned towards whatever it is watching.
    ctx.translate(CL * (0.33 + 0.06 * cr - 0.05 * sit), 0);
    ctx.rotate(c.head);
    // Ears: up and forward normally, flattened back when it is startled
    // or creeping up on something.
    var ef = Math.max(flat, cr * 0.5);
    for (e = -1; e <= 1; e += 2) {
      var bx1 = -CL * 0.06, by1 = e * CL * 0.04, bx2 = CL * 0.05, by2 = e * CL * 0.13;
      var tipx = lerp(-CL * 0.04, -CL * 0.15, ef), tipy = e * lerp(CL * 0.2, CL * 0.17, ef);
      ctx.fillStyle = GINGER;
      ctx.beginPath();
      ctx.moveTo(bx1, by1); ctx.lineTo(tipx, tipy); ctx.lineTo(bx2, by2); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#eeb1a2';
      ctx.beginPath();
      ctx.moveTo(lerp(bx1, tipx, 0.25), lerp(by1, tipy, 0.25)); ctx.lineTo(lerp(bx1, tipx, 0.8), lerp(by1, tipy, 0.8));
      ctx.lineTo(lerp(bx2, tipx, 0.3), lerp(by2, tipy, 0.3)); ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = GINGER;
    ctx.beginPath();
    ctx.ellipse(0, 0, CL * 0.135, CL * 0.15, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.ellipse(CL * 0.08, 0, CL * 0.055, CL * 0.07, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#e48b96';
    ctx.beginPath();
    ctx.moveTo(CL * 0.135, 0); ctx.lineTo(CL * 0.115, -CL * 0.018); ctx.lineTo(CL * 0.115, CL * 0.018); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = STRIPE;
    ctx.lineWidth = CL * 0.022;
    ctx.beginPath();
    ctx.moveTo(-CL * 0.06, 0); ctx.lineTo(CL * 0.02, 0);
    ctx.moveTo(-CL * 0.05, -CL * 0.045); ctx.lineTo(CL * 0.01, -CL * 0.03);
    ctx.moveTo(-CL * 0.05, CL * 0.045); ctx.lineTo(CL * 0.01, CL * 0.03);
    ctx.stroke();
    // Eyes, just visible from above at the front of the head.
    for (e = -1; e <= 1; e += 2) {
      ctx.fillStyle = '#a9c94c';
      ctx.beginPath();
      ctx.ellipse(CL * 0.075, e * CL * 0.06, CL * 0.025, CL * 0.018, e * 0.5, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#1d1d14';
      ctx.beginPath();
      ctx.ellipse(CL * 0.08, e * CL * 0.06, CL * 0.006, CL * 0.015, e * 0.5, 0, TAU);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = Math.max(0.6, CL * 0.008);
    ctx.beginPath();
    for (e = -1; e <= 1; e += 2) {
      for (i = -1; i <= 1; i++) {
        ctx.moveTo(CL * 0.1, e * CL * 0.04);
        ctx.lineTo(CL * (0.12 + 0.02 * i), e * CL * (0.17 + 0.03 * i));
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // The cat in the pond: only its head and the line of its back above
  // the water, ears flat, paddling, with the rest of it a dim shape under
  // the surface and its tail trailing out behind.
  function drawCatSwimming(c, CL, GINGER, STRIPE, CREAM) {
    var e, pad = Math.sin(c.stride * 1.5);
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.a);
    ctx.lineCap = 'round';
    // Under the water: body, paddling legs and tail, all tinted by it.
    var under = rgba(mix(hex('#c88a4c'), mood.deep, 0.55), 0.6);
    ctx.fillStyle = under;
    ctx.strokeStyle = under;
    ctx.beginPath();
    ctx.ellipse(-CL * 0.12, 0, CL * 0.3, CL * 0.14, 0, 0, TAU);
    ctx.fill();
    ctx.lineWidth = CL * 0.06;
    ctx.beginPath();
    for (e = -1; e <= 1; e += 2) {
      ctx.moveTo(CL * 0.12, e * CL * 0.1);
      ctx.lineTo(CL * (0.22 + 0.06 * pad * e), e * CL * 0.2);
      ctx.moveTo(-CL * 0.28, e * CL * 0.1);
      ctx.lineTo(-CL * (0.3 + 0.06 * pad * e), e * CL * 0.2);
    }
    ctx.moveTo(-CL * 0.42, 0);
    ctx.quadraticCurveTo(-CL * 0.6, Math.sin(c.tail * 2) * CL * 0.1, -CL * 0.78, Math.sin(c.tail * 2 - 1) * CL * 0.12);
    ctx.stroke();
    // Above it: a wet streak of back and the head.
    ctx.fillStyle = GINGER;
    ctx.beginPath();
    ctx.ellipse(-CL * 0.02, 0, CL * 0.14, CL * 0.06, 0, 0, TAU);
    ctx.fill();
    ctx.translate(CL * 0.24, 0);
    for (e = -1; e <= 1; e += 2) {
      ctx.fillStyle = GINGER;
      ctx.beginPath();
      ctx.moveTo(-CL * 0.05, e * CL * 0.05);
      ctx.lineTo(-CL * 0.16, e * CL * 0.15);
      ctx.lineTo(CL * 0.03, e * CL * 0.12);
      ctx.closePath();
      ctx.fill();
    }
    ctx.beginPath();
    ctx.ellipse(0, 0, CL * 0.13, CL * 0.14, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.ellipse(CL * 0.08, 0, CL * 0.05, CL * 0.065, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#e48b96';
    ctx.beginPath();
    ctx.moveTo(CL * 0.13, 0); ctx.lineTo(CL * 0.11, -CL * 0.016); ctx.lineTo(CL * 0.11, CL * 0.016); ctx.closePath();
    ctx.fill();
    // Eyes wide.
    for (e = -1; e <= 1; e += 2) {
      ctx.fillStyle = '#a9c94c';
      ctx.beginPath();
      ctx.arc(CL * 0.07, e * CL * 0.06, CL * 0.03, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#1d1d14';
      ctx.beginPath();
      ctx.arc(CL * 0.075, e * CL * 0.06, CL * 0.018, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // A dragonfly. It comes on fine days, darts about in quick straight
  // dashes with sudden stops, hovers, settles on a pad for a while, and
  // now and then touches the water. Fish come up underneath to look at
  // it, and one that trusts you may leap for it. It always gets away.
  // A tap near it sends it off in a hurry.
  // ------------------------------------------------------------------
  var dfly = {
    state: 'away', next: 25 + Math.random() * 30, x: -999, y: -999, h: 0.5, a: 0,
    fx: 0, fy: 0, fh: 0.5, tx: 0, ty: 0, th: 0.5, t: 0, u: 1, dur: 1, pad: -1, ox: 0, oy: 0,
    visit: 0, wing: 0, fast: 1
  };

  // A tap on the dragonfly sends it off, and throws no food.
  function dragonflyHit(x, y) {
    if (dfly.state === 'away' || dfly.state === 'leave') { return false; }
    var dx = x - dfly.x, dy = y - dfly.y, r = U * (0.06 + 0.03 * dfly.h);
    return dx * dx + dy * dy < r * r;
  }

  function dragonflyLow(x, y, r) {
    if (dfly.state !== 'hover' && dfly.state !== 'rest') { return false; }
    var dx = x - dfly.x, dy = y - dfly.y;
    return dfly.h < 0.5 && dx * dx + dy * dy < r * r;
  }

  function dflyDart(tx, ty, th, fast) {
    var d = dfly;
    d.fx = d.x; d.fy = d.y; d.fh = d.h;
    d.tx = tx; d.ty = ty; d.th = th;
    var dist = Math.sqrt((tx - d.x) * (tx - d.x) + (ty - d.y) * (ty - d.y));
    d.dur = clamp(dist / (U * (fast ? 1.6 : 0.9)), 0.15, 1.2);
    d.u = 0;
    d.pad = -1;
    d.state = 'dart';
  }

  function dflyOffscreen() {
    var a = Math.random() * TAU, r = Math.max(W, H);
    KX = W / 2 + Math.cos(a) * r; KY = H / 2 + Math.sin(a) * r;
  }

  function dragonflyStartle(x, y) {
    var d = dfly;
    if (d.state === 'away' || d.state === 'leave') { return; }
    var dx = d.x - x, dy = d.y - y, dd = Math.sqrt(dx * dx + dy * dy) || 1;
    if (dd > U * 0.25) { return; }
    keepIn(d.x + dx / dd * U * 0.45, d.y + dy / dd * U * 0.45, U * 0.05);
    dflyDart(KX, KY, 0.8, true);
  }

  function updateDragonfly(dt) {
    var d = dfly;
    d.wing += dt * 60;
    if (d.state === 'away') {
      d.next -= dt;
      if (d.next <= 0) {
        // Too quick and darting for anyone who has asked for less motion.
        if (mood.rain > 0.1 || mood.night > 0.3 || reduced) { d.next = 20; return; }
        dflyOffscreen();
        d.x = KX; d.y = KY; d.h = 0.8;
        d.visit = 20 + Math.random() * 25;
        dflyDart(PX0 + (0.2 + 0.6 * Math.random()) * (PX1 - PX0), PY0 + (0.2 + 0.6 * Math.random()) * (PY1 - PY0), 0.6, false);
      }
      return;
    }
    d.visit -= dt;
    if (d.state === 'dart' || d.state === 'leave') {
      d.u = Math.min(1, d.u + dt / d.dur);
      var e = 1 - Math.pow(1 - d.u, 3);
      var nx = lerp(d.fx, d.tx, e), ny = lerp(d.fy, d.ty, e);
      if (Math.abs(nx - d.x) + Math.abs(ny - d.y) > 0.5) { d.a = Math.atan2(ny - d.y, nx - d.x); }
      d.x = nx; d.y = ny; d.h = lerp(d.fh, d.th, e);
      if (d.u >= 1) {
        if (d.state === 'leave') { d.state = 'away'; d.next = 45 + Math.random() * 50; d.x = -999; return; }
        if (d.dip) { d.dip = false; addRipple(d.x, d.y, U * 0.03, 0.7); d.th = 0.25; }
        if (d.pad >= 0) { d.state = 'rest'; d.t = 3 + Math.random() * 6; }
        else { d.state = 'hover'; d.t = 0.5 + Math.random() * 1.8; }
      }
    } else if (d.state === 'hover') {
      d.t -= dt;
      if (!reduced) { d.x += Math.sin(d.wing * 0.05) * U * 0.004 * dt * 10; d.h = d.th + Math.sin(d.wing * 0.03) * 0.03; }
      if (d.t <= 0) { dflyNext(); }
    } else if (d.state === 'rest') {
      d.t -= dt;
      var p = pads[d.restPad];
      if (p) { d.x = p.x + d.ox; d.y = p.y + d.oy; }
      if (d.t <= 0) { dflyNext(); }
    }
  }

  function dflyNext() {
    var d = dfly, r = Math.random();
    if (d.visit <= 0 || mood.rain > 0.1) {
      dflyOffscreen();
      d.fx = d.x; d.fy = d.y; d.fh = d.h; d.tx = KX; d.ty = KY; d.th = 0.9; d.u = 0;
      d.dur = 1.2; d.state = 'leave';
      return;
    }
    if (r < 0.25) {
      // Settle on a pad, off to one side of it.
      var i = Math.floor(Math.random() * pads.length), p = pads[i], a = Math.random() * TAU;
      d.ox = Math.cos(a) * p.r * 0.45; d.oy = Math.sin(a) * p.r * 0.45;
      dflyDart(p.x + d.ox, p.y + d.oy, 0.05, false);
      d.pad = i; d.restPad = i;
    } else if (r < 0.4) {
      // Dip to touch the water, and up again.
      dflyDart(d.x + (Math.random() - 0.5) * U * 0.1, d.y + (Math.random() - 0.5) * U * 0.1, 0.02, false);
      d.dip = true;
    } else {
      keepIn(d.x + (Math.random() - 0.5) * U * 0.6, d.y + (Math.random() - 0.5) * U * 0.6, U * 0.05);
      dflyDart(KX, KY, Math.random() < 0.5 ? 0.15 + Math.random() * 0.15 : 0.4 + Math.random() * 0.3, false);
    }
  }

  function drawDragonfly() {
    var d = dfly;
    if (d.state === 'away') { return; }
    var S =U * 0.05 * (1 + 0.5 * d.h), off = U * (0.01 + 0.12 * d.h), i, e;
    var flying = d.state !== 'rest';
    // Shadow on the water.
    ctx.fillStyle = 'rgba(8,24,22,' + (0.2 * shadowStrength()).toFixed(3) + ')';
    ctx.save();
    ctx.translate(d.x + SUNX * off, d.y + SUNY * off);
    ctx.rotate(d.a);
    ctx.beginPath();
    ctx.ellipse(-S * 0.2, 0, S * 0.55, S * 0.06, 0, 0, TAU);
    ctx.moveTo(S * 0.15, 0);
    ctx.ellipse(0, 0, S * 0.08, S * 0.55, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.a);
    // Four long wings: a glassy blur in flight, laid flat and still at rest.
    for (e = -1; e <= 1; e += 2) {
      for (i = 0; i < 2; i++) {
        var wx = i ? -S * 0.03 : S * 0.1, len = S * (i ? 0.52 : 0.56);
        var sweep = (i ? 0.4 : -0.3) * e;
        var beat = flying && !reduced ? Math.sin(d.wing + i * 1.4) * 0.35 : 0;
        var ang = e * Math.PI / 2 + sweep + beat * e;
        ctx.fillStyle = flying ? 'rgba(220,240,255,0.32)' : 'rgba(225,240,255,0.5)';
        ctx.strokeStyle = 'rgba(80,110,130,0.45)';
        ctx.lineWidth = Math.max(0.5, S * 0.012);
        ctx.beginPath();
        ctx.ellipse(wx + Math.cos(ang) * len * 0.5, Math.sin(ang) * len * 0.5, len * 0.5, S * 0.085, ang, 0, TAU);
        ctx.fill();
        ctx.stroke();
      }
    }
    // Long thin body in segments, a thorax, and two big round eyes.
    ctx.strokeStyle = '#2a86b0';
    ctx.lineCap = 'round';
    ctx.lineWidth = S * 0.06;
    ctx.beginPath();
    ctx.moveTo(S * 0.02, 0);
    ctx.lineTo(-S * 0.62, 0);
    ctx.stroke();
    ctx.strokeStyle = '#123c52';
    ctx.lineWidth = S * 0.065;
    ctx.setLineDash([S * 0.02, S * 0.07]);
    ctx.beginPath();
    ctx.moveTo(-S * 0.05, 0);
    ctx.lineTo(-S * 0.6, 0);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#2f9c8a';
    ctx.beginPath();
    ctx.ellipse(S * 0.08, 0, S * 0.1, S * 0.06, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#4fc0b0';
    for (e = -1; e <= 1; e += 2) {
      ctx.beginPath();
      ctx.arc(S * 0.2, e * S * 0.035, S * 0.045, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // Fireflies: a rare treat. Most evenings there are none; now and then
  // two or three come drifting over the pads and the bank, each blinking
  // in its own time. The paler fish near the top catch the moonlight
  // every evening.
  // ------------------------------------------------------------------
  var flies = [], fliesTonight = 0, wasNight = false;
  for (var fi = 0; fi < 3; fi++) {
    flies.push({ u: Math.random(), v: Math.random(), p: Math.random() * TAU, q: Math.random() * TAU, blink: Math.random() * 3, on: 0 });
  }

  function updateFireflies(dt) {
    // Decide as each evening begins whether this is one of the evenings.
    var night = mood.night > 0.02;
    if (night && !wasNight) { fliesTonight = Math.random() < 0.3 ? 2 + Math.floor(Math.random() * 2) : 0; }
    wasNight = night;
    if (!night) { return; }
    for (var i = 0; i < fliesTonight; i++) {
      var f = flies[i];
      f.p += dt * (0.15 + 0.1 * Math.sin(i)) * (reduced ? 0.4 : 1);
      f.q += dt * (0.12 + 0.08 * Math.cos(i)) * (reduced ? 0.4 : 1);
      f.blink -= dt;
      if (f.blink <= 0) { f.blink = f.on > 0.5 ? 1 + Math.random() * 2.5 : 0.5 + Math.random() * 0.8; f.lit = !f.lit; }
      f.on += ((f.lit ? 1 : 0) - f.on) * Math.min(1, dt * 5);
