<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2f4029">
<title>Koi Pond</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2f4029;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #pond {
    display: block;
    position: fixed; left: 0; top: 0;
    width: 100%; height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<script>
// Full screen on the first touch, and a way back if it is off.
//
// A browser will not do this by itself: the request has to come out of a
// gesture the browser counts as user activation, and that list is fussier
// than it looks. pointerdown only counts when the pointer is a mouse - on
// a touchscreen it grants nothing at all, which is why listening for it
// worked on a laptop and did nothing whatever on a tablet. For a finger it
// is pointerup and touchend that count.
//
// Once full screen is on, the automatic asking stops, so leaving it stays
// left. But leaving it used to mean reloading to get it back, so there is
// now a small button at the top of the screen that is only there while
// full screen is off, and takes itself away the moment it is on.
//
// An iPhone ignores the lot, because Safari there gives full screen to
// video and nothing else, so no button is offered. That is what the home
// screen tags above are for.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#40563a" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

<canvas id="pond" aria-label="Koi Pond"></canvas>

<script>
// A garden pond seen from above, with four koi and one little white fish
// in it. A tap scatters a handful of food, and the fish come up for it out
// of the deep water, where they are hard to see.
//
// What the game is quietly about is trust. Every fish starts out wary of
// the hand above the water, and each learns at its own pace that the hand
// is kind. A wary fish waits at a distance, darts in for a pellet and
// darts away again; a fish that trusts you comes straight up to the top,
// gulps beside your finger and stays. The little white one under the
// lily pads is the shyest of all. At first it will only take what sinks
// to the bottom near its hiding place, and only once the big ones have
// gone. It does come round, in the end, but only by being fed gently, again
// and again, and never any faster than it wants to.
(function () {
  'use strict';

  var canvas = document.getElementById('pond');
  var ctx = canvas.getContext('2d', { alpha: false });
  var TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function wrapAngle(a) {
    while (a > Math.PI) { a -= TAU; }
    while (a < -Math.PI) { a += TAU; }
    return a;
  }

  // The same scenery every time for the same screen, so turning a tablet
  // round does not dig a different pond.
  function seeded(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = reduceQuery.matches;
  if (reduceQuery.addEventListener) {
    reduceQuery.addEventListener('change', function (e) { reduced = e.matches; });
  }

  function hex(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a === undefined ? 1 : a) + ')';
  }

  // ------------------------------------------------------------------
  // The light goes slowly round a day: a fresh morning, full sun with the
  // light dancing on the bottom, a golden afternoon, then a grey spell
  // with a shower of rain, and round to morning again. A short dusk comes
  // between the afternoon and the rain, now and then with a few fireflies
  // over the pads. Each row is the
  // colour of the deep water, of the shallows, how bright the dancing
  // light is, the sky reflected on the surface, and a wash over all of it.
  // ------------------------------------------------------------------
  var MOODS = [
    { deep: '#123436', shallow: '#5f8f7a', caus: 0.17, sky: '#d8ecf0', skyA: 0.1, grade: '#fff2d6', gradeA: 0.04, rain: 0, len: 55 },
    { deep: '#0c3a46', shallow: '#56a094', caus: 0.26, sky: '#e8f6ff', skyA: 0.13, grade: '#ffffff', gradeA: 0, rain: 0, len: 55 },
    { deep: '#22342a', shallow: '#878a56', caus: 0.2, sky: '#ffdcaa', skyA: 0.12, grade: '#ffb35c', gradeA: 0.08, rain: 0, len: 30 },
    { deep: '#0e1a26', shallow: '#2a404c', caus: 0, sky: '#5a64a0', skyA: 0.1, grade: '#121c44', gradeA: 0.46, rain: 0, night: 1, len: 25 },
    { deep: '#1d3133', shallow: '#687d75', caus: 0.06, sky: '#dfe5e8', skyA: 0.08, grade: '#55636c', gradeA: 0.1, rain: 1, len: 55 }
  ].map(function (m) {
    return {
      deep: hex(m.deep), shallow: hex(m.shallow), caus: m.caus, sky: hex(m.sky), skyA: m.skyA,
      grade: hex(m.grade), gradeA: m.gradeA, rain: m.rain, night: m.night || 0, len: m.len
    };
  });

  // Each row's len is how many seconds the light takes to move on from
  // it to the next. Dusk comes in and goes again quickly, so the dark
  // part is short: about half a minute in a lap of nearly four.
  var MOOD_LAP = 0;
  MOODS.forEach(function (m) { m.at = MOOD_LAP; MOOD_LAP += m.len; });
  // Never open on the rain or the dark: start in the morning or the sun.
  var moodClock = Math.random() * 80;
  var mood = {};

  function updateMood(dt) {
    moodClock = (moodClock + dt) % MOOD_LAP;
    var k = MOODS.length - 1;
    while (k > 0 && MOODS[k].at > moodClock) { k--; }
    var a = MOODS[k], b = MOODS[(k + 1) % MOODS.length];
    var f = smooth((moodClock - a.at) / a.len);
    mood.deep = mix(a.deep, b.deep, f);
    mood.shallow = mix(a.shallow, b.shallow, f);
    mood.caus = lerp(a.caus, b.caus, f);
    mood.sky = mix(a.sky, b.sky, f);
    mood.skyA = lerp(a.skyA, b.skyA, f);
    mood.grade = mix(a.grade, b.grade, f);
    mood.gradeA = lerp(a.gradeA, b.gradeA, f);
    // The shower comes and goes inside the grey spell rather than
    // starting the moment the sky begins to cloud over.
    mood.night = lerp(a.night, b.night, f);
    var r = lerp(a.rain, b.rain, f);
    mood.rain = smooth(clamp((r - 0.35) / 0.5, 0, 1));
  }

  // ------------------------------------------------------------------
  // The pond is a rounded rectangle inside a mossy bank. Everything that
  // swims or floats is kept inside it by asking how far a point is from
  // the edge: positive in the water, negative on the bank.
  // ------------------------------------------------------------------
  var W = 1, H = 1, U = 1, DPR = 1;
  var BANK = 0, CR = 0;
  var PX0 = 0, PY0 = 0, PX1 = 1, PY1 = 1, PCX = 0, PCY = 0;

  function edgeDist(x, y) {
    var hx = (PX1 - PX0) / 2 - CR, hy = (PY1 - PY0) / 2 - CR;
    var qx = Math.abs(x - PCX) - hx, qy = Math.abs(y - PCY) - hy;
    var ox = Math.max(qx, 0), oy = Math.max(qy, 0);
    return CR - (Math.sqrt(ox * ox + oy * oy) + Math.min(Math.max(qx, qy), 0));
  }

  // Which way is into the water from here. Left in NX, NY rather than
  // returned, because it is asked many times a frame.
  var NX = 0, NY = 0;
  function edgeNormal(x, y) {
    var gx = edgeDist(x + 1, y) - edgeDist(x - 1, y);
    var gy = edgeDist(x, y + 1) - edgeDist(x, y - 1);
    var m = Math.sqrt(gx * gx + gy * gy) || 1;
    NX = gx / m; NY = gy / m;
  }

  // Pushes a point back into the water so that it is at least `keep`
  // from the edge. Returns true if it had to.
  var KX = 0, KY = 0;
  function keepIn(x, y, keep) {
    var d = edgeDist(x, y);
    KX = x; KY = y;
    if (d >= keep) { return false; }
    edgeNormal(x, y);
    KX = x + NX * (keep - d);
    KY = y + NY * (keep - d);
    return true;
  }

  // ------------------------------------------------------------------
  // Scenery that does not move is painted once into two hidden canvases
  // whenever the screen changes shape: the bottom of the pond, and the
  // bank with a hole cut in it where the water is. Each frame then only
  // has to lay the moving things between them.
  // ------------------------------------------------------------------
  var edgePts = [], bankCanvas = null, bottomCanvas = null;
  var causticA = null, causticB = null, patA = null, patB = null;

  function makeCanvas() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return c;
  }

  function edgePath(g) {
    g.beginPath();
    g.moveTo(edgePts[0], edgePts[1]);
    for (var i = 2; i < edgePts.length; i += 2) { g.lineTo(edgePts[i], edgePts[i + 1]); }
    g.closePath();
  }

  // The water's edge, walked round the rounded rectangle and then pushed
  // out a little and unevenly, so it reads as a dug pond and not a tray.
  // The wobble only ever goes outwards, so nothing kept inside the
  // rectangle can be seen over the bank.
  function buildEdge() {
    var pts = [], s = Math.max(4, U * 0.012), rnd = seeded(3), i;
    var x0 = PX0 + CR, x1 = PX1 - CR, y0 = PY0 + CR, y1 = PY1 - CR;
    function line(ax, ay, bx, by) {
      var n = Math.max(1, Math.round(Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay)) / s));
      for (var k = 0; k < n; k++) { pts.push(ax + (bx - ax) * k / n, ay + (by - ay) * k / n); }
    }
    function arc(cx, cy, a0) {
      var n = Math.max(2, Math.round(CR * Math.PI / 2 / s));
      for (var k = 0; k < n; k++) {
        var a = a0 + Math.PI / 2 * k / n;
        pts.push(cx + Math.cos(a) * CR, cy + Math.sin(a) * CR);
      }
    }
    line(x0, PY0, x1, PY0); arc(x1, y0, -Math.PI / 2);
    line(PX1, y0, PX1, y1); arc(x1, y1, 0);
    line(x1, PY1, x0, PY1); arc(x0, y1, Math.PI / 2);
    line(PX0, y1, PX0, y0); arc(x0, y0, Math.PI);
    var n = pts.length / 2, p1 = rnd() * TAU, p2 = rnd() * TAU;
    for (i = 0; i < n; i++) {
      edgeNormal(pts[2 * i], pts[2 * i + 1]);
      var w = U * (0.008 + 0.005 * Math.sin(i * TAU * 5 / n + p1) + 0.003 * Math.sin(i * TAU * 13 / n + p2) + rnd() * 0.002);
      pts[2 * i] -= NX * w;
      pts[2 * i + 1] -= NY * w;
    }
    edgePts = pts;
  }

  function buildBottom() {
    bottomCanvas = makeCanvas();
    var g = bottomCanvas.getContext('2d'), rnd = seeded(5), i, k;
    var reach = Math.max(PX1 - PX0, PY1 - PY0) * 0.62;
    var rg = g.createRadialGradient(PCX, PCY, 0, PCX, PCY, reach);
    // The middle is deep: the bottom there is dark and far away.
    rg.addColorStop(0, '#273128');
    rg.addColorStop(0.45, '#4f5843');
    rg.addColorStop(0.75, '#8a8463');
    rg.addColorStop(1, '#b4a77f');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    // Soft mottling, so the deep middle is not one flat colour.
    for (i = 0; i < 40; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(40,50,35,0.1)' : 'rgba(200,190,150,0.08)';
      g.beginPath();
      g.ellipse(PX0 + rnd() * (PX1 - PX0), PY0 + rnd() * (PY1 - PY0), U * (0.05 + rnd() * 0.1), U * (0.03 + rnd() * 0.06), rnd() * 3, 0, TAU);
      g.fill();
    }

    // Pebbles, thickest in the shallows round the edge.
    var PEB = ['#9d958a', '#7d776d', '#b9ae98', '#6c6a5e', '#a38c70', '#8a8f86'];
    for (i = 0; i < 520; i++) {
      var x = PX0 + rnd() * (PX1 - PX0), y = PY0 + rnd() * (PY1 - PY0);
      var d = edgeDist(x, y);
      if (d < -U * 0.01 || rnd() > 0.2 + 0.8 * (1 - clamp(d / (U * 0.22), 0, 1))) { continue; }
      var r = U * (0.004 + rnd() * rnd() * 0.012);
      var rot = rnd() * 3;
      g.fillStyle = PEB[Math.floor(rnd() * PEB.length)];
      g.beginPath();
      g.ellipse(x, y, r, r * (0.6 + rnd() * 0.35), rot, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(255,250,235,0.18)';
      g.beginPath();
      g.ellipse(x - r * 0.25, y - r * 0.25, r * 0.45, r * 0.3, rot, 0, TAU);
      g.fill();
    }

    // A few big stones sunk in the deep part.
    for (i = 0; i < 4; i++) {
      var sx = PX0 + (0.2 + rnd() * 0.6) * (PX1 - PX0), sy = PY0 + (0.2 + rnd() * 0.6) * (PY1 - PY0);
      var sr = U * (0.035 + rnd() * 0.035);
      g.fillStyle = 'rgba(30,38,30,0.35)';
      g.beginPath();
      g.ellipse(sx + sr * 0.15, sy + sr * 0.2, sr * 1.05, sr * 0.8, 0.3, 0, TAU);
      g.fill();
      var sg = g.createRadialGradient(sx - sr * 0.3, sy - sr * 0.3, sr * 0.1, sx, sy, sr);
      sg.addColorStop(0, '#7d8070');
      sg.addColorStop(1, '#4c5145');
      g.fillStyle = sg;
      g.beginPath();
      for (k = 0; k < 10; k++) {
        var a = k / 10 * TAU, rr = sr * (0.85 + rnd() * 0.2);
        if (k === 0) { g.moveTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr * 0.8); }
        else { g.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr * 0.8); }
      }
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(110,140,80,0.35)';
      g.beginPath();
      g.ellipse(sx - sr * 0.2, sy - sr * 0.25, sr * 0.5, sr * 0.3, 0.4, 0, TAU);
      g.fill();
    }

    // Weed growing up from the bottom, lying over in the current.
    g.lineCap = 'round';
    for (i = 0; i < 6; i++) {
      var wx = PX0 + (0.1 + rnd() * 0.8) * (PX1 - PX0), wy = PY0 + (0.1 + rnd() * 0.8) * (PY1 - PY0);
      if (edgeDist(wx, wy) < U * 0.05) { continue; }
      var lean = rnd() * TAU;
      for (k = 0; k < 9; k++) {
        var la = lean + (rnd() - 0.5) * 1.2, len = U * (0.04 + rnd() * 0.06);
        g.strokeStyle = rnd() < 0.5 ? 'rgba(52,84,44,0.55)' : 'rgba(70,104,52,0.5)';
        g.lineWidth = Math.max(1, U * (0.003 + rnd() * 0.003));
        g.beginPath();
        g.moveTo(wx, wy);
        g.quadraticCurveTo(wx + Math.cos(la + 0.5) * len * 0.5, wy + Math.sin(la + 0.5) * len * 0.5,
          wx + Math.cos(la) * len, wy + Math.sin(la) * len);
        g.stroke();
      }
    }

    // Two or three old leaves on the bottom.
    for (i = 0; i < 5; i++) {
      var lx = PX0 + rnd() * (PX1 - PX0), ly = PY0 + rnd() * (PY1 - PY0), lr = U * (0.012 + rnd() * 0.008);
      if (edgeDist(lx, ly) < U * 0.03) { continue; }
      g.save();
      g.translate(lx, ly);
      g.rotate(rnd() * TAU);
      g.fillStyle = 'rgba(110,80,45,0.55)';
      g.beginPath();
      g.ellipse(0, 0, lr * 1.6, lr * 0.7, 0, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(70,50,30,0.5)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(-lr * 1.6, 0);
      g.lineTo(lr * 1.6, 0);
      g.stroke();
      g.restore();
    }
  }

  function drawStone(g, x, y, r, rnd) {
    var k, pts = [];
    for (k = 0; k < 9; k++) {
      var a = k / 9 * TAU, rr = r * (0.82 + rnd() * 0.3);
      pts.push(Math.cos(a) * rr, Math.sin(a) * rr * (0.75 + 0.1 * rnd()));
    }
    function shape(ox, oy) {
      g.beginPath();
      for (k = 0; k < pts.length; k += 2) {
        var mx = (pts[k] + pts[(k + 2) % pts.length]) / 2, my = (pts[k + 1] + pts[(k + 3) % pts.length]) / 2;
        if (k === 0) { g.moveTo(x + ox + mx, y + oy + my); }
        g.quadraticCurveTo(x + ox + pts[(k + 2) % pts.length], y + oy + pts[(k + 3) % pts.length],
          x + ox + (pts[(k + 2) % pts.length] + pts[(k + 4) % pts.length]) / 2,
          y + oy + (pts[(k + 3) % pts.length] + pts[(k + 5) % pts.length]) / 2);
      }
      g.closePath();
    }
    g.fillStyle = 'rgba(15,25,15,0.3)';
    shape(r * 0.18, r * 0.26);
    g.fill();
    var STONE = [['#b5b0a4', '#77736a'], ['#a7a49b', '#69675f'], ['#bdb6a5', '#837b6b'], ['#9a9c94', '#5f625b']];
    var c = STONE[Math.floor(rnd() * STONE.length)];
    var sg = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.1);
    sg.addColorStop(0, c[0]);
    sg.addColorStop(1, c[1]);
    g.fillStyle = sg;
    shape(0, 0);
    g.fill();
    if (rnd() < 0.5) {
      g.fillStyle = 'rgba(96,128,64,0.45)';
      g.beginPath();
      g.ellipse(x + r * (rnd() - 0.5) * 0.6, y + r * (rnd() - 0.5) * 0.6, r * 0.35, r * 0.22, rnd() * 3, 0, TAU);
      g.fill();
    }
  }

  function drawFern(g, x, y, size, aim, rnd) {
    g.lineCap = 'round';
    for (var f = 0; f < 8; f++) {
      var a = aim + (f / 7 - 0.5) * 2.6 + (rnd() - 0.5) * 0.2;
      var len = size * (0.7 + rnd() * 0.3), bend = (rnd() - 0.5) * 0.5;
      var ex = x + Math.cos(a + bend) * len, ey = y + Math.sin(a + bend) * len;
      var mx = x + Math.cos(a) * len * 0.55, my = y + Math.sin(a) * len * 0.55;
      g.strokeStyle = '#3f5f2a';
      g.lineWidth = Math.max(1, size * 0.025);
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(mx, my, ex, ey);
      g.stroke();
      for (var k = 1; k < 12; k++) {
        var t = k / 12, it = 1 - t;

          g.fill();

  }

  function buildBank() {
    bankCanvas = makeCanvas();
    var g = bankCanvas.getContext('2d'), rnd = seeded(9), i;
    g.fillStyle = '#4b6236';
    g.fillRect(0, 0, W, H);
    var MOSS = ['#3f5530', '#58733d', '#6b8446', '#4a5a2f', '#5e6f38'];
    for (i = 0; i < 260; i++) {
      g.fillStyle = MOSS[Math.floor(rnd() * MOSS.length)];
      g.globalAlpha = 0.5;
      g.beginPath();
      g.arc(rnd() * W, rnd() * H, U * (0.008 + rnd() * 0.025), 0, TAU);
      g.fill();
    }
    g.globalAlpha = 1;
    g.lineCap = 'round';
    for (i = 0; i < 1400; i++) {
      var x = rnd() * W, y = rnd() * H;
      if (edgeDist(x, y) > U * 0.01) { continue; }
      var a = -Math.PI / 2 + (rnd() - 0.5) * 1.4, l = U * (0.006 + rnd() * 0.012);
      g.strokeStyle = rnd() < 0.5 ? 'rgba(130,160,80,0.5)' : 'rgba(40,60,28,0.45)';
      g.lineWidth = Math.max(1, U * 0.0022);

      g.moveTo(x, y);
      g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
      g.stroke();

    var FLOWER = ['#fff7e8', '#ffe27a', '#f7b9d0', '#d9c8ff'];
    for (i = 0; i < 26; i++) {
      var fx = rnd() * W, fy = rnd() * H;
      if (edgeDist(fx, fy) > -U * 0.02) { continue; }
      g.fillStyle = FLOWER[Math.floor(rnd() * FLOWER.length)];
      for (var k = 0; k < 4; k++) {
        g.beginPath();
        g.arc(fx + (rnd() - 0.5) * U * 0.02, fy + (rnd() - 0.5) * U * 0.02, Math.max(1, U * 0.003), 0, TAU);
        g.fill();
      }
    }

    g.globalCompositeOperation = 'destination-out';
    edgePath(g);
    g.fill();
    g.globalCompositeOperation = 'source-over';

    // The bank leans over the water a little, so the water just inside
    // the edge is in shade.
    g.save();
    edgePath(g);
    g.clip();
    g.strokeStyle = 'rgba(12,26,18,0.3)';
    g.lineWidth = U * 0.04;
    edgePath(g);
    g.stroke();
    g.strokeStyle = 'rgba(12,26,18,0.25)';
    g.lineWidth = U * 0.014;
    g.stroke();
    g.restore();

    // Stones round the edge, sitting half in the water.
    var acc = 0, gap = U * 0.04, n = edgePts.length / 2;
    for (i = 0; i < n; i++) {

      acc += Math.sqrt(dx * dx + dy * dy);

      acc = 0;
      // Mostly small and middling, now and then a boulder, and here and
      // there a gap where the grass runs down to the water.
      gap = U * (0.022 + rnd() * 0.04);
      var big = rnd() < 0.13;
      if (!big && rnd() < 0.12) { continue; }
      var r = big ? U * (0.032 + rnd() * 0.02) : U * (0.011 + rnd() * rnd() * 0.028);

    }

    drawFern(g, PX0 + CR * 0.12, PY0 + CR * 0.12, U * 0.12, Math.PI / 4, rnd);
    drawFern(g, PX1 - CR * 0.12, PY1 - CR * 0.12, U * 0.12, Math.PI * 1.25, rnd);
  }

  // The net of light on the bottom of a sunny pond: bright along the
  // borders between cells, dark in their middles. Two of these slid
  // slowly across each other make it shimmer.
  function buildCaustic(seed) {
    var S = 192, G = 5, c = document.createElement('canvas');

    }
    for (var y = 0; y < S; y++) {

        // the edges curve like real caustics but still tile seamlessly.

        var v = v0 + 0.035 * Math.sin(TAU * (2 * u0 - v0) + 0.7) + 0.02 * Math.sin(TAU * 3 * u0 + 2.1);

          }

  }

    { fx: 0.12, fy: 0.12, ox: 0, oy: 0, r: 0.062 },

  function placePads() {
    var first = !pads.length, sx = 0, sy = 0, cn = 0;

      var s = PAD_SPEC[i];

          flower: !!s.flower, clump: !!s.clump, dip: 0, hue: Math.random()
        });

  // ------------------------------------------------------------------
  // Layout
  // ------------------------------------------------------------------
  function layout() {
    var w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    var o = { x0: PX0, y0: PY0, x1: PX1, y1: PY1, u: U };
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    W = w; H = h; U = Math.min(W, H);
    BANK = U * 0.09;
    CR = U * 0.13;
    PX0 = BANK; PY0 = BANK; PX1 = W - BANK; PY1 = H - BANK;
    PCX = (PX0 + PX1) / 2; PCY = (PY0 + PY1) / 2;

    buildEdge();
    buildRim();
    buildBottom();
    buildBank();
    if (!causticA) {
      causticA = buildCaustic(21);
      causticB = buildCaustic(34);
      patA = ctx.createPattern(causticA, 'repeat');
      patB = ctx.createPattern(causticB, 'repeat');
    }
    placePads();
    buildWaves();
    // A page can be laid out before it has any width at all, so the pond
    // may first be dug at the size of a pinhead. Everything in it is
    // carried over to the real size when that arrives.

  }

  // ------------------------------------------------------------------
  // The fish. Seven koi of the classic kinds, and the little one.
  //
  // Patches are laid out on the fish's own body, so they bend with it:
  // how far along it (0 the nose, 1 the root of the tail), how far across
  // (-1 one flank, 1 the other), how long and how wide, and the colour.
  //
  // trust is where each starts; learn is how quickly it comes round. The
  // bronze chagoi is the friendly one real ponds are stocked with for
  // exactly this, because the others learn from watching it.
  // ------------------------------------------------------------------
  var KINDS = [
    { len: 0.165, girth: 0.165, body: '#9b7548', fin: '#b8925f', net: '#6b4c2c', trust: 0.6, learn: 1.6 },
    { len: 0.15, girth: 0.15, body: '#f7f2e9', fin: '#f1e9df', trust: 0.24, learn: 1,
      patches: [[0.13, 0.05, 0.1, 0.85, '#df4429'], [0.4, 0.3, 0.12, 0.75, '#df4429'], [0.65, -0.25, 0.09, 0.7, '#e3502f']] },
    { len: 0.145, girth: 0.15, body: '#1f1d22', fin: '#3a3438', trust: 0.18, learn: 1,
      patches: [[0.14, -0.1, 0.11, 0.9, '#d9472b'], [0.33, 0.55, 0.08, 0.5, '#f3efe6'], [0.47, -0.35, 0.1, 0.65, '#d9472b'],
        [0.66, 0.35, 0.08, 0.55, '#f3efe6'], [0.8, -0.2, 0.06, 0.6, '#d9472b']] },
    { len: 0.145, girth: 0.15, body: '#efb534', fin: '#f5c860', net: '#c98d1c', metal: 1, trust: 0.3, learn: 1 },
    { len: 0.085, girth: 0.135, body: '#f4f4f6', fin: '#e8eef4', longFins: 1, trust: 0, learn: 0.55, shy: 1,
      patches: [[0.1, 0.1, 0.06, 0.65, '#f4a46a']] }
  ];

  // Where trust starts to show. Below CURIOUS a fish will not come near a
  // hand; below BRAVE it waits and watches before every pellet and dashes
  // off after; from TAME it comes to your finger and kisses it. The little
  // one will not come up to the surface at all until it reaches SURFACE.
  var CURIOUS = 0.35, SURFACE = 0.35, BRAVE = 0.5, TAME = 0.72;

  var N = 9;
  var fish = [], fingers = {};

  // How far round a held finger nothing should happen, because the
  // finger itself is in the way. A fingertip is about 9 mm across, which
  // is roughly 30 CSS pixels' radius on a phone and nearer 45 on a tablet.
  function fingerR() { return clamp(U * 0.085, 30, 46); }
  var lastFeed = { x: 0, y: 0, age: 99 };

  function setSize(f) {
    f.L = f.k.len * U;
    f.body = f.L * 0.76;
    f.seg = f.body / (N - 1);
    f.half = f.body * f.k.girth;
  }

  // Lays the body out straight behind the nose.
  function straighten(f) {
    for (var i = 1; i < N; i++) {
      f.px[i] = f.px[0] - Math.cos(f.a) * f.seg * i;
      f.py[i] = f.py[0] - Math.sin(f.a) * f.seg * i;
    }
  }

  function makeFish(k, id) {
    var f = {
      k: k, id: id, L: 0, body: 0, seg: 0, half: 0,
      px: new Float64Array(N), py: new Float64Array(N),
      qx: new Float64Array(N), qy: new Float64Array(N),
      nx: new Float64Array(N), ny: new Float64Array(N),
      a: Math.random() * TAU, v: 0, z: 0.6, zw: 0.6,
      phase: Math.random() * TAU, amp: 0.3, flap: Math.random() * TAU, finOpen: 0.5,
      trust: k.trust, mode: 'wander', target: null, finger: null,
      think: Math.random() * 0.3, wx: 0, wy: 0, wz: 0.5, wt: 0, cruise: 0, hover: 0,
      retreat: 0, rx: 0, ry: 0, hold: 0, patience: 2, dared: false, idle: 0,
      excite: 0, ex: 0, ey: 0, gulp: -1, kissT: 0.5, firstTop: false, firstKiss: false,
      fear: 0, beat: true, beatT: Math.random() * 2, tailA: 0, tailV: 0, pedX: 0, pedY: 0,
      leap: -1, wantLeap: 0, look: 0

  }

  function spawnFish() {
    fish = [];
    for (var i = 0; i < KINDS.length; i++) {
      var f = makeFish(KINDS[i], i);
      if (f.k.shy) {
        f.px[0] = shyHome.x; f.py[0] = shyHome.y; f.z = 0.75;
      } else {
        keepIn(PX0 + (0.15 + Math.random() * 0.7) * (PX1 - PX0), PY0 + (0.15 + Math.random() * 0.7) * (PY1 - PY0), f.L);
        f.px[0] = KX; f.py[0] = KY;
        f.z = 0.35 + Math.random() * 0.4;
      }
      f.zw = f.z;
      straighten(f);
      for (var s = 1; s < N; s++) { keepIn(f.px[s], f.py[s], 2); f.px[s] = KX; f.py[s] = KY; }
      newWaypoint(f);
      fish.push(f);
    }

  function addTrust(f, d) { f.trust = Math.min(1, f.trust + d); }

  // Where to idle next. Mostly down in the deep, where a fish is only a
  // shadow, so that one coming up into the light is an event. The little
  // one keeps to the shade of the lily pads, less so as it grows braver; a
  // fish that trusts you hangs about where you last fed it, a little
  // higher; now and then a tame one cruises right along the top. Wherever
  // it is, a frightened fish goes deeper, and nobody idles near the cat.
  function newWaypoint(f) {
    var t = f.trust, r = Math.random(), x, y, best = 9, bx = 0, by = 0, bz = 0.6;
    // Only a fish that has had a fright, or the little one, takes care to
    // keep away from the cat. The rest wander where they like until they
    // come too close and get one.
    var careful = f.fear > 0.2 || f.k.shy ? 4 : 1;
    for (var tries = 0; tries < careful; tries++) {
      if (f.k.shy && (r < 0.8 - 0.65 * t || f.fear > 0.3)) {
        var a = Math.random() * TAU, rr = U * (0.02 + 0.08 * Math.random());
        x = shyHome.x + Math.cos(a) * rr; y = shyHome.y + Math.sin(a) * rr;
        f.wz = 0.82;
      } else if (lastFeed.age < 25 && t > BRAVE && r < 0.55) {
        x = lastFeed.x + (Math.random() - 0.5) * U * 0.35;
        y = lastFeed.y + (Math.random() - 0.5) * U * 0.35;
        f.wz = lerp(0.55, 0.3, t);
      } else if (f.k.shy && t < 0.9) {
        // Venturing out, but never further than it feels safe to.
        var va = Math.random() * TAU, vr = U * (0.1 + 0.7 * t) * Math.random();
        x = shyHome.x + Math.cos(va) * vr; y = shyHome.y + Math.sin(va) * vr;
        f.wz = 0.6 + 0.25 * (1 - t);
      } else {
        x = PX0 + Math.random() * (PX1 - PX0);
        y = PY0 + Math.random() * (PY1 - PY0);
        f.wz = t > TAME && Math.random() < 0.18 ? 0.12 : 0.5 + 0.4 * (1 - t) * Math.random() + 0.1 * Math.random();
      }
      var s = catThreatAt(x, y);
      if (s < best) { best = s; bx = x; by = y; bz = f.wz; }
      if (s < 0.05) { break; }
      r = Math.random();
    }
    x = bx; y = by;
    // In the rain the braver fish come up to look at the drops.
    f.wz = bz * (1 - 0.4 * mood.rain * t);
    if (f.fear > 0.05) { f.wz = Math.max(f.wz, 0.55 + 0.35 * f.fear); }
    f.wz = Math.min(0.9, f.wz);
    keepIn(x, y, f.L * 0.8);
    f.wx = KX; f.wy = KY;
    f.wt = 6 + Math.random() * 8;
    f.cruise = U * (0.03 + 0.022 * Math.random());
    if (Math.random() < 0.3) { f.hover = 1.5 + Math.random() * 3; }
  }

  // Is a bolder fish already at this pellet?
  function crowded(p, f) {
    for (var j = 0; j < fish.length; j++) {
      var o = fish[j];
      if (o === f || o.trust <= f.trust) { continue; }
      var dx = o.px[0] - p.x, dy = o.py[0] - p.y, r = o.L * 0.9;
      if (dx * dx + dy * dy < r * r) { return true; }
    }
    return false;
  }

  // With a hand in the water, a fish that is curious about it only
  // bothers with food near the hand or right under its nose. Otherwise a
  // pellet forgotten in a far corner would always win over your finger.
  function choosePellet(f, hand) {
    var best = null, bestScore = Infinity, hx = f.px[0], hy = f.py[0], t = braveNow(f), shy = f.k.shy;
    var range = U * (0.22 + 1.2 * t);
    for (var i = 0; i < pellets.length; i++) {
      var p = pellets[i];
      if (p.gone || p.air > 0) { continue; }
      // Food right under the cat's nose is left where it is.
      if (catThreatAt(p.x, p.y) > 0.25 + 0.6 * f.trust) { continue; }
      if (hand) {
        var gx = p.x - hand.x, gy = p.y - hand.y, nx = p.x - hx, ny = p.y - hy;
        if (gx * gx + gy * gy > U * U * 0.0625 && nx * nx + ny * ny > U * U * 0.0225) { continue; }
      }
      var top = p.z < 0.05;

      // A wary fish lets the splash settle before it goes near.

      if (shy && t < 0.9) {

        if (hx2 * hx2 + hy2 * hy2 > range * range) { continue; }

  function nearestFinger(f, reach) {

      var g = fingers[id];
      if (g.held < 0.35) { continue; }

  }

  // however frightened the cat has made it. Trust itself never drops; the
  // fright fades of its own accord once the cat has gone.
  function braveNow(f) { return f.trust * (1 - 0.6 * f.fear); }

  // below follows that decision smoothly every frame.
  function think(f) {
    if (f.retreat > 0 || f.leap >= 0 || f.wantLeap > 0) { return; }
    var g = nearestFinger(f, U * 2), bn = braveNow(f);
    if (g && catThreatAt(g.x, g.y) > 0.5) { g = null; }
    // A fish that trusts you comes to your hand when the cat frightens
    // it, as well as when it does not.
    var toHand = g && (bn >= CURIOUS || (f.trust >= TAME && f.fear > 0.3));
    var p = choosePellet(f, toHand ? g : null);
    if (p) {
      if (f.mode !== 'food') { f.idle = 0; }
      f.mode = 'food';
      if (p !== f.target) {
        f.target = p;
        f.patience = 0.4 + (BRAVE - f.trust) * 3.2 * (0.6 + 0.8 * Math.random());
      }
      return;
    }
    f.target = null;
    f.dared = false;
    if (f.excite > 0) { f.mode = 'rush'; return; }
    if (toHand) { f.mode = 'finger'; f.finger = g; return; }
    // Something hovering just over the water is worth coming up to see.
    if (f.look > 0 || (bn >= 0.4 && f.fear < 0.3 && dragonflyLow(f.px[0], f.py[0], U * 0.3) && Math.random() < 0.25)) {

      f.mode = 'look';
      return;
    }
    if (f.mode !== 'wander' || (f.fear > 0.3 && catThreatAt(f.wx, f.wy) > 0.15)) { newWaypoint(f); }
    f.mode = 'wander';
    // A fish that does not trust you yet moves away from a hand that
    // comes near it, unhurried.
    if (g) {
      var dx = f.px[0] - g.x, dy = f.py[0] - g.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < U * 0.2) {

        f.wz = Math.max(f.wz, 0.6);
      }
    }
  }

  function steer(f, dt) {
    // Food snatched by another fish, or a finger lifted: decide again now
    // rather than wandering off for a moment first.
    if ((f.mode === 'food' && (!f.target || f.target.gone)) ||
        (f.mode === 'finger' && (!f.finger || !f.finger.alive))) {
      think(f);
    }
    if (f.leap >= 0) { leapStep(f, dt); return; }
    var hx = f.px[0], hy = f.py[0], tx = hx, ty = hy, vw = 0, zw = f.wz, urg = 0;
    var face = null, zRate = 0.3, i;

    // Fright comes quickly when the cat is near and goes slowly after it
    // has left, so the fish come back in their own time.
    var threat = catThreatAt(hx, hy);
    if (threat > f.fear) { f.fear += (threat - f.fear) * Math.min(1, dt * 3); }
    else { f.fear = Math.max(threat, f.fear - dt * 0.07); }
    var t = braveNow(f);

    if (f.mode === 'food') {
      f.idle = 0;
    } else {
      f.idle += dt;
      if (f.idle > 2.5) { f.hold = 0; }
    }

    if (f.retreat > 0) {
      f.retreat -= dt;
      tx = f.rx; ty = f.ry; vw = U * 0.24; zw = 0.75; urg = 1;
    } else if (f.wantLeap > 0) {
      // Gathering speed up towards the surface for a leap.
      f.wantLeap -= dt;
      tx = f.lx; ty = f.ly; vw = U * 0.24; zw = 0; zRate = 0.9; urg = 0.8;
      if (f.z < 0.06 && f.v > U * 0.15) { tryLeap(f); }
      if (f.wantLeap <= 0) { f.mode = 'wander'; newWaypoint(f); }
    } else if (f.mode === 'look' && dfly.state !== 'away') {
      // Come up under the dragonfly and look at it.
      f.look -= dt;
      if (f.look <= 0) { f.mode = 'wander'; newWaypoint(f); }
      var lkx = hx - dfly.x, lky = hy - dfly.y, lkd = Math.sqrt(lkx * lkx + lky * lky) || 1e-6;
      tx = dfly.x + lkx / lkd * f.L * 0.35; ty = dfly.y + lky / lkd * f.L * 0.35;
      vw = U * 0.06; zw = 0.15; zRate = 0.4; face = dfly; urg = 0.3;
      if (!reduced && f.trust >= 0.6 && f.fear < 0.15 && leapCool <= 0 && dfly.state === 'hover' && lkd < f.L * 1.8) {
        planLeap(f, dfly.x, dfly.y, 2.5);
      }
    } else if (f.mode === 'food' && f.target && !f.target.gone) {
      var p = f.target, dx = p.x - hx, dy = p.y - hy, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      var pz = p.z >= 1 ? 0.9 : p.z;
      tx = p.x; ty = p.y; urg = 0.6;
      vw = U * (0.14 + 0.14 * t);
      // It rises towards the food as it closes in on it.
      var near = clamp(1 - (d - f.L * 0.3) / (f.L * 2.2), 0, 1);
      zw = lerp(f.wz, pz, near);
      // A wary fish stops short and watches before it dares go in.
      if (t < BRAVE && !f.dared) {
        var standoff = f.L * (0.6 + 2.4 * (BRAVE - t));
        if (d < standoff + f.L * 0.5) {

          tx = p.x - dx / d * standoff;
          ty = p.y - dy / d * standoff;
          face = p;
          zw = Math.max(zw, 0.45);
          if (f.hold > f.patience) { f.dared = true; }
        }
      }
      if (f.dared) { vw = U * 0.3; urg = 1; zw = pz; zRate = 1.4; }
      else if (near > 0.5) { zRate = 0.9; }
    } else if (f.mode === 'rush') {
      f.excite -= dt;
      if (f.excite <= 0) { f.mode = 'wander'; }
      tx = f.ex; ty = f.ey; vw = U * 0.2; zw = 0.08; urg = 0.7; zRate = 0.6;
    } else if (f.mode === 'finger' && f.finger && f.finger.alive) {
      var g = f.finger, gx = hx - g.x, gy = hy - g.y, gd = Math.sqrt(gx * gx + gy * gy) || 1e-6;
      // Each fish keeps the distance its trust allows: a tame one puts
      // its lips to your fingertip, a curious one hangs back and looks.
      var tame = f.trust >= TAME;
      // Each keeps its own place round the finger, nudging along from its
      // neighbours, so a crowd of them opens out like the petals of a
      // flower with their noses in the middle, instead of piling up on
      // whichever side they came from.
      if (f.slotFinger !== g) { f.slotFinger = g; f.slotA = Math.atan2(gy, gx); }
      var cnt = 1, push = 0, o2;
      for (i = 0; i < fish.length; i++) {
        o2 = fish[i];
        if (o2 !== f && o2.mode === 'finger' && o2.slotFinger === g) { cnt++; }
      }
      var sep = TAU / Math.max(4, cnt);
      for (i = 0; i < fish.length; i++) {
        o2 = fish[i];
        if (o2 === f || o2.mode !== 'finger' || o2.slotFinger !== g) { continue; }
        var dA = wrapAngle(f.slotA - o2.slotA);
        if (Math.abs(dA) < sep) { push += (dA >= 0 ? 1 : -1) * (sep - Math.abs(dA)); }
      }
      f.slotA = wrapAngle(f.slotA + push * Math.min(1, dt * 1.5));
      // The ring is kept outside the fingertip, so the fish are never
      // hidden under the very finger they have come to.
      var FR = fingerR();
      var ring = tame ? Math.max(FR + f.half * 0.15, cnt * f.half * 2.8 / TAU)
        : FR + f.L * 0.4 + U * 0.3 * clamp((TAME - t) / (TAME - CURIOUS), 0, 1);
      // It comes in along its own spoke, so its body trails out behind it
      // rather than back the way it happened to arrive. Off its spoke, it
      // first swims round to the outer end of it.
      var sx2 = Math.cos(f.slotA), sy2 = Math.sin(f.slotA);
      var along = gx * sx2 + gy * sy2, across = Math.abs(gx * sy2 - gy * sx2);
      var reach = across > f.L * 0.3 || along < ring * 0.5 ? ring + f.L * 0.9 : ring;
      tx = g.x + sx2 * reach; ty = g.y + sy2 * reach;
      vw = clamp((gd - ring) * 1.3, U * 0.01, U * 0.13);
      face = g; urg = 0.4;
      zw = tame ? 0.02 : lerp(0.6, 0.3, clamp((t - CURIOUS) / (TAME - CURIOUS), 0, 1));
      zRate = 0.5;
      if (gd < ring + f.L * 0.6) { addTrust(f, 0.012 * f.k.learn * dt); }
      if (tame && gd < ring + f.half * 1.5 && f.z < 0.15) {

    } else {
      if (f.mode !== 'wander') { f.mode = 'wander'; newWaypoint(f); }
      f.wt -= dt;
      var wdx = f.wx - hx, wdy = f.wy - hy;
      if (wdx * wdx + wdy * wdy < f.L * f.L * 0.36 || f.wt <= 0) { newWaypoint(f); }
      if (f.hover > 0) {
        f.hover -= dt;
        tx = hx + Math.cos(f.a) * f.L; ty = hy + Math.sin(f.a) * f.L;
        vw = U * 0.008;
      } else {
        tx = f.wx; ty = f.wy; vw = f.cruise;
      }
      // Now and then a fish at ease rises and leaps clear of the water.
      if (!reduced && leapCool <= 0 && f.trust >= 0.6 && f.fear < 0.1 && Math.random() < dt * 0.04) {

      }
    }

    // Which way it would like to go: towards its target, or, once it is
    // there, round to face whatever it is attending to.
    var ddx = tx - hx, ddy = ty - hy, dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1e-6;
    var ux = ddx / dd, uy = ddy / dd;
    if (face && dd < f.L * 0.4) {

    if (urg < 1) { vw = Math.min(vw, Math.max(U * 0.012, dd * 1.4)); }

    // Room for the others at the same depth; a fish well above or below
    // can pass over or under, as real ones do.
    var ax = 0, ay = 0;
    for (var j = 0; j < fish.length; j++) {
      var o = fish[j];
      if (o === f || Math.abs(o.z - f.z) > 0.3) { continue; }
      var rr = (f.L + o.L) * (f.mode === 'finger' && o.mode === 'finger' ? 0.13 : 0.2);
      for (var s = 0; s < N; s += 3) {
        var ox = hx - o.px[s], oy = hy - o.py[s], od = Math.sqrt(ox * ox + oy * oy);
        if (od < rr && od > 1e-6) { var w = 1 - od / rr; ax += ox / od * w; ay += oy / od * w; }
      }
    }
    // And the bank, felt for a little way ahead.
    var wallK = f.mode === "food" && f.target && edgeDist(f.target.x, f.target.y) < f.L * 1.2 ? 0.25 : 1, ed = edgeDist(hx, hy), wallR = f.L * 0.9 * wallK;
    if (ed < wallR) { edgeNormal(hx, hy); ax += NX * (1 - ed / wallR) * 2.2; ay += NY * (1 - ed / wallR) * 2.2; }
    var lx = hx + Math.cos(f.a) * f.L * 0.7, ly = hy + Math.sin(f.a) * f.L * 0.7;
    if (wallK === 1 && edgeDist(lx, ly) < f.L * 0.35) { edgeNormal(lx, ly); ax += NX * 1.2; ay += NY * 1.2; }

    var want = Math.atan2(uy + ay * 1.3, ux + ax * 1.3);
    var turn = (1.1 + 2.6 * urg) * Math.sqrt(0.17 / f.k.len);
    var da = wrapAngle(want - f.a);
    f.a = wrapAngle(f.a + clamp(da, -turn * dt, turn * dt));
    // Turning on the spot still needs a little way on.
    if (Math.abs(da) > 0.3) { vw = Math.max(vw, U * 0.014); }
    var acc = U * (0.12 + 0.5 * urg);

    var spd = reduced ? 0.7 : 1;
    hx += Math.cos(f.a) * f.v * dt * spd;
    hy += Math.sin(f.a) * f.v * dt * spd;
    keepIn(hx, hy, U * 0.015);
    f.px[0] = KX; f.py[0] = KY;
    f.z += clamp(zw - f.z, -zRate * dt, zRate * dt);
    f.z = clamp(f.z, 0, 0.9);

    // its curve through a turn.
    for (i = 1; i < N; i++) {

      f.px[i] = f.px[i - 1] + bx / bd * f.seg;
      f.py[i] = f.py[i - 1] + by / bd * f.seg;

    // cruising does not swim steadily: it gives a few slow, wide strokes
    // and then glides with its body straightening out, and strokes again.
    // Hurrying, it beats faster and does not stop to glide. A sharp turn
    // adds a flick.
    f.beatT -= dt;

    var beating = f.beat || urg > 0.3 || vw > U * 0.07;

    f.phase += dt * TAU * (0.75 + 1.9 * moving) * (0.3 + 0.7 * Math.min(1, f.amp / 0.5)) * (reduced ? 0.6 : 1);

    f.finOpen += (clamp(1 - f.v / (U * 0.12), 0.15, 1) - f.finOpen) * Math.min(1, dt * 3);

    if (f.gulp >= 0) { f.gulp += dt; if (f.gulp > 0.4) { f.gulp = -1; } }

    shapeFish(f, dt);
    if (f.target && !f.target.gone) { tryEat(f, f.target); }

    // leaves a wake spreading behind it. Deeper down, nothing shows.
    if (f.z < 0.3 && f.v > U * 0.01) {
      var shallow = 1 - f.z / 0.3;
      poke(f.qx[1], f.qy[1], f.half * 1.1, 0.12 * shallow * clamp(f.v / (U * 0.1), 0.2, 1.6) * dt * 60);

    f.bubbleT = (f.bubbleT === undefined ? 2 + Math.random() * 8 : f.bubbleT) - dt;
    if (f.bubbleT <= 0) {
      f.bubbleT = 6 + Math.random() * 10;
      if (f.z > 0.35) { bubbleUp(f.qx[0], f.qy[0], f.z); }
    }
  }

  // Where every point of the body actually is this frame, wave included,

  // The wave lives almost all in the back half, as it does in a koi: the
  // head hardly sways, the tail sweeps.

    // moment behind, and through a turn it follows round and settles.
    // The little one's long fin is softer still.
    var e = N - 1;

      var aim = clamp(lat * 7, -0.9, 0.9);
      f.tailV += ((aim - f.tailA) * 42 * soft - f.tailV * 8 * Math.sqrt(soft)) * dt;
      f.tailA = clamp(f.tailA + f.tailV * dt, -1.1, 1.1);
    }
    f.pedX = f.qx[e]; f.pedY = f.qy[e];
  }

  // ------------------------------------------------------------------
  // Leaping. Once in a while a fish that is at ease comes up fast, breaks
  // the surface and arcs clear of the water, landing a body's length or
  // so further on with a splash. Seen from above, a fish in the air
  // grows as it rises towards you and shrinks as it falls, and its shadow
  // runs out across the water away from it.
  // ------------------------------------------------------------------

    f.mode = 'leapRun';
    leapCool = time + 1;
  }

  function tryLeap(f) {
    var lx = f.px[0] + Math.cos(f.a) * f.L * 1.8, ly = f.py[0] + Math.sin(f.a) * f.L * 1.8;

      if (dx * dx + dy * dy < pads[i].r * pads[i].r * 1.4) { return; }
    }

    f.leap = 0;
    f.z = 0;
    leapCool = 40 + Math.random() * 50;
    splash(f.qx[0], f.qy[0], 0.6);
    if (dfly.state !== 'away') { dragonflyStartle(f.qx[0], f.qy[0]); }
  }

  function leapStep(f, dt) {
    f.leap += dt / LEAP_TIME;
    var spd = f.L * 1.8 / LEAP_TIME;
    f.px[0] += Math.cos(f.a) * spd * dt;
    f.py[0] += Math.sin(f.a) * spd * dt;
    keepIn(f.px[0], f.py[0], U * 0.015);
    f.px[0] = KX; f.py[0] = KY;
    for (var i = 1; i < N; i++) {
      var bx = f.px[i] - f.px[i - 1], by = f.py[i] - f.py[i - 1], bd = Math.sqrt(bx * bx + by * by) || 1e-6;
      f.px[i] = f.px[i - 1] + bx / bd * f.seg;
      f.py[i] = f.py[i - 1] + by / bd * f.seg;

    f.amp += (0.12 - f.amp) * Math.min(1, dt * 4);
    f.phase += dt * TAU * 1.5;
    f.finOpen += (0.9 - f.finOpen) * Math.min(1, dt * 4);
    shapeFish(f, dt);
    if (f.leap >= 1) {
      f.leap = -1;
      f.z = 0.25;
      f.v = U * 0.12;
      f.mode = 'wander';
      f.wz = 0.6;
      splash(f.qx[3], f.qy[3], 1);
      newWaypoint(f);
    }
  }

  function leapHeight(f) { return f.leap >= 0 ? Math.sin(Math.PI * clamp(f.leap, 0, 1)) : 0; }

  function tryEat(f, p) {
    var dx = p.x - f.qx[0], dy = p.y - f.qy[0], r = f.half * 0.9 + U * 0.012;
    if (dx * dx + dy * dy > r * r) { return; }
