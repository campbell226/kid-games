          tx = p.x - dx / d * standoff;
          ty = p.y - dy / d * standoff;
          face = p;
          zw = Math.max(zw, 0.45);
          if (f.hold > f.patience) { f.dared = true; }
        }
      }
      if (f.dared) { vw = U * 0.3; urg = 1; zw = pz; zRate = 1.4; }
      else if (near > 0.5) { zRate = 0.6; }
    } else if (f.mode === 'rush') {
      f.excite -= dt;
      if (f.excite <= 0) { f.mode = 'wander'; }
      tx = f.ex; ty = f.ey; vw = U * 0.2; zw = 0.08; urg = 0.7; zRate = 0.6;
    } else if (f.mode === 'finger' && f.finger && f.finger.alive) {
      var g = f.finger, gx = hx - g.x, gy = hy - g.y, gd = Math.sqrt(gx * gx + gy * gy) || 1e-6;
      // Each fish keeps the distance its trust allows: a tame one puts
      // its lips to your fingertip, a curious one hangs back and looks.
      var tame = t >= TAME;
      // Each keeps its own place round the finger, nudging along from its
      // neighbours, so a crowd of them opens out like the petals of a
      // flower with their noses in the middle, instead of piling up on
      // whichever side they came from.
      if (f.slotFinger !== g) { f.slotFinger = g; f.slotA = Math.atan2(gy, gx); }
      var cnt = 1, push = 0, o2;
      for (i = 0; i < fish.length; i++) {
        o2 = fish[i];
        if (o2 !== f && o2.mode === 'finger' && o2.slotFinger === g) { cnt++; }
      }
      var sep = TAU / Math.max(4, cnt);
      for (i = 0; i < fish.length; i++) {
        o2 = fish[i];
        if (o2 === f || o2.mode !== 'finger' || o2.slotFinger !== g) { continue; }
        var dA = wrapAngle(f.slotA - o2.slotA);
        if (Math.abs(dA) < sep) { push += (dA >= 0 ? 1 : -1) * (sep - Math.abs(dA)); }
      }
      f.slotA = wrapAngle(f.slotA + push * Math.min(1, dt * 1.5));
      var ring = tame ? Math.max(U * 0.022 + f.half * 0.3, cnt * U * 0.05 / TAU)
        : f.L * 0.6 + U * 0.3 * (TAME - t) / (TAME - CURIOUS);
      // It comes in along its own spoke, so its body trails out behind it
      // rather than back the way it happened to arrive. Off its spoke, it
      // first swims round to the outer end of it.
      var sx2 = Math.cos(f.slotA), sy2 = Math.sin(f.slotA);
      var along = gx * sx2 + gy * sy2, across = Math.abs(gx * sy2 - gy * sx2);
      var reach = across > f.L * 0.3 || along < ring * 0.5 ? ring + f.L * 0.9 : ring;
      tx = g.x + sx2 * reach; ty = g.y + sy2 * reach;
      vw = clamp((gd - ring) * 1.3, U * 0.01, U * 0.13);
      face = g; urg = 0.4;
      zw = tame ? 0.02 : lerp(0.55, 0.25, (t - CURIOUS) / (TAME - CURIOUS));
      zRate = 0.5;
      if (gd < ring + f.L * 0.6) { addTrust(f, 0.012 * f.k.learn * dt); }
      if (tame && gd < ring + f.half * 1.5 && f.z < 0.15) {
        f.kissT -= dt;
        if (f.kissT <= 0) { kiss(f); f.kissT = 0.6 + Math.random() * 1.2; }
      }
    } else {
      if (f.mode !== 'wander') { f.mode = 'wander'; newWaypoint(f); }
      f.wt -= dt;
      var wdx = f.wx - hx, wdy = f.wy - hy;
      if (wdx * wdx + wdy * wdy < f.L * f.L * 0.36 || f.wt <= 0) { newWaypoint(f); }
      if (f.hover > 0) {
        f.hover -= dt;
        tx = hx + Math.cos(f.a) * f.L; ty = hy + Math.sin(f.a) * f.L;
        vw = U * 0.008;
      } else {
        tx = f.wx; ty = f.wy; vw = f.cruise;
      }
    }

    // Which way it would like to go: towards its target, or, once it is
    // there, round to face whatever it is attending to.
    var ddx = tx - hx, ddy = ty - hy, dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1e-6;
    var ux = ddx / dd, uy = ddy / dd;
    if (face && dd < f.L * 0.4) {
      var fx = face.x - hx, fy = face.y - hy, fd = Math.sqrt(fx * fx + fy * fy) || 1e-6;
      ux = fx / fd; uy = fy / fd;
    }
    if (urg < 1) { vw = Math.min(vw, Math.max(U * 0.012, dd * 1.4)); }

    // Room for the others at the same depth; a fish well above or below
    // can pass over or under, as real ones do.
    var ax = 0, ay = 0;
    for (var j = 0; j < fish.length; j++) {
      var o = fish[j];
      if (o === f || Math.abs(o.z - f.z) > 0.3) { continue; }
      var rr = (f.L + o.L) * (f.mode === 'finger' && o.mode === 'finger' ? 0.13 : 0.2);
      for (var s = 0; s < N; s += 3) {
        var ox = hx - o.px[s], oy = hy - o.py[s], od = Math.sqrt(ox * ox + oy * oy);
        if (od < rr && od > 1e-6) { var w = 1 - od / rr; ax += ox / od * w; ay += oy / od * w; }
      }
    }
    // And the bank, felt for a little way ahead.
    var ed = edgeDist(hx, hy), wallR = f.L * 0.9;
    if (ed < wallR) { edgeNormal(hx, hy); ax += NX * (1 - ed / wallR) * 2.2; ay += NY * (1 - ed / wallR) * 2.2; }
    var lx = hx + Math.cos(f.a) * f.L * 0.7, ly = hy + Math.sin(f.a) * f.L * 0.7;
    if (edgeDist(lx, ly) < f.L * 0.35) { edgeNormal(lx, ly); ax += NX * 1.2; ay += NY * 1.2; }

    var want = Math.atan2(uy + ay * 1.3, ux + ax * 1.3);
    var turn = (1.1 + 2.6 * urg) * Math.sqrt(0.17 / f.k.len);
    var da = wrapAngle(want - f.a);
    f.a = wrapAngle(f.a + clamp(da, -turn * dt, turn * dt));
    // Turning on the spot still needs a little way on.
    if (Math.abs(da) > 0.3) { vw = Math.max(vw, U * 0.014); }
    var acc = U * (0.12 + 0.5 * urg);
    f.v += clamp(vw * (Math.abs(da) > 1.2 ? 0.6 : 1) - f.v, -acc * dt * 1.5, acc * dt);
    var spd = reduced ? 0.7 : 1;
    hx += Math.cos(f.a) * f.v * dt * spd;
    hy += Math.sin(f.a) * f.v * dt * spd;
    keepIn(hx, hy, U * 0.015);
    f.px[0] = KX; f.py[0] = KY;
    f.z += clamp(zw - f.z, -zRate * dt, zRate * dt);
    f.z = clamp(f.z, 0, 0.9);

    // The body follows the nose like a rope, which is what gives a fish
    // its curve through a turn.
    for (i = 1; i < N; i++) {
      var bx = f.px[i] - f.px[i - 1], by = f.py[i] - f.py[i - 1], bd = Math.sqrt(bx * bx + by * by) || 1e-6;
      f.px[i] = f.px[i - 1] + bx / bd * f.seg;
      f.py[i] = f.py[i - 1] + by / bd * f.seg;
    }

    // On top of that, the swimming wave running down to the tail: faster
    // and wider the harder it swims, and a flick through a sharp turn.
    var moving = clamp(f.v / (U * 0.15), 0, 1);
    f.phase += dt * TAU * (1 + 2.2 * moving) * (reduced ? 0.6 : 1);
    f.amp += ((0.3 + 0.7 * moving + Math.min(0.5, Math.abs(da) * 0.3)) - f.amp) * Math.min(1, dt * 3);
    f.finOpen += (clamp(1 - f.v / (U * 0.12), 0.15, 1) - f.finOpen) * Math.min(1, dt * 3);
    f.flap += dt * TAU * (1.2 + 1.6 * f.finOpen);
    if (f.gulp >= 0) { f.gulp += dt; if (f.gulp > 0.4) { f.gulp = -1; } }
    if (f.excite > 0 && f.mode !== 'rush') { f.excite -= dt; }

    shapeFish(f);
    if (f.target && !f.target.gone) { tryEat(f, f.target); }
  }

  // Where every point of the body actually is this frame, wave included,
  // and which way is sideways at each. Drawing and eating both use it.
  function shapeFish(f) {
    var amp = f.amp * f.L * 0.055 * (reduced ? 0.5 : 1);
    for (var i = 0; i < N; i++) {
      var a = i > 0 ? i - 1 : 0, b = i < N - 1 ? i + 1 : N - 1;
      var tx = f.px[a] - f.px[b], ty = f.py[a] - f.py[b], tl = Math.sqrt(tx * tx + ty * ty) || 1e-6;
      var nx = -ty / tl, ny = tx / tl, t = i / (N - 1);
      var off = Math.sin(f.phase - t * 4.2) * amp * (0.08 + 0.92 * Math.pow(t, 1.5));
      f.nx[i] = nx; f.ny[i] = ny;
      f.qx[i] = f.px[i] + nx * off;
      f.qy[i] = f.py[i] + ny * off;
    }
  }

  function tryEat(f, p) {
    var dx = p.x - f.qx[0], dy = p.y - f.qy[0], r = f.half * 0.9 + U * 0.008;
    if (dx * dx + dy * dy > r * r) { return; }
    var pz = p.z >= 1 ? 0.9 : p.z;
    if (Math.abs(f.z - pz) > (p.z < 0.05 ? 0.12 : 0.2)) { return; }
    eat(f, p);
  }

  function eat(f, p) {
    var top = p.z < 0.05, i;
    p.gone = true;
    f.target = null;
    f.dared = false;
    f.hold = 0;
    f.gulp = 0;
    addTrust(f, (top ? 0.065 : 0.045) * f.k.learn);
    gulpSound(p.x, top ? 1 : 0.35);
    if (top) { addRipple(p.x, p.y, U * 0.07, 1); }
    // The others learn from watching, the little one most of all, and it
    // is always watching from somewhere.
    for (i = 0; i < fish.length; i++) {
      var o = fish[i];
      if (o === f) { continue; }
      var ox = o.px[0] - p.x, oy = o.py[0] - p.y;
      if (ox * ox + oy * oy < U * U * 0.0625) { addTrust(o, 0.01 * o.k.learn); }
      if (o.k.shy) { addTrust(o, 0.002); }
    }
    if (f.k.shy && top && !f.firstTop) { f.firstTop = true; milestone(f); }
    // Still wary, it takes its prize and dashes off.
    if (f.trust < BRAVE) {
      var away = f.a + Math.PI + (Math.random() - 0.5) * 1.2, dist = U * (0.12 + 0.4 * (BRAVE - f.trust));
      if (f.k.shy) { keepIn(shyHome.x + (Math.random() - 0.5) * U * 0.08, shyHome.y + (Math.random() - 0.5) * U * 0.08, f.L); }
      else { keepIn(f.px[0] + Math.cos(away) * dist, f.py[0] + Math.sin(away) * dist, f.L); }
      f.rx = KX; f.ry = KY;
      f.retreat = 0.5 + (BRAVE - f.trust) * 2.5;
    }
  }

  // A tame fish at your fingertip, mouthing at it.
  function kiss(f) {
    f.gulp = 0;
    addRipple(f.qx[0], f.qy[0], U * 0.04, 0.7);
    kissSound(f.qx[0]);
    if (f.k.shy && !f.firstKiss) { f.firstKiss = true; milestone(f); }
  }

  // ------------------------------------------------------------------
  // Food. A tap throws a small handful, which lands a pellet at a time
  // around the spot. Most of it floats, so a fish has to come right up to
  // the top, near the hand, to take it. About a third sinks after a moment,
  // and that is all the little one dares to eat at first.
  // ------------------------------------------------------------------
  var pellets = [], MAXP = 60;
  var flowT = Math.random() * 100, CX = 0, CY = 0;

  // The surface turns slowly round the pond, with a meander on top.
  function current(x, y) {
    var k = reduced ? 0.5 : 1;
    CX = (-(y - PCY) * 0.012 + Math.sin(y / U * 5 + flowT * 0.3) * U * 0.004) * k;
    CY = ((x - PCX) * 0.012 + Math.sin(x / U * 4.3 - flowT * 0.27) * U * 0.004) * k;
  }

  // Floating things slide off lily pads rather than sitting on them.
  function offPads(o, gap) {
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i], dx = o.x - p.x, dy = o.y - p.y, d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
      var r = p.r + gap;
      if (d < r) { o.x = p.x + dx / d * r; o.y = p.y + dy / d * r; }
    }
  }

  function scatter(x, y) {
    keepIn(x, y, U * 0.05);
    x = KX; y = KY;
    var n = 5 + Math.floor(Math.random() * 2), i;
    for (i = 0; i < n; i++) {
      var a = Math.random() * TAU, r = U * (0.015 + Math.sqrt(Math.random()) * 0.06);
      keepIn(x + Math.cos(a) * r, y + Math.sin(a) * r, U * 0.035);
      var air = 0.12 + i * 0.045 + Math.random() * 0.06;
      pellets.push({
        x: KX, y: KY, fx: x, fy: y, z: 0, vx: 0, vy: 0, air: air, airMax: air,
        age: 0, sinkAt: Math.random() < 0.32 ? 1.2 + Math.random() * 2 : 22 + Math.random() * 10,
        sinking: false, bottom: 0, fade: 1, r: U * (0.009 + Math.random() * 0.002),
        tone: Math.random(), gone: false
      });
    }
    // Too much in the pond: what has lain longest on the bottom goes
    // first, then the oldest of the rest.
    while (pellets.length > MAXP) {
      var oldest = 0;
      for (i = 1; i < pellets.length; i++) {
        var a1 = pellets[i], a0 = pellets[oldest];
        if ((a1.z >= 1) > (a0.z >= 1) || ((a1.z >= 1) === (a0.z >= 1) && a1.age > a0.age)) { oldest = i; }
      }
      pellets.splice(oldest, 1);
    }
    lastFeed.x = x; lastFeed.y = y; lastFeed.age = 0;
    // A fish that trusts you has learned what a hand over the water means.
    for (i = 0; i < fish.length; i++) {
      var f = fish[i];
      if (f.trust > 0.6 && f.mode !== 'food' && f.retreat <= 0) {
        f.excite = 1.5; f.ex = x; f.ey = y;
        if (f.mode !== 'finger') { f.mode = 'rush'; }
      }
    }
  }

  function land(p) {
    offPads(p, U * 0.01);
    addRipple(p.x, p.y, U * 0.045, 0.8);
    plip(p.x, p.tone);
  }

  function updatePellets(dt) {
    for (var i = pellets.length - 1; i >= 0; i--) {
      var p = pellets[i];
      if (p.gone) { pellets.splice(i, 1); continue; }
      if (p.air > 0) {
        p.air -= dt;
        if (p.air <= 0) { land(p); }
        continue;
      }
      p.age += dt;
      if (!p.sinking) {
        current(p.x, p.y);
        p.vx += (CX - p.vx) * Math.min(1, dt * 0.8);
        p.vy += (CY - p.vy) * Math.min(1, dt * 0.8);
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        offPads(p, U * 0.008);
        if (p.age > p.sinkAt) { p.sinking = true; }
      } else if (p.z < 1) {
        p.z = Math.min(1, p.z + dt * 0.12);
        p.x += p.vx * dt * (1 - p.z);
        p.y += p.vy * dt * (1 - p.z);
      } else {
        // It lies on the bottom a while and then softens away.
        p.bottom += dt;
        if (p.bottom > 25) { p.fade -= dt / 5; }
        if (p.fade <= 0) { p.gone = true; }
      }
      keepIn(p.x, p.y, U * 0.03);
      p.x = KX; p.y = KY;
    }
  }

  // ------------------------------------------------------------------
  // Ripples. Every pellet, every gulp, every finger in the water and
  // every raindrop sends one out, and the bigger ones push floating
  // things aside as they pass, so a handful of food spreads itself out.
  // ------------------------------------------------------------------
  var ripples = [];

  function addRipple(x, y, size, strength) {
    ripples.push({ x: x, y: y, r: 0, max: size, life: 0, dur: 0.8 + size / U * 10, a: strength });
    if (ripples.length > 90) { ripples.shift(); }
  }

  function pushBy(o, rp, k, dt) {
    var dx = o.x - rp.x, dy = o.y - rp.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-6 || Math.abs(d - rp.r) > U * 0.012) { return; }
    var f = rp.a * (1 - rp.life / rp.dur) * U * k * dt;
    o.vx += dx / d * f;
    o.vy += dy / d * f;
  }

  function updateRipples(dt) {
    for (var i = ripples.length - 1; i >= 0; i--) {
      var rp = ripples[i];
      rp.life += dt;
      if (rp.life >= rp.dur) { ripples.splice(i, 1); continue; }
      var u = rp.life / rp.dur;
      rp.r = rp.max * (1 - (1 - u) * (1 - u));
      if (rp.a < 0.5) { continue; }
      var j;
      for (j = 0; j < pellets.length; j++) {
        var p = pellets[j];
        if (p.air <= 0 && !p.sinking) { pushBy(p, rp, 0.9, dt); }
      }
      for (j = 0; j < petals.length; j++) { pushBy(petals[j], rp, 0.9, dt); }
      for (j = 0; j < pads.length; j++) { pushBy(pads[j], rp, 0.05, dt); }
    }
  }

  // ------------------------------------------------------------------
  // Blossom petals afloat, turning slowly in the current.
  // ------------------------------------------------------------------
  var petals = [];

  function spawnPetals() {
    petals = [];
    var PINK = ['#f7c6d4', '#f9d7e1', '#f2b3c6', '#fbe4ea'];
    for (var i = 0; i < 9; i++) {
      keepIn(PX0 + Math.random() * (PX1 - PX0), PY0 + Math.random() * (PY1 - PY0), U * 0.04);
      petals.push({
        x: KX, y: KY, vx: 0, vy: 0, rot: Math.random() * TAU, spin: (Math.random() - 0.5) * 0.5,
        size: U * (0.008 + Math.random() * 0.005), col: PINK[i % PINK.length]
      });
    }
  }

  function updatePetals(dt) {
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      current(p.x, p.y);
      p.vx += (CX - p.vx) * Math.min(1, dt * 0.6);
      p.vy += (CY - p.vy) * Math.min(1, dt * 0.6);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += (p.spin + (Math.abs(p.vx) + Math.abs(p.vy)) / U * 2) * dt * (reduced ? 0.4 : 1);
      offPads(p, U * 0.006);
      keepIn(p.x, p.y, U * 0.03);
      p.x = KX; p.y = KY;
    }
  }

  // Each pad is held by its stem: it drifts when pushed and comes back.
  function updatePads(dt) {
    for (var i = 0; i < pads.length; i++) {
      var p = pads[i];
      p.dx = p.x - p.ax; p.dy = p.y - p.ay;
      p.vx += (-p.dx * 0.8 - p.vx * 1.2) * dt;
      p.vy += (-p.dy * 0.8 - p.vy * 1.2) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt * (reduced ? 0.4 : 1);
      p.dip *= Math.exp(-dt * 3);
    }
  }

  // ------------------------------------------------------------------
  // Rain, during the grey spell: drops all over the surface.
  // ------------------------------------------------------------------
  var rainAcc = 0;

  function updateRain(dt) {
    if (mood.rain < 0.02) { rainAcc = 0; return; }
    rainAcc += dt * 20 * mood.rain * (reduced ? 0.5 : 1);
    while (rainAcc >= 1) {
      rainAcc -= 1;
      var x = PX0 + Math.random() * (PX1 - PX0), y = PY0 + Math.random() * (PY1 - PY0);
      if (edgeDist(x, y) < U * 0.01) { continue; }
      addRipple(x, y, U * (0.014 + Math.random() * 0.02), 0.28);
      if (Math.random() < 0.3) { rainDrop(x); }
    }
  }

  // A glitter round the little one, the first time it eats from the top
  // and the first time it kisses your finger. The parent's cue to say so.
  var sparkles = [];

  function milestone(f) {
    var x = f.qx[0], y = f.qy[0];
    for (var i = 0; i < 10; i++) {
      var a = i / 10 * TAU + Math.random() * 0.4, r = U * (0.03 + Math.random() * 0.05);
      sparkles.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, life: 0, dur: 1.4 + Math.random() * 0.8, size: U * (0.008 + Math.random() * 0.008) });
    }
    addRipple(x, y, U * 0.12, 1);
    chime(x);
  }

  function updateSparkles(dt) {
    for (var i = sparkles.length - 1; i >= 0; i--) {
      sparkles[i].life += dt;
      if (sparkles[i].life > sparkles[i].dur) { sparkles.splice(i, 1); }
    }
  }

  // ------------------------------------------------------------------
  // Drawing. From the bottom up: the bed of the pond, the light on it,
  // the colour of the water, shadows, the fish from deepest to highest,
  // then everything on the surface, and the bank over the edge of it all.
  // ------------------------------------------------------------------
  var SUNX = 0.55, SUNY = 0.83, lowPower = false;
  var causT = Math.random() * 100, skyT = Math.random() * 100;
  var order = [];

  KINDS.forEach(function (k) {
    k.bodyC = hex(k.body);
    k.finC = hex(k.fin);
    k.netC = k.net ? hex(k.net) : null;
    (k.patches || []).forEach(function (p) { p[5] = hex(p[4]); });
  });

  // How wide a koi is along its length, seen from above: a blunt round
  // head, broad shoulders, and a long taper to the root of the tail.
  function girthAt(t) {
    if (t < 0.25) { return 0.6 + 0.4 * Math.sin(t / 0.25 * Math.PI / 2); }
    return 1 - Math.pow((t - 0.25) / 0.75, 1.5) * 0.8;
  }
  var GIRTH = [];
  for (var gi = 0; gi < N; gi++) { GIRTH.push(girthAt(gi / (N - 1))); }

  var LXa = new Float64Array(N), LYa = new Float64Array(N), RXa = new Float64Array(N), RYa = new Float64Array(N);

  // A point on the fish's own body, left in BX, BY, with BA the way the
  // body is pointing there.
  var BX = 0, BY = 0, BA = 0;
  function bodyAt(f, t, s) {
    var u = clamp(t, 0, 1) * (N - 1), i = Math.min(N - 2, Math.floor(u)), r = u - i;
    var x = f.qx[i] + (f.qx[i + 1] - f.qx[i]) * r, y = f.qy[i] + (f.qy[i + 1] - f.qy[i]) * r;
    var nx = f.nx[i] + (f.nx[i + 1] - f.nx[i]) * r, ny = f.ny[i] + (f.ny[i + 1] - f.ny[i]) * r;
    var w = f.half * girthAt(t) * s;
    BX = x + nx * w; BY = y + ny * w;
    BA = Math.atan2(f.qy[i] - f.qy[i + 1], f.qx[i] - f.qx[i + 1]);
  }

  function bodyPath(f) {
    var i, h = f.half;
    for (i = 0; i < N; i++) {
      var w = h * GIRTH[i];
      LXa[i] = f.qx[i] + f.nx[i] * w; LYa[i] = f.qy[i] + f.ny[i] * w;
      RXa[i] = f.qx[i] - f.nx[i] * w; RYa[i] = f.qy[i] - f.ny[i] * w;
    }
    var fx = f.qx[0] - f.qx[1], fy = f.qy[0] - f.qy[1], fl = Math.sqrt(fx * fx + fy * fy) || 1;
    fx /= fl; fy /= fl;
    f.tipX = f.qx[0] + fx * h * 0.5;
    f.tipY = f.qy[0] + fy * h * 0.5;
    ctx.moveTo(f.tipX, f.tipY);
    ctx.quadraticCurveTo(LXa[0] + fx * h * 0.4, LYa[0] + fy * h * 0.4, LXa[0], LYa[0]);
    for (i = 1; i < N - 1; i++) {
      ctx.quadraticCurveTo(LXa[i], LYa[i], (LXa[i] + LXa[i + 1]) / 2, (LYa[i] + LYa[i + 1]) / 2);
    }
    ctx.lineTo(LXa[N - 1], LYa[N - 1]);
    ctx.lineTo(RXa[N - 1], RYa[N - 1]);
    for (i = N - 2; i >= 1; i--) {
      ctx.quadraticCurveTo(RXa[i], RYa[i], (RXa[i] + RXa[i - 1]) / 2, (RYa[i] + RYa[i - 1]) / 2);
    }
    ctx.lineTo(RXa[0], RYa[0]);
    ctx.quadraticCurveTo(RXa[0] + fx * h * 0.4, RYa[0] + fy * h * 0.4, f.tipX, f.tipY);
    ctx.closePath();
  }

  // The tail fin, swinging a beat behind the body. The long-finned ones
  // trail a much bigger, softer one.
  function tailPath(f) {
    var e = N - 1, bx = f.qx[e], by = f.qy[e], k = f.k;
    var len = f.L * (k.longFins ? 0.4 : 0.27), spread = k.longFins ? 0.5 : 0.42;
    var base = Math.atan2(f.qy[e] - f.qy[e - 1], f.qx[e] - f.qx[e - 1]);
    base += Math.sin(f.phase - 5.2) * 0.3 * f.amp * (reduced ? 0.5 : 1);
    var w0 = f.half * 0.2, nx = -Math.sin(base), ny = Math.cos(base);
    var lag = k.longFins ? Math.sin(f.phase - 6) * 0.15 : 0;
    ctx.moveTo(bx + nx * w0, by + ny * w0);
    ctx.quadraticCurveTo(bx + Math.cos(base + spread * 1.2) * len * 0.55, by + Math.sin(base + spread * 1.2) * len * 0.55,
      bx + Math.cos(base + spread + lag) * len, by + Math.sin(base + spread + lag) * len);
    ctx.quadraticCurveTo(bx + Math.cos(base + spread * 0.35) * len * 0.8, by + Math.sin(base + spread * 0.35) * len * 0.8,
      bx + Math.cos(base) * len * 0.55, by + Math.sin(base) * len * 0.55);
    ctx.quadraticCurveTo(bx + Math.cos(base - spread * 0.35) * len * 0.8, by + Math.sin(base - spread * 0.35) * len * 0.8,
      bx + Math.cos(base - spread + lag) * len, by + Math.sin(base - spread + lag) * len);
    ctx.quadraticCurveTo(bx + Math.cos(base - spread * 1.2) * len * 0.55, by + Math.sin(base - spread * 1.2) * len * 0.55,
      bx - nx * w0, by - ny * w0);
    ctx.closePath();
  }

  // A pair of fins at one place along the body. They spread wide while
  // the fish hangs still, sculling, and fold back along its sides when it
  // swims hard.
  function finPair(f, i, len, wid) {
    var fx = f.qx[i - 1] - f.qx[i + 1], fy = f.qy[i - 1] - f.qy[i + 1], fl = Math.sqrt(fx * fx + fy * fy) || 1;
    fx /= fl; fy /= fl;
    for (var side = -1; side <= 1; side += 2) {
      var w = f.half * GIRTH[i] * 0.8;
      var bx = f.qx[i] + f.nx[i] * w * side, by = f.qy[i] + f.ny[i] * w * side;
      var open = 0.25 + 0.5 * f.finOpen + (reduced ? 0 : Math.sin(f.flap + side * 0.7) * 0.18 * f.finOpen);
      var dx = f.nx[i] * side * open - fx * (1 - open), dy = f.ny[i] * side * open - fy * (1 - open);
      var dl = Math.sqrt(dx * dx + dy * dy) || 1;
      dx /= dl; dy /= dl;
      // A rounded paddle: out along its leading edge, round the end,
      // and back along the trailing edge to the body.
      var px = dy * side, py = -dx * side;
      if (px * fx + py * fy < 0) { px = -px; py = -py; }
      var ex = bx + dx * len, ey = by + dy * len;
      ctx.moveTo(bx + fx * len * 0.12, by + fy * len * 0.12);
      ctx.quadraticCurveTo(bx + dx * len * 0.55 + px * wid, by + dy * len * 0.55 + py * wid, ex + px * wid * 0.4, ey + py * wid * 0.4);
      ctx.quadraticCurveTo(ex + dx * wid * 0.5, ey + dy * wid * 0.5, ex - px * wid * 0.35, ey - py * wid * 0.35);
      ctx.quadraticCurveTo(bx + dx * len * 0.45 - px * wid * 0.5, by + dy * len * 0.45 - py * wid * 0.5, bx - fx * len * 0.15, by - fy * len * 0.15);
      ctx.closePath();
    }
  }

  function shadowStrength() { return clamp(0.45 + mood.caus * 2.4, 0.4, 1); }

  function drawFishShadow(f) {
    var off = (1 - f.z) * U * 0.045 + U * 0.004;
    ctx.save();
    ctx.translate(SUNX * off, SUNY * off);
    ctx.fillStyle = 'rgba(8,24,22,' + ((0.15 + 0.1 * f.z) * shadowStrength()).toFixed(3) + ')';
    ctx.beginPath();
    bodyPath(f);
    tailPath(f);
    ctx.fill();
    ctx.restore();
  }

  function drawFish(f) {
    var k = f.k, z = f.z, tint = 0.06 + 0.58 * z, deep = mood.deep, i;
    var s = 1 + 0.1 * (1 - z), cx = f.qx[4], cy = f.qy[4];
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.translate(-cx, -cy);

    // Fins, under the body, translucent.
    var finA = 0.72 - 0.25 * z;
    ctx.fillStyle = rgba(mix(k.finC, deep, tint), finA);
    ctx.beginPath();
    tailPath(f);
    finPair(f, 2, f.L * (k.longFins ? 0.25 : 0.17), f.half * (k.longFins ? 0.75 : 0.62));
    finPair(f, 5, f.L * (k.longFins ? 0.13 : 0.09), f.half * 0.38);
    ctx.fill();

    // The body, with its colours laid on inside its outline.
    ctx.fillStyle = rgba(mix(k.bodyC, deep, tint));
    ctx.beginPath();
    bodyPath(f);
    ctx.fill();
    ctx.save();
    ctx.clip();
    if (k.patches) {
      // Each patch is a main blob with two smaller ones overlapping it
      // off-centre, so the colour comes out in ragged islands the way it
      // does on a real koi, not in polka dots.
      for (i = 0; i < k.patches.length; i++) {
        var p = k.patches[i];
        ctx.fillStyle = rgba(mix(p[5], deep, tint));
        ctx.beginPath();
        for (var b = 0; b < 3; b++) {
          var bt = p[0] + (b === 1 ? p[2] * 0.7 : b === 2 ? -p[2] * 0.55 : 0);
          var bs = p[1] + (b === 1 ? 0.3 : b === 2 ? -0.35 : 0);
          var bk2 = b ? (b === 1 ? 0.62 : 0.55) : 1;
          bodyAt(f, bt, bs);
          ctx.moveTo(BX + Math.cos(BA) * p[2] * f.body * bk2, BY + Math.sin(BA) * p[2] * f.body * bk2);
          ctx.ellipse(BX, BY, p[2] * f.body * bk2, p[3] * f.half * bk2, BA, 0, TAU);
        }
        ctx.fill();
      }
    }
    if (k.netC) {
      // The scales, each edged darker, in a net down the back.
      ctx.strokeStyle = rgba(mix(k.netC, deep, tint), k.metal ? 0.3 : 0.5);
      ctx.lineWidth = Math.max(0.6, f.half * 0.07);
      ctx.beginPath();
      var row = 0;
      for (var t = 0.18; t < 0.86; t += 0.075, row++) {
        for (var sc = -0.75 + (row % 2) * 0.15; sc <= 0.8; sc += 0.3) {
          bodyAt(f, t, sc);
          var r = f.half * 0.2;
          ctx.moveTo(BX + Math.cos(BA + Math.PI - 1.1) * r, BY + Math.sin(BA + Math.PI - 1.1) * r);
          ctx.arc(BX, BY, r, BA + Math.PI - 1.1, BA + Math.PI + 1.1);
        }
      }
      ctx.stroke();
    }
    // Light along the back and shade down the flanks give it roundness.
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,' + ((k.metal ? 0.3 : 0.13) * (1 - 0.6 * z)).toFixed(3) + ')';
    ctx.lineWidth = f.half * 0.75;
    ctx.beginPath();
    ctx.moveTo(f.qx[1], f.qy[1]);
    for (i = 2; i < 7; i++) { ctx.lineTo(f.qx[i], f.qy[i]); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(10,20,20,0.2)';
    ctx.lineWidth = f.half * 0.35;
    ctx.beginPath();
    bodyPath(f);
    ctx.stroke();
    ctx.restore();

    // The dorsal fin, a ridge down the middle of the back.
    ctx.strokeStyle = rgba(mix(k.finC, mix(deep, [20, 20, 20], 0.5), 0.35 + tint * 0.5), 0.35);
    ctx.lineWidth = Math.max(1, f.half * (k.longFins ? 0.32 : 0.22));
    ctx.beginPath();
    ctx.moveTo(f.qx[2], f.qy[2]);
    for (i = 3; i < 7; i++) { ctx.lineTo(f.qx[i], f.qy[i]); }
    ctx.stroke();

    // Eyes, set on either side of the head.
    var eye = rgba(mix([20, 22, 24], deep, tint * 0.6));
    for (var e = -1; e <= 1; e += 2) {
      bodyAt(f, 0.13, 0.7 * e);
      ctx.fillStyle = eye;
      ctx.beginPath();
      ctx.arc(BX, BY, Math.max(1, f.half * 0.14), 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.7 * (1 - z)).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(BX + f.half * 0.04, BY - f.half * 0.04, Math.max(0.5, f.half * 0.06), 0, TAU);
      ctx.fill();
    }

    // The mouth opens round as it gulps.
    if (f.gulp >= 0) {
      var o = Math.sin(Math.PI * clamp(f.gulp / 0.4, 0, 1));
      ctx.fillStyle = rgba(mix(k.bodyC, [255, 210, 200], 0.4));
      ctx.beginPath();
      ctx.arc(f.tipX, f.tipY, f.half * 0.42 * o, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(40,20,25,0.85)';
      ctx.beginPath();
      ctx.arc(f.tipX, f.tipY, f.half * 0.27 * o, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function pelletAirPos(p) {
    var u = 1 - clamp(p.air / p.airMax, 0, 1);
    return { x: lerp(p.fx, p.x, u), y: lerp(p.fy, p.y, u), h: Math.sin(Math.PI * u) * 0.5 + (1 - u) * 0.6 };
  }

  function drawPellet(x, y, r, col, a) {
    ctx.fillStyle = rgba(col, a);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,225,170,' + (a * 0.6).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.4, 0, TAU);
    ctx.fill();
  }

  var PELLET = hex('#a8622c');

  function drawShadows() {
    var k = shadowStrength(), i, off = U * 0.045;
    ctx.fillStyle = 'rgba(8,24,22,' + (0.26 * k).toFixed(3) + ')';
    ctx.beginPath();
    for (i = 0; i < pads.length; i++) {
      var p = pads[i];
      ctx.moveTo(p.x + SUNX * off + p.r, p.y + SUNY * off);
      ctx.arc(p.x + SUNX * off, p.y + SUNY * off, p.r, 0, TAU);
    }
    for (i = 0; i < pellets.length; i++) {
      var q = pellets[i];
      if (q.sinking || q.gone) { continue; }
      var x = q.x, y = q.y, h = 0;
      if (q.air > 0) { var a = pelletAirPos(q); x = a.x; y = a.y; h = a.h; }
      var o2 = off * (1 + h * 3);
      ctx.moveTo(x + SUNX * o2 + q.r, y + SUNY * o2);
      ctx.arc(x + SUNX * o2, y + SUNY * o2, q.r, 0, TAU);
    }
    ctx.fill();
    for (i = 0; i < fish.length; i++) { drawFishShadow(fish[i]); }
  }

  function drawWater(dt) {
    ctx.drawImage(bottomCanvas, 0, 0, W, H);
    causT += dt * (reduced ? 0.25 : 1);
    if (mood.caus > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      causticLayer(patA, U * 0.34, causT * U * 0.012, causT * U * 0.007, mood.caus * 0.9);
      if (!lowPower) { causticLayer(patB, U * 0.47, -causT * U * 0.009, causT * U * 0.011, mood.caus * 0.7); }
      ctx.restore();
    }
    // The colour of the water itself: deep in the middle, clear in the
    // shallows, so the bottom fades from sight towards the centre.
    var g = ctx.createRadialGradient(PCX, PCY, 0, PCX, PCY, Math.max(PX1 - PX0, PY1 - PY0) * 0.6);
    g.addColorStop(0, rgba(mood.deep, 0.8));
    g.addColorStop(0.55, rgba(mix(mood.deep, mood.shallow, 0.5), 0.6));
    g.addColorStop(1, rgba(mood.shallow, 0.4));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function causticLayer(pat, tile, ox, oy, a) {
    var sc = tile / 192;
    ctx.globalAlpha = a;
    ctx.save();
    ctx.translate(ox % tile, oy % tile);
    ctx.scale(sc, sc);
    ctx.fillStyle = pat;
    ctx.fillRect(-tile / sc, -tile / sc, (W + tile * 2) / sc, (H + tile * 2) / sc);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // The sky on the surface: a sheen across it and the reflections of
  // clouds going slowly over.
  var CLOUDS = [
    { x: 0.1, y: 0.3, w: 0.5, h: 0.18, v: 0.006 },
    { x: 0.6, y: 0.7, w: 0.6, h: 0.2, v: 0.004 },
    { x: 0.9, y: 0.15, w: 0.4, h: 0.14, v: 0.005 }
  ];

  function drawSky(dt) {
    var g = ctx.createLinearGradient(PX0, PY0, PX1, PY1);
    g.addColorStop(0, rgba(mood.sky, mood.skyA * 1.4));
    g.addColorStop(0.45, rgba(mood.sky, 0));
    g.addColorStop(1, rgba(mood.sky, mood.skyA * 0.6));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < (lowPower ? 0 : CLOUDS.length); i++) {
      var c = CLOUDS[i];
      c.x += c.v * dt * (reduced ? 0.3 : 1);
      if (c.x - c.w > 1.1) { c.x = -c.w; }
      var cx = PX0 + c.x * (PX1 - PX0), cy = PY0 + (c.y + c.x * 0.3) % 1 * (PY1 - PY0);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(0.3);
      ctx.scale(c.w * U, c.h * U);
      var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      cg.addColorStop(0, rgba(mood.sky, mood.skyA * 0.9));
      cg.addColorStop(1, rgba(mood.sky, 0));
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawRipples() {
    var lw = Math.max(1, U * 0.0028);
    ctx.lineWidth = lw;
    for (var i = 0; i < ripples.length; i++) {
      var rp = ripples[i], u = rp.life / rp.dur, a = rp.a * Math.pow(1 - u, 1.5);
      if (rp.r < 1 || a < 0.01) { continue; }
      ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.55).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, TAU);
      if (rp.max > U * 0.04 && rp.r * 0.62 > lw * 2) {
        ctx.moveTo(rp.x + rp.r * 0.62, rp.y);
        ctx.arc(rp.x, rp.y, rp.r * 0.62, 0, TAU);
      }
      ctx.stroke();
      if (rp.r > lw * 3) {
        ctx.strokeStyle = 'rgba(10,30,30,' + (a * 0.22).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r - lw * 1.5, 0, TAU);
        ctx.stroke();
      }
    }
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    var s = p.size;
    ctx.fillStyle = 'rgba(8,24,22,0.15)';
    ctx.beginPath();
    ctx.ellipse(s * 0.5, s * 0.7, s, s * 0.7, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = p.col;
    ctx.beginPath();
    ctx.moveTo(-s, 0);
    ctx.quadraticCurveTo(-s * 0.4, -s * 0.8, s * 0.7, -s * 0.45);
    ctx.lineTo(s * 0.45, 0);
    ctx.lineTo(s * 0.7, s * 0.45);
    ctx.quadraticCurveTo(-s * 0.4, s * 0.8, -s, 0);
    ctx.fill();
    ctx.restore();
  }

  function drawPad(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    var r = p.r * (1 - p.dip * 0.05), cut = 0.2;
    var g = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
    g.addColorStop(0, p.hue < 0.5 ? '#79a64e' : '#73a352');
    g.addColorStop(1, p.hue < 0.5 ? '#4d7a33' : '#4a7838');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, cut, TAU - cut);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(160,200,110,0.6)';
    ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(40,70,30,0.35)';
    ctx.lineWidth = Math.max(0.7, U * 0.0018);
    ctx.beginPath();
    for (var a = cut + 0.35; a < TAU - cut - 0.2; a += 0.42) {
      ctx.moveTo(r * 0.05, 0);
      ctx.lineTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawFlower(p, t) {
    var a = p.rot + 2.2, d = p.r * 0.4;
    var x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d, s = U * 0.034;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot + (reduced ? 0 : Math.sin(t * 0.7 + p.hue * 6) * 0.06));
    ctx.fillStyle = 'rgba(8,24,22,0.2)';
    ctx.beginPath();
    ctx.arc(s * 0.25, s * 0.35, s * 0.85, 0, TAU);
    ctx.fill();
    for (var layer = 0; layer < 2; layer++) {
      var n = layer ? 6 : 8, len = s * (layer ? 0.7 : 1), wid = s * (layer ? 0.24 : 0.28);
      ctx.fillStyle = layer ? '#fbe3ec' : '#f1aec4';
      for (var i = 0; i < n; i++) {
        var pa = i / n * TAU + layer * 0.4;
        var cx = Math.cos(pa), cy = Math.sin(pa);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(cx * len * 0.5 - cy * wid, cy * len * 0.5 + cx * wid, cx * len, cy * len);
        ctx.quadraticCurveTo(cx * len * 0.5 + cy * wid, cy * len * 0.5 - cx * wid, 0, 0);
        ctx.fill();
      }
    }
    ctx.fillStyle = '#f5c443';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#e09a22';
    for (var k = 0; k < 7; k++) {
      ctx.beginPath();
      ctx.arc(Math.cos(k * 0.9) * s * 0.12, Math.sin(k * 0.9) * s * 0.12, s * 0.035, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFingers() {
    for (var id in fingers) {
      if (!fingers.hasOwnProperty(id)) { continue; }
      var g = fingers[id], a = clamp(g.held / 0.35, 0, 1), r = U * 0.035;
      if (a <= 0) { continue; }
      var rg = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, r);
      rg.addColorStop(0, 'rgba(255,255,255,' + (0.22 * a).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(g.x, g.y, r, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.4 * a).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, U * 0.003);
      ctx.beginPath();
      ctx.arc(g.x, g.y, r * 0.7, 0, TAU);
      ctx.stroke();
    }
  }

  function drawSparkles() {
    ctx.fillStyle = '#fff7d6';
    for (var i = 0; i < sparkles.length; i++) {
      var s = sparkles[i], u = s.life / s.dur, k = Math.sin(Math.PI * u), r = s.size * k;
      if (r < 0.3) { continue; }
      ctx.globalAlpha = k;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - r);
      ctx.quadraticCurveTo(s.x, s.y, s.x + r, s.y);
      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y + r);
      ctx.quadraticCurveTo(s.x, s.y, s.x - r, s.y);
      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y - r);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  var drawClock = 0;

  function draw(dt) {
    drawClock += dt;
    var i, p;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    drawWater(dt);
    drawShadows();

    // What has sunk, faded by the depth of water over it.
    for (i = 0; i < pellets.length; i++) {
      p = pellets[i];
      if (!p.sinking || p.gone) { continue; }
      drawPellet(p.x, p.y, p.r * (1 - 0.2 * p.z), mix(PELLET, mood.deep, 0.2 + 0.45 * p.z), p.fade);
    }

    if (order.length !== fish.length) { order = fish.slice(); }
    order.sort(function (a, b) { return b.z - a.z; });
    for (i = 0; i < order.length; i++) { drawFish(order[i]); }

    drawSky(dt);
    drawRipples();

    for (i = 0; i < pellets.length; i++) {
      p = pellets[i];
      if (p.sinking || p.gone) { continue; }
      if (p.air > 0) {
        var a = pelletAirPos(p);
        drawPellet(a.x, a.y, p.r * (1 + a.h * 0.8), PELLET, 1);
      } else {
        drawPellet(p.x, p.y + (reduced ? 0 : Math.sin(drawClock * 2 + p.tone * 6) * U * 0.0006), p.r, PELLET, 1);
      }
    }
    for (i = 0; i < petals.length; i++) { drawPetal(petals[i]); }
    for (i = 0; i < pads.length; i++) { drawPad(pads[i]); }
    for (i = 0; i < pads.length; i++) { if (pads[i].flower) { drawFlower(pads[i], drawClock); } }
    drawFrog();
    drawFingers();
    drawSparkles();
    ctx.drawImage(bankCanvas, 0, 0, W, H);
    if (mood.gradeA > 0.002) {
      ctx.fillStyle = rgba(mood.grade, mood.gradeA);
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ------------------------------------------------------------------
  // A frog lives on the lily pads. It turns to look when food lands near
  // it, croaks if you tap it, and every so often turns to face another
  // pad and hops across to it, landing with a bob and a ripple.
  // ------------------------------------------------------------------
  var frog = {
    pad: 1, x: 0, y: 0, a: Math.PI * 0.8, aw: Math.PI * 0.8, state: 'sit', t: 0,
    next: 25 + Math.random() * 20, to: 0, sx: 0, sy: 0, dur: 1, h: 0,
    blink: 3, blinkV: 1, croak: -1, croakNext: 12 + Math.random() * 12
  };

  // Where on a pad the frog sits: off to the side away from the flower.
  function seat(i) {
    var p = pads[i];
    if (!p.flower) { KX = p.x; KY = p.y; return; }
    var a = p.rot + 2.2 + Math.PI;
    KX = p.x + Math.cos(a) * p.r * 0.3;
    KY = p.y + Math.sin(a) * p.r * 0.3;
  }

  function frogLook(x, y) {
    if (frog.state !== 'sit') { return; }
    var dx = x - frog.x, dy = y - frog.y;
    if (dx * dx + dy * dy < U * U * 0.16) { frog.aw = Math.atan2(dy, dx); }
  }

  function frogCroak() {
    if (frog.croak >= 0) { return; }
    frog.croak = 0;
    croakSound(frog.x);
  }

  function frogHit(x, y) {
    var dx = x - frog.x, dy = y - frog.y;
    return dx * dx + dy * dy < U * U * 0.0036;
  }

  function updateFrog(dt) {
    var f = frog;
    f.blink -= dt;
    if (f.blink <= 0) { f.blink = 2 + Math.random() * 5; f.blinkV = 0; }
    f.blinkV = Math.min(1, f.blinkV + dt * 6);
    if (f.croak >= 0) { f.croak += dt; if (f.croak > 0.7) { f.croak = -1; } }

    if (f.state === 'sit') {
      seat(f.pad);
      f.x = KX; f.y = KY;
      f.a += clamp(wrapAngle(f.aw - f.a), -2 * dt, 2 * dt);
      f.croakNext -= dt;
      if (f.croakNext <= 0) { frogCroak(); f.croakNext = 15 + Math.random() * 25; }
      f.next -= dt;
      if (f.next <= 0 && !reduced) {
        // Pick another pad, nearer ones more often.
        var best = -1, bs = Infinity;
        for (var i = 0; i < pads.length; i++) {
          if (i === f.pad) { continue; }
          var dx = pads[i].x - f.x, dy = pads[i].y - f.y;
          var s = Math.sqrt(dx * dx + dy * dy) * (0.5 + Math.random());
          if (s < bs) { bs = s; best = i; }
        }
        f.to = best;
        seat(best);
        f.aw = Math.atan2(KY - f.y, KX - f.x);
        f.state = 'turn';
      } else if (f.next <= 0) {
        f.next = 30;
      }
    } else if (f.state === 'turn') {
      seat(f.pad);
      f.x = KX; f.y = KY;
      seat(f.to);
      f.aw = Math.atan2(KY - f.y, KX - f.x);
      var da = wrapAngle(f.aw - f.a);
      f.a += clamp(da, -2.4 * dt, 2.4 * dt);
      if (Math.abs(da) < 0.05) { f.state = 'crouch'; f.t = 0; }
    } else if (f.state === 'crouch') {
      seat(f.pad);
      f.x = KX; f.y = KY;
      f.t += dt;
      if (f.t > 0.3) {
        f.state = 'jump'; f.t = 0; f.sx = f.x; f.sy = f.y;
        seat(f.to);
        var jd = Math.sqrt((KX - f.x) * (KX - f.x) + (KY - f.y) * (KY - f.y));
        f.dur = 0.5 + jd / U * 0.6;
        pads[f.pad].dip = 0.6;
      }
    } else if (f.state === 'jump') {
      f.t += dt;
      var u = clamp(f.t / f.dur, 0, 1);
      seat(f.to);
      f.x = lerp(f.sx, KX, u);
      f.y = lerp(f.sy, KY, u);
      f.h = Math.sin(Math.PI * u);
      if (u >= 1) {
        f.state = 'sit'; f.h = 0; f.pad = f.to;
        var p = pads[f.pad];
        p.dip = 1;
        p.vx += Math.cos(f.a) * U * 0.03;
        p.vy += Math.sin(f.a) * U * 0.03;
        addRipple(p.x, p.y, p.r * 1.7, 0.7);
        plop(p.x);
        f.next = 40 + Math.random() * 60;
        f.aw = f.a + (Math.random() - 0.5) * 1.5;
      }
    }
  }

  function drawFrog() {
    var f = frog, FL = U * 0.058, s = 1 + f.h * 0.45, jumping = f.state === 'jump';
    var crouch = f.state === 'crouch' ? 0.12 : 0;
    // Shadow: under it on the pad while it sits, out across the water
    // while it is in the air.
    var off = U * (0.006 + f.h * 0.06);
    ctx.save();
    ctx.translate(f.x + SUNX * off, f.y + SUNY * off);
    ctx.rotate(f.a);
    ctx.fillStyle = 'rgba(8,24,22,' + (0.25 * shadowStrength()).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(-FL * 0.05, 0, FL * (jumping ? 0.6 : 0.45), FL * 0.33, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.a);
    ctx.scale(s * (1 - crouch), s * (1 + crouch * 0.5));
    var leg = '#4f8a32', dark = '#3d6e27';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = leg;
    for (var e = -1; e <= 1; e += 2) {
      ctx.lineWidth = FL * 0.12;
      ctx.beginPath();
      if (jumping) {
        // Back legs flung out straight behind.
        ctx.moveTo(-FL * 0.25, e * FL * 0.15);
        ctx.lineTo(-FL * 0.65, e * FL * 0.24);
        ctx.lineTo(-FL * 1.0, e * FL * 0.22);
      } else {
        // Folded under it, knees forward, ready to go.
        ctx.moveTo(-FL * 0.25, e * FL * 0.17);
        ctx.lineTo(FL * 0.03, e * FL * 0.42);
        ctx.lineTo(-FL * 0.36, e * FL * 0.46);
      }
      ctx.stroke();
      var fx = jumping ? -FL * 1.0 : -FL * 0.36, fy = jumping ? e * FL * 0.22 : e * FL * 0.46;
      ctx.fillStyle = dark;
      ctx.beginPath();
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx - FL * 0.2, fy + e * FL * 0.1);
      ctx.lineTo(fx - FL * 0.22, fy - e * FL * 0.04);
      ctx.closePath();
      ctx.fill();
      // Front legs.
      ctx.lineWidth = FL * 0.08;
      ctx.beginPath();
      ctx.moveTo(FL * 0.18, e * FL * 0.15);
      ctx.lineTo(jumping ? FL * 0.5 : FL * 0.34, e * FL * (jumping ? 0.2 : 0.3));
      ctx.stroke();
    }
    // Vocal sacs swell out at the sides of the head: rib, bit.
    if (f.croak >= 0) {
      var sac = Math.max(0, Math.sin(Math.PI * clamp(f.croak / 0.7, 0, 1) * 2));
      ctx.fillStyle = '#e8efc4';
      for (e = -1; e <= 1; e += 2) {
        ctx.beginPath();
        ctx.arc(FL * 0.28, e * FL * 0.24, FL * 0.15 * sac + 0.1, 0, TAU);
        ctx.fill();
      }
    }
    var bg = ctx.createRadialGradient(FL * 0.05, -FL * 0.08, FL * 0.05, 0, 0, FL * 0.45);
    bg.addColorStop(0, '#86bf4f');
    bg.addColorStop(1, '#5c9636');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.ellipse(-FL * 0.06, 0, FL * 0.38, FL * 0.27, 0, 0, TAU);
    ctx.moveTo(FL * 0.48, 0);
    ctx.ellipse(FL * 0.26, 0, FL * 0.22, FL * 0.23, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(50,90,30,0.55)';
    ctx.beginPath();
    ctx.ellipse(-FL * 0.18, FL * 0.06, FL * 0.07, FL * 0.05, 0.4, 0, TAU);
    ctx.moveTo(-FL * 0.02, -FL * 0.08);
    ctx.ellipse(-FL * 0.06, -FL * 0.08, FL * 0.06, FL * 0.045, -0.3, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(190,225,130,0.7)';
    ctx.lineWidth = FL * 0.035;
    ctx.beginPath();
    ctx.moveTo(FL * 0.2, -FL * 0.16); ctx.quadraticCurveTo(-FL * 0.1, -FL * 0.21, -FL * 0.36, -FL * 0.12);
    ctx.moveTo(FL * 0.2, FL * 0.16); ctx.quadraticCurveTo(-FL * 0.1, FL * 0.21, -FL * 0.36, FL * 0.12);
    ctx.stroke();
    // Eyes on top of the head, gold with a dark bar, and lids that blink.
    var bk = reduced ? 1 : clamp(f.blinkV, 0.05, 1);
    for (e = -1; e <= 1; e += 2) {
      ctx.fillStyle = '#5c9636';
      ctx.beginPath();
      ctx.arc(FL * 0.3, e * FL * 0.14, FL * 0.1, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#e6bf3c';
      ctx.beginPath();
      ctx.ellipse(FL * 0.31, e * FL * 0.15, FL * 0.075, FL * 0.075 * bk, 0, 0, TAU);
      ctx.fill();
      if (bk > 0.3) {
        ctx.fillStyle = '#1c1a14';
        ctx.beginPath();
        ctx.ellipse(FL * 0.31, e * FL * 0.15, FL * 0.025, FL * 0.06 * bk, 0, 0, TAU);
        ctx.fill();
      }
    }
    ctx.fillStyle = '#2c4a1c';
    ctx.beginPath();
    ctx.arc(FL * 0.45, -FL * 0.045, FL * 0.015, 0, TAU);
    ctx.arc(FL * 0.45, FL * 0.045, FL * 0.015, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // Sound, all synthesised, so the game is never silent and never waits
  // on a download. A slow, soft pad; now and then a plucked note, like a
  // koto heard from across a garden; and the pond itself: a plip for every
  // pellet, a bloop for every gulp, the tiny kiss of a fish at your finger,
  // the frog, and rain when it comes.
  //
  // Everything melodic is drawn from one pentatonic scale, so a handful of
  // food landing makes a little tune and nothing can clash.
  // ------------------------------------------------------------------
  var AC = null, master = null, verb = null, padBus = null, fxBus = null, noise = null;
  var rainGain = null, nextChord = 0, chordIdx = 0, nextPluck = 0, lastPlip = 0, lastGulp = 0, lastKiss = 0;
  var SCALE = [0, 2, 4, 7, 9];
  var CHORDS = [
    [43, 50, 59, 62],   // G, with the third on top
    [40, 47, 55, 62],   // E minor seventh
    [36, 43, 52, 59],   // C major seventh
    [38, 45, 54, 57]    // D, open
  ];
  var CHORD_LEN = 18, CHORD_GAP = 12;

  function note(base, i) {
    var oct = Math.floor(i / 5), d = ((i % 5) + 5) % 5;
    return base + SCALE[d] + 12 * oct;
  }

  function pan(x) {
    return clamp((x / W - 0.5) * 1.2, -0.7, 0.7);
  }

  // Routes a voice through a panner if the browser has one.
  function out(node, x, bus) {
    if (AC.createStereoPanner && x !== undefined) {
      var p = AC.createStereoPanner();
      p.pan.setValueAtTime(pan(x), AC.currentTime);
      node.connect(p);
      p.connect(bus);
    } else {
      node.connect(bus);
    }
  }

  function noiseBuffer(secs) {
    var len = Math.floor(AC.sampleRate * secs), buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) { d[i] = Math.random() * 2 - 1; }
    return buf;
  }

  function impulse(secs, decay) {
    var len = Math.floor(AC.sampleRate * secs), buf = AC.createBuffer(2, len, AC.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    }
    return buf;
  }

  function initAudio() {
    if (AC) {
      if (AC.state === 'suspended' && !document.hidden) { AC.resume(); }
      return;
    }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { return; }
    try { AC = new Ctx(); } catch (e) { AC = null; return; }
    var t = AC.currentTime;

    // Some older Safaris only unlock once a buffer has actually played.
    var blip = AC.createBufferSource();
    blip.buffer = AC.createBuffer(1, 1, AC.sampleRate);
    blip.connect(AC.destination);
    blip.start(0);

    var comp = AC.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-18, t);
    comp.ratio.setValueAtTime(4, t);
    comp.connect(AC.destination);

    master = AC.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(0.6, t + 3);
    master.connect(comp);

    verb = AC.createConvolver();
    verb.buffer = impulse(3, 2.6);
    var verbOut = AC.createGain();
    verbOut.gain.setValueAtTime(0.45, t);
    verb.connect(verbOut);
    verbOut.connect(master);

    padBus = AC.createGain();
    padBus.gain.setValueAtTime(0.38, t);
    var padLp = AC.createBiquadFilter();
    padLp.type = 'lowpass';
    padLp.frequency.setValueAtTime(800, t);
    padBus.connect(padLp);
    padLp.connect(master);
    padLp.connect(verb);

    // The pond's own sounds, a little dry and a little in the reverb.
    fxBus = AC.createGain();
    fxBus.gain.setValueAtTime(1, t);
    fxBus.connect(master);
    var fxWet = AC.createGain();
    fxWet.gain.setValueAtTime(0.35, t);
    fxBus.connect(fxWet);
    fxWet.connect(verb);

    // Rain: only the top of the noise, a soft hiss, and silent unless it
    // is actually raining.
    noise = noiseBuffer(3);
    var src = AC.createBufferSource();
    src.buffer = noise;
    src.loop = true;
    var hp = AC.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(2500, t);
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(7000, t);
    rainGain = AC.createGain();
    rainGain.gain.setValueAtTime(0.0001, t);
    src.connect(hp);
    hp.connect(lp);
    lp.connect(rainGain);
    rainGain.connect(master);
    src.start(t);

    nextChord = t + 0.5;
    nextPluck = t + 4 + Math.random() * 4;
    if (AC.state === 'suspended') { AC.resume(); }
  }

  function live() { return AC && master && AC.state === 'running'; }

  // Pure tones only, as in Murmuration: a sine and a quiet one an octave
  // up. Anything richer beats against itself on the low notes and hums.
  function padNote(t, midi, len) {
    var f = mtof(midi), g = AC.createGain(), level = midi < 45 ? 0.15 : 0.12;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(level, t + len * 0.35);
    g.gain.setValueAtTime(level, t + len * 0.55);
    g.gain.linearRampToValueAtTime(0.0001, t + len);
    g.connect(padBus);
    [[1, 1], [2, 0.2]].forEach(function (v) {
      var o = AC.createOscillator(), og = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * v[0], t);
      og.gain.setValueAtTime(v[1], t);
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + len + 0.1);
    });
  }

  // A plucked string: a sharp start with a touch of brightness that dies
  // away first, leaving a round tone that rings on.
  function pluck(t, midi, level, x, bus) {
    var f = mtof(midi), g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(level, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    out(g, x, bus || fxBus);
    [[1, 1, 2.6], [2, 0.35, 0.7], [3, 0.12, 0.3]].forEach(function (v) {
      var o = AC.createOscillator(), og = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * v[0] * 1.01, t);
      o.frequency.exponentialRampToValueAtTime(f * v[0], t + 0.05);
      og.gain.setValueAtTime(v[1], t);
      og.gain.exponentialRampToValueAtTime(0.0001, t + v[2]);
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + v[2] + 0.05);
    });
  }

  function scheduleMusic() {
    if (!live()) { return; }
    var now = AC.currentTime;
    if (nextChord < now) { nextChord = now + 0.1; }
    if (nextPluck < now) { nextPluck = now + 1 + Math.random() * 3; }
    while (nextChord < now + 0.5) {
      var ch = CHORDS[chordIdx % CHORDS.length];
      for (var k = 0; k < ch.length; k++) { padNote(nextChord, ch[k], CHORD_LEN); }
      chordIdx += 1;
      nextChord += CHORD_GAP;
    }
    if (nextPluck < now + 0.5) {
      var i = 5 + Math.floor(Math.random() * 6);
      pluck(nextPluck, note(55, i), 0.07, W * Math.random(), padBus);
      if (Math.random() < 0.4) { pluck(nextPluck + 0.35, note(55, i + (Math.random() < 0.5 ? 1 : -2)), 0.05, W * Math.random(), padBus); }
      nextPluck += 5 + Math.random() * 7;
    }
  }
  setInterval(scheduleMusic, 250);

  // A pellet landing: the rising "plip" of a drop, at a note of the scale.
  function plip(x, tone) {
    if (!live()) { return; }
    var t = Math.max(AC.currentTime + 0.005, lastPlip + 0.03);
    lastPlip = t;
    var f = mtof(note(79, Math.floor(tone * 6)));
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * 0.7, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.2);
  }

  // A gulp at the surface: a round, low bloop. Deeper down, a softer one.
  function gulpSound(x, k) {
    if (!live()) { return; }
    var t = AC.currentTime + 0.01;
    if (t - lastGulp < 0.08) { return; }
    lastGulp = t;
    var f = 170 + Math.random() * 60;
    var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 2.3, t + 0.09);
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(400 + 1600 * k, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32 * k, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(lp);
    lp.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.2);
  }

  function kissSound(x) {
    if (!live()) { return; }
    var t = AC.currentTime + 0.01;
    if (t - lastKiss < 0.22) { return; }
    lastKiss = t;
    var f = 420 + Math.random() * 120;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 1.8, t + 0.05);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.12);
  }

  // The little one's moments: four notes rising, gently.
  function chime(x) {
    if (!live()) { return; }
    var t = AC.currentTime + 0.05;
    for (var i = 0; i < 4; i++) { pluck(t + i * 0.16, note(67, 2 + i), 0.11, x); }
  }

  function plop(x) {
    if (!live()) { return; }
    var t = AC.currentTime + 0.01;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(260, t);
    o.frequency.exponentialRampToValueAtTime(130, t + 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.22);
  }

  // Rib-bit: two short buzzy pulses, the second a touch higher.
  function croakSound(x) {
    if (!live()) { return; }
    var t0 = AC.currentTime + 0.02;
    [[0, 1], [0.2, 1.12]].forEach(function (b) {
      var t = t0 + b[0], dur = 0.13;
      var o = AC.createOscillator(), bp = AC.createBiquadFilter(), g = AC.createGain();
      var am = AC.createOscillator(), amg = AC.createGain(), pulse = AC.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(135 * b[1], t);
      o.frequency.linearRampToValueAtTime(115 * b[1], t + dur);
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(750, t);
      bp.Q.setValueAtTime(2, t);
      // The buzz: the sound switched on and off thirty times a second,
      // inside the envelope so it stops when the croak does.
      am.type = 'square';
      am.frequency.setValueAtTime(32, t);
      amg.gain.setValueAtTime(0.5, t);
      pulse.gain.setValueAtTime(0.5, t);
      am.connect(amg);
      amg.connect(pulse.gain);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.015);
      g.gain.setValueAtTime(0.16, t + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(bp);
      bp.connect(pulse);
      pulse.connect(g);
      out(g, x, fxBus);
      o.start(t); o.stop(t + dur + 0.02);
      am.start(t); am.stop(t + dur + 0.02);
    });
  }

  function rainDrop(x) {
    if (!live()) { return; }
    var t = AC.currentTime + Math.random() * 0.05;
    var f = 1400 + Math.random() * 1600;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * 0.6, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.025);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.025, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g);
    out(g, x, fxBus);
    o.start(t);
    o.stop(t + 0.1);
  }

  var soundClock = 0;
  function updateSound(dt) {
    soundClock += dt;
    if (soundClock < 0.1 || !AC || !rainGain) { return; }
    soundClock = 0;
    rainGain.gain.setTargetAtTime(0.0001 + 0.05 * mood.rain, AC.currentTime, 0.5);
  }

  // ------------------------------------------------------------------
  // A turned screen keeps everything where it was, in proportion.
  // ------------------------------------------------------------------
  function rescaleWorld(o) {
    var sx = (PX1 - PX0) / Math.max(1, o.x1 - o.x0), sy = (PY1 - PY0) / Math.max(1, o.y1 - o.y0), k = U / o.u, i, j;
    function mx(x) { return PX0 + (x - o.x0) * sx; }
    function my(y) { return PY0 + (y - o.y0) * sy; }
    for (i = 0; i < fish.length; i++) {
      var f = fish[i];
      setSize(f);
      for (j = 0; j < N; j++) { f.px[j] = mx(f.px[j]); f.py[j] = my(f.py[j]); }
      keepIn(f.px[0], f.py[0], U * 0.015);
      f.px[0] = KX; f.py[0] = KY;
      for (j = 1; j < N; j++) {
        var bx = f.px[j] - f.px[j - 1], by = f.py[j] - f.py[j - 1], bd = Math.sqrt(bx * bx + by * by) || 1e-6;
        f.px[j] = f.px[j - 1] + bx / bd * f.seg;
        f.py[j] = f.py[j - 1] + by / bd * f.seg;
      }
      f.wx = mx(f.wx); f.wy = my(f.wy); f.rx = mx(f.rx); f.ry = my(f.ry); f.ex = mx(f.ex); f.ey = my(f.ey);
      f.v *= k;
      shapeFish(f);
    }
    for (i = 0; i < pellets.length; i++) {
      var p = pellets[i];
      p.x = mx(p.x); p.y = my(p.y); p.fx = mx(p.fx); p.fy = my(p.fy); p.r *= k; p.vx *= k; p.vy *= k;
    }
    for (i = 0; i < petals.length; i++) {
      petals[i].x = mx(petals[i].x); petals[i].y = my(petals[i].y); petals[i].size *= k;
    }
    lastFeed.x = mx(lastFeed.x); lastFeed.y = my(lastFeed.y);
    ripples = [];
    sparkles = [];
    for (var id in fingers) { if (fingers.hasOwnProperty(id)) { fingers[id].alive = false; } }
    fingers = {};
  }

  // ------------------------------------------------------------------
  // Fingers. A tap throws food. A finger left on the glass is a hand in
  // the water: it sends out a slow ripple now and then, the fish that
  // trust you come to it, and a finger drawn across the pond leaves a
  // wake that the tame ones follow.
  // ------------------------------------------------------------------
  function updateFingers(dt) {
    for (var id in fingers) {
      if (!fingers.hasOwnProperty(id)) { continue; }
      var g = fingers[id];
      g.held += dt;
      if (g.held > 0.35) {
        g.rip -= dt;
        if (g.rip <= 0) { addRipple(g.x, g.y, U * 0.06, 0.5); g.rip = 1.3; }
      }
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    var x = e.clientX, y = e.clientY;
    fingers[e.pointerId] = { x: x, y: y, held: 0, alive: true, rip: 0, trail: 0 };
    if (frogHit(x, y)) { frogCroak(); }
    frogLook(x, y);
    scatter(x, y);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not every browser */ }
  });
  canvas.addEventListener('pointermove', function (e) {
    var g = fingers[e.pointerId];
    if (!g) { return; }
    var dx = e.clientX - g.x, dy = e.clientY - g.y;
    g.trail += Math.sqrt(dx * dx + dy * dy);
    g.x = e.clientX; g.y = e.clientY;
    if (g.trail > U * 0.035) {
      g.trail = 0;
      if (edgeDist(g.x, g.y) > 0) { addRipple(g.x, g.y, U * 0.035, 0.5); }
    }
  });
  function lift(e) {
    var g = fingers[e.pointerId];
    if (g) { g.alive = false; }
    delete fingers[e.pointerId];
  }
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  canvas.addEventListener('lostpointercapture', lift);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // A phone will not make a sound until a finger has asked for one, and
  // on some it has to be the lifting of the finger that asks.
  ['touchend', 'pointerup', 'click'].forEach(function (name) {
    document.addEventListener(name, initAudio, true);
  });

  document.addEventListener('visibilitychange', function () {
    if (!AC) { return; }
    if (document.hidden) { AC.suspend(); }
    else { AC.resume(); }
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 220);
  });

  // ------------------------------------------------------------------
  // Frame loop
  // ------------------------------------------------------------------
  var last = 0, sizeCheck = 0;

  function frame(now) {
    var dt = last ? (now - last) / 1000 : 0.016;
    last = now;
    dt = clamp(dt, 0.001, 0.05);
    // Some browsers report no size at all while the page first loads, and
    // do not always say when they find one. So every half second the pond
    // checks for itself whether the screen is the size it was dug for.
    sizeCheck += dt;
    if (sizeCheck > 0.5) {
      sizeCheck = 0;
      if (Math.abs(window.innerWidth - W) > 1 || Math.abs(window.innerHeight - H) > 1) {
        clearTimeout(resizeTimer);
        layout();
      }
    }
    var t0 = window.performance ? performance.now() : 0;
    update(dt);
    draw(dt);
    updateSound(dt);
    // If the device is struggling, the second layer of dancing light and
    // the cloud reflections are let go rather than the fish stuttering. A
    // single huge frame is the browser busy elsewhere, so it is left out.
    var work = window.performance ? performance.now() - t0 : 0;
    if (!lowPower && window.performance && !document.hidden && work < 60) {
      workSum += work;
      workFrames += 1;
      if (workFrames >= 120) {
        slowWindows = workSum / workFrames > 12 ? slowWindows + 1 : 0;
        if (slowWindows >= 2) { lowPower = true; }
        workSum = 0; workFrames = 0;
      }
    }
    requestAnimationFrame(frame);
  }
  var workSum = 0, workFrames = 0, slowWindows = 0;

  function update(dt) {
    var i;
    updateMood(dt);
    flowT += dt;
    lastFeed.age += dt;
    updateFingers(dt);
    updatePellets(dt);
    for (i = 0; i < fish.length; i++) {
      var f = fish[i];
      f.think -= dt;
      if (f.think <= 0) { f.think = 0.25; think(f); }
      steer(f, dt);
    }
    updateRipples(dt);
    updatePads(dt);
    updatePetals(dt);
    updateRain(dt);
    updateSparkles(dt);
    updateFrog(dt);
  }

  updateMood(0);
  layout();
  spawnFish();
  spawnPetals();
  seat(frog.pad);
  frog.x = KX; frog.y = KY;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
