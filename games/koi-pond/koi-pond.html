<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2f4029">
<title>Koi Pond</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2f4029;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #pond {
    display: block;
    position: fixed; left: 0; top: 0;
    width: 100%; height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<script>
// Full screen on the first touch, and a way back if it is off.
//
// A browser will not do this by itself: the request has to come out of a
// gesture the browser counts as user activation, and that list is fussier
// than it looks. pointerdown only counts when the pointer is a mouse - on
// a touchscreen it grants nothing at all, which is why listening for it
// worked on a laptop and did nothing whatever on a tablet. For a finger it
// is pointerup and touchend that count.
//
// Once full screen is on, the automatic asking stops, so leaving it stays
// left. But leaving it used to mean reloading to get it back, so there is
// now a small button at the top of the screen that is only there while
// full screen is off, and takes itself away the moment it is on.
//
// An iPhone ignores the lot, because Safari there gives full screen to
// video and nothing else, so no button is offered. That is what the home
// screen tags above are for.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#40563a" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

<canvas id="pond" aria-label="Koi Pond"></canvas>

<script>
// A garden pond seen from above, with eight koi in it. A tap scatters a
// handful of food, and the fish come for it.
//
// What the game is quietly about is trust. Every fish starts out wary of
// the hand above the water, and each learns at its own pace that the hand
// is kind. A wary fish waits at a distance, darts in for a pellet and
// darts away again; a fish that trusts you comes straight up to the top,
// gulps beside your finger and stays. The little white one under the
// lily pads is the shyest of all. At first it will only take what sinks
// to the bottom near its hiding place, and only once the big ones have
// gone. It does come round, in the end, but only by being fed gently, again
// and again, and never any faster than it wants to.
(function () {
  'use strict';

  var canvas = document.getElementById('pond');
  var ctx = canvas.getContext('2d', { alpha: false });
  var TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function wrapAngle(a) {
    while (a > Math.PI) { a -= TAU; }
    while (a < -Math.PI) { a += TAU; }
    return a;
  }

  // The same scenery every time for the same screen, so turning a tablet
  // round does not dig a different pond.
  function seeded(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = reduceQuery.matches;
  if (reduceQuery.addEventListener) {
    reduceQuery.addEventListener('change', function (e) { reduced = e.matches; });
  }

  function hex(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a === undefined ? 1 : a) + ')';
  }

  // ------------------------------------------------------------------
  // The light goes slowly round a day: a fresh morning, full sun with the
  // light dancing on the bottom, a golden afternoon, then a grey spell
  // with a shower of rain, and round to morning again. Each row is the
  // colour of the deep water, of the shallows, how bright the dancing
  // light is, the sky reflected on the surface, and a wash over all of it.
  // ------------------------------------------------------------------
  var MOODS = [
    { deep: '#1f4a4a', shallow: '#6b9a84', caus: 0.17, sky: '#d8ecf0', skyA: 0.1, grade: '#fff2d6', gradeA: 0.04, rain: 0 },
    { deep: '#16505c', shallow: '#62ab9f', caus: 0.26, sky: '#e8f6ff', skyA: 0.13, grade: '#ffffff', gradeA: 0, rain: 0 },
    { deep: '#33473a', shallow: '#93945f', caus: 0.2, sky: '#ffdcaa', skyA: 0.12, grade: '#ffb35c', gradeA: 0.08, rain: 0 },
    { deep: '#2a4144', shallow: '#73887f', caus: 0.06, sky: '#dfe5e8', skyA: 0.08, grade: '#55636c', gradeA: 0.1, rain: 1 }
  ].map(function (m) {
    return {
      deep: hex(m.deep), shallow: hex(m.shallow), caus: m.caus, sky: hex(m.sky), skyA: m.skyA,
      grade: hex(m.grade), gradeA: m.gradeA, rain: m.rain
    };
  });

  var MOOD_SEG = 55;
  // Never open on the rain: start somewhere in the morning or the sun.
  var moodClock = Math.random() * MOOD_SEG * 1.5;
  var mood = {};

  function updateMood(dt) {
    var lap = MOOD_SEG * MOODS.length;
    moodClock = (moodClock + dt) % lap;
    var k = Math.floor(moodClock / MOOD_SEG);
    var f = smooth((moodClock - k * MOOD_SEG) / MOOD_SEG);
    var a = MOODS[k], b = MOODS[(k + 1) % MOODS.length];
    mood.deep = mix(a.deep, b.deep, f);
    mood.shallow = mix(a.shallow, b.shallow, f);
    mood.caus = lerp(a.caus, b.caus, f);
    mood.sky = mix(a.sky, b.sky, f);
    mood.skyA = lerp(a.skyA, b.skyA, f);
    mood.grade = mix(a.grade, b.grade, f);
    mood.gradeA = lerp(a.gradeA, b.gradeA, f);
    // The shower comes and goes inside the grey spell rather than
    // starting the moment the sky begins to cloud over.
    var r = lerp(a.rain, b.rain, f);
    mood.rain = smooth(clamp((r - 0.35) / 0.5, 0, 1));
  }

  // ------------------------------------------------------------------
  // The pond is a rounded rectangle inside a mossy bank. Everything that
  // swims or floats is kept inside it by asking how far a point is from
  // the edge: positive in the water, negative on the bank.
  // ------------------------------------------------------------------
  var W = 1, H = 1, U = 1, DPR = 1;
  var BANK = 0, CR = 0;
  var PX0 = 0, PY0 = 0, PX1 = 1, PY1 = 1, PCX = 0, PCY = 0;

  function edgeDist(x, y) {
    var hx = (PX1 - PX0) / 2 - CR, hy = (PY1 - PY0) / 2 - CR;
    var qx = Math.abs(x - PCX) - hx, qy = Math.abs(y - PCY) - hy;
    var ox = Math.max(qx, 0), oy = Math.max(qy, 0);
    return CR - (Math.sqrt(ox * ox + oy * oy) + Math.min(Math.max(qx, qy), 0));
  }

  // Which way is into the water from here. Left in NX, NY rather than
  // returned, because it is asked many times a frame.
  var NX = 0, NY = 0;
  function edgeNormal(x, y) {
    var gx = edgeDist(x + 1, y) - edgeDist(x - 1, y);
    var gy = edgeDist(x, y + 1) - edgeDist(x, y - 1);
    var m = Math.sqrt(gx * gx + gy * gy) || 1;
    NX = gx / m; NY = gy / m;
  }

  // Pushes a point back into the water so that it is at least `keep`
  // from the edge. Returns true if it had to.
  var KX = 0, KY = 0;
  function keepIn(x, y, keep) {
    var d = edgeDist(x, y);
    KX = x; KY = y;
    if (d >= keep) { return false; }
    edgeNormal(x, y);
    KX = x + NX * (keep - d);
    KY = y + NY * (keep - d);
    return true;
  }

  // ------------------------------------------------------------------
  // Scenery that does not move is painted once into two hidden canvases
  // whenever the screen changes shape: the bottom of the pond, and the
  // bank with a hole cut in it where the water is. Each frame then only
  // has to lay the moving things between them.
  // ------------------------------------------------------------------
  var edgePts = [], bankCanvas = null, bottomCanvas = null;
  var causticA = null, causticB = null, patA = null, patB = null;

  function makeCanvas() {
    var c = document.createElement('canvas');
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    var g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return c;
  }

  function edgePath(g) {
    g.beginPath();
    g.moveTo(edgePts[0], edgePts[1]);
    for (var i = 2; i < edgePts.length; i += 2) { g.lineTo(edgePts[i], edgePts[i + 1]); }
    g.closePath();
  }

  // The water's edge, walked round the rounded rectangle and then pushed
  // out a little and unevenly, so it reads as a dug pond and not a tray.
  // The wobble only ever goes outwards, so nothing kept inside the
  // rectangle can be seen over the bank.
  function buildEdge() {
    var pts = [], s = Math.max(4, U * 0.012), rnd = seeded(3), i;
    var x0 = PX0 + CR, x1 = PX1 - CR, y0 = PY0 + CR, y1 = PY1 - CR;
    function line(ax, ay, bx, by) {
      var n = Math.max(1, Math.round(Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay)) / s));
      for (var k = 0; k < n; k++) { pts.push(ax + (bx - ax) * k / n, ay + (by - ay) * k / n); }
    }
    function arc(cx, cy, a0) {
      var n = Math.max(2, Math.round(CR * Math.PI / 2 / s));
      for (var k = 0; k < n; k++) {
        var a = a0 + Math.PI / 2 * k / n;
        pts.push(cx + Math.cos(a) * CR, cy + Math.sin(a) * CR);
      }
    }
    line(x0, PY0, x1, PY0); arc(x1, y0, -Math.PI / 2);
    line(PX1, y0, PX1, y1); arc(x1, y1, 0);
    line(x1, PY1, x0, PY1); arc(x0, y1, Math.PI / 2);
    line(PX0, y1, PX0, y0); arc(x0, y0, Math.PI);
    var n = pts.length / 2, p1 = rnd() * TAU, p2 = rnd() * TAU;
    for (i = 0; i < n; i++) {
      edgeNormal(pts[2 * i], pts[2 * i + 1]);
      var w = U * (0.008 + 0.005 * Math.sin(i * TAU * 5 / n + p1) + 0.003 * Math.sin(i * TAU * 13 / n + p2) + rnd() * 0.002);
      pts[2 * i] -= NX * w;
      pts[2 * i + 1] -= NY * w;
    }
    edgePts = pts;
  }

  function buildBottom() {
    bottomCanvas = makeCanvas();
    var g = bottomCanvas.getContext('2d'), rnd = seeded(5), i, k;
    var reach = Math.max(PX1 - PX0, PY1 - PY0) * 0.62;
    var rg = g.createRadialGradient(PCX, PCY, 0, PCX, PCY, reach);
    rg.addColorStop(0, '#59604a');
    rg.addColorStop(0.6, '#8a8463');
    rg.addColorStop(1, '#b4a77f');
    g.fillStyle = rg;
    g.fillRect(0, 0, W, H);

    // Soft mottling, so the deep middle is not one flat colour.
    for (i = 0; i < 40; i++) {
      g.fillStyle = rnd() < 0.5 ? 'rgba(40,50,35,0.1)' : 'rgba(200,190,150,0.08)';
      g.beginPath();
      g.ellipse(PX0 + rnd() * (PX1 - PX0), PY0 + rnd() * (PY1 - PY0), U * (0.05 + rnd() * 0.1), U * (0.03 + rnd() * 0.06), rnd() * 3, 0, TAU);
      g.fill();
    }

    // Pebbles, thickest in the shallows round the edge.
    var PEB = ['#9d958a', '#7d776d', '#b9ae98', '#6c6a5e', '#a38c70', '#8a8f86'];
    for (i = 0; i < 520; i++) {
      var x = PX0 + rnd() * (PX1 - PX0), y = PY0 + rnd() * (PY1 - PY0);
      var d = edgeDist(x, y);
      if (d < -U * 0.01 || rnd() > 0.2 + 0.8 * (1 - clamp(d / (U * 0.22), 0, 1))) { continue; }
      var r = U * (0.004 + rnd() * rnd() * 0.012);
      var rot = rnd() * 3;
      g.fillStyle = PEB[Math.floor(rnd() * PEB.length)];
      g.beginPath();
      g.ellipse(x, y, r, r * (0.6 + rnd() * 0.35), rot, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(255,250,235,0.18)';
      g.beginPath();
      g.ellipse(x - r * 0.25, y - r * 0.25, r * 0.45, r * 0.3, rot, 0, TAU);
      g.fill();
    }

    // A few big stones sunk in the deep part.
    for (i = 0; i < 4; i++) {
      var sx = PX0 + (0.2 + rnd() * 0.6) * (PX1 - PX0), sy = PY0 + (0.2 + rnd() * 0.6) * (PY1 - PY0);
      var sr = U * (0.035 + rnd() * 0.035);
      g.fillStyle = 'rgba(30,38,30,0.35)';
      g.beginPath();
      g.ellipse(sx + sr * 0.15, sy + sr * 0.2, sr * 1.05, sr * 0.8, 0.3, 0, TAU);
      g.fill();
      var sg = g.createRadialGradient(sx - sr * 0.3, sy - sr * 0.3, sr * 0.1, sx, sy, sr);
      sg.addColorStop(0, '#7d8070');
      sg.addColorStop(1, '#4c5145');
      g.fillStyle = sg;
      g.beginPath();
      for (k = 0; k < 10; k++) {
        var a = k / 10 * TAU, rr = sr * (0.85 + rnd() * 0.2);
        if (k === 0) { g.moveTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr * 0.8); }
        else { g.lineTo(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr * 0.8); }
      }
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(110,140,80,0.35)';
      g.beginPath();
      g.ellipse(sx - sr * 0.2, sy - sr * 0.25, sr * 0.5, sr * 0.3, 0.4, 0, TAU);
      g.fill();
    }

    // Weed growing up from the bottom, lying over in the current.
    g.lineCap = 'round';
    for (i = 0; i < 6; i++) {
      var wx = PX0 + (0.1 + rnd() * 0.8) * (PX1 - PX0), wy = PY0 + (0.1 + rnd() * 0.8) * (PY1 - PY0);
      if (edgeDist(wx, wy) < U * 0.05) { continue; }
      var lean = rnd() * TAU;
      for (k = 0; k < 9; k++) {
        var la = lean + (rnd() - 0.5) * 1.2, len = U * (0.04 + rnd() * 0.06);
        g.strokeStyle = rnd() < 0.5 ? 'rgba(52,84,44,0.55)' : 'rgba(70,104,52,0.5)';
        g.lineWidth = Math.max(1, U * (0.003 + rnd() * 0.003));
        g.beginPath();
        g.moveTo(wx, wy);
        g.quadraticCurveTo(wx + Math.cos(la + 0.5) * len * 0.5, wy + Math.sin(la + 0.5) * len * 0.5,
          wx + Math.cos(la) * len, wy + Math.sin(la) * len);
        g.stroke();
      }
    }

    // Two or three old leaves on the bottom.
    for (i = 0; i < 5; i++) {
      var lx = PX0 + rnd() * (PX1 - PX0), ly = PY0 + rnd() * (PY1 - PY0), lr = U * (0.012 + rnd() * 0.008);
      if (edgeDist(lx, ly) < U * 0.03) { continue; }
      g.save();
      g.translate(lx, ly);
      g.rotate(rnd() * TAU);
      g.fillStyle = 'rgba(110,80,45,0.55)';
      g.beginPath();
      g.ellipse(0, 0, lr * 1.6, lr * 0.7, 0, 0, TAU);
      g.fill();
      g.strokeStyle = 'rgba(70,50,30,0.5)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(-lr * 1.6, 0);
      g.lineTo(lr * 1.6, 0);
      g.stroke();
      g.restore();
    }
  }

  function drawStone(g, x, y, r, rnd) {
    var k, pts = [];
    for (k = 0; k < 9; k++) {
      var a = k / 9 * TAU, rr = r * (0.82 + rnd() * 0.3);
      pts.push(Math.cos(a) * rr, Math.sin(a) * rr * (0.75 + 0.1 * rnd()));
    }
    function shape(ox, oy) {
      g.beginPath();
      for (k = 0; k < pts.length; k += 2) {
        var mx = (pts[k] + pts[(k + 2) % pts.length]) / 2, my = (pts[k + 1] + pts[(k + 3) % pts.length]) / 2;
        if (k === 0) { g.moveTo(x + ox + mx, y + oy + my); }
        g.quadraticCurveTo(x + ox + pts[(k + 2) % pts.length], y + oy + pts[(k + 3) % pts.length],
          x + ox + (pts[(k + 2) % pts.length] + pts[(k + 4) % pts.length]) / 2,
          y + oy + (pts[(k + 3) % pts.length] + pts[(k + 5) % pts.length]) / 2);
      }
      g.closePath();
    }
    g.fillStyle = 'rgba(15,25,15,0.3)';
    shape(r * 0.18, r * 0.26);
    g.fill();
    var STONE = [['#b5b0a4', '#77736a'], ['#a7a49b', '#69675f'], ['#bdb6a5', '#837b6b'], ['#9a9c94', '#5f625b']];
    var c = STONE[Math.floor(rnd() * STONE.length)];
    var sg = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.1);
    sg.addColorStop(0, c[0]);
    sg.addColorStop(1, c[1]);
    g.fillStyle = sg;
    shape(0, 0);
    g.fill();
    if (rnd() < 0.5) {
      g.fillStyle = 'rgba(96,128,64,0.45)';
      g.beginPath();
      g.ellipse(x + r * (rnd() - 0.5) * 0.6, y + r * (rnd() - 0.5) * 0.6, r * 0.35, r * 0.22, rnd() * 3, 0, TAU);
      g.fill();
    }
  }

  function drawFern(g, x, y, size, aim, rnd) {
    g.lineCap = 'round';
    for (var f = 0; f < 8; f++) {
      var a = aim + (f / 7 - 0.5) * 2.6 + (rnd() - 0.5) * 0.2;
      var len = size * (0.7 + rnd() * 0.3), bend = (rnd() - 0.5) * 0.5;
      var ex = x + Math.cos(a + bend) * len, ey = y + Math.sin(a + bend) * len;
      var mx = x + Math.cos(a) * len * 0.55, my = y + Math.sin(a) * len * 0.55;
      g.strokeStyle = '#3f5f2a';
      g.lineWidth = Math.max(1, size * 0.025);
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(mx, my, ex, ey);
      g.stroke();
      for (var k = 1; k < 12; k++) {
        var t = k / 12, it = 1 - t;
        var px = it * it * x + 2 * it * t * mx + t * t * ex, py = it * it * y + 2 * it * t * my + t * t * ey;
        var tx = 2 * it * (mx - x) + 2 * t * (ex - mx), ty = 2 * it * (my - y) + 2 * t * (ey - my);
        var ta = Math.atan2(ty, tx), lr = size * 0.11 * (1 - t * 0.8);
        g.fillStyle = k % 2 ? '#5d8a3a' : '#679643';
        for (var s = -1; s <= 1; s += 2) {
          g.beginPath();
          g.ellipse(px + Math.cos(ta + s * 1.2) * lr * 0.8, py + Math.sin(ta + s * 1.2) * lr * 0.8, lr, lr * 0.32, ta + s * 1.2, 0, TAU);
          g.fill();
        }
      }
    }
  }

  function buildBank() {
    bankCanvas = makeCanvas();
    var g = bankCanvas.getContext('2d'), rnd = seeded(9), i;

  // ------------------------------------------------------------------

    { fx: 0.8, fy: 0.17, ox: 0, oy: 0, r: 0.085, flower: 1, clump: 1 },
    { fx: 0.8, fy: 0.17, ox: -0.14, oy: 0.04, r: 0.064, clump: 1 },
    { fx: 0.8, fy: 0.17, ox: 0.01, oy: 0.15, r: 0.058, clump: 1 },

          r: 0, ax: 0, ay: 0, dx: 0, dy: 0, vx: 0, vy: 0,

  // ------------------------------------------------------------------
  // Layout
  // ------------------------------------------------------------------
