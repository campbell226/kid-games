<script>
// Full screen on the first touch, and a way back if it is off.
//
// A browser will not do this by itself: the request has to come out of a
// gesture the browser counts as user activation, and that list is fussier
// than it looks. pointerdown only counts when the pointer is a mouse - on
// a touchscreen it grants nothing at all, which is why listening for it
// worked on a laptop and did nothing whatever on a tablet. For a finger it
// is pointerup and touchend that count.
//
// Once full screen is on, the automatic asking stops, so leaving it stays
// left. But leaving it used to mean reloading to get it back, so there is
// now a small button at the top of the screen that is only there while
// full screen is off, and takes itself away the moment it is on.
//
// An iPhone ignores the lot, because Safari there gives full screen to
// video and nothing else, so no button is offered. That is what the home
// screen tags above are for.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  // A dim button: anything bright at the top of a night sky is the first
  // thing the eye goes to.
  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(190,205,255,0.16);cursor:pointer;'
        + '-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#c9d4ff" stroke-opacity="0.8" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

  // Every couple of minutes Dad points out the comet; the first two
  // times he says what it is.
  var nextShowComet = 75 + Math.random() * 40, cometsShown = 0, mwSpoken = false;
  function updateHands(dt) {
    if (dusk > 0.9 && clock > nextShowComet) {
      nextShowComet = clock + 110 + Math.random() * 80;
      var c = comets[0];
      if (c && c.front && !dadBusy()) {
        dadPoint({ obj: c }, 5);
        cometsShown += 1;
        if (cometsShown === 1) { say('comet-1', { wait: 2 }); }
        if (cometsShown === 2) { say('comet-2', { wait: 2, once: true }); }
      }
    }
    if (!mwSpoken && dusk > 0.92 && clock > 40) {
      mwSpoken = true;
      later(3, function () { say('milky-way', { wait: 20, once: true }); });
    }
    updateHand(mitten, dt);

  // While it gets dark, Dad points out the first few stars as they
  // appear.
  var firstStars = 0, lastFirst = -9;
  function spotFirst(i) {

    firstStars += 1;
    lastFirst = clock;
    dadPoint({ star: i }, 3);
    say(['dusk-first', 'dusk-another', 'dusk-all'][firstStars - 1], { wait: 1.5 });
  }

  // ------------------------------------------------------------------
  // Drawing the sky
  // ------------------------------------------------------------------
  var NIGHT_TOP = hex('#02040a'), NIGHT_MID = hex('#050a17'), NIGHT_HOR = hex('#0d162e');
  var DUSK_TOP = hex('#1b2b55'), DUSK_MID = hex('#3b4c7c'), DUSK_HOR = hex('#9a8796');
  var SUNSET = hex('#f0a070');

  function drawSky() {
    var f = dusk;
    var g = ctx.createLinearGradient(0, 0, 0, hy);
    g.addColorStop(0, rgba(mix(DUSK_TOP, NIGHT_TOP, f)));
    g.addColorStop(0.6, rgba(mix(DUSK_MID, NIGHT_MID, f)));
    g.addColorStop(1, rgba(mix(DUSK_HOR, NIGHT_HOR, f)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, hy + 4);
    if (f < 0.99) {
      var p = altAz(-4 * D2R, SUNSET_AZ);
      projENU(p[0], p[1], p[2]);
      if (PD > 0.15) {
        var rad = Math.max(W, H) * 0.8;
        var rg = ctx.createRadialGradient(PX, hy, 0, PX, hy, rad);
        rg.addColorStop(0, rgba(SUNSET, 0.55 * Math.pow(1 - f, 1.6)));
        rg.addColorStop(1, rgba(SUNSET, 0));
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, W, hy + 4);
      }
    }
  }

  function drawMilkyWay() {
    var nf = smooth((dusk - 0.45) / 0.55);
    if (nf <= 0) { return; }
    var m = mwCtx, sc = 1 / MW_DIV, cw = mwC.width, ch = mwC.height, i;
    m.setTransform(1, 0, 0, 1, 0, 0);
    m.globalCompositeOperation = 'source-over';
    m.globalAlpha = 1;
    m.clearRect(0, 0, cw, ch);
    for (var pass = 0; pass < 2; pass++) {
      m.globalCompositeOperation = pass ? 'destination-out' : 'lighter';
      for (i = 0; i < MWN; i++) {
        if ((mwK[i] === 2) !== (pass === 1)) { continue; }
        var x = mwX[i], y = mwY[i], z = mwZ[i];
        var yu = x * Zx + y * Zy + z * Zz;
        if (yu < -0.06) { continue; }
        var den = 1 + x * Fx + y * Fy + z * Fz;
        if (den < 0.3) { continue; }
        var r = mwR[i] * K2 / den * sc;
        var X = (cx + K2 * (x * Rx + y * Ry + z * Rz) / den) * sc, Y = (hy - K2 * yu / den) * sc;
        if (X + r < 0 || X - r > cw || Y + r < 0 || Y - r > ch) { continue; }
        var a = mwA[i] * (pass ? 1 : nf * hfade(yu));
        if (a < 0.003) { continue; }
        m.globalAlpha = Math.min(1, a);
        m.drawImage(pass ? blobDark : (mwK[i] ? blobWarm : blobCool), X - r, Y - r, 2 * r, 2 * r);
      }
    }
    m.globalAlpha = 1;
    m.globalCompositeOperation = 'source-over';
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(mwC, 0, 0, cw * MW_DIV, ch * MW_DIV);
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawField(lim) {
    var i, b, tw = (reduced ? 0.06 : 0.16), ts = reduced ? 0.35 : 1;
    for (b = 0; b < FT * FB; b++) { bN[b] = 0; }
    for (i = 0; i < fDraw; i++) {
      var x = fX[i], y = fY[i], z = fZ[i];
      var yu = x * Zx + y * Zy + z * Zz;
      if (yu < 0.005) { continue; }
      var den = 1 + x * Fx + y * Fy + z * Fz;
      if (den < 0.25) { continue; }
      var X = cx + K2 * (x * Rx + y * Ry + z * Rz) / den;
      if (X < -2 || X > W + 2) { continue; }
      var Y = hy - K2 * yu / den;
      if (Y < -2 || Y > hy + 2) { continue; }
      var m = fM[i] + extinction(yu);
      var a = clamp((lim - m) / 0.9, 0, 1) * 0.5 * Math.pow(10, -0.22 * (m - 4.4));
      a *= 1 + tw * Math.sin(clock * fF[i] * ts + fP[i]);
      var lev = (a * FB) | 0;
      if (lev <= 0) { continue; }
      if (lev >= FB) { lev = FB - 1; }
      var bk = fT[i] * FB + lev, n = bN[bk]++;
      bX[bk][n] = X; bY[bk][n] = Y; bS[bk][n] = fS[i];
    }
    ctx.globalCompositeOperation = 'lighter';
    for (b = 0; b < FT * FB; b++) {
      var cnt = bN[b];
      if (!cnt) { continue; }
      var xs = bX[b], ys = bY[b], ss = bS[b];
      ctx.fillStyle = fStyles[b];
      ctx.beginPath();
      for (i = 0; i < cnt; i++) {
        var sz = ss[i];
        ctx.rect(xs[i] - sz / 2, ys[i] - sz / 2, sz, sz);
      }
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStars(lim) {
    var amp = reduced ? 0.4 : 1, fr = reduced ? 0.35 : 1;
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var yu = projEq(s.x, s.y, s.z);
      s.sx = PX; s.sy = PY; s.alt = yu;
      s.front = PD > 0.2 && yu > -0.3;
      s.on = s.front && yu > 0.004 && PX > -30 && PX < W + 30 && PY > -30 && PY < hy + 10;
      s.vis = 0;
      if (!s.on) { continue; }
      var me = s.mag + extinction(yu);
      var vis = clamp((lim - me) / 0.9, 0, 1);
      s.vis = vis;
      if (dusk < 1 && !s.seen && vis > 0.5) {
        s.seen = true;
        if (clock < DUSK_LEN && s.mag < 1.6 && yu > 0.1) { spotFirst(i); }
      }
      if (vis <= 0.01) { continue; }
      var low = 1 - clamp(yu / 0.5, 0, 1);
      var tw = amp * (0.07 + 0.38 * low * low);
      var a = vis * clamp(Math.pow(10, -0.2 * (me - 1)), 0.18, 1);

      a *= 1 + s.flare;

      var cls = Math.min(CLASSES.length - 1, s.cls + Math.round(low * low * 2));

      ctx.drawImage(starSprites[cls], PX - r, PY - r, 2 * r, 2 * r);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawComets() {
    var nf = smooth((dusk - 0.3) / 0.5);
    for (var k = 0; k < comets.length; k++) { comets[k].front = false; }
    if (nf <= 0) { return; }
    // The tails point away from the sun. Played at teatime in June the
    // real sun would be up and the tails would hang down, so the sun is
    // kept where it is at midnight in a British summer: just under the
    // northern horizon, which sends the tails streaming upwards.
    var sd = altAz(-22 * D2R, 0), SV = enuToEq(sd[0], sd[1], sd[2]);
    ctx.globalCompositeOperation = 'lighter';

      var c = comets[k], vx = c.x, vy = c.y, vz = c.z, i, u, f, r, a, yu;
      var sv = SV[0] * vx + SV[1] * vy + SV[2] * vz;
      var t = norm3([sv * vx - SV[0], sv * vy - SV[1], sv * vz - SV[2]]);
      var w = cross3([vx, vy, vz], t);

      // The straight blue tail of gas, and the broader, curving tail of
      // dust beside it.
      for (i = 1; i <= 50; i++) {
        f = i / 50; u = c.len * 1.25 * f;
        var tn = Math.tan(u);
        var p = norm3([vx + t[0] * tn, vy + t[1] * tn, vz + t[2] * tn]);
        yu = projEq(p[0], p[1], p[2]);
        if (PD < 0.2 || yu < -0.02) { continue; }
        r = (0.4 + 0.5 * f) * c.size * D2R * K2 / PD;
        a = 0.075 * Math.pow(1 - f, 1.2) * bright * hfade(yu);
        ctx.globalAlpha = Math.min(1, a);
        ctx.drawImage(ionSprite, PX - r, PY - r, 2 * r, 2 * r);

        f = i / 30; u = c.len * f;

        var q = norm3([vx + t[0] * tn2 + w[0] * cv, vy + t[1] * tn2 + w[1] * cv, vz + t[2] * tn2 + w[2] * cv]);
        yu = projEq(q[0], q[1], q[2]);
        if (PD < 0.2 || yu < -0.02) { continue; }
        r = (0.3 + 1.9 * f) * c.size * D2R * K2 / PD;
        a = 0.2 * Math.pow(1 - f, 1.4) * bright * hfade(yu);
        ctx.globalAlpha = Math.min(1, a);
        ctx.drawImage(dustSprite, PX - r, PY - r, 2 * r, 2 * r);
      }
      yu = projEq(vx, vy, vz);
      c.sx = PX; c.sy = PY;
      c.front = PD > 0.2 && yu > 0.01;
      if (PD < 0.2 || yu < -0.02) { continue; }
      r = 1.4 * c.size * D2R * K2 / PD * (1 + 0.4 * c.flare);
      ctx.globalAlpha = Math.min(1, 0.9 * bright * hfade(yu));
      ctx.drawImage(comaSprite, PX - r, PY - r, 2 * r, 2 * r);
      r = 9 * c.size;
      ctx.globalAlpha = Math.min(1, bright * hfade(yu));
      ctx.drawImage(starSprites[2], PX - r, PY - r, 2 * r, 2 * r);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawMeteors() {
    ctx.lineCap = 'round';
    for (var i = 0; i < meteors.length; i++) {
      var m = meteors[i], p = m.p, t = m.t;
      var env = Math.pow(Math.sin(Math.PI * clamp(m.age / m.dur, 0, 1)), 0.6);
      var head = reduced ? m.path : m.age * m.w;
      var tail = reduced ? 0 : Math.max(0, head - m.streak);
      var ch = Math.cos(head), sh = Math.sin(head), ct = Math.cos(tail), st = Math.sin(tail);
      projENU(p[0] * ch + t[0] * sh, p[1] * ch + t[1] * sh, p[2] * ch + t[2] * sh);
      var hx = PX, hyy = PY, hd = PD;
      projENU(p[0] * ct + t[0] * st, p[1] * ct + t[1] * st, p[2] * ct + t[2] * st);
      var tx = PX, ty = PY;
      m.sx = hx; m.sy = hyy; m.front = hd > 0.2;
      if (hd < 0.2 || PD < 0.2) { continue; }
      var a = env * (0.45 + 0.55 * m.bright);
      var g = ctx.createLinearGradient(tx, ty, hx, hyy);
      g.addColorStop(0, 'rgba(220,240,255,0)');
      g.addColorStop(0.7, 'rgba(225,245,240,' + (0.35 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,255,250,' + a.toFixed(3) + ')');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.1 + 1.3 * m.bright;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(hx, hyy);
      ctx.stroke();

        var r = 5 + 6 * m.bright;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.min(1, a);
        ctx.drawImage(starSprites[2], hx - r, hyy - r, 2 * r, 2 * r);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }

  function drawSats() {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < sats.length; i++) {
      var o = sats[i], a = o.w * o.age, c = Math.cos(a), s = Math.sin(a);
      var e = o.p[0] * c + o.t[0] * s, n = o.p[1] * c + o.t[1] * s, u = o.p[2] * c + o.t[2] * s;
      projENU(e, n, u);
      o.sx = PX; o.sy = PY; o.front = PD > 0.2 && u > 0.02;
      if (!o.front) { continue; }
      var al = smooth(o.age / 3) * hfade(u) * (1 - smooth((o.age - o.shadow) / 4));
      var r = clamp(2.4 - 0.35 * o.mag, 0.8, 2.9) * 6;

      ctx.drawImage(starSprites[2], PX - r, PY - r, 2 * r, 2 * r);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawAurora() {
    if (aur.s < 0.01) { return; }
    var s = aur.s, ph = aur.ph, i;
    ctx.globalCompositeOperation = 'lighter';
    var g0 = altAz(5 * D2R, 0);
    projENU(g0[0], g0[1], g0[2]);
    if (PD > 0.15) {
      ctx.save();
      ctx.translate(PX, PY);
      ctx.scale(1, 0.32);
      var rad = K2 * 0.9;
      var gg = ctx.createRadialGradient(0, 0, 0, 0, 0, rad);
      gg.addColorStop(0, 'rgba(60,220,140,' + (0.28 * s).toFixed(3) + ')');
      gg.addColorStop(1, 'rgba(60,220,140,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(-rad, -rad, 2 * rad, 2 * rad);
      ctx.restore();
    }
    for (i = 0; i < AUR_N; i++) {
      var az = aurAz[i], azd = Math.abs(az / D2R);
      var edge = smooth((85 - azd) / 30);
      var fold = 0.25 + 0.75 * Math.pow(Math.max(0, Math.sin(az * 4.2 + ph * 0.21 + 1.3 * Math.sin(az * 2.1 - ph * 0.13))), 1.5);
      var inten = s * edge * fold;
      if (inten < 0.02) { continue; }
      var base = (6 + 3 * Math.sin(az * 3 + ph * 0.13) + 1.5 * Math.sin(az * 8 - ph * 0.09)) * D2R;
      var top = base + (15 + 11 * Math.sin(az * 2.3 + ph * 0.06 + aurP[i])) * aurH[i] * D2R;
      var saz = Math.sin(az), caz = Math.cos(az);
      projENU(Math.cos(base) * saz, Math.cos(base) * caz, Math.sin(base));
      if (PD < 0.25) { continue; }
      var bx = PX, by = PY, bd = PD;
      projENU(Math.cos(top) * saz, Math.cos(top) * caz, Math.sin(top));
      var tx = PX, ty = PY;
      if (Math.max(bx, tx) < -60 || Math.min(bx, tx) > W + 60) { continue; }
      var len = Math.sqrt((tx - bx) * (tx - bx) + (ty - by) * (ty - by));
      if (len < 2) { continue; }
      var w = Math.max(5, 3.4 * D2R * K2 / bd);
      var ang = Math.atan2(ty - by, tx - bx) + HALF_PI, c = Math.cos(ang), sn = Math.sin(ang);
      ctx.setTransform(DPR * c, DPR * sn, -DPR * sn, DPR * c, DPR * bx, DPR * by);
      ctx.globalAlpha = Math.min(1, inten * 0.5);
      ctx.drawImage(raySprite, -w / 2, -len, w, len);
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ------------------------------------------------------------------
  // Drawing a constellation that has been tapped
  // ------------------------------------------------------------------
  var FONT = 'ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif';

  // A picture's outline on the screen. When it is moving, each point is
  // bent on the flat map first and then turned back into a direction.
  function figurePath(cmds, g, at) {
    var mv = g && g.anim && at > 0 && at < 1, c = g ? g.c : null, e = g ? g.e : null, n = g ? g.n : null;
    for (var i = 0; i < cmds.length; i++) {
      var cm = cmds[i], v = cm.v, pts = [];
      for (var j = 0; j < v.length; j += 3) {
        if (mv) {
          var q = g.anim.fn(cm.loc[j / 3 * 2], cm.loc[j / 3 * 2 + 1], at);
          var xi = -q[0] * D2R, eta = -q[1] * D2R;
          var dx = c[0] + e[0] * xi + n[0] * eta, dy = c[1] + e[1] * xi + n[1] * eta, dz = c[2] + e[2] * xi + n[2] * eta;
          var dm = Math.sqrt(dx * dx + dy * dy + dz * dz);
          projEq(dx / dm, dy / dm, dz / dm);
        } else {
          projEq(v[j], v[j + 1], v[j + 2]);
        }
        if (PD < 0.2) { return false; }
        pts.push(PX, PY);
      }
      if (cm.c === 'M') { ctx.moveTo(pts[0], pts[1]); }
      else if (cm.c === 'L') { ctx.lineTo(pts[0], pts[1]); }
      else if (cm.c === 'Q') { ctx.quadraticCurveTo(pts[0], pts[1], pts[2], pts[3]); }
      else if (cm.c === 'C') { ctx.bezierCurveTo(pts[0], pts[1], pts[2], pts[3], pts[4], pts[5]); }
      else if (cm.c === 'Z') { ctx.closePath(); }
    }
    return true;
  }

  function drawFigure(fig, a, g, at) {
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (!figurePath(fig.d, g, at)) { return; }
    ctx.fillStyle = 'rgba(140,170,255,' + (0.08 * a).toFixed(3) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,180,255,' + (0.1 * a).toFixed(3) + ')';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(190,208,255,' + (0.5 * a).toFixed(3) + ')';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    if (fig.l.length) {
      ctx.beginPath();
      if (figurePath(fig.l, g, at)) { ctx.stroke(); }
    }
  }

  // How far through its moment of life a picture is: it starts once the
  // picture has fully glowed in, and again each time it is tapped after
  // that. Never with reduced motion.
  function animAt(l) {
    var g = l.g;
    if (!g.anim || !l.done || reduced) { return 0; }
    var t0 = Math.max(l.doneAt + 2, l.animFrom || 0);
    return (clock - t0) / g.anim.len;
  }

  function centroid(g) {
    var x = 0, y = 0, n = 0;
    for (var i = 0; i < g.stars.length; i++) {
      var s = stars[g.stars[i]];
      if (s.front) { x += s.sx; y += s.sy; n++; }
    }
    return n ? [x / n, y / n] : null;
  }

  function drawLit() {
    var fs = clamp(Math.round(U * 0.032), 13, 22), k, i;
    for (k = 0; k < lit.length; k++) {
      var l = lit[k], a = clamp(l.alpha, 0, 1), el = clock - l.start, g = l.g;
      if (g.fig && l.done) {
        var fa = a * smooth((clock - l.doneAt) / 1.6);
        if (fa > 0.01) { drawFigure(g.fig, fa, g, animAt(l)); }
      }
      ctx.lineCap = 'round';
      for (i = 0; i < l.seq.length; i++) {
        var q = l.seq[i];
        if (q.a < 0) { continue; }
        var p = (el - q.t0) / EDGE_T;
        if (p <= 0) { break; }
        p = Math.min(1, p);
        var A = stars[q.a], B = stars[q.b];
        if (!A.front || !B.front) { continue; }
        var f = reduced ? 1 : p, la = a * (reduced ? p : 1);
        var ex = A.sx + (B.sx - A.sx) * f, ey = A.sy + (B.sy - A.sy) * f;
        ctx.beginPath();
        ctx.moveTo(A.sx, A.sy);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = 'rgba(160,190,255,' + (0.16 * la).toFixed(3) + ')';
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.strokeStyle = 'rgba(210,224,255,' + (0.78 * la).toFixed(3) + ')';
        ctx.lineWidth = 1.6;
        ctx.stroke();
        if (p < 1 && !reduced) {
          ctx.globalCompositeOperation = 'lighter';
          ctx.drawImage(starSprites[1], ex - 9, ey - 9, 18, 18);
          ctx.globalCompositeOperation = 'source-over';
        }
      }
      // Numbers, counting the stars as they are reached. They sit just
      // outside the picture, away from its middle, so they never cover a
      // line.
      var cen = centroid(g);
      if (!cen) { continue; }
      ctx.font = '600 ' + fs + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      for (var key in l.nums) {
        if (!l.nums.hasOwnProperty(key)) { continue; }
        var s = stars[key], nm = l.nums[key];
        if (!s.front || s.alt < 0) { continue; }
        var dx = s.sx - cen[0], dy = s.sy - cen[1], dm = Math.sqrt(dx * dx + dy * dy);
        if (dm < 1) { dx = 0; dy = -1; dm = 1; }
        var off = g.cluster ? fs * 1.6 + 8 : fs * 0.95;
        var nx = s.sx + dx / dm * off, ny = s.sy + dy / dm * off;
        var na = a * smooth((clock - nm.t) / 0.35);
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(2,4,10,' + (0.7 * na).toFixed(3) + ')';
        ctx.strokeText(String(nm.n), nx, ny);
        ctx.fillStyle = 'rgba(232,238,255,' + (0.92 * na).toFixed(3) + ')';
        ctx.fillText(String(nm.n), nx, ny);
      }
    }
  }

  // The name, small, for whoever is reading it out.
  function drawNames() {
    var fs = clamp(Math.round(U * 0.03), 12, 20);
    ctx.font = '500 ' + fs + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var k = 0; k < lit.length; k++) {
      var l = lit[k];
      if (!l.done) { continue; }
      var a = clamp(l.alpha, 0, 1) * smooth((clock - l.doneAt - 0.6) / 1.2);
      if (a < 0.01) { continue; }
      var g = l.g, x = 0, n = 0, lo = -1e9;
      for (var i = 0; i < g.stars.length; i++) {
        var s = stars[g.stars[i]];
        if (!s.front) { continue; }
        x += s.sx; n++;
        if (s.sy > lo) { lo = s.sy; }
      }
      if (!n) { continue; }
      var nx = clamp(x / n, 70, W - 70), ny = Math.min(lo + fs * 1.8, hy - fs);
      ctx.fillStyle = 'rgba(196,210,250,' + (0.7 * a).toFixed(3) + ')';
      ctx.fillText(g.name, nx, ny);
    }
  }

  // ------------------------------------------------------------------
  // Drawing the land
  // ------------------------------------------------------------------
  var LAND_DUSK = hex('#1b2036'), LAND_NIGHT = hex('#0a1020'), AURORA_TINT = hex('#0e2a22');
  var NEAR = hex('#03050b');

  function landColour() {
    return mix(mix(LAND_DUSK, LAND_NIGHT, dusk), AURORA_TINT, 0.3 * aur.s);
  }

  function drawLand() {
    var step = 4, X, col = landColour();
    ctx.fillStyle = rgba(col);
    ctx.beginPath();
    ctx.moveTo(-4, H + 4);
    for (X = -step; X <= W + step; X += step) {
      var d = 2 * Math.atan((X - cx) / K2);
      var h = profAt(A0 + d) * D2R, chh = Math.cos(h);
      var den = 1 + chh * Math.cos(d);
      ctx.lineTo(cx + K2 * chh * Math.sin(d) / den, hy - K2 * Math.sin(h) / den);
    }
    ctx.lineTo(W + 4, H + 4);
    ctx.closePath();
    ctx.fill();

    // Lone trees on the skyline.
    for (var i = 0; i < trees.length; i++) {
      var t = trees[i];
      var ground = profAt(t.az) * D2R, crown = ground + t.h;
      var p = altAz(crown, t.az);
      projENU(p[0], p[1], p[2]);
      if (PD < 0.3 || PX < -60 || PX > W + 60) { continue; }
      var r = t.r * K2 / PD, tx = PX, ty = PY;
      var gp = altAz(ground - 0.3 * D2R, t.az);
      projENU(gp[0], gp[1], gp[2]);
      ctx.beginPath();
      ctx.moveTo(PX - r * 0.09, PY);
      ctx.lineTo(tx - r * 0.06 + t.lean * r, ty + r * 0.4);
      ctx.lineTo(tx + r * 0.06 + t.lean * r, ty + r * 0.4);
      ctx.lineTo(PX + r * 0.09, PY);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(tx + t.lean * r, ty, r, 0, TAU);
      ctx.arc(tx + t.lean * r - r * 0.55, ty + r * 0.25, r * 0.72, 0, TAU);
      ctx.arc(tx + t.lean * r + r * 0.55, ty + r * 0.2, r * 0.75, 0, TAU);
      ctx.arc(tx + t.lean * r, ty - r * 0.45, r * 0.68, 0, TAU);
      ctx.fill();
    }

    // The cottage, with its one lit window.
    var base = profAt(COTTAGE_AZ) * D2R - 0.15 * D2R;
    var c0 = altAz(base, COTTAGE_AZ);
    projENU(c0[0], c0[1], c0[2]);
    if (PD > 0.3 && PX > -60 && PX < W + 60) {
      var u = 1.0 * D2R * K2 / PD, bx = PX, by = PY;
      ctx.beginPath();
      ctx.moveTo(bx - u * 0.9, by);
      ctx.lineTo(bx - u * 0.9, by - u * 0.65);
      ctx.lineTo(bx - u * 0.55, by - u * 1.0);
      ctx.lineTo(bx - u * 0.55, by - u * 1.2);
      ctx.lineTo(bx - u * 0.38, by - u * 1.2);
      ctx.lineTo(bx - u * 0.38, by - u * 1.12);
      ctx.lineTo(bx - u * 0.1, by - u * 1.25);
      ctx.lineTo(bx + u * 0.75, by - u * 0.7);
      ctx.lineTo(bx + u * 0.75, by);
      ctx.closePath();
      ctx.fill();
      var wx = bx - u * 0.42, wy = by - u * 0.38, ws = Math.max(1.6, u * 0.17);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5;
      ctx.drawImage(starSprites[5], wx - ws * 5, wy - ws * 5, ws * 10, ws * 10);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(255,206,130,0.95)';
      ctx.fillRect(wx - ws / 2, wy - ws / 2, ws, ws);
    }
  }

  // The field in front of her, falling away into the dark, and the
  // grass close to her eyes at the bottom corners, swaying in the wind.
  // Thick at the edges and thin in the middle, so it frames the sky
  // without hiding it.
  var grass = [];
  function buildGrass() {
    grass = [];
    var rnd = seeded(13), x = -12;
    while (x < W + 12) {
      var edge = Math.min(1, Math.pow(Math.abs(x - W / 2) / (W / 2), 1.6));
      x += (2 + rnd() * 6) * (1.4 - edge);
      if (rnd() > 0.2 + 0.8 * edge) { continue; }
      grass.push({
        x: x, h: U * (0.025 + 0.13 * edge * (0.45 + rnd() * 0.75)), w: 1 + 3 * edge * rnd(),
        lean: (rnd() - 0.5) * 0.5 + (x < W / 2 ? -0.18 : 0.18), ph: rnd() * TAU
      });
    }
  }
  var windAmt = 0;
  function drawNear() {
    var g = ctx.createLinearGradient(0, hy + H * 0.02, 0, H);
    g.addColorStop(0, rgba(NEAR, 0));
    g.addColorStop(1, rgba(NEAR, 0.92));
    ctx.fillStyle = g;
    ctx.fillRect(0, hy, W, H - hy);
    ctx.strokeStyle = rgba(NEAR);
    ctx.lineCap = 'round';
    var sw = reduced ? 0.3 : 1;
    for (var i = 0; i < grass.length; i++) {
      var b = grass[i], y = H + 4;
      var bend = b.lean + sw * (0.06 * Math.sin(clock * 1.1 + b.ph) + 0.3 * windAmt * (0.6 + 0.4 * Math.sin(clock * 1.9 + b.x * 0.02)));
      ctx.lineWidth = b.w;
      ctx.beginPath();
      ctx.moveTo(b.x, y);
      ctx.quadraticCurveTo(b.x + Math.sin(bend) * b.h * 0.35, y - b.h * 0.6, b.x + Math.sin(bend) * b.h, y - Math.cos(bend) * b.h);
      ctx.stroke();
    }
  }

  // ------------------------------------------------------------------
  // The arms. Each is a coat sleeve from the shoulder, below the edge of
  // the view, out to the wrist, narrowing as it goes away from her eye;
  // then her knitted mitten, or Dad's hand with one finger pointing.
  // Both are dark against the sky, with a thin rim of the sky's light
  // along their edges so they read as solid things in front of it.
  // ------------------------------------------------------------------
  var MITTEN = hex('#7e2b3e'), CUFF = hex('#a9465c'), COAT = hex('#141a2c'), DAD_COAT = hex('#181d19');
  var DAD_CUFF = hex('#262e27'), SKIN = hex('#3a2f2a');

  function rimColour(a) {
    return rgba(mix(hex('#9aaee8'), hex('#5fd9a0'), aur.s * 0.6), ((0.3 + 0.15 * aur.s) * a).toFixed(3));
  }

  function drawArm(h) {
    if (h.raise < 0.01) { return; }
    var sh = shoulderOf(h), r = smooth(h.raise), L = h.len * r;
    var c = Math.cos(h.ang), s = Math.sin(h.ang), px = -s, py = c;
    var wx = sh[0] + c * L, wy = sh[1] + s * L;
    var w0 = U * (h.dad ? 0.21 : 0.17), w1 = U * (h.dad ? 0.075 : 0.068);
    var mx = sh[0] + c * L * 0.5, my = sh[1] + s * L * 0.5, wm = (w0 + w1) / 2 * 1.08;
    ctx.beginPath();
    ctx.moveTo(sh[0] + px * w0 / 2, sh[1] + py * w0 / 2);
    ctx.quadraticCurveTo(mx + px * wm / 2, my + py * wm / 2, wx + px * w1 / 2, wy + py * w1 / 2);
    ctx.lineTo(wx - px * w1 / 2, wy - py * w1 / 2);
    ctx.quadraticCurveTo(mx - px * wm / 2, my - py * wm / 2, sh[0] - px * w0 / 2, sh[1] - py * w0 / 2);
    ctx.closePath();
    ctx.fillStyle = rgba(h.dad ? DAD_COAT : COAT);
    ctx.fill();
    ctx.strokeStyle = rimColour(1);
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(h.ang);
    if (h.dad) { dadHandShape(U * 0.085); } else { mittenShape(U * 0.078); }
    ctx.restore();
  }

  // Her mitten, pointing the way her arm points: a knitted cuff, a
  // rounded mitten and its thumb. The x axis runs along her arm.
  function mittenShape(m) {
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.ellipse(0.72 * m, 0, 0.6 * m, 0.48 * m, 0, 0, TAU);
    ctx.moveTo(0.7 * m, 0.42 * m);
    ctx.ellipse(0.5 * m, 0.5 * m, 0.27 * m, 0.14 * m, 0.65, 0, TAU);
    ctx.fillStyle = rgba(MITTEN);
    ctx.fill();
    ctx.strokeStyle = rimColour(1);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // The knit: faint rows across it.
    ctx.strokeStyle = rgba(CUFF, 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var k = 0; k < 4; k++) {
      var x = (0.35 + k * 0.22) * m;
      ctx.moveTo(x, -0.36 * m);
      ctx.quadraticCurveTo(x + 0.08 * m, 0, x, 0.36 * m);
    }
    ctx.stroke();
    // The cuff, ribbed.
    ctx.beginPath();
    ctx.moveTo(-0.2 * m, -0.5 * m);
    ctx.lineTo(0.22 * m, -0.52 * m);
    ctx.lineTo(0.22 * m, 0.52 * m);
    ctx.lineTo(-0.2 * m, 0.5 * m);
    ctx.closePath();
    ctx.fillStyle = rgba(CUFF);
    ctx.fill();
    ctx.strokeStyle = rimColour(1);
    ctx.stroke();
    ctx.strokeStyle = rgba(MITTEN, 0.6);
    ctx.beginPath();
    for (var j = -3; j <= 3; j++) {
      ctx.moveTo(-0.18 * m, j * 0.14 * m);
      ctx.lineTo(0.2 * m, j * 0.14 * m);
    }
    ctx.stroke();
  }

  // Dad's hand, from the back: the cuff of his jacket, his hand with
  // the fingers curled, and his first finger straight out, pointing.
  function dadHandShape(m) {
    ctx.lineJoin = 'round';
    ctx.beginPath();
    // Back of the hand and the curled fingers.
    ctx.moveTo(0.05 * m, -0.4 * m);
    ctx.quadraticCurveTo(0.45 * m, -0.48 * m, 0.7 * m, -0.42 * m);
    // The pointing finger.
    ctx.lineTo(1.45 * m, -0.4 * m);
    ctx.quadraticCurveTo(1.6 * m, -0.3 * m, 1.45 * m, -0.18 * m);
    ctx.lineTo(0.82 * m, -0.16 * m);
    // Knuckles of the curled fingers.
    ctx.quadraticCurveTo(0.95 * m, -0.05 * m, 0.88 * m, 0.08 * m);
    ctx.quadraticCurveTo(0.97 * m, 0.2 * m, 0.86 * m, 0.3 * m);
    ctx.quadraticCurveTo(0.9 * m, 0.42 * m, 0.7 * m, 0.44 * m);
    ctx.quadraticCurveTo(0.4 * m, 0.48 * m, 0.05 * m, 0.4 * m);
    ctx.closePath();
    // The thumb, tucked along the near side.
    ctx.moveTo(0.3 * m, -0.38 * m);
    ctx.quadraticCurveTo(0.55 * m, -0.62 * m, 0.78 * m, -0.5 * m);
    ctx.quadraticCurveTo(0.7 * m, -0.38 * m, 0.45 * m, -0.34 * m);
    ctx.closePath();
    ctx.fillStyle = rgba(SKIN);
    ctx.fill();
    ctx.strokeStyle = rimColour(1);
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // The cuff of his jacket.
    ctx.beginPath();
    ctx.moveTo(-0.16 * m, -0.6 * m);
    ctx.lineTo(0.1 * m, -0.56 * m);
    ctx.lineTo(0.1 * m, 0.56 * m);
    ctx.lineTo(-0.16 * m, 0.6 * m);
    ctx.closePath();
    ctx.fillStyle = rgba(DAD_CUFF);
    ctx.fill();
    ctx.stroke();
  }

  // Her breath: a soft white puff rising from below the view and
  // fading, every so often, and once more when a picture is finished.
  var mistSprite = radialSprite([236, 240, 250], PUFF);
  function breathe() {
    breaths.push({ x: W * (0.46 + Math.random() * 0.08), age: 0, life: 3.2, drift: (Math.random() - 0.5) * 0.08 });
  }
  function updateBreath(dt) {
    nextBreath -= dt;
    if (nextBreath <= 0) { breathe(); nextBreath = 9 + Math.random() * 8; }
    for (var i = breaths.length - 1; i >= 0; i--) {
      breaths[i].age += dt;
      if (breaths[i].age > breaths[i].life) { breaths.splice(i, 1); }
    }
  }
  function drawBreath() {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < breaths.length; i++) {
      var b = breaths[i], t = b.age / b.life;
      var a = 0.11 * Math.pow(Math.sin(Math.PI * t), 1.3);
      var rise = reduced ? 0.04 : 0.32 * (1 - (1 - t) * (1 - t));
      var y = H + U * 0.04 - U * rise, x = b.x + b.drift * W * t;
      for (var k = 0; k < 3; k++) {
        var r = U * (0.07 + 0.16 * t) * (1 - k * 0.22);
        ctx.globalAlpha = a * (1 - k * 0.25);
        ctx.drawImage(mistSprite, x + (k - 1) * r * 0.45 - r, y - k * r * 0.25 - r, 2 * r, 2 * r);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // The knitted brim of her hat, out of focus across the top of the
  // view, hanging a little lower in the middle over her forehead.
  var HAT = hex('#1d0e16'), HAT_RIB = hex('#36192a');
  function drawHat() {
    var hb = Math.max(10, H * 0.032), e0 = hb * 0.45, mid = hb * 1.25;
    for (var k = 2; k >= 0; k--) {
      var off = k * Math.max(2, hb * 0.18);
      ctx.beginPath();
      ctx.moveTo(-4, -4);
      ctx.lineTo(W + 4, -4);
      ctx.lineTo(W + 4, e0 + off);
      ctx.quadraticCurveTo(W / 2, 2 * (mid + off) - (e0 + off), -4, e0 + off);
      ctx.closePath();
      ctx.fillStyle = rgba(HAT, k ? 0.22 : 0.96);
      ctx.fill();
    }
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-4, -4);
    ctx.lineTo(W + 4, -4);
    ctx.lineTo(W + 4, e0);
    ctx.quadraticCurveTo(W / 2, 2 * mid - e0, -4, e0);
    ctx.closePath();
    ctx.clip();
    ctx.strokeStyle = rgba(HAT_RIB, 0.45);
    ctx.lineWidth = Math.max(1.5, hb * 0.14);
    ctx.beginPath();
    var step = Math.max(6, hb * 0.5);
    for (var x = step / 2; x < W; x += step) {
      ctx.moveTo(x, -2);
      ctx.lineTo(x + (x - W / 2) * 0.02, mid + 2);
    }
    ctx.stroke();
    ctx.restore();
  }

  // A tap on empty sky while a shooting star is still flying just makes
  // the sky glint under the finger.
  function drawGlints() {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < glints.length; i++) {
      var gl = glints[i], t = gl.age / 0.7, r = 12 * (1 - t) + 4;
      ctx.globalAlpha = 0.8 * (1 - t);
      ctx.drawImage(starSprites[1], gl.x - r, gl.y - r, 2 * r, 2 * r);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ------------------------------------------------------------------
  // The Moon, drawn about six times its real size, which is about how
  // big it looks. Its lit side faces the real sun, its shape is tonight's
  // shape, and the dark seas on its face are turned the way they really
  // are against the sky. The unlit part glows very faintly, the way it
  // does from earthshine around a crescent.
  // ------------------------------------------------------------------
  var MARIA = [
    [-0.38, -0.42, 0.28, 0.24, 0], [-0.62, 0.02, 0.24, 0.42, 0.2], [0.12, -0.38, 0.19, 0.17, 0],
    [0.33, -0.08, 0.23, 0.19, 0.3], [0.68, -0.28, 0.12, 0.1, 0], [0.55, 0.22, 0.13, 0.18, 0],
    [-0.18, 0.42, 0.2, 0.15, 0], [0, -0.72, 0.38, 0.08, 0]
  ];
  function drawMoon() {
    moon.front = false;
    var nf = smooth((dusk - 0.1) / 0.4);
    if (moon.elong < 18 * D2R || nf <= 0) { return; }
    var yu = projEq(moon.x, moon.y, moon.z);
    moon.sx = PX; moon.sy = PY;
    if (PD < 0.25 || yu < -0.03) { return; }
    moon.front = yu > 0.005;
    var mx = PX, my = PY, den = PD;
    var r = Math.max(1.4 * D2R * K2 / den, U * 0.018) * (1 + 0.12 * moon.flare);
    moon.r = r;
    // Which way the sun is from the Moon, and which way north is.
    var s = moon.sun, k = moon.x * s[0] + moon.y * s[1] + moon.z * s[2];
    var t = norm3([s[0] - k * moon.x, s[1] - k * moon.y, s[2] - k * moon.z]);
    projEq(moon.x + t[0] * 0.02, moon.y + t[1] * 0.02, moon.z + t[2] * 0.02);
    var sunAng = Math.atan2(PY - my, PX - mx);
    var nn = norm3([-moon.z * moon.x, -moon.z * moon.y, 1 - moon.z * moon.z]);
    projEq(moon.x + nn[0] * 0.02, moon.y + nn[1] * 0.02, moon.z + nn[2] * 0.02);
    var northAng = Math.atan2(PY - my, PX - mx);
    var a = nf * hfade(yu);

    ctx.globalCompositeOperation = 'lighter';
    var hr = r * (4 + 3 * moon.frac) * (1 + 0.3 * moon.flare);
    var g = ctx.createRadialGradient(mx, my, r * 0.8, mx, my, hr);
    g.addColorStop(0, 'rgba(230,226,205,' + ((0.05 + 0.15 * moon.frac) * a * (1 + moon.flare)).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(230,226,205,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mx, my, hr, 0, TAU);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = 'rgba(52,62,90,' + (0.6 * a).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(sunAng);
    var tr = r * Math.cos(moon.elong);
    ctx.beginPath();
    ctx.arc(0, 0, r, -HALF_PI, HALF_PI, false);
    ctx.ellipse(0, 0, Math.abs(tr), r, 0, HALF_PI, -HALF_PI, tr > 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(244,240,226,' + a.toFixed(3) + ')';
    ctx.fill();
    ctx.clip();
    ctx.rotate(northAng + HALF_PI - sunAng);
    ctx.fillStyle = 'rgba(150,146,132,' + (0.45 * a).toFixed(3) + ')';
    for (var i = 0; i < MARIA.length; i++) {
      var q = MARIA[i];
      ctx.beginPath();
      ctx.ellipse(q[0] * r, q[1] * r, q[2] * r, q[3] * r, q[4], 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  // The smudges: soft ovals laid along the sky at their real angles.
  function drawSmudges() {
    var nf = smooth((dusk - 0.5) / 0.5);
    if (nf <= 0) { return; }
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < SMUDGES.length; i++) {
      var m = SMUDGES[i], yu = projEq(m.v[0], m.v[1], m.v[2]);
      if (PD < 0.25 || yu < 0) { continue; }
      var x0 = PX, y0 = PY;
      projEq(m.tip[0], m.tip[1], m.tip[2]);
      var dx = PX - x0, dy = PY - y0, half = Math.sqrt(dx * dx + dy * dy), wid = half * m.wid / m.len;
      var c = dx / (half || 1), sn = dy / (half || 1);
      ctx.setTransform(DPR * c, DPR * sn, -DPR * sn, DPR * c, DPR * x0, DPR * y0);
      ctx.globalAlpha = Math.min(1, m.a * nf * hfade(yu));
      ctx.drawImage(m.img, -half * 1.3, -wid * 1.3, half * 2.6, wid * 2.6);
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ------------------------------------------------------------------
  // Everything, in order from the back to her own eyes
  // ------------------------------------------------------------------
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    var lim = limitMag();
    drawSky();
    drawMilkyWay();
    drawSmudges();
    drawComets();
    drawField(lim);
    drawStars(lim);
    drawMoon();
    drawSats();
    drawMeteors();
    drawGlints();
    drawAurora();
    drawLit();
    drawLand();
    drawNear();
    drawNames();
    drawArm(dadHand);
    drawArm(mitten);
    drawBreath();
    drawHat();
  }

  // ------------------------------------------------------------------
  // Tapping
  // ------------------------------------------------------------------
  function segDist(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;

        later(delay, function () { stars[pick].flare = Math.max(stars[pick].flare, 0.7); });
      }
      nextBell += 9 + Math.random() * 9;
    }
  }
  setInterval(scheduleMusic, 250);

  function updateSound(dt) {
    soundClock += dt;
    if (soundClock < 0.05 || !AC || !windGain) { return; }
    soundClock = 0;
    var now = AC.currentTime;
    windGain.gain.setTargetAtTime(0.004 + 0.035 * windAmt * windAmt, now, 0.4);
    windFilter.frequency.setTargetAtTime(700 + 700 * windAmt, now, 0.4);
    auroraGain.gain.setTargetAtTime(0.0001 + 0.035 * aur.s, now, 0.8);
    // The music steps back a little while Dad is talking.
    padBus.gain.setTargetAtTime(speaking ? 0.28 : 0.5, now, 0.3);
  }

  // ------------------------------------------------------------------
  // The state of everything, once a frame
  // ------------------------------------------------------------------
  function update(dt) {
    clock += dt;
    dusk = smooth(clock / DUSK_LEN);
    var rate = reduced ? 1 / 3 : 1;
    lst = (lst + SKY_RATE * dt * rate) % 360;
    gameDays += 60 * rate * dt / 86400;
    updateMoon(DAYS + gameDays);

    // Turning: her head follows the finger, but no faster than a head
    // turns, and stops the moment the finger lifts.
    var turn = A0goal - A0, maxTurn = (reduced ? 25 : 40) * D2R * dt;
    A0 += clamp(turn, -maxTurn, maxTurn);
    var wrap = ((A0 + Math.PI) % TAU + TAU) % TAU - Math.PI - A0;
    A0 += wrap;
    A0goal += wrap;
    updateBasis();

    for (var i = timers.length - 1; i >= 0; i--) {
      if (clock >= timers[i].t) { var fn = timers[i].fn; timers.splice(i, 1); fn(); }
    }
    for (i = 0; i < stars.length; i++) {
      if (stars[i].flare > 0) { stars[i].flare = Math.max(0, stars[i].flare - dt * 0.8); }
    }
    for (i = 0; i < comets.length; i++) {
      if (comets[i].flare > 0) { comets[i].flare = Math.max(0, comets[i].flare - dt * 0.35); }
    }
    if (moon.flare > 0) { moon.flare = Math.max(0, moon.flare - dt * 0.5); }
    windAmt = (0.5 + 0.5 * Math.sin(clock * 0.045)) * (0.5 + 0.5 * Math.sin(clock * 0.11 + 1.7));

    updateMeteors(dt);
    updateSats(dt);
    updateAurora(dt);
    updateLit();
    updateHands(dt);
    updateBreath(dt);
    updateVoice();
  }

  // ------------------------------------------------------------------
  // Frame loop. If the device is struggling, the faintest grain of the
  // Milky Way thins a little rather than the whole sky stuttering.
  // ------------------------------------------------------------------
  var last = 0, workSum = 0, workFrames = 0, workClock = 0, slowWindows = 0;

  function frame(now) {
    var dt = last ? (now - last) / 1000 : 0.016;
    last = now;
    dt = clamp(dt, 0.001, 0.05);
    var t0 = window.performance ? performance.now() : 0;
    update(dt);
    draw();
    updateSound(dt);
    var work = window.performance ? performance.now() - t0 : 0;
    if (window.performance && !document.hidden && work < 60) {
      workSum += work;
      workFrames += 1;
      workClock += dt;
      if (workClock > 2) {
        slowWindows = workSum / workFrames > 12 ? slowWindows + 1 : 0;
        if (slowWindows >= 2 && fDraw > 2000) {
          fDraw = Math.max(2000, Math.round(fDraw * 0.8));
          slowWindows = 0;
        }
        workSum = 0; workFrames = 0; workClock = 0;
      }
    }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------
  // Input. A tap does something where it lands; a drag sideways turns
  // her head, following the finger at a head's pace, never flung.
  // ------------------------------------------------------------------
  var drag = null, downs = {}, A0goal = 0;

  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    primeClips();
    downs[e.pointerId] = { x0: e.clientX, y0: e.clientY, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not every browser */ }
  });
  canvas.addEventListener('pointermove', function (e) {
    var d = downs[e.pointerId];
    if (!d) { return; }
    if (!d.moved && Math.abs(e.clientX - d.x0) + Math.abs(e.clientY - d.y0) > 12) {
      d.moved = true;
      if (!drag) { drag = { id: e.pointerId, lastX: d.x0 }; A0goal = A0; }
    }
    if (drag && drag.id === e.pointerId) {
      // The goal may run ahead of her head, but only so far: a wild
      // swipe asks for a quarter turn at most.
      A0goal = clamp(A0goal - (e.clientX - drag.lastX) / K, A0 - HALF_PI, A0 + HALF_PI);
      drag.lastX = e.clientX;
    }
  });
  function lift(e) {
    var d = downs[e.pointerId];
    delete downs[e.pointerId];
    if (drag && drag.id === e.pointerId) {
      drag = null;
      A0goal = A0;
      return;
    }
    if (d && !d.moved && e.type === 'pointerup') { tapAt(e.clientX, e.clientY); }
  }
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // A phone will not make a sound until a finger has asked for one, and
  // on some it has to be the lifting of the finger that asks.
  ['touchend', 'pointerup', 'click'].forEach(function (name) {
    document.addEventListener(name, function () { initAudio(); primeClips(); }, true);
  });

  document.addEventListener('visibilitychange', function () {
    if (!AC) { return; }
    if (document.hidden) { AC.suspend(); }
    else { AC.resume(); }
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 220);
  });

  layout();
  updateBasis();
  updateMoon(DAYS);
  makeComets();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
