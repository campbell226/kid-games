  :root {
    --serif: 'Libre Caslon Text', Georgia, 'Times New Roman', serif;
    --ink: #2b1e12;
    --parch: #efe4c8;
    --parch-d: #dccb9f;
    --edge: #4a3322;
    --chalk: #ece8da;
    --fs: 20px;
    --facew: 84px;
    --boxh: 112px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14130f;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--serif);
    color: var(--ink);
  }
  #scene {
    position: fixed; left: 0; top: 0;
    display: block;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
  }
  #ui { position: fixed; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; z-index: 2; }
  #tapper { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; }
  #tapper.show { display: block; pointer-events: auto; }

  /* The speech box, Pokemon fashion: a face, a name, the words typed out. */
  #speech {
    position: absolute; left: 50%;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(96vw, 900px);
    min-height: var(--boxh);
    background: var(--parch);
    border: 4px solid var(--edge);
    border-radius: 14px;
    box-shadow: inset 0 0 0 3px #cdb98c, 0 10px 30px rgba(0, 0, 0, 0.65);
    padding: 14px 30px 12px calc(var(--facew) + 22px);
    font-size: var(--fs);
    line-height: 1.32;
    display: none;
    cursor: pointer;
  }
  #speech.show { display: block; pointer-events: auto; }
  #speech.noface { padding-left: 20px; font-style: italic; }
  #speech .who {
    position: absolute; top: -16px; left: calc(var(--facew) + 16px);
    background: var(--edge); color: var(--parch);
    font-weight: 800; font-size: 0.78em; font-style: normal;
    padding: 2px 12px; border-radius: 8px;
    white-space: nowrap;
  }
  #speech.noface .who, #speech.noface > .face { display: none; }
  /* Only the frame: the drawing inside it has a .face of its own (the
     eyes and mouth), and this transform once lifted those off the head. */
  #speech > .face {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: var(--facew); height: var(--facew);
    border-radius: 10px; background: #2c2620; border: 3px solid var(--edge);
    overflow: hidden;
  }
  #speech > .face svg { width: 100%; height: 100%; display: block; }

<script>
// Full screen on the first touch, and a way back if it is off.
//
// A browser will not do this by itself: the request has to come out of a
// gesture the browser counts as user activation, and that list is fussier
// than it looks. pointerdown only counts when the pointer is a mouse - on
// a touchscreen it grants nothing at all, which is why listening for it
// worked on a laptop and did nothing whatever on a tablet. For a finger it
// is pointerup and touchend that count.
//
// Once full screen is on, the automatic asking stops, so leaving it stays
// left. But leaving it used to mean reloading to get it back, so there is
// now a small button at the top of the screen that is only there while
// full screen is off, and takes itself away the moment it is on.
//
// An iPhone ignores the lot, because Safari there gives full screen to
// video and nothing else, so no button is offered. That is what the home
// screen tags above are for.
(function () {

  }

    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#40563a" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';

    if (isFull()) { stopAuto(); }

  });

    if (isFull()) { stopAuto(); }

  for (i = 0; i < EVENTS.length; i++) {

  }

    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3000, t);
    wet = AC.createGain();
    wet.connect(conv); conv.connect(lp);
    var wetOut = AC.createGain();
    wetOut.gain.setValueAtTime(0.5, t);
    lp.connect(wetOut); wetOut.connect(master);

    sfx = AC.createGain(); sfx.connect(master);
    amb = AC.createGain();
    amb.gain.setValueAtTime(0.0001, t);
    amb.connect(master);
    var ambWet = AC.createGain();
    ambWet.gain.setValueAtTime(0.5, t);
    amb.connect(ambWet); ambWet.connect(wet);

    if (AC.state === 'suspended') { AC.resume(); }
    startAmbience();
  }

  function impulse(sec, decay) {
    var rate = AC.sampleRate, len = Math.floor(rate * sec);
    var buf = AC.createBuffer(2, len, rate);
    for (var c = 0; c < 2; c++) {
      var ch = buf.getChannelData(c);
      for (var i = 0; i < len; i++) {
        ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  // Send a source to the dry mix and to the room, at the levels given.
  function out(node, dry, room, bus) {
    if (dry > 0) {
      var g = AC.createGain();
      g.gain.value = dry;
      node.connect(g); g.connect(bus || sfx);
    }
    if (room > 0) {
      var w = AC.createGain();
      w.gain.value = room;
      node.connect(w); w.connect(wet);
    }
  }

  function noiseSrc(t, dur) {
    var s = AC.createBufferSource();
    s.buffer = noiseBuf; s.loop = true;
    s.start(t, Math.random() * 1.5);
    s.stop(t + dur + 0.05);
    return s;
  }

  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function tone(type, f, t, a, peak, dur, dest) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    env(g, t, a, peak, dur);
    o.connect(g);
    if (dest) { g.connect(dest); }
    o.start(t); o.stop(t + dur + 0.05);
    return { o: o, g: g };
  }

  var ambOn = false;
  function startAmbience() {
    if (ambOn || !AC) { return; }
    ambOn = true;
    var t = AC.currentTime;

    // The drone: low and minor, and barely moving.
    var dl = AC.createBiquadFilter();
    dl.type = 'lowpass';
    dl.frequency.setValueAtTime(300, t);
    dl.Q.setValueAtTime(0.7, t);
    var dg = AC.createGain();
    dg.gain.setValueAtTime(0.06, t);
    // The bottom of it is lost on a phone's speaker, so there's a little
    // higher up too, where a phone can still say something.
    [[55, 'sawtooth', 0.5], [55.35, 'sawtooth', 0.4], [82.4, 'triangle', 0.45], [130.8, 'sine', 0.22], [164.8, 'sine', 0.16]].forEach(function (v) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = v[1];
      o.frequency.setValueAtTime(v[0], t);
      g.gain.setValueAtTime(v[2], t);
      o.connect(g); g.connect(dl);
      o.start(t);
    });
    var lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.frequency.setValueAtTime(0.045, t);
    lg.gain.setValueAtTime(110, t);
    lfo.connect(lg); lg.connect(dl.frequency);
    lfo.start(t);
    var swell = AC.createOscillator(), sg = AC.createGain();
    swell.frequency.setValueAtTime(0.021, t);
    sg.gain.setValueAtTime(0.022, t);
    swell.connect(sg); sg.connect(dg.gain);
    swell.start(t);
    dl.connect(dg); dg.connect(amb);

    // Wind in the bars, and a thin whistle through the gap in the frame.
    var ws = AC.createBufferSource();
    ws.buffer = noiseBuf; ws.loop = true;
    ws.start(t);
    var wb = AC.createBiquadFilter();
    wb.type = 'bandpass';
    wb.frequency.setValueAtTime(420, t);
    wb.Q.setValueAtTime(0.9, t);
    var wg = AC.createGain();
    wg.gain.setValueAtTime(0.03, t);
    ws.connect(wb); wb.connect(wg); wg.connect(amb);
    var wh = AC.createBiquadFilter();
    wh.type = 'bandpass';
    wh.frequency.setValueAtTime(1100, t);
    wh.Q.setValueAtTime(28, t);
    var whg = AC.createGain();
    whg.gain.setValueAtTime(0, t);
    ws.connect(wh); wh.connect(whg); whg.connect(amb);

    function gust() {
      if (!AC) { return; }
      var now = AC.currentTime, dur = rand(2.5, 6);
      wg.gain.linearRampToValueAtTime(rand(0.012, 0.06), now + dur);
      wb.frequency.linearRampToValueAtTime(rand(300, 700), now + dur);
      whg.gain.linearRampToValueAtTime(Math.random() < 0.35 ? rand(0.15, 0.4) : 0, now + dur);
      wh.frequency.linearRampToValueAtTime(rand(800, 1500), now + dur);
      setTimeout(gust, dur * 1000);
    }
    gust();

    (function drip() {
      if (AC && !document.hidden) { dripSound(); }
      setTimeout(drip, rand(1400, 5200));
    })();
    setTimeout(function chain() {
      if (AC && !document.hidden) { farChains(); }
      setTimeout(chain, rand(16000, 42000));
    }, rand(6000, 14000));
    setTimeout(function boom() {
      if (AC && !document.hidden) { thud(AC.currentTime + 0.05, 0.07, 1.6, amb); }
      setTimeout(boom, rand(35000, 80000));
    }, rand(20000, 40000));

    amb.gain.setTargetAtTime(0.9, t, 2.5);
  }

  function dripSound() {
    var t = AC.currentTime + 0.02, f = rand(1100, 2200);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.07);
    env(g, t, 0.004, rand(0.025, 0.06), 0.12);
    o.connect(g); out(g, 0.5, 1.4, amb);
    o.start(t); o.stop(t + 0.2);
  }

  function metal(t, base, peak, dest) {
    [1, 2.76, 5.4].forEach(function (r, k) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(base * r, t);
      env(g, t, 0.002, peak / (k + 1), 0.2 - k * 0.05);
      o.connect(g); g.connect(dest);
      o.start(t); o.stop(t + 0.25);
    });
  }

  function farChains() {
    var t0 = AC.currentTime + 0.05, n = randInt(3, 7);
    var lp = AC.createBiquadFilter(), g = AC.createGain();
    lp.type = 'lowpass';
    lp.frequency.value = 2200;
    g.gain.value = 0.5;
    lp.connect(g); out(g, 0.15, 1.2, amb);
    for (var i = 0; i < n; i++) {
      metal(t0 + i * rand(0.09, 0.22), rand(1500, 2600), rand(0.02, 0.05), lp);
    }
  }

  function thud(t, peak, room, bus) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(72, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.35);
    env(g, t, 0.005, peak, 0.5);
    o.connect(g); out(g, 0.6, room, bus);
    o.start(t); o.stop(t + 0.6);
    var s = noiseSrc(t, 0.3), lp = AC.createBiquadFilter(), ng = AC.createGain();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(500, t);
    lp.frequency.exponentialRampToValueAtTime(120, t + 0.25);
    env(ng, t, 0.003, peak * 0.8, 0.28);
    s.connect(lp); lp.connect(ng); out(ng, 0.6, room, bus);
  }

  // --- effects --------------------------------------------------------
  function can() { return !!(AC && sfx); }

  var lastBlip = 0;
  function blip(freq) {
    if (!can()) { return; }
    var t = AC.currentTime;
    if (t - lastBlip < 0.05) { return; }
    lastBlip = t;
    var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = 'square';
    o.frequency.setValueAtTime(freq * rand(0.93, 1.07), t);
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 3, t);
    env(g, t, 0.004, 0.03, 0.06);
    o.connect(lp); lp.connect(g); out(g, 1, 0.12);
    o.start(t); o.stop(t + 0.08);
  }

  var lastScratch = 0;
  function scratch() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.01;
    if (t - lastScratch < 0.06) { return; }
    lastScratch = t;
    for (var k = 0; k < 2; k++) {
      var tt = t + k * 0.06, s = noiseSrc(tt, 0.08), bp = AC.createBiquadFilter(), g = AC.createGain();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(rand(2600, 3800), tt);
      bp.Q.value = 1.4;
      g.gain.setValueAtTime(0.0001, tt);
      g.gain.exponentialRampToValueAtTime(0.16, tt + 0.01);
      g.gain.linearRampToValueAtTime(0.1, tt + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.07);
      s.connect(bp); bp.connect(g); out(g, 1, 0.3);
    }
  }

  function rubOut() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.01, s = noiseSrc(t, 0.4), lp = AC.createBiquadFilter(), g = AC.createGain();
    lp.type = 'bandpass'; lp.frequency.setValueAtTime(900, t); lp.Q.value = 0.7;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    s.connect(lp); lp.connect(g); out(g, 1, 0.3);
  }

  function creak() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.01, dur = 0.95;
    var o = AC.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(60, t);
    for (var i = 1; i <= 10; i++) { o.frequency.linearRampToValueAtTime(rand(55, 140), t + dur * i / 10); }
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.setValueAtTime(900, t); bp.Q.value = 5;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.1);
    g.gain.setValueAtTime(0.22, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(bp); bp.connect(g); out(g, 0.8, 0.6);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function slam() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.01;
    thud(t, 0.3, 1.1);
    var g = AC.createGain(); g.gain.value = 1; out(g, 0.6, 0.8);
    metal(t + 0.02, 900, 0.05, g);
  }

  function keys() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.02, g = AC.createGain();
    g.gain.value = 1; out(g, 0.7, 0.5);
    for (var i = 0; i < 7; i++) { metal(t + i * rand(0.05, 0.1), rand(3000, 5200), rand(0.02, 0.04), g); }
  }

  var lastStep = 0;
  function step() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.005;
    if (t - lastStep < 0.09) { return; }
    lastStep = t;
    var s = noiseSrc(t, 0.08), lp = AC.createBiquadFilter(), g = AC.createGain();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(rand(220, 320), t);
    env(g, t, 0.004, 0.14, 0.08);
    s.connect(lp); lp.connect(g); out(g, 0.8, 0.5);
  }

  function bell(far) {
    if (!can()) { return; }
    var t = AC.currentTime + 0.02, base = 196, k = far ? 0.45 : 1;
    var g = AC.createGain(); g.gain.value = 1; out(g, far ? 0.3 : 0.55, 0.9);
    [[0.5, 0.5, 5], [1, 0.6, 4], [1.2, 0.35, 3], [1.5, 0.25, 2.5], [2, 0.25, 2], [2.6, 0.12, 1.5], [3.2, 0.08, 1]].forEach(function (p) {
      tone('sine', base * p[0], t, 0.01, p[1] * 0.16 * k, p[2], g);
    });
  }

  function shh() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.01, s = noiseSrc(t, 0.5), hp = AC.createBiquadFilter(), g = AC.createGain();
    hp.type = 'highpass'; hp.frequency.setValueAtTime(2600, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.1, t + 0.08);
    g.gain.setValueAtTime(0.1, t + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    s.connect(hp); hp.connect(g); out(g, 1, 0.35);
  }

  function stab() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.01, lp = AC.createBiquadFilter(), g = AC.createGain();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t);
    lp.frequency.exponentialRampToValueAtTime(260, t + 0.5);
    g.gain.value = 1;
    lp.connect(g); out(g, 0.9, 0.5);
    [110, 116.5, 164.8].forEach(function (f) { tone('sawtooth', f, t, 0.01, 0.07, 0.6, lp); });
  }

  function chordGood() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.02, g = AC.createGain();

  function chordBetray() {
    if (!can()) { return; }
    var t = AC.currentTime + 0.02, g = AC.createGain();
    g.gain.value = 1; out(g, 0.8, 0.7);

  function chordBad() {

    g.gain.value = 1; out(g, 0.8, 0.7);

  function drumroll(dur) {
    if (!can()) { return; }
    var t0 = AC.currentTime + 0.02, n = Math.floor(dur / 0.045);

    bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.8;

  // Dinner: a ladle of stew landing in a wooden bowl, and the spoon.
  function slop() {

    g.gain.setValueAtTime(0.1, t + 0.6);

  function sleeve(L) { return L.coat || (L.dress && !L.shawl ? L.top : (L.shawl ? L.shawl : L.top)); }

  // Shoulder pivot, upper arm, then an elbow pivot and the forearm and hand.
  function armSVGs(L) {

  // angle away from the body, so the same numbers mean the same thing on
  // both sides.
  var POSES = {
    rest:   [8, 6, 8, 6],
    cheer:  [150, 15, 150, 15],
    fists:  [50, 115, 50, 115],
    fist:   [8, 6, 52, 118],
    pointL: [86, 4, 8, 6],
    pointR: [8, 6, 86, 4],
    cross:  [-12, -100, -12, -100],
    wring:  [-14, -42, -14, -42],
    shrug:  [35, 65, 35, 65],

  var FIGS = [];

  function makeFigure(id, opts) {
    var L = LOOKS[id];
    opts = opts || {};
    var b = L.build || 1;
    var root = el('g', { class: 'fig', 'data-hit': 'fig', 'data-id': id });
    var shadow = el('ellipse', { cx: 0, cy: -2, rx: 64 * b * (L.seated ? 1.25 : 1), ry: 11, fill: '#000', opacity: 0.35 });
    var body = el('g');
    root.appendChild(shadow);
    root.appendChild(body);

    var legs = [-1, 1].map(function (sg) {
      var g = el('g');
      g.innerHTML = legSVG(L, sg);
      body.appendChild(g);

    });

    var stool = null;
    if (L.seated) {

    var torso = el('g');
    torso.innerHTML = torsoSVG(L);
    upper.appendChild(torso);

    var A = armSVGs(L), arms = [];
    [-1, 1].forEach(function (sg) {

      fg.innerHTML = A.fore;
      g.appendChild(fg);

        + '<rect x="-12" y="48" width="24" height="30" rx="4" fill="#ffd27a" stroke="#2a2018" stroke-width="4"/>'

        + '<path d="M 8 56 L 22 24" stroke="#7a5a38" stroke-width="5" stroke-linecap="round"/>'
        + '<path d="M -23 56 L 23 56 L 19 86 Q 0 94 -19 86 Z" fill="#2e2c29"/>'
        + '<rect x="-25" y="52" width="50" height="7" rx="3.5" fill="#46433e"/>'
        + '<ellipse cx="0" cy="55" rx="20" ry="3" fill="#8a6a3a"/>';

      + '<ellipse cx="0" cy="-96" rx="31" ry="8" fill="#4a3020"/>'
      + '<ellipse cx="0" cy="-96" rx="26" ry="5" fill="#a07c46"/>'
      + '<path d="M -31 -96 Q -29 -68 0 -66 Q 29 -68 31 -96 Q 0 -88 -31 -96 Z" fill="#7a5232"/>'
      + '<path d="M -24 -84 Q 0 -78 24 -84" stroke="#5e3e24" stroke-width="3" fill="none"/>';

    var head = el('g');

    upper.appendChild(head);

    var f = {
      id: id, L: L, root: root, body: body, upper: upper, head: head, legs: legs, arms: arms, knit: knit, stool: stool, shadow: shadow,
      pot: pot, bowl: bowl,
      x: 0, y: 0, s: 1, op: 1, shown: true,

      look: 0, lookT: 0, tilt: 0, no: 0,

      bounce: 0, shake: 0, slump: 0, slumpT: 0, talking: false, talkT: 0,

  }

  function grabFace(f) {
    f.face = f.head.querySelector('.face');
    f.eyes = f.face.querySelector('.eyes');
    f.pup = f.face.querySelector('.pup');

    f.tm = f.face.querySelector('.tm');

  }

  function setExpr(f, name) {
    if (!f || f.expr === name) { return; }

    grabFace(f);
    f.slumpT = EXPRS[name] && EXPRS[name].down ? 1 : 0;
  }

  function setPose(f, name, now) {
    var p = POSES[name] || POSES.rest;
    f.pose = name;
    f.arms[0].ta = p[0]; f.arms[0].te = p[1];
    f.arms[1].ta = p[2]; f.arms[1].te = p[3];

  }

  function setAttr(f, node, key, v) {

  }

  function updateFig(f, dt) {
    if (f.walking) {
      f.wt = clamp(f.wt + dt / f.wdur, 0, 1);
      var p = alongPath(f, f.wt);
      var vx = (p.x - f.x) / Math.max(dt, 0.001);
      f.x = p.x; f.y = p.y;
      if (Math.abs(vx) > 5) { f.lookT = vx > 0 ? 1 : -1; }

      f.legPhase += dt * 11;
      if (Math.floor(f.legPhase / Math.PI) !== before && f.shown && f.op > 0.3) { step(); }
      if (p.op !== undefined) { f.op = p.op; }
      if (f.wt >= 1) {
        f.walking = false;
        var cb = f.onArrive; f.onArrive = null;
        if (cb) { cb(); }
      }
    }

    f.look += (f.lookT - f.look) * Math.min(1, dt * 7);
    f.slump += (f.slumpT - f.slump) * Math.min(1, dt * 5);
    f.bounce = Math.max(0, f.bounce - dt * 2.6);
    f.shake = Math.max(0, f.shake - dt * 1.6);
    f.no = Math.max(0, f.no - dt * 1.4);
    f.breathe += dt * 1.6;

    if (f.persp) { f.s = scaleAt(f.y) * f.persp; }
    var hop = 0, sx = 0, sq = 1;
    if (!reduced) {
      var k = Math.sin(Math.PI * Math.min(1, (1 - f.bounce) * 1.0));
      hop = f.bounce > 0 ? -k * 26 : 0;

    }
    setAttr(f, f.root, 'root', 'translate(' + f1(f.x) + ',' + f1(f.y) + ') scale(' + f.s.toFixed(3) + ')');
    var op = f.shown ? f.op : 0;
    if (f.cache.op !== op) { f.cache.op = op; f.root.setAttribute('opacity', op.toFixed(2)); f.root.style.display = op <= 0.01 ? 'none' : ''; }

    f.legs.forEach(function (lg, i) {

    f.arms.forEach(function (a, i) {
      var rate = Math.min(1, dt * (reduced ? 30 : 9));
      a.a += (a.ta - a.a) * rate;
      a.e += (a.te - a.e) * rate;

    setAttr(f, f.head, 'head', 'translate(' + f1(hx) + ',' + f1(f.slump * 7) + ') rotate(' + f1(f.look * 3 + f.tilt + no * 4) + ' 0 -170)');
    if (f.pup) { setAttr(f, f.pup, 'pup', 'translate(' + f1(f.look * 4.5 + no * 4) + ',0)'); }

    if (f.eyes) { setAttr(f, f.eyes, 'eyes', 'translate(0,-230) scale(1,' + bk.toFixed(2) + ') translate(0,230)'); }

  // Moll's stocking grows a little with every questioning she sits through.
  function drawKnitting(f, rounds) {
    if (!f.knit) { return; }
    var len = clamp(14 + rounds * 5, 14, 70);
    f.knit.innerHTML = '<rect x="-12" y="-96" width="24" height="' + len + '" rx="7" fill="#8d8a84"/>'
      + '<path d="M -12 ' + (-96 + len * 0.33) + ' L 12 ' + (-96 + len * 0.33) + ' M -12 ' + (-96 + len * 0.66) + ' L 12 ' + (-96 + len * 0.66) + '" stroke="#77736c" stroke-width="2"/>'
      + '<path d="M -30 -112 L 22 -88 M 30 -112 L -22 -88" stroke="#c9b27a" stroke-width="3.5" stroke-linecap="round"/>';
  }

  // Walking along a list of points, at a steady pace.
  function alongPath(f, u) {
    var d = u * f.total, i = 0;
    while (i < f.seg.length - 1 && d > f.seg[i]) { d -= f.seg[i]; i++; }
    var t = f.seg[i] ? clamp(d / f.seg[i], 0, 1) : 1;
    var a = f.path[i], b = f.path[i + 1];
    var p = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    if (a.op !== undefined && b.op !== undefined) { p.op = a.op + (b.op - a.op) * t; }
    return p;
  }

  function walk(f, pts, speed) {
    return new Promise(function (resolve) {
      var all = [{ x: f.x, y: f.y, op: f.op }].concat(pts.map(function (p) {
        return { x: p.x, y: p.y, op: p.op === undefined ? 1 : p.op };
      }));
      var seg = [], total = 0;
      for (var i = 1; i < all.length; i++) {

        seg.push(dd); total += dd;
      }

      }
      f.path = all; f.seg = seg; f.total = total;
      f.wt = 0; f.wdur = total / (speed || 400);

      f.onArrive = function () { f.lookT = 0; resolve(); };

    });
  }

  var walkers = [];
  function skipWalks() {
    walkers.forEach(function (f) {
      if (f.walking) { f.wt = 1; f.wdur = 0.0001; }
    });
    walkers = [];
  }

  // ------------------------------------------------------------------
  // The two places: the cell, and the Governor's room upstairs.
  //
  // The world is 1000 units wide and as tall as the screen needs. The
  // floor sits just above the speech box, so whoever is talking never
  // hides anybody's feet, and everything else hangs off that line.
  // ------------------------------------------------------------------
  var svg = $('scene'), cellG = $('cell'), roomG = $('room');
  var CL = {}, RL = {};
  ['back', 'chalk', 'door', 'beam', 'props', 'tallies', 'rat', 'figs', 'fx', 'vig'].forEach(function (k) {
    CL[k] = el('g'); cellG.appendChild(CL[k]);
  });
  ['back', 'figs', 'desk', 'fx', 'vig'].forEach(function (k) {
    RL[k] = el('g'); roomG.appendChild(RL[k]);
  });

  var LAY = { n: 2 };
  var SCENE = 'cell';
  var FIG = {};
  var glowNodes = [];

  function seeded(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  function layout() {
    var vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
    // Caslon sets wide, so a touch smaller than a plain sans would be, and
    // upright, where lines are short, room for four of them.
    var fs = clamp(Math.min(vw * 0.026 + 7.5, vh * 0.032 + 5), 14.5, 22);
    var lines = vh > vw * 1.1 ? 4 : 3;
    var facew = clamp(Math.min(vw * 0.16, vh * 0.2), 56, 96);
    var boxPx = Math.max(facew + 26, fs * 1.32 * lines + 30);
    var rs = document.documentElement.style;
    rs.setProperty('--fs', f1(fs) + 'px');
    rs.setProperty('--facew', Math.round(facew) + 'px');
    rs.setProperty('--boxh', Math.round(boxPx) + 'px');

    var W = 1000, H = clamp(Math.round(W * vh / vw), 380, 2400);
    var upx = Math.min(W / vw, H / vh);
    var portrait = vh > vw * 1.1;
    var floorY = H - (boxPx + 16) * upx;
    var n = LAY.n || 2, s, bs, backY, mollX, mollY, doorW, doorX0, slotW, xs = [], i;
    if (portrait) {
      // Upright, the cell is deep: the prisoners stand across the front,
      // with Moll and the door at the back wall behind them.
      s = clamp(Math.min(960 / (n * 165), (floorY - H * 0.45) / 322), 0.32, 1.7);
      bs = s * 0.72;
      backY = floorY - 190 * s;
      slotW = 960 / n;
      for (i = 0; i < n; i++) { xs.push(20 + slotW * (i + 0.5)); }
      // Moll sits up on a plank bunk chained to the wall, over the heads
      // of the front row and the marks on the wall above them, so the
      // narrator is never hidden behind somebody.
      mollX = 30 + 84 * bs;
      mollY = floorY - 322 * s - 160 - 30 * bs * 0.95;
      doorW = 150 * bs; doorX0 = 975 - doorW;
    } else {
      // Sideways, everyone stands in one row, Moll at one end and the
      // door at the other, with room over the heads for the tally marks
      // and for a speech bubble when the names come out. A gap is left
      // inside the door for the turnkey to step into while folk go past.
      var sH = (floorY - 120) / 322, sW = 960 / (n * 165 + 400);
      s = clamp(Math.min(sH, sW), 0.32, 1.7);
      bs = s * 0.92;
      backY = floorY - 44 * s;
      doorW = 150 * s; doorX0 = 992 - doorW;
      var left = 22 + 152 * s + 8, right = doorX0 - 8 - 92 * s;
      slotW = (right - left) / n;
      for (i = 0; i < n; i++) { xs.push(left + slotW * (i + 0.5)); }
      mollX = 22 + 76 * s; mollY = floorY;
    }

    LAY = {
      n: n, W: W, H: H, upx: upx, portrait: portrait, fs: fs, vw: vw, vh: vh,
      floorY: floorY, backY: backY, s: s, bs: bs, backK: bs / s,
      mollX: mollX, mollY: mollY,

    drawRoom();
    placeCast();
    drawTallies();
    drawChalk();
  }

  // --- the cell -------------------------------------------------------
  function drawCellBack() {
    var g = CL.back, W = LAY.W, H = LAY.H, s = LAY.portrait ? LAY.bs : LAY.s, fy = LAY.floorY, by = LAY.backY;
    var R = seeded(1789), parts = [], i;
    clear(g); clear(CL.beam); clear(CL.props); clear(CL.vig);
    glowNodes = glowNodes.filter(function (n) { return n.scene !== 'cell'; });

    parts.push('<rect x="0" y="0" width="' + W + '" height="' + by + '" fill="url(#hat-stone)"/>');
    for (i = 0; i < 9; i++) {
      var dx = R() * W, dy = R() * by, rr = 60 + R() * 140;
      parts.push('<ellipse cx="' + f1(dx) + '" cy="' + f1(dy) + '" rx="' + f1(rr) + '" ry="' + f1(rr * (1.2 + R())) + '" fill="url(#hat-damp)"/>');
    }
    // moss and muck along the foot of the wall
    parts.push('<rect x="0" y="' + f1(by - 14 * s) + '" width="' + W + '" height="' + f1(14 * s) + '" fill="#2a3420" opacity="0.6"/>');

    // the window, with the moon in it
    var win;
    if (LAY.portrait) {
      win = { x: 500 - 135, y: H * 0.05 + 10, w: 270, h: 210 };
    } else {
      var mollTop = LAY.mollY - 290 * 0.95 * scaleAt(LAY.mollY);
      var wb = mollTop - 16, wh = Math.min(170 * s, wb - 14), ww = Math.min(128 * s, 150);
      win = wh > 44 ? { x: LAY.mollX - ww / 2, y: wb - wh, w: ww, h: wh } : null;
    }
    if (win) {
      var wx = win.x, wy = win.y, wW = win.w, wH = win.h, fr = Math.max(8, wW * 0.08);
      parts.push('<rect x="' + f1(wx - fr) + '" y="' + f1(wy - fr) + '" width="' + f1(wW + fr * 2) + '" height="' + f1(wH + fr * 2) + '" rx="' + f1(fr) + '" fill="#1d1e1a"/>');
      parts.push('<rect x="' + f1(wx) + '" y="' + f1(wy) + '" width="' + f1(wW) + '" height="' + f1(wH) + '" fill="url(#hat-night)"/>');
      // The moon sits in the upper left of the window, so the light it
      // throws comes in from the left and falls down and to the right.
      parts.push('<circle cx="' + f1(wx + wW * 0.32) + '" cy="' + f1(wy + wH * 0.32) + '" r="' + f1(wW * 0.15) + '" fill="#e9e6d2"/>');
      parts.push('<circle cx="' + f1(wx + wW * 0.28) + '" cy="' + f1(wy + wH * 0.3) + '" r="' + f1(wW * 0.03) + '" fill="#cfcab4"/><circle cx="' + f1(wx + wW * 0.36) + '" cy="' + f1(wy + wH * 0.37) + '" r="' + f1(wW * 0.022) + '" fill="#cfcab4"/>');
      for (i = 0; i < 6; i++) {
        parts.push('<circle cx="' + f1(wx + R() * wW) + '" cy="' + f1(wy + R() * wH * 0.8) + '" r="' + f1(1 + R() * 1.6) + '" fill="#fff" opacity="0.7"/>');
      }
      var bars = 4, bw = Math.max(4, wW * 0.045);
      for (i = 1; i <= bars; i++) {
        var bx = wx + wW * i / (bars + 1);
        parts.push('<rect x="' + f1(bx - bw / 2) + '" y="' + f1(wy - 2) + '" width="' + f1(bw) + '" height="' + f1(wH + 4) + '" fill="#121210"/>');
      }
      parts.push('<rect x="' + f1(wx - 2) + '" y="' + f1(wy + wH * 0.5 - bw / 2) + '" width="' + f1(wW + 4) + '" height="' + f1(bw) + '" fill="#121210"/>');
      parts.push('<rect x="' + f1(wx - fr * 1.4) + '" y="' + f1(wy + wH + fr * 0.6) + '" width="' + f1(wW + fr * 2.8) + '" height="' + f1(fr * 1.1) + '" fill="#4b4d45"/>');
      // moonlight is parallel, so the shaft is a slanted slab the width of
      // the window, not a fan
      var bd = (fy + 40 * s - wy - wH) * 0.34;
      CL.beam.innerHTML = '<polygon points="' + f1(wx) + ',' + f1(wy + wH) + ' ' + f1(wx + wW) + ',' + f1(wy + wH) + ' '
        + f1(wx + wW + bd) + ',' + f1(fy + 40 * s) + ' ' + f1(wx + bd) + ',' + f1(fy + 40 * s) + '" fill="url(#hat-beam)"/>';
    }

    // Upright there's wall to spare, so what Moll works out goes up on it
    // in chalk, as she works it out.
    LAY.chalk = null;
    if (LAY.portrait) {
      var ct = win ? win.y + win.h + 46 : H * 0.08;
      var cb = LAY.mollY - 288 * LAY.bs * 0.95 - 34;
      if (cb - ct > 180) { LAY.chalk = { cx: 500, top: ct, w: Math.min(760, (cb - ct) * 2), h: Math.min(cb - ct, 420) }; }
    }

    // old scratches left by whoever was here before
    var ty0 = LAY.portrait ? H * 0.05 + 250 : 10;
    for (i = 0; i < (LAY.portrait ? 5 : 2); i++) {
      var ox = 60 + R() * 880, oy = ty0 + R() * Math.max(20, LAY.figTop - ty0 - 60);
      parts.push('<g opacity="0.16" stroke="#d8d4c4" stroke-width="2" stroke-linecap="round">' + oldTally(ox, oy, 14 + R() * 10, 1 + Math.floor(R() * 3)) + '</g>');
    }

    // chains on the wall between the places where people stand
    for (i = 0; i <= LAY.n; i++) {
      if (i === 0 || i === LAY.n) { continue; }
      var cx = (LAY.xs[i - 1] + LAY.xs[i]) / 2, cy = by - 180 * s;
      parts.push(chainSVG(cx, cy, s));
    }

    // the door: a stone frame, the corridor beyond, then the door itself
    var d0 = LAY.doorX0, d1 = LAY.doorX1, dh = LAY.doorH, dt = by - dh, fw = 12 * s;
    parts.push('<rect x="' + f1(d0 - fw) + '" y="' + f1(dt - fw) + '" width="' + f1(d1 - d0 + fw * 2) + '" height="' + f1(dh + fw) + '" rx="' + f1(fw) + '" fill="#2a2b26"/>');
    parts.push('<rect x="' + f1(d0) + '" y="' + f1(dt) + '" width="' + f1(d1 - d0) + '" height="' + f1(dh) + '" fill="url(#hat-corr)"/>');
    var glowC = el('circle', { cx: f1(LAY.doorCx), cy: f1(dt + dh * 0.35), r: f1(dh * 0.5), fill: 'url(#hat-glow)', opacity: 0.8 });

    // the floor
    parts.push('<rect x="0" y="' + f1(by) + '" width="' + W + '" height="' + f1(H - by) + '" fill="url(#hat-flag)"/>');
    parts.push('<rect x="0" y="' + f1(by) + '" width="' + W + '" height="' + f1(H - by) + '" fill="url(#hat-floorshade)"/>');

    // the lantern on its bracket beside the door
    var lx = d0 - 34 * s, ly = dt + 40 * s;
    parts.push('<path d="M ' + f1(d0 - fw) + ' ' + f1(ly - 18 * s) + ' L ' + f1(lx) + ' ' + f1(ly - 18 * s) + ' L ' + f1(lx) + ' ' + f1(ly - 6 * s) + '" stroke="#151512" stroke-width="' + f1(5 * s) + '" fill="none"/>');
    parts.push('<rect x="' + f1(lx - 12 * s) + '" y="' + f1(ly - 6 * s) + '" width="' + f1(24 * s) + '" height="' + f1(32 * s) + '" rx="' + f1(4 * s) + '" fill="#ffcf72" stroke="#151512" stroke-width="' + f1(4 * s) + '"/>');
    parts.push('<path d="M ' + f1(lx - 12 * s) + ' ' + f1(ly + 6 * s) + ' L ' + f1(lx + 12 * s) + ' ' + f1(ly + 6 * s) + '" stroke="#151512" stroke-width="' + f1(2.5 * s) + '"/>');

    g.innerHTML = parts.join('');
    g.appendChild(glowC);
    var lglow = el('circle', { cx: f1(lx), cy: f1(ly + 10 * s), r: f1(170 * s), fill: 'url(#hat-glow)' });
    g.appendChild(lglow);
    glowNodes.push({ node: lglow, scene: 'cell', base: 1 }, { node: glowC, scene: 'cell', base: 0.8, still: true });

    drawDoor();

    // straw, a bucket, a bowl, and the rat's front door
    var pr = [];
    var R2 = seeded(42);
    for (i = 0; i < 70; i++) {
      var sx = R2() * W, sy = by + R2() * (fy - by + 30 * s), len = (10 + R2() * 18) * s, ang = (R2() - 0.5) * 1.2;
      pr.push('<path d="M ' + f1(sx) + ' ' + f1(sy) + ' l ' + f1(Math.cos(ang) * len) + ' ' + f1(Math.sin(ang) * len) + '" stroke="' + (R2() < 0.5 ? '#9c8346' : '#7b6634') + '" stroke-width="' + f1(Math.max(1.4, 2.6 * s)) + '" stroke-linecap="round"/>');
    }
    var bkx = d0 - 52 * s, bky = by + 18 * s;
    pr.push('<path d="M ' + f1(bkx - 24 * s) + ' ' + f1(bky - 40 * s) + ' L ' + f1(bkx + 24 * s) + ' ' + f1(bky - 40 * s) + ' L ' + f1(bkx + 19 * s) + ' ' + f1(bky) + ' L ' + f1(bkx - 19 * s) + ' ' + f1(bky) + ' Z" fill="#4a3a28" stroke="#1f1710" stroke-width="' + f1(3 * s) + '"/>');
    pr.push('<path d="M ' + f1(bkx - 24 * s) + ' ' + f1(bky - 28 * s) + ' L ' + f1(bkx + 24 * s) + ' ' + f1(bky - 28 * s) + ' M ' + f1(bkx - 21 * s) + ' ' + f1(bky - 12 * s) + ' L ' + f1(bkx + 21 * s) + ' ' + f1(bky - 12 * s) + '" stroke="#2a2018" stroke-width="' + f1(4 * s) + '"/>');
    pr.push('<path d="M ' + f1(bkx - 22 * s) + ' ' + f1(bky - 40 * s) + ' Q ' + f1(bkx) + ' ' + f1(bky - 72 * s) + ' ' + f1(bkx + 22 * s) + ' ' + f1(bky - 40 * s) + '" stroke="#2a2018" stroke-width="' + f1(3 * s) + '" fill="none"/>');
    var bwx = LAY.mollX + 64 * s, bwy = by + 26 * s;
    pr.push('<ellipse cx="' + f1(bwx) + '" cy="' + f1(bwy) + '" rx="' + f1(22 * s) + '" ry="' + f1(8 * s) + '" fill="#6b5a44"/><ellipse cx="' + f1(bwx) + '" cy="' + f1(bwy - 2 * s) + '" rx="' + f1(16 * s) + '" ry="' + f1(4.5 * s) + '" fill="#a39a6a"/>');
    if (LAY.portrait) {
      // Moll's bunk: a plank on chains, the only furniture in the place.
      var ms = LAY.bs * 0.95, sy0 = LAY.mollY - 44 * ms, px1 = LAY.mollX + 100 * ms;
      pr.push('<rect x="0" y="' + f1(sy0 + 14 * ms) + '" width="' + f1(px1) + '" height="' + f1(26 * ms) + '" fill="#000" opacity="0.25"/>');
      pr.push('<rect x="-4" y="' + f1(sy0) + '" width="' + f1(px1 + 4) + '" height="' + f1(16 * ms) + '" rx="' + f1(3 * ms) + '" fill="#5a3d25" stroke="#2a1a0c" stroke-width="' + f1(3 * ms) + '"/>');
      pr.push('<path d="M ' + f1(px1 - 8 * ms) + ' ' + f1(sy0) + ' L ' + f1(px1 - 40 * ms) + ' ' + f1(sy0 - 190 * ms) + '" stroke="#1c1d1f" stroke-width="' + f1(5 * ms) + '" stroke-dasharray="' + f1(9 * ms) + ' ' + f1(4 * ms) + '"/>');
      pr.push('<circle cx="' + f1(px1 - 40 * ms) + '" cy="' + f1(sy0 - 196 * ms) + '" r="' + f1(7 * ms) + '" fill="none" stroke="#17181a" stroke-width="' + f1(4 * ms) + '"/>');
    }
    RAT.hx = LAY.mollX + 120 * s;
    RAT.hy = by;
    pr.push('<path d="M ' + f1(RAT.hx - 18 * s) + ' ' + f1(by) + ' Q ' + f1(RAT.hx) + ' ' + f1(by - 30 * s) + ' ' + f1(RAT.hx + 18 * s) + ' ' + f1(by) + ' Z" fill="#0b0b09"/>');
    CL.props.innerHTML = pr.join('');

    CL.vig.innerHTML = '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="url(#hat-vig)" pointer-events="none"/>';
    drawRat();
  }

  // A bowl in chalk: steaming for a dinner, struck through for none.
  function chalkBowl(fed, col) {
    return '<path d="M -34 -4 Q -32 30 0 32 Q 32 30 34 -4 Z" fill="none" stroke="' + col + '" stroke-width="6" stroke-linejoin="round"/>'
      + '<path d="M -41 -4 L 41 -4" stroke="' + col + '" stroke-width="6" stroke-linecap="round"/>'
      + (fed ? '<path d="M -12 -14 q -7 -9 0 -18 q 7 -9 0 -18 M 12 -14 q -7 -9 0 -18 q 7 -9 0 -18" stroke="' + col + '" stroke-width="5" fill="none" stroke-linecap="round"/>'
        : '<path d="M -38 -40 L 38 40" stroke="#ff9d88" stroke-width="7" stroke-linecap="round"/>');
  }
  function bowlSVG(fed) {
    return '<svg class="bw" viewBox="-46 -54 92 92" aria-hidden="true">' + chalkBowl(fed, '#ece8da') + '</svg>';
  }

  // What Moll has worked out, in chalk on the wall over the door: a line
  // for each way a questioning can go once it has happened, each choice
  // beside the days and the dinner it brought. Upright only; sideways
  // there's no wall to spare and the board button shows the same thing.
  function drawChalk() {
    var g = CL.chalk;
    clear(g);
    var c = LAY.chalk;
    if (!c || !S || !S.inGame || !S.found) { return; }
    var rh = c.h / 3, x0 = c.cx - c.w / 2, ch = '#e9e4d4';
    var fsz = rh * 0.5, ic = rh * 0.62 / 124, lsz = Math.min(rh * 0.26, 44), bk = rh * 0.5 / 92;
    var s = '<g opacity="0.82" font-family="' + SERIF + '" font-weight="700" fill="' + ch + '">';
    FOUND_ROWS.forEach(function (r, i) {
      if (!S.found[r[0]]) { return; }
      var cy = c.top + rh * (i + 0.5);
      var col = function (n) { return n <= 0 ? '#b6e69a' : (n >= 3 ? '#ff9d88' : ch); };
      s += '<g transform="translate(' + f1(x0 + c.w * 0.06) + ',' + f1(cy) + ') scale(' + f1(ic) + ')">' + (r[1] === 'C' ? iconMum() : iconSnitch()) + '</g>';
      s += '<text x="' + f1(x0 + c.w * 0.13) + '" y="' + f1(cy + fsz * 0.35) + '" font-size="' + f1(fsz) + '" fill="' + col(r[2]) + '">' + r[2] + '</text>';
      s += '<g transform="translate(' + f1(x0 + c.w * 0.23) + ',' + f1(cy + rh * 0.04) + ') scale(' + f1(bk) + ')">' + chalkBowl(r[6], ch) + '</g>';
      s += '<text x="' + f1(x0 + c.w * 0.29) + '" y="' + f1(cy + lsz * 0.35) + '" font-size="' + f1(lsz) + '" font-style="italic" opacity="0.7">and</text>';
      s += '<g transform="translate(' + f1(x0 + c.w * 0.43) + ',' + f1(cy) + ') scale(' + f1(-ic) + ',' + f1(ic) + ')">' + (r[3] === 'C' ? iconMum() : iconSnitch()) + '</g>';
      s += '<text x="' + f1(x0 + c.w * 0.50) + '" y="' + f1(cy + fsz * 0.35) + '" font-size="' + f1(fsz) + '" fill="' + col(r[4]) + '">' + r[4] + '</text>';
      s += '<g transform="translate(' + f1(x0 + c.w * 0.60) + ',' + f1(cy + rh * 0.04) + ') scale(' + f1(bk) + ')">' + chalkBowl(r[7], ch) + '</g>';
      s += '<text x="' + f1(x0 + c.w) + '" y="' + f1(cy + lsz * 0.35) + '" font-size="' + f1(lsz) + '" font-style="italic" text-anchor="end" opacity="0.8">' + r[5] + '</text>';
      if (i > 0) {
        s += '<path d="M ' + f1(x0) + ' ' + f1(c.top + rh * i) + ' L ' + f1(x0 + c.w) + ' ' + f1(c.top + rh * i) + '" stroke="' + ch + '" stroke-width="3" stroke-dasharray="10 8" opacity="0.4"/>';
      }
    });
    g.innerHTML = s + '</g>';
  }

  function oldTally(x, y, h, groups) {
    var s = '';
    for (var g = 0; g < groups; g++) {
      var gx = x + g * h * 1.1;
      for (var k = 0; k < 4; k++) { s += '<path d="M ' + f1(gx + k * h * 0.18) + ' ' + f1(y) + ' l 0 ' + f1(h) + '"/>'; }
      s += '<path d="M ' + f1(gx - h * 0.1) + ' ' + f1(y + h * 0.8) + ' L ' + f1(gx + h * 0.66) + ' ' + f1(y + h * 0.2) + '"/>';
    }
    return s;
  }

  function chainSVG(cx, cy, s) {
    var st = '';
    st += '<circle cx="' + f1(cx) + '" cy="' + f1(cy) + '" r="' + f1(9 * s) + '" fill="none" stroke="#17181a" stroke-width="' + f1(5 * s) + '"/>';
    for (var i = 0; i < 6; i++) {
      var y = cy + 12 * s + i * 13 * s, x = cx + Math.sin(i * 0.6) * 3 * s;
      st += '<ellipse cx="' + f1(x) + '" cy="' + f1(y) + '" rx="' + f1((i % 2 ? 3 : 5) * s) + '" ry="' + f1(8 * s) + '" fill="none" stroke="#1c1d1f" stroke-width="' + f1(3.5 * s) + '"/>';
    }
    st += '<path d="M ' + f1(cx - 13 * s) + ' ' + f1(cy + 94 * s) + ' a ' + f1(13 * s) + ' ' + f1(11 * s) + ' 0 1 0 ' + f1(26 * s) + ' 0" fill="none" stroke="#1c1d1f" stroke-width="' + f1(6 * s) + '"/>';
    return st;
  }

  var doorOpen = 0, doorTarget = 0, doorLeaf = null;
  function drawDoor() {
    clear(CL.door);
    var d0 = LAY.doorX0, d1 = LAY.doorX1, dh = LAY.doorH, dt = LAY.backY - dh, s = LAY.portrait ? LAY.bs : LAY.s, w = d1 - d0;
    doorLeaf = el('g');
    var p = [];
    var planks = 4;
    for (var i = 0; i < planks; i++) {
      p.push('<rect x="' + f1(d0 + w * i / planks) + '" y="' + f1(dt) + '" width="' + f1(w / planks + 0.5) + '" height="' + f1(dh) + '" fill="' + (i % 2 ? '#4f3520' : '#5a3d25') + '"/>');
      p.push('<path d="M ' + f1(d0 + w * (i + 0.5) / planks) + ' ' + f1(dt + 8) + ' Q ' + f1(d0 + w * (i + 0.4) / planks) + ' ' + f1(dt + dh * 0.5) + ' ' + f1(d0 + w * (i + 0.55) / planks) + ' ' + f1(dt + dh - 8) + '" stroke="#3e2816" stroke-width="2" fill="none"/>');
    }
    [0.16, 0.56, 0.86].forEach(function (k) {
      p.push('<rect x="' + f1(d0) + '" y="' + f1(dt + dh * k) + '" width="' + f1(w) + '" height="' + f1(12 * s) + '" fill="#1d1c1a"/>');
      for (var j = 0; j < 4; j++) {
        p.push('<circle cx="' + f1(d0 + w * (j + 0.5) / 4) + '" cy="' + f1(dt + dh * k + 6 * s) + '" r="' + f1(3 * s) + '" fill="#5c5a54"/>');
      }
    });
    var gx = d0 + w * 0.28, gy = dt + dh * 0.26, gw = w * 0.44, gh = dh * 0.2;
    p.push('<rect x="' + f1(gx) + '" y="' + f1(gy) + '" width="' + f1(gw) + '" height="' + f1(gh) + '" fill="#0d0b08" stroke="#1d1c1a" stroke-width="' + f1(4 * s) + '"/>');
    for (var b = 1; b <= 3; b++) {
      p.push('<rect x="' + f1(gx + gw * b / 4 - 2 * s) + '" y="' + f1(gy) + '" width="' + f1(4 * s) + '" height="' + f1(gh) + '" fill="#1d1c1a"/>');
    }
    p.push('<circle cx="' + f1(d0 + w * 0.16) + '" cy="' + f1(dt + dh * 0.66) + '" r="' + f1(11 * s) + '" fill="none" stroke="#1d1c1a" stroke-width="' + f1(5 * s) + '"/>');
    p.push('<rect class="dshade" x="' + f1(d0) + '" y="' + f1(dt) + '" width="' + f1(w) + '" height="' + f1(dh) + '" fill="#000" opacity="0"/>');
    doorLeaf.innerHTML = p.join('');
    CL.door.appendChild(doorLeaf);
    paintDoor();
  }

  function paintDoor() {
    if (!doorLeaf) { return; }
    var k = 1 - doorOpen * 0.86, h = LAY.doorX1;
    doorLeaf.setAttribute('transform', 'translate(' + f1(h) + ',0) scale(' + k.toFixed(3) + ',1) translate(' + f1(-h) + ',0)');
    var sh = doorLeaf.querySelector('.dshade');
    if (sh) { sh.setAttribute('opacity', (doorOpen * 0.45).toFixed(2)); }
  }

  function setDoor(open) {
    if (doorTarget === open) { return Promise.resolve(); }
    doorTarget = open;
    if (open) { creak(); keys(); }
    return sleep(reduced ? 50 : 520).then(function () { if (!open) { slam(); } });
  }

  // --- the tally marks ------------------------------------------------
  function drawTallies() {
    var g = CL.tallies;
    clear(g);
    if (!S || !S.prisoners || !S.inGame) { return; }
    var portrait = LAY.portrait;
    S.prisoners.forEach(function (p, i) {
      if (i >= LAY.xs.length) { return; }
      // Just over each prisoner's head: up against the ceiling when they
      // stand in a row, under Moll's bunk when the cell is deep. Kept
      // clear of the buttons in the top corner.
      var x0 = LAY.xs[i] - LAY.slotW * 0.44, x1 = LAY.xs[i] + LAY.slotW * 0.44;
      var bottom = LAY.figTop - 8, top = 8;
      if (portrait) { bottom = LAY.figTop - 14; top = LAY.figTop - 150; }
      if (top < 64 * LAY.upx) { x1 = Math.min(x1, LAY.W - 168 * LAY.upx); }
      var zoneH = Math.max(30, bottom - top), zoneW = Math.max(40, x1 - x0);
      var nameH = clamp(Math.min(zoneH * 0.32, LAY.slotW * 0.13), 13, 46);
      var n = p.shown || 0;
      var gp = n ? Math.ceil(n / 5) : 0;

      var t = el('text', {
        x: f1(x0), y: f1(top + nameH * 0.85),
        fill: '#e9e4d4', opacity: 0.88,
        'font-family': SERIF, 'font-style': 'italic', 'font-weight': 700,
        'font-size': f1(nameH)
      });
      t.textContent = p.name;
      g.appendChild(t);
      var num = el('text', {
        x: f1(x0 + zoneW), y: f1(top + nameH * 0.85), 'text-anchor': 'end',
        fill: '#f3e7b6', 'font-family': SERIF, 'font-weight': 700,
        'font-size': f1(nameH * 1.1)
      });
      num.textContent = String(n);
      g.appendChild(num);
      if (!gp) { return; }

      // As big as will fit, in groups of five.
      var avail = zoneH - nameH * 1.25, mh = Math.min(portrait ? 70 : 40, avail), adv, perRow, rows;
      for (var tries = 0; tries < 30; tries++) {
        adv = mh * 0.95;
        perRow = Math.max(1, Math.floor(zoneW / adv));
        rows = Math.ceil(gp / perRow);
        if (rows * mh * 1.22 <= avail || mh < 6) { break; }
        mh *= 0.88;
      }
      var R = seeded(7 + i * 31), path = '';
      for (var m = 0; m < n; m++) {
        var gi = Math.floor(m / 5), k = m % 5;
        var row = Math.floor(gi / perRow), col = gi % perRow;
        var gx = x0 + col * adv + mh * 0.1, gy = top + nameH * 1.25 + row * mh * 1.22;
        var j1 = (R() - 0.5) * mh * 0.06, j2 = (R() - 0.5) * mh * 0.06;
        if (k < 4) {
          var x = gx + k * mh * 0.17;
          path += 'M ' + f1(x + j1) + ' ' + f1(gy) + ' L ' + f1(x + j2) + ' ' + f1(gy + mh) + ' ';
        } else {
          path += 'M ' + f1(gx - mh * 0.12) + ' ' + f1(gy + mh * 0.82 + j1) + ' L ' + f1(gx + mh * 0.64) + ' ' + f1(gy + mh * 0.18 + j2) + ' ';
        }
      }
      g.appendChild(el('path', {
        d: path, stroke: '#ece6d2', 'stroke-width': f1(Math.max(1.6, mh * 0.085)),
        'stroke-linecap': 'round', fill: 'none', opacity: 0.92
      }));
    });
  }

  // Count the wall up (or rub one out) a mark at a time, so it can be seen.
  function countTo(p, target) {
    return new Promise(function (resolve) {
      var my = RUN;
      (function tick() {
        if (my !== RUN) { return; }

  // --- who stands where -------------------------------------------------

    return LAY.s * lerp(LAY.backK, 1, k);
  }

  function placeCast() {

        var f = FIG[p.id];
        if (!f) { return; }
        if (!f.walking && !f.away) { f.x = LAY.xs[i]; f.y = LAY.floorY; }
        if (f.away) { f.x = LAY.doorCx; f.y = LAY.backY; }
      });

  // Nearer the front, drawn later: whoever walks behind somebody goes
  // behind them.
  function sortFigs() {
    var kids = CL.figs.childNodes, list = [], i, ok = true;
    for (i = 0; i < kids.length; i++) {
      for (var j = 0; j < FIGS.length; j++) { if (FIGS[j].root === kids[i]) { list.push(FIGS[j]); break; } }
    }
    for (i = 1; i < list.length; i++) { if (list[i].y < list[i - 1].y - 0.5) { ok = false; break; } }
    if (ok) { return; }
    list.slice().sort(function (a, b) { return a.y - b.y; }).forEach(function (f) { CL.figs.appendChild(f.root); });
  }

  function slotOf(p) { return S.prisoners.indexOf(p); }

  // --- bubbles over heads, numbers that rise -----------------------------

  function iconMum() {

  function bubble(f, kind, dir) {
    // Upright there's wall to spare, so the bubbles can be bigger.
    var g = el('g'), s = f.s * (LAY.portrait ? 1.2 : 1.05);
    var bx = f.x - dir * 8 * f.s, by = Math.max(f.y - 372 * f.s - (LAY.portrait ? 50 : 0), 74 * s * 0.85);

    var icon = kind === 'C' ? iconMum() : (kind === 'H' ? iconHungry() : iconSnitch());
    g.innerHTML = '<g transform="scale(' + (dir < 0 ? -1 : 1) + ',1)">'
      + '<path d="M -62 -54 Q -62 -70 -46 -70 L 46 -70 Q 62 -70 62 -54 L 62 34 Q 62 50 46 50 L -6 50 L -30 76 L -26 50 L -46 50 Q -62 50 -62 34 Z" fill="#fbf4e2" stroke="' + col + '" stroke-width="7"/>'
      + '</g><g transform="translate(0,-10) scale(0.92,0.92)">' + '<g transform="scale(' + (dir < 0 ? -1 : 1) + ',1)">' + icon + '</g></g>';

  function riser(x, y, text, col) {
    var t = el('text', {
      x: 0, y: 0, 'text-anchor': 'middle', fill: col || '#f3e7b6',
      'font-family': SERIF, 'font-weight': 700, 'font-size': f1(56 * LAY.s),
      stroke: '#1a1410', 'stroke-width': f1(5 * LAY.s), 'paint-order': 'stroke'
    });
    t.textContent = text;
    CL.fx.appendChild(t);
    var item = { g: t, t: 0, kind: 'rise', x: x, y: y, s: 1 };
    FX.push(item);
    paintFx(item);
  }

  function paintFx(it) {
    if (it.kind === 'pop') {
      var k = reduced ? 1 : Math.min(1, it.t / 0.22);
      var sc = it.s * (reduced ? 1 : (k < 1 ? 0.4 + 0.75 * k : 1 + 0.15 * Math.max(0, 0.35 - (it.t - 0.22)) / 0.35));
      it.g.setAttribute('transform', 'translate(' + f1(it.x) + ',' + f1(it.y) + ') scale(' + sc.toFixed(3) + ')');
    } else {
      var up = reduced ? 0 : it.t * 70 * LAY.s;
      it.g.setAttribute('transform', 'translate(' + f1(it.x) + ',' + f1(it.y - up) + ')');
      it.g.setAttribute('opacity', clamp(1.6 - it.t, 0, 1).toFixed(2));
    }
  }

  function updateFx(dt) {
    for (var i = FX.length - 1; i >= 0; i--) {
      var it = FX[i];
      it.t += dt;
      if (it.kind === 'rise' && it.t > 1.6) { if (it.g.parentNode) { it.g.parentNode.removeChild(it.g); } FX.splice(i, 1); continue; }
      if (it.kind === 'pop' && it.t > 0.6) { continue; }
      paintFx(it);
    }
  }

  function clearBubbles() {
    FX = FX.filter(function (it) {
      if (it.kind === 'pop') { if (it.g.parentNode) { it.g.parentNode.removeChild(it.g); } return false; }
      return true;
    });
  }

  // --- the frame loop ---------------------------------------------------
  // Lamplight wavers a few times a second, not every frame: a big soft
  // gradient repainted sixty times a second is exactly what made the
  // Pixel's screen flicker in Hoot's Postcards.
  var flick = 0, flickNext = 0;
  function flicker(dt) {
    flick += dt;
    if (flick < flickNext) { return; }
    flickNext = flick + 0.13;
    for (var i = 0; i < glowNodes.length; i++) {
      var gnode = glowNodes[i];
      if (gnode.scene !== SCENE) { continue; }
      var v = reduced || gnode.still ? gnode.base : gnode.base * (0.88 + 0.12 * Math.random());
      v = v.toFixed(2);
      if (gnode.last !== v) { gnode.last = v; gnode.node.setAttribute('opacity', v); }
    }
  }

  // A page can start before it knows its own size (a web view still
  // being laid out, a tab opened in the background) and a resize event
  // isn't always sent, so look for ourselves every half second or so.
  var lastFrame = 0, sizeCheck = 0;
  function frame(now) {
    var dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0.016;
    lastFrame = now;
    if (++sizeCheck % 30 === 0 && (window.innerWidth !== LAY.vw || window.innerHeight !== LAY.vh) && window.innerWidth > 0) { layout(); }
    // Standing aside, the turnkey keeps an eye on whoever's going past.
    var kf = FIG.key;
    if (kf && kf.watch && !kf.walking && SCENE === 'cell') {
      var near = null, nd = 1e9;
      for (var j = 0; j < FIGS.length; j++) {
        var w = FIGS[j];
        if (w === kf || !w.walking || w.scene !== 'cell' || w.op < 0.3) { continue; }
        var d = Math.abs(w.x - kf.x) + Math.abs(w.y - kf.y);
        if (d < nd) { nd = d; near = w; }
      }
      if (near) { kf.lookT = clamp((near.x - kf.x) / 80, -1, 1); }
    }
    for (var i = 0; i < FIGS.length; i++) {
      var f = FIGS[i];
      if (f.scene === SCENE) { updateFig(f, dt); }
    }
    var dk = doorTarget ? 1 : 0;
    if (doorOpen !== dk) {
      doorOpen = reduced ? dk : clamp(doorOpen + (dk ? dt : -dt) * 2.4, 0, 1);
      paintDoor();
    }
    if (SCENE === 'cell') { sortFigs(); }
    flicker(dt);
    updateRat(dt);
    updateFx(dt);
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------

    opts = opts || {};

      speechEl.classList.add('show');

  // ------------------------------------------------------------------
  // The rules.
  //
  // Every questioning, for every pair of prisoners:
  //   both keep mum         one day each
  //   one snitches          the snitch none, the other three
  //   both snitch           two days each
  // Whatever the other does, snitching saves a day. And when both do
  // what saves them a day, both lose one. That is the whole dilemma.
  // ('C' and 'D' are the textbook's cooperate and defect.)
  //
  // And whoever is named by anybody goes without dinner, straight away.
  // Naming never costs a prisoner their own dinner, so it changes nothing
  // about which choice looks better; it only makes the trap bite sooner:
  // two who name each other both go hungry, as well as the extra day.
  //
  // Nobody in the game ever says so. The Governor only makes his offer,
  // from his side of the desk, and the prisoners find out the rest the
  // way prisoners would: by what happens to them.
  // ------------------------------------------------------------------
  function sentence(me, them) { return me === 'C' ? (them === 'C' ? 1 : 3) : (them === 'C' ? 0 : 2); }

  // Why anybody can name anybody: the whole town was in the crowd that
  // broke into the Bishop's kitchens on his feast day, and the Governor
  // asks about one thing that went on after another. Each one is its own
  // charge, so the days pile up a questioning at a time.
  var MISDEEDS = [
    ['the kitchen door', 'Who smashed down the Bishop’s kitchen door?'],
    ['the roast goose', 'Who ran off with the Bishop’s roast goose?'],
    ['the plum pudding', 'Who ate the Bishop’s plum pudding?'],
    ['the pigs', 'Who let the pigs into the vestry?'],
    ['the silver spoons', 'Who pocketed the Bishop’s silver spoons?'],
    ['the gravy', 'Who tipped the gravy over the Dean?'],
    ['the bells', 'Who rang the cathedral bells at midnight?'],
    ['the portrait', 'Who drew a moustache on the Bishop’s portrait?'],
    ['the wig', 'Who stole the Bishop’s best wig?'],
    ['the custard', 'Who threw custard at the choir?'],
    ['the parrot', 'Who taught the Bishop’s parrot to swear?'],
    ['the candlesticks', 'Who made off with the candlesticks?'],
    ['the jelly', 'Who sat on the Bishop’s jelly?'],
    ['the slippers', 'Who stole the Bishop’s slippers?'],
    ['the soup', 'Who had a bath in the soup?'],
    ['the cake', 'Who carved a face in the Bishop’s cake?'],
    ['the sausages', 'Who fed every last sausage to the dog?'],
    ['the organ', 'Who played rude songs on the organ?'],
    ['the goat', 'Who brought a goat to the feast?'],
    ['the hams', 'Who took the hams from the larder?'],
    ['the bed', 'Who jumped on the Bishop’s bed in muddy boots?'],
    ['the curtains', 'Who pulled down the curtains in the great hall?'],
    ['the cheese', 'Who rolled the great cheese down the hill?'],
    ['the hat', 'Who wore the Bishop’s hat to dance a jig?'],
    ['the cook', 'Who locked the cook in the larder?'],
    ['the trifle', 'Who put a frog in the trifle?'],
    ['the pew', 'Who carved a name in the Bishop’s pew?'],
    ['the bath', 'Who washed a pig in the Bishop’s bath?'],
    ['the window', 'Who broke the window in the great hall?'],
    ['the pies', 'Who started the pie fight?']
  ];
  function misdeed(n) { return MISDEEDS[(Math.max(1, n || 1) - 1) % MISDEEDS.length]; }
  function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function andList(names) {
    return names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function missedText(n) { return n ? plural(n, 'dinner') + ' missed' : 'no dinners missed'; }

  // How the computer's cellmates make up their minds: from what they did,
  // and what was done to them, one questioning after another.
  var STRATS = {
    sam: function () { return 'C'; },
    nell: function () { return 'D'; },
    jack: function (my, their) { return their.length ? their[their.length - 1] : 'C'; },
    grim: function (my, their) { return their.indexOf('D') >= 0 ? 'D' : 'C'; },
    meg: function () { return Math.random() < 0.5 ? 'C' : 'D'; },
    sid: function (my, their) {
      var n = my.length;
      if (n === 0) { return 'D'; }
      var k = their.indexOf('D');
      if (k >= 0) { return n === k + 1 ? 'C' : their[n - 1]; }
      return n % 2 === 0 ? 'D' : 'C';
    }
  };
  var RULES = {
    sam: 'never snitches, whatever you do',
    nell: 'snitches every single time, and swears she won’t',
    jack: 'keeps mum the first time, then does whatever you did the time before',
    grim: 'keeps mum until you snitch once, then snitches for ever',
    meg: 'tosses a coin',
    sid: 'snitches the first time to test you, then plays fair if you hit back'

  function freshState(mode) {
    return { v: 3, mode: mode, round: 1, prisoners: [], mv: {}, log: [], seen: {}, found: {}, inGame: true };
  }
  function addPrisoner(p) {
    S.mv[p.id] = S.mv[p.id] || {};
    S.prisoners.forEach(function (q) { S.mv[p.id][q.id] = []; S.mv[q.id][p.id] = []; });

    p.missed = p.missed || 0;
    p.shown = p.days;
    S.prisoners.push(p);

  function others(p) { return S.prisoners.filter(function (q) { return q !== p; }); }
  function byId(id) { for (var i = 0; i < S.prisoners.length; i++) { if (S.prisoners[i].id === id) { return S.prisoners[i]; } } return null; }
  function humans() { return S.prisoners.filter(function (p) { return p.human; }); }

  function aiChoose(p) {
    var mv = S.now.moves[p.id] = {};
    others(p).forEach(function (q) { mv[q.id] = STRATS[p.strat](S.mv[p.id][q.id], S.mv[q.id][p.id]); });
  }

  // Work out a questioning: who did what to whom, what it costs in days,
  // and who goes without dinner for it.
  function resolveRound() {
    var P = S.prisoners, mv = S.now.moves, tr = S.now.trick || null;
    var res = { pairs: [], delta: {}, named: {}, trick: tr, sweetTook: false, threatHit: 0 };
    P.forEach(function (p) { res.delta[p.id] = 0; });
    for (var i = 0; i < P.length; i++) {
      for (var j = i + 1; j < P.length; j++) {
        var a = P[i], b = P[j], ma = mv[a.id][b.id], mb = mv[b.id][a.id];
        var da = sentence(ma, mb), db = sentence(mb, ma), xa = 0, xb = 0;
        if (mb === 'D') { res.named[a.id] = true; }
        if (ma === 'D') { res.named[b.id] = true; }
        if (tr && tr.type === 'threat') {
          if (tr.target === a.id && ma === 'C' && mb === 'D') { xa = 1; }
          if (tr.target === b.id && mb === 'C' && ma === 'D') { xb = 1; }
        }
        res.threatHit += xa + xb;
        res.pairs.push({ a: a, b: b, ma: ma, mb: mb, da: da + xa, db: db + xb, xa: xa, xb: xb });
        res.delta[a.id] += da + xa;
        res.delta[b.id] += db + xb;
        S.mv[a.id][b.id].push(ma);
        S.mv[b.id][a.id].push(mb);
      }
    }
    P.forEach(function (p) {
      p.days += res.delta[p.id];
      if (res.named[p.id]) { p.missed = (p.missed || 0) + 1; }
    });

      var t = byId(tr.target);
      if (t) {
        var any = others(t).some(function (q) { return mv[t.id][q.id] === 'D'; });
        if (any) { res.sweetTook = true; t.days = Math.max(0, t.days - 1); }
      }
    }
    S.log.push({ round: S.round, moves: JSON.parse(JSON.stringify(mv)), trick: tr });
    return res;
  }

  function totalDays() { var t = 0; S.prisoners.forEach(function (p) { t += p.days; }); return t; }
  function totalMissed() { var t = 0; S.prisoners.forEach(function (p) { t += p.missed || 0; }); return t; }

  // --- saving between questionings ------------------------------------------
  function save() {
    if (!S) { return; }
    try {
      var c = JSON.parse(JSON.stringify(S));
      delete c.now;
      store(SAVE_KEY, JSON.stringify(c));
    } catch (e) {}
  }
  function loadSave() {
    var raw = fetchStore(SAVE_KEY);
    if (!raw) { return null; }
    try {
      var s = JSON.parse(raw);
      if (s && s.v === 3 && s.prisoners && s.prisoners.length) { return s; }
    } catch (e) {}
    return null;
  }
