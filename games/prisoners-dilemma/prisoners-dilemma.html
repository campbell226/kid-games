  // --- what Moll works out, and when --------------------------------------
  //
  // Moll never explains the rules. Each way a questioning can go (both
  // keep mum, one names the other, both name each other) is chalked up on
  // the wall the first time it happens, in her words, about the two people
  // it happened to. Only when all three are up does she reason out the
  // trap, and only after that the long game: next time, and the judge
  // nobody can see coming.
  //
  // Everything is said with names. "They" and "your pal" were too easy to
  // misread with three or four in a cell.
  function duck() { return S.mode === 'story' ? 'my duck' : 'my ducks'; }
  function nameOf(p) { return p.id === 'you' ? 'you' : p.name; }
  function NameOf(p) { return p.id === 'you' ? 'You' : p.name; }

  function outcomeKind(q) { return q.ma === q.mb ? (q.ma === 'C' ? 'cc' : 'dd') : 'cd'; }
  function foundAll() { return !!(S.found.cc && S.found.cd && S.found.dd); }

  // Being named loses a dinner whoever does the naming, so with three or
  // more in the cell Moll can't promise a pair who kept mum their dinners:
  // somebody else may have named one of them.
  function discoveryLines(q) {
    var k = outcomeKind(q), a = q.a.name, b = q.b.name;
    if (k === 'cc') {
      return [['moll', 'So ' + a + ' and ' + b + ' both kept mum, and all the Governor could give either of them was *one day*. For being in the crowd, and no more.'],
        ['moll', (S.prisoners.length > 2 ? 'And neither one cost the other a dinner.' : 'And nobody named either of them, so it’s dinner for both.') + ' I’ll chalk that up, so nobody forgets it.']];
    }
    if (k === 'dd') {
      return [['moll', a + ' and ' + b + ' named each other, and got *two days* apiece. And no dinner for either of them.'],
        ['moll', 'Named, the both of them, but the Governor took a day off each for being helpful. Up on the wall that goes.']];
    }
    var sn = q.ma === 'D' ? q.a : q.b, vic = q.ma === 'D' ? q.b : q.a;
    return [['moll', sn.name + ' named ' + vic.name + ', and the Governor let ' + sn.name + ' off. Nothing at all. But ' + vic.name + ' got *three days*, and no dinner.'],
      ['moll', 'So the Governor keeps his word, and somebody else pays for it. I’ll chalk that up too.']];
  }

  // The two people Moll reasons about: the players if there are two,
  // otherwise a player and whoever else is there.
  function pairForTalk() {
    var hs = humans(), rest = S.prisoners.filter(function (p) { return !p.human; });
    var x = hs[0] || S.prisoners[0];
    var y = hs[1] || rest[0] || S.prisoners[1];
    return [x, y];
  }

  var LESSONS = {
    logic: function () {
      var xy = pairForTalk(), x = xy[0], y = xy[1], X = nameOf(x), Xc = NameOf(x), Y = y.name;
      var you = x.id === 'you';
      return [
        ['moll', 'That’s the lot, then: three ways it can go, all up on the wall. Now here’s the rotten bit.'],
        ['moll', 'Suppose ' + Y + ' keeps mum. If ' + X + ' name' + (you ? '' : 's') + ' ' + Y + ', ' + X + ' get' + (you ? '' : 's') + ' *nothing* instead of a day. Naming’s better.'],
        ['moll', 'Suppose ' + Y + ' names ' + X + '. If ' + X + ' name' + (you ? '' : 's') + ' ' + Y + ' back, ' + X + ' get' + (you ? '' : 's') + ' *two* days instead of three. Naming’s better again!'],
        ['moll', (you ? 'And your' : 'And ' + X + '’s') + ' dinner? That’s up to ' + Y + ', whatever ' + X + ' do' + (you ? '' : 'es') + '. So whatever ' + Y + ' does, ' + X + ' save' + (you ? '' : 's') + ' a day by naming ' + Y + '. And ' + Y + ' is sat there doing the very same sum about ' + X + '.'],
        ['moll', 'So ' + X + ' and ' + Y + ' name each other: two days apiece, and no dinner for either. Keeping mum would have got ' + (you ? 'the pair of you' : X + ' and ' + Y) + ' one day each, and a dinner each.'],
        ['moll', 'There’s the trap, ' + duck() + '. ' + Xc + ' and ' + Y + ', each doing what’s best for number one, and both worse off for it.']
      ];
    },
    multi: function () {
      var n = S.prisoners.length;
      return [
        ['moll', 'And with ' + (['', '', 'two', 'three', 'four'][n] || n) + ' of you, every one of you has to trust every other one.'],
        ['moll', 'One snitch can turn the whole cell sour.']
      ];
    },
    wonder: function () {
      var L = [];
      if (!S.found.cd) { L.push(['moll', 'Nobody’s yet named somebody who kept mum. The Governor swears he’d let the one who names off. I wonder what the one who gets named would get.']); }
      else if (!S.found.dd) { L.push(['moll', 'Nobody’s yet had two prisoners name each other. I wonder what the Governor would do with two names for one charge.']); }
      else { L.push(['moll', 'Nobody’s yet kept mum on both sides. I wonder what the Governor could do with nobody naming anybody.']); }
      return L;
    },
    future: function () {
      var xy = pairForTalk(), x = xy[0], y = xy[1], you = x.id === 'you';
      return [
        ['moll', 'Mind, nobody’s going home yet. ' + NameOf(x) + ' and ' + y.name + ' will be up those stairs again, and again after that.'],
        ['moll', 'Whatever ' + nameOf(x) + ' do' + (you ? '' : 'es') + ' to ' + y.name + ' this time, ' + y.name + ' will remember next time. A snitch saves a day now. What will it cost later?']
      ];
    },
    talk: function () {
      return [
        ['moll', 'Go on then, make your promises. Talk’s cheap in Grimstone.'],
        ['moll', 'Anybody can *promise* to keep mum. What counts is what gets said up those stairs.']
      ];
    },
    end: function () {
      var xy = pairForTalk(), x = xy[0], y = xy[1], X = nameOf(x);
      return [
        ['moll', 'Ever wondered why nobody says when the judge is coming?'],
        ['moll', 'If ' + X + ' knew which was the last time up those stairs, ' + X + ' would snitch that time. Why not? There’d be no next time to pay for it.'],
        ['moll', y.name + ' would know that, so ' + y.name + ' would snitch the time before. And knowing that, ' + X + ' would snitch the time before that...'],
        ['moll', 'All the way back to the very first time! Not knowing when it ends is what keeps folk honest.']
      ];
    },
    tft: function (x, y) {
      return [
        ['moll', 'Did you see that? ' + y.name + ' snitched on ' + x.name + ' last time, so this time ' + x.name + ' snitched right back on ' + y.name + '. *Tit for tat!*'],
        ['moll', 'Snitch on me and I’ll snitch on you. Some say that’s the fairest way there is.']
      ];
    },
    forgive: function (x, y) {
      return [
        ['moll', 'Now there’s something. ' + y.name + ' snitched on ' + x.name + ' last time... and this time ' + x.name + ' kept mum about ' + y.name + ' anyway.'],
        ['moll', 'Forgiving’s risky. But somebody’s got to stop a feud before it starts.']
      ];
    },
    mug: function (x, y) {
      return [
        ['moll', y.name + ' has snitched on ' + x.name + ' twice running, and ' + x.name + ' keeps on keeping mum about ' + y.name + '.'],
        ['moll', 'That ain’t kindness, ' + x.name + ', that’s being a *mug*. Being nice is good. Being a doormat ain’t.']
      ];
    },
    feud: function (x, y) {
      return [
        ['moll', x.name + ' and ' + y.name + ' are at it like cats in a sack: snitching on each other twice running.'],
        ['moll', 'Two days each and no dinner, every time. ' + x.name + ' and ' + y.name + ' are both losing. Somebody’s got to keep mum first, and hope the other one notices.']
      ];
    },
    trust: function (x, y) {
      return [
        ['moll', 'Three times running, ' + x.name + ' and ' + y.name + ' have kept mum about each other. Lovely.'],
        ['moll', 'That’s how trust works in here. Slow to build. Quick to break.']
      ];
    }
  };

  // What happened this time that's worth a word? Looks at each prisoner's
  // choice about each other one, against the times before.
  function eventsNow() {
    var ev = [];
    S.prisoners.forEach(function (x) {
      others(x).forEach(function (y) {
        var a = S.mv[x.id][y.id], b = S.mv[y.id][x.id], n = a.length;
        if (n < 2) { return; }
        var me = a[n - 1], meBefore = a[n - 2], them = b[n - 1], themBefore = b[n - 2];
        if (themBefore === 'D' && meBefore === 'C' && me === 'D') { ev.push({ k: 'tft', x: x, y: y }); }
        if (themBefore === 'D' && me === 'C') { ev.push({ k: 'forgive', x: x, y: y }); }
        if (me === 'C' && meBefore === 'C' && them === 'D' && themBefore === 'D') { ev.push({ k: 'mug', x: x, y: y }); }
        if (x.id < y.id && me === 'D' && meBefore === 'D' && them === 'D' && themBefore === 'D') { ev.push({ k: 'feud', x: x, y: y }); }
        if (n >= 3 && x.id < y.id && a.slice(-3).join('') === 'CCC' && b.slice(-3).join('') === 'CCC') { ev.push({ k: 'trust', x: x, y: y }); }
      });
    });
    return ev;
  }

  // --- the computer cellmates' patter --------------------------------------
  function chatter(p, t) {
    var mine = S.mv[p.id][t.id] || [], theirs = S.mv[t.id][p.id] || [], n = mine.length;
    var lastThem = theirs[n - 1], crossed = theirs.indexOf('D') >= 0;
    switch (p.strat) {
      case 'sam':
        if (lastThem === 'D') { return 'You snitched on me… I still won’t snitch on you, though. I couldn’t.'; }
        return n === 0 ? 'I’ll keep mum, I promise. I always keep mum.' : pick(['I don’t like snitching. Snitching isn’t nice.', 'Keep mum, eh? Keeping mum is nicer.']);
      case 'nell':
        return n === 0 ? 'I’ll keep mum for you. Cross my heart.' : pick(['Course I kept mum. Must be a mistake in the Governor’s book.', 'Trust me, ducky. This time I’ll keep mum. Promise.', 'Don’t look at me like that. This time’s different.']);
      case 'jack':
        if (n === 0) { return 'Keep mum for me and I’ll keep mum for you. Simple as that.'; }
        return lastThem === 'D' ? 'You snitched on me last time. So you know what’s coming.' : 'You kept mum for me last time. I won’t forget it.';
      case 'grim':
        if (crossed) { return theirs.indexOf('D') === n - 1 ? 'You crossed me. I’ll never trust you again. Never.' : 'Don’t bother talking to me.'; }
        return pick(['Keep mum for me and I’ll keep mum for you. Till the end of time.', 'We’re square, you and me. Let’s keep it that way.']);
      case 'meg':
        return pick(['Heads or tails? Heads or tails?!', 'I might keep mum. I might not! Ha!', 'Even I don’t know what I’ll do! Ha ha!', 'The penny decides, my lovely. Always the penny.']);
      case 'sid':
        if (n === 0) { return 'Trust me, friend. I always look after my friends.'; }
        return crossed ? 'No hard feelings, eh? Let’s play fair from now on.' : 'You’re a good sort. Too good, some might say.';
    }
    return '';
  }

  // ...and what they say when the truth comes out. Keyed by what happened
  // to them: both kept mum, they got away with it, they got stung, or
  // both snitched. Some never happen: Sam never snitches, Nell always does.
  var QUIPS = {
    sam: { cc: ['We both kept mum! How nice.'], lost: ['Oh... You named me. That wasn’t very nice.', 'Three days, and no dinner... oh dear.'] },
    nell: { won: ['Ha! Never trust a Nell, sweetheart.', 'Told you I’d keep mum. I lied.'], dd: ['Well, well. Look who’s learning.'] },
    jack: { cc: ['Good. Mum’s the word.'], won: ['You had that coming.'], lost: ['So you named me. Right.'], dd: ['You snitch, I snitch. Fair’s fair.'] },
    grim: { cc: ['Hmph. Good.'], won: ['I warned you.'], lost: ['You named me. Never again. NEVER.'], dd: ['Snitch away. I’ll snitch right back. For ever.'] },
    meg: { cc: ['Heads! Ha ha!'], won: ['Tails! Whoops! Ha ha!'], lost: ['Ooh, you rotter! Ha!'], dd: ['Tails and tails! Ha ha ha!'] },
    sid: { cc: ['There. Friends after all.'], won: ['Nothing personal, friend. Just testing.', 'Too easy.'], lost: ['Ah. You’ve got teeth. Good.'], dd: ['Fair enough. You’ve got teeth.'] }
  };
  function quip(p, me, them) {
    var k = me === 'C' ? (them === 'C' ? 'cc' : 'lost') : (them === 'C' ? 'won' : 'dd');
    var set = QUIPS[p.strat] && QUIPS[p.strat][k];
    return set ? pick(set) : null;
  }

  // --- reading a player's style --------------------------------------------
  function styleOf(pid) {
    var mv = S.mv[pid] || {}, n = 0, d = 0, firsts = [], copy = 0, copyN = 0, afterD = 0, afterDD = 0, afterC = 0, afterCD = 0, fN = 0, f = 0;
    Object.keys(mv).forEach(function (q) {
      var mine = mv[q], theirs = (S.mv[q] && S.mv[q][pid]) || [];
      mine.forEach(function (m, k) {
        n++;
        if (m === 'D') { d++; }
        if (k === 0) { firsts.push(m); return; }
        var prev = theirs[k - 1];
        copyN++;
        if (m === prev) { copy++; }
        if (prev === 'D') { afterD++; if (m === 'D') { afterDD++; } } else { afterC++; if (m === 'D') { afterCD++; } }
        if (k >= 2 && theirs[k - 2] === 'D' && prev === 'C') { fN++; if (m === 'C') { f++; } }
      });
    });
    if (!n) { return 'none'; }
    if (d === 0) { return 'loyal'; }
    if (d === n) { return 'rotter'; }
    var nice = firsts.every(function (m) { return m === 'C'; });
    var retal = afterD ? afterDD / afterD : 0, exploit = afterC ? afterCD / afterC : 0;
    if (nice && copyN >= 2 && copy / copyN >= 0.8) { return 'tft'; }
    if (exploit >= 0.4) { return 'sneak'; }
    if (retal >= 0.6 && fN >= 1 && f / fN < 0.5) { return 'grudger'; }
    if (retal >= 0.6 && exploit <= 0.2) { return 'tft'; }
    if (d / n <= 0.25) { return 'kind'; }
    return 'mixed';
  }

  function styleLine(style, name, you) {
    var N = you ? 'You' : name, w = you ? 'were' : 'was';
    switch (style) {
      case 'loyal': return N + ' never snitched once. Loyal as a dog. Mind, dogs get kicked.';
      case 'rotter': return N + ' snitched every single time. Nobody in here will share a crust with ' + (you ? 'you' : name) + ' now.';
      case 'tft': return N + ' played tit for tat: kind till crossed, quick to hit back, quick to forgive. The canniest way there is.';
      case 'sneak': return N + ' liked snitching on folk who’d kept mum. Sneaky. It pays, once or twice.';
      case 'grudger': return N + ' held grudges. Cross ' + (you ? 'you' : name) + ' once and that was that.';
      case 'kind': return N + ' kept mum nearly always, and only snitched now and then.';
      case 'mixed': return N + ' ' + w + ' a bit of everything. Hard to read, and that cuts both ways.';
    }
    return '';
  }

  // --- Moll's reckoning: every cellmate against every other -----------------
  function playMatch(a, b, n) {
    var ha = [], hb = [], ma = 0, mb = 0;
    for (var k = 0; k < n; k++) {
      var ca = STRATS[a](ha, hb), cb = STRATS[b](hb, ha);
      ha.push(ca); hb.push(cb);
      ma += sentence(ca, cb); mb += sentence(cb, ca);
    }
    return [ma, mb];
  }
  function tournament(rounds) {
    var tot = {};
    MATES.forEach(function (a) { tot[a] = 0; });
    for (var i = 0; i < MATES.length; i++) {
      for (var j = i; j < MATES.length; j++) {
        var a = MATES[i], b = MATES[j], reps = (a === 'meg' || b === 'meg') ? 80 : 1, sa = 0, sb = 0;
        for (var r = 0; r < reps; r++) {
          var m = playMatch(a, b, rounds);
          sa += m[0]; sb += m[1];
        }
        tot[a] += sa / reps;
        if (i !== j) { tot[b] += sb / reps; }
      }
    }
    return tot;
  }

  // ------------------------------------------------------------------
  // The cast on stage.
  // ------------------------------------------------------------------
  function ensureFig(p) {
    if (FIG[p.id]) { return FIG[p.id]; }
    var f = makeFigure(p.look);
    f.persp = 1;
    FIG[p.id] = f;
    CL.figs.appendChild(f.root);
    return f;
  }
  function dropFig(id) {
    var f = FIG[id];
    if (!f) { return; }
    if (f.root.parentNode) { f.root.parentNode.removeChild(f.root); }
    var k = FIGS.indexOf(f);
    if (k >= 0) { FIGS.splice(k, 1); }
    delete FIG[id];
  }
  function dropAllPrisoners() {
    Object.keys(FIG).forEach(function (id) { if (id !== 'moll' && id !== 'key') { dropFig(id); } });
  }
  function restFace(p) {
    var f = FIG[p.id], L = LOOKS[p.look];
    if (!f) { return; }
    setExpr(f, L.rest || 'neutral');
    setPose(f, L.rest === 'cross' ? 'cross' : 'rest');
    f.shake = 0;
    f.lookT = 0;
    f.bowl.style.display = 'none';
  }
  function setupCell() {
    dropAllPrisoners();
    S.prisoners.forEach(function (p) {
      var f = ensureFig(p);
      f.away = false; f.op = 1; f.shown = true;
      restFace(p);
    });
    LAY.n = S.mode === 'story' ? 2 : S.prisoners.length;
    layout();
    showScene('cell');
    drawKnitting(FIG.moll, S.round);
  }

  var hurry = false;
  function walkSpeed() { return 340 * Math.max(LAY.s, 0.8); }
  // The way across the cell: in front of everybody when they stand in a
  // row, behind the front row when the cell is deep.
  function lane() { return LAY.portrait ? LAY.backY + (LAY.floorY - LAY.backY) * 0.3 : LAY.floorY + 6 * LAY.s; }
  // He steps aside, just inside the door on the cell side, so nobody has
  // to walk through him on the way in or out.
  function asideSpot() {
    var k = LAY.portrait ? LAY.bs : LAY.s;
    return { x: LAY.doorX0 - 54 * k, y: LAY.backY + 22 * k };
  }

  async function walking(promises) {
    tapper.classList.add('show');
    onTap = function () { hurry = true; skipWalks(); };
    await Promise.all(promises);
    onTap = null;
    tapper.classList.remove('show');
    await sleep(0);
  }

  function walkTo(f, pts, speed) {
    CL.figs.appendChild(f.root);
    if (hurry) { var e = pts[pts.length - 1]; f.x = e.x; f.y = e.y; f.op = e.op === undefined ? 1 : e.op; return Promise.resolve(); }
    return walk(f, pts, speed || walkSpeed());
  }

  // The turnkey comes in with his lantern (and the dinner pot, when it's
  // time) and steps aside, then watches whoever goes past.
  async function keyIn(withPot) {
    var k = FIG.key, a = asideSpot();
    k.shown = true; k.op = 0; k.watch = false;
    k.x = LAY.doorCx; k.y = LAY.backY - 2;
    k.pot.style.display = withPot ? '' : 'none';
    await setDoor(1);
    await walking([walkTo(k, [{ x: LAY.doorCx, y: LAY.backY + 10, op: 1 }], 50 * LAY.s)]);
    await walking([walkTo(k, [{ x: LAY.doorCx, y: a.y }, { x: a.x, y: a.y }], walkSpeed() * 0.6)]);
    k.lookT = -1;
    k.watch = true;
  }
  // Out the way everybody goes: across to the door, then through it.
  async function keyOut() {
    var k = FIG.key, pts = [];
    k.watch = false;
    if (Math.abs(k.x - LAY.doorCx) > 2) { pts.push({ x: LAY.doorCx, y: k.y }); }
    if (k.y > LAY.backY + 12) { pts.push({ x: LAY.doorCx, y: LAY.backY + 10 }); }
    if (pts.length) { await walking([walkTo(k, pts, walkSpeed() * 0.6)]); }
    await walking([walkTo(k, [{ x: LAY.doorCx, y: LAY.backY - 2, op: 0 }], 50 * LAY.s)]);
    k.shown = false;
    k.pot.style.display = 'none';
    await setDoor(0);
  }

  function exitPath(f) {
    return [{ x: f.x, y: lane() }, { x: LAY.doorCx, y: lane() }, { x: LAY.doorCx, y: LAY.backY + 6, op: 1 }, { x: LAY.doorCx, y: LAY.backY - 2, op: 0 }];
  }
  function entryPath(i) {
    var x = LAY.xs[i];
    return [{ x: LAY.doorCx, y: LAY.backY + 6, op: 1 }, { x: LAY.doorCx, y: lane() }, { x: x, y: lane() }, { x: x, y: LAY.floorY }];
  }

  async function walkOut(list) {
    showScene('cell');
    hurry = false;
    await keyIn();
    if (!S.seen.keyIntro) {
      S.seen.keyIntro = 1;
      await say('key', S.prisoners.length > 2 ? 'Up you get, the lot of you. The Governor wants a word.' : 'Up you get, the pair of you. The Governor wants a word.');
      hideSpeech();
    } else { keys(); }
    var order = (list || S.prisoners).slice().sort(function (a, b) { return slotOf(b) - slotOf(a); });
    var ps = [];
    for (var i = 0; i < order.length; i++) {
      var f = FIG[order[i].id];
      (function (f) {
        ps.push(walkTo(f, exitPath(f)).then(function () { f.away = true; }));
      })(f);
      if (!hurry && !reduced) { await sleep(420); }
    }
    await walking(ps);
    await keyOut();
    hurry = false;
    await fade(1);
  }

  // Back from upstairs. With stay, the turnkey waits by the door until
  // he has said his piece.
  async function walkIn(list, keyHere, stay) {
    hurry = false;
    var ps = [];
    (list || S.prisoners).forEach(function (p) {
      var f = FIG[p.id];
      f.away = true; f.op = 0; f.x = LAY.doorCx; f.y = LAY.backY - 2; f.shown = true;
    });
    if (!keyHere) { await keyIn(); }
    var order = (list || S.prisoners).slice().sort(function (a, b) { return slotOf(a) - slotOf(b); });
    for (var i = 0; i < order.length; i++) {
      (function (p) {
        var f = FIG[p.id];
        ps.push(walkTo(f, entryPath(slotOf(p))).then(function () { f.away = false; f.lookT = 0; }));
      })(order[i]);
      if (!hurry && !reduced) { await sleep(420); }
    }
    await walking(ps);
    if (!stay) { await keyOut(); }
    hurry = false;
  }

  // Dinner, straight after the names come out. The turnkey brings the pot
  // along the row, nearest the door first, and anybody who was named gets
  // a shake of the head instead.
  async function serveDinner(res) {
    var k = FIG.key, hungry = 0;
    hurry = false;
    clearBubbles();
    S.prisoners.forEach(restFace);
    await keyIn(true);
    k.watch = false;
    if (!S.seen.dinner) {
      S.seen.dinner = 1;
      await say('key', 'Dinner! Such as it is.');
      hideSpeech();
    }
    var order = S.prisoners.slice().sort(function (a, b) { return FIG[b.id].x - FIG[a.id].x; });
    for (var i = 0; i < order.length; i++) {
      var p = order[i], f = FIG[p.id];
      var stop = { x: f.x + Math.min(LAY.slotW * 0.45, 92 * f.s), y: lane() };
      await walking([walkTo(k, [{ x: k.x, y: lane() }, stop], walkSpeed() * 0.8)]);
      k.lookT = -1; f.lookT = 1;
      if (res.named[p.id]) {
        hungry++;
        setExpr(k, 'cross'); k.no = 1;
        setExpr(f, 'sad'); setPose(f, 'wring');
        bubble(f, 'H', 1);
        rumble();
        if (!S.seen.hungry) {
          S.seen.hungry = 1;
          await say('key', 'Not you, ' + p.name + '. You were named. Bishop’s orders.');
          hideSpeech();
        } else if (!reduced) { await sleep(750); }
      } else {
        setPose(k, 'offer');
        slop();
        if (!reduced) { await sleep(280); }
        f.bowl.style.display = '';
        setPose(f, 'bowl'); setExpr(f, 'happy');
        if (!reduced) { await sleep(450); }
        setPose(k, 'hold');
      }
      setExpr(k, 'neutral');
    }
    await keyOut();
    if (hungry && !S.seen.hungryMoll) {
      S.seen.hungryMoll = 1;
      await say('moll', 'Named means hungry. The Bishop’s little joke: eat his dinner, and you can do without your own.');
    }
  }

  // ------------------------------------------------------------------
  // A questioning, from talk to dinner.
  // ------------------------------------------------------------------
  async function talkTime() {
    showScene('cell');
    clearBubbles();
    S.prisoners.forEach(restFace);
    if (S.round === 2 && !S.seen.talk) {
      S.seen.talk = 1;
      await talk(LESSONS.talk());
    }
    var ai = S.prisoners.filter(function (p) { return !p.human; }), hs = humans();
    if (ai.length && hs.length) {
      var p = pick(ai), t = pick(hs), f = FIG[p.id], ft = FIG[t.id];
      if (f && ft) { f.lookT = ft.x > f.x ? 1 : -1; }
      await say(p, chatter(p, t));
    }
    await ask([{ label: 'Off to the Governor', value: 1, icon: ICON_KEY }]);
  }

  async function interrogations() {
    await walkOut();
    S.now = { moves: {}, trick: null };
    var hs = humans(), gh = S.gov.kind === 'human', many = hs.length + (gh ? 1 : 0) >= 2;
    showScene('room');
    setExpr(GOV, 'smirk');
    if (many) { fadeEl.classList.remove('on'); }
    if (gh) {
      if (many) { await curtain('gov', 'Pass to ' + (/^(the )?governor$/i.test(S.gov.name) ? 'the Governor' : S.gov.name), 'Prisoners: look away!', 'I’m the Governor'); }
      else { await fade(0); }
      await governorTurn();
    } else if (S.gov.kind === 'crafty') {
      craftyTrick();
    }
    for (var i = 0; i < S.prisoners.length; i++) {
      var p = S.prisoners[i];
      if (!p.human) { aiChoose(p); continue; }
      if (many) { await curtain(p.look, 'Pass to ' + p.name, 'Everyone else: look away!', 'I’m ' + p.name); }
      else if (fadeEl.classList.contains('on')) { await fade(0); }
      await interrogate(p);
    }
    if (many) {
      await curtain(null, 'Everyone back to the cell!', 'Put the phone where you can all see it.', 'Back to the cell');
      fadeEl.classList.add('on');
    } else {
      await fade(1);
    }
    hideSpeech();
  }

  function lastMove(p, q) { var a = S.mv[p.id][q.id]; return a[a.length - 1]; }

  // The Governor only ever speaks for himself: the Bishop wants names, and
  // here is what he'll do for a name. What it all adds up to is for the
  // prisoners to find out.
  function govLines(p) {
    var os = others(p), L = [], one = os.length === 1 ? os[0] : null;
    var names = andList(os.map(function (q) { return q.name; }));
    var md = misdeed(S.round);
    if (!S.seen['met-' + p.id]) {
      S.seen['met-' + p.id] = 1;
      L.push('Ah. ' + p.name + '. Sit down, sit down.');
      L.push('The Bishop is in a fearful temper about his feast, and the Bishop wants names. So tell me: ' + md[1].charAt(0).toLowerCase() + md[1].slice(1));
      L.push(names + (one ? ' is' : ' are') + ' being asked the very same question, down the corridor.');
      L.push('Name ' + (one ? one.name : 'whoever did it') + ', and I’ll let you off this one. Keep quiet, and you take your share along with the rest of the rabble.');
      L.push('And if ' + (one ? one.name : 'somebody') + ' names *you*, ' + p.name + '... well. The Bishop will want an example made.');
      L.push('Oh, and the Bishop’s orders: whoever gets named goes without dinner. A thief who ate the Bishop’s dinner can do without one.');
    } else if (os.some(function (q) { return !S.mv[p.id][q.id].length; })) {
      L.push((one ? 'New cellmate, ' + p.name + '? ' + one.name + '. Was ' + one.name + ' at the feast? Everybody was.' : 'Some new faces down there, ' + p.name + '. Everybody was at the feast.'));
      L.push('Now then. ' + md[1]);
    } else {
      L.push('Now then, ' + p.name + '. ' + md[1]);
      var by = os.filter(function (q) { return lastMove(q, p) === 'D'; }), on = os.filter(function (q) { return lastMove(p, q) === 'D'; });
      var opts = ['The Bishop wants a name, ' + p.name + ', and I mean to give him one.',
        'Just between us, ' + p.name + '... nobody need ever know who told me.'];
      if (by.length) {
        opts.push(by[0].name + ' named you last time, you know. I’d want my own back, if I were you.');
        opts.push('Hungry, ' + p.name + '? You’ve ' + by[0].name + ' to thank for that.');
      }
      if (on.length) { opts.push('You were very helpful last time, ' + p.name + '. The Bishop was most pleased.'); }
      if (!by.length && !on.length) { opts.push('Still keeping mum, ' + p.name + '? The Bishop won’t wait for ever.'); }
      L.push(pick(opts));
    }
    var tr = S.now.trick;
    if (tr && tr.target === p.id) {
      if (tr.type === 'whisper') {
        L.push(one ? 'Between you and me, ' + p.name + '... ' + one.name + ' has already named you. Sang like a canary. So why keep mum about ' + one.name + '?'
          : 'Between you and me, ' + p.name + '... ' + names + ' have already named you. Every one. So why keep mum?');
      }
      if (tr.type === 'sweet') { L.push('Tell you what, ' + p.name + '. Name somebody this time, and I’ll scratch a day *off* your wall. Can’t say fairer than that.'); }
      if (tr.type === 'threat') { L.push('And mark this, ' + p.name + '. Keep mum, and if ' + (one ? one.name : 'anybody') + ' names you, I’ll add an *extra* day. For wasting my time.'); }
    }
    return L;
  }

  async function interrogate(p) {
    showScene('room');
    setExpr(GOV, 'smirk');
    var lines = govLines(p);
    for (var i = 0; i < lines.length; i++) { await say('gov', lines[i]); }
    var picks = await choicePanel(p);
    S.now.moves[p.id] = picks;
    var any = Object.keys(picks).some(function (k) { return picks[k] === 'D'; });
    setExpr(GOV, any ? 'grin' : 'cross');
    await say('gov', any ? pick(['Very sensible. The Bishop will be pleased. Take ' + p.name + ' down!', 'There, that wasn’t so hard. Take ' + p.name + ' away!'])
      : pick(['Hmph. Have it your own way. Take ' + p.name + ' down!', 'Mum, is it? We’ll see. Take ' + p.name + ' away!']));
    hideSpeech();
  }

  function choicePanel(p) {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      var os = others(p), picks = {}, tr = S.now.trick;
      var mods = tr && tr.target === p.id ? { sweet: tr.type === 'sweet', threat: tr.type === 'threat' } : {};
      var armedAt = Date.now() + 350;
      function html() {
        var h = '<h2>' + esc(misdeed(S.round)[1]) + '</h2><p class="sub">' + esc(p.name) + ', keep mum or name names?</p>';
        if (mods.sweet) { h += '<p class="sub">The Governor’s offer: name anybody this time, and a day comes off ' + esc(p.name) + '’s wall.</p>'; }
        if (mods.threat) { h += '<p class="sub">The Governor’s threat: if ' + esc(p.name) + ' keeps mum and gets named, an extra day.</p>'; }
        os.forEach(function (q) {
          var c = picks[q.id];
          h += '<div class="row"><div class="who"><span class="face64">' + headSVG(q.look) + '</span><span class="nm">' + esc(q.name) + '</span></div><div class="opts">'
            + '<button class="btn mum choice' + (c === 'C' ? ' on' : (c ? ' dim' : '')) + '" data-act="C:' + q.id + '">' + iconSVG('C') + '<span>Keep mum</span></button>'
            + '<button class="btn snitch choice' + (c === 'D' ? ' on' : (c ? ' dim' : '')) + '" data-act="D:' + q.id + '">' + iconSVG('D') + '<span>Snitch</span></button>'
            + '</div></div>';
        });
        var ready = os.every(function (q) { return picks[q.id]; });
        h += '<div class="btns">' + (anyFound() ? '<button class="btn quiet" data-act="board">Moll’s chalk</button>' : '')
          + '<button class="btn" data-act="done"' + (ready ? '' : ' disabled') + '>Done</button></div>';
        return h;
      }
      function handler(act) {
        if (Date.now() < armedAt) { return; }
        if (act === 'board') { openBoard(); return; }
        if (act === 'done') {
          if (!os.every(function (q) { return picks[q.id]; })) { return; }
          hidePanel();
          if (my !== RUN) { reject(ABORT); return; }
          resolve(picks);
          return;
        }
        var parts = act.split(':');
        picks[parts[1]] = parts[0];
        blip(parts[0] === 'C' ? 330 : 220);
        var keep = panelEl.scrollTop;
        showPanel(html(), 'desk', handler);
        panelEl.scrollTop = keep;
      }
      showPanel(html(), 'desk', handler);
    });
  }

  // --- the Governor, when somebody plays him ------------------------------
  var TRICK_ICONS = {
    none: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M 14 15 Q 14 9 20 9 Q 26 9 26 15 Q 26 19 20 21 L 20 25" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="20" cy="31" r="2.4" fill="currentColor"/></svg>',
    whisper: '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M 6 8 L 34 8 Q 37 8 37 11 L 37 25 Q 37 28 34 28 L 18 28 L 10 35 L 11 28 L 6 28 Q 3 28 3 25 L 3 11 Q 3 8 6 8 Z" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="12" cy="18" r="2.6" fill="currentColor"/><circle cx="20" cy="18" r="2.6" fill="currentColor"/><circle cx="28" cy="18" r="2.6" fill="currentColor"/></svg>',
    sweet: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#d9b54e" stroke="#7a5a18" stroke-width="3"/><circle cx="20" cy="20" r="9" fill="none" stroke="#7a5a18" stroke-width="2"/><path d="M 17 15 L 23 15 M 17 25 L 23 25 M 20 13 L 20 27" stroke="#7a5a18" stroke-width="2.4"/></svg>',
    threat: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="13" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="27" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="4"/><path d="M 19 20 L 21 20" stroke="currentColor" stroke-width="4"/></svg>'
  };
  var TRICKS = [
    { k: 'none', name: 'Just ask', what: 'Ask every prisoner straight, and see what happens.' },
    { k: 'whisper', name: 'Whisper', what: 'Tell one prisoner that everybody else has already named that prisoner.' },
    { k: 'sweet', name: 'Sweetener', what: 'Promise one prisoner a day off for naming somebody.' },
    { k: 'threat', name: 'Threat', what: 'Warn one prisoner: keep mum and get named, and it’s an extra day.' }
  ];

  function governorTurn() {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      var choice = 'none', target = null;
      var armedAt = Date.now() + 350;
      function html() {
        var h = '<h2>' + esc(S.gov.name) + ': which trick this time?</h2>'
          + '<p class="sub">Days handed out so far: <b>' + totalDays() + '</b>. The more, the better for you.</p>';
        TRICKS.forEach(function (t) {
          h += '<div class="row"><button class="btn' + (choice === t.k ? ' on' : ' quiet') + '" data-act="t:' + t.k + '" style="min-width:9.5em;justify-content:flex-start">' + TRICK_ICONS[t.k] + '<span>' + t.name + '</span></button><span class="sub">' + t.what + '</span></div>';
        });
        if (choice !== 'none') {
          h += '<p><b>On whom?</b></p><div class="btns" style="justify-content:flex-start">';
          S.prisoners.forEach(function (p) {
            h += '<button class="btn' + (target === p.id ? ' on' : ' quiet') + '" data-act="p:' + p.id + '"><span class="face40">' + headSVG(p.look) + '</span><span>' + esc(p.name) + '</span></button>';
          });
          h += '</div>';
        }
        var ready = choice === 'none' || target;
        h += '<div class="btns"><button class="btn" data-act="done"' + (ready ? '' : ' disabled') + '>Done</button></div>';
        return h;
      }
      function handler(act) {
        if (Date.now() < armedAt) { return; }
        if (act === 'done') {
          if (choice !== 'none' && !target) { return; }
          S.now.trick = choice === 'none' ? null : { type: choice, target: target };
          hidePanel();
          if (my !== RUN) { reject(ABORT); return; }
          resolve();
          return;
        }
        var parts = act.split(':'), keep = panelEl.scrollTop;
        if (parts[0] === 't') { choice = parts[1]; if (choice === 'none') { target = null; } }
        if (parts[0] === 'p') { target = parts[1]; }
        blip(260);
        showPanel(html(), 'desk', handler);
        // Picking a trick brings up the faces to pick from: show them.
        panelEl.scrollTop = parts[0] === 't' && choice !== 'none' ? panelEl.scrollHeight : keep;
      }
      showPanel(html(), 'desk', handler);
    });
  }

  function craftyTrick() {
    if (S.round < 2 || Math.random() < 0.5) { return; }
    var hs = humans(), pool = hs.length ? hs : S.prisoners;
    S.now.trick = { type: pick(['whisper', 'sweet', 'threat']), target: pick(pool).id };
  }

  // --- the reveal --------------------------------------------------------
  function react(f, me, them) {
    if (me === 'C' && them === 'C') {
      setExpr(f, 'happy'); setPose(f, 'cheer'); f.bounce = 1;
      setTimeout(function () { if (f.pose === 'cheer') { setPose(f, 'rest'); } }, 1100);
    } else if (me === 'D' && them === 'C') {
      setExpr(f, 'smirk'); setPose(f, 'cross');
    } else if (me === 'C' && them === 'D') {
      setExpr(f, 'shocked'); setPose(f, 'rest'); f.bounce = 0.5;
      setTimeout(function () { if (f.expr === 'shocked') { setExpr(f, 'angry'); setPose(f, 'fist'); f.shake = 1; } }, 750);
    } else {
      setExpr(f, 'angry'); setPose(f, 'fists'); f.shake = 0.8;
    }
  }

  function outcomeLine(q) {
    var a = '*' + q.a.name + '*', b = '*' + q.b.name + '*', md = misdeed(S.round)[0];
    if (q.ma === 'C' && q.mb === 'C') { return a + ' and ' + b + ' both kept mum about ' + md + '. One day each.'; }
    if (q.ma === 'D' && q.mb === 'D') { return a + ' and ' + b + ' named each other for ' + md + '. Two days each, and no dinner.'; }
    var sn = q.ma === 'D' ? q.a : q.b, vic = q.ma === 'D' ? q.b : q.a, extra = q.ma === 'D' ? q.xb : q.xa;
    return '*' + sn.name + '* named *' + vic.name + '* for ' + md + '! ' + sn.name + ' is let off. Three days for ' + vic.name
      + (extra ? ', one more for the Governor’s threat, and no dinner.' : ', and no dinner.');
  }

  // The first time a questioning goes a new way, Moll says what it came to
  // and chalks it on the wall. One bent by one of the Governor's tricks
  // doesn't count: it wouldn't show the usual way of things.
  async function discover(q) {
    var k = outcomeKind(q);
    if (S.found[k] || q.xa || q.xb) { return; }
    S.found[k] = S.round;
    var L = discoveryLines(q);
    await say(L[0][0], L[0][1]);
    scratch();
    drawChalk();
    showBoardButton();
    await say(L[1][0], L[1][1]);
  }

  async function revealPair(q, many) {
    var fa = FIG[q.a.id], fb = FIG[q.b.id], s = LAY.s;
    S.prisoners.forEach(function (p) { FIG[p.id].dim = !(p === q.a || p === q.b || !many); });
    fa.lookT = fb.x > fa.x ? 1 : -1;
    fb.lookT = -fa.lookT;
    setExpr(fa, 'worried'); setExpr(fb, 'worried');
    setPose(fa, 'rest'); setPose(fb, 'rest');
    drumroll(0.9);
    await sleep(reduced ? 250 : 950);
    bubble(fa, q.ma, fa.lookT);
    if (q.ma === 'C') { shh(); } else { stab(); setPose(fa, fa.lookT > 0 ? 'pointR' : 'pointL'); }
    await sleep(reduced ? 300 : 700);
    bubble(fb, q.mb, fb.lookT);
    if (q.mb === 'C') { shh(); } else { stab(); setPose(fb, fb.lookT > 0 ? 'pointR' : 'pointL'); }
    await sleep(reduced ? 300 : 750);
    if (q.ma === 'C' && q.mb === 'C') { chordGood(); } else if (q.ma === 'D' && q.mb === 'D') { chordBad(); } else { chordBetray(); }
    react(fa, q.ma, q.mb);
    react(fb, q.mb, q.ma);
    riser(fa.x, fa.y - 400 * s, '+' + q.da, q.da === 0 ? '#b6e69a' : (q.da >= 3 ? '#ff9d88' : '#f3e7b6'));
    riser(fb.x, fb.y - 400 * s, '+' + q.db, q.db === 0 ? '#b6e69a' : (q.db >= 3 ? '#ff9d88' : '#f3e7b6'));
    await Promise.all([countTo(q.a, (q.a.shown || 0) + q.da), countTo(q.b, (q.b.shown || 0) + q.db)]);
    await say(null, outcomeLine(q));
    // A computer cellmate has something to say about it: always on your
    // own, now and then with friends so a big cell doesn't drag.
    var ai = [[q.a, q.ma, q.mb], [q.b, q.mb, q.ma]].filter(function (x) { return !x[0].human && quip(x[0], x[1], x[2]); });
    if (ai.length && (S.mode === 'story' || Math.random() < 0.4)) {
      var w = pick(ai);
      await say(w[0], quip(w[0], w[1], w[2]));
    }
    await discover(q);
    clearBubbles();
  }

  async function revealRound(res) {
    showScene('cell');
    S.prisoners.forEach(function (p) {
      var f = FIG[p.id];
      f.away = true; f.op = 0; f.x = LAY.doorCx; f.y = LAY.backY;
      restFace(p);
      setPose(f, 'rest', true);
    });
    hideSpeech();
    await fade(0);
    await walkIn(null, false, true);
    if (!S.seen.govReveal) {
      S.seen.govReveal = 1;
      await say('key', 'The Governor’s sent his ledger down. Here’s who named who.');
      hideSpeech();
    }
    await keyOut();
    for (var i = 0; i < res.pairs.length; i++) { await revealPair(res.pairs[i], res.pairs.length > 1); }
    S.prisoners.forEach(function (p) { FIG[p.id].dim = false; });
    await revealTrick(res);
    for (var j = 0; j < S.prisoners.length; j++) {
      var p = S.prisoners[j];
      if (p.shown !== p.days) { await countTo(p, p.days); }
    }
    if (res.pairs.length > 1) {
      await say(null, 'This time: ' + S.prisoners.map(function (p) { return '*' + p.name + '* +' + res.delta[p.id]; }).join(', ') + '.');
    }
    await serveDinner(res);
  }

  async function revealTrick(res) {
    var tr = res.trick;
    if (!tr) { return; }
    var t = byId(tr.target);
    if (!t) { return; }
    var os = others(t), one = os.length === 1 ? os[0] : null, mv = S.now.moves;
    var L = [];
    if (tr.type === 'whisper') {
      var did = os.filter(function (q) { return mv[q.id][t.id] === 'D'; }).length;
      L.push([null, 'Upstairs, the Governor had whispered to *' + t.name + '*: “' + (one ? one.name + ' has' : andList(os.map(function (q) { return q.name; })) + ' have') + ' already named you.”']);
      L.push(['moll', did === 0 ? 'And that was a lie! Nobody had named ' + t.name + '. The Governor made it up.'
        : (did === os.length ? 'As it happens, the Governor was right. But the Governor couldn’t have known. He was guessing.' : 'Some had named ' + t.name + ' and some hadn’t. The Governor was only guessing.')]);
      if (!S.seen.trick_whisper) { S.seen.trick_whisper = 1; L.push(['moll', 'Never trust the Governor, ' + duck() + '. The Governor wants names, and will say anything to get them.']); }
    } else if (tr.type === 'sweet') {
      L.push([null, 'Upstairs, the Governor had offered *' + t.name + '* a day off for naming somebody.']);
      L.push([null, res.sweetTook ? t.name + ' named somebody, so one day comes off ' + t.name + '’s wall.' : t.name + ' didn’t take the bait.']);
      if (!S.seen.trick_sweet) {
        S.seen.trick_sweet = 1;
        L.push(['moll', 'Sweetening the pot, that’s called. The Governor can’t make anybody snitch... but he can make snitching pay.']);
        L.push(['moll', 'Change what folk get, and you change what folk do.']);
      }
    } else if (tr.type === 'threat') {
      L.push([null, 'Upstairs, the Governor had threatened *' + t.name + '* with an extra day for keeping mum and getting named.']);
      L.push([null, res.threatHit ? t.name + ' was named, so the extra day stands.' : 'It didn’t come to that.']);
      if (!S.seen.trick_threat) { S.seen.trick_threat = 1; L.push(['moll', 'Same trick, other end: making keeping mum more dangerous than snitching.']); }
    }
    for (var i = 0; i < L.length; i++) {
      await say(L[i][0], L[i][1]);
      if (i === 1 && tr.type === 'sweet' && res.sweetTook) { await countTo(t, t.days); }
    }
  }

  // After dinner, at most one big thought each time. The trap only once
  // the wall is full; next time only the time after that; the judge only
  // after next time. In between, Moll remarks on what people actually did.
  async function lessonsAfter() {
    var L = [];
    if (foundAll() && !S.seen.logic) {
      S.seen.logic = S.round;
      L = L.concat(LESSONS.logic());
      if (S.prisoners.length > 2) { L = L.concat(LESSONS.multi()); }
    } else if (!foundAll() && S.round >= 4 && !S.seen.wonder) {
      S.seen.wonder = S.round;
      L = L.concat(LESSONS.wonder());
    } else if (S.seen.logic && S.seen.logic < S.round && !S.seen.future) {
      S.seen.future = S.round;
      L = L.concat(LESSONS.future());
    } else if (S.seen.future && S.seen.future < S.round && S.round >= 4 && !S.seen.end) {
      S.seen.end = S.round;
      L = L.concat(LESSONS.end());
    }
    if (!L.length) {
      var ev = eventsNow(), order = ['tft', 'mug', 'forgive', 'feud', 'trust'];
      for (var k = 0; k < order.length; k++) {
        if (S.seen[order[k]]) { continue; }
        var e = null;
        for (var j = 0; j < ev.length; j++) { if (ev[j].k === order[k]) { e = ev[j]; break; } }
        if (e) { S.seen[order[k]] = 1; L = L.concat(LESSONS[order[k]](e.x, e.y)); break; }
      }
    }
    if (L.length) { await talk(L); }
  }

  // --- the end of it ------------------------------------------------------
  function judgeComes() {
    var lng = S.len === 'long', minN = lng ? 7 : 4, chance = lng ? 0.2 : 0.3, cap = lng ? 20 : 12;
    if (S.round >= cap) { return true; }
    if (S.round < minN) { return false; }
    return Math.random() < chance;
  }

  function mumShare() {
    var c = 0, n = 0;
    S.prisoners.forEach(function (p) {
      Object.keys(S.mv[p.id] || {}).forEach(function (q) {
        S.mv[p.id][q].forEach(function (m) { n++; if (m === 'C') { c++; } });
      });
    });
    return n ? c / n : 0;
  }

  function closingRemark(r) {
    if (r >= 0.8) { return 'Well I never. Honour among thieves after all. You did yourselves proud, ' + duck() + '.'; }
    if (r >= 0.5) { return 'Not bad, ' + duck() + '. More mum than snitch. You’ll do.'; }
    if (r >= 0.25) { return 'Hmm. More snitching than mumming. The Governor’s rubbing his hands.'; }
    return 'Honour among thieves? Not in this lot. The Governor’s laughing all the way to the bank.';
  }

  async function assizes() {
    store(DONE_KEY, '1');
    await roundCard('The Assizes', 'The judge has come', true, GAVEL);
    showScene('cell');
    clearBubbles();
    S.prisoners.forEach(restFace);
    await say('key', 'On your feet! The judge is here.');
    await say('moll', closingRemark(mumShare()));
    var sorted = S.prisoners.slice().sort(function (a, b) { return a.days - b.days; });
    var best = sorted[0].days, worst = sorted[sorted.length - 1].days;
    S.prisoners.forEach(function (p) {
      var f = FIG[p.id];
      if (p.days === best) { setExpr(f, 'laugh'); setPose(f, 'cheer'); f.bounce = 1; }
      else if (p.days === worst) { setExpr(f, 'glum'); setPose(f, 'wring'); }
    });
    await resultsFriends(sorted);
  }

  function resultsFriends(sorted) {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      var n = S.prisoners.length, pairs = n * (n - 1) / 2, rounds = S.round;
      var best = sorted[0].days, firsts = sorted.filter(function (p) { return p.days === best; });
      var h = '<h1>The Assizes</h1><table class="res">';

        var line = p.human ? styleLine(styleOf(p.id), p.name, false)
          : p.name + ' was the computer: ' + LOOKS[p.look].name + ', who ' + RULES[p.strat] + '.';
        h += '<tr><td style="width:48px"><span class="face40">' + headSVG(p.look, p.days === best ? 'laugh' : null) + '</span></td>'
          + '<td><b>' + esc(p.name) + '</b><br><span class="sub">' + esc(line) + '</span></td>'
          + '<td class="n">' + plural(p.days, 'day') + '<br><span class="sub">' + missedText(p.missed) + '</span></td></tr>';
      });
      h += '</table>';
      h += '<p>First out of the door: <b>' + firsts.map(function (p) { return esc(p.name); }).join(' and ') + '</b>' + (firsts.length > 1 ? ', together!' : '!') + '</p>';
      h += '<p>Altogether, in ' + plural(rounds, 'questioning') + ', you got <b>' + plural(totalDays(), 'day') + '</b> and went without <b>' + plural(totalMissed(), 'dinner') + '</b>.'
        + ' Everybody keeping mum every time would have come to <b>' + plural(rounds * pairs * 2, 'day') + '</b>, and not one dinner missed.'
        + ' Everybody snitching every time: <b>' + plural(rounds * pairs * 4, 'day') + '</b>, and <b>' + plural(rounds * n, 'dinner') + '</b> missed.</p>';
      if (S.gov.kind === 'human') {
        var gn = /^(the )?governor$/i.test(S.gov.name) ? 'The Governor' : esc(S.gov.name) + ', the Governor,';
        h += '<p>' + gn + ' handed out <b>' + plural(totalDays(), 'day') + '</b>. That was the Governor’s score: the more, the better.</p>';
      }
      h += '<div class="btns"><button class="btn" data-act="notes">What was all that about?</button><button class="btn quiet" data-act="again">Play again</button><button class="btn quiet" data-act="menu">Menu</button></div>';
      showPanel(h, '', function (act) {
        if (my !== RUN) { reject(ABORT); return; }

  function setupPanel() {
    var my = RUN;

      function taken(except) {
        return SETUP.seats.filter(function (s, i) { return i !== except; }).map(function (s) { return s.look; });
      }
      function freeLook(i, from) {
        var used = taken(i), k = AVATARS.indexOf(from);
        for (var t = 1; t <= AVATARS.length; t++) {
          var c = AVATARS[(k + t + AVATARS.length) % AVATARS.length];
          if (used.indexOf(c) < 0) { return c; }
        }
        return AVATARS[0];
      }
      function tidy() {
        for (var i = 0; i < SETUP.seats.length; i++) {
          var st = SETUP.seats[i];
          if (AVATARS.indexOf(st.look) < 0 || taken(i).indexOf(st.look) >= 0) {
            st.look = freeLook(i, AVATARS[AVATARS.length - 1]);

        }).join('') + '</span>';
      }
      var GOVD = {
        plain: 'The Governor just asks.',
        crafty: 'The Governor plays dirty tricks.',
        human: 'A third player is the Governor, with whispers, bribes and threats, and wants as many days handed out as possible.'
      };
      function html() {
        tidy();
        var h = '<h2>Who’s in the cell?</h2>';
        for (var i = 0; i < SETUP.seats.length; i++) {
          var st = SETUP.seats[i];
          h += '<div class="row" style="flex-wrap:wrap"><button class="facebtn" data-act="face:' + i + '" aria-label="Change face">' + headSVG(st.look) + '</button>'
            + '<div style="flex:1 1 8em;min-width:0"><input type="text" maxlength="14" data-seat="' + i + '" value="' + esc(st.name) + '" aria-label="Name"></div></div>';
        }
        h += '<div class="row" style="flex-wrap:wrap"><b style="flex:1 1 6em">The Governor</b>' + seg([['plain', 'Computer'], ['crafty', 'Crafty'], ['human', 'A third player']], SETUP.gov, 'gov:') + '</div>'
          + '<p class="sub">' + GOVD[SETUP.gov] + '</p>';
        if (SETUP.gov === 'human') {
          h += '<div class="row"><span class="face64">' + headSVG('gov') + '</span><input type="text" maxlength="14" data-gov="1" value="' + esc(SETUP.govName) + '" aria-label="Governor’s name"></div>';
        }
        h += '<div class="row" style="flex-wrap:wrap"><b style="flex:1 1 6em">How long?</b>' + seg([['short', 'Short'], ['long', 'Long']], SETUP.len, 'len:') + '</div>'
          + '<p class="sub">Nobody knows when the judge will come. Short is about 6 questionings, long about 11.</p>'
          + '<div class="btns"><button class="btn quiet" data-act="back">Back</button><button class="btn" data-act="go">Lock them up!</button></div>';
        return h;
      }
      function redraw() {
        var keep = panelEl.scrollTop;
        showPanel(html(), '', handler);
        panelEl.scrollTop = keep;
      }
      function handler(act) {
        var parts = act.split(':');
        blip(280);
        if (parts[0] === 'face') {
          var i = +parts[1], st = SETUP.seats[i], old = st.look;
          st.look = freeLook(i, st.look);

          redraw(); return;
        }
        if (parts[0] === 'gov') { SETUP.gov = parts[1]; redraw(); return; }
        if (parts[0] === 'len') { SETUP.len = parts[1]; redraw(); return; }
        if (act === 'back') { begin(menu); return; }
        if (act === 'go') {
          hidePanel();
          if (my !== RUN) { reject(ABORT); return; }
          resolve();
        }
      }
      panelEl.oninput = function (e) {
        var t = e.target;
        if (t.getAttribute('data-seat') !== null) { SETUP.seats[+t.getAttribute('data-seat')].name = t.value; }
        if (t.getAttribute('data-gov') !== null) { SETUP.govName = t.value; }
      };
      showPanel(html(), '', handler);
    });
  }

  }

  async function introFriends() {
    // Who Moll is, what happened, and what the Bishop wants. Not a word
    // about what anything costs: that is for finding out.
    if (introDone) {
      await say('moll', 'More of you? The Bishop must have had the whole town rounded up.');
      await say('moll', 'Scratch your days on the wall as you get them, my ducks, so nobody can cheat you.');
      return;
    }
    introDone = true;
    var L = [
      ['moll', 'Well, well. More of you.'],
      ['moll', 'Grimstone Gaol’s never been so full. Half the town got dragged in after last night.'],
      ['moll', 'I’m Old Moll. Been in here forty year, give or take. Mind the rats, my ducks. And mind the bucket.'],
      ['moll', 'Quite a night, by all accounts. The Bishop’s feast day, his kitchen door smashed in, and the whole town helping itself to his dinner.'],
      ['moll', 'Goose, pudding, the lot. And now the Bishop wants to know who did what.'],
      ['moll', 'So the Governor will have each of you upstairs, one at a time, and ask you for names. Again and again, one thing after another.'],
      ['moll', 'Some folk keep mum (that’s keep their mouths shut). Some folk snitch. We’ll see which sort you are.'],
      ['moll', 'Scratch your days on the wall as you get them, so nobody can cheat you.'],
      ['moll', 'And nobody knows when the judge will come to sort you all out. Could be today. Could be next week. So you’d best get used to each other.']
    ];
    if (S.gov.kind !== 'plain') { L.push(['moll', 'And mind the Governor. He has his ways.']); }
    if (humans().length > 1 || S.gov.kind === 'human') { L.push(['moll', 'Whoever goes upstairs goes alone, and everybody else looks away. No peeking!']); }
    if (humans().length > 1) { L.push(['moll', 'Talk it over first, if you like. Then off you go.']); }
    await talk(L);
  }

  async function friendsGame(resumed) {
    $('b-menu').classList.remove('hide');
    setupCell();
    await fade(0);
    if (!resumed) { await introFriends(); }
    else { await say('moll', 'Back again, ' + duck() + '? Where were we... ' + misdeed(S.round)[0] + '.'); }
    for (;;) {
      save();
      await roundCard(capital(misdeed(S.round)[0]));
      await talkTime();
      await interrogations();
      var res = resolveRound();
      await revealRound(res);
      var over = judgeComes();
      if (over) { break; }
      await lessonsAfter(res);
      S.round++;
      drawKnitting(FIG.moll, S.round);
    }
    clearSave();
    await assizes();
  }

  var STORY = { look: 'ned', name: 'Ned' };

  };

  function storySetupPanel() {

  async function mateArrives(id) {
    var mate = { id: 'm' + S.story.i, look: id, name: LOOKS[id].short, human: false, strat: id };
    addPrisoner(mate);
    S.story.left = randInt(3, 5);

    var f = ensureFig(mate);
    f.away = true; f.op = 0; f.x = LAY.doorCx; f.y = LAY.backY;
    restFace(mate);
    drawTallies();
    await keyIn();
    await say('key', S.story.i === 0 ? 'Here. Company for you.' : 'New cellmate for you. Play nice.');
    hideSpeech();

    f.lookT = -1;
    await say(mate, MATE_HELLO[id]);

  function times(n) {
    var words = ['', 'once', 'twice', 'three times', 'four times', 'five times', 'six times', 'seven times', 'eight times', 'nine times', 'ten times'];
    return words[n] || n + ' times';
  }
  function count(a, m) { return a.filter(function (x) { return x === m; }).length; }

  function mateExplain(st) {
    var mine = (S.mv.you && S.mv.you[st.mateId]) || [], d = count(mine, 'D'), c = count(mine, 'C'), L = [];
    switch (st.mate) {
      case 'sam':
        L.push(['moll', 'That was Soft Sam. He never snitches. Not ever, whatever you do to him.']);
        L.push(['moll', d ? 'And you snitched on him ' + times(d) + '. ' + (d === 1 ? 'That time' : 'Each time') + ' you saved yourself a day, and poor Sam got three, and no dinner. Easy pickings... but picking on Sam ain’t pretty, is it?'
          : 'And you never snitched on him once. Good for you.']);
        L.push(['moll', 'Being soft is lovely with folk who are soft back. But there’s sharks in here.']);
        break;
      case 'nell':
        L.push(['moll', 'That was Nasty Nell. She snitches every single time, whatever you do. And she promised you she wouldn’t, didn’t she?']);
        L.push(['moll', c >= 2 ? 'Keeping mum for Nell just gets you three days a time, and no dinner.' : 'You twigged her quick. With Nell, snitching back is all you can do.']);
        L.push(['moll', 'Talk’s cheap, my duck. Watch what folk *do*.']);
        break;
      case 'jack':
        L.push(['moll', 'That was Honest Jack. The first time, he keeps mum. After that, he does whatever you did to him the time before.']);
        L.push(['moll', d ? 'When you snitched, Jack snitched right back the next time. Nothing personal. *Tit for tat.*'
          : 'You kept mum, so Jack kept mum. One day a time, the pair of you, and dinner every time. Lovely.']);
        break;
      case 'grim':
        L.push(['moll', 'That was Grim Grimshaw. He keeps mum... until the first time you snitch on him. Then he snitches on you every time, for ever.']);
        L.push(['moll', d ? 'You found out the hard way. Grimshaw never forgives. Not once.' : 'You never crossed him, so you never saw his teeth.']);
        break;
      case 'meg':
        L.push(['moll', 'That was Mad Meg. She tosses a penny every time! Heads, she keeps mum. Tails, she snitches.']);
        L.push(['moll', 'You can’t build trust with somebody who doesn’t care what you do. Best you can do is look after yourself.']);
        break;
      case 'sid':
        L.push(['moll', 'That was Sly Sid. He snitches the very first time, just to test you.']);
        L.push(['moll', d ? 'You hit back, so he said sorry and played fair after that. He only picks on mugs.'
          : 'You never hit back... so he took you for a mug, and snitched on you every other time.']);
        break;
    }
    var mn = LOOKS[st.mate].short;
    var missed = function (n) { return n ? 'missed *' + plural(n, 'dinner') + '*' : 'never missed a dinner'; };
    L.push([null, 'With ' + mn + ': ' + plural(st.rounds, 'questioning') + '. You got *' + plural(st.you, 'day') + '* and ' + missed(st.youMissed) + '. '
      + mn + ' got *' + plural(st.them, 'day') + '* and ' + missed(st.themMissed) + '.']);
    return L;
  }

  function trackStretch(res) {
    var st = S.story.stretch, q = res.pairs[0];
    if (!st || !q) { return; }
    var youA = q.a.id === 'you', mate = youA ? q.b : q.a;
    st.rounds++;
    st.you += youA ? q.da : q.db;
    st.them += youA ? q.db : q.da;
    if (res.named.you) { st.youMissed++; }
    if (res.named[mate.id]) { st.themMissed++; }
  }

  async function storyGame(resumed) {
    $('b-menu').classList.remove('hide');
    setupCell();
    await fade(0);
    if (!resumed) { await introStory(); }
    else { await say('moll', 'Back again, my duck? Where were we... ' + misdeed(S.round)[0] + '.'); }
    while (S.story.i < MATES.length) {
      if (S.story.left === null) { await mateArrives(MATES[S.story.i]); }
      while (S.story.left > 0) {
        save();
        await roundCard(capital(misdeed(S.round)[0]));
        await talkTime();
        await interrogations();
        var res = resolveRound();
        trackStretch(res);
        await revealRound(res);
        await lessonsAfter(res);
        S.story.left--;
        S.round++;
        drawKnitting(FIG.moll, S.round);
      }
      await mateLeaves();
    }
    clearSave();
    await storyEnd();
  }

  async function storyEnd() {
    S.round--;
    store(DONE_KEY, '1');
    await roundCard('The Assizes', 'The judge has come', true, GAVEL);
    showScene('cell');
    clearBubbles();
    S.prisoners.forEach(restFace);
    await say('key', 'On your feet! The judge is here.');
    await say('moll', 'Well, my duck. That’s your time up. Let’s see how you did.');
    await storyResults();
    await greatTally();
    endPanel();
  }

  function storyResults() {
    var my = RUN, you = S.prisoners[0];
    return new Promise(function (resolve, reject) {
      var rounds = 0;
      S.story.done.forEach(function (st) { rounds += st.rounds; });
      var h = '<h1>The Assizes</h1><p>In ' + plural(rounds, 'questioning') + ', you got <b>' + plural(you.days, 'day') + '</b> and went without <b>' + plural(you.missed || 0, 'dinner') + '</b>.</p><table class="res">';
      S.story.done.forEach(function (st) {
        h += '<tr><td style="width:48px"><span class="face40">' + headSVG(st.mate) + '</span></td>'
          + '<td><b>' + esc(LOOKS[st.mate].name) + '</b><br><span class="sub">' + esc(RULES[st.mate]) + '</span></td>'
          + '<td class="n">you ' + st.you + '<br><span class="sub">' + esc(LOOKS[st.mate].short) + ' ' + st.them + '</span></td></tr>';
      });
      h += '</table><p>' + esc(styleLine(styleOf('you'), you.name, true)) + '</p>'
        + '<div class="btns"><button class="btn" data-act="go">Moll’s reckoning</button></div>';
      showPanel(h, '', function (act) {
        if (act !== 'go') { return; }
        hidePanel();
        if (my !== RUN) { reject(ABORT); return; }
        resolve();
      });
    });
  }

  function tallyPanel(tot, order) {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      var max = 0;
      order.forEach(function (id) { max = Math.max(max, tot[id]); });
      var h = '<h2>Moll’s reckoning</h2><p class="sub">Every sort sharing a cell with every other sort, and with one of its own, twenty questionings at a time. Days, all added up. Fewest is best off.</p><div class="bars">';
      order.forEach(function (id, i) {
        h += '<div class="bar' + (i === 0 ? ' win' : '') + '"><span class="face40">' + headSVG(id, i === 0 ? 'grin' : null) + '</span>'
          + '<span class="lab">' + esc(LOOKS[id].name) + '</span><span class="track"><span class="fill" data-w="' + (tot[id] / max * 100).toFixed(1) + '" style="display:block"></span></span>'
          + '<span class="val">' + Math.round(tot[id]) + '</span></div>';
      });
      h += '</div><div class="btns"><button class="btn" data-act="go">Go on, Moll</button></div>';
      showPanel(h, '', function (act) {
        if (act !== 'go') { return; }
        hidePanel();
        if (my !== RUN) { reject(ABORT); return; }
        resolve();
      });
      var fills = panelEl.querySelectorAll('.fill');
      setTimeout(function () {
        for (var i = 0; i < fills.length; i++) { fills[i].style.width = fills[i].getAttribute('data-w') + '%'; }
        blip(330);
      }, 80);
    });
  }

  async function greatTally() {
    await talk([
      ['moll', 'I’ve watched every sort come through that door, forty year. Sams and Nells, Jacks and Megs, Grimshaws and Sids.'],
      ['moll', 'And I’ve kept count. Say every sort shared a cell with every other sort, twenty questionings at a time, and with one of its own sort too.'],
      ['moll', 'Add up all the days each sort would get. Here’s how it comes out.']
    ]);
    var tot = tournament(20), order = MATES.slice().sort(function (a, b) { return tot[a] - tot[b]; });
    await tallyPanel(tot, order);
    var win = order[0];
    if (win === 'jack') {
      await talk([
        ['moll', 'Honest Jack comes out best. And here’s the funny thing.'],
        ['moll', 'Jack never once got fewer days than the cellmate he was sharing with. Not once! He never beat anybody.'],
        ['moll', 'Jack just never got taken for a mug, and never started a fight. Over a long stretch, with all sorts, Jack’s way comes out best.']
      ]);
    } else {
      await say('moll', LOOKS[win].name + ' comes out best this time, with Honest Jack close behind. The penny’s been kind to somebody.');
    }
    await talk([
      ['moll', 'Never be the first to snitch. Hit back when you’re snitched on. Forgive the moment the snitching stops. And keep your ways simple, so folk know where they stand with you.'],
      ['moll', 'Remember that, my duck. Out there as much as in here.']
    ]);
  }

  function endPanel() {
    var h = '<div style="text-align:center"><h1>Free at last</h1><p>The judge let you off with time served. Mind how you go.</p>'
      + '<div class="btns"><button class="btn" data-act="notes">What was all that about?</button><button class="btn quiet" data-act="again">Play again</button><button class="btn quiet" data-act="menu">Menu</button></div></div>';
    showPanel(h, '', function (act) {
      if (act === 'notes') { notesPanel(endPanel); }
      if (act === 'again') { begin(startStory); }
      if (act === 'menu') { begin(menu); }
    });
  }

  // ------------------------------------------------------------------
  // What it was all about: the real ideas, with their real names, for
  // the older ones and for whoever is sitting with them.
  // ------------------------------------------------------------------
  function notesPanel(onClose) {
    var h = '<div class="notes"><div class="btns" style="justify-content:flex-end;margin:0"><button class="btn quiet" data-act="close">Close</button></div>'
      + '<h1>What was all that about?</h1>'
      + '<p>This game is named after a famous puzzle, <b>the prisoner’s dilemma</b>. A dilemma is a choice where every answer has a catch. In the game, Moll and the prisoners work the puzzle out for themselves, one questioning at a time. Here it is all at once.</p>'

      + '<h3>The puzzle</h3>'
      + '<p>Two prisoners are questioned separately, and each is made the same offer. Each prisoner can keep mum about the other, or name the other. Moll’s chalk, all filled in, in days, with a bowl for dinner:</p>'
      + foundHTML({ cc: 1, cd: 1, dd: 1 })
      + '<p>Whatever the other prisoner does, naming gets a better result: none instead of one, or two instead of three. But if <i>both</i> prisoners name each other, both end up with two, when both keeping mum would have got each of them one.</p>'
      + '<p>So the clever choice for each prisoner is the wrong choice for the pair. Looking after number one leaves both worse off, one sensible-looking step at a time.</p>'
      + '<p>Dinner doesn’t change the puzzle. A prisoner’s own dinner depends only on what the <i>other</i> prisoner says, so it can’t make naming any less tempting. What it does is make the trap hurt straight away: two prisoners who name each other both go hungry, as well as getting the extra day.</p>'

      + '<h3>Where it came from</h3>'
      + '<p>Two mathematicians, Merrill Flood and Melvin Dresher, came up with it in 1950 at the RAND Corporation, an American research organisation working on the Cold War. Their colleague Albert Tucker told it as a story about two prisoners questioned in separate rooms, and the name stuck.</p>'
      + '<p>Real courts did something like it long before. In the 1700s and 1800s a criminal could <b>turn King’s evidence</b>: give evidence against the rest of the gang, and go free. The puzzle was being played for real two hundred years before anybody gave it a name.</p>'

      + '<h3>The trap has a name too</h3>'
      + '<p>When everybody is doing the best they can, given what everybody else is doing, and nobody can do better by changing on their own, that is a <b>Nash equilibrium</b>, after the mathematician John Nash (the film <i>A Beautiful Mind</i> is about him). In the prisoner’s dilemma, the Nash equilibrium is both snitching. It is steady, and it is bad for both of you.</p>'

      + '<h3>Again and again</h3>'
      + '<p>Play just once, and snitching is hard to argue with. But play again and again with the same people, and what you do this time changes what the others do next time. This is the <b>repeated</b> (or <b>iterated</b>) prisoner’s dilemma, and the idea that next time matters is sometimes called <b>the shadow of the future</b>.</p>'
      + '<p>That is why the judge’s arrival is kept secret. If everyone knew which questioning was the last, snitching that time would be safe. Then snitching the time before would be safe too, and the time before that, until the whole thing unravels back to the start. Not knowing when it ends keeps it alive.</p>'
      + '<p>Talking does not change the deal. Anybody can promise to keep mum, and nothing makes anybody keep the promise. Game theorists call promises that cost nothing <b>cheap talk</b>.</p>'

      + '<h3>The tournament</h3>'
      + '<p>In 1980 the political scientist Robert Axelrod invited experts to send in computer programs to play the repeated prisoner’s dilemma against each other. The winner was the simplest program sent in: <b>Tit for Tat</b>, by Anatol Rapoport. It cooperates on the first round, then copies whatever the other player did last time. Axelrod ran the tournament again with 62 entries, from people who all knew Tit for Tat had won. It won again.</p>'
      + '<p>Axelrod noticed that the strategies that did well were:</p><ul>'
      + '<li><b>Nice:</b> never the first to snitch.</li>'
      + '<li><b>Retaliating:</b> they hit back when snitched on, so nobody could take them for a mug.</li>'
      + '<li><b>Forgiving:</b> they went back to keeping mum as soon as the other did.</li>'
      + '<li><b>Clear:</b> simple enough that others could work out how to get on with them.</li></ul>'
      + '<p>Strangest of all, Tit for Tat never beats the player it is up against. It can only draw, or lose by a little. It wins by getting along with everybody.</p>'

      + '<h3>The cellmates</h3><ul>'
      + '<li><b>Soft Sam</b> always keeps mum: <i>Always Cooperate</i>.</li>'
      + '<li><b>Nasty Nell</b> always snitches: <i>Always Defect</i>.</li>'
      + '<li><b>Honest Jack</b> is <i>Tit for Tat</i>.</li>'
      + '<li><b>Grim Grimshaw</b> is the <i>Grudger</i>, also called <i>Grim Trigger</i>: one snitch and he never forgives.</li>'
      + '<li><b>Mad Meg</b> is <i>Random</i>.</li>'
      + '<li><b>Sly Sid</b> is a <i>Tester</i>, like one of the programs in Axelrod’s second tournament: he snitches first to see if you will stand up for yourself.</li></ul>'
      + '<p>Moll’s reckoning, at the end of “On your own”, is a small tournament of the same kind, played out by the computer.</p>'

      + '<h3>Where else it turns up</h3><ul>'
      + '<li><b>Group projects:</b> everybody is better off if everybody works, but each person is tempted to let the others do it.</li>'
      + '<li><b>Two shops</b> cutting prices to steal each other’s customers, until neither makes any money.</li>'
      + '<li><b>Countries</b> deciding whether to build more weapons than each other, or whether to cut pollution when cutting it costs them and helps everybody.</li>'
      + '<li><b>Sport:</b> if one athlete cheats with drugs, the others are tempted to cheat too, and then nobody has an advantage and everybody takes the risk.</li>'
      + '<li><b>The trenches of the First World War:</b> on quiet stretches of the front, soldiers on both sides sometimes stopped trying to kill each other, as long as the other side did the same. Historians call it <i>live and let live</i>.</li>'
      + '<li><b>Animals:</b> vampire bats share blood meals with hungry roost-mates, and are more likely to share with bats that have shared with them before.</li></ul>'

      + '<h3>About Grimstone</h3>'
      + '<p>Grimstone Gaol is made up, but gaols like it were real. Before reformers such as John Howard and Elizabeth Fry, prisoners paid the gaoler for their food, for a bed, even to have their chains taken off, and could be kept locked up after being found not guilty until they had paid a fee to leave.</p>'
      + '<p>The raid on the Bishop’s feast is made up too, though hungry crowds really did break into bakers’ shops and corn stores in the bad harvest years around 1800, and whole crowds were rounded up afterwards.</p>'
      + '<div class="btns"><button class="btn" data-act="close">Close</button></div></div>';
    showPanel(h, '', function (act) {
      if (act === 'close') { hidePanel(); if (onClose) { onClose(); } }
    });
  }

  // ------------------------------------------------------------------
  // Off we go.
  // ------------------------------------------------------------------
  function boot() {
    drawTopButtons();
    FIG.key = makeFigure('key');
    FIG.key.shown = false;
    FIG.key.persp = 0.92;
    CL.figs.appendChild(FIG.key.root);
    FIG.moll = makeFigure('moll');
    FIG.moll.persp = 0.95;
    CL.figs.appendChild(FIG.moll.root);
    layout();
    requestAnimationFrame(frame);
    begin(menu);
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 140);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 260);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && AC && AC.state === 'suspended') { AC.resume(); }
  });

  boot();
})();
</script>
