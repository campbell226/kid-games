<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1F2E4A">
<title>Picture Pop</title>
<style>
  :root{
    --night:#1F2E4A; --night-2:#16233A; --paper:#FBF3E2; --sun:#FFC53D;
    --coral:#FF6B57; --mint:#46C2A0; --sky:#7FB2E8; --ink:#152238;
    --shadow:rgba(9,16,30,.45); --pad:clamp(14px,4vw,26px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 80% at 50% -10%, #2B3F63 0%, var(--night) 45%, var(--night-2) 100%);
    color:var(--paper);
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI Rounded","Trebuchet MS",system-ui,sans-serif;
    font-weight:800; overscroll-behavior:none; -webkit-font-smoothing:antialiased;
  }
  .app{min-height:100dvh;display:flex;flex-direction:column;padding:var(--pad);gap:var(--pad);max-width:760px;margin:0 auto}
  .screen{display:none;flex:1;flex-direction:column;gap:16px}
  .screen.on{display:flex}

  h1{margin:0;font-size:clamp(30px,9vw,48px);line-height:.95;letter-spacing:-.02em;color:var(--sun);text-shadow:0 3px 0 #C88F13}
  h1 span{display:block;color:var(--paper);text-shadow:none;font-size:.42em;letter-spacing:0;margin-top:8px;font-weight:700;opacity:.85}
  h2{margin:0;font-size:clamp(21px,5.5vw,28px);line-height:1.1}
  p.hint{margin:0;font-weight:700;font-size:15px;opacity:.7;line-height:1.45;max-width:44ch}

  .btn{font:inherit;font-size:clamp(18px,5vw,22px);border:0;border-radius:22px;padding:18px 22px;
    background:var(--sun);color:var(--ink);box-shadow:0 6px 0 #C88F13, 0 12px 22px var(--shadow);
    cursor:pointer;transition:transform .08s ease, box-shadow .08s ease;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 #C88F13, 0 4px 10px var(--shadow)}
  .btn.coral{background:var(--coral);box-shadow:0 6px 0 #C4402F, 0 12px 22px var(--shadow)}
  .btn.coral:active{box-shadow:0 1px 0 #C4402F, 0 4px 10px var(--shadow)}
  .btn.sky{background:var(--sky);box-shadow:0 6px 0 #4A7FB5, 0 12px 22px var(--shadow)}
  .btn.sky:active{box-shadow:0 1px 0 #4A7FB5, 0 4px 10px var(--shadow)}
  .btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 3px rgba(251,243,226,.28);font-size:17px;padding:14px 18px}
  .btn.ghost:active{transform:translateY(2px)}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn:focus-visible,.chip:focus-visible,.thumb:focus-visible,.seg button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
  .row{display:flex;gap:12px}.row .btn{flex:1}

  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;padding:4px 0}
  .thumb{position:relative;background:var(--paper);padding:8px 8px 34px;border:0;border-radius:4px;
    box-shadow:0 8px 18px var(--shadow);cursor:pointer;display:block;width:100%;font:inherit}
  .thumb:nth-child(3n){transform:rotate(-1.8deg)}
  .thumb:nth-child(3n+2){transform:rotate(1.5deg)}
  .thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:2px;background:#ddd}
  .thumb .cap{position:absolute;left:8px;right:8px;bottom:9px;color:var(--ink);font-size:15px;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb .x{position:absolute;top:-9px;right:-9px;width:30px;height:30px;border-radius:50%;background:var(--coral);
    color:#fff;font-size:17px;line-height:30px;text-align:center;box-shadow:0 3px 8px var(--shadow)}
  .empty{border:3px dashed rgba(251,243,226,.3);border-radius:18px;padding:26px 18px;text-align:center;
    font-weight:700;opacity:.75;font-size:16px;line-height:1.5}

  .stage{position:relative;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:1;box-shadow:0 14px 30px var(--shadow)}
  .stage img{width:100%;height:100%;object-fit:cover;display:block}

  input[type=text]{font:inherit;font-size:22px;width:100%;padding:16px 18px;border-radius:18px;border:0;
    background:var(--paper);color:var(--ink);box-shadow:inset 0 -4px 0 rgba(21,34,56,.12)}
  input[type=text]::placeholder{color:#9a917f;font-weight:700}

  .playgrid{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center}
  .puzzlewrap{position:relative;width:min(100%,520px,56dvh);margin:0 auto}
  .answers{width:100%;max-width:520px;margin:0 auto}
  svg.puzzle{width:100%;display:block;filter:drop-shadow(0 12px 26px var(--shadow));
    transition:filter .5s ease}
  svg.puzzle .pc{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.55) rotate(-8deg)}
  svg.puzzle .pc.in{opacity:1;transform:none;transition:opacity .26s ease, transform .34s cubic-bezier(.3,1.5,.5,1)}
  svg.puzzle #img{transition:transform .55s cubic-bezier(.4,.9,.3,1)}
  .frame{position:absolute;inset:-10px;border-radius:22px;border:4px solid rgba(251,243,226,.16)}
  .stars{display:flex;gap:8px;justify-content:center;font-size:32px;line-height:1}
  .stars i{filter:grayscale(1) brightness(1.6);opacity:.35;transition:.3s;font-style:normal}
  .stars i.lit{filter:none;opacity:1}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chip{font:inherit;font-size:clamp(17px,4.6vw,21px);border:0;border-radius:20px;padding:20px 12px;
    background:var(--paper);color:var(--ink);box-shadow:0 6px 0 #C9BFA6;cursor:pointer;
    min-height:74px;word-break:break-word;transition:transform .08s ease,box-shadow .08s}
  .chip:active{transform:translateY(5px);box-shadow:0 1px 0 #C9BFA6}
  .chip.wrong{background:#6E7B92;color:rgba(255,255,255,.6);box-shadow:none;pointer-events:none;transform:none}
  .chip.right{background:var(--mint);color:#06301f;box-shadow:0 6px 0 #2C8168;animation:pop .4s ease}
  @keyframes pop{50%{transform:scale(1.08)}}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pill{background:rgba(251,243,226,.12);border-radius:999px;padding:9px 16px;font-size:16px;white-space:nowrap}
  .iconbtn{background:rgba(251,243,226,.12);border:0;color:var(--paper);font:inherit;font-size:19px;
    width:48px;height:48px;border-radius:50%;cursor:pointer;flex:none}
  /* label beside its own control, one pair per row, so nothing reads as the wrong pair */
  .settings{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;max-width:440px}
  .seg{display:flex;background:rgba(251,243,226,.1);border-radius:999px;padding:4px;gap:4px;width:100%}
  .seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--paper);opacity:.6;
    padding:11px 8px;border-radius:999px;cursor:pointer;flex:1}
  .seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);opacity:1}
  .seglabel{font-size:13px;opacity:.6;font-weight:700}
  .msg{background:rgba(255,107,87,.16);border:2px solid rgba(255,107,87,.5);border-radius:16px;padding:14px;font-size:15px;font-weight:700;line-height:1.45}

  /* the cheer, over the names */
  .banner{position:relative;border-radius:22px;padding:18px;text-align:center;background:var(--mint);color:#06301f;
    box-shadow:0 8px 22px var(--shadow);animation:pop .45s ease}
  .banner .who{font-size:clamp(24px,7vw,34px);line-height:1.1;margin:6px 0 0}
  .hide{display:none !important}

  /* landscape and desktop: the picture sits beside the names */
  @media (min-aspect-ratio:13/10){
    .app.playing{max-width:1040px}
    .app.playing .playgrid{flex-direction:row;align-items:center;gap:clamp(14px,3vw,28px)}
    .app.playing .puzzlewrap{width:min(46vw,72dvh);margin:0;flex:none}
    .app.playing .answers{flex:1;max-width:none;margin:0}
    .app.playing .chip{min-height:64px;padding:16px 12px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- HOME -->
  <section id="s-home" class="screen on">
    <div class="topbar">
      <h1>Picture Pop<span>Snap it, name it, guess it</span></h1>
      <button class="iconbtn" id="mute" title="Sound on or off">&#128266;</button>
    </div>

    <div id="msg" class="msg hide"></div>
    <div id="board" class="board"></div>
    <div id="empty" class="empty">No pictures yet.<br>Add two or more, then play.</div>

    <button class="btn" id="btn-camera">&#128247; Take a picture</button>
    <button class="btn sky" id="btn-gallery">&#128444;&#65039; Add one from the gallery</button>
    <input type="file" id="file-camera" accept="image/*" capture="environment" class="hide">
    <input type="file" id="file-gallery" accept="image/*" class="hide">

    <div class="settings">
      <span class="seglabel">Pieces</span>
      <div class="seg" id="seg-pieces">
        <button data-v="3" aria-pressed="false">9</button>
        <button data-v="4" aria-pressed="true">16</button>
        <button data-v="5" aria-pressed="false">25</button>
        <button data-v="7" aria-pressed="false">49</button>
      </div>
      <span class="seglabel">Speed</span>
      <div class="seg" id="seg-speed">
        <button data-v="1000" aria-pressed="true">Slow</button>
        <button data-v="620" aria-pressed="false">Medium</button>
        <button data-v="340" aria-pressed="false">Fast</button>
      </div>
      <span class="seglabel">Tricks</span>
      <div class="seg" id="seg-twist">
        <button data-v="0" aria-pressed="false">None</button>
        <button data-v="1" aria-pressed="true">Some</button>
        <button data-v="2" aria-pressed="false">Lots</button>
      </div>
    </div>

    <button class="btn coral" id="btn-play" disabled>&#9654; Play</button>
    <p class="hint">A grown-up types the names. Tap a picture to rename it or take it off the board. The pictures are kept on this device and go nowhere else.</p>
  </section>

  <!-- LABEL -->
  <section id="s-label" class="screen">
    <h2 id="label-title">Who is it?</h2>
    <div class="stage" style="max-width:340px;margin:0 auto"><img id="preview" alt="The picture you just added"></div>
    <input type="text" id="label-input" placeholder="Type a name" maxlength="22" autocomplete="off">
    <button class="btn" id="btn-save">Save picture</button>
    <div class="row">
      <button class="btn ghost" id="btn-delete">Remove</button>
      <button class="btn ghost" id="btn-cancel">Back</button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="s-play" class="screen">
    <div class="topbar">
      <div class="pill" id="score-pill">&#9733; 0</div>
      <div class="stars" id="stars"><i>&#9733;</i><i>&#9733;</i><i>&#9733;</i></div>
      <button class="iconbtn" id="play-quit">&#10005;</button>
    </div>
    <div class="playgrid">
      <div class="puzzlewrap">
        <div class="frame"></div>
        <svg class="puzzle" id="puzzle" viewBox="0 0 600 600" role="img" aria-label="A picture appearing piece by piece"></svg>
      </div>
      <div class="answers">
        <div class="choices" id="choices"></div>
        <div class="banner hide" id="banner">
          <div id="banner-top">Yes!</div>
          <div class="who" id="banner-who"></div>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
"use strict";

const STORE_KEY = "picturepop:photos";
let photos = [];
let gridN = 4, stepMs = 1000, twistLevel = 1;
let soundOn = true;
let editingId = null, pendingData = null;

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  $("app").classList.toggle("playing", id === "s-play");
  window.scrollTo(0,0);
};
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.random()*a.length|0];
const say = t => { const m=$("msg"); m.textContent=t; m.classList.remove("hide"); };
const hush = () => $("msg").classList.add("hide");

/* ---------- sound: synthesised, so it is never silent ---------- */
let ac = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==="suspended") ac.resume(); return ac; }
function tone(freq,start,dur,type,vol){
  const c=audio(); if(!c||!soundOn) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"triangle"; o.frequency.value=freq;
  const t0=c.currentTime+start;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.22,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+0.05);
}
const sfx = {
  piece(i,t){ tone(330+(i/Math.max(1,t))*520,0,0.13,"sine",0.13); },
  right(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.30,"triangle",0.22)); },
  wrong(){ tone(220,0,0.16,"sawtooth",0.10); tone(165,0.13,0.24,"sawtooth",0.10); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.11,0.45,"triangle",0.20)); },
  tap(){ tone(660,0,0.05,"sine",0.10); }
};

/* ---------- storage: this device, nowhere else ---------- */
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const v = JSON.parse(raw);
      if(Array.isArray(v)) photos = v.filter(p => p && p.id && p.label && p.data);
    }
  }catch(e){ photos = []; }
  renderBoard();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(photos)); return true; }
  catch(e){ return false; }
}

/* ---------- adding pictures ---------- */
const SIZE = 720;
const MAX_PHOTOS = 10;
function toSquare(src,w,h){
  const side=Math.min(w,h);
  const cv=document.createElement("canvas"); cv.width=cv.height=SIZE;
  cv.getContext("2d").drawImage(src,(w-side)/2,(h-side)/2,side,side,0,0,SIZE,SIZE);
  return cv.toDataURL("image/jpeg",0.78);
}
async function fromFile(file){
  let bmp = null, url = null;
  try{ bmp = await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){
    url = URL.createObjectURL(file);
    try{ bmp = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }
    catch(e2){ bmp = null; }
  }
  if(!bmp){ if(url) URL.revokeObjectURL(url); say("That picture would not open. Try a different one."); return; }
  let data = null;
  try{ data = toSquare(bmp,bmp.width,bmp.height); }
  catch(e){ data = null; }
  if(url) URL.revokeObjectURL(url);
  if(bmp.close) bmp.close();
  if(!data){ say("That picture would not open. Try a different one."); return; }
  pendingData = data;
  hush();
  openLabel(null);
}

/* ---------- labelling ---------- */
function openLabel(id){
  editingId=id;
  const p = id ? photos.find(x=>x.id===id) : null;
  $("preview").src = p ? p.data : pendingData;
  $("label-input").value = p ? p.label : "";
  $("label-title").textContent = p ? "Change the name" : "Who is it?";
  $("btn-delete").classList.toggle("hide", !p);
  show("s-label");
  setTimeout(()=>$("label-input").focus(),120);
}
function saveLabel(){
  const name = $("label-input").value.trim();
  if(!name){ $("label-input").focus(); return; }
  if(editingId){ photos.find(x=>x.id===editingId).label = name; }
  else{ photos.push({ id:Date.now()+"_"+Math.random().toString(36).slice(2,7), label:name, data:pendingData }); }
  pendingData=null; editingId=null; sfx.tap();
  const kept = save();
  renderBoard(); show("s-home");
  if(kept) hush();
  else say("This device has run out of room to remember pictures. The board works now, but take one or two off if you want them next time.");
}
function renderBoard(){
  const b=$("board"); b.innerHTML="";
  photos.forEach(p=>{
    const el=document.createElement("button");
    el.className="thumb"; el.type="button";
    el.innerHTML = '<img alt=""><span class="cap"></span><span class="x">&#10005;</span>';
    el.querySelector("img").src = p.data;
    el.querySelector(".cap").textContent = p.label;
    el.addEventListener("click",()=>openLabel(p.id));
    b.appendChild(el);
  });
  $("empty").classList.toggle("hide", photos.length>0);
  $("btn-play").disabled = photos.length < 2;
}

/* ---------- jigsaw geometry ---------- */
const S = 600;
function knob(ax,ay,bx,by,sign){
  const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy);
  const ux=dx/L, uy=dy/L, nx=-uy*sign, ny=ux*sign;
  const G=(t,q)=>[ax+ux*t*L+nx*q*L, ay+uy*t*L+ny*q*L];
  const raw=[[[.15,.03],[.28,-.03],[.40,0]],
             [[.36,-.10],[.31,-.21],[.50,-.21]],
             [[.69,-.21],[.64,-.10],[.60,0]],
             [[.74,.03],[.86,-.03],[1,0]]];
  return raw.map(s=>({c1:G(s[0][0],s[0][1]), c2:G(s[1][0],s[1][1]), p:G(s[2][0],s[2][1])}));
}
const fwd = segs => segs.map(s=>`C${s.c1[0]} ${s.c1[1]} ${s.c2[0]} ${s.c2[1]} ${s.p[0]} ${s.p[1]}`).join("");
function rev(segs,A){
  const out=[];
  for(let i=segs.length-1;i>=0;i--) out.push({c1:segs[i].c2, c2:segs[i].c1, p: i>0?segs[i-1].p:A});
  return fwd(out);
}
function buildPieces(n){
  const cell=S/n, h=[], v=[];
  for(let r=0;r<=n;r++){ h[r]=[]; for(let c=0;c<n;c++) h[r][c]=Math.random()<0.5?1:-1; }
  for(let r=0;r<n;r++){ v[r]=[]; for(let c=0;c<=n;c++) v[r][c]=Math.random()<0.5?1:-1; }
  const paths=[];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const x=c*cell, y=r*cell, x2=x+cell, y2=y+cell;
    let d=`M${x} ${y}`;
    d += (r===0)   ? `L${x2} ${y}`  : fwd(knob(x,y,x2,y,h[r][c]));
    d += (c===n-1) ? `L${x2} ${y2}` : fwd(knob(x2,y,x2,y2,v[r][c+1]));
    d += (r===n-1) ? `L${x} ${y2}`  : rev(knob(x,y2,x2,y2,h[r+1][c]),[x,y2]);
    d += (c===0)   ? "Z"            : rev(knob(x,y,x,y2,v[r][c]),[x,y])+"Z";
    paths.push(d);
  }
  return paths;
}

/* ---------- picture tricks ---------- */
const COLOUR_TRICKS = [
  "none",
  "hue-rotate(150deg) saturate(1.4)",
  "hue-rotate(300deg) saturate(1.5)",
  "grayscale(1) contrast(1.15)",
  "sepia(1) contrast(1.1)",
  "invert(1) hue-rotate(180deg)"
];
const NO_TWIST = {rot:0, flip:1, colour:"none", zoom:1, cx:S/2, cy:S/2};
function makeTwist(){
  if(twistLevel===0) return NO_TWIST;
  const heavy = twistLevel===2;
  const rot = pick(heavy ? [0,90,180,270] : [0,0,90,180,270]);
  const flip = (heavy ? Math.random()<0.5 : Math.random()<0.3) ? -1 : 1;
  const colour = (heavy ? Math.random()<0.75 : Math.random()<0.45)
      ? pick(COLOUR_TRICKS.slice(1)) : "none";
  // a close crop: one part of the picture, blown up. Any centre keeps the
  // window inside the picture, so it can wander anywhere but the far corners.
  let zoom=1, cx=S/2, cy=S/2;
  if(heavy ? Math.random()<0.55 : Math.random()<0.25){
    zoom = heavy ? 1.8+Math.random()*1.2 : 1.6+Math.random()*0.6;
    cx = S*(0.15+Math.random()*0.70);
    cy = S*(0.15+Math.random()*0.70);
  }
  return {rot, flip, colour, zoom, cx, cy};
}
// zoom first, then turn and mirror the whole thing about the centre
const imgTransform = t =>
  `translate(${S/2} ${S/2}) rotate(${t.rot}) scale(${t.flip} 1) translate(${-S/2} ${-S/2}) ` +
  `translate(${t.cx.toFixed(1)} ${t.cy.toFixed(1)}) scale(${t.zoom.toFixed(3)}) ` +
  `translate(${(-t.cx).toFixed(1)} ${(-t.cy).toFixed(1)})`;

/* ---------- play ---------- */
let answer=null, lastId=null, revealed=0, totalPieces=0, timer=null, score=0, locked=false, wrongs=0, playing=false;

function startGame(){ audio(); score=0; lastId=null; playing=true; $("score-pill").textContent="★ 0"; nextRound(); }
function stopGame(){ playing=false; clearTimeout(timer); locked=true; }

function starsFor(){
  const frac = revealed/totalPieces;
  if(wrongs>=2) return 1;
  if(frac<=0.34 && wrongs===0) return 3;
  if(frac<=0.70 && wrongs<=1) return 2;
  return 1;
}
const paintStars = (el,n) => { el.innerHTML = "★★★".split("").map((s,i)=>`<i class="${i<n?"lit":""}">★</i>`).join(""); };

function nextRound(){
  if(!playing) return;
  clearTimeout(timer);
  $("banner").classList.add("hide");

  // pick a picture, never the same one twice running
  let pool = photos.filter(p=>p.id!==lastId);
  if(!pool.length) pool = photos.slice();
  answer = pick(pool); lastId = answer.id;

  revealed=0; wrongs=0; locked=false; totalPieces=gridN*gridN;
  paintStars($("stars"),3);

  const t = makeTwist();
  const svg = $("puzzle");
  svg.style.filter = "drop-shadow(0 12px 26px rgba(9,16,30,.45)) " + (t.colour==="none"?"":t.colour);
  svg.innerHTML =
    `<defs><pattern id="ph" patternUnits="userSpaceOnUse" width="${S}" height="${S}">
       <g id="img" transform="${imgTransform(t)}">
         <image href="${answer.data}" width="${S}" height="${S}" preserveAspectRatio="xMidYMid slice"></image>
       </g>
     </pattern></defs>
     <rect width="${S}" height="${S}" rx="18" fill="rgba(251,243,226,.07)"></rect>`;
  shuffle(buildPieces(gridN)).forEach(d=>{
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",d); p.setAttribute("fill","url(#ph)");
    p.setAttribute("stroke","rgba(21,34,56,.22)"); p.setAttribute("stroke-width","1.5");
    p.setAttribute("class","pc"); svg.appendChild(p);
  });

  const decoys = shuffle(photos.filter(p=>p.id!==answer.id)).slice(0,3);
  const box = $("choices"); box.innerHTML=""; box.classList.remove("hide");
  shuffle([answer,...decoys]).forEach(o=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.textContent=o.label;
    b.addEventListener("click",()=>guess(o,b));
    box.appendChild(b);
  });

  show("s-play");
  timer = setTimeout(revealNext, 700);
}

// pieces keep arriving until the picture is whole, then it waits as long as it takes
function revealNext(){
  const pcs = $("puzzle").querySelectorAll(".pc");
  if(revealed>=pcs.length) return;
  pcs[revealed].classList.add("in");
  sfx.piece(revealed,pcs.length);
  revealed++;
  paintStars($("stars"), starsFor());
  if(revealed<pcs.length) timer=setTimeout(revealNext, stepMs);
}

function guess(choice, btn){
  if(locked) return;
  if(choice.id===answer.id){
    locked=true; clearTimeout(timer);
    btn.classList.add("right"); sfx.right();
    setTimeout(finish, 650);
  }else{
    wrongs++; btn.classList.add("wrong"); sfx.wrong();
    paintStars($("stars"), starsFor());
  }
}

function finish(){
  clearTimeout(timer); locked=true;
  const svg=$("puzzle");
  svg.querySelectorAll(".pc").forEach(p=>p.classList.add("in"));
  // straighten and pull back out of the crop as the reward. Same list of
  // primitives as the twisted one, so it animates part by part.
  const g = svg.querySelector("#img");
  if(g) g.setAttribute("transform", imgTransform(NO_TWIST));
  svg.style.filter = "drop-shadow(0 12px 26px rgba(9,16,30,.45))";

  score += starsFor();
  $("score-pill").textContent = "★ " + score;

  const ban=$("banner");
  ban.classList.remove("hide");
  $("banner-top").textContent = pick(["Yes!","Got it!","Hooray!"]);
  $("banner-who").textContent = answer.label;
  $("choices").classList.add("hide");
  sfx.win();

  timer = setTimeout(nextRound, 2400);
}

/* ---------- wiring ---------- */
// two ways in, because a phone will not let us ask which one you wanted
function wireAdd(btnId, inputId){
  $(btnId).addEventListener("click", ()=>{
    if(photos.length>=MAX_PHOTOS){ say("Ten pictures is the limit. Take one off to add another."); return; }
    hush(); $(inputId).click();
  });
  $(inputId).addEventListener("change", e=>{ if(e.target.files[0]) fromFile(e.target.files[0]); e.target.value=""; });
}
wireAdd("btn-camera","file-camera");
wireAdd("btn-gallery","file-gallery");

$("btn-save").addEventListener("click", saveLabel);
$("label-input").addEventListener("keydown", e=>{ if(e.key==="Enter") saveLabel(); });
$("btn-cancel").addEventListener("click", ()=>{ pendingData=null; editingId=null; show("s-home"); });
$("btn-delete").addEventListener("click", ()=>{ photos=photos.filter(p=>p.id!==editingId); editingId=null; save(); hush(); renderBoard(); show("s-home"); });

$("btn-play").addEventListener("click", startGame);
$("play-quit").addEventListener("click", ()=>{ stopGame(); show("s-home"); });
$("mute").addEventListener("click", ()=>{ soundOn=!soundOn; $("mute").textContent = soundOn?"🔊":"🔇"; if(soundOn) sfx.tap(); });

function segWire(id, apply){
  $(id).addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    $(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
    apply(Number(b.dataset.v)); sfx.tap();
  });
}
segWire("seg-pieces", v=>gridN=v);
segWire("seg-speed",  v=>stepMs=v);
segWire("seg-twist",  v=>twistLevel=v);

load();
</script>
