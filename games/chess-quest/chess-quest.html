<html lang="en-GB">

<title>Chess Quest</title>
<!--
  Classic pieces: Chess_[klt]45.svg and friends by Colin M.L. Burnett (Cburnett),

  The other three piece styles, the owl and the sounds are drawn and
  synthesised in this file.
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1e2a4a;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: #fff;
  }
  button { font: inherit; color: inherit; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; touch-action: manipulation; }
  #app { position: fixed; inset: 0; }
  .screen { position: absolute; inset: 0; }
  .hidden { display: none !important; }

  /* ---------- map ---------- */
  #map { overflow-y: auto; overflow-x: hidden; background: linear-gradient(#2b3d78, #1e2a4a 70%); padding: 14px 12px 90px; -webkit-overflow-scrolling: touch; }
  .world { max-width: 780px; margin: 0 auto 22px; border-radius: 30px; padding: 16px 10px 22px; position: relative; box-shadow: inset 0 0 0 4px rgba(255,255,255,0.18); }
  .wemblem { display: flex; justify-content: center; gap: 4px; height: clamp(46px, 11vw, 70px); margin-bottom: 8px; }
  .wemblem svg { height: 100%; aspect-ratio: 1; }
  .nodes { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 16px; }
  .node { position: relative; width: clamp(88px, 22vw, 122px); aspect-ratio: 1; border-radius: 50%; background: #fff8e8; box-shadow: 0 7px 0 rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; transition: transform .15s; }
  .node:active { transform: scale(0.94); }
  .node svg.ic { width: 76%; height: 76%; overflow: visible; }
  .node.locked { background: #5b6486; box-shadow: 0 5px 0 rgba(0,0,0,0.25); }
  .node.locked svg.ic { opacity: 0.28; filter: grayscale(1); }
  .node .lockic { position: absolute; width: 38%; height: 38%; right: -2%; bottom: -2%; }
  .node.done { box-shadow: 0 0 0 5px #f2b134, 0 7px 0 rgba(0,0,0,0.25); }
  .node.now { animation: nodeNow 1.2s ease-in-out infinite; box-shadow: 0 0 0 6px #fff, 0 0 22px 8px rgba(255,235,150,0.8), 0 7px 0 rgba(0,0,0,0.25); }
  .node .nst { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); display: flex; gap: 1px; }
  .node .nst svg { width: 24px; height: 24px; }
  #mapOwl { position: absolute; width: 58%; right: -22%; top: -42%; pointer-events: none; z-index: 2; }
  #gear { position: fixed; right: 10px; bottom: 10px; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; z-index: 5; }
  #gear svg { width: 62%; height: 62%; opacity: 0.7; }

  /* ---------- play ---------- */
  #play { display: flex; flex-direction: column; background: var(--bg, #2d4a7a); transition: background .4s; }
  #top { flex: none; height: 62px; display: flex; align-items: center; gap: 10px; padding: 8px 10px 0; }
  .rb { width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; flex: none; }
  .rb:active { transform: scale(0.94); }
  .rb svg { width: 66%; height: 66%; }
  #dots { flex: 1; display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.22); transition: background .3s, transform .3s; }
  .dot.now { box-shadow: 0 0 0 3px rgba(255,255,255,0.7); }
  .dot.g { background: #f2b134; transform: scale(1.12); }
  .dot.s { background: #d4dbea; transform: scale(1.12); }
  #main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 4px 10px 10px; }
  #boardWrap { --bs: min(calc(100dvh - 82px), calc(100dvw - 320px)); width: var(--bs); height: var(--bs); flex: none; }
  #board { width: 100%; height: 100%; display: block; overflow: visible; }
  #board .sq { cursor: pointer; }
  #panel { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #owlBox { flex: none; width: clamp(84px, 15vmin, 150px); }
  #owlBox svg { width: 100%; display: block; overflow: visible; }
  #stuff { flex: 1; min-height: 0; min-width: 0; width: 100%; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #prompt { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; min-height: 10px; }
  #choices { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-content: center; }
  #choices.grid { display: grid; }
  @media (orientation: portrait) {
    #boardWrap { --bs: min(calc(100dvw - 16px), calc(100dvh - 62px - 190px)); }
    #main { flex-direction: column; }
    #panel { height: auto; flex: none; flex-direction: row; width: 100%; min-height: 150px; }
    #stuff { height: 100%; }
  }
  /* rounds with no board: the panel takes the whole play area */
  #play.nobd #boardWrap { display: none; }
  #play.nobd #main { align-items: stretch; }
  #play.nobd #panel { flex: 1 1 0; height: auto; width: 100%; min-height: 0; }
  @media (orientation: landscape) { #play.nobd #panel { flex-direction: row; } #play.nobd #owlBox { width: clamp(80px, 14vmin, 130px); } }
  @media (orientation: portrait) { #play.nobd #panel { flex-direction: column; min-height: 0; } #play.nobd #owlBox { width: clamp(70px, 11vh, 120px); } }

  .word { font-size: clamp(30px, 8vmin, 72px); font-weight: 800; letter-spacing: 0.02em; text-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  .word.ask { font-size: clamp(24px, 5.5vmin, 46px); }
  .chip { min-width: clamp(54px, 10vmin, 90px); height: clamp(54px, 10vmin, 90px); padding: 0 12px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: clamp(34px, 7.5vmin, 64px); font-weight: 800; box-shadow: 0 5px 0 rgba(0,0,0,0.25); }
  .chip.f { background: #4aa3ff; } .chip.r { background: #ff9b3d; } .chip.x { background: #fff7e6; color: #3a3560; }
  .say { width: clamp(54px, 10vmin, 84px); height: clamp(54px, 10vmin, 84px); border-radius: 50%; background: #fff7e6; box-shadow: 0 5px 0 rgba(0,0,0,0.25); display: inline-flex; align-items: center; justify-content: center; }
  .say svg { width: 60%; height: 60%; }
  .say:active { transform: scale(0.94); }

  .card { position: relative; width: var(--cs, 120px); height: var(--cs, 120px); flex: none; border-radius: 22px; background: #b4c0e6; box-shadow: 0 6px 0 rgba(0,0,0,0.22); display: flex; align-items: center; justify-content: center; transition: transform .15s, opacity .3s; }
  .card:active { transform: scale(0.96); }
  .card svg.pv { width: 90%; height: 90%; overflow: visible; transform-origin: 50% 88%; }
  .card .lbl { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-weight: 800; font-size: calc(var(--cs, 120px) * 0.14); color: #1e2350; text-shadow: 0 0 6px #fff, 0 0 3px #fff; opacity: 0; transition: opacity .3s; }
  .card.heard .lbl { opacity: 1; }
  .card.good { animation: goodPop .6s ease both; box-shadow: 0 0 0 7px #5fd16a, 0 6px 0 rgba(0,0,0,0.2); }
  .card.bad { animation: shake .4s; opacity: 0.32; pointer-events: none; }
  .card.hint { animation: hintPulse 0.9s ease-in-out infinite; }
  .card.sel { transform: translateY(-8px) scale(1.06); box-shadow: 0 0 0 7px #ffd24d, 0 10px 0 rgba(0,0,0,0.2); }
  .card.gone { opacity: 0; transform: scale(0.4); pointer-events: none; transition: opacity .4s, transform .4s; }
  .card.dark { background: #b4c0e6; }
  .wordbtn { min-width: clamp(110px, 24vmin, 220px); padding: 0.35em 0.7em; border-radius: 22px; background: #fff7e6; color: #3a3560; font-size: clamp(26px, 6.2vmin, 54px); font-weight: 800; box-shadow: 0 6px 0 rgba(0,0,0,0.22); transition: opacity .3s; }
  .wordbtn:active { transform: scale(0.96); }
  .wordbtn.good { background: #b8f0be; animation: goodPop .6s ease both; }
  .wordbtn.bad { animation: shake .4s; opacity: 0.32; pointer-events: none; }
  .wordbtn.hint { animation: hintPulse 0.9s ease-in-out infinite; }
  .big { width: var(--cs, 220px); height: var(--cs, 220px); }
  .tray { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .tray .card { position: relative; }
  .badge { position: absolute; right: -6px; top: -8px; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; background: #ff6b6b; color: #fff; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .rot { width: clamp(64px, 12vmin, 100px); height: clamp(64px, 12vmin, 100px); border-radius: 50%; background: #fff7e6; box-shadow: 0 6px 0 rgba(0,0,0,0.22); display: inline-flex; align-items: center; justify-content: center; }
  .rot svg { width: 64%; height: 64%; }
  .rot:active { transform: scale(0.94); }
  .cert { background: #fff7e6; color: #3a3560; border-radius: 28px; padding: clamp(14px, 3vmin, 30px); text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,0.25), 0 0 0 8px #f2b134; max-width: 92%; }
  .cert .cn { font-size: clamp(30px, 8vmin, 70px); font-weight: 800; }
  .cert .cs { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
  .cert .cs svg { width: clamp(28px, 7vmin, 56px); height: clamp(28px, 7vmin, 56px); }

  /* piece cards: each piece acts out who it is */
  .act-k .pv { animation: aK 1.3s ease-in-out; } .act-q .pv { animation: aQ 1.1s ease-in-out; }
  .act-r .pv { animation: aR 0.9s ease-in-out; } .act-b .pv { animation: aB 1.1s ease-in-out; }
  .act-n .pv { animation: aN 0.9s ease-in-out; } .act-p .pv { animation: aP 0.6s ease-in-out; }
  @keyframes aK { 0%,100% { transform: none; } 35% { transform: translateY(6%) scale(1.05,0.94); } 70% { transform: translateY(-3%) scale(1.04); } }
  @keyframes aQ { 0% { transform: none; } 50% { transform: scaleX(-1) scale(1.08); } 100% { transform: scaleX(1); } }
  @keyframes aR { 0%,100% { transform: none; } 20% { transform: translateY(-6%); } 35% { transform: translateY(0) scale(1.06,0.92); } 55% { transform: translateY(-4%); } 70% { transform: scale(1.05,0.94); } }
  @keyframes aB { 0%,100% { transform: none; } 25% { transform: translate(8%,-4%) rotate(8deg); } 75% { transform: translate(-8%,-4%) rotate(-8deg); } }
  @keyframes aN { 0%,100% { transform: none; } 30% { transform: translate(6%,-26%) rotate(10deg); } 55% { transform: translate(12%,0) rotate(0); } 75% { transform: translate(0,-12%) rotate(-6deg); } }
  @keyframes aP { 0%,100% { transform: none; } 40% { transform: translateY(-16%); } 70% { transform: scale(1.06,0.92); } }
  @keyframes goodPop { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1.05); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  @keyframes hintPulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,236,120,0.9), 0 6px 0 rgba(0,0,0,0.22); } 50% { transform: scale(1.07); box-shadow: 0 0 0 10px rgba(255,236,120,0.55), 0 6px 0 rgba(0,0,0,0.22); } }
  @keyframes nodeNow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* board bits */
  .pbob { animation: pbob 0.9s ease-in-out infinite; }
  @keyframes pbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .pglow { animation: pglow 0.8s ease-in-out infinite; }
  @keyframes pglow { 0%,100% { opacity: 0.35; } 50% { opacity: 0.95; } }
  .starpulse { animation: starpulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes starpulse { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.15) rotate(4deg); } }
  .shk { animation: shake .4s; }

  /* owl */
  .o-all { transform-box: fill-box; transform-origin: 50% 100%; }
  .o-wl, .o-wr { transform-box: fill-box; transform-origin: 50% 10%; }
  .o-blink { transform: scaleY(0); transform-box: fill-box; transform-origin: 50% 0%; animation: oBlink 4.5s infinite; }
  svg.cheer .o-all { animation: oHop .55s ease-in-out 2; }
  svg.cheer .o-wl { animation: oFlapL .28s ease-in-out 4; } svg.cheer .o-wr { animation: oFlapR .28s ease-in-out 4; }
  svg.oops .o-all { animation: oTilt .9s ease-in-out; }
  svg.talk .o-beak { animation: oTalk .22s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
  svg.idle .o-all { animation: oIdle 3.2s ease-in-out infinite; }
  @keyframes oBlink { 0%,92%,100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }
  @keyframes oHop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16%); } }
  @keyframes oFlapL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(28deg); } }
  @keyframes oFlapR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-28deg); } }
  @keyframes oTilt { 0%,100% { transform: rotate(0); } 30%,70% { transform: rotate(-11deg); } }
  @keyframes oTalk { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
  @keyframes oIdle { 0%,100% { transform: rotate(0); } 50% { transform: rotate(2deg); } }

  /* finished stage */
  #done { background: rgba(20,26,56,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 8; }
  #dstars { display: flex; gap: 10px; }
  #dstars svg { width: clamp(70px, 18vmin, 150px); height: clamp(70px, 18vmin, 150px); }
  #dstars svg.pop { animation: starIn .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes starIn { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
  #dowl { width: clamp(100px, 22vmin, 190px); }
  #dowl svg { width: 100%; overflow: visible; display: block; }
  #dbtns { display: flex; gap: 22px; }
  #dbtns .rb { width: clamp(70px, 14vmin, 110px); height: clamp(70px, 14vmin, 110px); border-radius: 50%; background: #fff7e6; box-shadow: 0 6px 0 rgba(0,0,0,0.3); }
  #dbtns .rb.main { background: #5fd16a; }

  /* parent controls */
  #parent { background: rgba(10,14,34,0.96); z-index: 9; overflow-y: auto; padding: 18px; }
  #parent .box { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  #parent h3 { margin: 6px 0 0; font-size: 20px; }
  #parent label, #parent .row { display: flex; align-items: center; gap: 10px; font-size: 18px; }
  #parent input[type=text] { font: inherit; font-size: 20px; padding: 8px 12px; border-radius: 10px; border: 0; width: 100%; max-width: 280px; }
  #parent .pb2 { padding: 12px 16px; border-radius: 12px; background: #3b4a82; font-size: 18px; font-weight: 700; }
  #parent .pb2.on { background: #3a9d4d; }
  #parent .pb2.danger { background: #a63a3a; }
  #parent small { opacity: 0.6; line-height: 1.4; }
  #fx { pointer-events: none; z-index: 20; width: 100%; height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; }
    .node.now { animation: none; }
  }
</style>

<script>
// Full screen on the first touch, and a way back if it is off.
//
// A browser will not do this by itself: the request has to come out of a
// gesture the browser counts as user activation, and that list is fussier
// than it looks. pointerdown only counts when the pointer is a mouse - on
// a touchscreen it grants nothing at all, which is why listening for it
// worked on a laptop and did nothing whatever on a tablet. For a finger it
// is pointerup and touchend that count.
//
// Once full screen is on, the automatic asking stops, so leaving it stays
// left. But leaving it used to mean reloading to get it back, so there is
// now a small button at the top of the screen that is only there while
// full screen is off, and takes itself away the moment it is on.
//
// An iPhone ignores the lot, because Safari there gives full screen to
// video and nothing else, so no button is offered. That is what the home
// screen tags above are for.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#40563a" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

  <div id="play" class="screen hidden">
    <div id="top">
      <button class="rb" id="homeBtn" aria-label="Home"><svg viewBox="0 0 40 40"><path d="M6 20 L20 7 L34 20 M10 18 V33 H17 V24 H23 V33 H30 V18" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="dots"></div>
      <button class="rb" id="sayBtn" aria-label="Say it again"><svg viewBox="0 0 40 40"><path d="M7 15 H13 L21 8 V32 L13 25 H7 Z" fill="#fff"/><path d="M26 14 Q31 20 26 26 M29 10 Q37 20 29 30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
    </div>
    <div id="main">
      <div id="boardWrap">
        <svg id="board" viewBox="0 0 880 880" xmlns="http://www.w3.org/2000/svg" aria-label="Chess board">
          <g id="bRoot">
            <rect x="26" y="6" width="828" height="828" rx="14" fill="#3b2a1c" id="bFrame"/>
            <g id="bSq"></g><g id="bCo"></g><g id="bHi"></g><g id="bGh"></g><g id="bPc"></g><g id="bFx"></g>
          </g>
        </svg>
      </div>
      <div id="panel">
        <div id="owlBox">
          <svg id="owl" class="idle" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" aria-label="Hoot the owl">
            <g class="o-all">
              <ellipse cx="38" cy="124" rx="12" ry="5" fill="#f08a24"/><ellipse cx="82" cy="124" rx="12" ry="5" fill="#f08a24"/>
              <g class="o-wl"><ellipse cx="20" cy="82" rx="12" ry="28" fill="#7d5230"/></g>
              <g class="o-wr"><ellipse cx="100" cy="82" rx="12" ry="28" fill="#7d5230"/></g>
              <ellipse cx="60" cy="82" rx="40" ry="42" fill="#9a6a3f"/>
              <ellipse cx="60" cy="92" rx="27" ry="31" fill="#f2dcb4"/>
              <path d="M44 84 q6 5 12 0 M64 84 q6 5 12 0 M50 100 q6 5 12 0 M66 100 q6 5 12 0 M56 114 q6 5 12 0" fill="none" stroke="#d6b27a" stroke-width="3" stroke-linecap="round"/>
              <path d="M26 46 L20 14 L50 34 Z" fill="#7d5230"/><path d="M94 46 L100 14 L70 34 Z" fill="#7d5230"/>

function buildDefs() {
  var out = '', si, ci, ti, key, set, c, t, inner;
  for (si = 0; si < SETS.length; si++) {
    set = SETS[si].id;
    for (ci = 0; ci < 2; ci++) {
      c = ci ? 'b' : 'w';
      for (ti = 0; ti < 6; ti++) {
        t = ORDER.charAt(ti);
        if (set === 'classic') {
          out += '<symbol id="pc-classic-' + c + t + '" viewBox="0 0 45 45">' + CLASSIC[c + t] + '</symbol>';
        } else {
          out += '<symbol id="pc-' + set + '-' + c + t + '" viewBox="0 0 100 100" overflow="visible">' + DRAW[set](t, PAL[c]) + '</symbol>';
        }
      }
    }
  }
  document.getElementById('defs').innerHTML = out;
}

// =====================================================================
//  Sound. Everything is synthesised, so the game is never silent, and
//  the names of the pieces are spoken by the device when it can. A game
//  that cannot speak plays the piece's own little tune instead.
// =====================================================================
var CFG = { name: '', style: 'auto', sound: true, speech: true, stages: {} };
var AC = null, voices = 0, lastAt = {};

function loadCfg() {
  var s, k;
  try {
    s = JSON.parse(localStorage.getItem('chessQuest1'));
    if (s && typeof s === 'object') { for (k in s) { if (k in CFG) { CFG[k] = s[k]; } } }
  } catch (e) { /* no storage: start fresh each time */ }
  if (!CFG.stages || typeof CFG.stages !== 'object') { CFG.stages = {}; }
}
function saveCfg() { try { localStorage.setItem('chessQuest1', JSON.stringify(CFG)); } catch (e) { /* ignore */ } }

function actx() {
  if (AC === null) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; }
  }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e2) { /* ignore */ } }
  return AC;
}
// one sound of each kind at a time, however hard the screen is bashed
function gate(key, ms) {
  var now = Date.now();
  if (lastAt[key] && now - lastAt[key] < ms) { return false; }
  lastAt[key] = now; return true;
}
function tone(f, d, type, v, delay, slide) {
  var a = actx(), t, o, g;
  if (!a || CFG.sound === false || voices > 9) { return; }
  t = a.currentTime + (delay || 0);
  o = a.createOscillator(); g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (slide) { o.frequency.exponentialRampToValueAtTime(slide, t + d); }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v || 0.16, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + d + 0.05);
  voices++; o.onended = function () { voices--; };
}
function noise(d, v, delay, fc) {
  var a = actx(), t, n, buf, data, i, src, g, f;
  if (!a || CFG.sound === false || voices > 9) { return; }
  t = a.currentTime + (delay || 0);
  n = Math.max(1, Math.floor(a.sampleRate * d));
  buf = a.createBuffer(1, n, a.sampleRate); data = buf.getChannelData(0);
  for (i = 0; i < n; i++) { data[i] = (Math.random() * 2 - 1) * (1 - i / n); }
  src = a.createBufferSource(); src.buffer = buf;
  f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 1800;
  g = a.createGain(); g.gain.value = v || 0.2;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t); voices++; src.onended = function () { voices--; };
}

function motif(t) {
  if (!gate('m' + t, 140)) { return; }
  switch (t) {
    case 'k': tone(147, 0.7, 'sine', 0.22); tone(220, 0.8, 'sine', 0.16, 0.18); tone(110, 0.9, 'triangle', 0.12); break;
    case 'q': tone(523, 0.18, 'triangle', 0.14); tone(659, 0.18, 'triangle', 0.14, 0.12); tone(784, 0.18, 'triangle', 0.14, 0.24); tone(1047, 0.4, 'triangle', 0.14, 0.36); break;
