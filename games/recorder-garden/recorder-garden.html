<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7fc3e8">
<title>Recorder Garden</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #7fc3e8;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    display: block;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
  }
  .hit { fill: transparent; cursor: pointer; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" aria-label="Recorder Garden">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57a4dc"/>
      <stop offset="0.6" stop-color="#a7dbf2"/>
      <stop offset="1" stop-color="#dff2dd"/>
    </linearGradient>
    <linearGradient id="hill0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3daa0"/><stop offset="1" stop-color="#94c882"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96cf7c"/><stop offset="1" stop-color="#74b664"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc069"/><stop offset="1" stop-color="#4f9a4b"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d6f39"/><stop offset="0.45" stop-color="#d3a163"/><stop offset="1" stop-color="#8c6029"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8262f"/>
      <stop offset="0.3" stop-color="#ef6f78"/>
      <stop offset="0.62" stop-color="#d43d49"/>
      <stop offset="1" stop-color="#8e1f27"/>
    </linearGradient>
    <radialGradient id="sung" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffeaa6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffeaa6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff3b4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff3b4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="sky"></g>
  <g id="hills"></g>
  <g id="garden"></g>
  <g id="signs"></g>
  <g id="friends"></g>
  <g id="flowers"></g>
  <g id="effects"></g>
  <g id="hits"></g>
  <g id="ui"></g>
</svg>

<script>
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('stage');

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function el(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) { for (var k in attrs) { n.setAttribute(k, attrs[k]); } }
    return n;
  }
  function clear(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function G(id) { return document.getElementById(id); }

  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = reduceQuery.matches;
  if (reduceQuery.addEventListener) {
    reduceQuery.addEventListener('change', function (e) { reduced = e.matches; });
  }

  // ------------------------------------------------------------------
  // The three notes.
  //
  // A soprano recorder sounds an octave above what is written, so the B,
  // A and G in her book reach the microphone as B5, A5 and G5. These are
  // the first three fingerings every beginner learns, and they are the
  // same on baroque and german instruments, so hers is right either way:
  // left thumb behind, then one, two, three fingers down the front.
  //
  // Highest note sits highest on the hill. Nobody has to be told that.
  // ------------------------------------------------------------------
  var SPECS = [
    { id: 'B', midi: 83, holes: 1, animal: 'bird',   colour: '#f2c141', dark: '#d69c1c', petal: '#ffd45c', top: 182 },
    { id: 'A', midi: 81, holes: 2, animal: 'rabbit', colour: '#cbb4a3', dark: '#a08675', petal: '#f58aa6', top: 240 },
    { id: 'G', midi: 79, holes: 3, animal: 'badger', colour: '#8d959e', dark: '#585f68', petal: '#a982e0', top: 176 }
  ];

  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  // ------------------------------------------------------------------
  // Audio, synthesised from nothing so the garden is never silent and
  // never waits on a download.
  // ------------------------------------------------------------------
  var AC = null, master = null, noiseBuf = null;

  // Everything the garden says is heard straight back by the microphone,
  // because echo cancellation is turned off on purpose. So the listener
  // is deaf until this moment passes.
  var speakUntil = 0;

  function initAudio() {
    if (AC) { if (AC.state === 'suspended') { AC.resume(); } return; }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { return; }
    AC = new Ctx();
    var comp = AC.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-14, AC.currentTime);
    comp.ratio.setValueAtTime(5, AC.currentTime);
    comp.attack.setValueAtTime(0.005, AC.currentTime);
    comp.release.setValueAtTime(0.2, AC.currentTime);
    master = AC.createGain();
    master.gain.setValueAtTime(0.6, AC.currentTime);
    master.connect(comp);
    comp.connect(AC.destination);

    var n = Math.floor(AC.sampleRate * 0.5);
    noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) { d[i] = Math.random() * 2 - 1; }
    if (AC.state === 'suspended') { AC.resume(); }
  }

  function held(t, dur) { if (t + dur > speakUntil) { speakUntil = t + dur; } }

  // A recorder is very nearly a sine wave with a breathy edge, a chiff at
  // the start and a vibrato that only arrives once the note has settled.
  // That is the whole instrument.
  function recorderNote(delay, f, dur, vol) {
    if (!AC) { return; }
    var t = AC.currentTime + (delay || 0);
    dur = Math.max(0.35, dur);
    vol = vol == null ? 0.4 : vol;

    var g = AC.createGain();
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(Math.min(11000, f * 7), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.04);
    g.gain.setValueAtTime(vol, t + dur - 0.11);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    lp.connect(g); g.connect(master);

    var vib = AC.createOscillator();
    vib.type = 'sine';
    vib.frequency.setValueAtTime(4.9, t);
    vib.start(t); vib.stop(t + dur + 0.05);

    [[1, 1], [2, 0.13], [3, 0.045], [4, 0.018]].forEach(function (p) {
      var o = AC.createOscillator(), og = AC.createGain(), vg = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * p[0], t);
      og.gain.setValueAtTime(p[1], t);
      vg.gain.setValueAtTime(0, t);
      vg.gain.setValueAtTime(0, t + Math.min(0.3, dur * 0.45));
      vg.gain.linearRampToValueAtTime(f * p[0] * 0.005, t + dur);
      vib.connect(vg); vg.connect(o.frequency);
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + dur + 0.05);
    });

    var src = AC.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.setValueAtTime(0.8, t);
    bp.frequency.setValueAtTime(f * 2.2, t);
    var ng = AC.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(vol * 0.3, t + 0.014);
    ng.gain.exponentialRampToValueAtTime(vol * 0.055, t + 0.1);
    ng.gain.setValueAtTime(vol * 0.055, t + dur - 0.09);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(ng); ng.connect(master);
    src.start(t); src.stop(t + dur + 0.05);

    held(t, dur + 0.22);
  }

  function bell(delay, f, vol, dur) {
    if (!AC) { return; }
    var t = AC.currentTime + (delay || 0);
    dur = dur || 0.5;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.28, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
    held(t, dur + 0.12);
  }

  function sparkleSound() {
    [0, 4, 7, 12, 16, 19].forEach(function (s, i) {
      bell(0.02 + i * 0.07, 523.25 * Math.pow(2, s / 12), 0.2, 0.6);
    });
  }

  function arriveSound() {
    [0, 4, 7, 12].forEach(function (s, i) {
      bell(0.02 + i * 0.12, 392 * Math.pow(2, s / 12), 0.26, 0.75);
    });
  }

  // Blowing too hard is not a mistake, it is a joke. This is the laugh.
  function giggle() {
    if (!AC) { return; }
    var t = AC.currentTime + 0.01;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(760, t);
    for (var i = 0; i < 7; i++) {
      o.frequency.setValueAtTime(i % 2 ? 540 : 780, t + i * 0.065);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.26, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.55);
    held(t, 0.6);
  }

  // ------------------------------------------------------------------
  // The ears.
  //
  // getUserMedia normally hands back a stream cleaned up for speech, and
  // every one of those cleanups is aimed squarely at a steady quiet tone:
  // noise suppression deletes a recorder outright, automatic gain hides
  // how hard she is blowing, and echo cancellation strips the garden's
  // own replies and takes her note out with them. All three are refused.
  // ------------------------------------------------------------------
  var MIC = {
    state: 'off',       // off | asking | on | blocked
    stream: null, src: null, analyser: null, buf: null, nsdf: null,
    level: 0, smooth: 0, note: null, cents: 0, octave: false,
    clarity: 0, pitch: 0, anyPitch: false
  };

  function micPossible() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }

  function startMic() {
    if (!AC) { return; }
    if (MIC.state === 'on' || MIC.state === 'asking') { return; }
    if (!micPossible()) { MIC.state = 'blocked'; drawUI(); return; }
    MIC.state = 'asking';
    drawUI();
    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
        channelCount: 1
      }
    }).then(function (stream) {
      MIC.stream = stream;
      MIC.src = AC.createMediaStreamSource(stream);
      // The instrument cannot go below C5, so everything under 340 Hz is
      // room rumble, chair legs and voices. Throwing it away first makes
      // the pitch tracker far steadier.
      var hp = AC.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.setValueAtTime(340, AC.currentTime);
      var an = AC.createAnalyser();
      an.fftSize = 2048;
      an.smoothingTimeConstant = 0;
      MIC.src.connect(hp); hp.connect(an);
      MIC.analyser = an;
      MIC.buf = new Float32Array(an.fftSize);
      MIC.nsdf = new Float32Array(Math.floor(AC.sampleRate / 300) + 4);
      MIC.state = 'on';
      drawUI();
    })['catch'](function () {
      MIC.state = 'blocked';
      drawUI();
    });
  }

  function stopMic() {
    if (MIC.stream) {
      MIC.stream.getTracks().forEach(function (tr) { tr.stop(); });
    }
    if (MIC.src) { try { MIC.src.disconnect(); } catch (e) {} }
    MIC.stream = null; MIC.src = null; MIC.analyser = null;
    MIC.state = 'off'; MIC.level = 0; MIC.smooth = 0; MIC.note = null;
    drawUI();
  }

  // Normalised square difference: autocorrelation with the loud bits
  // divided out, so a timid note scores as well as a confident one.
  function listen() {
    MIC.note = null;
    MIC.anyPitch = false;
    if (MIC.state !== 'on' || !MIC.analyser) { MIC.level = 0; return; }

    var an = MIC.analyser, buf = MIC.buf, n = buf.length, i;
    an.getFloatTimeDomainData(buf);

    var mean = 0;
    for (i = 0; i < n; i++) { mean += buf[i]; }
    mean /= n;
    var sq = 0;
    for (i = 0; i < n; i++) { buf[i] -= mean; sq += buf[i] * buf[i]; }
    MIC.level = Math.sqrt(sq / n);

    if (AC.currentTime < speakUntil) { return; }
    if (MIC.level < 0.007) { return; }

    var sr = AC.sampleRate;
    var minLag = Math.max(2, Math.floor(sr / 2300));
    var maxLag = Math.min(MIC.nsdf.length - 2, Math.floor(sr / 380));
    var W = Math.min(1024, n - maxLag);
    var nsdf = MIC.nsdf, lag, best = 0, a, b, r, m, v;

    for (lag = minLag; lag <= maxLag; lag++) {
      r = 0; m = 0;
      for (i = 0; i < W; i++) {
        a = buf[i]; b = buf[i + lag];
        r += a * b;
        m += a * a + b * b;
      }
      v = m > 1e-9 ? (2 * r / m) : 0;
      nsdf[lag] = v;
      if (v > best) { best = v; }
    }
    MIC.clarity = best;
    if (best < 0.55) { return; }

    // The first peak that is nearly as good as the best one, rather than
    // the best one itself. That is what stops a clean note being heard an
    // octave too low.
    var pick = -1, thresh = best * 0.9;
    for (lag = minLag + 1; lag < maxLag; lag++) {
      if (nsdf[lag] > thresh && nsdf[lag] >= nsdf[lag - 1] && nsdf[lag] > nsdf[lag + 1]) { pick = lag; break; }
    }
    if (pick < 0) { return; }

    var y0 = nsdf[pick - 1], y1 = nsdf[pick], y2 = nsdf[pick + 1];
    var den = y0 - 2 * y1 + y2;
    var off = den !== 0 ? clamp(0.5 * (y0 - y2) / den, -1, 1) : 0;
    MIC.pitch = sr / (pick + off);
    MIC.anyPitch = true;

    // Nearest of the three she is learning, in either octave. Being a
    // whole tone apart, they stay told apart even when she is badly out
    // of tune, which at five she reliably is.
    var midi = 69 + 12 * Math.log(MIC.pitch / 440) / Math.LN2;
    var hit = null, err = 99, oct = false, cents = 0, e1, e2;
    for (i = 0; i < SPECS.length; i++) {
      e1 = midi - SPECS[i].midi;
      e2 = midi - (SPECS[i].midi + 12);
      if (Math.abs(e1) < err) { err = Math.abs(e1); hit = SPECS[i]; oct = false; cents = e1 * 100; }
      if (Math.abs(e2) < err) { err = Math.abs(e2); hit = SPECS[i]; oct = true; cents = e2 * 100; }
    }
    if (!hit || err > 0.8) { return; }
    MIC.note = hit.id;
    MIC.cents = cents;
    MIC.octave = oct;
  }

  // How long the same note has run, how still it has sat, how softly it
  // was blown. None of these can fail; they only change how fast a
  // flower opens.
  var hold = { note: null, time: 0, hist: [], steady: 1, gentle: 1, shrill: false };

  function updateHold(dt) {
    if (!MIC.note) {
      hold.note = null; hold.time = 0; hold.hist.length = 0; hold.shrill = false;
      return;
    }
    if (MIC.note !== hold.note) {
      hold.note = MIC.note; hold.time = 0; hold.hist.length = 0;
    }
    hold.time += dt;
    hold.hist.push(MIC.cents);
    if (hold.hist.length > 20) { hold.hist.shift(); }

    var i, mu = 0, d, vr = 0, L = hold.hist.length;
    for (i = 0; i < L; i++) { mu += hold.hist[i]; }
    mu /= L;
    for (i = 0; i < L; i++) { d = hold.hist[i] - mu; vr += d * d; }
    hold.steady = clamp(1 - Math.sqrt(vr / L) / 45, 0, 1);

    var l = MIC.level;
    hold.gentle = l < 0.02 ? clamp(l / 0.02, 0, 1)
      : (l <= 0.17 ? 1 : clamp(1 - (l - 0.17) / 0.28, 0.2, 1));
    hold.shrill = MIC.octave || l > 0.36;
  }

  // A good note fills a flower in about four and a half seconds. A rough
  // one takes nearer twelve. Neither ever empties it again.
  function growthRate() {
    return (1 / 4.5) * (0.55 + 0.45 * hold.steady) * (0.65 + 0.35 * hold.gentle);
  }

  // ------------------------------------------------------------------
  // Drawing. Every friend stands with its feet on y = 0 and everything
  // else above it, so a friend can be dropped anywhere on the hill.
  // ------------------------------------------------------------------
  function eyePair(cx, cy, sp, r, pr) {
    var s = '<g class="eyes">';
    [-1, 1].forEach(function (d) {
      var ex = cx + sp * d;
      s += '<ellipse cx="' + ex + '" cy="' + cy + '" rx="' + r + '" ry="' + r + '" fill="#ffffff"/>'
        + '<g class="look">'
        + '<circle cx="' + ex + '" cy="' + (cy + 1) + '" r="' + pr + '" fill="#23212f"/>'
        + '<circle cx="' + (ex + pr * 0.36) + '" cy="' + (cy - pr * 0.48) + '" r="' + (pr * 0.33) + '" fill="#ffffff"/>'
        + '</g>';
    });
    return s + '</g>';
  }

  function mouthG(cx, cy, rest, inner) {
    return '<g class="mouth" data-cx="' + cx + '" data-cy="' + cy + '" data-rest="' + rest + '">'
      + inner + '</g>';
  }

  // Paws that come up over the ears when she blows too hard. Drawn now,
  // hidden until they are wanted.
  function paws(x, y, r, fill) {
    return '<g class="paws" opacity="0">'
      + '<circle cx="' + (-x) + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"/>'
      + '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"/>'
      + '</g>';
  }

  var ART = {};

  ART.bird = function (s) {
    return '<g class="legs">'
      + '<rect x="-25" y="-22" width="8" height="24" rx="4" fill="#e0912c"/>'
      + '<rect x="17" y="-22" width="8" height="24" rx="4" fill="#e0912c"/>'
      + '<path d="M -33 0 h 24 M 9 0 h 24" stroke="#e0912c" stroke-width="7" stroke-linecap="round"/>'
      + '</g>'
      + '<g class="wing" data-side="-1"><ellipse cx="-50" cy="-74" rx="19" ry="33" fill="' + s.dark + '"/></g>'
      + '<g class="wing" data-side="1"><ellipse cx="50" cy="-74" rx="19" ry="33" fill="' + s.dark + '"/></g>'
      + '<ellipse cx="0" cy="-68" rx="56" ry="52" fill="' + s.colour + '"/>'
      + '<ellipse cx="0" cy="-54" rx="32" ry="30" fill="#fff4cd"/>'
      + '<circle cx="0" cy="-126" r="40" fill="' + s.colour + '"/>'
      + '<path d="M -12 -164 q 12 -22 28 -12" stroke="' + s.dark + '" stroke-width="8" fill="none" stroke-linecap="round"/>'
      + eyePair(0, -134, 19, 13, 8)
      + mouthG(0, -108, 0.45, '<path d="M -17 -108 L 17 -108 L 0 -86 Z" fill="#cf7c22"/>'
        + '<path d="M -17 -108 L 17 -108 L 0 -130 Z" fill="#f0a63c"/>')
      + paws(34, -132, 19, s.dark);
  };

  ART.rabbit = function (s) {
    return '<g class="legs">'
      + '<rect x="-48" y="-28" width="28" height="30" rx="14" fill="' + s.dark + '"/>'
      + '<rect x="20" y="-28" width="28" height="30" rx="14" fill="' + s.dark + '"/>'
      + '</g>'
      + '<ellipse cx="0" cy="-66" rx="58" ry="56" fill="' + s.colour + '"/>'
      + '<ellipse cx="0" cy="-50" rx="32" ry="32" fill="#f8efe4"/>'
      + '<g class="ear" data-side="-1">'
      + '<ellipse cx="-25" cy="-184" rx="15" ry="46" fill="' + s.colour + '"/>'
      + '<ellipse cx="-25" cy="-184" rx="7" ry="32" fill="#efbfc6"/></g>'
      + '<g class="ear" data-side="1">'
      + '<ellipse cx="25" cy="-184" rx="15" ry="46" fill="' + s.colour + '"/>'
      + '<ellipse cx="25" cy="-184" rx="7" ry="32" fill="#efbfc6"/></g>'
      + '<circle cx="0" cy="-134" r="43" fill="' + s.colour + '"/>'
      + eyePair(0, -142, 20, 13, 8)
      + '<ellipse cx="0" cy="-118" rx="9" ry="7" fill="#d98a94"/>'
      + mouthG(0, -104, 0.4, '<path d="M -16 -108 Q 0 -92 16 -108 Q 0 -100 -16 -108 Z" fill="#a8636c"/>')
      + paws(30, -172, 20, s.dark);
  };

  ART.badger = function (s) {
    var stripe = '#343a41';
    return '<g class="legs">'
      + '<rect x="-58" y="-22" width="30" height="24" rx="11" fill="' + s.dark + '"/>'
      + '<rect x="28" y="-22" width="30" height="24" rx="11" fill="' + s.dark + '"/>'
      + '</g>'
      + '<ellipse cx="0" cy="-58" rx="80" ry="50" fill="' + s.colour + '"/>'
      + '<ellipse cx="0" cy="-46" rx="44" ry="28" fill="#cdd2d8"/>'
      + '<circle cx="-31" cy="-145" r="11" fill="' + stripe + '"/>'
      + '<circle cx="31" cy="-145" r="11" fill="' + stripe + '"/>'
      + '<ellipse cx="0" cy="-112" rx="41" ry="45" fill="#f5f3ef"/>'
      + '<path d="M -38 -147 L -18 -152 L -12 -80 L -26 -78 Z" fill="' + stripe + '"/>'
      + '<path d="M 38 -147 L 18 -152 L 12 -80 L 26 -78 Z" fill="' + stripe + '"/>'
      + eyePair(0, -126, 21, 11, 7)
      + '<ellipse cx="0" cy="-88" rx="12" ry="9" fill="' + stripe + '"/>'
      + mouthG(0, -72, 0.4, '<path d="M -15 -76 Q 0 -60 15 -76 Q 0 -68 -15 -76 Z" fill="#7d5a5f"/>')
      + paws(40, -120, 20, s.dark);
  };

  // ------------------------------------------------------------------
  // The fingering chart: a soprano recorder from the front, in her own
  // translucent red, with the thumb hole floated off to the side the way
  // every recorder book draws it. Filled means covered.
  // ------------------------------------------------------------------
  function hole(x, y, r, filled, tint) {
    if (filled) {
      return '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 4) + '" fill="' + tint + '" opacity="0.5"/>'
        + '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#26292f"/>';
    }
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fdf7ee" stroke="#8e1f27" stroke-width="2.5"/>';
  }

  function chartArt(holes, tint) {
    var s = '';
    s += '<rect x="-13" y="-176" width="26" height="32" rx="11" fill="url(#pipe)"/>';
    s += '<rect x="-20" y="-152" width="40" height="300" rx="17" fill="url(#pipe)"/>';
    s += '<rect x="-14" y="-146" width="9" height="284" rx="5" fill="#ffffff" opacity="0.24"/>';
    s += '<rect x="-9" y="-136" width="18" height="16" rx="4" fill="#59151a"/>';
    s += '<rect x="-20" y="-114" width="40" height="5" fill="#7d1a21" opacity="0.5"/>';
    s += '<ellipse cx="0" cy="145" rx="28" ry="11" fill="#8e1f27"/>';

    var ys = [-88, -56, -24, 10, 42], i;
    for (i = 0; i < ys.length; i++) {
      s += hole(0, ys[i], 9, i < holes, tint);
    }
    // Six and seven are the doubled pair at the foot; open for all three
    // of these notes, but drawn because that is what her chart looks like.
    [76, 106].forEach(function (y) {
      s += hole(-8, y, 6, false, tint) + hole(8, y, 6, false, tint);
    });
    // The thumb, round the back, down for every one of the three.
    s += '<path d="M -35 -88 h 13" stroke="#f0a0a5" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>';
    s += hole(-47, -88, 10, true, tint);
    return s;
  }

  function plaqueArt(holes, tint) {
    return '<rect class="signglow" x="-100" y="-224" width="200" height="448" rx="36" fill="#fff3ac" opacity="0"/>'
      + '<rect x="-78" y="-202" width="156" height="404" rx="26" fill="#fdf6e3" stroke="#c99a5e" stroke-width="7"/>'
      + '<rect x="-62" y="-186" width="124" height="24" rx="12" fill="' + tint + '"/>'
      + '<g transform="translate(0,22)">' + chartArt(holes, tint) + '</g>';
  }

  // Landscape lays the chart on its side. That is the only way it fits
  // in a short row, and it is also how the instrument is actually held,
  // thumb hole underneath.
  function signArt(holes, tint, wide) {
    var postH = wide ? 62 : 118;
    var cy = -(postH + (wide ? 90 : 210));
    return '<rect x="-10" y="' + (-postH - 2) + '" width="20" height="' + (postH + 4) + '" rx="8" fill="url(#post)"/>'
      + '<g transform="translate(0,' + cy + ')' + (wide ? ' rotate(-90)' : '') + '">'
      + plaqueArt(holes, tint) + '</g>';
  }

  // ------------------------------------------------------------------
  // A flower, rooted at y = 0, opening from nothing to full.
  // ------------------------------------------------------------------
  function flowerArt(petal) {
    var s = '<path class="stem" d="M 0 0 L 0 -20" stroke="#4c8c45" stroke-width="7" fill="none" stroke-linecap="round"/>'
      + '<g class="leaves">'
      + '<ellipse cx="-17" cy="0" rx="18" ry="9" fill="#5aa04f" transform="rotate(-18 -17 0)"/>'
      + '<ellipse cx="17" cy="0" rx="18" ry="9" fill="#4c8c45" transform="rotate(18 17 0)"/>'
      + '</g>'
      + '<g class="head"><circle cx="0" cy="0" r="17" fill="#4c8c45"/><g class="petals">';
    for (var i = 0; i < 6; i++) {
      s += '<ellipse cx="0" cy="-24" rx="12" ry="23" fill="' + petal + '" transform="rotate(' + (i * 60) + ')"/>';
    }
    return s + '</g><circle cx="0" cy="0" r="12" fill="#ffd977"/><circle cx="0" cy="0" r="6" fill="#e8a63c"/></g>';
  }

  // The little ones that stay behind once a flower is finished.
  function pickedFlower(x, y, r, petal) {
    var s = '<g transform="translate(' + x + ',' + y + ')">'
      + '<path d="M 0 0 L 0 ' + (-r * 2.4) + '" stroke="#4c8c45" stroke-width="' + (r * 0.34) + '" stroke-linecap="round"/>'
      + '<g transform="translate(0,' + (-r * 2.4) + ')">';
    for (var i = 0; i < 5; i++) {
      s += '<ellipse cx="0" cy="' + (-r * 0.78) + '" rx="' + (r * 0.42) + '" ry="' + (r * 0.78) + '" fill="' + petal + '" transform="rotate(' + (i * 72) + ')"/>';
    }
    return s + '<circle cx="0" cy="0" r="' + (r * 0.42) + '" fill="#ffd977"/></g></g>';
  }

  // ------------------------------------------------------------------
  // What the garden remembers between visits.
  // ------------------------------------------------------------------
  var save = { flowers: 0, done: [0, 0, 0], garden: [] };

  function load() {
    try {
      var s = JSON.parse(window.localStorage.getItem('recorder-garden') || 'null');
      if (s && typeof s.flowers === 'number') {
        save.flowers = s.flowers;
        save.done = (s.done && s.done.length === 3) ? s.done : [0, 0, 0];
        save.garden = s.garden || [];
      }
    } catch (e) {}
  }
  function persist() {
    try { window.localStorage.setItem('recorder-garden', JSON.stringify(save)); } catch (e) {}
  }
  // The rabbit comes once B is hers, the badger once B and A both are.
  var ARRIVE_AT = [0, 3, 8];
  function unlocked() {
    var n = 1;
    while (n < 3 && save.flowers >= ARRIVE_AT[n]) { n++; }
    return n;
  }

  // ------------------------------------------------------------------
  // Layout. The world is 1000 wide and as many tall as the viewport
  // needs, so nothing is ever letterboxed or cropped.
  //
  // Landscape turns the fingering chart on its side, which is both the
  // only way it fits and the way the instrument is actually held.
  // ------------------------------------------------------------------
  var L = {};

  function computeLayout() {
    // Measured off the stage itself rather than asked of the window:
    // innerHeight lies whenever a phone browser's address bar is in the
    // middle of sliding away.
    var box = svg.getBoundingClientRect();
    var vw = Math.max(1, box.width || document.documentElement.clientWidth || window.innerWidth);
    var vh = Math.max(1, box.height || document.documentElement.clientHeight || window.innerHeight);
    var W = 1000;
    var H = clamp(Math.round(1000 * vh / vw), 430, 2400);
    var wide = (vw / vh) >= 1.15;

    // Landscape spreads the three heights further apart, because there is
    // nothing else to spend the height on.
    var gy = wide ? [H * 0.315, H * 0.605, H * 0.895]
                  : [H * 0.40, H * 0.645, H * 0.885];
    var xs = wide ? [W * 0.765, W * 0.505, W * 0.245]
                  : [W * 0.655, W * 0.315, W * 0.645];

    var rowH = wide ? H * 0.29 : H * 0.245;
    var scale = clamp(Math.min(W * 0.30 / 200, rowH / 230), 0.26, 1.5);
    var signScale = wide
      ? clamp(Math.min((W * 0.26) / 430, (rowH * 0.62) / 180), 0.16, 0.8)
      : clamp(Math.min((W * 0.19) / 170, (rowH * 0.92) / 514), 0.14, 1.0);

    var signX = [], flowerX = [], side = [], i, sd;
    for (i = 0; i < 3; i++) {
      sd = xs[i] > W * 0.5 ? -1 : 1;
      side.push(sd);
      signX.push(xs[i] + sd * (92 * scale + (wide ? 210 : 86) * signScale + 14));
      flowerX.push(xs[i] - sd * (100 * scale + 44 * scale));
    }

    L = {
      W: W, H: H, wide: wide, gy: gy, xs: xs, scale: scale,
      signScale: signScale, signX: signX, flowerX: flowerX, side: side,
      bands: [0, (gy[0] + gy[1]) / 2, (gy[1] + gy[2]) / 2, H]
    };

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    drawSky();
    drawHills();
    drawGarden();
    buildSigns();
    placeAll();
    drawHits();
    drawUI();
  }

  function drawSky() {
    var g = G('sky'), W = L.W, H = L.H;
    clear(g);
    g.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#sky)' }));
    var sx = L.wide ? W * 0.13 : W * 0.2, sy = L.gy[0] * 0.3;
    g.appendChild(el('circle', { cx: sx, cy: sy, r: 110, fill: 'url(#glowg)' }));
    g.appendChild(el('circle', { cx: sx, cy: sy, r: 44, fill: '#fff6cc' }));
    [[0.42, 0.2, 1], [0.8, 0.12, 0.78], [0.6, 0.42, 0.6]].forEach(function (c) {
      var cg = el('g', {
        transform: 'translate(' + (W * c[0]) + ',' + (L.gy[0] * c[1] + 24) + ') scale(' + c[2] + ')',
        opacity: 0.9
      });
      cg.innerHTML = '<ellipse cx="0" cy="0" rx="54" ry="23" fill="#ffffff"/>'
        + '<ellipse cx="-34" cy="7" rx="33" ry="17" fill="#ffffff"/>'
        + '<ellipse cx="36" cy="6" rx="37" ry="18" fill="#ffffff"/>'
        + '<ellipse cx="5" cy="-15" rx="29" ry="19" fill="#ffffff"/>';
      g.appendChild(cg);
    });
  }

  function hillPath(y, amp) {
    var W = L.W, H = L.H;
    return 'M -30 ' + (y + 12)
      + ' C ' + (W * 0.2) + ' ' + (y - amp) + ' ' + (W * 0.34) + ' ' + (y + amp) + ' ' + (W * 0.56) + ' ' + (y + 2)
      + ' C ' + (W * 0.74) + ' ' + (y - amp * 1.1) + ' ' + (W * 0.9) + ' ' + (y + amp * 0.5) + ' ' + (W + 30) + ' ' + (y - 6)
      + ' L ' + (W + 30) + ' ' + (H + 40) + ' L -30 ' + (H + 40) + ' Z';
  }

  function drawHills() {
    var g = G('hills'), i, k, amp = clamp(L.H * 0.014, 8, 26);
    clear(g);
    for (i = 0; i < 3; i++) {
      g.appendChild(el('path', { d: hillPath(L.gy[i], amp), fill: 'url(#hill' + i + ')' }));
      var tufts = '';
      for (k = 0; k < 9; k++) {
        var tx = rnd(20, L.W - 20), ty = L.gy[i] + rnd(14, 30), th = rnd(9, 18);
        tufts += '<path d="M ' + tx + ' ' + ty + ' q ' + rnd(-5, 5) + ' ' + (-th) + ' ' + rnd(3, 8) + ' ' + (-th * 1.3) + '" '
          + 'stroke="#3f8a44" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>';
      }
      var tg = el('g', {});
      tg.innerHTML = tufts;
      g.appendChild(tg);
      if (friends[i] && friends[i].present) {
        g.appendChild(el('ellipse', {
          cx: L.xs[i], cy: L.gy[i] + 8, rx: 112 * L.scale, ry: 18 * L.scale,
          fill: '#1d4a22', opacity: 0.1
        }));
      }
    }
  }

  // Where the finished ones stand: a bed that spreads out from the spot
  // the flower was actually grown in, rather than anywhere on the hill.
  // She has to be able to see that the one she just made is still there.
  // The bud keeps the middle; the finished ones fill in around and below
  // it, never back up the slope where the friend is standing.
  var PLOT = [
    [-44, 12], [44, 14], [-18, 34], [18, 36], [-56, 44],
    [56, 46], [0, 58], [-38, 68], [38, 70], [0, 84]
  ];

  function drawGarden() {
    var g = G('garden'), s = '', i, f, lvl, top, bot, y, x, r, sc, pl;
    for (i = 0; i < save.garden.length; i++) {
      f = save.garden[i];
      lvl = clamp(f.i | 0, 0, 2);
      sc = clamp(L.scale * 0.85, 0.3, 1.25);
      if (typeof f.k === 'number') {
        pl = PLOT[f.k % PLOT.length];
        x = L.flowerX[lvl] + pl[0] * sc;
        y = L.gy[lvl] + 10 + pl[1] * sc;
        r = 28 * sc;
      } else {
        // Flowers from before the beds existed. Left where they fell.
        top = L.gy[lvl] + 14;
        bot = (lvl < 2 ? L.gy[lvl + 1] : L.H) - 10;
        y = top + Math.max(0, bot - top) * (f.v || 0.5);
        x = 40 + (L.W - 80) * (f.u || 0.5);
        r = (6 + 7 * (f.v || 0.5)) * clamp(L.scale, 0.55, 1.35);
      }
      x = clamp(x, 26, L.W - 26);
      y = clamp(y, L.gy[lvl] + 6, L.H - 8);
      s += pickedFlower(x, y, r, SPECS[lvl].petal);
    }
    g.innerHTML = s;
  }

  // ------------------------------------------------------------------
  // The friends
  // ------------------------------------------------------------------
  var friends = [];

  function buildFriends() {
    var i;
    for (i = 0; i < SPECS.length; i++) {
      var s = SPECS[i];
      var node = el('g', {});
      node.innerHTML = '<circle class="halo" cx="0" cy="-95" r="135" fill="url(#sung)" opacity="0"/>' + ART[s.animal](s);
      var flower = el('g', {});
      flower.innerHTML = flowerArt(s.petal);
      G('friends').appendChild(node);
      G('flowers').appendChild(flower);
      friends.push({
        spec: s, i: i, node: node, flower: flower, sign: null, glow: null,
        halo: node.querySelector('.halo'),
        mouth: node.querySelector('.mouth'),
        looks: node.querySelectorAll('.look'),
        pawsG: node.querySelector('.paws'),
        stem: flower.querySelector('.stem'),
        leaves: flower.querySelector('.leaves'),
        head: flower.querySelector('.head'),
        growth: 0, sing: 0, excite: 0, shy: 0, hop: 0, pulse: 0, celebrate: 0,
        singUntil: 0, gigUntil: 0, done: save.done[i] || 0,
        present: i < unlocked(), arriving: false, arriveT: 0,
        bob: Math.random() * 6.28
      });
    }
  }

  function buildSigns() {
    var g = G('signs'), i;
    clear(g);
    for (i = 0; i < friends.length; i++) {
      var f = friends[i];
      var sign = el('g', {});
      sign.innerHTML = signArt(f.spec.holes, f.spec.petal, L.wide);
      g.appendChild(sign);
      f.sign = sign;
      f.glow = sign.querySelector('.signglow');
    }
  }

  function placeAll() {
    var i;
    for (i = 0; i < friends.length; i++) {
      var f = friends[i];
      f.flower.setAttribute('transform', 'translate(' + L.flowerX[i] + ',' + (L.gy[i] + 10) + ') scale('
        + clamp(L.scale * 0.85, 0.3, 1.25) + ')');
      f.sign.setAttribute('opacity', f.present ? 1 : 0);
      f.flower.setAttribute('opacity', f.present ? 1 : 0);
      f.node.setAttribute('opacity', f.present ? 1 : 0);
      placeSign(f);
      paintFlower(f);
      paintFriend(f);
    }
  }

  function placeSign(f) {
    var sc = L.signScale * (1 + 0.22 * f.pulse);
    f.sign.setAttribute('transform', 'translate(' + L.signX[f.i] + ',' + (L.gy[f.i] + 6) + ') scale(' + sc + ')');
  }

  function friendPos(f) {
    var x = L.xs[f.i], y = L.gy[f.i], hop = f.hop;
    if (f.arriving) {
      var u = clamp(f.arriveT / 1.9, 0, 1);
      var e = u * u * (3 - 2 * u);
      var from = L.side[f.i] > 0 ? -170 : L.W + 170;
      x = from + (L.xs[f.i] - from) * e;
      if (f.spec.animal === 'bird') {
        y = L.gy[f.i] - Math.sin(u * Math.PI) * 150 * L.scale;
      } else {
        hop += Math.abs(Math.sin(u * Math.PI * (f.spec.animal === 'rabbit' ? 4 : 6)))
          * (1 - u * 0.5) * 38 * L.scale;
      }
    }
    return { x: x, y: y, hop: hop };
  }

  function paintFriend(f) {
    var p = friendPos(f);
    var bobY = reduced ? 0 : Math.sin(f.bob) * 3 * L.scale;
    var sc = L.scale * (1 + f.excite * 0.05);
    f.node.setAttribute('transform',
      'translate(' + p.x + ',' + (p.y - p.hop + bobY) + ') scale(' + sc + ')');
    if (f.halo) { f.halo.setAttribute('opacity', clamp(f.sing * 0.55 + f.excite * 0.45, 0, 0.9)); }
    if (f.mouth) {
      var cx = +f.mouth.getAttribute('data-cx'), cy = +f.mouth.getAttribute('data-cy');
      var rest = parseFloat(f.mouth.getAttribute('data-rest')) || 0.2;
      var k = rest + (1 - rest) * f.sing;
      f.mouth.setAttribute('transform',
        'translate(' + cx + ',' + cy + ') scale(1,' + k + ') translate(' + (-cx) + ',' + (-cy) + ')');
    }
    if (f.pawsG) { f.pawsG.setAttribute('opacity', f.shy); }
  }

  function paintFlower(f) {
    var h = 26 + 140 * f.growth;
    var bend = reduced ? 0 : 9 * Math.sin(f.bob * 0.6);
    f.stem.setAttribute('d', 'M 0 0 Q ' + bend + ' ' + (-h * 0.5) + ' 0 ' + (-h));
    f.leaves.setAttribute('transform', 'translate(0,' + (-h * 0.42) + ') scale(' + (0.4 + 0.6 * f.growth) + ')');
    var k = 0.34 + 0.66 * f.growth;
    if (f.celebrate > 0 && !reduced) { k *= 1 + 0.13 * Math.sin((1.5 - f.celebrate) * 11); }
    f.head.setAttribute('transform', 'translate(0,' + (-h) + ') scale(' + k + ')');
  }

  // ------------------------------------------------------------------
  // Sparks
  // ------------------------------------------------------------------
  var parts = [];

  function burst(x, y, colour, n, spread) {
    var g = G('effects'), i;
    for (i = 0; i < n; i++) {
      var a = rnd(0, Math.PI * 2), sp = rnd(0.35, 1) * spread;
      var node = el('circle', { cx: 0, cy: 0, r: rnd(3, 9), fill: colour });
      g.appendChild(node);
      parts.push({
        n: node, x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - spread * 0.55, life: 1
      });
    }
  }

  function updateParts(dt) {
    var i, p;
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.life -= dt * 0.85;
      if (p.life <= 0) {
        if (p.n.parentNode) { p.n.parentNode.removeChild(p.n); }
        parts.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 340 * dt;
      p.n.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');
      p.n.setAttribute('opacity', clamp(p.life, 0, 1));
    }
  }

  // ------------------------------------------------------------------
  // The parent's one control: the ears, on or off.
  // ------------------------------------------------------------------
  var micRing = null;

  function drawUI() {
    if (!L.W) { return; }
    var g = G('ui');
    clear(g);
    var sz = clamp(L.W * 0.08, 58, 92);
    var cx = 22 + sz / 2, cy = L.H - 22 - sz / 2;
    var on = MIC.state === 'on';
    var busy = MIC.state === 'asking';
    var ink = on ? '#3f7c36' : '#948d82';
    var body = el('g', { transform: 'translate(' + cx + ',' + cy + ')' });
    body.innerHTML =
      '<circle class="ring" cx="0" cy="0" r="' + (sz * 0.6) + '" fill="#7ecf6a" opacity="0"/>'
      + '<rect x="' + (-sz / 2) + '" y="' + (-sz / 2) + '" width="' + sz + '" height="' + sz
      + '" rx="' + (sz * 0.3) + '" fill="#fdf6e3" opacity="' + (on ? 0.94 : 0.6) + '" stroke="#c99a5e" stroke-width="3"/>'
      + '<rect x="' + (-sz * 0.11) + '" y="' + (-sz * 0.3) + '" width="' + (sz * 0.22) + '" height="' + (sz * 0.36)
      + '" rx="' + (sz * 0.11) + '" fill="' + ink + '"/>'
      + '<path d="M ' + (-sz * 0.21) + ' 0 a ' + (sz * 0.21) + ' ' + (sz * 0.21) + ' 0 0 0 ' + (sz * 0.42) + ' 0" '
      + 'fill="none" stroke="' + ink + '" stroke-width="' + (sz * 0.075) + '" stroke-linecap="round"/>'
      + '<path d="M 0 ' + (sz * 0.21) + ' v ' + (sz * 0.13) + '" stroke="' + ink + '" stroke-width="'
      + (sz * 0.075) + '" stroke-linecap="round"/>'
      + (on || busy ? '' : '<path d="M ' + (-sz * 0.29) + ' ' + (-sz * 0.29) + ' L ' + (sz * 0.29) + ' '
        + (sz * 0.29) + '" stroke="#c2564f" stroke-width="' + (sz * 0.09) + '" stroke-linecap="round"/>')
      + '<rect class="hit" x="' + (-sz * 0.68) + '" y="' + (-sz * 0.68) + '" width="' + (sz * 1.36)
      + '" height="' + (sz * 1.36) + '" data-ui="mic"/>';
    g.appendChild(body);
    micRing = body.querySelector('.ring');
  }

  function drawHits() {
    var g = G('hits'), i;
    clear(g);
    for (i = 0; i < 3; i++) {
      if (!friends[i] || !friends[i].present) { continue; }
      g.appendChild(el('rect', {
        'class': 'hit', x: 0, y: L.bands[i], width: L.W,
        height: L.bands[i + 1] - L.bands[i], 'data-friend': i
      }));
    }
  }

  // ------------------------------------------------------------------
  // Asking.
  //
  // There is no round and no turn. A friend sings its note and waits,
  // and if she answers a different one instead, that friend answers her
  // just as gladly. The asking only ever points at something.
  // ------------------------------------------------------------------
  var ask = { idx: 0, next: 2.5 };
  var clock = 0, lookAt = -1, touchHold = -1, firstTouch = false;

  function sing(f, dur) {
    initAudio();
    recorderNote(0.02, mtof(f.spec.midi), dur, 0.4);
    f.singUntil = clock + dur;
    ask.idx = f.i;
  }

  function pickAsk() {
    var n = unlocked(), best = ask.idx, bestScore = 1e9, i, sc;
    for (i = 0; i < n; i++) {
      if (!friends[i].present) { continue; }
      sc = friends[i].done * 10 + (i === ask.idx ? 7 : 0) + Math.random() * 4;
      if (sc < bestScore) { bestScore = sc; best = i; }
    }
    ask.idx = best;
    ask.next = clock + 1.8;
  }

  function unlockCheck() {
    var n = unlocked(), i, f;
    for (i = 0; i < 3; i++) {
      f = friends[i];
      if (i < n && !f.present) {
        f.present = true;
        f.arriving = !reduced;
        f.arriveT = 0;
        f.sign.setAttribute('opacity', 1);
        f.flower.setAttribute('opacity', 1);
        arriveSound();
        ask.idx = i;
        ask.next = clock + 3.2;
        drawHills();
        drawHits();
      }
    }
  }

  // A full flower stands there and is admired before it is planted. It
  // used to blink out the instant it filled, which read as losing it.
  function finish(f) {
    f.growth = 1;
    f.celebrate = 1.5;
    f.excite = 1;
    sparkleSound();
    burst(L.flowerX[f.i], L.gy[f.i] - 150 * clamp(L.scale * 0.85, 0.3, 1.25),
      f.spec.petal, reduced ? 0 : 18, 250);
    ask.next = clock + 4;
  }

  function plant(f) {
    f.celebrate = 0;
    f.growth = 0;
    save.garden.push({ i: f.i, k: f.done });
    f.done++;
    save.done[f.i] = f.done;
    save.flowers++;
    if (save.garden.length > 90) { save.garden.shift(); }
    persist();
    drawGarden();
    unlockCheck();
    pickAsk();
    paintFlower(f);
  }

  function computeLook() {
    var i;
    for (i = 0; i < friends.length; i++) { if (clock < friends[i].singUntil) { return i; } }
    if (MIC.note) {
      for (i = 0; i < friends.length; i++) { if (friends[i].spec.id === MIC.note) { return i; } }
    }
    if (touchHold >= 0) { return touchHold; }
    return -1;
  }

  function updateFriend(f, dt) {
    if (!f.present && !f.arriving) { f.node.setAttribute('opacity', 0); return; }
    f.node.setAttribute('opacity', 1);
    if (!reduced) { f.bob += dt * 1.6; }

    if (f.arriving) {
      f.arriveT += dt;
      if (f.arriveT >= 1.9) { f.arriving = false; }
    }

    var micMine = MIC.note === f.spec.id;
    var tapMine = (touchHold === f.i) && MIC.state !== 'on';
    var mine = micMine || tapMine;

    var open = 0;
    if (clock < f.singUntil) { open = 1; }
    else if (micMine) { open = clamp(MIC.level / 0.13, 0.3, 1); }
    else if (tapMine) { open = 0.85; }
    f.sing += (open - f.sing) * clamp(dt * 12, 0, 1);

    f.excite += ((mine ? 1 : 0) - f.excite) * clamp(dt * 5, 0, 1);
    f.hop = ((mine || f.celebrate > 0) && !reduced)
      ? Math.abs(Math.sin(clock * 5.5)) * 9 * L.scale : f.hop * 0.9;

    // Blowing too hard covers everyone's ears. It costs her nothing.
    var wantShy = (micMine && hold.shrill) ? 1 : 0;
    f.shy += (wantShy - f.shy) * clamp(dt * 9, 0, 1);
    if (wantShy && clock > f.gigUntil) { f.gigUntil = clock + 2.4; giggle(); }

    if (f.celebrate > 0) {
      f.celebrate -= dt;
      if (f.celebrate <= 0) { plant(f); }
    } else {
      if (micMine && !hold.shrill) {
        f.growth = clamp(f.growth + growthRate() * dt, 0, 1);
      } else if (tapMine) {
        f.growth = clamp(f.growth + dt / 5.5, 0, 1);
      }
      if (f.growth >= 1) { finish(f); }
    }

    var dx = 0, dy = 0;
    if (lookAt >= 0 && lookAt !== f.i) {
      dx = clamp((L.xs[lookAt] - L.xs[f.i]) / 260, -1, 1) * 4.5;
      dy = clamp((L.gy[lookAt] - L.gy[f.i]) / 320, -1, 1) * 3.5;
    }
    var k;
    for (k = 0; k < f.looks.length; k++) {
      f.looks[k].setAttribute('transform', 'translate(' + dx.toFixed(2) + ',' + dy.toFixed(2) + ')');
    }
    if (f.glow) {
      f.glow.setAttribute('opacity',
        f.pulse * (reduced ? 0.3 : (0.24 + 0.16 * Math.sin(clock * 2.4))));
    }

    paintFriend(f);
    paintFlower(f);
  }

  function updateUI() {
    if (!micRing) { return; }
    var lv = clamp(MIC.smooth * 6, 0, 1);
    micRing.setAttribute('opacity', MIC.state === 'on' ? (0.12 + lv * 0.6) : 0);
    micRing.setAttribute('transform', 'scale(' + (0.86 + lv * 0.3) + ')');
  }

  // ------------------------------------------------------------------
  // Frame loop
  // ------------------------------------------------------------------
  var lastFrame = 0, detectTick = 0, puffNext = 0;

  function frame(now) {
    var dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0.016;
    lastFrame = now;
    clock += dt;

    detectTick += dt;
    if (detectTick >= 0.033) { listen(); updateHold(detectTick); detectTick = 0; }
    MIC.smooth += (MIC.level - MIC.smooth) * clamp(dt * 9, 0, 1);
    lookAt = computeLook();

    // Anything she plays that is not one of the three still stirs the
    // grass, so the recorder never once makes nothing happen.
    if (MIC.anyPitch && !MIC.note && clock > puffNext && !reduced) {
      puffNext = clock + 0.4;
      burst(rnd(L.W * 0.15, L.W * 0.85), L.gy[2] + 26, '#a9d68a', 5, 130);
    }

    // The garden holds its tongue while she is playing.
    if (MIC.note || touchHold >= 0) { ask.next = Math.max(ask.next, clock + 7); }
    // Nothing is asked until the audio really is running. A phone keeps
    // the context asleep until she touches the screen, and notes queued
    // against a sleeping clock all land in a heap when it wakes.
    if (clock > ask.next) {
      var af = friends[ask.idx];
      if (AC && AC.state === 'running' && af && af.present && !af.arriving) {
        sing(af, 1.2);
        ask.next = clock + 13;
      } else {
        ask.next = clock + 1;
      }
    }

    var i, f;
    for (i = 0; i < friends.length; i++) {
      f = friends[i];
      f.pulse += (((ask.idx === i && f.present) ? 1 : 0) - f.pulse) * clamp(dt * 4, 0, 1);
      placeSign(f);
      updateFriend(f, dt);
    }
    updateParts(dt);
    updateUI();
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------
  // Input. Three targets the size of a third of the screen each, plus
  // the microphone switch in the corner for me rather than for her.
  // ------------------------------------------------------------------
  svg.addEventListener('pointerdown', function (ev) {
    initAudio();
    if (!firstTouch) { firstTouch = true; startMic(); }
    var t = ev.target;
    if (!t || !t.getAttribute) { return; }
    if (t.getAttribute('data-ui') === 'mic') {
      if (MIC.state === 'on') { stopMic(); }
      else if (MIC.state !== 'asking') { startMic(); }
      return;
    }
    var fi = t.getAttribute('data-friend');
    if (fi === null) { return; }
    var f = friends[+fi];
    if (!f || !f.present) { return; }
    sing(f, 1.2);
    ask.next = clock + 13;
    // With no ears, holding a friend does what holding a note would.
    if (MIC.state !== 'on') { touchHold = f.i; }
  });

  function release() { touchHold = -1; }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  svg.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { touchHold = -1; }
    else if (AC && AC.state === 'suspended') { AC.resume(); }
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(computeLayout, 120);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(computeLayout, 220);
  });
  if (window.ResizeObserver) {
    new window.ResizeObserver(function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(computeLayout, 120);
    }).observe(document.documentElement);
  }

  load();
  buildFriends();
  computeLayout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
