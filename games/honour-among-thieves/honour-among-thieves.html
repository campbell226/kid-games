<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#14130f">
<title>Honour Among Thieves</title>
<style>
  :root {
    --ink: #2b1e12;
    --parch: #efe4c8;
    --parch-d: #dccb9f;
    --edge: #4a3322;
    --chalk: #ece8da;
    --fs: 20px;
    --facew: 84px;
    --boxh: 112px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14130f;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--ink);
  }
  #scene {
    position: fixed; left: 0; top: 0;
    display: block;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;
  }
  #ui { position: fixed; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; z-index: 2; }
  #tapper { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; }
  #tapper.show { display: block; pointer-events: auto; }

  /* The speech box, Pokemon fashion: a face, a name, the words typed out. */
  #speech {
    position: absolute; left: 50%;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(96vw, 900px);
    min-height: var(--boxh);
    background: var(--parch);
    border: 4px solid var(--edge);
    border-radius: 14px;
    box-shadow: inset 0 0 0 3px #cdb98c, 0 10px 30px rgba(0, 0, 0, 0.65);
    padding: 14px 40px 12px calc(var(--facew) + 24px);
    font-size: var(--fs);
    line-height: 1.32;
    display: none;
    cursor: pointer;
  }
  #speech.show { display: block; pointer-events: auto; }
  #speech.noface { padding-left: 20px; font-style: italic; }
  #speech .who {
    position: absolute; top: -16px; left: calc(var(--facew) + 16px);
    background: var(--edge); color: var(--parch);
    font-weight: 800; font-size: 0.78em; font-style: normal;
    padding: 2px 12px; border-radius: 8px;
    white-space: nowrap;
  }
  #speech.noface .who, #speech.noface .face { display: none; }
  #speech .face {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: var(--facew); height: var(--facew);
    border-radius: 10px; background: #2c2620; border: 3px solid var(--edge);
    overflow: hidden;
  }
  #speech .face svg { width: 100%; height: 100%; display: block; }
  #speech .more {
    position: absolute; right: 14px; bottom: 10px; width: 0; height: 0;
    border-left: 10px solid transparent; border-right: 10px solid transparent;
    border-top: 13px solid var(--edge);
    opacity: 0;
  }
  #speech.done .more { opacity: 1; animation: bob 0.9s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

  #bar {
    position: absolute; left: 50%;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(96vw, 900px);
    display: none; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #bar.show { display: flex; pointer-events: auto; }

  .btn {
    font: inherit; font-weight: 800;
    font-size: clamp(17px, calc(var(--fs) * 1.02), 24px);
    color: var(--parch);
    background: linear-gradient(#6d4b2c, #4a3019);
    border: 3px solid #2a1a0c; border-radius: 14px;
    padding: 0.5em 1.1em; min-height: 56px;
    box-shadow: 0 4px 0 #1d1208, 0 6px 14px rgba(0, 0, 0, 0.5);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.45em;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1d1208; }
  .btn[disabled] { opacity: 0.45; }
  .btn svg { width: 1.5em; height: 1.5em; flex: none; }
  .btn.quiet { background: linear-gradient(#e9dcbc, #d6c49a); color: var(--ink); border-color: #8b6c45; box-shadow: 0 3px 0 #8b6c45; }
  .btn.mum { background: linear-gradient(#557a49, #36522e); }
  .btn.snitch { background: linear-gradient(#a3402f, #6e2219); }
  .btn.on { outline: 4px solid #f3d27a; outline-offset: 1px; }
  .btn.dim { opacity: 0.55; }

  #panel {
    position: absolute; left: 50%; top: calc(50% + 26px);
    transform: translate(-50%, -50%);
    width: min(96vw, 780px);
    max-height: calc(100% - 72px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--parch);
    border: 4px solid var(--edge); border-radius: 16px;
    box-shadow: inset 0 0 0 3px #cdb98c, 0 12px 40px rgba(0, 0, 0, 0.7);
    padding: clamp(12px, 3vw, 22px);
    display: none;
    font-size: clamp(15px, calc(var(--fs) * 0.92), 20px);
    line-height: 1.4;
  }
  #panel.show { display: block; pointer-events: auto; }
  #panel.desk {
    top: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    max-height: 60%;
  }
  #panel.title { top: calc(64px + env(safe-area-inset-top, 0px)); bottom: auto; transform: translateX(-50%); }
  @media (orientation: landscape) {
    #panel.desk, #panel.title {
      left: auto; right: 10px; top: calc(50% + 26px); bottom: auto;
      transform: translateY(-50%);
      width: min(54vw, 560px);
      max-height: calc(100% - 72px);
    }
  }
  #over {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(96vw, 640px);
    max-height: calc(100% - 20px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--parch);
    border: 4px solid var(--edge); border-radius: 16px;
    box-shadow: inset 0 0 0 3px #cdb98c, 0 12px 40px rgba(0, 0, 0, 0.8);
    padding: clamp(12px, 3vw, 20px);
    display: none; z-index: 4;
    font-size: clamp(15px, calc(var(--fs) * 0.92), 20px);
    line-height: 1.4;
  }
  #over.show { display: block; pointer-events: auto; }
  #over h2 { font-family: Georgia, "Times New Roman", serif; margin: 0 0 0.4em; font-size: 1.45em; }
  #over .sub { opacity: 0.75; font-size: 0.92em; }
  #over .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  #panel h1, #panel h2, #panel h3 {
    font-family: Georgia, "Times New Roman", serif;
    margin: 0 0 0.4em; line-height: 1.15;
  }
  #panel h1 { font-size: 1.9em; }
  #panel h2 { font-size: 1.45em; }
  #panel h3 { font-size: 1.15em; margin-top: 1em; }
  #panel p { margin: 0.4em 0 0.7em; }
  #panel .sub { opacity: 0.75; font-size: 0.92em; }
  #panel .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  #panel input[type=text] {
    font: inherit; font-weight: 700;
    width: 100%; min-width: 0;
    padding: 8px 10px; min-height: 46px;
    border: 3px solid #8b6c45; border-radius: 10px;
    background: #fbf5e4; color: var(--ink);
    -webkit-user-select: text; user-select: text;
  }
  .seg { display: inline-flex; border: 3px solid #2a1a0c; border-radius: 12px; overflow: hidden; }
  .seg button {
    font: inherit; font-weight: 800; border: 0; padding: 0.4em 0.9em; min-height: 46px;
    background: #e3d4ae; color: var(--ink); cursor: pointer;
  }
  .seg button + button { border-left: 2px solid #8b6c45; }
  .seg button.on { background: #5b3b22; color: var(--parch); }

  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 2px dashed #cdb98c;
  }
  .row:last-child { border-bottom: 0; }
  .row .who { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; font-weight: 800; }
  .row .who .nm { overflow: hidden; text-overflow: ellipsis; }
  .row .opts { display: flex; gap: 8px; flex: none; }
  .facebtn {
    flex: none; width: 64px; height: 64px; padding: 0;
    border-radius: 50%; border: 3px solid var(--edge); background: #3b3328;
    overflow: hidden; cursor: pointer;
  }
  .facebtn svg, .face64 svg { width: 100%; height: 100%; display: block; }
  .face64 { flex: none; width: 60px; height: 60px; border-radius: 50%; background: #3b3328; border: 3px solid var(--edge); overflow: hidden; }
  .face40 { flex: none; display: inline-block; vertical-align: middle; width: 40px; height: 40px; border-radius: 50%; background: #3b3328; border: 2px solid var(--edge); overflow: hidden; }
  .face40 svg { width: 100%; height: 100%; display: block; }
  .choice { flex-direction: column; gap: 2px; min-width: 92px; padding: 0.3em 0.6em; font-size: 0.95em; }
  .choice svg { width: 36px; height: 36px; }

  /* Chalk on the wall: the deal. */
  .deal {
    display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px;
    background: #2b2f28; border: 6px solid #5b3b22; border-radius: 10px;
    padding: 8px; color: var(--chalk);
    font-family: Georgia, "Times New Roman", serif;
    margin: 8px auto; max-width: 520px;
  }
  .deal .h { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 0.82em; gap: 2px; padding: 2px; }
  .deal .c {
    border: 2px dashed rgba(236, 232, 218, 0.35); border-radius: 8px;
    padding: 6px 4px; display: flex; justify-content: space-around; align-items: center;
  }
  .deal .m { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .deal .num { font-size: 1.4em; font-weight: 700; line-height: 1; }
  .deal .best { color: #b6e69a; } .deal .worst { color: #ff9d88; }
  .deal svg.ic { width: 30px; height: 30px; }
  .tal { display: block; height: 14px; }

  #curtain {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at 50% 40%, #2c241b, #0b0a08 75%);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: var(--parch); text-align: center; padding: 20px;
  }
  #curtain.show { display: flex; pointer-events: auto; }
  #curtain .big {
    width: min(42vw, 34vh, 220px); height: min(42vw, 34vh, 220px);
    border-radius: 50%; background: #3b3328; border: 5px solid #6b4a2b; overflow: hidden;
  }
  #curtain .big svg { width: 100%; height: 100%; display: block; }
  #curtain h2 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(26px, 6vw, 46px); margin: 0; }
  #curtain p { margin: 0; font-size: clamp(16px, 3.4vw, 22px); opacity: 0.85; }

  #card {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    color: var(--chalk); text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    text-shadow: 0 2px 10px #000;
    background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.8));
  }
  #card.show { display: flex; pointer-events: auto; }
  #card .n { font-size: clamp(44px, 12vw, 110px); font-weight: 700; letter-spacing: 0.03em; line-height: 1.05; }
  #card .s { font-size: clamp(16px, 3.4vw, 26px); opacity: 0.85; margin-top: 6px; }
  #card svg { width: clamp(50px, 12vw, 90px); height: clamp(50px, 12vw, 90px); margin-bottom: 6px; }

  #top {
    position: absolute;
    top: calc(6px + env(safe-area-inset-top, 0px));
    right: calc(6px + env(safe-area-inset-right, 0px));
    display: flex; gap: 8px; pointer-events: auto; z-index: 3;
  }
  #top button {
    width: 46px; height: 46px; padding: 0;
    border-radius: 12px; border: 2px solid #2a1a0c;
    background: rgba(239, 228, 200, 0.82);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #top button svg { width: 28px; height: 28px; }
  #top button.hide { display: none; }

  #fade {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0;
    background: #000; opacity: 0; pointer-events: none;
    transition: opacity 380ms ease; z-index: 6;
  }
  #fade.on { opacity: 1; pointer-events: auto; }

  .bars { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar .lab { flex: none; width: 7.5em; font-weight: 800; font-size: 0.92em; line-height: 1.1; }
  .bar .track { flex: 1 1 auto; height: 26px; background: #e2d2ab; border-radius: 8px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; background: linear-gradient(#7d5a37, #5b3b22); border-radius: 8px; transition: width 900ms ease; }
  .bar.win .fill { background: linear-gradient(#6c9a5c, #3f6a35); }
  .bar .val { flex: none; width: 3em; text-align: right; font-weight: 800; }
  .notes h3 { border-top: 2px dashed #cdb98c; padding-top: 0.7em; }
  .notes ul { margin: 0.3em 0 0.8em; padding-left: 1.3em; }
  .notes li { margin: 0.25em 0; }
  table.res { width: 100%; border-collapse: collapse; margin: 6px 0; }
  table.res td { padding: 6px 4px; border-bottom: 2px dashed #cdb98c; vertical-align: middle; }
  table.res td.n { text-align: right; font-weight: 800; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    #speech.done .more { animation: none; }
    .bar .fill { transition: none; }
    #fade { transition: none; }
  }
</style>
</head>

<script>
// Full screen on the first touch, and a way back if it is off.
//
// A browser will not do this by itself: the request has to come out of a
// gesture the browser counts as user activation, and that list is fussier
// than it looks. pointerdown only counts when the pointer is a mouse - on
// a touchscreen it grants nothing at all, which is why listening for it
// worked on a laptop and did nothing whatever on a tablet. For a finger it
// is pointerup and touchend that count.
//
// Once full screen is on, the automatic asking stops, so leaving it stays
// left. But leaving it used to mean reloading to get it back, so there is
// now a small button at the top of the screen that is only there while
// full screen is off, and takes itself away the moment it is on.
//
// An iPhone ignores the lot, because Safari there gives full screen to
// video and nothing else, so no button is offered. That is what the home
// screen tags above are for.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#40563a" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" aria-label="Honour Among Thieves">
  <defs>
    <pattern id="hat-stone" width="120" height="68" patternUnits="userSpaceOnUse">
      <rect width="120" height="68" fill="#262823"/>
      <rect x="2" y="2" width="56" height="30" rx="5" fill="#40433b"/>
      <rect x="62" y="2" width="56" height="30" rx="5" fill="#3a3d36"/>
      <rect x="-28" y="36" width="56" height="30" rx="5" fill="#3d4038"/>
      <rect x="32" y="36" width="56" height="30" rx="5" fill="#44473e"/>
      <rect x="92" y="36" width="56" height="30" rx="5" fill="#3d4038"/>
      <path d="M 6 8 Q 30 4 54 9 M 66 7 Q 90 4 114 8 M 36 42 Q 60 38 84 43" stroke="#53574c" stroke-width="2" fill="none" opacity="0.6"/>
    </pattern>
    <pattern id="hat-flag" width="180" height="70" patternUnits="userSpaceOnUse">
      <rect width="180" height="70" fill="#1d1a16"/>
      <rect x="2" y="2" width="86" height="32" rx="3" fill="#2f2b25"/>
      <rect x="92" y="2" width="86" height="32" rx="3" fill="#2b2722"/>
      <rect x="-42" y="37" width="86" height="31" rx="3" fill="#2a2621"/>
      <rect x="48" y="37" width="86" height="31" rx="3" fill="#312d27"/>
      <rect x="138" y="37" width="86" height="31" rx="3" fill="#2a2621"/>
    </pattern>
    <pattern id="hat-plank" width="90" height="400" patternUnits="userSpaceOnUse">
      <rect width="90" height="400" fill="#3b2516"/>
      <rect x="2" y="0" width="42" height="400" fill="#4a2f1b"/>
      <rect x="46" y="0" width="42" height="400" fill="#432a18"/>
      <path d="M 14 0 Q 20 120 12 260 T 18 400 M 64 0 Q 58 140 66 300 T 60 400" stroke="#3a2414" stroke-width="2" fill="none"/>
    </pattern>
    <radialGradient id="hat-damp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16200f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#16200f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hat-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffb55a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb55a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hat-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c9ec" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#b9c9ec" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hat-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#26355e"/>
    </linearGradient>
    <linearGradient id="hat-corr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a18"/>
      <stop offset="1" stop-color="#120d08"/>
    </linearGradient>
    <linearGradient id="hat-floorshade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="hat-vig" cx="0.5" cy="0.45" r="0.75">

  <g id="cell"></g>

    <button id="b-deal" class="hide" aria-label="The deal"></button>
    <button id="b-sound" aria-label="Sound"></button>
    <button id="b-menu" class="hide" aria-label="Menu"></button>
  </div>

<script>
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  // ------------------------------------------------------------------
  // Sound. Every bit of it is synthesised, so there is nothing to load
  // and nothing that can fail to load: a stone room's long echo, a low
  // minor drone, wind finding the gaps in the window, water dripping,
  // and now and then keys and chains somewhere down the corridor.
  // ------------------------------------------------------------------
  var AC = null, master = null, sfx = null, amb = null, wet = null, noiseBuf = null;

  function initAudio() {

    if (!Ctx) { return; }

    var comp = AC.createDynamicsCompressor();

    master = AC.createGain();
    master.gain.setValueAtTime(soundOn ? 0.9 : 0, t);
    master.connect(comp);

    var n = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);

    var conv = AC.createConvolver();
    conv.buffer = impulse(3.2, 2.6);
    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(3000, t);
    wet = AC.createGain();
    wet.connect(conv); conv.connect(lp);
    var wetOut = AC.createGain();
    wetOut.gain.setValueAtTime(0.5, t);
    lp.connect(wetOut); wetOut.connect(master);

    sfx = AC.createGain(); sfx.connect(master);
    amb = AC.createGain();
    amb.gain.setValueAtTime(0.0001, t);
    amb.connect(master);
    var ambWet = AC.createGain();
    ambWet.gain.setValueAtTime(0.5, t);

  function impulse(sec, decay) {

  }

  // Send a source to the dry mix and to the room, at the levels given.
  function out(node, dry, room, bus) {

      g.gain.value = dry;

  function noiseSrc(t, dur) {

  function env(g, t, a, peak, dur) {

  }

  var ambOn = false;
  function startAmbience() {
    if (ambOn || !AC) { return; }
    ambOn = true;
    var t = AC.currentTime;

    // The drone: low and minor, and barely moving.
    var dl = AC.createBiquadFilter();
    dl.type = 'lowpass';
    dl.frequency.setValueAtTime(300, t);
    dl.Q.setValueAtTime(0.7, t);
    var dg = AC.createGain();
    dg.gain.setValueAtTime(0.06, t);

    // higher up too, where a phone can still say something.

      var o = AC.createOscillator(), g = AC.createGain();
      o.type = v[1];
      o.frequency.setValueAtTime(v[0], t);

      o.connect(g); g.connect(dl);
      o.start(t);
    });

    lfo.frequency.setValueAtTime(0.045, t);
    lg.gain.setValueAtTime(110, t);
    lfo.connect(lg); lg.connect(dl.frequency);
    lfo.start(t);
    var swell = AC.createOscillator(), sg = AC.createGain();
    swell.frequency.setValueAtTime(0.021, t);
    sg.gain.setValueAtTime(0.022, t);

    swell.start(t);
    dl.connect(dg); dg.connect(amb);

    var ws = AC.createBufferSource();
    ws.buffer = noiseBuf; ws.loop = true;
    ws.start(t);
    var wb = AC.createBiquadFilter();
    wb.type = 'bandpass';
    wb.frequency.setValueAtTime(420, t);
    wb.Q.setValueAtTime(0.9, t);
    var wg = AC.createGain();
    wg.gain.setValueAtTime(0.03, t);
    ws.connect(wb); wb.connect(wg); wg.connect(amb);
    var wh = AC.createBiquadFilter();
    wh.type = 'bandpass';
    wh.frequency.setValueAtTime(1100, t);
    wh.Q.setValueAtTime(28, t);
    var whg = AC.createGain();
    whg.gain.setValueAtTime(0, t);
    ws.connect(wh); wh.connect(whg); whg.connect(amb);

    function gust() {
      if (!AC) { return; }
      var now = AC.currentTime, dur = rand(2.5, 6);
      wg.gain.linearRampToValueAtTime(rand(0.012, 0.06), now + dur);
      wb.frequency.linearRampToValueAtTime(rand(300, 700), now + dur);
      whg.gain.linearRampToValueAtTime(Math.random() < 0.35 ? rand(0.15, 0.4) : 0, now + dur);
      wh.frequency.linearRampToValueAtTime(rand(800, 1500), now + dur);
      setTimeout(gust, dur * 1000);
    }
    gust();

    (function drip() {
      if (AC && !document.hidden) { dripSound(); }
      setTimeout(drip, rand(1400, 5200));
    })();
    setTimeout(function chain() {
      if (AC && !document.hidden) { farChains(); }
      setTimeout(chain, rand(16000, 42000));
    }, rand(6000, 14000));
    setTimeout(function boom() {
      if (AC && !document.hidden) { thud(AC.currentTime + 0.05, 0.07, 1.6, amb); }
      setTimeout(boom, rand(35000, 80000));

  function dripSound() {

  function farChains() {
    var t0 = AC.currentTime + 0.05, n = randInt(3, 7);
    var lp = AC.createBiquadFilter(), g = AC.createGain();

    }

  var lastScratch = 0;

  function rubOut() {

  function creak() {
    if (!can()) { return; }

    s.connect(bp); bp.connect(g); out(g, 1, 0.3);
  }

  function sleeve(L) { return L.coat || (L.dress && !L.shawl ? L.top : (L.shawl ? L.shawl : L.top)); }

  // ------------------------------------------------------------------

  // --- the cell -------------------------------------------------------

      parts.push('<rect x="' + f1(wx) + '" y="' + f1(wy) + '" width="' + f1(wW) + '" height="' + f1(wH) + '" fill="url(#hat-night)"/>');
      parts.push('<circle cx="' + f1(wx + wW * 0.68) + '" cy="' + f1(wy + wH * 0.32) + '" r="' + f1(wW * 0.15) + '" fill="#e9e6d2"/>');
      parts.push('<circle cx="' + f1(wx + wW * 0.64) + '" cy="' + f1(wy + wH * 0.3) + '" r="' + f1(wW * 0.03) + '" fill="#cfcab4"/><circle cx="' + f1(wx + wW * 0.72) + '" cy="' + f1(wy + wH * 0.37) + '" r="' + f1(wW * 0.022) + '" fill="#cfcab4"/>');

        parts.push('<circle cx="' + f1(wx + R() * wW) + '" cy="' + f1(wy + R() * wH * 0.8) + '" r="' + f1(1 + R() * 1.6) + '" fill="#fff" opacity="0.7"/>');

  function wallDeal(cx, top, w, h) {

  function oldTally(x, y, h, groups) {

  var doorOpen = 0, doorTarget = 0, doorLeaf = null;

  function paintDoor() {

  function setDoor(open) {
    if (doorTarget === open) { return Promise.resolve(); }
    doorTarget = open;
    if (open) { creak(); keys(); }
    return sleep(reduced ? 50 : 520).then(function () { if (!open) { slam(); } });
  }

  // --- the tally marks ------------------------------------------------
  function drawTallies() {
    var g = CL.tallies;
    clear(g);
    if (!S || !S.prisoners || !S.inGame) { return; }
    var portrait = LAY.portrait;
    S.prisoners.forEach(function (p, i) {
      if (i >= LAY.xs.length) { return; }
      // Just over each prisoner's head: up against the ceiling when they
      // stand in a row, under Moll's bunk when the cell is deep. Kept
      // clear of the buttons in the top corner.
      var x0 = LAY.xs[i] - LAY.slotW * 0.44, x1 = LAY.xs[i] + LAY.slotW * 0.44;
      var bottom = LAY.figTop - 8, top = 8;
      if (portrait) { bottom = LAY.figTop - 14; top = LAY.figTop - 150; }
      if (top < 64 * LAY.upx) { x1 = Math.min(x1, LAY.W - 168 * LAY.upx); }
      var zoneH = Math.max(30, bottom - top), zoneW = Math.max(40, x1 - x0);
      var nameH = clamp(Math.min(zoneH * 0.32, LAY.slotW * 0.13), 13, 46);
      var n = p.shown || 0;
      var gp = n ? Math.ceil(n / 5) : 0;

      var t = el('text', {
        x: f1(x0), y: f1(top + nameH * 0.85),
        fill: '#e9e4d4', opacity: 0.88,
        'font-family': 'Georgia, serif', 'font-style': 'italic', 'font-weight': 700,
        'font-size': f1(nameH)
      });
      t.textContent = p.name;
      g.appendChild(t);
      var num = el('text', {
        x: f1(x0 + zoneW), y: f1(top + nameH * 0.85), 'text-anchor': 'end',
        fill: '#f3e7b6', 'font-family': 'Georgia, serif', 'font-weight': 700,
        'font-size': f1(nameH * 1.1)
      });
      num.textContent = String(n);
      g.appendChild(num);
      if (!gp) { return; }

      // As big as will fit, in groups of five.
      var avail = zoneH - nameH * 1.25, mh = Math.min(portrait ? 70 : 40, avail), adv, perRow, rows;
      for (var tries = 0; tries < 30; tries++) {
        adv = mh * 0.95;
        perRow = Math.max(1, Math.floor(zoneW / adv));
        rows = Math.ceil(gp / perRow);
        if (rows * mh * 1.22 <= avail || mh < 6) { break; }
        mh *= 0.88;

      var R = seeded(7 + i * 31), path = '';

        var row = Math.floor(gi / perRow), col = gi % perRow;
        var gx = x0 + col * adv + mh * 0.1, gy = top + nameH * 1.25 + row * mh * 1.22;
        var j1 = (R() - 0.5) * mh * 0.06, j2 = (R() - 0.5) * mh * 0.06;

          path += 'M ' + f1(x + j1) + ' ' + f1(gy) + ' L ' + f1(x + j2) + ' ' + f1(gy + mh) + ' ';
        } else {
          path += 'M ' + f1(gx - mh * 0.12) + ' ' + f1(gy + mh * 0.82 + j1) + ' L ' + f1(gx + mh * 0.64) + ' ' + f1(gy + mh * 0.18 + j2) + ' ';
        }
      }
      g.appendChild(el('path', {
        d: path, stroke: '#ece6d2', 'stroke-width': f1(Math.max(1.6, mh * 0.085)),
        'stroke-linecap': 'round', fill: 'none', opacity: 0.92
      }));
    });
  }

  // Count the wall up (or rub one out) a mark at a time, so it can be seen.
  function countTo(p, target) {
    return new Promise(function (resolve) {
      var my = RUN;
      (function tick() {
        if (my !== RUN) { return; }
        if ((p.shown || 0) === target) { resolve(); return; }
        if ((p.shown || 0) < target) { p.shown = (p.shown || 0) + 1; scratch(); }
        else { p.shown -= 1; rubOut(); }
        drawTallies();
        setTimeout(tick, reduced ? 60 : 170);
      })();
    });
  }

        else { RAT.state = 'home'; RAT.t = rand(25, 60); }

  function showScene(name) {

  // --- who stands where -------------------------------------------------

  }

  // Nearer the front, drawn later: whoever walks behind somebody goes
  // behind them.
  function sortFigs() {
    var kids = CL.figs.childNodes, list = [], i, ok = true;
    for (i = 0; i < kids.length; i++) {
      for (var j = 0; j < FIGS.length; j++) { if (FIGS[j].root === kids[i]) { list.push(FIGS[j]); break; } }
    }
    for (i = 1; i < list.length; i++) { if (list[i].y < list[i - 1].y - 0.5) { ok = false; break; } }
    if (ok) { return; }
    list.slice().sort(function (a, b) { return a.y - b.y; }).forEach(function (f) { CL.figs.appendChild(f.root); });
  }

  function slotOf(p) { return S.prisoners.indexOf(p); }

  // --- bubbles over heads, numbers that rise -----------------------------
  var FX = [];
  function iconMum() {

      + '<path d="M -22 -8 Q -14 -14 -6 -8 M 6 -8 Q 14 -14 22 -8" stroke="#3a2614" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
      + '<path d="M -15 17 Q 0 21 15 17" stroke="#8a3a2a" stroke-width="5" stroke-linecap="round" fill="none"/>'

      + '<path d="M -15 31 Q -17 50 0 52 Q 17 50 15 31 Z" fill="#e8b48e" stroke="#3a2614" stroke-width="3"/>';

      + '<path d="M 36 -14 L 52 -24 M 39 4 L 58 4 M 36 22 L 52 32" stroke="#3a2614" stroke-width="5" stroke-linecap="round"/>';

      + (kind === 'C' ? iconMum() : iconSnitch()) + '</g></svg>';

  function bubble(f, kind, dir) {
    // Upright there's wall to spare, so the bubbles can be bigger.

    var bx = f.x - dir * 8 * f.s, by = Math.max(f.y - 372 * f.s - (LAY.portrait ? 50 : 0), 74 * s * 0.85);
    var col = kind === 'C' ? '#4f7a45' : '#a3402f';

      + '<path d="M -62 -54 Q -62 -70 -46 -70 L 46 -70 Q 62 -70 62 -54 L 62 34 Q 62 50 46 50 L -6 50 L -30 76 L -26 50 L -46 50 Q -62 50 -62 34 Z" fill="#fbf4e2" stroke="' + col + '" stroke-width="7"/>'
      + '</g><g transform="translate(0,-10) scale(0.92,0.92)">' + '<g transform="scale(' + (dir < 0 ? -1 : 1) + ',1)">' + (kind === 'C' ? iconMum() : iconSnitch()) + '</g></g>';
    CL.fx.appendChild(g);

    FX.push(item);
    paintFx(item);

  }

  function riser(x, y, text, col) {
    var t = el('text', {
      x: 0, y: 0, 'text-anchor': 'middle', fill: col || '#f3e7b6',
      'font-family': 'Georgia, serif', 'font-weight': 700, 'font-size': f1(56 * LAY.s),
      stroke: '#1a1410', 'stroke-width': f1(5 * LAY.s), 'paint-order': 'stroke'
    });
    t.textContent = text;
    CL.fx.appendChild(t);
    var item = { g: t, t: 0, kind: 'rise', x: x, y: y, s: 1 };
    FX.push(item);
    paintFx(item);
  }

  function paintFx(it) {
    if (it.kind === 'pop') {
      var k = reduced ? 1 : Math.min(1, it.t / 0.22);
      var sc = it.s * (reduced ? 1 : (k < 1 ? 0.4 + 0.75 * k : 1 + 0.15 * Math.max(0, 0.35 - (it.t - 0.22)) / 0.35));
      it.g.setAttribute('transform', 'translate(' + f1(it.x) + ',' + f1(it.y) + ') scale(' + sc.toFixed(3) + ')');
    } else {
      var up = reduced ? 0 : it.t * 70 * LAY.s;
      it.g.setAttribute('transform', 'translate(' + f1(it.x) + ',' + f1(it.y - up) + ')');
      it.g.setAttribute('opacity', clamp(1.6 - it.t, 0, 1).toFixed(2));
    }
  }

  function updateFx(dt) {
    for (var i = FX.length - 1; i >= 0; i--) {
      var it = FX[i];
      it.t += dt;
      if (it.kind === 'rise' && it.t > 1.6) { if (it.g.parentNode) { it.g.parentNode.removeChild(it.g); } FX.splice(i, 1); continue; }
      if (it.kind === 'pop' && it.t > 0.6) { continue; }
      paintFx(it);
    }
  }

  function clearBubbles() {
    FX = FX.filter(function (it) {
      if (it.kind === 'pop') { if (it.g.parentNode) { it.g.parentNode.removeChild(it.g); } return false; }
      return true;
    });
  }

  // --- the frame loop ---------------------------------------------------
  // Lamplight wavers a few times a second, not every frame: a big soft
  // gradient repainted sixty times a second is exactly what made the
  // Pixel's screen flicker in Hoot's Postcards.
  var flick = 0, flickNext = 0;
  function flicker(dt) {
    flick += dt;
    if (flick < flickNext) { return; }
    flickNext = flick + 0.13;
    for (var i = 0; i < glowNodes.length; i++) {
      var gnode = glowNodes[i];
      if (gnode.scene !== SCENE) { continue; }
      var v = reduced || gnode.still ? gnode.base : gnode.base * (0.88 + 0.12 * Math.random());
      v = v.toFixed(2);
      if (gnode.last !== v) { gnode.last = v; gnode.node.setAttribute('opacity', v); }
    }
  }

  // A page can start before it knows its own size (a web view still
  // being laid out, a tab opened in the background) and a resize event
  // isn't always sent, so look for ourselves every half second or so.
  var lastFrame = 0, sizeCheck = 0;
  function frame(now) {
    var dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0.016;
    lastFrame = now;
    if (++sizeCheck % 30 === 0 && (window.innerWidth !== LAY.vw || window.innerHeight !== LAY.vh) && window.innerWidth > 0) { layout(); }
    for (var i = 0; i < FIGS.length; i++) {
      var f = FIGS[i];
      if (f.scene === SCENE) { updateFig(f, dt); }
    }
    var dk = doorTarget ? 1 : 0;
    if (doorOpen !== dk) {
      doorOpen = reduced ? dk : clamp(doorOpen + (dk ? dt : -dt) * 2.4, 0, 1);
      paintDoor();
    }
    if (SCENE === 'cell') { sortFigs(); }
    flicker(dt);
    updateRat(dt);
    updateFx(dt);
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------
  // Flow. Each game runs as one long async story, written in the order
  // it happens. Leaving a game bumps RUN; anything still waiting wakes up
  // to find itself stale and quietly unwinds.
  // ------------------------------------------------------------------
  var RUN = 0, ABORT = { abort: true };
  function sleep(ms) {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      setTimeout(function () { if (my !== RUN) { reject(ABORT); } else { resolve(); } }, ms);
    });
  }
  function begin(fn) {
    RUN++;
    resetUI();
    var p = fn();
    if (p && p.catch) {
      p.catch(function (e) { if (e !== ABORT) { console.error(e); } });
    }
  }

  var speechEl = $('speech'), sFace = speechEl.querySelector('.face'), sWho = speechEl.querySelector('.who'), sTxt = speechEl.querySelector('.txt');
  var tapper = $('tapper'), barEl = $('bar'), panelEl = $('panel'), cardEl = $('card'), curtainEl = $('curtain'), fadeEl = $('fade');
  var onTap = null, panelHandler = null;

  function resetUI() {
    hideSpeech(); hideBar(); hidePanel();
    cardEl.classList.remove('show'); cardEl.innerHTML = '';
    curtainEl.classList.remove('show'); curtainEl.innerHTML = '';
    tapper.classList.remove('show');
    onTap = null;
    clearBubbles();
    skipWalks();
  }
  function hideSpeech() {
    speechEl.classList.remove('show', 'done');
    FIGS.forEach(function (f) { f.talking = false; });
  }
  function hideBar() { barEl.classList.remove('show'); barEl.innerHTML = ''; }
  function hidePanel() { panelEl.className = ''; panelEl.innerHTML = ''; panelHandler = null; }

  function tap() { if (onTap) { onTap(); } }
  tapper.addEventListener('click', function () { initAudio(); tap(); });
  speechEl.addEventListener('click', function () { initAudio(); tap(); });
  cardEl.addEventListener('click', function () { initAudio(); tap(); });
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) { return; }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); initAudio(); tap(); }
  });

  // Who is talking: a name, a face, a voice, and a body in the scene to
  // move its mouth.
  function speakerOf(x) {
    if (!x) { return null; }
    if (typeof x === 'string') {
      var L = LOOKS[x];
      return { name: L.name, look: x, fig: x === 'gov' ? GOV : FIG[x], voice: L.voice };
    }
    return { name: x.name, look: x.look, fig: FIG[x.id], voice: LOOKS[x.look].voice };
  }

  function parseText(text) {
    var out = [], re = /\*([^*]+)\*/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) { out.push({ t: text.slice(last, m.index), b: false }); }
      out.push({ t: m[1], b: true });
      last = re.lastIndex;
    }
    if (last < text.length) { out.push({ t: text.slice(last), b: false }); }
    return out;
  }
  function renderSegs(segs, n) {
    var h = '', left = n;
    for (var i = 0; i < segs.length && left > 0; i++) {
      var part = segs[i].t.slice(0, left);
      left -= part.length;
      h += segs[i].b ? '<b>' + esc(part) + '</b>' : esc(part);
    }
    return h;
  }

  function lookAllAt(f) {
    FIGS.forEach(function (o) {
      if (o === f || o.scene !== f.scene || o.walking) { return; }
      o.lookT = clamp((f.x - o.x) / 120, -1, 1);
    });
  }

  function say(speaker, text, opts) {
    opts = opts || {};
    var my = RUN, sp = speakerOf(speaker);
    return new Promise(function (resolve, reject) {
      hideBar();
      speechEl.classList.add('show');
      speechEl.classList.remove('done');
      speechEl.classList.toggle('noface', !sp);
      if (sp) {
        if (opts.expr && sp.fig) { setExpr(sp.fig, opts.expr); }
        sFace.innerHTML = headSVG(sp.look, opts.expr || (sp.fig ? sp.fig.expr : null));
        sWho.textContent = sp.name;
      }
      var segs = parseText(text), total = 0, shown = 0, doneAt = 0, timer = 0, fin = false;
      segs.forEach(function (s) { total += s.t.length; });
      FIGS.forEach(function (o) { o.talking = false; });
      if (sp && sp.fig) {
        sp.fig.talking = true;
        if (sp.fig.scene === SCENE) { lookAllAt(sp.fig); }
      }
      function render() { sTxt.innerHTML = renderSegs(segs, shown); }
      function finish() {
        clearTimeout(timer);
        shown = total; render();
        fin = true; doneAt = Date.now();
        speechEl.classList.add('done');
        if (sp && sp.fig) { sp.fig.talking = false; }
      }
      function tick() {
        if (my !== RUN) { return; }
        shown = Math.min(total, shown + 1);
        if (sp && shown % 2 === 0) { blip(sp.voice); }
        render();
        if (shown >= total) { finish(); } else { timer = setTimeout(tick, 24); }
      }
      onTap = function () {
        if (!fin) { finish(); return; }
        if (Date.now() - doneAt < 260) { return; }
        onTap = null;
        tapper.classList.remove('show');
        if (my !== RUN) { reject(ABORT); return; }
        resolve();
      };
      tapper.classList.add('show');
      render();
      timer = setTimeout(tick, 50);
    });
  }

  // --- the deal, chalked up ------------------------------------------------
  function tallyMarks(n) {
    if (n <= 0) { return '<span class="tal"></span>'; }
    var p = '';
    for (var i = 0; i < Math.min(n, 4); i++) { p += 'M ' + (4 + i * 7) + ' 2 L ' + (4 + i * 7) + ' 12 '; }

  }

  function dealHTML(you, them, mods) {
    mods = mods || {};
    var sw = mods.sweet ? 1 : 0, th = mods.threat ? 1 : 0;
    // [your months, their months] for: you mum/they mum, you mum/they snitch, you snitch/they mum, both snitch
    var cells = [[1, 1], [3 + th, 0], [-sw, 3], [2 - sw, 2]];
    function cls(n) { return n <= 0 ? 'best' : (n >= 3 ? 'worst' : ''); }
    function mini(look, n) {
      return '<div class="m"><span class="face40">' + headSVG(look) + '</span><span class="num ' + cls(n) + '">' + (n < 0 ? '−' + (-n) : n) + '</span>' + tallyMarks(n) + '</div>';
    }
    function cell(c) { return '<div class="c">' + mini(you, c[0]) + mini(them, c[1]) + '</div>'; }
    var themF = '<span class="face40">' + headSVG(them) + '</span>', youF = '<span class="face40">' + headSVG(you) + '</span>';
    return '<div class="deal">'
      + '<div></div>'
      + '<div class="h">' + themF + iconSVG('C') + '<span>' + (mods.themName ? esc(mods.themName) + ' keeps' : 'keeps') + ' mum</span></div>'
      + '<div class="h">' + themF + iconSVG('D') + '<span>' + (mods.themName ? esc(mods.themName) + ' snitches' : 'snitches') + '</span></div>'
      + '<div class="h">' + youF + iconSVG('C') + '<span>' + (mods.youName ? esc(mods.youName) + ' keeps' : 'you keep') + ' mum</span></div>'
      + cell(cells[0]) + cell(cells[1])
      + '<div class="h">' + youF + iconSVG('D') + '<span>' + (mods.youName ? esc(mods.youName) + ' snitches' : 'you snitch') + '</span></div>'
      + cell(cells[2]) + cell(cells[3])
      + '</div>';
  }

  // --- poking things in the cell ----------------------------------------
  var pokeAt = {};
  svg.addEventListener('pointerdown', function (ev) {
    initAudio();
    var t = ev.target && ev.target.closest ? ev.target.closest('[data-hit]') : null;
    if (!t) { return; }

    if (kind === 'rat') { scareRat(); return; }
    if (kind === 'fig') {
      var f = null, id = t.getAttribute('data-id');
      FIGS.forEach(function (o) { if (o.root === t) { f = o; } });
