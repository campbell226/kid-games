  });
  svg.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

  // ------------------------------------------------------------------
  // The rules.
  //
  // Every night, for every pair of prisoners:
  //   both keep mum         one month each
  //   one snitches          the snitch none, the other three
  //   both snitch           two months each
  // Whatever the other does, snitching saves a month. And when both do
  // what saves them a month, both lose one. That is the whole dilemma.
  // ('C' and 'D' are the textbook's cooperate and defect.)
  // ------------------------------------------------------------------
  function months(me, them) { return me === 'C' ? (them === 'C' ? 1 : 3) : (them === 'C' ? 0 : 2); }

  // How the computer's cellmates make up their minds: from what they did,
  // and what was done to them, night by night.
  var STRATS = {
    sam: function () { return 'C'; },
    nell: function () { return 'D'; },
    jack: function (my, their) { return their.length ? their[their.length - 1] : 'C'; },
    grim: function (my, their) { return their.indexOf('D') >= 0 ? 'D' : 'C'; },
    meg: function () { return Math.random() < 0.5 ? 'C' : 'D'; },
    sid: function (my, their) {
      var n = my.length;
      if (n === 0) { return 'D'; }
      var k = their.indexOf('D');
      if (k >= 0) { return n === k + 1 ? 'C' : their[n - 1]; }
      return n % 2 === 0 ? 'D' : 'C';
    }
  };
  var RULES = {
    sam: 'never snitches, whatever you do',
    nell: 'snitches every single night, and swears she won’t',
    jack: 'keeps mum the first night, then does whatever you did the night before',
    grim: 'keeps mum until you snitch once, then snitches for ever',
    meg: 'tosses a coin',
    sid: 'snitches the first night to test you, then plays fair if you hit back'
  };

  var S = null;

  function freshState(mode) {
    return { v: 1, mode: mode, night: 1, prisoners: [], mv: {}, log: [], seen: {}, inGame: true };
  }
  function addPrisoner(p) {
    S.mv[p.id] = S.mv[p.id] || {};
    S.prisoners.forEach(function (q) { S.mv[p.id][q.id] = []; S.mv[q.id][p.id] = []; });
    p.months = p.months || 0;
    p.shown = p.months;
    S.prisoners.push(p);
  }
  function others(p) { return S.prisoners.filter(function (q) { return q !== p; }); }
  function byId(id) { for (var i = 0; i < S.prisoners.length; i++) { if (S.prisoners[i].id === id) { return S.prisoners[i]; } } return null; }
  function humans() { return S.prisoners.filter(function (p) { return p.human; }); }

  function aiChoose(p) {
    var mv = S.tonight.moves[p.id] = {};
    others(p).forEach(function (q) { mv[q.id] = STRATS[p.strat](S.mv[p.id][q.id], S.mv[q.id][p.id]); });
  }

  // Work out the night: who did what to whom, and what it costs.
  function resolveNight() {
    var P = S.prisoners, mv = S.tonight.moves, tr = S.tonight.trick || null;
    var res = { pairs: [], delta: {}, trick: tr, sweetTook: false, threatHit: 0 };
    P.forEach(function (p) { res.delta[p.id] = 0; });
    for (var i = 0; i < P.length; i++) {
      for (var j = i + 1; j < P.length; j++) {
        var a = P[i], b = P[j], ma = mv[a.id][b.id], mb = mv[b.id][a.id];
        var da = months(ma, mb), db = months(mb, ma), xa = 0, xb = 0;
        if (tr && tr.type === 'threat') {
          if (tr.target === a.id && ma === 'C' && mb === 'D') { xa = 1; }
          if (tr.target === b.id && mb === 'C' && ma === 'D') { xb = 1; }
        }
        res.threatHit += xa + xb;
        res.pairs.push({ a: a, b: b, ma: ma, mb: mb, da: da + xa, db: db + xb, xa: xa, xb: xb });
        res.delta[a.id] += da + xa;
        res.delta[b.id] += db + xb;
        S.mv[a.id][b.id].push(ma);
        S.mv[b.id][a.id].push(mb);
      }
    }
    P.forEach(function (p) { p.months += res.delta[p.id]; });
    if (tr && tr.type === 'sweet') {
      var t = byId(tr.target);
      if (t) {
        var any = others(t).some(function (q) { return mv[t.id][q.id] === 'D'; });
        if (any) { res.sweetTook = true; t.months = Math.max(0, t.months - 1); }
      }
    }
    S.log.push({ night: S.night, moves: JSON.parse(JSON.stringify(mv)), trick: tr });
    return res;
  }

  function totalMonths() { var t = 0; S.prisoners.forEach(function (p) { t += p.months; }); return t; }

  // --- saving between nights ---------------------------------------------
  function save() {
    if (!S) { return; }
    try {
      var c = JSON.parse(JSON.stringify(S));
      delete c.tonight;
      store(SAVE_KEY, JSON.stringify(c));
    } catch (e) {}
  }
  function loadSave() {
    var raw = fetchStore(SAVE_KEY);
    if (!raw) { return null; }
    try {
      var s = JSON.parse(raw);
      if (s && s.v === 1 && s.prisoners && s.prisoners.length) { return s; }
    } catch (e) {}
    return null;
  }
  function clearSave() { store(SAVE_KEY, null); }

  // --- Moll's lessons ----------------------------------------------------
  function duck() { return S.mode === 'story' ? 'my duck' : 'my ducks'; }
  function pal() { return S.mode === 'story' ? 'your cellmate' : 'your pal'; }

  function lessonFirst(res) {
    var P = res.pairs;
    if (P.length === 1) {
      var q = P[0];
      if (q.ma === 'C' && q.mb === 'C') {
        return [['moll', 'Look at that! Both kept mum. One month each. That’s the best the two of you can do together.']];
      }
      if (q.ma === 'D' && q.mb === 'D') {
        return [['moll', 'Both snitched on each other! Two months each, when keeping mum would’ve got you one apiece. Funny old game.']];
      }
      var sn = q.ma === 'D' ? q.a : q.b, vic = q.ma === 'D' ? q.b : q.a;
      return [['moll', 'Ooh. That stings, don’t it? ' + vic.name + ' kept mum, and ' + sn.name + ' snitched.'],
        ['moll', 'Three months for ' + vic.name + '. Nothing at all for ' + sn.name + '.']];
    }
    var cc = 0, dd = 0;
    P.forEach(function (q) { if (q.ma === 'C' && q.mb === 'C') { cc++; } if (q.ma === 'D' && q.mb === 'D') { dd++; } });
    if (cc === P.length) { return [['moll', 'Every one of you kept mum for every other one! That’s the best you can all do.']]; }
    if (dd === P.length) { return [['moll', 'Snitches, the lot of you! Everybody snitched on everybody.']]; }
    return [['moll', 'Some kept mum, some snitched. Look at them walls: you can see who’s been stung.']];
  }

  var LESSONS = {
    logic: function () {
      return [
        ['moll', 'Now here’s the rotten bit. Think about it from where you sit.'],
        ['moll', 'Suppose ' + pal() + ' keeps mum. If you snitch, you get *none* instead of one. So snitching’s better.'],
        ['moll', 'Suppose ' + pal() + ' snitches. If you snitch too, you get *two* instead of three. Snitching’s better again!'],
        ['moll', 'Whatever they do, snitching saves you a month. And they’re sat there thinking the very same thing about you.'],
        ['moll', 'So you both snitch... and you both get two months, when you could’ve both had one.'],
        ['moll', 'That’s the trap, ' + duck() + '. Each one doing what’s best for themselves, and both ending up worse off.']
      ];
    },
    multi: function () {
      return [
        ['moll', 'With more of you, it’s harder still. Every one of you has to trust every other one.'],
        ['moll', 'One snitch can turn the whole cell sour.']
      ];
    },
    future: function () {
      return [
        ['moll', 'But this ain’t just one night, is it? You’ll be up those stairs again tomorrow. And the night after.'],
        ['moll', 'And they’ll remember what you did tonight. A snitch might save you a month now. What’s it going to cost you later?']
      ];
    },
    talk: function () {
      return [
        ['moll', 'Go on then, make your promises. Talk’s cheap in Grimstone.'],
        ['moll', 'Anyone can *say* they’ll keep mum. It’s what they do up those stairs that counts.']
      ];
    },
    end: function () {
      return [
        ['moll', 'Ever wondered why nobody tells you when the judge is coming?'],
        ['moll', 'If you knew tonight was the last night, you’d snitch. Why not? There’d be no tomorrow to pay for it.'],
        ['moll', 'And ' + pal() + ' would know you’d snitch on the last night... so they’d snitch the night before. Then you’d snitch the night before that...'],
        ['moll', 'All the way back to the very first night! Not knowing when it ends is what keeps folk honest.']
      ];
    },
    tft: function (x, y) {
      return [
        ['moll', 'Did you see that? ' + y.name + ' snitched on ' + x.name + ' last night, so tonight ' + x.name + ' snitched right back. *Tit for tat!*'],
        ['moll', 'You do it to me, I do it to you. Some say that’s the fairest way there is.']
      ];
    },
    forgive: function (x, y) {
      return [
        ['moll', 'Now that’s something. ' + y.name + ' snitched on ' + x.name + ' last night... and tonight ' + x.name + ' kept mum for them anyway.'],
        ['moll', 'Forgiving’s risky. But somebody’s got to stop a feud before it starts.']
      ];
    },
    mug: function (x, y) {
      return [
        ['moll', y.name + '’s snitched on ' + x.name + ' two nights running, and ' + x.name + ' keeps on keeping mum.'],
        ['moll', 'That ain’t kindness, that’s being a *mug*. Being nice is good. Being a doormat ain’t.']
      ];
    },
    feud: function (x, y) {
      return [
        ['moll', x.name + ' and ' + y.name + ' are at it like cats in a sack. Two nights of snitching on each other.'],
        ['moll', 'Two months each, every night. You’re both losing. Somebody’s got to keep mum first, and hope the other one notices.']
      ];
    },
    trust: function (x, y) {
      return [
        ['moll', 'Three nights of ' + x.name + ' and ' + y.name + ' keeping mum for each other. Lovely.'],
        ['moll', 'That’s how trust works in here. Slow to build. Quick to break.']
      ];
    }
  };

  // What happened tonight that's worth a word? Looks at each prisoner's
  // choice about each other one, against the nights before.
  function eventsTonight() {
    var ev = [];
    S.prisoners.forEach(function (x) {
      others(x).forEach(function (y) {
        var a = S.mv[x.id][y.id], b = S.mv[y.id][x.id], n = a.length;
        if (n < 2) { return; }
        var me = a[n - 1], meBefore = a[n - 2], them = b[n - 1], themBefore = b[n - 2];
        if (themBefore === 'D' && meBefore === 'C' && me === 'D') { ev.push({ k: 'tft', x: x, y: y }); }
        if (themBefore === 'D' && me === 'C') { ev.push({ k: 'forgive', x: x, y: y }); }
        if (me === 'C' && meBefore === 'C' && them === 'D' && themBefore === 'D') { ev.push({ k: 'mug', x: x, y: y }); }
        if (x.id < y.id && me === 'D' && meBefore === 'D' && them === 'D' && themBefore === 'D') { ev.push({ k: 'feud', x: x, y: y }); }
        if (n >= 3 && x.id < y.id && a.slice(-3).join('') === 'CCC' && b.slice(-3).join('') === 'CCC') { ev.push({ k: 'trust', x: x, y: y }); }
      });
    });
    return ev;
  }

  // --- the computer cellmates' patter --------------------------------------
  function chatter(p, t) {
    var mine = S.mv[p.id][t.id] || [], theirs = S.mv[t.id][p.id] || [], n = mine.length;
    var lastThem = theirs[n - 1], crossed = theirs.indexOf('D') >= 0;
    switch (p.strat) {
      case 'sam':
        if (lastThem === 'D') { return 'You snitched on me… I still won’t snitch on you, though. I couldn’t.'; }
        return n === 0 ? 'I’ll keep mum, I promise. I always keep mum.' : pick(['I don’t like snitching. It’s not nice.', 'Keep mum, eh? It’s nicer that way.']);
      case 'nell':
        return n === 0 ? 'I’ll keep mum for you tonight. Cross my heart.' : pick(['Course I kept mum. Must be a mistake in his book.', 'Trust me, ducky. Tonight I’ll keep mum. Promise.', 'Don’t look at me like that. Tonight’s different.']);
      case 'jack':
        if (n === 0) { return 'Keep mum for me and I’ll keep mum for you. Simple as that.'; }
        return lastThem === 'D' ? 'You snitched on me last night. So you know what’s coming.' : 'You kept mum for me last night. I won’t forget it.';
      case 'grim':
        if (crossed) { return theirs.indexOf('D') === n - 1 ? 'You crossed me. I’ll never trust you again. Never.' : 'Don’t bother talking to me.'; }
        return pick(['Keep mum for me and I’ll keep mum for you. Till the end of time.', 'We’re square, you and me. Let’s keep it that way.']);
      case 'meg':
        return pick(['Heads or tails? Heads or tails?!', 'I might keep mum. I might not! Ha!', 'Even I don’t know what I’ll do! Ha ha!', 'The penny decides, my lovely. Always the penny.']);
      case 'sid':
        if (n === 0) { return 'Trust me, friend. I always look after my friends.'; }
        return crossed ? 'No hard feelings, eh? Let’s play fair from now on.' : 'You’re a good sort. Too good, some might say.';
    }
    return '';
  }

  // ...and what they say when the truth comes out. Keyed by what happened
  // to them: both kept mum, they got away with it, they got stung, or
  // both snitched. Some never happen: Sam never snitches, Nell always does.
  var QUIPS = {
    sam: { cc: ['We both kept mum! That’s nice.'], lost: ['Oh... That wasn’t very nice.', 'Three months... oh dear.'] },
    nell: { won: ['Ha! Never trust a Nell, sweetheart.', 'Told you I’d keep mum. I lied.'], dd: ['Well, well. Look who’s learning.'] },
    jack: { cc: ['Good. That’s how it should be.'], won: ['You had that coming.'], lost: ['So that’s how it is. Right.'], dd: ['You snitch, I snitch. Fair’s fair.'] },
    grim: { cc: ['Hmph. Good.'], won: ['I warned you.'], lost: ['That’s it. Never again. NEVER.'], dd: ['Snitch away. I’ll snitch right back. For ever.'] },
    meg: { cc: ['Heads! Ha ha!'], won: ['Tails! Whoops! Ha ha!'], lost: ['Ooh, you rotter! Ha!'], dd: ['Tails and tails! Ha ha ha!'] },
    sid: { cc: ['There. Friends after all.'], won: ['Nothing personal, friend. Just testing.', 'Too easy.'], lost: ['Ah. You’ve got teeth. Good.'], dd: ['Fair enough. You’ve got teeth.'] }
  };
  function quip(p, me, them) {
    var k = me === 'C' ? (them === 'C' ? 'cc' : 'lost') : (them === 'C' ? 'won' : 'dd');
    var set = QUIPS[p.strat] && QUIPS[p.strat][k];
    return set ? pick(set) : null;
  }

  // --- reading a player's style --------------------------------------------
  function styleOf(pid) {
    var mv = S.mv[pid] || {}, n = 0, d = 0, firsts = [], copy = 0, copyN = 0, afterD = 0, afterDD = 0, afterC = 0, afterCD = 0, fN = 0, f = 0;
    Object.keys(mv).forEach(function (q) {
      var mine = mv[q], theirs = (S.mv[q] && S.mv[q][pid]) || [];
      mine.forEach(function (m, k) {
        n++;
        if (m === 'D') { d++; }
        if (k === 0) { firsts.push(m); return; }
        var prev = theirs[k - 1];
        copyN++;
        if (m === prev) { copy++; }
        if (prev === 'D') { afterD++; if (m === 'D') { afterDD++; } } else { afterC++; if (m === 'D') { afterCD++; } }
        if (k >= 2 && theirs[k - 2] === 'D' && prev === 'C') { fN++; if (m === 'C') { f++; } }
      });
    });
    if (!n) { return 'none'; }
    if (d === 0) { return 'loyal'; }
    if (d === n) { return 'rotter'; }
    var nice = firsts.every(function (m) { return m === 'C'; });
    var retal = afterD ? afterDD / afterD : 0, exploit = afterC ? afterCD / afterC : 0;
    if (nice && copyN >= 2 && copy / copyN >= 0.8) { return 'tft'; }
    if (exploit >= 0.4) { return 'sneak'; }
    if (retal >= 0.6 && fN >= 1 && f / fN < 0.5) { return 'grudger'; }
    if (retal >= 0.6 && exploit <= 0.2) { return 'tft'; }
    if (d / n <= 0.25) { return 'kind'; }
    return 'mixed';
  }

  function styleLine(style, name, you) {
    var N = you ? 'You' : name, w = you ? 'were' : 'was';
    switch (style) {
      case 'loyal': return N + ' never snitched once. Loyal as a dog. Mind, dogs get kicked.';
      case 'rotter': return N + ' snitched every single time. Nobody in here will share a crust with ' + (you ? 'you' : name) + ' now.';
      case 'tft': return N + ' played tit for tat: kind till crossed, quick to hit back, quick to forgive. The canniest way there is.';
      case 'sneak': return N + ' liked snitching on folk who’d kept mum. Sneaky. It pays for a night or two.';
      case 'grudger': return N + ' held grudges. Cross ' + (you ? 'you' : name) + ' once and that was that.';
      case 'kind': return N + ' kept mum nearly always, and only snitched now and then.';
      case 'mixed': return N + ' ' + w + ' a bit of everything. Hard to read, and that cuts both ways.';
    }
    return '';
  }

  // --- Moll's great tally: every cellmate against every other ----------------
  function playMatch(a, b, n) {
    var ha = [], hb = [], ma = 0, mb = 0;
    for (var k = 0; k < n; k++) {
      var ca = STRATS[a](ha, hb), cb = STRATS[b](hb, ha);
      ha.push(ca); hb.push(cb);
      ma += months(ca, cb); mb += months(cb, ca);
    }
    return [ma, mb];
  }
  function tournament(nights) {
    var tot = {};
    MATES.forEach(function (a) { tot[a] = 0; });
    for (var i = 0; i < MATES.length; i++) {
      for (var j = i; j < MATES.length; j++) {
        var a = MATES[i], b = MATES[j], reps = (a === 'meg' || b === 'meg') ? 80 : 1, sa = 0, sb = 0;
        for (var r = 0; r < reps; r++) {
          var m = playMatch(a, b, nights);
          sa += m[0]; sb += m[1];
        }
        tot[a] += sa / reps;
        if (i !== j) { tot[b] += sb / reps; }
      }
    }
    return tot;
  }

  // ------------------------------------------------------------------
  // The cast on stage.
  // ------------------------------------------------------------------
  function ensureFig(p) {
    if (FIG[p.id]) { return FIG[p.id]; }
    var f = makeFigure(p.look);
    f.persp = 1;
    FIG[p.id] = f;
    CL.figs.appendChild(f.root);
    return f;
  }
  function dropFig(id) {
    var f = FIG[id];
    if (!f) { return; }
    if (f.root.parentNode) { f.root.parentNode.removeChild(f.root); }
    var k = FIGS.indexOf(f);
    if (k >= 0) { FIGS.splice(k, 1); }
    delete FIG[id];
  }
  function dropAllPrisoners() {
    Object.keys(FIG).forEach(function (id) { if (id !== 'moll' && id !== 'key') { dropFig(id); } });
  }
  function restFace(p) {
    var f = FIG[p.id], L = LOOKS[p.look];
    if (!f) { return; }
    setExpr(f, L.rest || 'neutral');
    setPose(f, L.rest === 'cross' ? 'cross' : 'rest');
    f.shake = 0;
    f.lookT = 0;
  }
  function setupCell() {
    dropAllPrisoners();
    S.prisoners.forEach(function (p) {
      var f = ensureFig(p);
      f.away = false; f.op = 1; f.shown = true;
      restFace(p);
    });
    LAY.n = S.mode === 'story' ? 2 : S.prisoners.length;
    layout();
    showScene('cell');
    drawKnitting(FIG.moll, S.night);
  }

  var hurry = false;
  function walkSpeed() { return 340 * Math.max(LAY.s, 0.8); }
  // The way across the cell: in front of everybody when they stand in a
  // row, behind the front row when the cell is deep.
  function lane() { return LAY.portrait ? LAY.backY + (LAY.floorY - LAY.backY) * 0.3 : LAY.floorY + 6 * LAY.s; }
  // He keeps to the doorway, so nobody has to walk through him.
  function keySpot() { return { x: LAY.doorCx, y: LAY.backY + 12 * LAY.s }; }

  async function walking(promises) {
    tapper.classList.add('show');
    onTap = function () { hurry = true; skipWalks(); };
    await Promise.all(promises);
    onTap = null;
    tapper.classList.remove('show');
    await sleep(0);
  }

  function walkTo(f, pts, speed) {
    CL.figs.appendChild(f.root);
    if (hurry) { var e = pts[pts.length - 1]; f.x = e.x; f.y = e.y; f.op = e.op === undefined ? 1 : e.op; return Promise.resolve(); }
    return walk(f, pts, speed || walkSpeed());
  }

  // The turnkey comes in with his lantern and stands aside by the door.
  async function keyIn() {
    var k = FIG.key, sp = keySpot();
    k.shown = true; k.op = 0;
    k.x = LAY.doorCx; k.y = LAY.backY - 2;
    await setDoor(1);
    await walking([walkTo(k, [{ x: sp.x, y: sp.y, op: 1 }], 50 * LAY.s)]);
    k.lookT = -1;
  }
  async function keyOut() {
    var k = FIG.key;
    await walking([walkTo(k, [{ x: LAY.doorCx, y: LAY.backY - 2, op: 0 }], 50 * LAY.s)]);
    k.shown = false;
    await setDoor(0);
  }

  function exitPath(f) {
    return [{ x: f.x, y: lane() }, { x: LAY.doorCx, y: lane() }, { x: LAY.doorCx, y: LAY.backY + 6, op: 1 }, { x: LAY.doorCx, y: LAY.backY - 2, op: 0 }];
  }
  function entryPath(i) {
    var x = LAY.xs[i];
    return [{ x: LAY.doorCx, y: LAY.backY + 6, op: 1 }, { x: LAY.doorCx, y: lane() }, { x: x, y: lane() }, { x: x, y: LAY.floorY }];
  }

  async function walkOut(list) {
    showScene('cell');
    hurry = false;
    await keyIn();
    if (!S.seen.keyIntro) {
      S.seen.keyIntro = 1;
      await say('key', S.mode === 'story' ? 'Up you get, the pair of you. The Governor wants a word.' : 'Up you get, the lot of you. The Governor wants a word.');
      hideSpeech();
    } else { keys(); }
    var order = (list || S.prisoners).slice().sort(function (a, b) { return slotOf(b) - slotOf(a); });
    var ps = [];
    for (var i = 0; i < order.length; i++) {
      var f = FIG[order[i].id];
      (function (f) {
        ps.push(walkTo(f, exitPath(f)).then(function () { f.away = true; }));
      })(f);
      if (!hurry && !reduced) { await sleep(420); }
    }
    await walking(ps);
    await keyOut();
    hurry = false;
    await fade(1);
  }

  async function walkIn(list, keyHere) {
    hurry = false;
    var ps = [];
    (list || S.prisoners).forEach(function (p) {
      var f = FIG[p.id];
      f.away = true; f.op = 0; f.x = LAY.doorCx; f.y = LAY.backY - 2; f.shown = true;
    });
    if (!keyHere) { await keyIn(); }
    var order = (list || S.prisoners).slice().sort(function (a, b) { return slotOf(a) - slotOf(b); });
    for (var i = 0; i < order.length; i++) {
      (function (p) {
        var f = FIG[p.id];
        ps.push(walkTo(f, entryPath(slotOf(p))).then(function () { f.away = false; f.lookT = 0; }));
      })(order[i]);
      if (!hurry && !reduced) { await sleep(420); }
    }
    await walking(ps);
    await keyOut();
    hurry = false;
  }

  // ------------------------------------------------------------------
  // A night, from talk to tally.
  // ------------------------------------------------------------------
  async function talkTime() {
    showScene('cell');
    S.prisoners.forEach(restFace);
    if (S.night === 2 && !S.seen.talk) {
      S.seen.talk = 1;
      await talk(LESSONS.talk());
    }
    var ai = S.prisoners.filter(function (p) { return !p.human; }), hs = humans();
    if (ai.length && hs.length) {
      var p = pick(ai), t = pick(hs), f = FIG[p.id], ft = FIG[t.id];
      if (f && ft) { f.lookT = ft.x > f.x ? 1 : -1; }
      await say(p, chatter(p, t));
    }
    await ask([{ label: 'Off to the Governor', value: 1, icon: ICON_KEY }]);
  }

  async function interrogations() {
    await walkOut();
    S.tonight = { moves: {}, trick: null };
    var hs = humans(), gh = S.gov.kind === 'human', many = hs.length + (gh ? 1 : 0) >= 2;
    showScene('room');
    setExpr(GOV, 'smirk');
    if (many) { fadeEl.classList.remove('on'); }
    if (gh) {
      if (many) { await curtain('gov', 'Pass to ' + (/^(the )?governor$/i.test(S.gov.name) ? 'the Governor' : S.gov.name), 'Prisoners: look away!', 'I’m the Governor'); }
      else { await fade(0); }
      await governorTurn();
    } else if (S.gov.kind === 'crafty') {
      craftyTrick();
    }
    for (var i = 0; i < S.prisoners.length; i++) {
      var p = S.prisoners[i];
      if (!p.human) { aiChoose(p); continue; }
      if (many) { await curtain(p.look, 'Pass to ' + p.name, 'Everyone else: look away!', 'I’m ' + p.name); }
      else if (fadeEl.classList.contains('on')) { await fade(0); }
      await interrogate(p);
    }
    if (many) {
      await curtain(null, 'Everyone back to the cell!', 'Put the phone where you can all see it.', 'Back to the cell');
      fadeEl.classList.add('on');
    } else {
      await fade(1);
    }
    hideSpeech();
  }

  function lastMove(p, q) { var a = S.mv[p.id][q.id]; return a[a.length - 1]; }

  function govLines(p) {
    var os = others(p), L = [], one = os.length === 1 ? os[0] : null;
    if (!S.seen['met-' + p.id]) {
      S.seen['met-' + p.id] = 1;
      L.push('Ah. ' + p.name + '. Sit down, sit down.');
      L.push(one ? one.name + '’s in the next room. I’m asking them the very same thing.' : 'The others are being asked about you, right now, one by one.');
      L.push(one ? 'Snitch on ' + one.name + ', and I’ll see you right. Keep mum, and... well. That depends what ' + one.name + ' says about *you*.'
        : 'Snitch on them, and I’ll see you right. Keep mum, and... well. That depends what they say about *you*.');
    } else if (os.some(function (q) { return !S.mv[p.id][q.id].length; })) {
      L.push(one ? 'New cellmate, ' + p.name + '? ' + one.name + '. Let’s see how long you two stay friends.' : 'Some new faces down there, ' + p.name + '. Let’s see how long you all stay friends.');
    } else {
      var by = os.filter(function (q) { return lastMove(q, p) === 'D'; }), on = os.filter(function (q) { return lastMove(p, q) === 'D'; });
      var opts = ['Back again, ' + p.name + '? Let’s see if you’ve learned anything.',
        'Snitch, or keep mum? Choose wisely, ' + p.name + '.',
        'Just between us, ' + p.name + '... nobody need ever know it was you.'];
      if (by.length) { opts.push(by[0].name + ' snitched on you last night, you know. I’d want my own back, if I were you.'); }
      if (on.length) { opts.push('You were very helpful last night, ' + p.name + '. Very helpful indeed.'); }
      if (!by.length && !on.length) { opts.push('Still keeping mum for each other? How touching. It won’t last.'); }
      L.push(pick(opts));
    }
    var tr = S.tonight.trick;
    if (tr && tr.target === p.id) {
      if (tr.type === 'whisper') {
        L.push(one ? 'Between you and me... ' + one.name + '’s already snitched on you. Sang like a canary. So why keep mum?'
          : 'Between you and me... they’ve already snitched on you. Every one of them. So why keep mum?');
      }
      if (tr.type === 'sweet') { L.push('Tell you what, ' + p.name + '. Snitch tonight, and I’ll scratch a month *off* your wall. Can’t say fairer than that.'); }
      if (tr.type === 'threat') { L.push('And mark this. Keep mum and get snitched on, and I’ll add an *extra* month. For wasting my time.'); }
    }
    return L;
  }

  async function interrogate(p) {
    showScene('room');
    setExpr(GOV, 'smirk');
    var lines = govLines(p);
    for (var i = 0; i < lines.length; i++) { await say('gov', lines[i]); }
    var picks = await choicePanel(p);
    S.tonight.moves[p.id] = picks;
    var any = Object.keys(picks).some(function (k) { return picks[k] === 'D'; });
    setExpr(GOV, any ? 'grin' : 'cross');
    await say('gov', any ? pick(['Very sensible. Very sensible indeed. Take them down!', 'There, that wasn’t so hard. Take them away!'])
      : pick(['Hmph. Have it your own way. Take them down!', 'Mum, is it? We’ll see. Take them away!']));
    hideSpeech();
  }

  function choicePanel(p) {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      var os = others(p), picks = {}, tr = S.tonight.trick;
      var mods = tr && tr.target === p.id ? { sweet: tr.type === 'sweet', threat: tr.type === 'threat' } : {};
      var armedAt = Date.now() + 350;
      function html() {
        var h = '<h2>' + esc(p.name) + ': keep mum, or snitch?</h2>';
        if (mods.sweet) { h += '<p class="sub">The Governor’s offer: snitch on anyone tonight, and a month comes off your wall.</p>'; }
        if (mods.threat) { h += '<p class="sub">The Governor’s threat: keep mum and get snitched on, and it’s an extra month.</p>'; }
        os.forEach(function (q) {
          var c = picks[q.id];
          h += '<div class="row"><div class="who"><span class="face64">' + headSVG(q.look) + '</span><span class="nm">' + esc(q.name) + '</span></div><div class="opts">'
            + '<button class="btn mum choice' + (c === 'C' ? ' on' : (c ? ' dim' : '')) + '" data-act="C:' + q.id + '">' + iconSVG('C') + '<span>Keep mum</span></button>'
            + '<button class="btn snitch choice' + (c === 'D' ? ' on' : (c ? ' dim' : '')) + '" data-act="D:' + q.id + '">' + iconSVG('D') + '<span>Snitch</span></button>'
            + '</div></div>';
        });
        var ready = os.every(function (q) { return picks[q.id]; });
        h += '<div class="btns"><button class="btn quiet" data-act="deal">The deal</button><button class="btn" data-act="done"' + (ready ? '' : ' disabled') + '>Done</button></div>';
        return h;
      }
      function handler(act) {
        if (Date.now() < armedAt) { return; }
        if (act === 'deal') { openDeal(p, os, mods); return; }
        if (act === 'done') {
          if (!os.every(function (q) { return picks[q.id]; })) { return; }
          hidePanel();
          if (my !== RUN) { reject(ABORT); return; }
          resolve(picks);
          return;
        }
        var parts = act.split(':');
        picks[parts[1]] = parts[0];
        blip(parts[0] === 'C' ? 330 : 220);
        var keep = panelEl.scrollTop;
        showPanel(html(), 'desk', handler);
        panelEl.scrollTop = keep;
      }
      showPanel(html(), 'desk', handler);
    });
  }

  // --- the Governor, when somebody plays him ------------------------------
  var TRICK_ICONS = {
    none: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M 14 15 Q 14 9 20 9 Q 26 9 26 15 Q 26 19 20 21 L 20 25" stroke="currentColor" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="20" cy="31" r="2.4" fill="currentColor"/></svg>',
    whisper: '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M 6 8 L 34 8 Q 37 8 37 11 L 37 25 Q 37 28 34 28 L 18 28 L 10 35 L 11 28 L 6 28 Q 3 28 3 25 L 3 11 Q 3 8 6 8 Z" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="12" cy="18" r="2.6" fill="currentColor"/><circle cx="20" cy="18" r="2.6" fill="currentColor"/><circle cx="28" cy="18" r="2.6" fill="currentColor"/></svg>',
    sweet: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="#d9b54e" stroke="#7a5a18" stroke-width="3"/><circle cx="20" cy="20" r="9" fill="none" stroke="#7a5a18" stroke-width="2"/><path d="M 17 15 L 23 15 M 17 25 L 23 25 M 20 13 L 20 27" stroke="#7a5a18" stroke-width="2.4"/></svg>',
    threat: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="13" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="27" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="4"/><path d="M 19 20 L 21 20" stroke="currentColor" stroke-width="4"/></svg>'
  };
  var TRICKS = [
    { k: 'none', name: 'Just ask', what: 'Ask them straight, and see what happens.' },
    { k: 'whisper', name: 'Whisper', what: 'Tell one prisoner the others have already snitched on them.' },
    { k: 'sweet', name: 'Sweetener', what: 'Promise one prisoner a month off if they snitch.' },
    { k: 'threat', name: 'Threat', what: 'Warn one prisoner: keep mum and get snitched on, and it’s an extra month.' }
  ];

  function governorTurn() {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      var choice = 'none', target = null;
      var armedAt = Date.now() + 350;
      function html() {
        var h = '<h2>' + esc(S.gov.name) + ': tonight’s trick</h2>'
          + '<p class="sub">Months handed out so far: <b>' + totalMonths() + '</b>. The more, the better for you.</p>';
        TRICKS.forEach(function (t) {
          h += '<div class="row"><button class="btn' + (choice === t.k ? ' on' : ' quiet') + '" data-act="t:' + t.k + '" style="min-width:9.5em;justify-content:flex-start">' + TRICK_ICONS[t.k] + '<span>' + t.name + '</span></button><span class="sub">' + t.what + '</span></div>';
        });
        if (choice !== 'none') {
          h += '<p><b>On whom?</b></p><div class="btns" style="justify-content:flex-start">';
          S.prisoners.forEach(function (p) {
            h += '<button class="btn' + (target === p.id ? ' on' : ' quiet') + '" data-act="p:' + p.id + '"><span class="face40">' + headSVG(p.look) + '</span><span>' + esc(p.name) + '</span></button>';
          });
          h += '</div>';
        }
        var ready = choice === 'none' || target;
        h += '<div class="btns"><button class="btn" data-act="done"' + (ready ? '' : ' disabled') + '>Done</button></div>';
        return h;
      }
      function handler(act) {
        if (Date.now() < armedAt) { return; }
        if (act === 'done') {
          if (choice !== 'none' && !target) { return; }
          S.tonight.trick = choice === 'none' ? null : { type: choice, target: target };
          hidePanel();
          if (my !== RUN) { reject(ABORT); return; }
          resolve();
          return;
        }
        var parts = act.split(':'), keep = panelEl.scrollTop;
        if (parts[0] === 't') { choice = parts[1]; if (choice === 'none') { target = null; } }
        if (parts[0] === 'p') { target = parts[1]; }
        blip(260);
        showPanel(html(), 'desk', handler);
        // Picking a trick brings up the faces to pick from: show them.
        panelEl.scrollTop = parts[0] === 't' && choice !== 'none' ? panelEl.scrollHeight : keep;
      }
      showPanel(html(), 'desk', handler);
    });
  }

  function craftyTrick() {
    if (S.night < 2 || Math.random() < 0.5) { return; }
    var hs = humans(), pool = hs.length ? hs : S.prisoners;
    S.tonight.trick = { type: pick(['whisper', 'sweet', 'threat']), target: pick(pool).id };
  }

  // --- the reveal --------------------------------------------------------
  function react(f, me, them) {
    if (me === 'C' && them === 'C') {
      setExpr(f, 'happy'); setPose(f, 'cheer'); f.bounce = 1;
      setTimeout(function () { if (f.pose === 'cheer') { setPose(f, 'rest'); } }, 1100);
    } else if (me === 'D' && them === 'C') {
      setExpr(f, 'smirk'); setPose(f, 'cross');
    } else if (me === 'C' && them === 'D') {
      setExpr(f, 'shocked'); setPose(f, 'rest'); f.bounce = 0.5;
      setTimeout(function () { if (f.expr === 'shocked') { setExpr(f, 'angry'); setPose(f, 'fist'); f.shake = 1; } }, 750);
    } else {
      setExpr(f, 'angry'); setPose(f, 'fists'); f.shake = 0.8;
    }
  }

  function outcomeLine(q) {
    var a = '*' + q.a.name + '*', b = '*' + q.b.name + '*';
    if (q.ma === 'C' && q.mb === 'C') { return a + ' and ' + b + ' both kept mum. One month each.'; }
    if (q.ma === 'D' && q.mb === 'D') { return a + ' and ' + b + ' snitched on each other. Two months each.'; }
    var sn = q.ma === 'D' ? q.a : q.b, vic = q.ma === 'D' ? q.b : q.a, extra = q.ma === 'D' ? q.xb : q.xa;
    return '*' + sn.name + '* snitched on *' + vic.name + '*! Nothing for ' + sn.name + '. Three months for ' + vic.name
      + (extra ? ', and one more for the Governor’s threat.' : '.');
  }

  async function revealPair(q, many) {
    var fa = FIG[q.a.id], fb = FIG[q.b.id], s = LAY.s;
    S.prisoners.forEach(function (p) { FIG[p.id].dim = !(p === q.a || p === q.b || !many); });
    fa.lookT = fb.x > fa.x ? 1 : -1;
    fb.lookT = -fa.lookT;
    setExpr(fa, 'worried'); setExpr(fb, 'worried');
    setPose(fa, 'rest'); setPose(fb, 'rest');
    drumroll(0.9);
    await sleep(reduced ? 250 : 950);
    bubble(fa, q.ma, fa.lookT);
    if (q.ma === 'C') { shh(); } else { stab(); setPose(fa, fa.lookT > 0 ? 'pointR' : 'pointL'); }
    await sleep(reduced ? 300 : 700);
    bubble(fb, q.mb, fb.lookT);
    if (q.mb === 'C') { shh(); } else { stab(); setPose(fb, fb.lookT > 0 ? 'pointR' : 'pointL'); }
    await sleep(reduced ? 300 : 750);
    if (q.ma === 'C' && q.mb === 'C') { chordGood(); } else if (q.ma === 'D' && q.mb === 'D') { chordBad(); } else { chordBetray(); }
    react(fa, q.ma, q.mb);
    react(fb, q.mb, q.ma);
    riser(fa.x, fa.y - 400 * s, '+' + q.da, q.da === 0 ? '#b6e69a' : (q.da >= 3 ? '#ff9d88' : '#f3e7b6'));
    riser(fb.x, fb.y - 400 * s, '+' + q.db, q.db === 0 ? '#b6e69a' : (q.db >= 3 ? '#ff9d88' : '#f3e7b6'));
    await Promise.all([countTo(q.a, (q.a.shown || 0) + q.da), countTo(q.b, (q.b.shown || 0) + q.db)]);
    await say(null, outcomeLine(q));
    // A computer cellmate has something to say about it: always on your
    // own, now and then with friends so a big cell doesn't drag.
    var ai = [[q.a, q.ma, q.mb], [q.b, q.mb, q.ma]].filter(function (x) { return !x[0].human && quip(x[0], x[1], x[2]); });
    if (ai.length && (S.mode === 'story' || Math.random() < 0.4)) {
      var w = pick(ai);
      await say(w[0], quip(w[0], w[1], w[2]));
    }
    clearBubbles();
  }

  async function revealNight(res) {
    showScene('cell');
    S.prisoners.forEach(function (p) {
      var f = FIG[p.id];
      f.away = true; f.op = 0; f.x = LAY.doorCx; f.y = LAY.backY;
      restFace(p);
      setPose(f, 'rest', true);
    });
    hideSpeech();
    await fade(0);
    await walkIn();
    if (!S.seen.govReveal) {
      S.seen.govReveal = 1;
      await say('key', 'The Governor’s had his say. Now you’ll hear what you all said about each other.');
    }
    for (var i = 0; i < res.pairs.length; i++) { await revealPair(res.pairs[i], res.pairs.length > 1); }
    S.prisoners.forEach(function (p) { FIG[p.id].dim = false; });
    await revealTrick(res);
    for (var j = 0; j < S.prisoners.length; j++) {
      var p = S.prisoners[j];
      if (p.shown !== p.months) { await countTo(p, p.months); }
    }
    if (res.pairs.length > 1) {
      await say(null, 'Tonight: ' + S.prisoners.map(function (p) { return '*' + p.name + '* +' + res.delta[p.id]; }).join(', ') + '.');
    }
  }

  async function revealTrick(res) {
    var tr = res.trick;
    if (!tr) { return; }
    var t = byId(tr.target);
    if (!t) { return; }
    var os = others(t), one = os.length === 1 ? os[0] : null, mv = S.tonight.moves;
    var L = [];
    if (tr.type === 'whisper') {
      var did = os.filter(function (q) { return mv[q.id][t.id] === 'D'; }).length;
      L.push([null, 'Upstairs, the Governor had whispered to *' + t.name + '*: “' + (one ? one.name + '’s' : 'They’ve') + ' already snitched on you.”']);
      L.push(['moll', did === 0 ? 'And it was a lie! Nobody had. He made it up.'
        : (did === os.length ? 'As it happens, it was true. But he couldn’t have known that. He was guessing.' : 'Some had, some hadn’t. He was only guessing.')]);
      if (!S.seen.trick_whisper) { S.seen.trick_whisper = 1; L.push(['moll', 'Never trust the Governor. He wants snitches, and he’ll say anything to get one.']); }
    } else if (tr.type === 'sweet') {
      L.push([null, 'Upstairs, the Governor had offered *' + t.name + '* a month off for snitching.']);
      L.push([null, res.sweetTook ? t.name + ' snitched, so one month comes off ' + t.name + '’s wall.' : t.name + ' didn’t take the bait.']);
      if (!S.seen.trick_sweet) {
        S.seen.trick_sweet = 1;
        L.push(['moll', 'Sweetening the pot, that’s called. He can’t make you snitch... but he can make it pay.']);
        L.push(['moll', 'Change the prizes, and you change the game.']);
      }
    } else if (tr.type === 'threat') {
      L.push([null, 'Upstairs, the Governor had threatened *' + t.name + '* with an extra month for keeping mum and getting snitched on.']);
      L.push([null, res.threatHit ? 'And that’s just what happened.' : 'It didn’t come to that.']);
      if (!S.seen.trick_threat) { S.seen.trick_threat = 1; L.push(['moll', 'Same trick, other end: make keeping mum more dangerous than snitching.']); }
    }
    for (var i = 0; i < L.length; i++) {
      await say(L[i][0], L[i][1]);
      if (i === 1 && tr.type === 'sweet' && res.sweetTook) { await countTo(t, t.months); }
    }
  }

  async function lessonsAfter(res) {
    var L = [];
    if (!S.seen.first) {
      S.seen.first = 1;
      L = L.concat(lessonFirst(res));
      if (!S.seen.logic) { S.seen.logic = 1; L = L.concat(LESSONS.logic()); }
      if (S.prisoners.length > 2 && !S.seen.multi) { S.seen.multi = 1; L = L.concat(LESSONS.multi()); }
    } else {
      var ev = eventsTonight(), order = ['tft', 'mug', 'forgive', 'feud', 'trust'];
      for (var k = 0; k < order.length; k++) {
        if (S.seen[order[k]]) { continue; }
        var e = null;
        for (var j = 0; j < ev.length; j++) { if (ev[j].k === order[k]) { e = ev[j]; break; } }
        if (e) { S.seen[order[k]] = 1; L = L.concat(LESSONS[order[k]](e.x, e.y)); break; }
      }
      if (!S.seen.future) { S.seen.future = 1; L = L.concat(LESSONS.future()); }
      else if (S.night >= 4 && !S.seen.end) { S.seen.end = 1; L = L.concat(LESSONS.end()); }
    }
    if (L.length) { await talk(L); }
  }

  // --- the end of it ------------------------------------------------------
  function judgeComes() {
    var lng = S.len === 'long', minN = lng ? 7 : 4, chance = lng ? 0.2 : 0.3, cap = lng ? 20 : 12;
    if (S.night >= cap) { return true; }
    if (S.night < minN) { return false; }
    return Math.random() < chance;
  }

  function mumShare() {
    var c = 0, n = 0;
    S.prisoners.forEach(function (p) {
      Object.keys(S.mv[p.id] || {}).forEach(function (q) {
        S.mv[p.id][q].forEach(function (m) { n++; if (m === 'C') { c++; } });
      });
    });
    return n ? c / n : 0;
  }

  function closingRemark(r) {
    if (r >= 0.8) { return 'Well I never. Honour among thieves after all. You did yourselves proud, ' + duck() + '.'; }
    if (r >= 0.5) { return 'Not bad, ' + duck() + '. More mum than snitch. You’ll do.'; }
    if (r >= 0.25) { return 'Hmm. More snitching than mumming. The Governor’s rubbing his hands.'; }
    return 'Honour among thieves? Not in this lot. The Governor’s laughing all the way to the bank.';
  }

  async function assizes() {
    await nightCard('The Assizes', 'The judge has come', true);
    showScene('cell');
    S.prisoners.forEach(restFace);
    await say('key', 'On your feet! The judge is here.');
    await say('moll', closingRemark(mumShare()));
    var sorted = S.prisoners.slice().sort(function (a, b) { return a.months - b.months; });
    var best = sorted[0].months, worst = sorted[sorted.length - 1].months;
    S.prisoners.forEach(function (p) {
      var f = FIG[p.id];
      if (p.months === best) { setExpr(f, 'laugh'); setPose(f, 'cheer'); f.bounce = 1; }
      else if (p.months === worst) { setExpr(f, 'glum'); setPose(f, 'wring'); }
    });
    await resultsFriends(sorted);
  }

  function resultsFriends(sorted) {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      var n = S.prisoners.length, pairs = n * (n - 1) / 2, nights = S.night;
      var best = sorted[0].months, firsts = sorted.filter(function (p) { return p.months === best; });
      var h = '<h1>The Assizes</h1><table class="res">';
      sorted.forEach(function (p) {
        var line = p.human ? styleLine(styleOf(p.id), p.name, false)
          : p.name + ' was the computer: ' + LOOKS[p.look].name + ', who ' + RULES[p.strat] + '.';
        h += '<tr><td style="width:48px"><span class="face40">' + headSVG(p.look, p.months === best ? 'laugh' : null) + '</span></td>'
          + '<td><b>' + esc(p.name) + '</b><br><span class="sub">' + esc(line) + '</span></td>'
          + '<td class="n">' + p.months + ' month' + (p.months === 1 ? '' : 's') + '</td></tr>';
      });
      h += '</table>';
      h += '<p>First out of the door: <b>' + firsts.map(function (p) { return esc(p.name); }).join(' and ') + '</b>' + (firsts.length > 1 ? ', together!' : '!') + '</p>';
      h += '<p>Altogether you served <b>' + totalMonths() + '</b> months in ' + nights + ' night' + (nights === 1 ? '' : 's') + '. If you had all kept mum every night, it would have been <b>' + (nights * pairs * 2) + '</b>. If you had all snitched every night, <b>' + (nights * pairs * 4) + '</b>.</p>';
      if (S.gov.kind === 'human') {
        var gn = /^(the )?governor$/i.test(S.gov.name) ? 'The Governor' : esc(S.gov.name) + ', the Governor,';
        h += '<p>' + gn + ' handed out <b>' + totalMonths() + '</b> months. That was the Governor’s score: the more, the better.</p>';
      }
      h += '<div class="btns"><button class="btn" data-act="notes">What was all that about?</button><button class="btn quiet" data-act="again">Play again</button><button class="btn quiet" data-act="menu">Menu</button></div>';
      showPanel(h, '', function (act) {
        if (my !== RUN) { reject(ABORT); return; }
        if (act === 'notes') { notesPanel(function () { resultsFriends(sorted); }); }
        if (act === 'again') { begin(startFriends); }
        if (act === 'menu') { begin(menu); }
      });
    });
  }

  // ------------------------------------------------------------------
  // A box over everything: the deal, or "are you sure?". It stands
  // apart from the game's own panels so it can be opened at any moment
  // without getting in the way of whatever the game is waiting for.
  // ------------------------------------------------------------------
  var overEl = $('over'), overHandler = null;
  function showOver(html, handler) {
    overEl.innerHTML = html;
    overEl.classList.add('show');
    overEl.scrollTop = 0;
    overHandler = handler || null;
  }
  function closeOver() { overEl.classList.remove('show'); overEl.innerHTML = ''; overHandler = null; }
  overEl.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) { return; }
    var act = t.getAttribute('data-act');
    if (act === 'close') { closeOver(); return; }
    if (overHandler) { overHandler(act); }
  });

  function dealBody(you, them, mods, youName, themName) {
    mods = mods || {};
    return '<h2>The deal</h2>' + dealHTML(you, them, { sweet: mods.sweet, threat: mods.threat, youName: youName, themName: themName })
      + '<p class="sub">The numbers are months in gaol, and fewer is better. In each square, ' + (youName ? esc(youName) + '’s' : 'your') + ' months are on the left, '
      + (themName ? esc(themName) + '’s' : 'theirs') + ' on the right.'
      + (S && S.prisoners && S.prisoners.length > 2 ? ' With more of you, it’s the same deal for every pair, every night.' : '') + '</p>';
  }

  function openDeal(p, os, mods) {
    var you = p ? p.look : 'ned', them = os && os.length ? os[0].look : 'bess';
    var themName = os && os.length === 1 ? os[0].name : null;
    showOver(dealBody(you, them, mods, null, themName) + '<div class="btns"><button class="btn" data-act="close">Got it</button></div>');
  }

  $('b-deal').addEventListener('click', function () {
    initAudio();
    if (!S || !S.prisoners || !S.prisoners.length) { return; }
    var p = S.prisoners[0], os = S.prisoners.slice(1);
    if (S.mode === 'story') { openDeal(p, os, null); return; }
    showOver(dealBody(p.look, (os[0] || p).look, null, null, null) + '<div class="btns"><button class="btn" data-act="close">Got it</button></div>');
  });

  $('b-menu').addEventListener('click', function () {
    initAudio();
    showOver('<h2>Leave this game?</h2><p>It’s saved at the start of tonight, so you can carry on from the menu.</p>'
      + '<div class="btns"><button class="btn quiet" data-act="close">Stay</button><button class="btn" data-act="leave">Leave</button></div>',
      function (act) { if (act === 'leave') { closeOver(); begin(menu); } });
  });

  function dealPanel(you, them, note) {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      showPanel(dealBody(you, them, null, null, null) + (note ? '<p>' + esc(note) + '</p>' : '')
        + '<div class="btns"><button class="btn" data-act="ok">Got it</button></div>', '', function (act) {
        if (act !== 'ok') { return; }
        hidePanel();
        if (my !== RUN) { reject(ABORT); return; }
        resolve();
      });
    });
  }

  // ------------------------------------------------------------------
  // The front door: the title, and setting up a game.
  // ------------------------------------------------------------------
  async function menu() {
    S = { prisoners: [], inGame: false, night: 1, mv: {}, seen: {} };
    $('b-menu').classList.add('hide');
    closeOver();
    fadeEl.classList.remove('on');
    dropAllPrisoners();
    var a = pick(AVATARS), b = pick(AVATARS.filter(function (x) { return x !== a; }));
    S.prisoners = [{ id: 't1', look: a, name: '' }, { id: 't2', look: b, name: '' }];
    S.prisoners.forEach(function (p) { ensureFig(p); });
    LAY.n = 2;
    layout();
    showScene('cell');
    FIG.t1.lookT = 1; FIG.t2.lookT = -1;
    setExpr(FIG.t1, 'sly');
    setExpr(FIG.t2, 'cross'); setPose(FIG.t2, 'cross', true);
    drawKnitting(FIG.moll, 3);
    titlePanel();
  }

  function titlePanel() {
    var sv = loadSave();
    var h = '<div style="text-align:center"><h1>Honour Among Thieves</h1>'
      + '<p class="sub">Grimstone Gaol. Every night the Governor has you upstairs, alone, and asks you to snitch on your mates. A game about the prisoner’s dilemma.</p>'
      + '<div class="btns" style="flex-direction:column;align-items:stretch;max-width:440px;margin:10px auto 0">'
      + (sv ? '<button class="btn" data-act="resume">Carry on: night ' + sv.night + (sv.mode === 'story' ? ', on your own' : ', with friends') + '</button>' : '')
      + '<button class="btn" data-act="friends">With friends: pass the phone</button>'
      + '<button class="btn" data-act="story">On your own</button>'
      + '<button class="btn quiet" data-act="notes">What’s it all about?</button>'
      + '</div></div>';
    showPanel(h, 'title', function (act) {
      if (act === 'resume' && sv) { begin(function () { return resumeGame(sv); }); }
      if (act === 'friends') { begin(friendsSetupFlow); }
      if (act === 'story') { begin(storySetupFlow); }
      if (act === 'notes') { notesPanel(titlePanel); }
    });
  }

  var SETUP = {
    n: 2,
    seats: [
      { human: true, look: 'ned', name: 'Ned' },
      { human: true, look: 'bess', name: 'Bess' },
      { human: false, look: 'jack', name: '' },
      { human: false, look: 'nell', name: '' }
    ],
    gov: 'plain', govName: 'Governor', len: 'short'
  };

  function setupPanel() {
    var my = RUN;
    return new Promise(function (resolve, reject) {
      function taken(human, except) {
        return SETUP.seats.slice(0, SETUP.n).filter(function (s, i) { return i !== except && s.human === human; }).map(function (s) { return s.look; });
      }
      function freeLook(i, from) {
        var st = SETUP.seats[i], list = st.human ? AVATARS : MATES, used = taken(st.human, i);
        var k = list.indexOf(from);
        for (var t = 1; t <= list.length; t++) {
          var c = list[(k + t + list.length) % list.length];
          if (used.indexOf(c) < 0) { return c; }
        }
        return list[0];
      }
      function tidy() {
        for (var i = 0; i < SETUP.n; i++) {
          var st = SETUP.seats[i], list = st.human ? AVATARS : MATES;
          if (list.indexOf(st.look) < 0 || taken(st.human, i).indexOf(st.look) >= 0) {
            st.look = freeLook(i, list[list.length - 1]);
            if (st.human) { st.name = LOOKS[st.look].name; }
          }
        }
      }
      function seg(items, cur, prefix) {
        return '<span class="seg">' + items.map(function (it) {
          return '<button class="' + (String(it[0]) === String(cur) ? 'on' : '') + '" data-act="' + prefix + it[0] + '">' + it[1] + '</button>';
        }).join('') + '</span>';
      }
      var GOVD = {
        plain: 'The Governor just asks.',
        crafty: 'The Governor plays dirty tricks.',
        human: 'Somebody plays the Governor: whispers, bribes and threats. The Governor wants as many months handed out as possible.'
      };
      function html() {
        tidy();
        var h = '<h2>Who’s in the cell?</h2>'
          + '<div class="row"><b style="flex:1">Prisoners</b>' + seg([[2, '2'], [3, '3'], [4, '4']], SETUP.n, 'n:') + '</div>';
        for (var i = 0; i < SETUP.n; i++) {
          var st = SETUP.seats[i];
          h += '<div class="row" style="flex-wrap:wrap"><button class="facebtn" data-act="face:' + i + '" aria-label="Change face">' + headSVG(st.look) + '</button>'
            + '<div style="flex:1 1 8em;min-width:0">'
            + (st.human ? '<input type="text" maxlength="14" data-seat="' + i + '" value="' + esc(st.name) + '" aria-label="Name">'
              : '<b>' + esc(LOOKS[st.look].name) + '</b><br><span class="sub">The computer. You’ll find out how it plays.</span>')
            + '</div>' + seg([['h', 'Player'], ['c', 'Computer']], st.human ? 'h' : 'c', 'kind:' + i + ':') + '</div>';
        }
        h += '<div class="row" style="flex-wrap:wrap"><b style="flex:1 1 6em">The Governor</b>' + seg([['plain', 'Computer'], ['crafty', 'Crafty'], ['human', 'A player']], SETUP.gov, 'gov:') + '</div>'
          + '<p class="sub">' + GOVD[SETUP.gov] + '</p>';
        if (SETUP.gov === 'human') {
          h += '<div class="row"><span class="face64">' + headSVG('gov') + '</span><input type="text" maxlength="14" data-gov="1" value="' + esc(SETUP.govName) + '" aria-label="Governor’s name"></div>';
        }
        h += '<div class="row" style="flex-wrap:wrap"><b style="flex:1 1 6em">How long?</b>' + seg([['short', 'Short'], ['long', 'Long']], SETUP.len, 'len:') + '</div>'
          + '<p class="sub">Nobody knows which night the judge will come. Short is about 6 nights, long about 11.</p>'
          + '<div class="btns"><button class="btn quiet" data-act="back">Back</button><button class="btn" data-act="go">Lock them up!</button></div>';
        return h;
      }
      function redraw() {
        var keep = panelEl.scrollTop;
        showPanel(html(), '', handler);
        panelEl.scrollTop = keep;
      }
      function handler(act) {
        var parts = act.split(':');
        blip(280);
        if (parts[0] === 'n') { SETUP.n = +parts[1]; redraw(); return; }
        if (parts[0] === 'face') {
          var i = +parts[1], st = SETUP.seats[i], old = st.look;
          st.look = freeLook(i, st.look);
          if (st.human && (!st.name || st.name === LOOKS[old].name)) { st.name = LOOKS[st.look].name; }
          redraw(); return;
        }
        if (parts[0] === 'kind') {
          var j = +parts[1], s2 = SETUP.seats[j], want = parts[2] === 'h';
          if (s2.human !== want) {
            s2.human = want;
            s2.look = freeLook(j, (want ? AVATARS : MATES)[0]);
            if (want) { s2.name = LOOKS[s2.look].name; }
          }
          redraw(); return;
        }
        if (parts[0] === 'gov') { SETUP.gov = parts[1]; redraw(); return; }
        if (parts[0] === 'len') { SETUP.len = parts[1]; redraw(); return; }
        if (act === 'back') { begin(menu); return; }
        if (act === 'go') {
          hidePanel();
          if (my !== RUN) { reject(ABORT); return; }
          resolve();
        }
      }
      panelEl.oninput = function (e) {
        var t = e.target;
        if (t.getAttribute('data-seat') !== null) { SETUP.seats[+t.getAttribute('data-seat')].name = t.value; }
        if (t.getAttribute('data-gov') !== null) { SETUP.govName = t.value; }
      };
      showPanel(html(), '', handler);
    });
  }

  function cleanName(s, dflt) {
    s = String(s || '').replace(/\s+/g, ' ').trim().slice(0, 14);
    return s || dflt;
  }

  function newFriendsGame() {
    S = freshState('friends');
    S.len = SETUP.len;
    S.gov = { kind: SETUP.gov, name: cleanName(SETUP.govName, 'Governor') };
    SETUP.seats.slice(0, SETUP.n).forEach(function (st, i) {
      addPrisoner({
        id: 'p' + i, look: st.look, human: st.human, strat: st.human ? null : st.look,
        name: st.human ? cleanName(st.name, LOOKS[st.look].name) : LOOKS[st.look].short
      });
    });
  }

  async function friendsSetupFlow() {
    $('b-menu').classList.add('hide');
    await setupPanel();
    await startFriends();
  }

  var introDone = false;
  async function startFriends() {
    await fade(1);
    newFriendsGame();
    await friendsGame(false);
  }

  async function resumeGame(sv) {
    await fade(1);
    S = sv;
    S.inGame = true;
    S.prisoners.forEach(function (p) { p.shown = p.months; });
    if (S.mode === 'story') { await storyGame(true); } else { await friendsGame(true); }

  function times(n) { return n === 1 ? 'once' : (n === 2 ? 'twice' : n + ' times'); }
  function count(a, m) { return a.filter(function (x) { return x === m; }).length; }

  function mateExplain(st) {
    var mine = (S.mv.you && S.mv.you[st.mateId]) || [], d = count(mine, 'D'), c = count(mine, 'C'), L = [];
    switch (st.mate) {
      case 'sam':
        L.push(['moll', 'That was Soft Sam. He never snitches. Not ever, whatever you do to him.']);
        L.push(['moll', d ? 'And you snitched on him ' + times(d) + '. ' + (d === 1 ? 'That night' : 'Each time') + ' you saved yourself a month, and poor Sam got three. Easy pickings... but it ain’t pretty, is it?'
          : 'And you never snitched on him once. Good for you.']);
        L.push(['moll', 'Being soft is lovely with folk who are soft back. But there’s sharks in here.']);
        break;
      case 'nell':
        L.push(['moll', 'That was Nasty Nell. She snitches every single night, whatever you do. And she promised you she wouldn’t, didn’t she?']);
        L.push(['moll', c >= 2 ? 'Keeping mum for Nell just gets you three months a time.' : 'You twigged her quick. With Nell, snitching back is all you can do.']);
        L.push(['moll', 'Talk’s cheap, my duck. Watch what folk *do*.']);
        break;
      case 'jack':
        L.push(['moll', 'That was Honest Jack. The first night, he keeps mum. After that, he does whatever you did to him the night before.']);
        L.push(['moll', d ? 'When you snitched, Jack snitched right back the next night. Nothing personal. *Tit for tat.*'
          : 'You kept mum, so Jack kept mum. One month a night, the pair of you. Lovely.']);
        break;
      case 'grim':
        L.push(['moll', 'That was Grim Grimshaw. He keeps mum... until the first time you snitch on him. Then he snitches on you every night, for ever.']);
        L.push(['moll', d ? 'You found that out the hard way. He never forgives. Not once.' : 'You never crossed him, so you never saw his teeth.']);
        break;
      case 'meg':
        L.push(['moll', 'That was Mad Meg. She tosses a penny every night! Heads, she keeps mum. Tails, she snitches.']);
        L.push(['moll', 'You can’t build trust with somebody who doesn’t care what you do. Best you can do is look after yourself.']);
        break;
      case 'sid':
        L.push(['moll', 'That was Sly Sid. He snitches the very first night, just to test you.']);
        L.push(['moll', d ? 'You hit back, so he said sorry and played fair after that. He only picks on mugs.'

  // ------------------------------------------------------------------
  // What it was all about: the real ideas, with their real names, for
  // the older ones and for whoever is sitting with them.
  // ------------------------------------------------------------------
  function notesPanel(onClose) {
    var h = '<div class="notes"><div class="btns" style="justify-content:flex-end;margin:0"><button class="btn quiet" data-act="close">Close</button></div>'
      + '<h1>What was all that about?</h1>'
      + '<p>Honour Among Thieves is a game about a famous puzzle called <b>the prisoner’s dilemma</b>. A dilemma is a choice where every answer has a catch.</p>'

      + '<h3>The puzzle</h3>'
      + '<p>Two people are each offered the same deal, separately. Each can help the other (keep mum) or look after themselves (snitch).</p>'
      + dealHTML('ned', 'bess', {})
      + '<p>Whatever the other one does, snitching gets you a better deal: none instead of one, or two instead of three. But if <i>both</i> snitch, both end up with two, when both keeping mum would have got them one each.</p>'
      + '<p>So the clever choice for each person is the wrong choice for the pair. Looking after yourself makes you worse off, one sensible-looking step at a time.</p>'

      + '<h3>Where it came from</h3>'
      + '<p>Two mathematicians, Merrill Flood and Melvin Dresher, came up with it in 1950 at the RAND Corporation, an American research organisation working on the Cold War. Their colleague Albert Tucker told it as a story about two prisoners questioned in separate rooms, and the name stuck.</p>'
      + '<p>Real courts did something like it long before. In the 1700s and 1800s a criminal could <b>turn King’s evidence</b>: give evidence against the rest of the gang, and go free. The puzzle was being played for real two hundred years before anybody gave it a name.</p>'

      + '<h3>The trap has a name too</h3>'
      + '<p>When everybody is doing the best they can, given what everybody else is doing, and nobody can do better by changing on their own, that is a <b>Nash equilibrium</b>, after the mathematician John Nash (the film <i>A Beautiful Mind</i> is about him). In the prisoner’s dilemma, the Nash equilibrium is both snitching. It is steady, and it is bad for both of you.</p>'

      + '<h3>Again and again</h3>'
      + '<p>Play just once, and snitching is hard to argue with. But play night after night with the same people, and what you do tonight changes what they do tomorrow. This is the <b>repeated</b> (or <b>iterated</b>) prisoner’s dilemma, and the idea that tomorrow matters is sometimes called <b>the shadow of the future</b>.</p>'
      + '<p>That is why the judge’s arrival is kept secret. If everyone knew which night was the last, snitching that night would be safe. Then snitching the night before would be safe too, and the night before that, until the whole thing unravels back to the start. Not knowing when it ends keeps it alive.</p>'
      + '<p>Talking does not change the deal. Anybody can promise to keep mum; nothing makes them. Game theorists call promises that cost nothing <b>cheap talk</b>.</p>'

      + '<h3>The tournament</h3>'
      + '<p>In 1980 the political scientist Robert Axelrod invited experts to send in computer programs to play the repeated prisoner’s dilemma against each other. The winner was the simplest program sent in: <b>Tit for Tat</b>, by Anatol Rapoport. It cooperates on the first round, then copies whatever the other player did last time. Axelrod ran the tournament again with 62 entries, from people who all knew Tit for Tat had won. It won again.</p>'
      + '<p>Axelrod noticed that the strategies that did well were:</p><ul>'
      + '<li><b>Nice:</b> never the first to snitch.</li>'
      + '<li><b>Retaliating:</b> they hit back when snitched on, so nobody could take them for a mug.</li>'
      + '<li><b>Forgiving:</b> they went back to keeping mum as soon as the other did.</li>'
      + '<li><b>Clear:</b> simple enough that others could work out how to get on with them.</li></ul>'
      + '<p>Strangest of all, Tit for Tat never beats the player it is up against. It can only draw, or lose by a little. It wins by getting along with everybody.</p>'

      + '<h3>The cellmates</h3><ul>'
      + '<li><b>Soft Sam</b> always keeps mum: <i>Always Cooperate</i>.</li>'
      + '<li><b>Nasty Nell</b> always snitches: <i>Always Defect</i>.</li>'
      + '<li><b>Honest Jack</b> is <i>Tit for Tat</i>.</li>'
      + '<li><b>Grim Grimshaw</b> is the <i>Grudger</i>, also called <i>Grim Trigger</i>: one snitch and he never forgives.</li>'
      + '<li><b>Mad Meg</b> is <i>Random</i>.</li>'
      + '<li><b>Sly Sid</b> is a <i>Tester</i>, like one of the programs in Axelrod’s second tournament: he snitches first to see if you will stand up for yourself.</li></ul>'
      + '<p>Moll’s great tally is a small tournament of the same kind, played by the computer at the end of “On your own”.</p>'

      + '<h3>Where else it turns up</h3><ul>'
      + '<li><b>Group projects:</b> everybody is better off if everybody works, but each person is tempted to let the others do it.</li>'
      + '<li><b>Two shops</b> cutting prices to steal each other’s customers, until neither makes any money.</li>'
      + '<li><b>Countries</b> deciding whether to build more weapons than each other, or whether to cut pollution when cutting it costs them and helps everybody.</li>'
      + '<li><b>Sport:</b> if one athlete cheats with drugs, the others are tempted to cheat too, and then nobody has an advantage and everybody takes the risk.</li>'
      + '<li><b>The trenches of the First World War:</b> on quiet stretches of the front, soldiers on both sides sometimes stopped trying to kill each other, as long as the other side did the same. Historians call it <i>live and let live</i>.</li>'
      + '<li><b>Animals:</b> vampire bats share blood meals with hungry roost-mates, and are more likely to share with bats that have shared with them before.</li></ul>'

      + '<h3>About Grimstone</h3>'
      + '<p>Grimstone Gaol is made up, but gaols like it were real. Before reformers such as John Howard and Elizabeth Fry, prisoners paid the gaoler for their food, for a bed, even to have their chains taken off, and could be kept locked up after being found not guilty until they had paid a fee to leave.</p>'
      + '<div class="btns"><button class="btn" data-act="close">Close</button></div></div>';
    showPanel(h, '', function (act) {
      if (act === 'close') { hidePanel(); if (onClose) { onClose(); } }
    });
  }

  }

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 140);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 260);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && AC && AC.state === 'suspended') { AC.resume(); }
  });

  boot();
})();
</script>
</body>
