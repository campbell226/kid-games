<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#15111c">
<title>Murmuration</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #15111c;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #sky {
    display: block;
    position: fixed; left: 0; top: 0;
    width: 100%; height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<script>
// Full screen on the first touch, and a way back if it is off.
//
// A browser will not do this by itself: the request has to come out of a
// gesture the browser counts as user activation, and that list is fussier
// than it looks. pointerdown only counts when the pointer is a mouse - on
// a touchscreen it grants nothing at all, which is why listening for it
// worked on a laptop and did nothing whatever on a tablet. For a finger it
// is pointerup and touchend that count.
//
// Once full screen is on, the automatic asking stops, so leaving it stays
// left. But leaving it used to mean reloading to get it back, so there is
// now a small button at the top of the screen that is only there while
// full screen is off, and takes itself away the moment it is on.
//
// An iPhone ignores the lot, because Safari there gives full screen to
// video and nothing else, so no button is offered. That is what the home
// screen tags above are for.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#40563a" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

<canvas id="sky" aria-label="Murmuration"></canvas>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d', { alpha: false });

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  // The same scenery every time for the same screen, so turning a tablet
  // round does not grow a different marsh.
  function seeded(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = reduceQuery.matches;
  if (reduceQuery.addEventListener) {
    reduceQuery.addEventListener('change', function (e) { reduced = e.matches; });
  }

  // ------------------------------------------------------------------
  // Colour. The birds stay black; the sky goes round and round a dusk.
  // Each row is the top of the sky, the middle, the horizon and the glow
  // where the sun has gone down. The smoothstep between rows means the
  // sky lingers on each one and never visibly jumps.
  // ------------------------------------------------------------------
  function hex(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a === undefined ? 1 : a) + ')';
  }

  var DUSK = [
    ['#7d97c4', '#e3b48f', '#f8d69c', '#fff0c0'],   // gold
    ['#6a78b4', '#e79c8a', '#f9c79a', '#ffd9b0'],   // peach
    ['#555a9c', '#c98aa6', '#f4a98f', '#ffc0a0'],   // rose
    ['#434a8a', '#9580b2', '#e3a3a8', '#f7b7b0'],   // lilac
    ['#323a78', '#646aa6', '#b89abb', '#dcb0c6'],   // blue hour
    ['#48679a', '#93b1c2', '#e6d9ba', '#fff2cc']    // pale, and back to gold
  ].map(function (row) { return row.map(hex); });

  var INK = hex('#15111c');
  var SEG = 45;
  var skyClock = Math.random() * SEG * DUSK.length;
  var sky = { top: DUSK[0][0], mid: DUSK[0][1], hor: DUSK[0][2], glow: DUSK[0][3] };

  function updateSky(dt) {
    var lap = SEG * DUSK.length;
    skyClock = (skyClock + dt * (reduced ? 0.5 : 1)) % lap;
    var k = Math.floor(skyClock / SEG);
    var f = smooth((skyClock - k * SEG) / SEG);
    var a = DUSK[k], b = DUSK[(k + 1) % DUSK.length];
    sky.top = mix(a[0], b[0], f);
    sky.mid = mix(a[1], b[1], f);
    sky.hor = mix(a[2], b[2], f);
    sky.glow = mix(a[3], b[3], f);
  }

  // ------------------------------------------------------------------
  // Wind comes in gusts. Each gust enters from the left, sweeps across
  // the reed bed bending them as it passes, and is gone off the right,
  // with stillness in between. How often they come and how hard they
  // blow goes round a slow cycle of its own, like the sky: calm, a
  // breeze, a proper blow, calm again. The reeds and the sound both read
  // the same gusts, so what you hear is always what you see.
  // ------------------------------------------------------------------
  var WEATHER = [0.05, 0.4, 0.15, 0.75, 0.3, 0.95, 0.1, 0.55];
  var WEATHER_SEG = 28;
  var weatherClock = Math.random() * WEATHER_SEG * WEATHER.length;
  var weather = 0, gusts = [], nextGust = 3;
  var windHeard = 0, gustHeard = 0, windPan = 0, reedPhase = 0;

  function updateWind(dt) {
    var lap = WEATHER_SEG * WEATHER.length, i;
    weatherClock = (weatherClock + dt) % lap;
    var k = Math.floor(weatherClock / WEATHER_SEG);
    var f = smooth((weatherClock - k * WEATHER_SEG) / WEATHER_SEG);
    weather = WEATHER[k] + (WEATHER[(k + 1) % WEATHER.length] - WEATHER[k]) * f;

    // Gusts are brief and well apart, and a new one waits until the last
    // has nearly gone, so even in a blow they never run together into
    // one long roar.
    nextGust -= dt;
    if (nextGust <= 0) {
      var busy = false;
      for (i = 0; i < gusts.length; i++) { if (gusts[i].pos < 0.75) { busy = true; } }
      if (busy) {
        nextGust = 1;
      } else {
        gusts.push({
          pos: -0.45,
          speed: 0.32 + Math.random() * 0.13,
          peak: clamp(weather * (0.55 + 0.7 * Math.random()), 0.05, 1)
        });
        nextGust = (12 - 6 * weather) * (0.75 + 0.75 * Math.random());
      }
    }

    // What you hear is each gust as it passes the middle of the screen,
    // from the side it is on, and nothing at all between gusts.
    var heard = 0, pan = 0;
    for (i = gusts.length - 1; i >= 0; i--) {
      var g = gusts[i];
      g.pos += g.speed * dt;
      if (g.pos > 1.5) { gusts.splice(i, 1); continue; }
      var d = (g.pos - 0.5) / 0.38, on = g.peak * Math.exp(-d * d);
      heard += on;
      pan += on * (g.pos - 0.5);
    }
    gustHeard = clamp(heard, 0, 1);
    windHeard = clamp(weather * 0.12 + heard, 0, 1);
    windPan = heard > 0.01 ? clamp(pan / heard, -0.5, 0.5) : 0;

    // Reeds flutter faster in a stronger wind. Kept as a running phase
    // so a change of speed never makes them jump.
    reedPhase += dt * (1.1 + 2.6 * windHeard);
  }

  // How hard it is blowing at a point across the screen, 0 at the left
  // edge and 1 at the right.
  function windAt(fx) {
    var w = weather * 0.12;
    for (var i = 0; i < gusts.length; i++) {
      var d = (fx - gusts[i].pos) / 0.3;
      w += gusts[i].peak * Math.exp(-d * d);
    }
    return clamp(w, 0, 1.2);
  }

  // ------------------------------------------------------------------
  // The world. Birds live in a box measured in units of the screen's
  // shorter side, so the flock is the same size to the eye in portrait
  // and landscape. z runs away from the viewer: far birds are drawn
  // smaller, hazier and pulled towards a vanishing point on the horizon,
  // which is what lets the flock fold and thicken like a real one.
  // ------------------------------------------------------------------
  var W = 1, H = 1, U = 1, DPR = 1;
  var horizonY = 0, vpx = 0;
  var xMin = 0, xMax = 1, yMin = 0, yMax = 1;
  var DEPTH = 0.6, PK = 0.7 / DEPTH;

  function persp(z) { return 1 / (1 + z * PK); }

  var MAX = 800, MIN = 200;
  var n = 0;
  var px = new Float64Array(MAX), py = new Float64Array(MAX), pz = new Float64Array(MAX);
  var vx = new Float64Array(MAX), vy = new Float64Array(MAX), vz = new Float64Array(MAX);
  var AX = new Float64Array(MAX), AY = new Float64Array(MAX), AZ = new Float64Array(MAX);
  var phase = new Float64Array(MAX), flapT = new Float64Array(MAX);
  // How hard each bird is being pulled sideways round a turn, smoothed.
  // It banks into that, the way a real bird or a bicycle leans.
  var LX = new Float64Array(MAX), LY = new Float64Array(MAX), LZ = new Float64Array(MAX);
  var size = new Float64Array(MAX), flapping = new Uint8Array(MAX);
  var panic = new Float64Array(MAX), panicNext = new Float64Array(MAX);
  var SX = new Float64Array(MAX), SY = new Float64Array(MAX), SS = new Float64Array(MAX);
  var bucket = new Uint8Array(MAX);

  // How a starling decides where to go: keep a little gap from whoever is
  // nearest, match their heading, drift towards them. Nothing else. Every
  // fold and ribbon in the flock comes out of those three at once.
  var CRUISE = 0.2, VMIN = 0.12, VMAX = 0.3;
  var R = 0.08, R2 = R * R, SEP = 0.034, SEP2 = SEP * SEP;
  var W_ALI = 1.6, W_COH = 1.4, W_SEP = 0.9, W_HOME = 0.12, W_EDGE = 8, W_FLEE = 10;
  var MAXNB = 10, ACC_MAX = 1.6, NOISE = 0.25;

  // A weak pull towards the middle of the whole flock, so a party that
  // breaks away always comes back to the rest rather than wandering off
  // as a second flock.
  var W_GATHER = 0.25;

  // A slow, invisible current through the sky. It pushes one end of the
  // flock a little differently from the other, which stretches it into
  // ribbons and folds; the birds' own pull towards each other gathers it
  // back up again.
  var FLOW = 0.14;

  // Starlings would rather fly level than climb, which flattens the flock
  // into a sheet. Seen side-on a sheet is a thin dark ribbon; seen from
  // underneath it is a wide pale cloud. That change is the murmuration.
  var LEVEL = 1.2;

  var cellHead = new Int32Array(1), nextIdx = new Int32Array(MAX);
  var gcols = 1, grows = 1;

  // ------------------------------------------------------------------
  // Scenery: a far tree line, open water, and reeds in front. The reeds
  // are drawn over the birds, so a flock that dips low passes behind the
  // plumes rather than over them.
  // ------------------------------------------------------------------
  var treePts = [], bankPts = [], reedsBack = [], reedsFront = [];

  function buildTrees() {
    var rnd = seeded(7), clumps = [], k;
    var count = Math.round(W / U * 7) + 3;
    for (k = 0; k < count; k++) {
      clumps.push({ x: rnd() * W, w: U * (0.03 + rnd() * 0.07), h: U * (0.012 + rnd() * 0.035) });
    }
    var step = Math.max(2, U * 0.006), pts = [];
    for (var x = -step; x <= W + step * 2; x += step) {
      var h = U * 0.006 + Math.sin(x * 0.05) * U * 0.002;
      for (k = 0; k < clumps.length; k++) {
        var d = (x - clumps[k].x) / clumps[k].w;
        if (d > -1 && d < 1) {
          var t = clumps[k].h * Math.sqrt(1 - d * d);
          if (t > h) { h = t; }
        }
      }
      h += (rnd() - 0.5) * U * 0.004;
      pts.push(x, horizonY - h);
    }
    treePts = pts;
  }

  function makeRow(rnd, spacing, hMin, hVar) {
    var row = [], x = -spacing * rnd();
    while (x < W + spacing) {
      var lean = (rnd() - 0.5) * 0.18;
      row.push({
        x: x, h: hMin + hVar * Math.pow(rnd(), 1.4), lean: lean, ph: rnd() * 6.283,
        plume: U * (0.022 + rnd() * 0.02), pw: U * (0.003 + rnd() * 0.002),
        droop: (lean >= 0 ? 1 : -1) * (0.7 + rnd() * 0.7),
        leaf: rnd() < 0.6 ? (rnd() - 0.5) : 0
      });
      x += spacing * (0.5 + rnd());
    }
    return row;
  }

  function buildReeds() {
    var rnd = seeded(11), marsh = H - horizonY;
    reedsBack = makeRow(rnd, U * 0.016, marsh * 0.45, marsh * 0.4);
    reedsFront = makeRow(rnd, U * 0.034, marsh * 0.6, marsh * 0.65);
    var pts = [], step = Math.max(3, U * 0.008);
    for (var x = -step; x <= W + step * 2; x += step) {
      pts.push(x, H - marsh * (0.24 + 0.05 * Math.sin(x * 0.013) + rnd() * 0.05));
    }
    bankPts = pts;
  }

  // ------------------------------------------------------------------
  // Layout
  // ------------------------------------------------------------------
  function layout() {
    var w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    var ox0 = xMin, ox1 = xMax, oy0 = yMin, oy1 = yMax;

    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    W = w; H = h; U = Math.min(W, H);
    horizonY = H * 0.87;
    vpx = W / 2;

    // The flock is allowed right down to the reed tops, so that now and
    // then it sweeps in low over the water.
    var m = 0.12;
    xMin = m; xMax = W / U - m;
    yMin = m + 0.03; yMax = (H * 0.8) / U;

    // Keep the flock where it was, in proportion, rather than letting
    // a turned screen fling it against one side.
    if (n) {
      var sx = (xMax - xMin) / Math.max(0.01, ox1 - ox0);
      var sy = (yMax - yMin) / Math.max(0.01, oy1 - oy0);
      for (var i = 0; i < n; i++) {
        px[i] = xMin + (px[i] - ox0) * sx;
        py[i] = yMin + (py[i] - oy0) * sy;
      }
    }

    gcols = Math.ceil(W / U / R) + 1;
    grows = Math.ceil(H / U / R) + 1;
    cellHead = new Int32Array(gcols * grows);

    buildTrees();
    buildReeds();
  }

  // ------------------------------------------------------------------
  // The flock arrives from off the left edge, already flying.
  // ------------------------------------------------------------------
  function spawnFlock() {
    n = clamp(Math.round(W * H / 800), 400, MAX);
    for (var i = 0; i < n; i++) {
      px[i] = xMin - 0.15 - Math.random() * 0.5;
      py[i] = yMin + (yMax - yMin) * 0.3 + (Math.random() - 0.5) * 0.35;
      pz[i] = DEPTH * (0.3 + Math.random() * 0.4);
      vx[i] = CRUISE * (0.9 + Math.random() * 0.2);
      vy[i] = (Math.random() - 0.5) * 0.05;
      vz[i] = (Math.random() - 0.5) * 0.05;
      LX[i] = 0; LY[i] = 0; LZ[i] = 0; panic[i] = 0;
      phase[i] = Math.random() * 6.283;
      flapping[i] = Math.random() < 0.6 ? 1 : 0;
      flapT[i] = Math.random();
      size[i] = 0.85 + Math.random() * 0.3;
    }
  }

  // Somewhere for the flock to wheel round. It drifts slowly about the
  // sky, and because the birds cannot stop, they overshoot it and turn
  // back, again and again.
  var homeT = Math.random() * 100, flowT = Math.random() * 100;
  var home = { x: 0, y: 0, z: 0 };

  function updateHome(dt) {
    homeT += dt * (reduced ? 0.6 : 1);
    var cx = (xMin + xMax) / 2, cy = (yMin + yMax) / 2;
    home.x = cx + (xMax - xMin) * 0.32 * Math.sin(homeT * 0.071);
    home.y = cy + (yMax - yMin) * 0.34 * Math.sin(homeT * 0.113 + 1.3);
    home.z = DEPTH * (0.5 + 0.32 * Math.sin(homeT * 0.049 + 0.4));

    // Somewhere just tapped is no place to come home to for a while.
    var s = persp(home.z);
    for (var i = 0; i < scares.length; i++) {
      var wx = (vpx + (scares[i].x - vpx) / s) / U;
      var wy = (horizonY + (scares[i].y - horizonY) / s) / U;
      var dx = home.x - wx, dy = home.y - wy;
      var d = Math.sqrt(dx * dx + dy * dy) + 1e-6, need = 0.7 * scareLeft(scares[i]);
      if (d < need) { home.x = wx + dx / d * need; home.y = wy + dy / d * need; }
    }
    home.x = clamp(home.x, xMin, xMax);
    home.y = clamp(home.y, yMin, yMax);
  }

  // ------------------------------------------------------------------
  // Fingers. Every finger on the glass is a place the birds keep away
  // from, and the alarm spreads from bird to bird a little way beyond it.
  // ------------------------------------------------------------------
  var fingers = {};

  function fingerRadius() { return U * 0.24; }

  // A wary spot is wider than a finger, so birds heading across the sky
  // go round it rather than clipping its edge.
  function scareRadius() { return fingerRadius() * 1.4; }

  // Where a finger lifts, the birds stay wary of the spot for a few
  // seconds, keeping clear of it and settling somewhere else, then
  // drift back in their own time. Without this they closed over the
  // place the instant the finger left, as if nothing had happened.
  var scares = [], SCARE_LIFE = 6;

  function scareLeft(sc) { return smooth(clamp(sc.life / SCARE_LIFE, 0, 1)); }

  // The moment a finger lands, the birds near it burst outwards, and the
  // rest of the flock flinches away from it wherever it is. A child has
  // to see straight away that the tap did that, so this happens at once
  // rather than waiting for the steering to catch up. Returns how many
  // birds took real fright, which is what the wing sound follows.
  function startle(x0, y0) {
    var near = fingerRadius() * 1.7, far = U * 1.3, spd = reduced ? 0.6 : 1, hit = 0;
    for (var i = 0; i < n; i++) {
      var dx = SX[i] - x0, dy = SY[i] - y0;
      var d = Math.sqrt(dx * dx + dy * dy) + 0.001;
      var k;
      if (d < near) {
        k = 1 - d / near;
        var kick = (0.3 + 0.7 * k) * 0.5 * spd;
        vx[i] += dx / d * kick;
        vy[i] += dy / d * kick;
        panic[i] = Math.max(panic[i], 0.3 + 0.5 * k);
        hit += 1;
      } else if (d < far) {
        k = 1 - d / far;
        vx[i] += dx / d * k * 0.1 * spd;
        vy[i] += dy / d * k * 0.1 * spd;
        panic[i] = Math.max(panic[i], 0.2 * k);
      }
    }
    return hit;
  }

  // ------------------------------------------------------------------
  // One step of the flock
  // ------------------------------------------------------------------
  function step(dt) {
    var spd = reduced ? 0.6 : 1;
    var cruise = CRUISE * spd, vmin = VMIN * spd, vmax = VMAX * spd;
    var i, j, gx, gy;
    flowT += dt * spd;

    var mx = 0, my = 0, mz = 0;
    for (i = 0; i < cellHead.length; i++) { cellHead[i] = -1; }
    for (i = 0; i < n; i++) {
      mx += px[i]; my += py[i]; mz += pz[i];
      gx = clamp(Math.floor(px[i] / R), 0, gcols - 1);
      gy = clamp(Math.floor(py[i] / R), 0, grows - 1);
      var c = gy * gcols + gx;
      nextIdx[i] = cellHead[c];
      cellHead[c] = i;
    }
    if (n) { mx /= n; my /= n; mz /= n; }

    // Fingers still down frighten the birds; spots a finger has left only
    // make them wary, less so as the seconds pass.
    // A wary spot pushes firmly even near its rim, so birds heading
    // across the sky go round it, not through it.
    var FR = fingerRadius(), SR = scareRadius();
    var fl = [], id, wary = 0;
    for (id in fingers) {
      if (fingers.hasOwnProperty(id)) {
        fl.push({ x: fingers[id].x, y: fingers[id].y, s: 1, r: FR, held: true });
        wary = 1;
      }
    }
    for (i = scares.length - 1; i >= 0; i--) {
      scares[i].life -= dt;
      if (scares[i].life <= 0) { scares.splice(i, 1); continue; }
      var left = scareLeft(scares[i]);
      fl.push({ x: scares[i].x, y: scares[i].y, s: left, r: SR, held: false });
      if (left > wary) { wary = left; }
    }

    // While they are wary, the pull back towards the middle of the flock
    // is mostly let go. After a scatter the middle is the very spot that
    // was tapped, and that pull was what drew them straight back into it.
    var gather = W_GATHER * (1 - 0.8 * wary);

    for (i = 0; i < n; i++) {
      var x = px[i], y = py[i], z = pz[i];
      var cx = clamp(Math.floor(x / R), 0, gcols - 1);
      var cy = clamp(Math.floor(y / R), 0, grows - 1);
      var cnt = 0, avx = 0, avy = 0, avz = 0, ox = 0, oy = 0, oz = 0;
      var sx = 0, sy = 0, sz = 0, pmax = 0;

      for (gy = cy - 1; gy <= cy + 1; gy++) {
        if (gy < 0 || gy >= grows) { continue; }
        for (gx = cx - 1; gx <= cx + 1; gx++) {
          if (gx < 0 || gx >= gcols) { continue; }
          for (j = cellHead[gy * gcols + gx]; j !== -1; j = nextIdx[j]) {
            if (j === i) { continue; }
            var dx = px[j] - x, dy = py[j] - y, dz = pz[j] - z;
            var d2 = dx * dx + dy * dy + dz * dz;
            if (d2 > R2) { continue; }
            if (cnt < MAXNB) {
              cnt++;
              avx += vx[j]; avy += vy[j]; avz += vz[j];
              ox += dx; oy += dy; oz += dz;
            }
            if (d2 < SEP2 && d2 > 1e-12) {
              var d = Math.sqrt(d2), w = (1 - d / SEP) / d;
              sx -= dx * w; sy -= dy * w; sz -= dz * w;
            }
            if (panic[j] > pmax) { pmax = panic[j]; }
          }
        }
      }

      var p = panic[i];
      var ax = 0, ay = 0, az = 0;
      if (cnt > 0) {
        var inv = 1 / cnt, ali = W_ALI * (1 + p);
        ax += (avx * inv - vx[i]) * ali;
        ay += (avy * inv - vy[i]) * ali;
        az += (avz * inv - vz[i]) * ali;
        ax += ox * inv * W_COH;
        ay += oy * inv * W_COH * 2;
        az += oz * inv * W_COH;
      }
      ax += sx * W_SEP; ay += sy * W_SEP; az += sz * W_SEP;
      ay -= vy[i] * LEVEL;

      ax += (Math.sin(y * 7.1 + flowT * 0.23) + Math.sin(z * 8.3 - flowT * 0.17)) * FLOW;
      ay += Math.sin(x * 6.7 - flowT * 0.19) * FLOW * 0.5;
      az += (Math.sin(x * 7.7 + flowT * 0.21) + Math.sin(y * 5.3 + flowT * 0.29)) * FLOW;

      // A bird on its own heads back towards the rest.
      var hk = cnt > 2 ? W_HOME : W_HOME * 3;
      ax += clamp((home.x - x) * hk, -0.3, 0.3);
      ay += clamp((home.y - y) * hk, -0.3, 0.3);
      az += clamp((home.z - z) * hk, -0.3, 0.3);
      var gk = cnt > 2 ? gather : gather * 2;
      ax += clamp((mx - x) * gk, -0.3, 0.3);
      ay += clamp((my - y) * gk, -0.3, 0.3);
      az += clamp((mz - z) * gk, -0.3, 0.3);

      if (x < xMin) { ax += Math.min(1.5, (xMin - x) * W_EDGE); }
      else if (x > xMax) { ax -= Math.min(1.5, (x - xMax) * W_EDGE); }
      if (y < yMin) { ay += Math.min(1.5, (yMin - y) * W_EDGE); }
      else if (y > yMax) { ay -= Math.min(1.5, (y - yMax) * W_EDGE); }
      if (z < 0) { az += Math.min(1.5, -z * W_EDGE); }
      else if (z > DEPTH) { az -= Math.min(1.5, (z - DEPTH) * W_EDGE); }

      var scared = 0;
      if (fl.length) {
        var s = persp(z);
        var scrX = vpx + (x * U - vpx) * s, scrY = horizonY + (y * U - horizonY) * s;
        for (var f = 0; f < fl.length; f++) {
          var fx = scrX - fl[f].x, fy = scrY - fl[f].y;
          var fd2 = fx * fx + fy * fy;
          if (fd2 < fl[f].r * fl[f].r) {
            var fd = Math.sqrt(fd2), k = Math.max(0, 1 - fd / fl[f].r);
            var push = (fl[f].held ? k : Math.sqrt(k)) * W_FLEE * fl[f].s;
            fd += 0.001;
            ax += fx / fd * push;
            ay += fy / fd * push;
            if (fl[f].held && k > scared) { scared = k; }
          }
        }
      }

      ax += (Math.random() - 0.5) * NOISE;
      ay += (Math.random() - 0.5) * NOISE;
      az += (Math.random() - 0.5) * NOISE;

      AX[i] = ax; AY[i] = ay; AZ[i] = az;

      // Alarm rises towards what the neighbours feel, a beat behind them,
      // so it travels outwards through the flock as a ripple.
      var np = Math.max(0, p - dt * 0.8);
      var fromNb = pmax * 0.75;
      if (fromNb > np) { np += (fromNb - np) * Math.min(1, dt * 12); }
      if (scared > np) { np = scared; }
      panicNext[i] = np;
    }

    for (i = 0; i < n; i++) {
      var q = panicNext[i];
      panic[i] = q;
      var bx = AX[i], by = AY[i], bz = AZ[i];
      // A frightened bird may turn hard and fly fast; a calm one may not.
      var am = Math.sqrt(bx * bx + by * by + bz * bz), amax = ACC_MAX + 9 * q;
      if (am > amax) { var r = amax / am; bx *= r; by *= r; bz *= r; }

      var ovx = vx[i], ovy = vy[i], ovz = vz[i];
      vx[i] += bx * dt; vy[i] += by * dt; vz[i] += bz * dt;

      var sp = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i]) || 1e-6;
      var want = cruise * (1 + 0.9 * q);
      var ns = clamp(sp + (want - sp) * Math.min(1, dt * 0.8), vmin, vmax * (1 + 1.5 * q));
      var kk = ns / sp;
      vx[i] *= kk; vy[i] *= kk; vz[i] *= kk;

      px[i] += vx[i] * dt; py[i] += vy[i] * dt; pz[i] += vz[i] * dt;

      // A hard stop in depth, behind the soft one. A whole flock heading
      // towards the viewer could otherwise carry through the front of
      // the box to where the perspective divides by nothing, and one bird
      // drawn at infinity is enough to spoil every bird it flies beside.
      if (pz[i] < -0.1) { pz[i] = -0.1; if (vz[i] < 0) { vz[i] = 0; } }
      else if (pz[i] > DEPTH + 0.15) { pz[i] = DEPTH + 0.15; if (vz[i] > 0) { vz[i] = 0; } }

      // And a safety net under all of it. A bird whose numbers have gone
      // wrong would pass the fault to every neighbour through the flocking
      // rules until the sky was empty; instead it is quietly put back
      // with the rest.
      if (px[i] !== px[i] || py[i] !== py[i] || pz[i] !== pz[i] ||
          vx[i] !== vx[i] || vy[i] !== vy[i] || vz[i] !== vz[i]) {
        px[i] = home.x; py[i] = home.y; pz[i] = home.z;
        vx[i] = cruise; vy[i] = 0; vz[i] = 0;
        ovx = cruise; ovy = 0; ovz = 0;
        panic[i] = 0; LX[i] = 0; LY[i] = 0; LZ[i] = 0;
      }

      // The sideways part of this step's change of velocity: whatever is
      // turning the bird, as opposed to speeding it up or slowing it.
      var tx = (vx[i] - ovx) / dt, ty = (vy[i] - ovy) / dt, tz = (vz[i] - ovz) / dt;
      var v2 = vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i] || 1e-6;
      var along = (tx * vx[i] + ty * vy[i] + tz * vz[i]) / v2;
      tx -= along * vx[i]; ty -= along * vy[i]; tz -= along * vz[i];
      var kl = Math.min(1, dt * 4);
      LX[i] += (tx - LX[i]) * kl;
      LY[i] += (ty - LY[i]) * kl;
      LZ[i] += (tz - LZ[i]) * kl;

      flapT[i] -= dt;
      if (flapT[i] <= 0) {
        flapping[i] = flapping[i] ? 0 : 1;
        flapT[i] = flapping[i] ? 0.5 + Math.random() * 1.1 : 0.3 + Math.random() * 0.9;
      }
      if (flapping[i] || q > 0.2) { phase[i] += dt * 6.283 * (6 + 6 * q); }
    }
  }

  // ------------------------------------------------------------------
  // Drawing
  // ------------------------------------------------------------------
  var clouds = [
    { x: 0.2, y: 0.2, w: 0.55, h: 0.035, v: 0.004, a: 0.28 },
    { x: 0.7, y: 0.34, w: 0.8, h: 0.03, v: 0.0028, a: 0.22 },
    { x: 0.45, y: 0.5, w: 0.6, h: 0.025, v: 0.0036, a: 0.2 },
    { x: 0.9, y: 0.66, w: 0.9, h: 0.02, v: 0.002, a: 0.26 }
  ];

  function drawSky(dt) {
    var g = ctx.createLinearGradient(0, 0, 0, horizonY);
    g.addColorStop(0, rgba(sky.top));
    g.addColorStop(0.55, rgba(sky.mid));
    g.addColorStop(1, rgba(sky.hor));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizonY + 1);

    var sunX = W * 0.7, rad = Math.max(W, H) * 0.55;
    var rg = ctx.createRadialGradient(sunX, horizonY, 0, sunX, horizonY, rad);
    rg.addColorStop(0, rgba(sky.glow, 0.55));
    rg.addColorStop(1, rgba(sky.glow, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, horizonY + 1);

    var col = mix(sky.hor, sky.glow, 0.5);
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x += c.v * dt * (reduced ? 0.3 : 1) * (0.4 + 2.2 * weather);
      if (c.x - c.w / 2 > 1.05) { c.x = -c.w / 2 - 0.05; }
      ctx.save();
      ctx.translate(c.x * W, c.y * horizonY);
      ctx.scale(c.w * W / 2, c.h * H);
      var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      cg.addColorStop(0, rgba(col, c.a));
      cg.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawWaterAndTrees() {
    var wg = ctx.createLinearGradient(0, horizonY, 0, H);
    wg.addColorStop(0, rgba(mix(sky.hor, INK, 0.2)));
    wg.addColorStop(1, rgba(mix(sky.mid, INK, 0.65)));
    ctx.fillStyle = wg;
    ctx.fillRect(0, horizonY, W, H - horizonY);

    ctx.fillStyle = rgba(mix(INK, mix(sky.top, sky.hor, 0.5), 0.42));
    ctx.beginPath();
    ctx.moveTo(treePts[0], treePts[1]);
    for (var i = 2; i < treePts.length; i += 2) { ctx.lineTo(treePts[i], treePts[i + 1]); }
    ctx.lineTo(W + 20, horizonY + 3);
    ctx.lineTo(-20, horizonY + 3);
    ctx.closePath();
    ctx.fill();
  }

  function drawRow(row, colour, lw) {
    var i, r;
    ctx.strokeStyle = colour;
    ctx.fillStyle = colour;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (i = 0; i < row.length; i++) {
      r = row[i];
      // Each gust bends the reeds downwind as it passes along the bed,
      // with a flutter on top. With reduced motion the gust does not
      // travel: the whole bed leans together, gently, while it is heard.
      var local = reduced ? windHeard : windAt(r.x / W);
      var ang = r.lean + local * 0.45;
      if (!reduced) { ang += Math.sin(reedPhase + r.ph + r.x * 0.01) * (0.012 + 0.07 * local); }
      r.local = local;
      r.tx = r.x + Math.sin(ang) * r.h;
      r.ty = H - Math.cos(ang) * r.h;
      r.ang = ang;
      ctx.moveTo(r.x, H + 2);
      ctx.quadraticCurveTo(r.x + Math.sin(ang) * r.h * 0.3, H - r.h * 0.5, r.tx, r.ty);
      if (r.leaf) {
        var lx = r.x + Math.sin(ang) * r.h * 0.12, ly = H - r.h * 0.35;
        ctx.moveTo(lx, ly);
        ctx.quadraticCurveTo(lx + r.leaf * r.h * 0.4, ly - r.h * 0.22, lx + r.leaf * r.h * 0.62, ly - r.h * 0.04);
      }
    }
    ctx.stroke();

    ctx.beginPath();
    for (i = 0; i < row.length; i++) {
      r = row[i];
      // Plumes that hang any old way when it is still stream out
      // downwind when it blows.
      var pa = r.ang - Math.PI / 2 + r.droop;
      pa += (0.35 - pa) * clamp(r.local * 0.9, 0, 0.85);
      var ex = r.tx + Math.cos(pa) * r.plume * 0.42, ey = r.ty + Math.sin(pa) * r.plume * 0.42;
      var rx = r.plume / 2;
      ctx.moveTo(ex + Math.cos(pa) * rx, ey + Math.sin(pa) * rx);
      ctx.ellipse(ex, ey, rx, r.pw, pa, 0, 6.2832);
    }
    ctx.fill();
  }

  function drawBank(colour) {
    ctx.fillStyle = colour;
    ctx.beginPath();
    ctx.moveTo(bankPts[0], bankPts[1]);
    for (var i = 2; i < bankPts.length; i += 2) { ctx.lineTo(bankPts[i], bankPts[i + 1]); }
    ctx.lineTo(W + 20, H + 2);
    ctx.lineTo(-20, H + 2);
    ctx.closePath();
    ctx.fill();
  }

  // A starling in three dimensions, drawn as it looks from the ground.
  // Its body points the way it is flying. Its wings lie square to that,
  // tipped over by however hard it is banking into a turn, and swept up
  // and down as it beats them. Then it is seen from below at the angle
  // you would be looking up at it: a bird high overhead mostly shows
  // its underside, one low over the reeds is seen side-on, and a bird
  // crossing level in front of you is little more than a dash.
  var BANK = 4, BANK_MAX = 2.5;

  // Every piece of every bird is wound the same way round, so that where
  // a wing crosses the body the two add up rather than cancelling into
  // a hole.
  function tri(x1, y1, x2, y2, x3, y3) {
    if ((x2 - x1) * (y3 - y1) - (y2 - y1) * (x3 - x1) > 0) {
      var t = x2; x2 = x3; x3 = t;
      t = y2; y2 = y3; y3 = t;
    }
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.closePath();
  }

  function birdPath(i, base) {
    var span = base * SS[i] * size[i], half = span * 0.5, len = span * 0.6;
    var oX = SX[i], oY = SY[i];

    // How far you are looking up to see it. Straight ahead at the
    // horizon; steeper the higher it is.
    var h = Math.max(0, horizonY - oY), foc = H * 0.75, hyp = Math.sqrt(h * h + foc * foc);
    var ce = foc / hyp, se = h / hyp;

    var sp = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i] + vz[i] * vz[i]) || 1e-6;
    var fx = vx[i] / sp, fy = vy[i] / sp, fz = vz[i] / sp;

    // Its up: straight up (which is -y here), leaned into the turn.
    var lx = LX[i] * BANK, ly = LY[i] * BANK, lz = LZ[i] * BANK;
    var lm = Math.sqrt(lx * lx + ly * ly + lz * lz);
    if (lm > BANK_MAX) { var q = BANK_MAX / lm; lx *= q; ly *= q; lz *= q; }
    var ux = lx, uy = ly - 1, uz = lz;
    var d = ux * fx + uy * fy + uz * fz;
    ux -= d * fx; uy -= d * fy; uz -= d * fz;
    var um = Math.sqrt(ux * ux + uy * uy + uz * uz);
    if (um < 1e-4) { ux = 0; uy = 0; uz = 1; um = 1; }
    ux /= um; uy /= um; uz /= um;

    // Its right, square to both.
    var rx = fy * uz - fz * uy, ry = fz * ux - fx * uz, rz = fx * uy - fy * ux;

    // Wings held almost flat in a glide; beating up and down otherwise.
    var a = 0.06;
    if (!reduced && (flapping[i] || panic[i] > 0.2)) { a = 0.15 + 0.75 * Math.sin(phase[i]); }
    var ca = Math.cos(a) * half, sa = Math.sin(a) * half;
    var bw = span * 0.08;

    // Each wing: the front of the shoulder, the swept-back tip, the back
    // of the shoulder, each projected onto the screen as seen from below.
    for (var side = 1; side >= -1; side -= 2) {
      var wx = rx * side, wy = ry * side, wz = rz * side;
      var ax = fx * 0.1 * len + wx * bw, ay = fy * 0.1 * len + wy * bw, az = fz * 0.1 * len + wz * bw;
      var tx = wx * ca + ux * sa - fx * 0.27 * len;
      var ty = wy * ca + uy * sa - fy * 0.27 * len;
      var tz = wz * ca + uz * sa - fz * 0.27 * len;
      var cx = -fx * 0.12 * len + wx * bw, cy = -fy * 0.12 * len + wy * bw, cz = -fz * 0.12 * len + wz * bw;
      tri(oX + ax, oY + ay * ce + az * se,
          oX + tx, oY + ty * ce + tz * se,
          oX + cx, oY + cy * ce + cz * se);
    }

    // The body is round, so it looks much the same from any side: a
    // spindle from beak to tail with a width of its own on screen, which
    // keeps a bird seen edge-on from vanishing altogether.
    var nx = fx * 0.5 * len, ny = (fy * ce + fz * se) * 0.5 * len;
    var kx = -fx * 0.47 * len, ky = -(fy * ce + fz * se) * 0.47 * len;
    var dx = kx - nx, dy = ky - ny, dl = Math.sqrt(dx * dx + dy * dy);
    if (dl < bw * 2) {
      // Coming straight at you or going straight away: just a small
      // round body between the wings.
      ctx.moveTo(oX, oY - bw);
      ctx.lineTo(oX - bw, oY);
      ctx.lineTo(oX, oY + bw);
      ctx.lineTo(oX + bw, oY);
      ctx.closePath();
      return;
    }
    var wpx = -dy / dl * bw, wpy = dx / dl * bw;
    var mx = nx + dx * 0.35, my = ny + dy * 0.35;
    ctx.moveTo(oX + nx, oY + ny);
    ctx.lineTo(oX + mx + wpx, oY + my + wpy);
    ctx.lineTo(oX + kx, oY + ky);
    ctx.lineTo(oX + mx - wpx, oY + my - wpy);
    ctx.closePath();
  }

  var HAZE = [0, 0.14, 0.28, 0.42];

  function drawBirds() {
    var base = U * 0.026, i, b;
    for (i = 0; i < n; i++) {
      var s = persp(pz[i]);
      SS[i] = s;
      SX[i] = vpx + (px[i] * U - vpx) * s;
      SY[i] = horizonY + (py[i] * U - horizonY) * s;
      bucket[i] = clamp(Math.floor(pz[i] / DEPTH * 4), 0, 3);
    }

    // Filled, and also traced with a hairline, so a wing seen exactly
    // edge-on still shows as a thin line rather than disappearing.
    var haze = mix(sky.mid, sky.hor, 0.35);
    ctx.lineJoin = 'round';
    for (b = 3; b >= 0; b--) {
      ctx.beginPath();
      for (i = 0; i < n; i++) {
        if (bucket[i] === b) { birdPath(i, base); }
      }
      var col = rgba(mix(INK, haze, HAZE[b]));
      ctx.fillStyle = col;
      ctx.strokeStyle = col;
      ctx.lineWidth = Math.max(0.5, base * persp((b + 0.5) / 4 * DEPTH) * 0.04);
      ctx.fill();
      ctx.stroke();
    }
  }

  // The circle shows exactly the place the birds are keeping out of. A
  // finger's circle opens out to the edge of the hole it is making and
  // follows the finger about. When the finger lifts, the circle widens
  // to the edge of the wary spot it leaves behind, and fades exactly as
  // the birds' wariness does, so it has gone by the time they drift
  // back in.
  function ring(x, y, r, a) {
    if (a < 0.01) { return; }
    var g = ctx.createRadialGradient(x, y, r * 0.4, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(255,255,255,' + (a * 0.3).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    ctx.stroke();
  }

  function drawMarks(dt) {
    var FR = fingerRadius(), SR = scareRadius(), id, i;
    var k = reduced ? 1 : Math.min(1, dt * 7);
    ctx.lineWidth = Math.max(1.5, U * 0.004);
    for (id in fingers) {
      if (fingers.hasOwnProperty(id)) {
        var f = fingers[id];
        f.r += (FR - f.r) * k;
        ring(f.x, f.y, f.r, 0.45);
      }
    }
    for (i = 0; i < scares.length; i++) {
      var sc = scares[i];
      sc.r += (SR - sc.r) * k;
      ring(sc.x, sc.y, sc.r, 0.45 * scareLeft(sc));
    }
  }

  function draw(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky(dt);
    drawWaterAndTrees();
    drawRow(reedsBack, rgba(mix(INK, sky.top, 0.3)), Math.max(1, U * 0.0024));
    drawBirds();
    var front = rgba(mix(INK, sky.top, 0.12));
    drawRow(reedsFront, front, Math.max(1, U * 0.003));
    drawBank(front);
    drawMarks(dt);
  }

  // ------------------------------------------------------------------
  // Sound, synthesised from nothing so the game is never silent and
  // never waits on a download. A slow pad that drifts between chords
  // which all share their notes, now and then a far-off chime, the wind
  // that is bending the reeds, and a rush of wings when the flock takes
  // fright.
  // ------------------------------------------------------------------
  var AC = null, master = null, verb = null, padBus = null, bellBus = null;
  var pink = null, windGain = null, windFilter = null, windPanner = null;
  var nextChord = 0, chordIdx = 0, nextBell = 0, soundClock = 0, lastWhoosh = 0;

  var CHORDS = [
    [50, 57, 64, 66],   // D, with the ninth
    [47, 54, 57, 62],   // B minor seventh
    [43, 50, 59, 66],   // G major seventh
    [45, 52, 59, 64],   // A, suspended
    [52, 59, 62, 66]    // E minor ninth
  ];
  var PROG = [0, 1, 2, 3, 0, 4, 2, 3];
  var CHORD_LEN = 16, CHORD_GAP = 10;
  var BELLS = [74, 76, 78, 81, 83, 86];

  // Pink noise, which sounds like moving air rather than hiss. The end of
  // the loop is faded into its start so it never clicks going round.
  function pinkBuffer(secs) {
    var len = Math.floor(AC.sampleRate * secs), fade = Math.floor(AC.sampleRate * 0.25);
    var raw = new Float32Array(len + fade), i;
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (i = 0; i < raw.length; i++) {
      var w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.969 * b2 + w * 0.153852;
      b3 = 0.8665 * b3 + w * 0.3104856;
      b4 = 0.55 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.016898;
      raw[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    var buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (i = 0; i < len; i++) {
      d[i] = i < fade ? raw[i] * (i / fade) + raw[len + i] * (1 - i / fade) : raw[i];
    }
    return buf;
  }

  function impulse(secs, decay) {
    var len = Math.floor(AC.sampleRate * secs);
    var buf = AC.createBuffer(2, len, AC.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function initAudio() {
    if (AC) {
      if (AC.state === 'suspended' && !document.hidden) { AC.resume(); }
      return;
    }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { return; }
    try { AC = new Ctx(); } catch (e) { AC = null; return; }
    var t = AC.currentTime;

    // Some older Safaris only unlock once a buffer has actually played.
    var blip = AC.createBufferSource();
    blip.buffer = AC.createBuffer(1, 1, AC.sampleRate);
    blip.connect(AC.destination);
    blip.start(0);

    var comp = AC.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-18, t);
    comp.ratio.setValueAtTime(4, t);
    comp.connect(AC.destination);

    master = AC.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(0.6, t + 4);
    master.connect(comp);

    verb = AC.createConvolver();
    verb.buffer = impulse(3.5, 2.4);
    var verbOut = AC.createGain();
    verbOut.gain.setValueAtTime(0.5, t);
    verb.connect(verbOut);
    verbOut.connect(master);

    // The pad, through a low filter that breathes open and shut very slowly.
    padBus = AC.createGain();
    padBus.gain.setValueAtTime(0.5, t);
    var padLp = AC.createBiquadFilter();
    padLp.type = 'lowpass';
    padLp.frequency.setValueAtTime(900, t);
    padLp.Q.setValueAtTime(0.5, t);
    var lfo = AC.createOscillator(), lfoAmt = AC.createGain();
    lfo.frequency.setValueAtTime(0.045, t);
    lfoAmt.gain.setValueAtTime(350, t);
    lfo.connect(lfoAmt);
    lfoAmt.connect(padLp.frequency);
    lfo.start(t);
    padBus.connect(padLp);
    padLp.connect(master);
    padLp.connect(verb);

    bellBus = AC.createGain();
    bellBus.gain.setValueAtTime(1, t);
    var bellDry = AC.createGain();
    bellDry.gain.setValueAtTime(0.3, t);
    bellBus.connect(bellDry);
    bellDry.connect(master);
    bellBus.connect(verb);

    // Wind: an airy "shhh", not a rumble. Only the middle and upper part
    // of the noise is used, through a wide band that rises as a gust
    // builds. The low part was what hummed: a phone speaker cannot play
    // it, and the narrow slice just above that it can play is a drone.
    // updateSound swells, brightens and pans it with each passing gust.
    pink = pinkBuffer(6);
    var air = AC.createBufferSource();
    air.buffer = pink;
    air.loop = true;
    var windHp = AC.createBiquadFilter();
    windHp.type = 'highpass';
    windHp.frequency.setValueAtTime(320, t);
    windHp.Q.setValueAtTime(0.5, t);
    windFilter = AC.createBiquadFilter();
    windFilter.type = 'bandpass';
    windFilter.frequency.setValueAtTime(600, t);
    windFilter.Q.setValueAtTime(0.5, t);
    windGain = AC.createGain();
    windGain.gain.setValueAtTime(0.0001, t);
    air.connect(windHp);
    windHp.connect(windFilter);
    windFilter.connect(windGain);
    var windOut = windGain;
    if (AC.createStereoPanner) {
      windPanner = AC.createStereoPanner();
      windGain.connect(windPanner);
      windOut = windPanner;
    }
    windOut.connect(master);
    air.start(t);

    nextChord = t + 0.1;
    nextBell = t + 6 + Math.random() * 6;
    if (AC.state === 'suspended') { AC.resume(); }
  }

  // Pure tones only: a sine and a quiet sine an octave up. Detuned
  // copies and brighter waveforms beat against each other several times
  // a second on the low notes, and a dozen of those at once is the
  // sound of a swarm of bees.
  function padNote(t, midi, len) {
    var f = mtof(midi), g = AC.createGain();
    var level = midi < 50 ? 0.16 : 0.13;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(level, t + len * 0.35);
    g.gain.setValueAtTime(level, t + len * 0.55);
    g.gain.linearRampToValueAtTime(0.0001, t + len);
    g.connect(padBus);
    [[1, 1], [2, 0.22]].forEach(function (v) {
      var o = AC.createOscillator(), og = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * v[0], t);
      og.gain.setValueAtTime(v[1], t);
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + len + 0.1);
    });
  }

  function bell(t) {
    var f = mtof(BELLS[Math.floor(Math.random() * BELLS.length)]);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 4);
    g.connect(bellBus);
    [[1, 1], [2, 0.18]].forEach(function (v) {
      var o = AC.createOscillator(), og = AC.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * v[0], t);
      og.gain.setValueAtTime(v[1], t);
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + 4.1);
    });
  }

  function scheduleMusic() {
    if (!AC || !padBus || AC.state !== 'running') { return; }
    var now = AC.currentTime;
    if (nextChord < now) { nextChord = now + 0.1; }
    if (nextBell < now) { nextBell = now + 2 + Math.random() * 4; }
    while (nextChord < now + 0.5) {
      var ch = CHORDS[PROG[chordIdx % PROG.length]];
      for (var k = 0; k < ch.length; k++) { padNote(nextChord, ch[k], CHORD_LEN); }
      chordIdx += 1;
      nextChord += CHORD_GAP;
    }
    if (nextBell < now + 0.5) {
      bell(nextBell);
      nextBell += 6 + Math.random() * 8;
    }
  }
  setInterval(scheduleMusic, 250);

  // Wings: one soft rush when the flock takes fright, bigger the more
  // birds were startled, from the side of the screen it happened on. A
  // tap on empty sky startles nobody, so it makes no sound. Built like
  // the wind, from the airy part of the noise, for the same reason.
  function whoosh(birds, x) {
    if (!AC || !pink || AC.state !== 'running' || birds < 3) { return; }
    var t = AC.currentTime + 0.01;
    if (t - lastWhoosh < 0.2) { return; }
    lastWhoosh = t;
    var k = clamp(birds / (n * 0.3), 0.25, 1);
    var src = AC.createBufferSource();
    src.buffer = pink;
    var hp = AC.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(320, t);
    hp.Q.setValueAtTime(0.5, t);
    var band = AC.createBiquadFilter();
    band.type = 'bandpass';
    band.Q.setValueAtTime(0.5, t);
    band.frequency.setValueAtTime(500, t);
    band.frequency.exponentialRampToValueAtTime(1100 + 900 * k, t + 0.15);
    band.frequency.exponentialRampToValueAtTime(450, t + 1.1);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25 + 0.45 * k, t + 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    src.connect(hp);
    hp.connect(band);
    band.connect(g);
    var out = g;
    if (AC.createStereoPanner) {
      var pan = AC.createStereoPanner();
      pan.pan.setValueAtTime(clamp((x / W - 0.5) * 1.2, -0.8, 0.8), t);
      g.connect(pan);
      out = pan;
    }
    out.connect(master);
    src.start(t, Math.random() * 5);
    src.stop(t + 1.3);
  }

  function updateSound(dt) {
    soundClock += dt;
    if (soundClock < 0.05 || !AC || !windGain) { return; }
    soundClock = 0;
    var now = AC.currentTime;
    // Kept well under the music: a gust is something passing, not a
    // sound to listen to. Small gusts are barely there at all.
    windGain.gain.setTargetAtTime(0.0001 + 0.2 * Math.pow(gustHeard, 1.8), now, 0.15);
    windFilter.frequency.setTargetAtTime(600 + 1400 * gustHeard, now, 0.15);
    if (windPanner) { windPanner.pan.setTargetAtTime(windPan, now, 0.2); }
  }

  // ------------------------------------------------------------------
  // Frame loop. If the device is struggling, the flock thins a little
  // rather than stuttering; it never grows back mid-flight.
  // ------------------------------------------------------------------
  var last = 0;
  var workSum = 0, workFrames = 0, workClock = 0, slowWindows = 0;

  function frame(now) {
    var dt = last ? (now - last) / 1000 : 0.016;
    last = now;
    dt = clamp(dt, 0.001, 0.05);

    var t0 = window.performance ? performance.now() : 0;
    updateSky(dt);
    updateWind(dt);
    updateHome(dt);
    step(dt);
    draw(dt);
    updateSound(dt);

    // A single huge frame is the browser doing something else (waking,
    // resizing), not the flock being too big, so it is left out; and it
    // takes two slow stretches in a row before any birds are let go.
    var work = window.performance ? performance.now() - t0 : 0;
    if (window.performance && !document.hidden && work < 50) {
      workSum += work;
      workFrames += 1;
      workClock += dt;
      if (workClock > 2) {
        slowWindows = workSum / workFrames > 11 ? slowWindows + 1 : 0;
        if (slowWindows >= 2 && n > MIN) {
          n = Math.max(MIN, Math.round(n * 0.8));
          slowWindows = 0;
        }
        workSum = 0; workFrames = 0; workClock = 0;
      }
    }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------
  // Input
  // ------------------------------------------------------------------
  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    fingers[e.pointerId] = { x: e.clientX, y: e.clientY, r: fingerRadius() * (reduced ? 1 : 0.25) };
    whoosh(startle(e.clientX, e.clientY), e.clientX);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not every browser */ }
  });
  canvas.addEventListener('pointermove', function (e) {
    var f = fingers[e.pointerId];
    if (f) { f.x = e.clientX; f.y = e.clientY; }
  });
  function lift(e) {
    var f = fingers[e.pointerId];
    if (f) {
      scares.push({ x: f.x, y: f.y, life: SCARE_LIFE, r: f.r });
      if (scares.length > 8) { scares.shift(); }
    }
    delete fingers[e.pointerId];
  }
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  canvas.addEventListener('lostpointercapture', lift);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // A phone will not make a sound until a finger has asked for one, and
  // on some it has to be the lifting of the finger that asks.
  ['touchend', 'pointerup', 'click'].forEach(function (name) {
    document.addEventListener(name, initAudio, true);
  });

  document.addEventListener('visibilitychange', function () {
    if (!AC) { return; }
    if (document.hidden) { AC.suspend(); }
    else { AC.resume(); }
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 220);
  });

  layout();
  updateSky(0);
  updateWind(0);
  updateHome(0);
  spawnFlock();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
