<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#16294a">
<title>Inside Me</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #16294a;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #fx { position: fixed; left: 0; top: 0; pointer-events: none; }

  /* ---- what shows, and what can be touched ---- */
  #stage .skf { fill: var(--skin); }
  #stage .sko { stroke: var(--skino); }
  #stage .sks { stroke: var(--skin); }
  #stage .skd { fill: var(--skind); }
  #stage .hrf { fill: var(--hair); }
  #stage .hrs { stroke: var(--hair); }

  #stage .sk { opacity: 0.26; pointer-events: none; transition: opacity .45s; }
  #stage.S-body .sk { opacity: 1; pointer-events: auto; }

  #stage .cl, #stage .bh, #stage .sy {
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .4s, visibility 0s .4s;
  }
  #stage.S-body .cl, #stage.S-body .bh {
    opacity: 1; visibility: visible; pointer-events: auto;
    transition: opacity .4s, visibility 0s;
  }
  #stage .ground, #stage .bgSky { opacity: 0; transition: opacity .5s; }
  #stage.S-body .ground, #stage.S-body .bgSky { opacity: 1; }
  #stage .xglow { opacity: 0.9; transition: opacity .5s; }
  #stage.S-body .xglow { opacity: 0; }
  .hit { fill: #fff; fill-opacity: 0; }
  .hitl { fill: none; stroke: #fff; stroke-opacity: 0; }

  /* detail levels: coarse things give way to fine ones as you zoom */
  #stage .lod1 { display: none; }
  #stage.Z1 .lod1 { display: inline; }
  #stage.Z1 .lod0 { display: none; }

  /* close-ups */
  #stage .scene { display: none; }
  #stage.Sc .scene { display: inline; }
  #stage .sc { display: none; }

  /* unplaced pieces in the puzzle are outlines */
  #stage .sil :not(.ln):not(.hitl) {
    fill: rgba(255,255,255,0.14); stroke: rgba(255,255,255,0.55);
    stroke-width: 2; stroke-dasharray: 6 5;
  }
  #stage .sil .ln { fill: none; stroke: rgba(255,255,255,0.3); }
  #stage .sil .dt { display: none; }
  #stage .sil .hitl { stroke-opacity: 0; fill: none; }
  #stage .sil.hint { animation: hint 1.1s ease-in-out infinite; }
  #stage .sil.hint :not(.ln):not(.hitl) { fill: rgba(255,230,120,0.38); }
  #stage .sil.hint .ln { stroke: rgba(255,230,120,0.7); }
  @keyframes hint { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .ring { animation: ringfade 1.2s ease-out forwards; }
  @keyframes ringfade { 0% { opacity: 1; } 100% { opacity: 0; } }
  .pc { cursor: grab; }

  /* ---- buttons ---- */
  .btn {
    position: fixed; padding: 0; border: 0; border-radius: 18px;
    background: rgba(255,255,255,0.9); box-shadow: 0 2px 7px rgba(0,0,0,0.28);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s, background .2s;
    -webkit-tap-highlight-color: transparent; z-index: 5;
  }
  .btn svg { width: 72%; height: 72%; display: block; }
  .btn.on { background: #ffd54a; transform: scale(1.1); }
  .btn.small { border-radius: 14px; }
  .btn.dim { opacity: 0.4; pointer-events: none; }
  .btn.hide { display: none; }
  #sysBtn { background: #fff; border: 4px solid var(--sc, #ffd54a); }
  #story { background: #ffd54a; }
  #story.go { animation: pulse 1.2s ease-in-out infinite; }

  #sysmenu {
    position: fixed; display: none; z-index: 8; padding: 12px; gap: 10px;
    grid-template-columns: repeat(3, 1fr);
    background: rgba(20,34,66,0.94); border-radius: 26px; box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .sysb {
    border: 0; border-radius: 20px; padding: 6px 4px 8px; cursor: pointer;
    background: #fff; color: #22305a; font: 800 14px "Trebuchet MS", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-bottom: 6px solid var(--c); -webkit-tap-highlight-color: transparent;
  }
  .sysb svg { width: 62%; max-height: 62%; display: block; }
  .sysb.on { background: #ffd54a; }

  #card {
    position: fixed; display: none; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.95); border-radius: 24px; padding: 12px 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.25); z-index: 4; color: #22305a;
    overflow: hidden;
  }
  #cardIcon { flex: none; display: flex; align-items: center; justify-content: center; }
  #cardIcon svg { width: 100%; height: 100%; display: block; }
  #cardText { min-width: 0; flex: 1 1 auto; }
  #cardName { font-weight: 800; line-height: 1.05; }
  #cardAlt { font-style: italic; opacity: 0.65; margin-top: 3px; }
  #cardFact { margin-top: 6px; line-height: 1.25; opacity: 0.85; }
  #cardCount {
    flex: none; min-width: 1.7em; height: 1.7em; border-radius: 50%;
    background: #ffd54a; color: #4b3a00; font-weight: 800; display: none;
    align-items: center; justify-content: center; padding: 0 .3em;
  }
  #cardZoom {
    flex: none; width: 1.9em; height: 1.9em; border-radius: 50%; border: 0; padding: 0;
    background: #ffd54a; display: none; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); animation: pulse 1.4s ease-in-out infinite;
  }
  #cardZoom svg { width: 70%; height: 70%; display: block; }
  #dots { position: fixed; display: none; align-items: center; justify-content: center; gap: 12px; z-index: 4; }
  .dot {
    width: 44px; height: 44px; border-radius: 50%; border: 4px solid #fff; padding: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer; transition: transform .15s;
  }
  .dot.on { transform: scale(1.25); border-color: #ffd54a; }
  #tip {
    position: fixed; display: none; padding: 6px 16px; border-radius: 999px; z-index: 4;
    background: rgba(255,255,255,0.93); color: #22305a; font-weight: 800;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25); pointer-events: none;
  }
  #again { display: none; width: 96px; height: 96px; border-radius: 50%; background: #ffd54a; z-index: 6; }
  #again svg { width: 60%; height: 60%; }
  #again.pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  @media (prefers-reduced-motion: reduce) {
    .btn, .dot, #stage .sk, #stage .cl, #stage .bh, #stage .sy,
    #stage .ground, #stage .bgSky, #stage .xglow { transition: none !important; }
    #stage .sil.hint, #again.pulse, #cardZoom, #story.go { animation: none !important; }
    .ring { animation: none !important; opacity: 0.8; }
  }
</style>
</head>
<body>
<script>
// Full screen on the first touch, and a way back if it is off.
// (Same arrangement as the other games: see animal-band.html for why.)
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#40563a" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

<svg id="stage" xmlns="http://www.w3.org/2000/svg" aria-label="Inside Me"></svg>
<canvas id="fx"></canvas>
<div id="card">
  <div id="cardIcon"></div>
  <div id="cardText"><div id="cardName"></div><div id="cardAlt"></div><div id="cardFact"></div></div>
  <div id="cardCount"></div>
  <button id="cardZoom" aria-label="Zoom in"></button>
</div>
<div id="dots"></div>
<div id="tip"></div>
<div id="sysmenu"></div>
<button class="btn" id="again" aria-label="Again"></button>

<script>
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';
  var stage = document.getElementById('stage');

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function f(n) { return Math.round(n * 100) / 100; }
  function el(tag, attrs, parent) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) { for (var k in attrs) { n.setAttribute(k, attrs[k]); } }
    if (parent) { parent.appendChild(n); }
    return n;
  }
  function clear(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function store(k, v) {
    try {
      if (v === undefined) { return window.localStorage.getItem('insideme.' + k); }
      window.localStorage.setItem('insideme.' + k, v);
    } catch (e) { /* private window or data: page */ }
    return null;
  }

  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = reduceQuery.matches;
  if (reduceQuery.addEventListener) {
    reduceQuery.addEventListener('change', function (e) { reduced = e.matches; });
  }

  // ------------------------------------------------------------------
  // Sound. Everything is synthesised, so the game is never silent and
  // never waits on a download. Names are spoken by the device's own
  // speech if it has any.
  // ------------------------------------------------------------------
  var AC = null, master = null, noiseBuf = null;
  var muted = store('muted') === '1';
  var factsOn = store('facts') === '1';
  var sfxLast = {}, sfxTimes = [];

  function ensureAudio() {
    if (AC) { if (AC.state === 'suspended') { AC.resume(); } return; }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { return; }
    try { AC = new Ctx(); } catch (e) { AC = null; return; }
    var comp = AC.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-16, AC.currentTime);
    comp.ratio.setValueAtTime(6, AC.currentTime);
    master = AC.createGain();
    master.gain.setValueAtTime(0.5, AC.currentTime);
    master.connect(comp);
    comp.connect(AC.destination);
    var n = Math.floor(AC.sampleRate * 0.5);
    noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) { d[i] = Math.random() * 2 - 1; }
    if (AC.state === 'suspended') { AC.resume(); }
  }

  function tone(freq, dur, o) {
    o = o || {};
    var t = AC.currentTime + (o.at || 0);
    var os = AC.createOscillator(), g = AC.createGain();
    os.type = o.type || 'sine';
    os.frequency.setValueAtTime(freq, t);
    if (o.to) { os.frequency.exponentialRampToValueAtTime(o.to, t + dur); }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.4, t + Math.min(0.012, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.lp) {
      var lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = o.lp;
      os.connect(lp); lp.connect(g);
    } else { os.connect(g); }
    g.connect(master);
    os.start(t); os.stop(t + dur + 0.05);
  }

  function noise(dur, o) {
    o = o || {};
    var t = AC.currentTime + (o.at || 0);
    var s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; s.loop = true;
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(o.f || 1000, t);
    if (o.to) { bp.frequency.exponentialRampToValueAtTime(o.to, t + dur); }
    bp.Q.value = o.q || 1;
    var atk = Math.min(o.atk || 0.006, dur * 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.4, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  }

  var PENT = [0, 2, 4, 7, 9];
  function pent(i) { return 392 * Math.pow(2, (PENT[i % 5] + 12 * Math.floor(i / 5)) / 12); }

  var SFX = {
    thump: function () {
      for (var i = 0; i < 3; i++) {
        tone(110, 0.2, { to: 42, vol: 0.9, at: i * 0.8 });
        tone(95, 0.16, { to: 40, vol: 0.6, at: i * 0.8 + 0.2 });
      }
    },
    breath: function () {
      for (var i = 0; i < 2; i++) { noise(1.2, { f: 500, to: 1500, q: 0.6, vol: 0.32, atk: 0.55, at: i * 1.4 }); }
    },
    gurgle: function () {
      for (var i = 0; i < 4; i++) {
        noise(0.25, { f: 300 + Math.random() * 300, to: 150, q: 6, vol: 0.5, at: i * 0.22 });
        tone(90 + Math.random() * 50, 0.22, { type: 'triangle', vol: 0.25, at: i * 0.22, to: 60 });
      }
    },
    clack: function () { noise(0.05, { f: 2600, q: 2, vol: 0.6 }); tone(900, 0.06, { type: 'triangle', to: 500, vol: 0.3 }); },
    chatter: function () {
      for (var i = 0; i < 6; i++) {
        noise(0.04, { f: 2400, q: 2, vol: 0.5, at: i * 0.1 });
        tone(800, 0.05, { type: 'triangle', to: 450, vol: 0.25, at: i * 0.1 });
      }
    },
    think: function () { tone(660, 0.25, { vol: 0.2 }); tone(880, 0.25, { vol: 0.2, at: 0.12 }); tone(1320, 0.4, { vol: 0.18, at: 0.26 }); },
    whoosh: function () { noise(0.9, { f: 400, to: 2200, q: 0.7, vol: 0.35, atk: 0.3 }); },
    gulp: function () { tone(220, 0.12, { to: 90, vol: 0.5 }); tone(200, 0.14, { to: 80, vol: 0.5, at: 0.18 }); },
    blop: function () { tone(300, 0.12, { to: 600, vol: 0.4 }); tone(260, 0.12, { to: 520, vol: 0.3, at: 0.22 }); },
    drip: function () { tone(1000, 0.1, { to: 500, vol: 0.35 }); tone(1000, 0.1, { to: 520, vol: 0.2, at: 0.3 }); },
    blink: function () { tone(1500, 0.03, { vol: 0.15 }); tone(1300, 0.03, { vol: 0.12, at: 0.24 }); },
    wiggle: function () { for (var i = 0; i < 5; i++) { tone(700 + (i % 2) * 220, 0.06, { vol: 0.18, at: i * 0.08 }); } },
    sniff: function () { noise(0.2, { f: 3200, to: 1500, q: 2, vol: 0.4 }); noise(0.2, { f: 3200, to: 1500, q: 2, vol: 0.35, at: 0.3 }); },
    ahh: function () { tone(210, 0.8, { type: 'sawtooth', vol: 0.22, lp: 900, to: 190 }); },
    giggle: function () { for (var i = 0; i < 7; i++) { tone(620 + Math.random() * 220, 0.07, { type: 'triangle', to: 900, vol: 0.2, at: i * 0.085 }); } },
    swish: function () { noise(0.28, { f: 700, to: 2600, q: 0.8, vol: 0.3, atk: 0.1 }); },
    boop: function () { tone(520, 0.14, { to: 380, vol: 0.35 }); },
    tap: function () { tone(160, 0.07, { to: 90, vol: 0.5 }); tone(160, 0.07, { to: 90, vol: 0.45, at: 0.17 }); },
    boing: function () { tone(300, 0.28, { to: 150, vol: 0.3 }); tone(160, 0.2, { to: 280, vol: 0.25, at: 0.2 }); },
    layer: function () { noise(0.4, { f: 300, to: 2400, q: 0.8, vol: 0.28, atk: 0.2 }); },
    pick: function () { tone(520, 0.08, { vol: 0.25 }); },
    zoomin: function () { noise(0.55, { f: 250, to: 3200, q: 0.8, vol: 0.3, atk: 0.3 }); tone(300, 0.5, { to: 900, vol: 0.12, type: 'triangle' }); },
    zoomout: function () { noise(0.5, { f: 3000, to: 250, q: 0.8, vol: 0.28, atk: 0.1 }); tone(900, 0.45, { to: 300, vol: 0.12, type: 'triangle' }); },
    zap: function () { for (var i = 0; i < 6; i++) { tone(500 + i * 150, 0.07, { type: 'square', vol: 0.1, at: i * 0.06 }); } },
    munch: function () { for (var i = 0; i < 3; i++) { noise(0.09, { f: 700, q: 1.5, vol: 0.5, at: i * 0.16 }); tone(140, 0.08, { vol: 0.3, at: i * 0.16, to: 80 }); } },
    ding: function () { tone(1200, 0.5, { vol: 0.22 }); tone(1800, 0.4, { vol: 0.12, at: 0.05 }); },
    squelch: function () { noise(0.3, { f: 400, to: 150, q: 5, vol: 0.5 }); tone(120, 0.25, { to: 60, vol: 0.3, type: 'triangle' }); },
    hum: function () { tone(180, 0.9, { type: 'triangle', vol: 0.22, to: 220 }); tone(270, 0.9, { type: 'sine', vol: 0.12 }); },
    cough: function () { noise(0.16, { f: 900, q: 1, vol: 0.5 }); noise(0.14, { f: 800, q: 1, vol: 0.4, at: 0.2 }); },
    sparkle: function () { for (var i = 0; i < 5; i++) { tone(1000 + i * 260, 0.12, { vol: 0.12, at: i * 0.05 }); } }
  };

  function sfx(name, arg) {
    if (!AC || muted) { return; }
    var now = performance.now();
    if (sfxLast[name] && now - sfxLast[name] < 130) { return; }
    sfxTimes = sfxTimes.filter(function (t) { return now - t < 1000; });
    if (sfxTimes.length > 12) { return; }
    sfxLast[name] = now; sfxTimes.push(now);
    try {
      if (name === 'place') {
        tone(pent(arg), 0.35, { type: 'triangle', vol: 0.4 });
        tone(pent(arg + 2), 0.45, { type: 'triangle', vol: 0.3, at: 0.1 });
      } else if (name === 'tada') {
        for (var i = 0; i < 8; i++) { tone(pent(i + 2), 0.45, { type: 'triangle', vol: 0.32, at: i * 0.11 }); }
        tone(pent(10), 1.0, { type: 'sine', vol: 0.3, at: 0.9 });
      } else if (SFX[name]) { SFX[name](); }
    } catch (e) { /* audio is a bonus */ }
  }

  var speechOk = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  var spT = 0, spTimer = null, spText = '', spVoice = null;
  function pickVoice() {
    if (spVoice) { return spVoice; }
    try {
      var vs = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < vs.length; i++) { if (/en[-_]GB/i.test(vs[i].lang)) { spVoice = vs[i]; break; } }
    } catch (e) { /* none */ }
    return spVoice;
  }
  function say(text) {
    if (muted || !speechOk) { return; }
    spText = text;
    var wait = Math.max(0, 650 - (Date.now() - spT));
    if (spTimer) { clearTimeout(spTimer); }
    spTimer = setTimeout(function () {
      spTimer = null; spT = Date.now();
      try {
        window.speechSynthesis.cancel();
        var u = new window.SpeechSynthesisUtterance(spText);
        u.lang = 'en-GB'; u.rate = 0.9; u.pitch = 1.05;
        var v = pickVoice(); if (v) { u.voice = v; }
        window.speechSynthesis.speak(u);
      } catch (e) { /* no speech here */ }
    }, wait);
  }

  // ------------------------------------------------------------------
  // The body systems. Each one is a layer you can look at on its own;
  // the ghosts are the faint layers shown behind it for context.
  // ------------------------------------------------------------------
  var SYS = [
    { id: 'body',    n: 'Me',            c: '#f7b98a', ghost: [],                  view: [25, -10, 375, 800] },
    { id: 'bones',   n: 'Bones',         c: '#e9dcb8', ghost: [],                  view: [25, -10, 375, 800] },

  function ribGeo(i) {
    var sy = 222 + i * 13.6, hw = 28 + 48 * Math.sin(Math.PI * (i + 0.8) / 13.2), g = { sy: sy, hw: hw };

    else if (i < 10) { g.tx = 200 - hw * 0.62; g.ty = sy + 30; g.cx = 200 - 24 + (i - 7) * 3; g.cy = 296 + (i - 7) * 6; }
    else { g.tx = 200 - hw * 0.7; g.ty = sy + 22; }

    var rows = Math.ceil(SLOTS / TR.cols);
    var top = 26;
    TR.sz = Math.min(panel.w / TR.cols, (panel.h - top) / rows);
    TR.x0 = panel.x + (panel.w - TR.cols * TR.sz) / 2;
    TR.y0 = panel.y + top + ((panel.h - top) - rows * TR.sz) / 2;
    if (B) {

  }
  function slotPos(i) { return [TR.x0 + (i % TR.cols + 0.5) * TR.sz, TR.y0 + (Math.floor(i / TR.cols) + 0.5) * TR.sz]; }

  function fitPiece(pc) {
    var it = ITEMS[pc.id], pos = slotPos(pc.slot);

  function setPlaced(it, v) {

  function drawDots() {

    if (!B) { return; }
    var n = B.total, r = clamp(panel.w / (n * 3), 3, 8), gap = r * 2.8, x0 = panel.x + panel.w / 2 - (n - 1) * gap / 2;
    for (var i = 0; i < n; i++) {
      el('circle', { cx: x0 + i * gap, cy: panel.y + 12, r: r, fill: i < B.placed ? '#ffd54a' : 'rgba(255,255,255,0.3)' }, dotsG);

  function makePiece(id, slot, animate) {
    var it = ITEMS[id];
    var g = el('g', { 'class': 'pc', 'data-piece': id }, trayG);
    var inner = el('g', { transform: 'translate(' + f(-(it.bb.x + it.bb.w / 2)) + ' ' + f(-(it.bb.y + it.bb.h / 2)) + ')' }, g);
    drawPiece(inner, it);
    el('circle', { cx: it.bb.x + it.bb.w / 2, cy: it.bb.y + it.bb.h / 2, r: Math.max(it.bb.w, it.bb.h) * 0.62, fill: '#fff', 'fill-opacity': 0 }, inner);
    var pc = { id: id, g: g, slot: slot, k: 1, x: 0, y: 0, s: 1 };

      kick();

  }

  function fillTray(animate) {
    for (var i = 0; i < SLOTS; i++) {

  function clearTray() {

  // what is on screen right now, and so what can be built
  function buildSet() {
    var r = [(area.x - viewTo.tx) / viewTo.s, (area.y - viewTo.ty) / viewTo.s, (area.x + area.w - viewTo.tx) / viewTo.s, (area.y + area.h - viewTo.ty) / viewTo.s];

      var it = ITEMS[id];

      return it.nodes.some(function (n) { var c = n.__c; return c[0] > r[0] - px && c[0] < r[2] + px && c[1] > r[1] - py && c[1] < r[3] + py; });

  function startBuild() {
    var old = B ? B.ids : null;
    if (old) { old.forEach(function (id) { setPlaced(ITEMS[id], true); }); }

    var ids = buildSet();
    if (!ids.length) { return; }
    shuffle(ids);
    ids.forEach(function (id) { setPlaced(ITEMS[id], false); });

  function toBody(px, py) { return [(px - view.tx) / view.s, (py - view.ty) / view.s]; }

  function glide(pc, done) {
    var from = { x: pc.x, y: pc.y, s: pc.s };
    fitPiece(pc);
    var to = { x: pc.x, y: pc.y, s: pc.s };

  window.addEventListener('resize', function () { clearTimeout(resizeT); resizeT = setTimeout(layout, 60); });
  window.addEventListener('orientationchange', function () { clearTimeout(resizeT); resizeT = setTimeout(layout, 200); });
  if (reduceQuery.addEventListener) { reduceQuery.addEventListener('change', function () { kick(); }); }

  // ------------------------------------------------------------------
  // Start
  // ------------------------------------------------------------------
  setSkin(skinIdx);
  UI.dots.querySelectorAll('.dot').forEach(function (d, i) { d.classList.toggle('on', i === skinIdx); });
  refreshToggles();
  applyState(true);
  hello = performance.now() + 700;
  nextBlink = performance.now() + 2000;
  kick();
})();
</script>
</body>
