<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3f4">
<title>Animal Mash</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #8fd3f4;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
  #stagewrap { position: relative; flex: 1 1 auto; min-height: 0; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #tray {
    flex: 0 0 auto;
    display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
    gap: 10px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    max-height: 36dvh; overflow-y: auto;
    background: #fff8e3; border-top: 5px solid #f2c96b;
  }
  .pick {
    width: 76px; height: 76px; padding: 0; border: 4px solid transparent; border-radius: 50%;
    background: none; cursor: pointer; flex: 0 0 auto;
  }
  .pick svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .pick.on { border-color: #ff7a3d; background: #ffe2c8; transform: scale(1.08); }
  .pick:active { transform: scale(0.92); }
  #ctl { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
  #ctl button {
    width: 62px; height: 62px; padding: 0; border: 0; border-radius: 18px;
    background: rgba(255,255,255,0.85); box-shadow: 0 2px 6px rgba(0,0,0,0.25); cursor: pointer;
  }
  #ctl button:active { transform: scale(0.92); }
  #ctl svg { width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.08); } }
  .actor { cursor: pointer; }
  @media (orientation: landscape) {
    #tray { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; max-height: none; }
    .pick { width: 68px; height: 68px; }
  }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>
<script>
// Full screen on the first touch, with a small button to get it back.
// (Same arrangement as the other games: only pointerup/touchend count as a
// gesture on a touchscreen.)
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }
  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) { document.removeEventListener(EVENTS[k], autoTry, true); }
  }
  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }
  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#40563a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/></g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }
  document.addEventListener('fullscreenchange', function () { if (isFull()) { stopAuto(); } sync(); });
  document.addEventListener('webkitfullscreenchange', function () { if (isFull()) { stopAuto(); } sync(); });
  for (i = 0; i < EVENTS.length; i++) { document.addEventListener(EVENTS[i], autoTry, true); }
  sync();
})();
</script>

<div id="app">
  <div id="stagewrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" aria-label="Animal Mash">
      <defs>
        <linearGradient id="am-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6cc5f0"/><stop offset="1" stop-color="#d9f3ff"/>
        </linearGradient>
        <linearGradient id="am-grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7fd05a"/><stop offset="1" stop-color="#4aa043"/>
        </linearGradient>
        <radialGradient id="am-sun" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff6b0" stop-opacity="1"/>
          <stop offset="0.45" stop-color="#ffe45c" stop-opacity="1"/>
          <stop offset="0.5" stop-color="#ffe45c" stop-opacity="0.35"/>
          <stop offset="1" stop-color="#ffe45c" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g id="bg"></g>
      <g id="slots"></g>
      <g id="labels"></g>
      <g id="actors"></g>
      <g id="fx"></g>
    </svg>
    <div id="ctl">
      <button id="bDice" aria-label="Surprise me">
        <svg viewBox="0 0 62 62"><g fill="none" stroke="#3b2f55" stroke-width="4" stroke-linejoin="round">
          <rect x="12" y="12" width="38" height="38" rx="10" fill="#ffd54a"/></g>
          <g fill="#3b2f55"><circle cx="22" cy="22" r="4"/><circle cx="40" cy="22" r="4"/><circle cx="31" cy="31" r="4"/><circle cx="22" cy="40" r="4"/><circle cx="40" cy="40" r="4"/></g></svg>
      </button>
      <button id="bSwap" class="hidden" aria-label="Swap">
        <svg viewBox="0 0 62 62"><g fill="none" stroke="#3b2f55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 24 H44 M36 15 L45 24 L36 33"/><path d="M48 40 H18 M26 31 L17 40 L26 49"/></g></svg>
      </button>
      <button id="bClear" class="hidden" aria-label="Start again">
        <svg viewBox="0 0 62 62"><g fill="none" stroke="#c4413a" stroke-width="6" stroke-linecap="round">
          <path d="M18 18 L44 44 M44 18 L18 44"/></g></svg>
      </button>
    </div>
  </div>
  <div id="tray"></div>
</div>

<script>
(function () {
  'use strict';

  // ===================================================================
  // ANIMALS
  //
  // To add an animal, append one entry to ANIMALS. Nothing else needs to
  // change: the tray, the mixing and the names all read from this list.
  //
  //   head  drawn facing the viewer. Origin (0,0) is the point where the
  //         neck joins, and the face sits above it (negative y), about
  //         120 units across.
  //   body  drawn facing right (side on). Origin (0,0) is the ground under
  //         the middle of the animal; the animal stands at negative y.
  //   tail  drawn from its own origin, trailing off to the left.
  //   neck  [x,y] on the body where a head's origin is pinned.
  //   tailAt [x,y] on the body where a tail's origin is pinned.
  //   hs    how big a head looks on this body.
  //   pre / suf  the two halves of the mashed-up name.
  //   voice [wave, freq0, freq1, start, length, volume, lowpass]  per note.
  // ===================================================================

  var OL = '#2f2540';

  function part(inner) {
    return '<g stroke="' + OL + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">' + inner + '</g>';
  }
  // A fat line with an outline: tails, necks, trunks.
  function tube(d, w, col) {
    return '<path d="' + d + '" fill="none" stroke="' + OL + '" stroke-width="' + (w + 8) + '"/>'
         + '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + w + '"/>';
  }
  function E(x, y, r) {
    return '<g class="blink"><circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" stroke-width="3"/>'
         + '<circle cx="' + (x + r * 0.1) + '" cy="' + (y + r * 0.1) + '" r="' + (r * 0.58) + '" fill="' + OL + '" stroke="none"/>'
         + '<circle cx="' + (x + r * 0.32) + '" cy="' + (y - r * 0.22) + '" r="' + (r * 0.22) + '" fill="#fff" stroke="none"/></g>';
  }
  function blush(x, y, r) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + (r || 9) + '" fill="#ff8aa0" fill-opacity="0.55" stroke="none"/>';
  }
  function mirror(s) { return '<g transform="scale(-1,1)">' + s + '</g>'; }

  var ANIMALS = [];

  // ---------------------------------------------------------------- CAT
  (function () {
    var C = '#f2a24b', D = '#c46a1a', CR = '#fff3df';
    var ear = '<path d="M -58 -72 L -54 -130 L -14 -98 Z" fill="' + C + '"/>'
            + '<path d="M -50 -88 L -48 -114 L -30 -100 Z" fill="#f4a1b0" stroke="none"/>';
    ANIMALS.push({
      id: 'cat', name: 'Cat', pre: 'Cat', suf: 'cat', bg: '#ffe9c4',
      head: part(ear + mirror(ear)
        + '<ellipse cx="0" cy="-55" rx="64" ry="52" fill="' + C + '"/>'
        + '<path d="M 0 -104 L 0 -88 M -15 -102 L -12 -89 M 15 -102 L 12 -89" fill="none" stroke="' + D + '" stroke-width="5"/>'
        + '<ellipse cx="0" cy="-36" rx="27" ry="18" fill="' + CR + '" stroke="none"/>'
        + E(-27, -62, 13) + E(27, -62, 13)
        + '<path d="M -7 -48 L 7 -48 L 0 -40 Z" fill="#ee7f93" stroke-width="2.5"/>'
        + '<path d="M 0 -40 L 0 -33 M 0 -33 Q -9 -24 -18 -32 M 0 -33 Q 9 -24 18 -32" fill="none" stroke-width="3"/>'
        + '<path d="M -42 -42 L -88 -52 M -42 -35 L -88 -33 M 42 -42 L 88 -52 M 42 -35 L 88 -33" fill="none" stroke-width="2.5"/>'
        + blush(-46, -38) + blush(46, -38)),
      body: part(
          '<rect x="-72" y="-62" width="34" height="60" rx="16" fill="#d98b36"/>'
        + '<rect x="30" y="-62" width="34" height="60" rx="16" fill="#d98b36"/>'
        + '<rect x="-98" y="-62" width="36" height="60" rx="17" fill="' + C + '"/>'
        + '<rect x="56" y="-62" width="36" height="60" rx="17" fill="' + C + '"/>'
        + '<ellipse cx="-80" cy="-6" rx="22" ry="9" fill="#fff" stroke-width="3"/>'
        + '<ellipse cx="74" cy="-6" rx="22" ry="9" fill="#fff" stroke-width="3"/>'
        + '<ellipse cx="0" cy="-100" rx="108" ry="56" fill="' + C + '"/>'
        + '<ellipse cx="6" cy="-72" rx="70" ry="20" fill="' + CR + '" stroke="none"/>'
        + '<path d="M -50 -152 Q -44 -132 -54 -118 M -14 -154 Q -8 -134 -18 -120 M 24 -150 Q 30 -132 20 -118" fill="none" stroke="' + D + '" stroke-width="7"/>'),
      tail: part(tube('M 0 0 C -34 0 -58 -34 -44 -88', 20, C)
        + '<circle cx="-44" cy="-88" r="1" fill="none" stroke="none"/>'),
      neck: [82, -112], tailAt: [-100, -112], hs: 1,
      voice: [['triangle', 520, 820, 0, 0.14, 0.5, 2600], ['triangle', 820, 540, 0.14, 0.32, 0.5, 2600]]
    });
  })();

  // ---------------------------------------------------------------- PIG
  (function () {
    var P = '#f7a8ba', D = '#e07b93', S = '#f48fa6';
    var ear = '<path d="M -46 -92 Q -88 -100 -80 -48 Q -62 -62 -34 -80 Z" fill="' + D + '"/>';
    ANIMALS.push({
      id: 'pig', name: 'Pig', pre: 'Pig', suf: 'pig', bg: '#ffe1ea',
      head: part(ear + mirror(ear)
        + '<ellipse cx="0" cy="-54" rx="67" ry="55" fill="' + P + '"/>'
        + E(-30, -70, 12) + E(30, -70, 12)
        + '<ellipse cx="0" cy="-38" rx="31" ry="22" fill="' + S + '"/>'
        + '<ellipse cx="-11" cy="-38" rx="5" ry="8" fill="#a8445f" stroke="none"/>'
        + '<ellipse cx="11" cy="-38" rx="5" ry="8" fill="#a8445f" stroke="none"/>'
        + '<path d="M -16 -12 Q 0 -4 16 -12" fill="none" stroke-width="3"/>'
        + blush(-50, -44) + blush(50, -44)),
      body: part(
          '<rect x="-70" y="-56" width="34" height="54" rx="15" fill="' + D + '"/>'
        + '<rect x="38" y="-56" width="34" height="54" rx="15" fill="' + D + '"/>'
        + '<rect x="-96" y="-56" width="38" height="54" rx="16" fill="' + P + '"/>'
        + '<rect x="58" y="-56" width="38" height="54" rx="16" fill="' + P + '"/>'
        + '<rect x="-96" y="-18" width="38" height="16" rx="8" fill="#b9506a"/>'
        + '<rect x="58" y="-18" width="38" height="16" rx="8" fill="#b9506a"/>'
        + '<ellipse cx="0" cy="-96" rx="104" ry="68" fill="' + P + '"/>'
        + '<ellipse cx="-30" cy="-128" rx="30" ry="12" fill="#fff" fill-opacity="0.35" stroke="none"/>'),
      tail: part(tube('M 0 0 C -22 -4 -16 -26 -30 -22 C -44 -18 -36 -42 -22 -42', 9, P)),
      neck: [80, -104], tailAt: [-98, -108], hs: 1.08,
      voice: [['sawtooth', 190, 130, 0, 0.14, 0.45, 650], ['sawtooth', 180, 120, 0.2, 0.14, 0.45, 650], ['sawtooth', 170, 110, 0.4, 0.16, 0.45, 650]]
    });
  })();

  // --------------------------------------------------------------- FROG
  (function () {
    var G = '#6cc24a', D = '#46913a', BL = '#eaf7be';
    ANIMALS.push({
      id: 'frog', name: 'Frog', pre: 'Frog', suf: 'frog', bg: '#dff5c8',
      head: part(
          '<circle cx="-38" cy="-88" r="26" fill="' + G + '"/><circle cx="38" cy="-88" r="26" fill="' + G + '"/>'
        + '<ellipse cx="0" cy="-44" rx="74" ry="42" fill="' + G + '"/>'
        + E(-38, -90, 16) + E(38, -90, 16)
        + '<path d="M -52 -28 Q 0 6 52 -28" fill="none" stroke-width="4"/>'
        + '<circle cx="-10" cy="-54" r="3" fill="' + OL + '" stroke="none"/><circle cx="10" cy="-54" r="3" fill="' + OL + '" stroke="none"/>'
        + blush(-54, -26, 10) + blush(54, -26, 10)),
      body: part(
          '<ellipse cx="62" cy="-8" rx="28" ry="11" fill="' + D + '"/>'
        + '<rect x="50" y="-74" width="26" height="68" rx="13" fill="' + D + '"/>'
        + '<ellipse cx="0" cy="-72" rx="98" ry="56" fill="' + G + '"/>'
        + '<ellipse cx="14" cy="-52" rx="62" ry="24" fill="' + BL + '" stroke="none"/>'
        + '<circle cx="-30" cy="-112" r="10" fill="' + D + '" stroke="none"/><circle cx="6" cy="-120" r="8" fill="' + D + '" stroke="none"/><circle cx="-4" cy="-98" r="6" fill="' + D + '" stroke="none"/>'
        + '<ellipse cx="-62" cy="-50" rx="44" ry="40" fill="' + G + '"/>'
        + '<ellipse cx="-50" cy="-8" rx="52" ry="12" fill="' + G + '"/>'
        + '<ellipse cx="38" cy="-8" rx="28" ry="11" fill="' + G + '"/>'
        + '<rect x="24" y="-72" width="26" height="66" rx="13" fill="' + G + '"/>'),
      tail: part('<ellipse cx="-12" cy="-4" rx="20" ry="14" fill="' + G + '"/>'),
      neck: [72, -90], tailAt: [-94, -72], hs: 1,
      voice: [['square', 150, 110, 0, 0.1, 0.3, 500], ['square', 210, 140, 0.15, 0.14, 0.3, 600], ['square', 150, 105, 0.38, 0.1, 0.3, 500]]
    });
  })();

  // ----------------------------------------------------------- ELEPHANT
  (function () {
    var G = '#a3b4cc', D = '#7f90aa', PK = '#f3b7c4';
    var ear = '<ellipse cx="-80" cy="-62" rx="44" ry="54" fill="' + G + '"/><ellipse cx="-78" cy="-60" rx="26" ry="36" fill="' + PK + '" stroke="none"/>';
    ANIMALS.push({
      id: 'elephant', name: 'Elephant', pre: 'Ele', suf: 'phant', bg: '#e3ebf7',
      head: part(ear + mirror(ear)
        + '<ellipse cx="0" cy="-64" rx="58" ry="56" fill="' + G + '"/>'
        + tube('M 0 -46 C 4 -10 4 16 -10 28 C -20 38 -34 30 -28 20', 30, G)
        + '<path d="M -3 -24 L 5 -24 M -3 -10 L 5 -10" fill="none" stroke="' + D + '" stroke-width="3"/>'
        + E(-28, -78, 11) + E(28, -78, 11)
        + '<path d="M -40 -34 Q -52 -10 -34 -2 M 40 -34 Q 52 -10 34 -2" fill="none" stroke="#fff" stroke-width="9"/>'
        + blush(-40, -50, 8) + blush(40, -50, 8)),
      body: part(
          '<rect x="-68" y="-88" width="46" height="86" rx="20" fill="' + D + '"/>'
        + '<rect x="14" y="-88" width="46" height="86" rx="20" fill="' + D + '"/>'
        + '<rect x="-100" y="-88" width="50" height="86" rx="22" fill="' + G + '"/>'
        + '<rect x="48" y="-88" width="50" height="86" rx="22" fill="' + G + '"/>'
        + '<ellipse cx="-75" cy="-14" rx="14" ry="8" fill="#fff" stroke-width="3"/><ellipse cx="73" cy="-14" rx="14" ry="8" fill="#fff" stroke-width="3"/>'
        + '<ellipse cx="0" cy="-124" rx="118" ry="80" fill="' + G + '"/>'
        + '<ellipse cx="-20" cy="-170" rx="40" ry="10" fill="#fff" fill-opacity="0.3" stroke="none"/>'),
      tail: part(tube('M 0 0 C -8 18 -6 36 -10 56', 8, G) + '<ellipse cx="-10" cy="62" rx="9" ry="14" fill="' + D + '"/>'),
      neck: [86, -132], tailAt: [-114, -132], hs: 1.12,
      voice: [['sawtooth', 300, 640, 0, 0.26, 0.4, 1800], ['sawtooth', 640, 430, 0.26, 0.36, 0.4, 1800]]
    });
  })();

  // --------------------------------------------------------------- DUCK
  (function () {
    var Y = '#ffd84a', D = '#f0b52c', O = '#ff9a3c';
    ANIMALS.push({
      id: 'duck', name: 'Duck', pre: 'Duck', suf: 'duck', bg: '#fff3b8',
      head: part(
          '<path d="M 0 -108 Q -10 -128 6 -126" fill="none" stroke-width="5"/>'
        + '<circle cx="0" cy="-56" r="58" fill="' + Y + '"/>'
        + E(-25, -68, 11) + E(25, -68, 11)
        + '<ellipse cx="0" cy="-36" rx="36" ry="18" fill="' + O + '"/>'
        + '<path d="M -34 -38 Q 0 -26 34 -38" fill="none" stroke-width="3"/>'
        + '<circle cx="-9" cy="-42" r="2.5" fill="' + OL + '" stroke="none"/><circle cx="9" cy="-42" r="2.5" fill="' + OL + '" stroke="none"/>'
        + blush(-48, -42) + blush(48, -42)),
      body: part(
          '<path d="M -20 -40 L -20 -8" fill="none" stroke="' + OL + '" stroke-width="16"/><path d="M -20 -40 L -20 -8" fill="none" stroke="' + O + '" stroke-width="8"/>'
        + '<path d="M 34 -40 L 34 -8" fill="none" stroke="' + OL + '" stroke-width="16"/><path d="M 34 -40 L 34 -8" fill="none" stroke="' + O + '" stroke-width="8"/>'
        + '<ellipse cx="-14" cy="-4" rx="30" ry="9" fill="' + O + '"/><ellipse cx="40" cy="-4" rx="30" ry="9" fill="' + O + '"/>'
        + '<ellipse cx="0" cy="-92" rx="96" ry="64" fill="' + Y + '"/>'
        + '<path d="M -62 -96 Q -20 -50 22 -92 Q 0 -120 -62 -96 Z" fill="' + D + '"/>'),
      tail: part('<path d="M 4 4 Q -26 0 -42 -34 Q -18 -26 8 -26 Z" fill="' + Y + '"/>'),
      neck: [60, -112], tailAt: [-88, -112], hs: 1,
      voice: [['square', 540, 380, 0, 0.1, 0.28, 1500], ['square', 520, 360, 0.15, 0.1, 0.28, 1500], ['square', 500, 340, 0.3, 0.12, 0.28, 1500]]
    });
  })();

  // ------------------------------------------------------------ GIRAFFE
  (function () {
    var Y = '#f7c948', D = '#d9a528', SP = '#b9772e', CR = '#fbe3a8';
    var horn = '<path d="M -20 -100 L -26 -130" fill="none" stroke-width="6"/><circle cx="-26" cy="-134" r="8" fill="' + SP + '"/>';
    var spots = function (list) {
      return list.map(function (s) { return '<ellipse cx="' + s[0] + '" cy="' + s[1] + '" rx="' + s[2] + '" ry="' + (s[3] || s[2]) + '" fill="' + SP + '" stroke="none"/>'; }).join('');
    };
    ANIMALS.push({
      id: 'giraffe', name: 'Giraffe', pre: 'Gi', suf: 'raffe', bg: '#fff0c2',
      head: part(horn + mirror(horn)
        + '<ellipse cx="-58" cy="-84" rx="24" ry="11" transform="rotate(-22 -58 -84)" fill="' + Y + '"/>'
        + '<ellipse cx="58" cy="-84" rx="24" ry="11" transform="rotate(22 58 -84)" fill="' + Y + '"/>'
        + '<ellipse cx="0" cy="-58" rx="47" ry="54" fill="' + Y + '"/>'
        + spots([[-26, -98, 7], [24, -96, 6]])
        + '<ellipse cx="0" cy="-26" rx="33" ry="24" fill="' + CR + '"/>'
        + '<ellipse cx="-11" cy="-30" rx="4" ry="6" fill="' + OL + '" stroke="none"/><ellipse cx="11" cy="-30" rx="4" ry="6" fill="' + OL + '" stroke="none"/>'
        + '<path d="M -14 -14 Q 0 -6 14 -14" fill="none" stroke-width="3"/>'
        + E(-24, -72, 11) + E(24, -72, 11)),
      body: part(

    var A = {
      g: g, inner: inner, tail: tail, body: body, head: head, b: b, h: h, t: t,
      x: x, y: L.ground, f: flipX ? -1 : 1, sx: 1, sy: 1, vis: true,
      born: 0, hop: 0, ph: Math.random() * 6, fit: 1, cx: 0,
      w: boxW, hgt: boxH
    };
    pose(A, 0);
    var bb = pic ? { x: -pic.w / 2, y: -pic.h, width: pic.w, height: pic.h } : inner.getBBox();
    A.fit = Math.min(boxW / bb.width, boxH / bb.height, 1.7);
    A.cx = bb.x + bb.width / 2;
    inner.setAttribute('transform', 'translate(' + (-A.cx) + ',0)');
    return A;
  }

  function pose(A, time) {
    if (!A.head) { return; }
    var b = A.b;
    var tw = Math.sin(time * 3.2 + A.ph) * 9;
    var hr = Math.sin(time * 1.7 + A.ph) * 3.5;
    var hb = Math.sin(time * 2.4 + A.ph) * 2.5;
    A.tail.setAttribute('transform', 'translate(' + b.tailAt[0] + ',' + b.tailAt[1] + ') rotate(' + tw + ')');
    A.head.setAttribute('transform', 'translate(' + b.neck[0] + ',' + (b.neck[1] + hb) + ') rotate(' + hr + ') scale(' + b.hs + ')');
  }

  function placeActor(A, now) {
    if (!A.vis) { A.g.setAttribute('visibility', 'hidden'); return; }
    A.g.setAttribute('visibility', 'visible');
    var pop = 1;
    if (A.born) { pop = popScale(Math.min(1, (now - A.born) / 650)); }
    var oy = 0, sq = 1;
    if (A.hop) {
      var p = (now - A.hop) / 520;
      if (p >= 1) { A.hop = 0; } else { oy = -Math.sin(p * Math.PI) * 55; sq = 1 + Math.sin(p * Math.PI * 2) * -0.06; }
    }
    var breathe = reduced ? 1 : 1 + Math.sin(now / 420 + A.ph) * 0.012;
    var s = A.fit * pop;
    A.g.setAttribute('transform', 'translate(' + A.x + ',' + (A.y + oy) + ') scale(' + (A.f * s * A.sx * sq) + ',' + (s * A.sy * breathe / sq) + ')');
  }

  function clearActors() {
    S.actors.forEach(function (A) { if (A.g.parentNode) { A.g.parentNode.removeChild(A.g); } });
    S.actors = [];
    gLabels.innerHTML = '';
  }

  function label(text, x, y, size) {
    var t = svgEl('text', {
      x: x, y: y, 'text-anchor': 'middle', 'font-size': size, 'font-weight': 'bold',
      'font-family': '"Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif',
      fill: '#fff', stroke: '#3b2f55', 'stroke-width': size * 0.16, 'stroke-linejoin': 'round', 'paint-order': 'stroke'
    });
    t.textContent = text;
    gLabels.appendChild(t);
    return t;
  }

  function resultParts() {
    var a = byId[S.a], b = byId[S.b];
    return S.flip ? { h: b, b: a, t: b } : { h: a, b: b, t: a };
  }
  function mashName() {
    var r = resultParts();
    if (r.h === r.b) { return r.h.name; }
    return r.h.pre + r.b.suf;
  }

  function sparkleGlyph(x, y, r, col) {
    var pts = [], i;
    for (i = 0; i < 8; i++) {
      var ang = i * Math.PI / 4 - Math.PI / 2, rr = i % 2 ? r * 0.42 : r;
      pts.push((x + Math.cos(ang) * rr).toFixed(1) + ',' + (y + Math.sin(ang) * rr).toFixed(1));
    }
    return svgEl('polygon', { points: pts.join(' '), fill: col, stroke: '#fff', 'stroke-width': 2, 'stroke-linejoin': 'round' });
  }

  // Draws whatever the current state calls for, with no animation in
  // progress. Used on first load, on resize and after every change.
  function showStatic(popIndex) {
    clearActors(); gSlots.innerHTML = '';
    if (S.mode === 'result') {
      var r = resultParts();
      var R = makeActor(r.h, r.b, r.t, L.cx, false, L.rw, L.rh);
      if (popIndex === 0) { R.born = performance.now(); }
      S.actors.push(R);
      label(mashName(), L.cx, L.name, L.nameSize);
    } else {
      drawSlots();
      if (S.a) {
        var A = makeActor(byId[S.a], byId[S.a], byId[S.a], L.ax, false, L.sw, L.sh);
        if (popIndex === 0) { A.born = performance.now(); }
        S.actors.push(A);
        label(byId[S.a].name, L.ax, L.name, L.small);
      }
      if (S.b) {
        var B = makeActor(byId[S.b], byId[S.b], byId[S.b], L.bx, true, L.sw, L.sh);
        if (popIndex === 1) { B.born = performance.now(); }
        S.actors.push(B);
        label(byId[S.b].name, L.bx, L.name, L.small);
      }
    }
    syncUI();
  }

  function drawSlots() {
    var xs = [L.ax, L.bx], ids = [S.a, S.b], i;
    for (i = 0; i < 2; i++) {
      if (ids[i]) { continue; }
      gSlots.appendChild(svgEl('circle', {
        cx: xs[i], cy: L.ground - 120, r: 100, fill: 'rgba(255,255,255,0.28)',
        stroke: '#fff', 'stroke-width': 6, 'stroke-dasharray': '4 16', 'stroke-linecap': 'round'
      }));
    }
    var cx = L.cx, cy = L.ground - 120;
    gSlots.appendChild(svgEl('path', {
      d: 'M ' + (cx - 26) + ' ' + cy + ' H ' + (cx + 26) + ' M ' + cx + ' ' + (cy - 26) + ' V ' + (cy + 26),
      stroke: '#fff', 'stroke-width': 14, 'stroke-linecap': 'round', fill: 'none'
    }));
  }

  function syncUI() {
    var btns = tray.querySelectorAll('.pick'), i;
    for (i = 0; i < btns.length; i++) {
      var id = btns[i].getAttribute('data-id');
      btns[i].classList.toggle('on', id === S.a || id === S.b);
    }
    bSwap.classList.toggle('hidden', S.mode !== 'result' || byId[S.a] === byId[S.b]);
    bClear.classList.toggle('hidden', !(S.a || S.b) || S.mode === 'mash');
    bDice.classList.toggle('hidden', S.mode === 'mash');
  }

  // ---------------------------------------------------------------- sound
  var AC = null, master = null;
  function audio() {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) { return null; }
      try { AC = new C(); } catch (e) { return null; }
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e2) { /* ignore */ } }
    return AC;
  }
  function tone(w, f0, f1, start, dur, vol, lp) {
    var c = audio(); if (!c) { return; }
    var t = c.currentTime + start;
    var o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = w; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    f.type = 'lowpass'; f.frequency.value = lp || 3000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.08);
  }
  function voice(a, delay, pitch) {
    var d = delay || 0, k = pitch || 1;
    a.voice.forEach(function (n) { tone(n[0], n[1] * k, n[2] * k, d + n[3], n[4], n[5], n[6]); });
  }
  function whoosh(start, dur) {
    var c = audio(); if (!c) { return; }
    var len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0), i;
    for (i = 0; i < len; i++) { d[i] = Math.random() * 2 - 1; }
    var s = c.createBufferSource(); s.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    var t = c.currentTime + start;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2400, t + dur);
    var g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  function sparkle(start) {
    [784, 988, 1175, 1568, 1976].forEach(function (f, i) { tone('sine', f, f * 1.01, start + i * 0.07, 0.25, 0.22, 5000); });
  }
  function boing(start) { tone('sine', 220, 520, start, 0.2, 0.35, 3000); }

  // --------------------------------------------------------------- effects
  function burst(x, y, n, big) {
    var cols = ['#fff', '#ffe45c', '#ff9ec0', '#8be0ff', '#b9f08a'], i;
    for (i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2, sp = (big ? 260 : 160) * (0.5 + Math.random());
      var star = i % 2 === 0;
      var el = star ? sparkleGlyph(0, 0, 12 + Math.random() * 12, cols[1 + i % 4])
                    : svgEl('circle', { r: 16 + Math.random() * 20, fill: '#fff', 'fill-opacity': 0.9 });
      gFx.appendChild(el);
      S.fxs.push({ el: el, x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 60, t0: performance.now(), life: 900 + Math.random() * 400, star: star });
    }
  }
  function updateFx(now) {
    var keep = [];
    S.fxs.forEach(function (f) {
      var p = (now - f.t0) / f.life;
      if (p >= 1) { if (f.el.parentNode) { f.el.parentNode.removeChild(f.el); } return; }
      var t = (now - f.t0) / 1000;
      var x = f.x + f.vx * t, y = f.y + f.vy * t + (f.star ? 260 * t * t : 0);
      var s = f.star ? 1 - p * 0.4 : 1 + p * 1.6;
      f.el.setAttribute('transform', 'translate(' + x + ',' + y + ') scale(' + s + ') rotate(' + (p * 180) + ')');
      f.el.setAttribute('opacity', 1 - p * p);
      keep.push(f);
    });
    S.fxs = keep;
  }

  // ---------------------------------------------------------------- flow
  function pick(id) {
    if (S.mode === 'mash') { return; }
    audio();
    if (S.mode === 'result') { S.a = id; S.b = null; S.mode = 'pick'; S.flip = false; showStatic(0); voice(byId[id]); return; }
    if (S.a === id && !S.b) { S.a = null; showStatic(-1); return; }
    if (!S.a) { S.a = id; showStatic(0); voice(byId[id]); return; }
    if (S.b === id) { S.b = null; showStatic(-1); return; }
    S.b = id; showStatic(1); voice(byId[id]);
    setTimeout(function () { if (S.mode === 'pick' && S.a && S.b) { startMash(); } }, reduced ? 500 : 650);
  }

  function startMash() {
    S.mode = 'mash'; S.flip = false; S.poofed = false; S.mt = performance.now();
    gSlots.innerHTML = ''; gLabels.innerHTML = '';
    syncUI();
    if (!reduced) { whoosh(0.35, 0.8); boing(0); boing(0.15); }
  }

  function finishMash() {
    S.mode = 'result';
    syncUI();
  }

  function revealResult() {
    clearActors();
    S.mode = S.mode === 'mash' ? 'mash' : S.mode;
    var r = resultParts();
    var R = makeActor(r.h, r.b, r.t, L.cx, false, L.rw, L.rh);
    R.born = performance.now();
    S.actors.push(R);
    label(mashName(), L.cx, L.name, L.nameSize);
    burst(L.cx, L.ground - 170, 14, true);
    voice(r.h, 0.05); voice(r.b, 0.55, 1.12); sparkle(0.9);
  }

  function swapHeads() {
    if (S.mode !== 'result') { return; }
    audio();
    S.flip = !S.flip;
    whoosh(0, 0.3);
    revealResult();
  }

  function clearAll() {
    audio();
    S.a = null; S.b = null; S.mode = 'pick'; S.flip = false;
    showStatic(-1);
  }

  function dice() {
    if (S.mode === 'mash') { return; }
    audio();
    var i = Math.floor(Math.random() * ANIMALS.length), j;
    do { j = Math.floor(Math.random() * ANIMALS.length); } while (ANIMALS.length > 1 && j === i);
    S.a = ANIMALS[i].id; S.b = ANIMALS[j].id; S.mode = 'pick'; S.flip = false;
    showStatic(-1);
    startMash();
  }

  stage.addEventListener('pointerdown', function (e) {
    var n = e.target, A = null, i;
    while (n && n !== stage) {
      for (i = 0; i < S.actors.length; i++) { if (S.actors[i].g === n) { A = S.actors[i]; } }
      n = n.parentNode;
    }
    if (!A || S.mode === 'mash') { return; }
    audio();
    A.hop = performance.now();
    if (S.mode === 'result') { voice(A.h); voice(A.b, 0.5, 1.12); burst(A.x, L.ground - 170, 6, false); }
    else { voice(A.h); }
  });

  bDice.addEventListener('click', dice);
  bSwap.addEventListener('click', swapHeads);
  bClear.addEventListener('click', clearAll);

  // ---------------------------------------------------------------- frame
  function frame(now) {
    var time = now / 1000;
    if (S.mode === 'mash') {
      var t = now - S.mt, A = S.actors[0], B = S.actors[1];
      if (reduced) {
        if (!S.poofed) { S.poofed = true; revealResult(); finishMash(); }
      } else if (A && B && !S.poofed) {
        if (t < 500) {
          var q = t / 500;
          A.y = B.y = L.ground;
          var hp = -Math.abs(Math.sin(q * Math.PI * 2));
          A.sy = B.sy = 1 + hp * 0.1; A.sx = B.sx = 1 - hp * 0.05;
          A.x = L.ax; B.x = L.bx;
          A.y = B.y = L.ground + hp * 40;
        } else if (t < 1250) {
          var p = (t - 500) / 750, e = ease(p);
          A.sx = B.sx = A.sy = B.sy = 1;
          A.x = lerp(L.ax, L.cx - 60, e); B.x = lerp(L.bx, L.cx + 60, e);
          A.y = B.y = L.ground - Math.abs(Math.sin(p * Math.PI * 3)) * 60;
          A.f = 1; B.f = -1;
        } else {
          S.poofed = true;
          burst(L.cx, L.ground - 140, 16, false);
          A.vis = B.vis = false;
          whoosh(0, 0.2);
          setTimeout(function () { if (S.mode === 'mash') { revealResult(); } }, 150);
          setTimeout(function () { if (S.mode === 'mash') { finishMash(); } }, 1500);
        }
      }
    }
    var i;
    for (i = 0; i < S.actors.length; i++) {
      var X = S.actors[i];
      if (!reduced) { pose(X, time); }
      placeActor(X, now);
    }
    updateFx(now);
    requestAnimationFrame(frame);
  }

  // ----------------------------------------------------------------- tray
  function buildTray() {
    tray.innerHTML = '';
    ANIMALS.forEach(function (a) {
      var b = document.createElement('button');
      b.className = 'pick'; b.setAttribute('data-id', a.id); b.setAttribute('aria-label', a.name);
      var icon = '<g transform="translate(0,12) scale(0.86)">' + a.head + '</g>';
      if (IMG[a.id]) {
        var P = IMG[a.id], ih = 150 * P.h / P.w, iw = 150, sc = Math.min(1, 140 / ih);
        icon = '<image href="' + picFor(a, a).url + '" x="' + (-iw * sc / 2) + '" y="' + (-62 - ih * sc / 2) + '" width="' + (iw * sc) + '" height="' + (ih * sc) + '"/>';
      }
      b.innerHTML = '<svg viewBox="-125 -150 250 170"><circle cx="0" cy="-62" r="84" fill="' + a.bg + '" stroke="#fff" stroke-width="6"/>'
        + icon + '</svg>';
      b.addEventListener('click', function () { pick(a.id); });
      tray.appendChild(b);
    });
  }

  var rz = null;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { if (S.mode !== 'mash') { layout(); showStatic(-1); } }, 120);
  });

  buildTray();
  layout();
  showStatic(-1);
  requestAnimationFrame(frame);
  loadPictures(function () {
    if (!Object.keys(IMG).length) { return; }
    buildTray();
    if (S.mode !== 'mash') { showStatic(-1); }
  });

  // Test hook for the throwaway preview pages; harmless otherwise.
  window.__animalMash = { ANIMALS: ANIMALS, pick: pick, prepPicture: prepPicture, IMG: IMG, buildTray: buildTray, showStatic: showStatic };
})();
</script>
</body>
</html>
