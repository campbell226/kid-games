<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pizza &amp; Ice Cream — Hoot and Shellby</title>
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#F0C08A;
    font-family:"Baloo 2","Comic Sans MS",Verdana,sans-serif;color:#3b2f2a;
    -webkit-user-select:none;user-select:none;touch-action:none;
  }
  canvas#game{display:block;width:100vw;height:100vh;}
  .hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5;}
  .hud button{
    width:50px;height:50px;border-radius:16px;cursor:pointer;
    border:3px solid rgba(255,255,255,.8);background:rgba(255,255,255,.45);
    font-size:22px;line-height:1;color:#3b2f2a;box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  .hud button:active{transform:translateY(3px);box-shadow:none;}

  #start{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;text-align:center;
    background:linear-gradient(100deg,#F6B26B 0%,#F6B26B 49.6%,#9FDFCF 50.4%,#9FDFCF 100%);
  }
  #start .pair{font-size:clamp(54px,13vw,120px);line-height:1.1;letter-spacing:.1em;}
  #start h1{margin:.1em 0 0;font-size:clamp(28px,6vw,54px);color:#4A3421;}
  #start p{margin:.2em 0 0;font-size:clamp(14px,2.2vw,19px);color:#5C4531;max-width:26em;}
  .levels{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:26px;}
  .levels button{
    padding:16px 26px;font:inherit;font-size:clamp(17px,2.6vw,23px);cursor:pointer;
    border-radius:22px;border:4px solid #fff;background:#fff;color:#4A3421;
    box-shadow:0 6px 0 rgba(0,0,0,.18);min-width:160px;
  }
  .levels button b{display:block;font-size:1.15em;}
  .levels button small{display:block;opacity:.7;font-size:.8em;font-weight:normal;}
  .levels button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .levels button:nth-child(1){background:#FFE3B0;}
  .levels button:nth-child(2){background:#FFC9D6;}
  .levels button:nth-child(3){background:#C9E4FF;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <button id="soundBtn" title="Sound on or off" aria-label="Sound on or off">🔊</button>
  <button id="fsBtn" title="Full screen" aria-label="Full screen">⛶</button>
</div>

<div id="start">
  <div class="pair">🦉🍕&nbsp;&nbsp;🍦🐢</div>
  <h1>Pizza &amp; Ice Cream</h1>
  <p>A sum pops up on one side. Get it right and that kitchen speeds up — Hoot's oven roars, or Shellby's machine swirls faster.</p>
  <p>Click an answer, or use the <b>arrow keys</b> and <b>space</b>. Either one on its own.</p>
  <div class="levels">
    <button data-level="0"><b>Counting</b><small>sums up to 8</small></button>
    <button data-level="1"><b>Adding</b><small>sums up to 10</small></button>
    <button data-level="2"><b>Bigger</b><small>to 20, and take away</small></button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================== helpers ============================== */
const TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=> v<a?a : v>b?b : v;
const rand=(a,b)=> a+Math.random()*(b-a);
const randi=(a,b)=> Math.floor(rand(a,b+1));
const choose=a=>a[(Math.random()*a.length)|0];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(c1,c2,t){const a=hex2rgb(c1),b=hex2rgb(c2);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';}

/* ============================== audio ============================== */
const Sound=(function(){
  let ac=null,master,music,fx,on=true,timer=null,nextTime=0,step=0,noiseBuf=null;
  const BPM=112, EIGHTH=60/BPM/2;
  const MEL=[
    72,null,76,79, null,76,72,null,
    71,null,74,79, null,74,71,null,
    69,null,72,76, null,72,69,null,
    65,null,69,72, null,69,65,  74
  ];
  const BASS=[48,43,45,41];                 // C  G  Am  F
  const mtof=m=>440*Math.pow(2,(m-69)/12);

  function ensure(){
    if(ac) return ac;
    const AC=window.AudioContext||window.webkitAudioContext;
    ac=new AC();
    master=ac.createGain(); master.gain.value=on?0.9:0.0001; master.connect(ac.destination);
    music =ac.createGain(); music.gain.value=0.20; music.connect(master);
    fx    =ac.createGain(); fx.gain.value=0.6;   fx.connect(master);
    const dly=ac.createDelay(1.0); dly.delayTime.value=0.24;
    const fb=ac.createGain(); fb.gain.value=0.2;
    const damp=ac.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2400;
    const wet=ac.createGain(); wet.gain.value=0.25;
    dly.connect(damp); damp.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
    music.connect(dly); fx.connect(dly);
    // shaker noise
    const len=ac.sampleRate*0.5;
    noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    return ac;
  }
  function tone(freq,t,dur,type,g,dest){
    const o=ac.createOscillator(), gn=ac.createGain();
    o.type=type; o.frequency.value=freq;
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.linearRampToValueAtTime(g,t+0.015);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn); gn.connect(dest); o.start(t); o.stop(t+dur+0.05);
  }
  function shake(t,g){
    if(!noiseBuf) return;
    const s=ac.createBufferSource(); s.buffer=noiseBuf;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=6500; bp.Q.value=1.2;
    const gn=ac.createGain();
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.linearRampToValueAtTime(g,t+0.005);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
    s.connect(bp); bp.connect(gn); gn.connect(music);
    s.start(t); s.stop(t+0.12);
  }
  function schedule(){
    while(nextTime < ac.currentTime+0.25){
      const s=step%32, bar=(s/8)|0, n=MEL[s];
      if(n!=null){ tone(mtof(n),nextTime,0.55,'triangle',0.15,music);
                   tone(mtof(n+12),nextTime,0.22,'sine',0.04,music); }
      if(s%8===0){ tone(mtof(BASS[bar]),nextTime,0.7,'sine',0.18,music); }
      if(s%8===4){ tone(mtof(BASS[bar]+7),nextTime,0.5,'sine',0.10,music); }
      if(s%2===0) shake(nextTime, s%4===2?0.05:0.028);
      nextTime+=EIGHTH; step++;
    }
  }
  return{
    start(){ ensure(); if(ac.state==='suspended') ac.resume();
      if(timer) return; nextTime=ac.currentTime+0.15; timer=setInterval(schedule,25); },
    toggle(){ on=!on; if(ac) master.gain.setTargetAtTime(on?0.9:0.0001,ac.currentTime,0.05); return on; },
    right(){ if(!ac)return; const t=ac.currentTime;
      [72,76,79,84].forEach((n,i)=>tone(mtof(n),t+i*0.07,0.45,'triangle',0.18,fx)); },
    nope(){ if(!ac)return; const t=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(330,t); o.frequency.exponentialRampToValueAtTime(240,t+0.18);
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.14,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
      o.connect(g); g.connect(fx); o.start(t); o.stop(t+0.34); },
    done(){ if(!ac)return; const t=ac.currentTime;
      [72,79,84,88,91].forEach((n,i)=>tone(mtof(n),t+i*0.08,0.7,'triangle',0.17,fx)); },
    pop(){ if(!ac)return; const t=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(950,t+0.09);
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.15,t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g); g.connect(fx); o.start(t); o.stop(t+0.24); }
  };
})();

/* ============================== canvas ============================== */
const cvs=document.getElementById('game');
const ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1,HW=0,S=1,counterY=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=Math.floor(W*DPR); cvs.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  HW=W/2; S=clamp(Math.min(HW/620, H/760),0.5,1.25);
  counterY=H*0.72;
}
window.addEventListener('resize',resize); resize();

/* ============================== state ============================== */
const PIZZA=0, ICE=1;
const sides=[
  {id:PIZZA, made:0, prog:0, boost:0, work:0, cheer:0, hue:'#E4572E'},
  {id:ICE,   made:0, prog:0, boost:0, work:0, cheer:0, hue:'#4FB0A5'}
];
const SCOOPS=['#FFB3C6','#B6E3D4','#FFE0A3','#C9B6F5','#FFD1A8'];
let shelfP=[], shelfI=[];      // finished treats on the shelves
let flying=[], parts=[];
let q=null, nextQ=0.8, nextSide=Math.random()<0.5?0:1;
let time=0, lastInput=0, passive=true, autoT=0, badge=0, started=false, LEVEL=1;

/* ============================== questions ============================== */
function makeQ(side){
  let a,b,op='+';
  if(LEVEL===0){ a=randi(1,4); b=randi(1,4); }
  else if(LEVEL===1){ a=randi(1,7); b=randi(1,Math.max(1,Math.min(7,10-a))); }
  else{
    if(Math.random()<0.4){ a=randi(5,14); b=randi(1,Math.min(7,a-1)); op='-'; }
    else{ a=randi(2,12); b=randi(2,Math.max(2,Math.min(8,20-a))); }
  }
  const ans = op==='+' ? a+b : a-b;
  const set=[ans];
  let guard=0;
  while(set.length<3 && guard++<60){
    const d=ans+choose([-3,-2,-1,1,2,3]);
    if(d>=0 && d<=25 && set.indexOf(d)<0) set.push(d);
  }
  while(set.length<3) set.push(ans+set.length);
  const choices=shuffle(set.slice());
  return {side:side, a:a, b:b, op:op, ans:ans, choices:choices,
          dead:[false,false,false], sel:0, shake:0, t:0, solved:-1, hover:-1};
}

function pressChoice(i){
  if(!q || q.solved>=0 || q.dead[i]) return;
  if(q.choices[i]===q.ans){
    q.solved=i; q.t=0;
    const s=sides[q.side];
    s.prog += 0.34;
    s.boost = Math.min(1.8, s.boost + 1.0);
    Sound.right();
    const b=btnRect(i), cx=b.x+b.w/2, cy=b.y+b.h/2;
    for(let k=0;k<22;k++){
      const a2=rand(0,TAU), sp=rand(60,220);
      parts.push({x:cx,y:cy,vx:Math.cos(a2)*sp,vy:Math.sin(a2)*sp-60,life:0,max:rand(0.5,1.1),
        s:rand(2,4.5),c:choose(['#FFE08A','#FFF6D6','#FF9E6B','#8FE3D0'])});
    }
  }else{
    q.dead[i]=true; q.shake=0.45; Sound.nope();
    const live=q.dead.map((d,j)=>d?-1:j).filter(j=>j>=0);
    if(live.length) q.sel=live[0];
  }
}

/* ============================== layout ============================== */
function btnRect(i){                       // in screen coordinates
  const bw=Math.min(HW*0.26,150*S), bh=Math.min(H*0.14,104*S), gap=Math.min(HW*0.05,26*S);
  const total=bw*3+gap*2, x0=(q?q.side:0)*HW + (HW-total)/2;
  return {x:x0+i*(bw+gap), y:H*0.795, w:bw, h:bh};
}
function cardRect(){
  const w=Math.min(HW*0.82, 460*S), h=Math.min(H*0.26, 230*S);
  return {x:(q?q.side:0)*HW+(HW-w)/2, y:H*0.055, w:w, h:h};
}

/* ============================== input ============================== */
function poke(){ lastInput=time; }
let mouse={x:-999,y:-999};
window.addEventListener('pointermove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  if(!started) return;
  poke();
  if(q && q.solved<0){
    q.hover=-1;
    for(let i=0;i<3;i++){ const b=btnRect(i);
      if(!q.dead[i] && e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){ q.hover=i; q.sel=i; } }
  }
},{passive:true});
window.addEventListener('pointerdown',e=>{
  if(!started) return;
  poke();
  if(q && q.solved<0){
    for(let i=0;i<3;i++){ const b=btnRect(i);
      if(e.clientX>=b.x&&e.clientX<=b.x+b.w&&e.clientY>=b.y&&e.clientY<=b.y+b.h){ pressChoice(i); return; } }
  }
});
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','enter'].indexOf(k)>=0) e.preventDefault();
  if(!started){
    if(k==='1'||k==='2'||k==='3') begin(parseInt(k,10)-1);
    else if(k==='enter'||k===' ') begin(1);
    return;
  }
  poke();
  if(k==='m'){ toggleSound(); return; }
  if(!q || q.solved>=0) return;
  if(k==='arrowleft'||k==='a'||k==='arrowright'||k==='d'){
    const dir=(k==='arrowright'||k==='d')?1:-1;
    for(let n=1;n<=3;n++){ const j=(q.sel+dir*n+9)%3; if(!q.dead[j]){ q.sel=j; break; } }
    Sound.pop();
  }
  if(k===' '||k==='enter'||k==='arrowup') pressChoice(q.sel);
});

/* ============================== update ============================== */
function finishItem(side){
  const s=sides[side];
  s.made++; s.prog-=1; s.cheer=1.4;
  Sound.done();
  const sx = side*HW + HW*0.5, sy = counterY-40*S;
  const tx = side*HW + HW*0.855, ty = counterY-110*S - ((side===PIZZA?shelfP.length:shelfI.length)%4)*26*S;
  flying.push({side:side,x:sx,y:sy,sx:sx,sy:sy,tx:tx,ty:ty,t:0,c:choose(SCOOPS)});
  for(let k=0;k<18;k++){
    const a=rand(0,TAU), sp=rand(50,190);
    parts.push({x:sx,y:sy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,life:0,max:rand(0.6,1.3),
      s:rand(2,4.5),c:choose(side===PIZZA?['#FFD166','#FF9E6B','#FFF3C4']:['#B6E3D4','#FFB3C6','#FFFFFF'])});
  }
}

function update(dt){
  time+=dt;
  passive=(time-lastInput)>14;
  badge = passive ? Math.min(1,badge+dt*1.2) : Math.max(0,badge-dt*2);

  // question flow
  if(!q){
    nextQ-=dt;
    if(nextQ<=0){ q=makeQ(nextSide); nextSide=1-nextSide; autoT=rand(2.6,4.2); }
  }else{
    q.t+=dt; q.shake=Math.max(0,q.shake-dt);
    if(q.solved>=0 && q.t>1.15){ q=null; nextQ=0.7; }
    else if(q.solved<0 && passive){
      autoT-=dt;
      if(autoT<=0){
        const live=[0,1,2].filter(i=>!q.dead[i]);
        const rightIdx=q.choices.indexOf(q.ans);
        let pick;
        if(live.length>1 && Math.random()<0.22) pick=choose(live.filter(i=>i!==rightIdx));
        else pick=rightIdx;
        if(pick===undefined||pick<0) pick=rightIdx;
        pressChoice(pick);
        autoT=rand(1.0,1.8);
      }
    }
  }

  // kitchens
  for(const s of sides){
    s.boost=Math.max(0,s.boost-dt*0.22);
    const rate=0.05*(1+s.boost*1.7);
    s.prog+=rate*dt;
    s.work+=dt*(1.6+s.boost*3.2);
    s.cheer=Math.max(0,s.cheer-dt);
    if(s.prog>=1) finishItem(s.id);
  }

  for(let i=flying.length-1;i>=0;i--){
    const f=flying[i]; f.t+=dt*1.5;
    const t=Math.min(1,f.t);
    f.x=lerp(f.sx,f.tx,t); f.y=lerp(f.sy,f.ty,t)-Math.sin(t*Math.PI)*90*S;
    if(t>=1){
      flying.splice(i,1);
      if(f.side===PIZZA){ shelfP.push({c:f.c}); if(shelfP.length>4) shelfP.shift(); }
      else { shelfI.push({c:f.c}); if(shelfI.length>4) shelfI.shift(); }
    }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; p.vx*=0.99;
    if(p.life>=p.max) parts.splice(i,1);
  }
}

/* ============================== drawing bits ============================== */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }
function ell(x,y,rx,ry,rot){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); ctx.fill(); }
function star5(x,y,r,inner){
  ctx.beginPath();
  for(let i=0;i<10;i++){ const rr2=i%2?r*inner:r, a=-Math.PI/2+i*Math.PI/5;
    const px=x+Math.cos(a)*rr2, py=y+Math.sin(a)*rr2; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath();
}
function txt(s,x,y,size,col,weight,align){
  ctx.font=(weight||'bold')+' '+size+'px "Baloo 2","Comic Sans MS",Verdana,sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle';
  ctx.fillStyle=col; ctx.fillText(s,x,y);
}

function owlHead(x,y,r,blinkPh,hat){
  ctx.save(); ctx.translate(x,y); ctx.scale(r/30,r/30);
  ctx.fillStyle='#A87B55';
  ctx.beginPath(); ctx.moveTo(-19,-18); ctx.lineTo(-9,-31); ctx.lineTo(-4,-17); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo( 19,-18); ctx.lineTo( 9,-31); ctx.lineTo( 4,-17); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#B98A62'; ell(0,0,27,26);
  ctx.fillStyle='#FFFDF6'; ell(-10,-4,11,11); ell(10,-4,11,11);
  const blink=Math.sin(blinkPh)>0.965;
  if(blink){ ctx.strokeStyle='#3B2A1E'; ctx.lineWidth=2.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-18,-4); ctx.quadraticCurveTo(-10,1,-2,-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2,-4); ctx.quadraticCurveTo(10,1,18,-4); ctx.stroke();
  }else{
    ctx.fillStyle='#3B2A1E'; ell(-10,-4,5,5.4); ell(10,-4,5,5.4);
    ctx.fillStyle='rgba(255,255,255,.9)'; ell(-11.6,-5.8,1.8,1.8); ell(8.4,-5.8,1.8,1.8);
  }
  ctx.fillStyle='#F2A65A';
  ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(-5,7); ctx.lineTo(5,7); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,143,177,.35)'; ell(-19,5,5,3.5); ell(19,5,5,3.5);
  if(hat){ ctx.fillStyle='#FFFDF6';
    ctx.beginPath(); ctx.roundRect(-16,-32,32,10,4); ctx.fill();
    ell(-11,-38,10,9); ell(2,-42,12,11); ell(14,-36,9,8); }
  ctx.restore();
}
function turtleHead(x,y,r,blinkPh,hat){
  ctx.save(); ctx.translate(x,y); ctx.scale(r/26,r/26);
  ctx.fillStyle='#A8D98B'; ell(0,0,24,22);
  const blink=Math.sin(blinkPh)>0.965;
  ctx.fillStyle='#FFFDF6'; ell(-8,-4,8,9); ell(9,-4,8,9);
  if(blink){ ctx.strokeStyle='#31402B'; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-14,-4); ctx.quadraticCurveTo(-8,0,-2,-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,-4); ctx.quadraticCurveTo(9,0,15,-4); ctx.stroke();
  }else{
    ctx.fillStyle='#31402B'; ell(-7,-3,4,4.6); ell(10,-3,4,4.6);
    ctx.fillStyle='rgba(255,255,255,.9)'; ell(-8.4,-4.8,1.5,1.5); ell(8.6,-4.8,1.5,1.5);
  }
  ctx.strokeStyle='#31402B'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(1,7,6,0.12*Math.PI,0.88*Math.PI); ctx.stroke();
  ctx.fillStyle='rgba(255,143,177,.35)'; ell(-15,6,5,3.5); ell(17,6,5,3.5);
  if(hat){ ctx.fillStyle='#FFFDF6';
    ctx.beginPath(); ctx.moveTo(-17,-18); ctx.lineTo(17,-18); ctx.lineTo(11,-31); ctx.lineTo(-11,-31); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#8FD6C8'; ctx.fillRect(-17,-21,34,4); }
  ctx.restore();
}

function pizzaDisc(x,y,r,stage,boxed){
  if(boxed){
    ctx.fillStyle='#D9A05B'; rr(x-r,y-r*0.7,r*2,r*1.4,6*S); ctx.fill();
    ctx.strokeStyle='#B07C3E'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#B07C3E'; txt('🍕',x,y,r*0.9,'#B07C3E');
    return;
  }
  ctx.fillStyle='#F0D6A5'; circle(x,y,r);                          // dough
  if(stage>=1){ ctx.fillStyle='#D9483B'; circle(x,y,r*0.84); }     // sauce
  if(stage>=2){ ctx.fillStyle='#FFD873';                           // cheese
    for(let i=0;i<7;i++){ const a=i*TAU/7+0.4;
      ell(x+Math.cos(a)*r*0.44, y+Math.sin(a)*r*0.44, r*0.24, r*0.19, a); }
    ctx.fillStyle='#FFE9A8'; circle(x,y,r*0.22); }
  if(stage>=3){ ctx.fillStyle='#C0392B';                           // pepperoni
    for(let i=0;i<6;i++){ const a=i*TAU/6+0.9;
      circle(x+Math.cos(a)*r*0.5, y+Math.sin(a)*r*0.5, r*0.15); } }
  ctx.strokeStyle='#E3BE86'; ctx.lineWidth=Math.max(2,r*0.11);
  ctx.beginPath(); ctx.arc(x,y,r*0.93,0,TAU); ctx.stroke();
}
function coneStack(x,y,r,stage,cols){
  ctx.fillStyle='#E0A96D';                                          // cone
  ctx.beginPath(); ctx.moveTo(x-r*0.62,y); ctx.lineTo(x+r*0.62,y); ctx.lineTo(x,y+r*1.7); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(150,100,50,.45)'; ctx.lineWidth=1.5;
  for(let i=-1;i<=1;i++){ ctx.beginPath();
    ctx.moveTo(x+i*r*0.3, y+ (i?r*0.2:0)); ctx.lineTo(x+i*r*0.05, y+r*1.5); ctx.stroke(); }
  for(let i=0;i<Math.min(stage,3);i++){
    ctx.fillStyle=cols[i%cols.length];
    circle(x, y-r*0.34-i*r*0.62, r*0.6);
    ctx.fillStyle='rgba(255,255,255,.35)'; circle(x-r*0.2, y-r*0.5-i*r*0.62, r*0.16);
  }
  if(stage>=3){ ctx.fillStyle='#E64C6B'; circle(x, y-r*0.34-2*r*0.62-r*0.55, r*0.18);
    ctx.strokeStyle='#5E8C3A'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(x,y-r*0.34-2*r*0.62-r*0.7); ctx.lineTo(x+r*0.2,y-r*0.34-2*r*0.62-r*0.95); ctx.stroke(); }
}

/* ============================== side scenes ============================== */
function drawPizzaSide(){
  const s=sides[PIZZA];
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,HW,H); ctx.clip();

  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#FBD9A6'); g.addColorStop(1,'#F0AE6B');
  ctx.fillStyle=g; ctx.fillRect(0,0,HW,H);

  // brick wall
  ctx.fillStyle='rgba(200,120,70,.16)';
  for(let r=0;r<9;r++) for(let c=-1;c<10;c++){
    const bw=HW/7, bh=H*0.045, ox=(r%2)*bw/2;
    ctx.fillRect(c*bw+ox+2, H*0.30+r*bh+2, bw-5, bh-5);
  }

  // oven
  const ox=HW*0.19, oy=counterY-20*S, orad=95*S;
  ctx.fillStyle='#B4653C'; ctx.beginPath(); ctx.arc(ox,oy,orad,Math.PI,TAU); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#8E4C2C'; ctx.fillRect(ox-orad,oy,orad*2,26*S);
  ctx.fillStyle='#3A1F14'; ctx.beginPath(); ctx.arc(ox,oy,orad*0.55,Math.PI,TAU); ctx.closePath(); ctx.fill();
  // fire
  const fl=1+s.boost*1.6;
  for(let i=0;i<5;i++){
    const ph=time*(4+i)+i, hgt=(20+Math.abs(Math.sin(ph))*26)*S*fl, fx=ox+(i-2)*orad*0.16;
    ctx.fillStyle=i%2?'#FF9F1C':'#FFD166'; ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.moveTo(fx-9*S,oy-2);
    ctx.quadraticCurveTo(fx-7*S,oy-hgt*0.7, fx, oy-hgt);
    ctx.quadraticCurveTo(fx+7*S,oy-hgt*0.7, fx+9*S, oy-2);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;
  // heat squiggles
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=3*S;
  for(let i=0;i<3;i++){
    const bx=ox-30*S+i*30*S, t=time*1.4+i;
    ctx.beginPath(); ctx.moveTo(bx,oy-orad*0.7);
    for(let k=0;k<3;k++) ctx.quadraticCurveTo(bx+Math.sin(t+k)*10*S, oy-orad*0.7-(k+0.5)*16*S,
                                              bx, oy-orad*0.7-(k+1)*16*S);
    ctx.stroke();
  }

  // shelf with finished pizzas
  ctx.fillStyle='#A9713F'; ctx.fillRect(HW*0.74, counterY-70*S, HW*0.24, 9*S);
  shelfP.forEach((p,i)=>pizzaDisc(HW*0.855, counterY-88*S-i*26*S, 24*S, 3, true));

  // owl chef
  const bob=Math.sin(s.work)*5*S;
  owlHead(HW*0.5, counterY-92*S+bob, 46*S, time*3.1, true);
  // wings kneading
  ctx.fillStyle='#9E6F4C';
  ell(HW*0.5-52*S, counterY-42*S+Math.sin(s.work*2)*7*S, 20*S, 11*S, -0.4);
  ell(HW*0.5+52*S, counterY-42*S-Math.sin(s.work*2)*7*S, 20*S, 11*S, 0.4);

  // counter
  ctx.fillStyle='#C08552'; ctx.fillRect(0,counterY,HW,H-counterY);
  ctx.fillStyle='#D9A05B'; ctx.fillRect(0,counterY,HW,14*S);
  ctx.strokeStyle='rgba(120,70,30,.25)'; ctx.lineWidth=2;
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(0,counterY+30*S+i*24*S); ctx.lineTo(HW,counterY+30*S+i*24*S); ctx.stroke(); }

  // pizza in progress on the counter
  const stage=Math.min(3,Math.floor(sides[PIZZA].prog*4));
  pizzaDisc(HW*0.5, counterY-6*S, 46*S, stage, false);

  ctx.restore();
}

function drawIceSide(){
  const s=sides[ICE];
  ctx.save(); ctx.beginPath(); ctx.rect(HW,0,HW,H); ctx.clip(); ctx.translate(HW,0);

  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#D6F6EE'); g.addColorStop(1,'#8FD6C8');
  ctx.fillStyle=g; ctx.fillRect(0,0,HW,H);

  // awning
  const aw=HW/6;
  for(let i=0;i<7;i++){
    ctx.fillStyle=i%2?'#FF9FB2':'#FFFDF6';
    ctx.beginPath(); ctx.moveTo(i*aw,0); ctx.lineTo((i+1)*aw,0);
    ctx.lineTo((i+1)*aw, H*0.055); ctx.quadraticCurveTo(i*aw+aw/2, H*0.085, i*aw, H*0.055);
    ctx.closePath(); ctx.fill();
  }

  // gelato machine
  const mx=HW*0.19, my=counterY-150*S;
  ctx.fillStyle='#CFE9F5'; rr(mx-58*S,my,116*S,150*S,18*S); ctx.fill();
  ctx.strokeStyle='#9BC6D8'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#8FD6C8'; rr(mx-40*S,my+18*S,80*S,44*S,10*S); ctx.fill();
  // spinning dial
  ctx.save(); ctx.translate(mx+30*S,my+96*S); ctx.rotate(s.work*1.5);
  ctx.fillStyle='#FF9FB2'; circle(0,0,15*S);
  ctx.fillStyle='#FFFDF6'; ctx.fillRect(-3*S,-13*S,6*S,26*S); ctx.restore();
  // nozzle + drip
  ctx.fillStyle='#B7D9E6'; ctx.fillRect(mx-14*S,my+150*S,28*S,16*S);
  ctx.fillStyle=SCOOPS[(sides[ICE].made)%SCOOPS.length];
  const drip=(Math.sin(s.work*2)*0.5+0.5)*14*S;
  ell(mx, my+170*S+drip, 10*S, 12*S);
  // cold mist
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<4;i++){ const t=(time*0.6+i*0.25)%1;
    ctx.globalAlpha=(1-t)*0.5; circle(mx-30*S+i*20*S, my+150*S+t*50*S, (6+t*10)*S); }
  ctx.globalAlpha=1;

  // shelf of finished sundaes
  ctx.fillStyle='#7FC0B2'; ctx.fillRect(HW*0.74, counterY-70*S, HW*0.24, 9*S);
  shelfI.forEach((p,i)=>{
    ctx.fillStyle=p.c; circle(HW*0.855, counterY-84*S-i*26*S, 12*S);
    ctx.fillStyle='#FFFDF6'; circle(HW*0.855-4*S, counterY-88*S-i*26*S, 4*S);
  });

  // turtle chef
  const bob=Math.sin(s.work*0.9)*4*S;
  // shell peeking behind counter
  ctx.fillStyle='#5FA354';
  ctx.beginPath(); ctx.ellipse(HW*0.5, counterY-10*S+bob, 62*S, 46*S, 0, Math.PI, TAU); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#487F41'; ctx.lineWidth=3;
  for(let i=1;i<4;i++){ const a=Math.PI+i*Math.PI/4;
    ctx.beginPath(); ctx.moveTo(HW*0.5,counterY-10*S+bob);
    ctx.lineTo(HW*0.5+Math.cos(a)*62*S, counterY-10*S+bob+Math.sin(a)*46*S); ctx.stroke(); }
  turtleHead(HW*0.5, counterY-84*S+bob, 40*S, time*2.6, true);
  ctx.fillStyle='#A8D98B';
  ell(HW*0.5-56*S, counterY-34*S+Math.sin(s.work*2)*6*S, 17*S, 11*S, -0.3);
  ell(HW*0.5+56*S, counterY-34*S-Math.sin(s.work*2)*6*S, 17*S, 11*S, 0.3);

  // cart front
  ctx.fillStyle='#7FC0B2'; ctx.fillRect(0,counterY,HW,H-counterY);
  ctx.fillStyle='#A8DFD2'; ctx.fillRect(0,counterY,HW,14*S);
  // gelato tubs in the window
  for(let i=0;i<4;i++){
    const tx2=HW*0.16+i*HW*0.22, ty2=counterY+52*S;
    ctx.fillStyle='#EAF7F3'; rr(tx2-26*S,ty2-20*S,52*S,40*S,8*S); ctx.fill();
    ctx.fillStyle=SCOOPS[i]; ell(tx2,ty2-16*S,24*S,11*S);
  }

  // cone in progress
  const stage=Math.min(3,Math.floor(sides[ICE].prog*4));
  coneStack(HW*0.5, counterY-14*S, 38*S, stage, SCOOPS);

  ctx.restore();
}

/* ============================== hud, card, buttons ============================== */
function drawTally(side){
  const x0=side*HW, s=sides[side];
  const y=H*0.032;
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.55)';
  rr(x0+14*S, y-20*S, Math.min(HW-28*S, 250*S), 42*S, 21*S); ctx.fill();
  // boost bar
  const bx=x0+22*S, bw=Math.min(HW-44*S,234*S);
  ctx.fillStyle='rgba(255,255,255,.6)'; rr(bx,y+13*S,bw,7*S,4*S); ctx.fill();
  ctx.fillStyle=side===PIZZA?'#FF9F1C':'#4FB0A5';
  rr(bx,y+13*S,bw*clamp(sides[side].boost/1.8,0,1),7*S,4*S); ctx.fill();
  // icon + count
  if(side===PIZZA) pizzaDisc(x0+42*S,y-2*S,15*S,3,false);
  else coneStack(x0+42*S,y-4*S,11*S,1,SCOOPS);
  txt('× '+s.made, x0+80*S, y-2*S, 26*S, '#4A3421','bold','left');
  ctx.restore();
}

function drawCard(){
  if(!q) return;
  const c=cardRect(), warm=(q.side===PIZZA);
  const shake=q.shake>0?Math.sin(q.shake*60)*5:0;
  ctx.save(); ctx.translate(shake,0);
  ctx.fillStyle='rgba(0,0,0,.12)'; rr(c.x+4,c.y+6,c.w,c.h,22*S); ctx.fill();
  ctx.fillStyle='#FFFDF6'; rr(c.x,c.y,c.w,c.h,22*S); ctx.fill();
  ctx.strokeStyle=warm?'#F2A65A':'#7FC0B2'; ctx.lineWidth=6*S; ctx.stroke();

  // whose sum is it
  if(warm) owlHead(c.x+34*S, c.y+30*S, 22*S, time*3.1, true);
  else turtleHead(c.x+c.w-34*S, c.y+30*S, 20*S, time*2.6, true);

  const eq=q.a+' '+(q.op==='+'?'+':'−')+' '+q.b+' = ?';
  txt(eq, c.x+c.w/2, c.y+c.h*0.34, Math.min(c.h*0.34,60*S), '#4A3421');

  // counting dots
  const dotsA=q.a, dotsB=q.b, total=q.op==='+'?dotsA+dotsB:dotsA;
  if(total<=14){
    const r=Math.min(c.w/(total*2.9), c.h*0.10), gap=r*2.7;
    const wide=(total-1)*gap + (q.op==='+'? gap*0.7:0);
    let x=c.x+c.w/2-wide/2, y=c.y+c.h*0.72;
    for(let i=0;i<total;i++){
      if(q.op==='+' && i===dotsA) x+=gap*0.7;
      ctx.fillStyle=warm?'#C0392B':'#FF9FB2';
      circle(x,y,r);
      ctx.fillStyle='rgba(255,255,255,.4)'; circle(x-r*0.3,y-r*0.3,r*0.28);
      if(q.op==='-' && i>=dotsA-dotsB){
        ctx.strokeStyle='#7A6A5A'; ctx.lineWidth=Math.max(2,r*0.3); ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(x-r,y-r); ctx.lineTo(x+r,y+r); ctx.stroke();
      }
      x+=gap;
    }
  }
  ctx.restore();
}

function drawButtons(){
  if(!q) return;
  for(let i=0;i<3;i++){
    const b=btnRect(i), solved=(q.solved===i), dead=q.dead[i];
    const selected=(q.sel===i && q.solved<0 && !dead);
    const pop=solved?1+Math.sin(clamp(q.t,0,0.3)*10)*0.08:1;
    ctx.save();
    ctx.translate(b.x+b.w/2,b.y+b.h/2); ctx.scale(pop,pop); ctx.translate(-b.w/2,-b.h/2);
    ctx.globalAlpha=dead?0.35:1;
    ctx.fillStyle='rgba(0,0,0,.15)'; rr(3,6,b.w,b.h,18*S); ctx.fill();
    ctx.fillStyle= solved? '#FFD166' : (q.side===PIZZA?'#FFF1DA':'#EAFBF5');
    rr(0,0,b.w,b.h,18*S); ctx.fill();
    ctx.strokeStyle= solved? '#F2A65A' : (selected? (q.side===PIZZA?'#E4572E':'#2E9C90') : 'rgba(0,0,0,.15)');
    ctx.lineWidth= selected||solved ? 7*S : 3*S; ctx.stroke();
    txt(String(q.choices[i]), b.w/2, b.h/2, Math.min(b.h*0.62,60*S), '#4A3421');
    if(dead){ ctx.strokeStyle='rgba(120,90,70,.5)'; ctx.lineWidth=5*S; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(b.w*0.3,b.h*0.3); ctx.lineTo(b.w*0.7,b.h*0.7); ctx.stroke(); }
    ctx.restore();
  }
}

function draw(){
  drawPizzaSide();
  drawIceSide();

  // divider post
  ctx.fillStyle='#8A5A3B'; ctx.fillRect(HW-7*S,0,14*S,H);
  ctx.fillStyle='rgba(255,255,255,.25)'; ctx.fillRect(HW-7*S,0,5*S,H);

  drawTally(PIZZA); drawTally(ICE);
  drawCard(); drawButtons();

  // flying finished treats
  for(const f of flying){
    if(f.side===PIZZA) pizzaDisc(f.x,f.y,26*S,3,true);
    else { ctx.fillStyle=f.c; circle(f.x,f.y,14*S);
           ctx.fillStyle='#FFFDF6'; circle(f.x-4*S,f.y-4*S,5*S); }
  }
  // cheer stars over a kitchen that just finished
  sides.forEach(s=>{
    if(s.cheer>0){
      const a=clamp(s.cheer,0,1);
      for(let i=0;i<5;i++){
        const ph=time*3+i, x=s.id*HW+HW*(0.28+i*0.11), y=counterY-190*S+Math.sin(ph)*10*S;
        ctx.save(); ctx.globalAlpha=a*0.9; ctx.fillStyle=i%2?'#FFD166':'#FFF3C4';
        star5(x,y,13*S,0.45); ctx.fill(); ctx.restore();
      }
    }
  });

  for(const p of parts){
    ctx.globalAlpha=1-p.life/p.max; ctx.fillStyle=p.c; circle(p.x,p.y,p.s);
  }
  ctx.globalAlpha=1;

  if(badge>0.01){
    ctx.save(); ctx.globalAlpha=badge*0.85;
    const t2='Watching mode — click an answer or press an arrow key to join in';
    ctx.font=Math.round(15*S)+'px "Baloo 2", Verdana, sans-serif';
    const w=ctx.measureText(t2).width+34;
    ctx.fillStyle='rgba(255,255,255,.7)'; rr((W-w)/2,H-44,w,30,15); ctx.fill();
    txt(t2, W/2, H-29, 15*S, '#4A3421','normal');
    ctx.restore();
  }
}

/* ============================== loop ============================== */
let last=0;
function frame(ts){
  const t=ts/1000; let dt=last?t-last:0.016; last=t; dt=Math.min(dt,0.05);
  if(started) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================== ui ============================== */
const startEl=document.getElementById('start');
function begin(level){
  LEVEL=clamp(level|0,0,2);
  startEl.style.display='none';
  started=true; lastInput=time;
  Sound.start();
}
Array.prototype.forEach.call(document.querySelectorAll('.levels button'), b=>{
  b.addEventListener('click', ()=>begin(parseInt(b.getAttribute('data-level'),10)));
});
function toggleSound(){
  const on=Sound.toggle();
  document.getElementById('soundBtn').textContent = on?'🔊':'🔈';
}
document.getElementById('soundBtn').addEventListener('click',e=>{e.stopPropagation();toggleSound();});
document.getElementById('fsBtn').addEventListener('click',e=>{
  e.stopPropagation();
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this;
  };
}
})();
</script>
