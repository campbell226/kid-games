<title>Vibe With Me</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #141d3a;
    overflow: hidden;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    display: block;
    width: 100vw; height: 100vh;
    width: 100dvw; height: 100dvh;

  .hit { fill: transparent; cursor: pointer; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

<script>
// Full screen on the first touch, and a way back if it is off.
//
// A browser will not do this by itself: the request has to come out of a
// gesture the browser counts as user activation, and that list is fussier
// than it looks. pointerdown only counts when the pointer is a mouse - on
// a touchscreen it grants nothing at all, which is why listening for it
// worked on a laptop and did nothing whatever on a tablet. For a finger it
// is pointerup and touchend that count.
//
// Once full screen is on, the automatic asking stops, so leaving it stays
// left. But leaving it used to mean reloading to get it back, so there is
// now a small button at the top of the screen that is only there while
// full screen is off, and takes itself away the moment it is on.
//
// An iPhone ignores the lot, because Safari there gives full screen to
// video and nothing else, so no button is offered. That is what the home
// screen tags above are for.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#3a3f6a" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" aria-label="Vibe With Me">
  <defs>
    <linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d3a"/>
      <stop offset="1" stop-color="#3a2a5c"/>
    </linearGradient>
    <radialGradient id="vspot" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffe9a0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="backdrop"></g>
  <g id="tune"></g>
  <g id="jam"></g>
</svg>

<script>
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('stage');

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function el(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) { for (var k in attrs) { n.setAttribute(k, attrs[k]); } }
    return n;
  }
  function clear(n) { while (n.firstChild) { n.removeChild(n.firstChild); } }

  function load(key, dflt) {
    try {
      var v = window.localStorage.getItem('vibe-' + key);
      return v === null ? dflt : parseFloat(v);
    } catch (e) { return dflt; }
  }
  function save(key, v) {
    try { window.localStorage.setItem('vibe-' + key, String(v)); } catch (e) { /* private mode */ }
  }

  var reduceQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = reduceQuery.matches;
  if (reduceQuery.addEventListener) {
    reduceQuery.addEventListener('change', function (e) { reduced = e.matches; });
  }

  // ------------------------------------------------------------------
  // Music theory, such as it is.
  //
  // Every pitched part draws from one C major pentatonic scale, in its
  // own octave, and chords are built by stacking every other degree of
  // it. That is the whole trick: no combination of characters - on this
  // device or the one across the room - can sound wrong.
  // ------------------------------------------------------------------
  var PENT = [0, 2, 4, 7, 9];

  function pentMidi(base, i) {
    var oct = Math.floor(i / 5);
    var d = ((i % 5) + 5) % 5;
    return base + PENT[d] + 12 * oct;
  }
  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  // Patterns are written as strings, one character to a sixteenth. A dot
  // is a rest; a hex digit is a scale degree, or just "play it" for the
  // unpitched ones. Anything shorter than the loop tiles into it, so a
  // drum figure can be one bar while a tune is all sixteen beats.
  function deg(ch) {
    if (ch === '.') { return null; }
    if (ch === 'x') { return 0; }
    var n = parseInt(ch, 16);
    return isNaN(n) ? null : n;
  }

  // ------------------------------------------------------------------
  // Audio.
  //
  // Nothing is downloaded. The instruments are worked out sample by
  // sample into buffers the first time one is asked for, then triggered
  // like any other sample - which is what lets them sound like struck
  // and plucked things rather than like beeps.
  // ------------------------------------------------------------------
  var AC = null, master = null;

  function initAudio() {
    if (AC) {
      if (AC.state === 'suspended') { AC.resume(); }
      return;
    }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { return; }
    AC = new Ctx();

    // Six characters at once should get louder, not turn into clipped mush.
    var comp = AC.createDynamicsCompressor();
    comp.threshold.setValueAtTime(-15, AC.currentTime);
    comp.ratio.setValueAtTime(6, AC.currentTime);
    comp.attack.setValueAtTime(0.004, AC.currentTime);
    comp.release.setValueAtTime(0.2, AC.currentTime);

    master = AC.createGain();
    master.gain.setValueAtTime(0.5, AC.currentTime);
    master.connect(comp);
    comp.connect(AC.destination);

    if (AC.state === 'suspended') { AC.resume(); }
  }

  // --- the workshop the instruments are built in ---------------------

  function buffer(seconds, fill) {
    var sr = AC.sampleRate, n = Math.max(1, Math.floor(seconds * sr));
    var b = AC.createBuffer(1, n, sr), d = b.getChannelData(0);
    fill(d, sr, n);
    var f = Math.min(n, Math.floor(sr * 0.004));
    for (var i = 0; i < f; i++) { d[n - f + i] *= 1 - i / f; }
    return b;
  }

  function noise(d, n) {
    for (var i = 0; i < n; i++) { d[i] = Math.random() * 2 - 1; }
  }

  // One biquad, written out, because the buffers are built by hand and
  // there is no node graph here to borrow one from.
  function filter(d, n, sr, type, f, Q) {
    var w = 2 * Math.PI * f / sr, cs = Math.cos(w), sn = Math.sin(w), al = sn / (2 * Q);
    var b0, b1, b2, a0, a1, a2;
    if (type === 'lp') { b0 = (1 - cs) / 2; b1 = 1 - cs; b2 = b0; }
    else if (type === 'hp') { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = b0; }
    else { b0 = al; b1 = 0; b2 = -al; }
    a0 = 1 + al; a1 = -2 * cs; a2 = 1 - al;
    b0 /= a0; b1 /= a0; b2 /= a0; a1 /= a0; a2 /= a0;
    var x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (var i = 0; i < n; i++) {
      var x = d[i], y = b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = x; y2 = y1; y1 = y; d[i] = y;
    }
  }

  function envelope(d, n, sr, attack, decay) {
    for (var i = 0; i < n; i++) {
      var t = i / sr;
      var a = Math.exp(-t / decay);
      if (attack > 0) { a *= Math.min(1, t / attack); }
      d[i] *= a;
    }
  }

  // A plucked string, the old delay-line way: a burst of noise fed back
  // through itself a wavelength late, losing a little each time round.
  function pluckString(d, sr, n, f, damp, soft) {
    var N = Math.max(2, Math.round(sr / f));
    var line = new Float32Array(N), i, lp = 0;
    for (i = 0; i < N; i++) { line[i] = Math.random() * 2 - 1; }
    for (i = 0; i < N; i++) { lp += (line[i] - lp) * soft; line[i] = lp; }
    var idx = 0, prev = 0;
    for (i = 0; i < n; i++) {
      var cur = line[idx];
      d[i] = cur;
      line[idx] = (cur + prev) * 0.5 * damp;
      prev = cur;
      idx = (idx + 1) % N;
    }
  }

  // Two sines, one bending the other. Nearly every struck or rung metal
  // and wooden thing in here is this with different numbers.
  function fm(d, sr, n, f, ratio, index, bend, decay, attack) {
    var ph = 0, mph = 0, two = Math.PI * 2, i;
    for (i = 0; i < n; i++) {
      var t = i / sr;
      var a = Math.exp(-t / decay);
      if (attack > 0) { a *= Math.min(1, t / attack); }
      var I = index * Math.exp(-t / bend);
      mph += two * f * ratio / sr;
      ph += two * f / sr;
      d[i] = Math.sin(ph + I * Math.sin(mph)) * a;
    }
  }

  function additive(d, sr, n, f, harmonics, decay, attack) {
    var two = Math.PI * 2, i, h;
    for (i = 0; i < n; i++) {
      var t = i / sr, s = 0;
      for (h = 0; h < harmonics.length; h++) {
        s += Math.sin(two * f * harmonics[h][0] * t) * harmonics[h][1];
      }
      var a = Math.exp(-t / decay);
      if (attack > 0) { a *= Math.min(1, t / attack); }
      d[i] = s * a;
    }
  }

  function sweep(d, sr, n, f0, f1, bendTime, decay) {
    var ph = 0, two = Math.PI * 2;
    for (var i = 0; i < n; i++) {
      var t = i / sr;
      var f = f1 + (f0 - f1) * Math.exp(-t / bendTime);
      ph += two * f / sr;
      d[i] = Math.sin(ph) * Math.exp(-t / decay);
    }
  }

  // --- the instruments ----------------------------------------------
  //
  // ref is the pitch each one was built at; a note is that buffer played
  // faster or slower. gain evens them out against each other.

  var TONES = {
    kick: { gain: 0.95, make: function () {
      return buffer(0.42, function (d, sr, n) {
        sweep(d, sr, n, 132, 46, 0.035, 0.16);
        var c = Math.floor(sr * 0.004);
        for (var i = 0; i < c; i++) { d[i] += (Math.random() * 2 - 1) * 0.55 * (1 - i / c); }
      });
    } },
    snare: { gain: 0.5, make: function () {
      return buffer(0.26, function (d, sr, n) {
        var body = new Float32Array(n);
        sweep(body, sr, n, 330, 185, 0.02, 0.075);
        noise(d, n);
        filter(d, n, sr, 'bp', 1850, 0.8);
        envelope(d, n, sr, 0.001, 0.075);
        for (var i = 0; i < n; i++) { d[i] = d[i] * 0.85 + body[i] * 0.5; }
      });
    } },
    tom: { gain: 0.55, make: function () {
      return buffer(0.4, function (d, sr, n) { sweep(d, sr, n, 230, 96, 0.06, 0.13); });
    } },
    clap: { gain: 0.5, make: function () {
      return buffer(0.3, function (d, sr, n) {
        noise(d, n);
        filter(d, n, sr, 'bp', 1250, 1.1);
        var burst = [0, 0.011, 0.022, 0.034];
        for (var i = 0; i < n; i++) {
          var t = i / sr, a = 0;
          for (var b = 0; b < burst.length; b++) {
            if (t >= burst[b]) { a = Math.max(a, Math.exp(-(t - burst[b]) / (b === 3 ? 0.07 : 0.008))); }
          }
          d[i] *= a;
        }
      });
    } },
    hatC: { gain: 0.24, make: function () {
      return buffer(0.09, function (d, sr, n) {
        noise(d, n); filter(d, n, sr, 'hp', 7200, 0.8); envelope(d, n, sr, 0.0005, 0.016);
      });
    } },
    hatO: { gain: 0.2, make: function () {
      return buffer(0.36, function (d, sr, n) {
        noise(d, n); filter(d, n, sr, 'hp', 6600, 0.8); envelope(d, n, sr, 0.0005, 0.1);
      });
    } },
    shaker: { gain: 0.26, make: function () {
      return buffer(0.14, function (d, sr, n) {
        noise(d, n); filter(d, n, sr, 'bp', 5800, 0.9); envelope(d, n, sr, 0.008, 0.028);
      });
    } },
    tamb: { gain: 0.24, make: function () {
      return buffer(0.3, function (d, sr, n) {
        noise(d, n); filter(d, n, sr, 'bp', 8600, 0.7);
        for (var i = 0; i < n; i++) {
          var t = i / sr;
          d[i] *= Math.exp(-t / 0.055) * (0.75 + 0.25 * Math.sin(t * 260));
        }
      });
    } },
    clave: { gain: 0.32, make: function () {
      return buffer(0.09, function (d, sr, n) {
        fm(d, sr, n, 2500, 1.5, 1.2, 0.006, 0.018, 0);
      });
    } },

    bassPluck: { ref: 82.41, gain: 0.8, make: function () {
      return buffer(1.4, function (d, sr, n) {
        pluckString(d, sr, n, 82.41, 0.9955, 0.35);
        filter(d, n, sr, 'lp', 900, 0.7);
        envelope(d, n, sr, 0, 0.6);
      });
    } },
    bassSynth: { ref: 82.41, gain: 0.7, make: function () {
      return buffer(1, function (d, sr, n) {
        fm(d, sr, n, 82.41, 1, 3.2, 0.09, 0.28, 0.002);
        filter(d, n, sr, 'lp', 1400, 0.9);
      });
    } },
    pluck: { ref: 220, gain: 0.5, make: function () {
      return buffer(1.8, function (d, sr, n) {
        pluckString(d, sr, n, 220, 0.9965, 0.55);
        envelope(d, n, sr, 0, 0.85);
      });
    } },
    epiano: { ref: 220, gain: 0.45, make: function () {
      return buffer(1.5, function (d, sr, n) {
        var tine = new Float32Array(n);
        fm(tine, sr, n, 220, 14, 1.6, 0.02, 0.07, 0);
        fm(d, sr, n, 220, 1, 2.4, 0.16, 0.55, 0.002);
        for (var i = 0; i < n; i++) { d[i] += tine[i] * 0.3; }
      });
    } },
    marimba: { ref: 440, gain: 0.45, make: function () {
      return buffer(0.7, function (d, sr, n) {
        fm(d, sr, n, 440, 4, 2.6, 0.02, 0.16, 0.001);
      });
    } },
    glock: { ref: 880, gain: 0.32, make: function () {
      return buffer(1.6, function (d, sr, n) {
        fm(d, sr, n, 880, 3.5, 3.4, 0.05, 0.5, 0.001);
      });
    } },
    kalimba: { ref: 440, gain: 0.4, make: function () {
      return buffer(1, function (d, sr, n) {
        fm(d, sr, n, 440, 1, 1.5, 0.05, 0.32, 0.001);
      });
    } },
    organ: { ref: 220, gain: 0.3, make: function () {
      return buffer(2.2, function (d, sr, n) {
        additive(d, sr, n, 220, [[1, 1], [2, 0.5], [3, 0.22], [4, 0.16], [6, 0.08], [8, 0.05]], 1.1, 0.03);
      });
    } },
    click: { gain: 0.9, make: function () {
      return buffer(0.06, function (d, sr, n) {
        var body = new Float32Array(n);
        fm(body, sr, n, 1180, 1.4, 1.1, 0.005, 0.014, 0);
        noise(d, n);
        filter(d, n, sr, 'bp', 3200, 1.4);
        envelope(d, n, sr, 0.0004, 0.006);
        for (var i = 0; i < n; i++) { d[i] = d[i] * 0.45 + body[i] * 0.85; }
      });
    } }
  };

  // Built the first time each one is wanted, so opening the game does
  // not stop to make seventeen instruments nobody has chosen yet.
  var BANK = {};
  function toneBuffer(name) {
    if (!BANK[name]) {
      if (!AC || !TONES[name]) { return null; }
      BANK[name] = TONES[name].make();
    }
    return BANK[name];
  }

  function play(name, midi, t, level) {
    if (!AC || !master) { return 0; }
    var b = toneBuffer(name);
    if (!b) { return 0; }
    var spec = TONES[name];
    var rate = spec.ref ? mtof(midi) / spec.ref : 1;
    var src = AC.createBufferSource();
    src.buffer = b;
    src.playbackRate.setValueAtTime(rate, t);
    var g = AC.createGain();
    g.gain.setValueAtTime(spec.gain * (level === undefined ? 1 : level), t);
    src.connect(g); g.connect(master);
    src.start(t);
    return b.duration / rate;
  }

  // ------------------------------------------------------------------
  // The band. Each character keeps one instrument for good and offers
  // six ways of playing it, so however the two children choose, there is
  // still a bottom, a middle and a top to the music.
  //
  // The six colours mean the same thing on every card: red is the first
  // sound, purple the sixth. A child learns "the green one" once.
  // ------------------------------------------------------------------
  var SOUND_COLOURS = ['#e05a5a', '#ef8f3c', '#f0c33c', '#5fbb63', '#4aa3d8', '#a97ad8'];

  function P() { return Array.prototype.join.call(arguments, ''); }

  var KITS = {
    dog: [
      { lanes: [{ t: 'kick', p: 'x...x...x...x...' }, { t: 'snare', p: '....x.......x...' }] },
      { lanes: [
        { t: 'kick', p: P('x.....x...x.....', 'x.....x...x.....', 'x.....x...x.....', 'x.....x...x.x.x.') },
        { t: 'snare', p: '....x.......x...' }] },
      { lanes: [{ t: 'kick', p: 'x...............' }, { t: 'snare', p: '........x.......' }] },
      { lanes: [{ t: 'kick', p: 'x..x..x...x.x...' }, { t: 'snare', p: '....x..x....x..x' }] },
      { lanes: [
        { t: 'kick', p: 'x.......x.......' },
        { t: 'tom', p: P('..x...x.....x...', '..x...x.....x...', '..x...x.....x...', '..x.x.x.x.x.x.x.') }] },
      { lanes: [{ t: 'kick', p: 'x..x....x..x....' }, { t: 'clap', p: '....x.......x...' }] }
    ],
    mouse: [
      { lanes: [{ t: 'hatC', p: 'x.x.x.x.x.x.x.x.' }] },
      { lanes: [{ t: 'hatC', p: 'x.xxx.x.x.xxx.x.' }] },
      { lanes: [{ t: 'shaker', p: '..x...x...x...x.' }] },
      { lanes: [{ t: 'tamb', p: '....x.......x...' }] },
      { lanes: [{ t: 'clave', p: 'x..x..x...x.x...' }] },
      { lanes: [{ t: 'hatC', p: 'x.x.x.x.x.x.x.x.' }, { t: 'hatO', p: '......x.......x.' }] }
    ],
    frog: [
      { base: 36, lanes: [{ t: 'bassPluck', p: '0.......0.......' }] },
      { base: 36, lanes: [{ t: 'bassPluck', p: P('0...0...2...0...', '4...4...2...0...', '0...0...2...4...', '3...3...2...0...') }] },
      { base: 36, lanes: [{ t: 'bassSynth', p: '0.0.0.0.2.2.0.0.' }] },
      { base: 36, lanes: [{ t: 'bassSynth', p: P('0.......3.......', '2.......0.......', '0.......3.......', '4.......2.......') }] },
      { base: 36, lanes: [{ t: 'bassPluck', p: '0.....5.0.....5.' }] },
      { base: 36, lanes: [{ t: 'bassSynth', p: P('0..0..2...0.....', '3..3..2...0.....') }] }
    ],
    cow: [
      { base: 48, chord: true, lanes: [{ t: 'organ', p: P('0...............', '0...............', '3...............', '2...............') }] },
      { base: 48, chord: true, lanes: [{ t: 'epiano', p: P('0.......2.......', '4.......2.......', '0.......2.......', '3.......2.......') }] },
      { base: 48, chord: true, lanes: [{ t: 'pluck', p: '0..0..0...0..0..' }] },
      { base: 48, chord: true, lanes: [{ t: 'organ', p: P('0...............', '4...............', '2...............', '3...............') }] },

  // ------------------------------------------------------------------
  // The clock, which is the whole point of the game.
  //
  // Two devices cannot talk to each other, but they already share a
  // clock: the wall clock, which both of them keep disciplined against
  // network time and neither of them lets drift. So the beat grid is
  // not counted out locally - it is a function of the actual time of
  // day. Step n happens at n * stepDur + offset seconds past the epoch,
  // on every device in the room.
  //
  // What is left over is the difference between the two system clocks
  // and between the two devices' audio output latencies. That is what
  // the arrows take out, and once it is out it stays out, because
  // neither clock is free-running. A session can last all afternoon.
  //
  // The audio clock is a different, free-running clock, so it is slewed
  // onto the wall clock rather than trusted: at most a millisecond a
  // second, which is far more than crystal drift ever needs and slow
  // enough to be inaudible. A real jump - the phone picking up network
  // time for the first time - is taken in one go instead, because being
  // a second out is worse than one flinch.
  // ------------------------------------------------------------------
  var STEPS_PER_BEAT = 4, BEATS_PER_LOOP = 16;
  var STEPS_PER_LOOP = STEPS_PER_BEAT * BEATS_PER_LOOP;
  var LOOK = 0.14, MAX_SLEW = 0.001, JUMP = 0.25;

  var bpm = clamp(load('bpm', 90), 60, 160);
  var offset = load('offset', 0);
  var skew = 0, skewSet = false, stepN = 0, visQ = [], mode = 'tune';

  function wallNow() { return Date.now() / 1000; }
  function stepDur() { return 60 / bpm / STEPS_PER_BEAT; }
  function beatDur() { return 60 / bpm; }

  // Audio time of a step, via the wall clock it is really pinned to.
  function stepTime(n) { return n * stepDur() + offset + skew; }

  function trackWallClock(dt) {
    if (!AC) { return; }
    var measured = AC.currentTime - wallNow();
    if (!skewSet) { skew = measured; skewSet = true; return; }
    var err = measured - skew;
    if (err > JUMP || err < -JUMP) { skew = measured; return; }
    var step = MAX_SLEW * dt;
    skew += clamp(err, -step, step);
  }

  function curStep() {
    if (!AC || !skewSet) { return 0; }
    return (AC.currentTime - offset - skew) / stepDur();
  }

  // Changing the tempo must not shunt the beat sideways as well, and the
  // grid is absolute, so the offset is rewritten to hold the current
  // position still.
  function setBpm(v) {
    var next = clamp(Math.round(v), 60, 160);
    if (next === bpm) { return; }
    if (AC && skewSet) {
      var here = curStep();
      bpm = next;
      offset = AC.currentTime - skew - here * stepDur();
    } else {
      bpm = next;
    }
    save('bpm', bpm);
    save('offset', offset);
    paintBpm();
  }

  function nudge(seconds) {
    offset += seconds;
    save('offset', offset);
  }

  var pads = [], byId = {};

  function scheduler() {
    if (!AC || !master) { return; }
    // Tracked here rather than in the frame loop, because a backgrounded
    // tab stops drawing but must not stop keeping time.
    trackWallClock(0.025);
    var now = AC.currentTime, sd = stepDur(), i, j;

    // Coming back from a locked screen must not replay the whole loop.
    var behind = Math.floor((now - offset - skew) / sd) - 1;
    if (stepN < behind) { stepN = behind; }

    while (stepTime(stepN) < now + LOOK) {
      var t = stepTime(stepN), n = stepN;
      stepN += 1;
      if (t <= now + 0.002) { continue; }

      var inLoop = ((n % STEPS_PER_LOOP) + STEPS_PER_LOOP) % STEPS_PER_LOOP;
      var onBeat = (inLoop % STEPS_PER_BEAT) === 0;

      // Coming in, going out and changing sound all happen on a beat, so
      // nothing a child does can land off it. A beat is under a second's
      // wait, so nothing feels ignored either.
      if (onBeat) {
        for (i = 0; i < pads.length; i++) {
          if (pads[i].playing !== pads[i].want) {
            pads[i].playing = pads[i].want;
            visQ.push({ t: t, id: pads[i].id, lit: pads[i].playing });
          }
        }
      }

      if (mode === 'tune') {
        if (onBeat) { play('click', 69, t, 1); }
      } else {
        for (i = 0; i < pads.length; i++) {
          var p = pads[i];
          if (p.playing < 0) { continue; }
          var v = p.kit[p.playing], hit = 0;
          for (j = 0; j < v.lanes.length; j++) {
            var lane = v.lanes[j];
            var ch = lane.p.charAt(inLoop % lane.p.length);
            var d = deg(ch);
            if (d === null) { continue; }
            if (v.base === undefined) {
              hit = Math.max(hit, play(lane.t, 69, t, 1));
            } else if (v.chord) {
              hit = Math.max(hit, play(lane.t, pentMidi(v.base, d), t, 1));
              play(lane.t, pentMidi(v.base, d + 2), t, 0.8);
              play(lane.t, pentMidi(v.base, d + 4), t, 0.7);
            } else {
              hit = Math.max(hit, play(lane.t, pentMidi(v.base, d), t, 1));
            }
          }
          if (hit > 0) { visQ.push({ t: t, id: p.id, hit: Math.min(hit, 0.5) }); }
        }
        // Only while somebody is holding the arrows, when a reference to
        // slide onto is the entire point and the music can put up with it.
        if (onBeat && stripOpen) { play('click', 69, t, 0.3); }
      }

      if (onBeat) { visQ.push({ t: t, beat: inLoop / STEPS_PER_BEAT }); }
    }
  }

  function drainVis(now) {
    while (visQ.length && visQ[0].t <= now) {

      } else if (e.hit !== undefined) {

        p.bounceV = 1;
        p.mouthT = e.hit;
        p.mouthAge = 0;
      }
    }

  // Two chevrons, because one triangle alone reads as "play". Drawn
  // pointing right and mirrored for the other one, so the pair can never
  // drift apart.
  function chevron(x) {

      + '<g transform="scale(-1,1) translate(14,0)">' + chevron(0) + '</g>';

    T.bpmText = el('text', {

    T.ring.appendChild(T.pip);
    T.orbit = el('circle', { cx: 0, cy: 0, r: 26, fill: '#ffe9a0' });
    T.ring.appendChild(T.orbit);

    T.condGlow = el('circle', { cx: 0, cy: 0, r: 120, fill: 'url(#vglow)', opacity: 0 });
    T.cond = el('g');
    T.condBob = el('g');
    T.condBob.innerHTML = MOUSE_SPEC.art(MOUSE_SPEC);
    T.cond.appendChild(T.condBob);
    T.condEyes = T.condBob.querySelector('.eyes');

    T.left = bigButton('#2f6f8f', arrowGlyph(-1));
    T.right = bigButton('#2f6f8f', arrowGlyph(1));
    T.left.setAttribute('data-act', 'nudge-');
    T.right.setAttribute('data-act', 'nudge+');

    T.play = bigButton('#3fa564',
      '<path d="M -22 -34 L 38 0 L -22 34 Z" fill="#ffffff"/>');
    T.play.setAttribute('data-act', 'play');

    g.appendChild(T.minus);
    g.appendChild(T.plus);
    g.appendChild(T.bpmText);
    g.appendChild(T.condGlow);
    g.appendChild(T.ring);
    g.appendChild(T.cond);
    g.appendChild(T.left);
    g.appendChild(T.right);
    g.appendChild(T.play);
    paintBpm();
  }

  function paintBpm() {
    if (T.bpmText) { T.bpmText.textContent = String(bpm); }
  }

  function layoutTune() {
    var W = L.W, H = L.H;
    if (L.wide) {
      var bw = Math.min(W * 0.15, 160), bh = Math.min(H * 0.2, 130);
      sizeButton(T.minus, bw, bh);
      sizeButton(T.plus, bw, bh);
      place(T.minus, W * 0.60, H * 0.22);
      place(T.plus, W * 0.92, H * 0.22);
      T.bpmText.setAttribute('x', W * 0.76);
      T.bpmText.setAttribute('y', H * 0.22 + bh * 0.34);
      T.bpmText.setAttribute('font-size', (bh * 0.95).toFixed(0));

      var aw = Math.min(W * 0.17, 190), ah = Math.min(H * 0.24, 150);
      sizeButton(T.left, aw, ah);
      sizeButton(T.right, aw, ah);
      place(T.left, W * 0.63, H * 0.55);
      place(T.right, W * 0.89, H * 0.55);

      var pw = Math.min(W * 0.24, 250), ph = Math.min(H * 0.22, 130);
      sizeButton(T.play, pw, ph);
      place(T.play, W * 0.76, H * 0.85);

      T.ringX = W * 0.27; T.ringY = H * 0.5;
      T.ringR = clamp(Math.min(H * 0.38, W * 0.22), 50, 320);
    } else {
      var bw2 = Math.min(W * 0.23, 240), bh2 = Math.min(H * 0.09, 170);
      sizeButton(T.minus, bw2, bh2);
      sizeButton(T.plus, bw2, bh2);
      place(T.minus, W * 0.16, H * 0.11);
      place(T.plus, W * 0.84, H * 0.11);
      T.bpmText.setAttribute('x', W * 0.5);
      T.bpmText.setAttribute('y', H * 0.11 + bh2 * 0.36);
      T.bpmText.setAttribute('font-size', bh2.toFixed(0));

      var aw2 = Math.min(W * 0.38, 380), ah2 = Math.min(H * 0.13, 200);
      sizeButton(T.left, aw2, ah2);
      sizeButton(T.right, aw2, ah2);
      place(T.left, W * 0.28, H * 0.68);
      place(T.right, W * 0.72, H * 0.68);

      var pw2 = Math.min(W * 0.46, 460), ph2 = Math.min(H * 0.12, 180);
      sizeButton(T.play, pw2, ph2);
      place(T.play, W * 0.5, H * 0.87);

      // The ring takes whatever is left between the tempo and the
      // arrows, so a stubby portrait window shrinks it instead of
      // running the number through it.
      var bandTop = H * 0.11 + bh2 * 0.5 + H * 0.04;
      var bandBot = H * 0.68 - ah2 * 0.5 - H * 0.04;
      T.ringX = W * 0.5;
      T.ringY = (bandTop + bandBot) / 2;
      T.ringR = clamp(Math.min(W * 0.32, (bandBot - bandTop) / 2), 50, 340);
    }

    T.ringLine.setAttribute('r', T.ringR);
    T.ringLine.setAttribute('stroke-width', Math.max(8, T.ringR * 0.07));
    T.ring.setAttribute('transform', 'translate(' + T.ringX + ',' + T.ringY + ')');
    T.pip.setAttribute('cx', 0);
    T.pip.setAttribute('cy', -T.ringR);
    T.pip.setAttribute('r', (T.ringR * 0.1).toFixed(1));
    T.orbit.setAttribute('r', (T.ringR * 0.13).toFixed(1));

    T.condGlow.setAttribute('cx', T.ringX);
    T.condGlow.setAttribute('cy', T.ringY);
    T.condGlow.setAttribute('r', T.ringR * 0.9);
    fitAnimal(T.cond, MOUSE_SPEC, T.ringX, T.ringY, T.ringR * 1.5, T.ringR * 1.25);
  }

  // ------------------------------------------------------------------
  // The jam. Every character on every device, six sounds each. A short
  // press moves to the next sound, a long press puts the character away.
  // ------------------------------------------------------------------
  var J = {};
  var HOLD = 0.5;

  function buildJam() {
    var g = document.getElementById('jam');
    clear(g);
    pads = []; byId = {};

    SPECS.forEach(function (spec) {
      var node = el('g', { class: 'pad', 'data-id': spec.id });
      var card = el('rect', {
        x: -100, y: -60, width: 200, height: 120, rx: 30,
        fill: '#212a52', stroke: 'rgba(255,255,255,0.1)', 'stroke-width': 3
      });
      node.appendChild(card);
      var glow = el('circle', { cx: 0, cy: 0, r: 100, fill: 'url(#vglow)', opacity: 0 });
      node.appendChild(glow);
      var art = el('g');
      var bob = el('g');
      bob.innerHTML = spec.art(spec);
      art.appendChild(bob);
      node.appendChild(art);
      var hit = el('rect', { class: 'hit', x: -100, y: -60, width: 200, height: 120 });
      node.appendChild(hit);
      g.appendChild(node);

      var p = {
        id: spec.id, spec: spec, kit: KITS[spec.id],
        node: node, card: card, glow: glow, art: art, bob: bob, hit: hit,
        mouth: bob.querySelector('.mouth'),
        eyes: bob.querySelector('.eyes'),
        want: -1, playing: -1, lit: -1,
        bounceV: 0, mouthT: 0, mouthAge: 99, pulse: 0, pressT: 0,
        blink: 2 + Math.random() * 5, blinkV: 1,
        idle: Math.random() * 6.28
      };
      pads.push(p);
      byId[spec.id] = p;
    });

    // Sixteen beats, sixteen dots, along the bottom where the browser's
    // own full screen button cannot sit on them. Two devices showing the
    // same dot are together.
    J.dots = [];
    J.dotG = el('g');
    for (var i = 0; i < BEATS_PER_LOOP; i++) {
      var d = el('circle', { cx: 0, cy: 0, r: 8, fill: '#8ea0d8' });
      J.dotG.appendChild(d);
      J.dots.push(d);
    }
    g.appendChild(J.dotG);

    J.tuneBtn = bigButton('#3f4a7d', spreadGlyph());
    J.tuneBtn.setAttribute('data-act', 'strip');
    g.appendChild(J.tuneBtn);

    J.strip = el('g', { opacity: 0, 'pointer-events': 'none' });
    J.stripBack = el('rect', { x: 0, y: 0, width: 10, height: 10, rx: 40, fill: 'rgba(12,16,38,0.86)' });
    J.strip.appendChild(J.stripBack);
    J.stripLeft = bigButton('#2f6f8f', arrowGlyph(-1));
    J.stripLeft.setAttribute('data-act', 'nudge-');
    J.stripRight = bigButton('#2f6f8f', arrowGlyph(1));
    J.stripRight.setAttribute('data-act', 'nudge+');
    // The way back is drawn as the tuning ring itself, so the button
    // shows where it goes rather than saying so.
    J.stripHome = bigButton('#3f4a7d',
      '<circle cx="0" cy="0" r="26" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.55"/>'
      + '<circle cx="0" cy="-26" r="10" fill="#ffe9a0"/>');
    J.stripHome.setAttribute('data-act', 'home');
    J.strip.appendChild(J.stripLeft);
    J.strip.appendChild(J.stripHome);
    J.strip.appendChild(J.stripRight);
    g.appendChild(J.strip);
  }

  function layoutJam() {
    var W = L.W, H = L.H;
    var cols = L.wide ? 3 : 2, rows = L.wide ? 2 : 3;
    var topBar = Math.min(L.wide ? H * 0.16 : H * 0.09, 130);
    var botBar = Math.min(L.wide ? H * 0.11 : H * 0.055, 80);
    var gap = 14;
    var padW = (W - gap * (cols + 1)) / cols;
    // A card taller than it is wide leaves the character stranded in a
    // sea of empty pad, so the height is capped and the block centred in
    // whatever is left.
    var availH = H - topBar - botBar;
    var padH = Math.min((availH - gap * (rows + 1)) / rows, padW * 1.15);
    var top0 = topBar + (availH - (padH * rows + gap * (rows - 1))) / 2;

    pads.forEach(function (p, i) {
      var c = i % cols, r = Math.floor(i / cols);
      var x = gap + padW * (c + 0.5) + gap * c;
      var y = top0 + padH * (r + 0.5) + gap * r;
      p.cx = x; p.cy = y; p.w = padW; p.h = padH;
      p.card.setAttribute('x', -padW / 2);
      p.card.setAttribute('y', -padH / 2);
      p.card.setAttribute('width', padW);
      p.card.setAttribute('height', padH);
      p.card.setAttribute('rx', Math.min(padW, padH) * 0.16);
      p.hit.setAttribute('x', -padW / 2);
      p.hit.setAttribute('y', -padH / 2);
      p.hit.setAttribute('width', padW);
      p.hit.setAttribute('height', padH);
      p.glow.setAttribute('r', Math.min(padW, padH) * 0.62);
      place(p.node, x, y);
      p.scale = fitAnimal(p.art, p.spec, 0, 0, padW * 0.88, padH * 0.84);
    });

    var span = W * 0.9;
    var dgap = span / (BEATS_PER_LOOP - 1);
    var dr = Math.min(dgap * 0.3, botBar * 0.26, 15);
    for (var i2 = 0; i2 < BEATS_PER_LOOP; i2++) {
      J.dots[i2].setAttribute('cx', (-span / 2 + dgap * i2).toFixed(1));
      J.dots[i2].setAttribute('cy', 0);
      J.dots[i2].setAttribute('r', dr.toFixed(1));
    }
    place(J.dotG, W * 0.5, H - botBar * 0.5);

    var tb = Math.min(topBar * 0.8, 92);
    sizeButton(J.tuneBtn, tb * 1.5, tb);
    place(J.tuneBtn, W - tb * 0.9, topBar * 0.5);

    var sw = Math.min(W * 0.26, 260), sh = Math.min(H * 0.13, 150);
    var sy = H - botBar - sh * 0.78;
    sizeButton(J.stripLeft, sw, sh);
    sizeButton(J.stripRight, sw, sh);
    sizeButton(J.stripHome, sw * 0.7, sh);
    place(J.stripLeft, W * 0.2, sy);
    place(J.stripHome, W * 0.5, sy);
    place(J.stripRight, W * 0.8, sy);
    J.stripBack.setAttribute('x', W * 0.04);
    J.stripBack.setAttribute('y', sy - sh * 0.72);
    J.stripBack.setAttribute('width', W * 0.92);
    J.stripBack.setAttribute('height', sh * 1.44);
    J.stripBack.setAttribute('rx', sh * 0.5);
  }

  function showMode() {
    document.getElementById('tune').setAttribute('display', mode === 'tune' ? 'inline' : 'none');
    document.getElementById('jam').setAttribute('display', mode === 'jam' ? 'inline' : 'none');
  }

  var stripOpen = false;
  function setStrip(open) {
    stripOpen = open;
    J.strip.setAttribute('opacity', open ? 1 : 0);
    J.strip.setAttribute('pointer-events', open ? 'auto' : 'none');
  }

  // One note of whichever sound was just chosen, straight away, so the
  // press is answered before the beat comes round to answer it properly.
  function taste(p) {
    if (!AC || p.want < 0) { return; }
    var v = p.kit[p.want], lane = v.lanes[0];
    var midi = v.base === undefined ? 69 : pentMidi(v.base, 0);
    play(lane.t, midi, AC.currentTime + 0.02, 1);
  }

  // ------------------------------------------------------------------
  // Input. Buttons are press-and-hold as well as tap; cards tell a short
  // press from a long one.
  // ------------------------------------------------------------------
  var held = null, heldNode = null, repeatAt = 0, didRepeat = false, slideRate = 0;
  var pressPad = null;

  function doOnce(act) {
    if (act === 'bpm-') { setBpm(bpm - 5); }
    else if (act === 'bpm+') { setBpm(bpm + 5); }
    else if (act === 'nudge-') { nudge(-0.003); }
    else if (act === 'nudge+') { nudge(0.003); }
  }

  svg.addEventListener('pointerdown', function (ev) {
    initAudio();
    var t = ev.target;
    if (!t || !t.closest) { return; }

    var btn = t.closest('.btn');
    if (btn) {
      var act = btn.getAttribute('data-act');
      if (act === 'play') {
        mode = 'jam';
        setStrip(false);
        showMode();
      } else if (act === 'home') {
        mode = 'tune';
        setStrip(false);
        showMode();
      } else if (act === 'strip') {
        setStrip(!stripOpen);
      } else {
        held = act;
        heldNode = btn;
        repeatAt = performance.now() + 380;
        didRepeat = false;
        slideRate = 0;
        btn.setAttribute('opacity', 0.72);
      }
      return;
    }

    if (mode === 'jam') {
      var pn = t.closest('.pad');
      if (pn) {
        pressPad = byId[pn.getAttribute('data-id')];
        pressPad.pressT = 0;
      } else if (stripOpen) {
        // A tap anywhere off a pad puts the arrows away again.
        setStrip(false);
      }
    }
  });

  function release() {
    if (held) {
      if (!didRepeat) { doOnce(held); }
      if (heldNode) { heldNode.removeAttribute('opacity'); }
      held = null;
      heldNode = null;
    }
    if (pressPad) {
      var p = pressPad;
      pressPad = null;
      if (p.pressT < HOLD) {
        // A short press moves along the six, starting at the first.
        p.want = p.want < 0 ? 0 : (p.want + 1) % p.kit.length;
        p.pulse = 1;
        taste(p);
      }
      p.pressT = 0;
    }
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  function runHeld(nowMs, dt) {
    if (pressPad) {
      pressPad.pressT += dt;
      if (pressPad.pressT >= HOLD) {
        // Held long enough: the character goes quiet at the next beat.
        pressPad.want = -1;
        pressPad.pressT = 0;
        pressPad = null;
      }
    }
    if (!held) { return; }
    if (nowMs < repeatAt) { return; }
    didRepeat = true;
    if (held === 'nudge-' || held === 'nudge+') {
      // Holding accelerates. A tap is three milliseconds, which is fine
      // enough to sit exactly on the other device; holding gets you
      // across a big gap without a hundred taps.
      slideRate = Math.min(0.25, slideRate + dt * 0.22);
      nudge((held === 'nudge+' ? 1 : -1) * Math.max(0.03, slideRate) * dt);
    } else {
      repeatAt = nowMs + 130;
      doOnce(held);
    }
  }

  svg.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && AC && AC.state === 'suspended') { AC.resume(); }
  });

  // ------------------------------------------------------------------
  // Frame loop
  // ------------------------------------------------------------------
  function faceUpdate(o, dt) {
    var open = 0;
    o.mouthAge += dt;
    if (o.mouthT > 0) {
      var k = 1 - o.mouthAge / o.mouthT;
      open = k > 0 ? k : 0;
    }
    if (o.mouth) {
      var mx = +o.mouth.getAttribute('data-cx'), my = +o.mouth.getAttribute('data-cy');
      o.mouth.setAttribute('transform',
        'translate(' + mx + ',' + my + ') scale(1,' + (1 + open * 2.6).toFixed(3) + ') translate(' + (-mx) + ',' + (-my) + ')');
    }
    o.blink -= dt;
    if (o.blink <= 0) { o.blink = 2.5 + Math.random() * 5; o.blinkV = 0; }
    o.blinkV = Math.min(1, o.blinkV + dt * 7);
    if (o.eyes) {
      var ex = +o.eyes.getAttribute('data-cx'), ey = +o.eyes.getAttribute('data-cy');
      var bk = reduced ? 1 : clamp(o.blinkV, 0.08, 1);
      o.eyes.setAttribute('transform',
        'translate(' + ex + ',' + ey + ') scale(1,' + bk.toFixed(3) + ') translate(' + (-ex) + ',' + (-ey) + ')');
    }
    return open;
  }

  var condFace = { mouth: null, eyes: null, mouthT: 0, mouthAge: 99, blink: 3, blinkV: 1 };

  function updateTune(dt, beatPos) {
    var a = (-90 + beatPos * 360) * Math.PI / 180;
    T.orbit.setAttribute('cx', (Math.cos(a) * T.ringR).toFixed(1));
    T.orbit.setAttribute('cy', (Math.sin(a) * T.ringR).toFixed(1));
    T.pip.setAttribute('fill', beatFlash > 0.25 ? '#ffe9a0' : '#8ea0d8');
    T.pip.setAttribute('opacity', (0.45 + beatFlash * 0.55).toFixed(2));

    var hop = 0, squash = 1;
    if (!reduced) {
      var b = Math.sin(Math.PI * (1 - clamp(beatFlash, 0, 1)));
      hop = -b * 22;
      squash = 1 + b * 0.06;
    }
    T.condBob.setAttribute('transform',
      'translate(0,' + hop.toFixed(2) + ') scale(1,' + squash.toFixed(4) + ')');
    T.condGlow.setAttribute('opacity', (beatFlash * 0.5).toFixed(3));

    condFace.mouth = T.condBob.querySelector('.mouth');
    condFace.eyes = T.condEyes;
    if (beatFlash > 0.9) { condFace.mouthT = 0.12; condFace.mouthAge = 0; }
    faceUpdate(condFace, dt);
  }

  function updateJam(dt) {
    for (var i = 0; i < BEATS_PER_LOOP; i++) {
      var on = (i === beatIdx);
      J.dots[i].setAttribute('fill', on && beatFlash > 0.2 ? '#ffe9a0' : '#8ea0d8');
      J.dots[i].setAttribute('opacity', (0.3 + (on ? beatFlash * 0.7 : 0)).toFixed(2));
    }

    for (var k = 0; k < pads.length; k++) {
      var p = pads[k];
      p.bounceV = Math.max(0, p.bounceV - dt * 3.2);
      p.pulse = Math.max(0, p.pulse - dt * 2);
      p.idle += dt;

      var open = faceUpdate(p, dt);
      var armed = (p.want !== p.lit);
      var colour = p.lit >= 0 ? SOUND_COLOURS[p.lit] : 'rgba(255,255,255,0.1)';

      // While a press is being held the colour drains away, so a child
      // can see the character going quiet before it does.
      var drain = p.pressT > 0 ? clamp(p.pressT / HOLD, 0, 1) : 0;
      // Armed but not yet in: the card breathes until the beat comes
      // round, so a tap is visibly heard.
      var breathe = armed && !reduced ? (0.5 + 0.5 * Math.sin(p.idle * 6)) : (armed ? 1 : 0);

      p.card.setAttribute('fill', p.lit >= 0 ? '#33407a' : '#212a52');
      p.card.setAttribute('stroke', colour);
      p.card.setAttribute('stroke-width', ((p.lit >= 0 ? 9 : 3) + breathe * 6) * (1 - drain * 0.8));
      p.card.setAttribute('opacity', (0.72 + (p.lit >= 0 ? 0.28 : 0) + breathe * 0.2 - drain * 0.3).toFixed(2));

      var hop = 0, squash = 1;
      if (!reduced) {
        var b = Math.sin(Math.PI * (1 - p.bounceV));
        hop = -b * 26;
        squash = 1 + b * 0.07;
        if (p.lit < 0) { hop += Math.sin(p.idle * 1.4) * 3; }
      }
      p.bob.setAttribute('transform',
        'translate(0,' + hop.toFixed(2) + ') scale(1,' + squash.toFixed(4) + ')');
      p.art.setAttribute('opacity', ((p.lit >= 0 ? 1 : 0.42) - drain * 0.4).toFixed(2));
      p.glow.setAttribute('opacity', (Math.max(p.bounceV, open, p.pulse) * (p.lit >= 0 ? 0.55 : 0.3)).toFixed(3));
    }
  }

  var lastFrame = 0;
  function frame(now) {
    var dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0.016;
    lastFrame = now;

    runHeld(now, dt);
    if (AC) { drainVis(AC.currentTime); }
    beatFlash = Math.max(0, beatFlash - dt * 3.4);

    var s = curStep();
    var beatPos = (((s % STEPS_PER_BEAT) + STEPS_PER_BEAT) % STEPS_PER_BEAT) / STEPS_PER_BEAT;

    if (mode === 'tune') { updateTune(dt, beatPos); }
    else { updateJam(dt); }

    requestAnimationFrame(frame);
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(computeLayout, 120);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(computeLayout, 220);
  });

  buildTune();
  buildJam();
  computeLayout();
  showMode();
  setStrip(false);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
