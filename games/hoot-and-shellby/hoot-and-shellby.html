<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hoot &amp; Shellby</title>
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#2b2d5e;
    font-family:"Baloo 2","Comic Sans MS",Verdana,sans-serif;color:#3b2f2a;
    -webkit-user-select:none;user-select:none;touch-action:none;
  }
  canvas#game{display:block;width:100vw;height:100vh;cursor:none;}

  .hud{position:fixed;top:12px;right:12px;display:flex;gap:10px;z-index:5;}
  .hud button{
    width:56px;height:56px;border-radius:18px;cursor:pointer;
    border:3px solid rgba(255,255,255,.75);
    background:rgba(255,255,255,.32);
    font-size:24px;line-height:1;color:#3b2f2a;
    box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  .hud button:active{transform:translateY(3px);box-shadow:none;}

  #start{
    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;text-align:center;
    background:radial-gradient(circle at 50% 38%,#FFF7DF 0%,#FFDDA8 45%,#F6A57C 100%);
  }
  #start .pair{font-size:clamp(64px,16vw,150px);line-height:1;letter-spacing:.06em;
    filter:drop-shadow(0 8px 0 rgba(0,0,0,.08));animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  #start h1{margin:.2em 0 0;font-size:clamp(34px,7vw,64px);color:#5A3E2B;letter-spacing:.02em;}
  #start p{margin:.15em 0;font-size:clamp(15px,2.4vw,21px);color:#7A5B41;max-width:22em;}
  #playBtn{
    margin-top:18px;padding:18px 54px;font:inherit;font-size:clamp(22px,4vw,30px);
    border-radius:999px;border:4px solid #fff;background:#7BC96F;color:#fff;cursor:pointer;
    box-shadow:0 7px 0 #57a24c;letter-spacing:.03em;
  }
  #playBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #57a24c;}
  @media (prefers-reduced-motion:reduce){#start .pair{animation:none}}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <button id="soundBtn" title="Sound on or off" aria-label="Sound on or off">🔊</button>
  <button id="fsBtn" title="Full screen" aria-label="Full screen">⛶</button>
</div>

<div id="start">
  <div class="pair">🦉&nbsp;🐢</div>
  <h1>Hoot &amp; Shellby</h1>
  <p>Fly the owl with the <b>mouse</b> — or with the <b>arrow keys</b>. Either one on its own works.</p>
  <p>Pick up the fruit and carry it down to the turtle. Every treat grows a flower.</p>
  <p>Leave it alone and Hoot flies by himself, so there's always something to watch.</p>
  <button id="playBtn">Play</button>
</div>

<script>
(function(){
"use strict";

/* ============================== helpers ============================== */
const TAU = Math.PI * 2;
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const rand = (a,b)=> a + Math.random()*(b-a);
const choose = a => a[(Math.random()*a.length)|0];
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(c1,c2,t){
  const a=hex2rgb(c1), b=hex2rgb(c2);
  return 'rgb('+Math.round(lerp(a[0],b[0],t))+','+Math.round(lerp(a[1],b[1],t))+','+Math.round(lerp(a[2],b[2],t))+')';
}

/* ============================== audio ============================== */
const Sound = (function(){
  let ac=null, master, music, fx, on=true, timer=null, nextTime=0, step=0;
  const BPM=90, EIGHTH=60/BPM/2;
  // gentle C-major pentatonic music-box loop, 4 bars of 8 eighth notes
  const MEL=[
    79,null,76,null,72,null,74,null,
    81,null,79,null,76,null,null,74,
    72,null,74,null,76,null,79,null,
    81,null,79,  76,74,null,null,null
  ];
  const BASS=[48,45,41,43];               // C  Am  F  G
  const mtof = m => 440*Math.pow(2,(m-69)/12);

  function ensure(){
    if(ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    master = ac.createGain(); master.gain.value = on?0.9:0.0001; master.connect(ac.destination);
    music  = ac.createGain(); music.gain.value = 0.20; music.connect(master);
    fx     = ac.createGain(); fx.gain.value = 0.55;   fx.connect(master);
    // soft echo so everything sounds like a lullaby in a big room
    const dly = ac.createDelay(1.0); dly.delayTime.value = 0.29;
    const fb  = ac.createGain(); fb.gain.value = 0.26;
    const damp= ac.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2000;
    const wet = ac.createGain(); wet.gain.value = 0.32;
    dly.connect(damp); damp.connect(fb); fb.connect(dly);
    dly.connect(wet); wet.connect(master);
    music.connect(dly); fx.connect(dly);
    return ac;
  }
  function tone(freq,t,dur,type,g,dest){
    const o=ac.createOscillator(), gn=ac.createGain();
    o.type=type; o.frequency.value=freq;
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.linearRampToValueAtTime(g,t+0.02);
    gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn); gn.connect(dest);
    o.start(t); o.stop(t+dur+0.06);
  }
  function schedule(){
    while(nextTime < ac.currentTime + 0.25){
      const s = step % 32, bar = (s/8)|0, n = MEL[s];
      if(n != null){
        tone(mtof(n), nextTime, 1.2, 'triangle', 0.15, music);
        tone(mtof(n+12), nextTime, 0.5, 'sine', 0.045, music);
      }
      if(s%8===0) tone(mtof(BASS[bar]),   nextTime, 1.5, 'sine', 0.17, music);
      if(s%8===4) tone(mtof(BASS[bar]+7), nextTime, 0.9, 'sine', 0.09, music);
      nextTime += EIGHTH; step++;
    }
  }
  return {
    start(){
      ensure();
      if(ac.state === 'suspended') ac.resume();
      if(timer) return;
      nextTime = ac.currentTime + 0.15;
      timer = setInterval(schedule, 25);
    },
    toggle(){
      on = !on;
      if(ac) master.gain.setTargetAtTime(on?0.9:0.0001, ac.currentTime, 0.05);
      return on;
    },
    pickup(){ if(!ac)return; const t=ac.currentTime;
      tone(mtof(84),t,0.16,'triangle',0.16,fx); tone(mtof(88),t+0.06,0.22,'triangle',0.14,fx); },
    deliver(){ if(!ac)return; const t=ac.currentTime;
      [76,79,84].forEach((n,i)=>tone(mtof(n),t+i*0.07,0.5,'sine',0.16,fx)); },
    celebrate(){ if(!ac)return; const t=ac.currentTime;
      [72,76,79,84,88,91].forEach((n,i)=>tone(mtof(n),t+i*0.085,0.7,'triangle',0.15,fx)); },
    bloop(){ if(!ac)return; const t=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(190,t+0.16);
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.16,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
      o.connect(g); g.connect(fx); o.start(t); o.stop(t+0.32); },
    hoot(){ if(!ac)return; const t=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(430,t); o.frequency.exponentialRampToValueAtTime(320,t+0.2);
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.2,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
      o.connect(g); g.connect(fx); o.start(t); o.stop(t+0.5); }
  };
})();

/* ============================== canvas ============================== */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let W=0,H=0,DPR=1,groundY=0;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W*DPR); cvs.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  groundY = Math.round(H*0.80);
}
window.addEventListener('resize', resize);
resize();

/* ============================== world ============================== */
const stars=[], clouds=[], trees=[], grass=[], fireflies=[], flowers=[];
for(let i=0;i<100;i++) stars.push({x:Math.random(), y:Math.random()*0.62, r:rand(0.6,1.9), ph:rand(0,TAU)});
for(let i=0;i<6;i++)   clouds.push({x:Math.random(), y:rand(0.07,0.34), s:rand(0.7,1.4), v:rand(0.004,0.013)});
[[0.10,1.05],[0.27,0.72],[0.60,0.85],[0.86,1.15],[0.45,0.6]].forEach(t=>trees.push({x:t[0], s:t[1]}));
for(let i=0;i<80;i++)  grass.push({x:Math.random(), h:rand(6,17), ph:rand(0,TAU)});
for(let i=0;i<20;i++)  fireflies.push({x:Math.random(), y:rand(0.5,0.96), ph:rand(0,TAU), sp:rand(0.15,0.5)});

const ITEMS=[
  {n:'apple',  c:'#E4572E'},
  {n:'berry',  c:'#9B5DE5'},
  {n:'star',   c:'#FFD166'},
  {n:'flower', c:'#FF8FB1'},
  {n:'plum',   c:'#6C63FF'},
  {n:'leaf',   c:'#7BC96F'}
];
let items=[], gifts=[], parts=[];

const owl = {x:0,y:0,tx:0,ty:0,vx:0,vy:0,flap:0,blink:0,blinkT:rand(2,5),carry:null,perch:0,pop:0};
const tur = {x:0,y:0,dir:1,walk:0,happy:0,blink:0,blinkT:rand(2,5),wander:0,wanderT:0};
owl.x = owl.tx = W*0.5; owl.y = owl.ty = H*0.30;
tur.x = W*0.42; tur.y = groundY; tur.wander = W*0.5;

let time=0, lastInput=0, passive=true, delivered=0, rainbow=0, badge=0, spawnT=1.0, started=false;
const IDLE = 14;                                  // seconds before watching mode
const keys = Object.create(null);

/* ============================== input ============================== */
function poke(){ lastInput = time; }
window.addEventListener('pointermove', e=>{
  if(!started) return;
  owl.tx = e.clientX; owl.ty = e.clientY; poke();
}, {passive:true});
window.addEventListener('pointerdown', e=>{
  if(!started) return;
  owl.tx = e.clientX; owl.ty = e.clientY; poke(); hoot();
});
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].indexOf(k)>=0) e.preventDefault();
  if(!started) return;
  keys[k]=true; poke();
  if(k===' ') hoot();
  if(k==='m') toggleSound();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

function hoot(){
  owl.pop = 1; Sound.hoot();
  for(let i=0;i<6;i++) parts.push({type:'heart', x:owl.x+rand(-14,14), y:owl.y-10,
    vx:rand(-26,26), vy:rand(-70,-40), life:0, max:rand(1.1,1.7), s:rand(0.8,1.5),
    c:choose(['#FF8FB1','#FFC2D6','#FFE0A3'])});
}

/* ============================== items ============================== */
function spawnItem(){
  if(items.length>=6) return;
  const t = choose(trees);
  const x = clamp(t.x*W + rand(-46,46), 40, W-40);
  const y = groundY - 150*t.s + rand(-30,20);
  items.push({x:x, y:y, vx:rand(-13,13), vy:rand(-7,7), ph:rand(0,TAU),
              t:choose(ITEMS), age:0, life:rand(18,28), scale:0});
  for(let i=0;i<5;i++) parts.push({type:'spark', x:x, y:y, vx:rand(-40,40), vy:rand(-40,40),
    life:0, max:0.5, s:rand(1.5,3), c:'#FFF6D6'});
}

function burst(x,y,n,colors,type){
  const heart = (type==='heart');
  for(let i=0;i<n;i++){
    const a=rand(0,TAU), sp=rand(40,150);
    parts.push({type:type||'spark', x:x, y:y,
      vx:Math.cos(a)*sp*(heart?0.5:1),
      vy: heart ? -rand(35,90) : Math.sin(a)*sp-30,
      life:0, max:rand(0.6,1.4), s: heart ? rand(0.7,1.4) : rand(1.6,3.6),
      c:choose(colors)});
  }
}

/* ============================== update ============================== */
function aiOwl(dt){
  if(owl.perch>0){                                  // sitting on the shell
    owl.perch -= dt;
    owl.tx = tur.x; owl.ty = tur.y - 84;
    return;
  }
  if(owl.carry){ owl.tx = tur.x; owl.ty = tur.y - 118; return; }
  let best=null, bd=1e9;
  for(const it of items){
    const d = Math.hypot(it.x-owl.x, it.y-owl.y);
    if(d<bd){ bd=d; best=it; }
  }
  if(best){ owl.tx = best.x; owl.ty = best.y; }
  else{
    owl.tx = W*(0.5 + 0.34*Math.sin(time*0.33));
    owl.ty = H*(0.30 + 0.13*Math.sin(time*0.51+1.2));
  }
}

function update(dt){
  time += dt;
  passive = (time - lastInput) > IDLE;

  // ---- owl steering ----
  if(passive){ aiOwl(dt); }
  else{
    const kx = (keys['arrowright']||keys['d']?1:0) - (keys['arrowleft']||keys['a']?1:0);
    const ky = (keys['arrowdown']||keys['s']?1:0) - (keys['arrowup']||keys['w']?1:0);
    if(kx||ky){
      const sp = 430*dt;
      owl.tx += kx*sp; owl.ty += ky*sp;
    }
  }
  owl.tx = clamp(owl.tx, 34, W-34);
  owl.ty = clamp(owl.ty, 46, groundY-16);

  const stiff=60, damping=12;
  owl.vx += ((owl.tx-owl.x)*stiff - owl.vx*damping)*dt;
  owl.vy += ((owl.ty-owl.y)*stiff - owl.vy*damping)*dt;
  owl.x += owl.vx*dt; owl.y += owl.vy*dt;
  const speed = Math.hypot(owl.vx, owl.vy);
  owl.flap += (5 + Math.min(13, speed/38))*dt;
  owl.pop = Math.max(0, owl.pop - dt*2.6);

  owl.blinkT -= dt;
  if(owl.blinkT<=0){ owl.blink=0.16; owl.blinkT=rand(2.5,6); }
  owl.blink = Math.max(0, owl.blink-dt);

  // ---- items ----
  spawnT -= dt;
  if(spawnT<=0){ spawnItem(); spawnT = rand(1.6,3.2); }
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.age += dt; it.ph += dt*1.6;
    it.scale = Math.min(1, it.scale + dt*3);
    it.x += it.vx*dt; it.y += it.vy*dt + Math.sin(it.ph)*6*dt;
    if(it.x<50 || it.x>W-50) it.vx *= -1;
    if(it.y<70 || it.y>groundY-90) it.vy *= -1;
    it.x = clamp(it.x,50,W-50); it.y = clamp(it.y,70,groundY-90);
    if(it.age>it.life){ it.scale -= dt*1.6; if(it.scale<=0){ items.splice(i,1); continue; } }
    if(!owl.carry && owl.perch<=0 && Math.hypot(it.x-owl.x, it.y-owl.y)<40){
      owl.carry = it.t; items.splice(i,1);
      Sound.pickup();
      burst(it.x,it.y,10,['#FFF3C4','#FFD166',it.t.c]);
    }
  }

  // ---- delivery ----
  if(owl.carry && Math.hypot(tur.x-owl.x,(tur.y-70)-owl.y)<98){
    gifts.push({x:owl.x, y:owl.y, sx:owl.x, sy:owl.y, ex:tur.x, ey:tur.y-46, t:0, type:owl.carry});
    owl.carry = null;
  }
  for(let i=gifts.length-1;i>=0;i--){
    const g=gifts[i]; g.t += dt*1.7;
    g.ex = tur.x; g.ey = tur.y-46;
    const t=Math.min(1,g.t);
    g.x = lerp(g.sx,g.ex,t);
    g.y = lerp(g.sy,g.ey,t) - Math.sin(t*Math.PI)*60;
    if(t>=1){
      gifts.splice(i,1);
      delivered++;
      tur.happy = 1;
      Sound.deliver(); Sound.bloop();
      burst(tur.x, tur.y-52, 12, ['#FFF3C4','#FF8FB1','#FFD166'], 'heart');
      flowers.push({x:clamp(tur.x + rand(-60,60),20,W-20)/W, c:choose(['#FF8FB1','#FFD166','#C77DFF','#7BE3C9','#FF9F6E']),
                    g:0, ph:rand(0,TAU)});
      if(flowers.length>26) flowers.shift();
      if(delivered % 5 === 0){
        rainbow = 3.0; Sound.celebrate();
        burst(tur.x, tur.y-90, 26, ['#FF8FB1','#FFD166','#7BE3C9','#9B5DE5','#FFF3C4']);
      }
      if(passive && Math.random()<0.35) owl.perch = rand(4,7);
    }
  }

  // ---- turtle ----
  tur.wanderT -= dt;
  if(tur.wanderT<=0){ tur.wander = rand(W*0.15, W*0.85); tur.wanderT = rand(3.5,7); }
  const want = (owl.carry ? owl.x : tur.wander);
  const dx = want - tur.x;
  if(Math.abs(dx)>16 && owl.perch<=0){
    const sp = (owl.carry?86:52)*dt;
    tur.x += Math.sign(dx)*Math.min(sp, Math.abs(dx));
    tur.dir = Math.sign(dx);
    tur.walk += dt*7;
  }
  tur.x = clamp(tur.x, 60, W-60);
  tur.y = groundY;
  tur.happy = Math.max(0, tur.happy - dt*1.1);
  tur.blinkT -= dt;
  if(tur.blinkT<=0){ tur.blink=0.16; tur.blinkT=rand(3,7); }
  tur.blink = Math.max(0, tur.blink-dt);

  // ---- particles / misc ----
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life+=dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += (p.type==='heart'? -22 : 90)*dt;
    p.vx *= 0.99;
    if(p.life>=p.max) parts.splice(i,1);
  }
  rainbow = Math.max(0, rainbow-dt);
  badge = passive ? Math.min(1, badge + dt*1.2) : Math.max(0, badge - dt*2);
}

/* ============================== drawing ============================== */
function skyAt(p){
  const K=[
    {t:0.00, top:'#7EC8F2', bot:'#DFF3FF', s:0.00},
    {t:0.40, top:'#F2A172', bot:'#FFDCA8', s:0.08},
    {t:0.56, top:'#6E5AA8', bot:'#F3A7BC', s:0.45},
    {t:0.72, top:'#232A63', bot:'#4C4A8C', s:1.00},
    {t:0.92, top:'#3E5A9E', bot:'#F7C5D8', s:0.30},
    {t:1.00, top:'#7EC8F2', bot:'#DFF3FF', s:0.00}
  ];
  let i=0; while(i<K.length-2 && p>K[i+1].t) i++;
  const a=K[i], b=K[i+1], t=clamp((p-a.t)/(b.t-a.t),0,1);
  return {top:mix(a.top,b.top,t), bot:mix(a.bot,b.bot,t), night:lerp(a.s,b.s,t)};
}

function star5(x,y,r,inner){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr = i%2 ? r*inner : r, a = -Math.PI/2 + i*Math.PI/5;
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function heartPath(){
  ctx.beginPath();
  ctx.moveTo(0,4.5);
  ctx.bezierCurveTo(-6.5,-1.5,-4.5,-8.5,0,-4.5);
  ctx.bezierCurveTo(4.5,-8.5,6.5,-1.5,0,4.5);
  ctx.closePath();
}
function ell(x,y,rx,ry,rot){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,TAU); ctx.fill(); }

function drawItem(x,y,type,sc,night){
  ctx.save(); ctx.translate(x,y); ctx.scale(sc,sc);
  const c = type.c;
  ctx.fillStyle = mix(c, '#2A2B54', night*0.35);
  switch(type.n){
    case 'star': star5(0,0,13,0.45); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)'; star5(-2,-2,5,0.45); ctx.fill(); break;
    case 'leaf':
      ctx.beginPath(); ctx.ellipse(0,0,13,7,-0.5,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-9,5); ctx.lineTo(9,-5); ctx.stroke(); break;
    case 'flower':
      for(let i=0;i<5;i++){ const a=i*TAU/5;
        ell(Math.cos(a)*8, Math.sin(a)*8, 6.5, 6.5); }
      ctx.fillStyle='#FFE28A'; ell(0,0,5,5); break;
    case 'berry':
      ell(-5,1,7,7); ell(5,2,6.5,6.5); ell(0,-5,6.5,6.5);
      ctx.fillStyle='rgba(255,255,255,.4)'; ell(-6,-1,2,2); break;
    default: // apple / plum
      ell(0,1,11,11.5);
      ctx.fillStyle='rgba(255,255,255,.35)'; ell(-4,-4,3.2,4,0.5);
      ctx.strokeStyle='#7A4A2B'; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.moveTo(0,-9); ctx.quadraticCurveTo(2,-15,6,-15); ctx.stroke();
      ctx.fillStyle='#7BC96F'; ell(10,-15,5,3,-0.4);
  }
  ctx.restore();
}

function drawOwl(night){
  const s = 1 + owl.pop*0.12;
  const bodyC = mix('#B98A62','#2A2B54',night*0.45);
  const bellyC= mix('#F6E3C3','#2A2B54',night*0.35);
  const wingC = mix('#9E6F4C','#2A2B54',night*0.45);
  const tuftC = mix('#A87B55','#2A2B54',night*0.45);

  // ground shadow
  const h = clamp((groundY-owl.y)/(groundY*0.7),0,1);
  ctx.fillStyle = 'rgba(40,30,60,'+(0.20*(1-h)+0.05)+')';
  ell(owl.x, groundY+8, 30*(1-h*0.45), 8*(1-h*0.45));

  ctx.save(); ctx.translate(owl.x, owl.y); ctx.scale(s,s);
  const flap = Math.sin(owl.flap)*0.85;
  const tilt = clamp(owl.vx/900,-0.25,0.25);
  ctx.rotate(tilt);

  // wings behind
  ctx.fillStyle = wingC;
  ctx.save(); ctx.translate(-22,-4); ctx.rotate(-0.5+flap); ell(0,0,15,8); ctx.restore();
  ctx.save(); ctx.translate( 22,-4); ctx.rotate( 0.5-flap); ell(0,0,15,8); ctx.restore();

  // tufts
  ctx.fillStyle = tuftC;
  ctx.beginPath(); ctx.moveTo(-19,-20); ctx.lineTo(-8,-33); ctx.lineTo(-4,-19); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo( 19,-20); ctx.lineTo( 8,-33); ctx.lineTo( 4,-19); ctx.closePath(); ctx.fill();

  // body + belly
  ctx.fillStyle = bodyC; ell(0,0,25,29);
  ctx.fillStyle = bellyC; ell(0,7,17,20);

  // feet
  ctx.fillStyle = mix('#F2A65A','#2A2B54',night*0.4);
  ell(-8,27,5,3.5); ell(8,27,5,3.5);

  // face
  const look = clamp((owl.tx-owl.x)/60,-1,1), lookY = clamp((owl.ty-owl.y)/60,-1,1);
  ctx.fillStyle = '#FFFDF6'; ell(-10,-8,11,11.5); ell(10,-8,11,11.5);
  if(owl.blink>0){
    ctx.strokeStyle='#3B2A1E'; ctx.lineWidth=2.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-18,-8); ctx.quadraticCurveTo(-10,-3,-2,-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( 2,-8); ctx.quadraticCurveTo( 10,-3, 18,-8); ctx.stroke();
  }else{
    ctx.fillStyle = '#3B2A1E';
    ell(-10+look*3, -8+lookY*3, 5.2, 5.6);
    ell( 10+look*3, -8+lookY*3, 5.2, 5.6);
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ell(-12+look*3, -10+lookY*3, 1.8, 1.8);
    ell(  8+look*3, -10+lookY*3, 1.8, 1.8);
  }
  // beak
  ctx.fillStyle = '#F2A65A';
  ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(-5,3); ctx.lineTo(5,3); ctx.closePath(); ctx.fill();
  // cheeks
  ctx.fillStyle='rgba(255,143,177,.35)'; ell(-18,2,5,3.5); ell(18,2,5,3.5);
  ctx.restore();

  if(owl.carry) drawItem(owl.x, owl.y+34*s, owl.carry, 0.85*s, night);
  if(owl.perch>0){                                   // sleepy z's while perched
    for(let i=0;i<3;i++){
      const t=(time*0.7+i*0.33)%1;
      ctx.save(); ctx.globalAlpha=(1-t)*0.8; ctx.fillStyle='#FFFDF6';
      ctx.font='bold '+(12+i*4)+'px sans-serif';
      ctx.fillText('z', owl.x+24+t*18, owl.y-26-t*34);
      ctx.restore();
    }
  }
}

function drawTurtle(night){
  const shellC = mix('#5FA354','#2A2B54',night*0.45);
  const shellD = mix('#487F41','#2A2B54',night*0.45);
  const skinC  = mix('#A8D98B','#2A2B54',night*0.42);
  const bounce = Math.sin(tur.happy*Math.PI)*10;
  const step   = Math.sin(tur.walk)*3;

  ctx.fillStyle='rgba(40,30,60,.22)'; ell(tur.x, groundY+6, 40, 9);

  ctx.save(); ctx.translate(tur.x, tur.y-bounce);
  ctx.scale(tur.dir, 1);

  // legs
  ctx.fillStyle = skinC;
  ell(-20, -8+step, 10, 8); ell(20, -8-step, 10, 8);
  // tail
  ctx.beginPath(); ctx.moveTo(-30,-22); ctx.lineTo(-42,-16); ctx.lineTo(-30,-12); ctx.closePath(); ctx.fill();

  // head
  const lookUp = (owl.y < tur.y-120) ? -4 : 0;
  ctx.save(); ctx.translate(30, -26+lookUp);
  ctx.fillStyle = skinC; ell(0,0,14,13);
  ctx.fillStyle='rgba(255,143,177,.35)'; ell(-6,5,4.5,3);
  if(tur.blink>0){
    ctx.strokeStyle='#31402B'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(2,-4); ctx.quadraticCurveTo(6,0,10,-4); ctx.stroke();
  }else{
    ctx.fillStyle='#FFFDF6'; ell(6,-4,5.5,6);
    ctx.fillStyle='#31402B'; ell(7.5,-4+lookUp*0.3,3,3.4);
    ctx.fillStyle='rgba(255,255,255,.9)'; ell(6.6,-5.4,1.2,1.2);
  }
  ctx.strokeStyle='#31402B'; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath();
  if(tur.happy>0.05) ctx.arc(6,4,5,0.15*Math.PI,0.85*Math.PI);
  else { ctx.moveTo(3,5); ctx.quadraticCurveTo(7,7.5,11,5); }
  ctx.stroke();
  ctx.restore();

  // shell
  ctx.fillStyle = shellC;
  ctx.beginPath(); ctx.ellipse(0,-18,36,30,0,Math.PI,TAU); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shellD;
  ctx.beginPath(); ctx.ellipse(0,-18,36,7,0,0,Math.PI); ctx.fill();
  ctx.strokeStyle = shellD; ctx.lineWidth=2.4;
  for(let i=1;i<4;i++){
    const a = Math.PI + i*Math.PI/4;
    ctx.beginPath(); ctx.moveTo(0,-18);
    ctx.lineTo(Math.cos(a)*36, -18+Math.sin(a)*30); ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(0,-18,19,16,0,Math.PI,TAU); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.ellipse(-13,-31,9,5,-0.5,0,TAU); ctx.fill();
  ctx.restore();
}

function draw(){
  const cyc = (time/200) % 1;                       // full day in ~3m20s
  const sky = skyAt(cyc), night = sky.night;

  // sky
  const g = ctx.createLinearGradient(0,0,0,groundY+40);
  g.addColorStop(0, sky.top); g.addColorStop(1, sky.bot);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // stars
  if(night>0.02){
    for(const s of stars){
      ctx.globalAlpha = night * (0.45+0.55*Math.abs(Math.sin(time*0.8+s.ph)));
      ctx.fillStyle='#FFF8E0';
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // sun or moon
  if(cyc<0.56){
    const p=cyc/0.56, x=W*(0.08+0.84*p), y=groundY-Math.sin(Math.PI*p)*H*0.62;
    ctx.globalAlpha = clamp(Math.sin(Math.PI*p)*2.2,0,1);
    ctx.fillStyle='rgba(255,246,205,.30)'; ctx.beginPath(); ctx.arc(x,y,54,0,TAU); ctx.fill();
    ctx.fillStyle='#FFF2B8'; ctx.beginPath(); ctx.arc(x,y,30,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
  }else{
    const p=(cyc-0.56)/0.44, x=W*(0.08+0.84*p), y=groundY-Math.sin(Math.PI*p)*H*0.58;
    ctx.globalAlpha = clamp(Math.sin(Math.PI*p)*2.2,0,1);
    ctx.fillStyle='rgba(255,255,225,.22)'; ctx.beginPath(); ctx.arc(x,y,48,0,TAU); ctx.fill();
    ctx.fillStyle='#FFFBEA'; ctx.beginPath(); ctx.arc(x,y,26,0,TAU); ctx.fill();
    ctx.fillStyle=sky.top; ctx.beginPath(); ctx.arc(x+11,y-6,23,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
  }

  // clouds
  for(const c of clouds){
    c.x += c.v*0.016; if(c.x>1.2) c.x=-0.25;
    const x=c.x*W, y=c.y*H, s=c.s;
    ctx.fillStyle = mix('#FFFFFF','#3A3B6B', night*0.55);
    ctx.globalAlpha = 0.85;
    ell(x, y, 46*s, 22*s); ell(x-34*s, y+6*s, 28*s, 15*s); ell(x+32*s, y+7*s, 25*s, 14*s);
    ctx.globalAlpha = 1;
  }

  // far hills
  ctx.fillStyle = mix('#8FCB7E','#2A2B54', night*0.55);
  ctx.beginPath(); ctx.moveTo(0,groundY);
  ctx.quadraticCurveTo(W*0.18, groundY-120, W*0.42, groundY-30);
  ctx.quadraticCurveTo(W*0.62, groundY-110, W*0.85, groundY-40);
  ctx.quadraticCurveTo(W*0.95, groundY-70, W, groundY-20);
  ctx.lineTo(W,groundY+300); ctx.lineTo(0,groundY+300); ctx.closePath(); ctx.fill();

  // trees
  for(const t of trees){
    const x=t.x*W, s=t.s, base=groundY+6;
    ctx.fillStyle = mix('#8A5A3B','#2A2B54', night*0.5);
    ctx.fillRect(x-6*s, base-90*s, 12*s, 92*s);
    ctx.fillStyle = mix('#5EAE55','#2A2B54', night*0.5);
    ell(x, base-118*s, 46*s, 38*s);
    ell(x-34*s, base-98*s, 32*s, 27*s);
    ell(x+34*s, base-100*s, 30*s, 26*s);
    ctx.fillStyle = mix('#79C96B','#2A2B54', night*0.5);
    ell(x-10*s, base-134*s, 28*s, 20*s);
  }

  // ground
  ctx.fillStyle = mix('#7FC46B','#2A2B54', night*0.55);
  ctx.beginPath(); ctx.moveTo(0,groundY+4);
  ctx.quadraticCurveTo(W*0.5, groundY-16, W, groundY+4);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = mix('#6BB259','#2A2B54', night*0.55);
  ctx.fillRect(0, groundY+34, W, H);

  // grass
  ctx.strokeStyle = mix('#559945','#2A2B54', night*0.5); ctx.lineWidth=2.4; ctx.lineCap='round';
  for(const b of grass){
    const x=b.x*W, sway=Math.sin(time*1.1+b.ph)*3;
    ctx.beginPath(); ctx.moveTo(x, groundY+12);
    ctx.quadraticCurveTo(x+sway, groundY+12-b.h*0.6, x+sway*2, groundY+12-b.h); ctx.stroke();
  }

  // flowers grown from treats
  for(const f of flowers){
    f.g = Math.min(1, f.g + 0.02);
    const x=f.x*W, y=groundY+16, hgt=26*f.g, sway=Math.sin(time*1.3+f.ph)*3;
    ctx.strokeStyle = mix('#4E9440','#2A2B54', night*0.5); ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+sway, y-hgt*0.6, x+sway*1.6, y-hgt); ctx.stroke();
    ctx.save(); ctx.translate(x+sway*1.6, y-hgt); ctx.scale(f.g,f.g);
    ctx.fillStyle = mix(f.c,'#2A2B54', night*0.35);
    for(let i=0;i<5;i++){ const a=i*TAU/5 + time*0.2; ell(Math.cos(a)*6.5, Math.sin(a)*6.5, 5.5, 5.5); }
    ctx.fillStyle = mix('#FFE28A','#2A2B54', night*0.3); ell(0,0,4.2,4.2);
    ctx.restore();
  }

  // fireflies at dusk
  if(night>0.15){
    for(const f of fireflies){
      const x=(f.x + Math.sin(time*f.sp+f.ph)*0.03)*W;
      const y=(f.y + Math.cos(time*f.sp*0.8+f.ph)*0.02)*H;
      const a = night*(0.35+0.65*Math.abs(Math.sin(time*2+f.ph)));
      ctx.globalAlpha=a*0.35; ctx.fillStyle='#FFF3A0';
      ctx.beginPath(); ctx.arc(x,y,7,0,TAU); ctx.fill();
      ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(x,y,2.2,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // rainbow celebration
  if(rainbow>0){
    const a = Math.min(1, rainbow/1.2)*0.55;
    const cols=['#FF8FB1','#FFB86B','#FFE07A','#8FE388','#7BD5F5','#B79CFF'];
    ctx.save(); ctx.globalAlpha=a; ctx.lineWidth=14; ctx.lineCap='butt';
    cols.forEach((c,i)=>{ ctx.strokeStyle=c;
      ctx.beginPath(); ctx.arc(tur.x, groundY+40, 150+i*14, Math.PI, TAU); ctx.stroke(); });
    ctx.restore();
  }

  // items, gifts, characters
  for(const it of items) drawItem(it.x, it.y + Math.sin(it.ph)*4, it.t, it.scale, night);
  for(const g of gifts)  drawItem(g.x, g.y, g.type, 0.85, night);
  drawTurtle(night);
  drawOwl(night);

  // particles
  for(const p of parts){
    const a = 1 - p.life/p.max;
    if(p.type==='heart'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.scale(p.s,p.s); ctx.globalAlpha=a;
      ctx.fillStyle=p.c; heartPath(); ctx.fill(); ctx.restore();
    }else{
      ctx.globalAlpha=a; ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  // watching-mode note for the grown-ups
  if(badge>0.01){
    ctx.save(); ctx.globalAlpha = badge*0.85;
    const txt='Watching mode — move the mouse or press an arrow key to fly';
    ctx.font='16px "Baloo 2", Verdana, sans-serif'; ctx.textAlign='center';
    const w = ctx.measureText(txt).width + 34;
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.roundRect((W-w)/2, H-52, w, 34, 17); ctx.fill();
    ctx.fillStyle='#4A3A2C'; ctx.fillText(txt, W/2, H-29);
    ctx.restore();
  }
}

/* ============================== loop ============================== */
let last=0;
function frame(ts){
  const t = ts/1000;
  let dt = last ? t-last : 0.016;
  last = t;
  dt = Math.min(dt, 0.05);
  if(started) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================== ui ============================== */
const startEl = document.getElementById('start');
document.getElementById('playBtn').addEventListener('click', ()=>{
  startEl.style.display='none';
  started = true;
  lastInput = time;                                  // give the child a turn first
  Sound.start();
});
function toggleSound(){
  const on = Sound.toggle();
  document.getElementById('soundBtn').textContent = on ? '🔊' : '🔈';
}
document.getElementById('soundBtn').addEventListener('click', e=>{ e.stopPropagation(); toggleSound(); });
document.getElementById('fsBtn').addEventListener('click', e=>{
  e.stopPropagation();
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});

// roundRect fallback for older browsers
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this;
  };
}
})();
