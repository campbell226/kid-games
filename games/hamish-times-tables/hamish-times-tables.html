<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamish the Highland Coo — Times Tables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7FB0D4; --sky-bot:#D6E9F2;
    --hill-far:#8FAE9C; --hill-mid:#5C8C6A; --grass:#5FA155; --grass-dk:#3F7145;
    --heather:#8E6BA8; --heather-lt:#C9A5DC;
    --cow:#D9782F; --cow-lt:#F0A257; --cow-dk:#A9531C; --cow-shag:#C1631F;
    --horn:#F4E8CD; --horn-dk:#BFA87C;
    --panel:#FFF6E4; --panel-2:#FFEFD2; --ink:#3B2A20; --ink-soft:#7A6252;
    --b1:#4E9C55; --b2:#3E86B5; --b3:#8E6BA8; --b4:#C7466B;
    --gold:#F4B740;
    --shadow:0 6px 0 rgba(59,42,32,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{height:100%;margin:0}
  body{
    font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;
    color:var(--ink);
    background:#3F7145;
    overflow:hidden;
    user-select:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
  button:focus-visible{outline:4px solid #fff;outline-offset:3px}

  #app{
    height:100vh;height:100dvh;
    display:flex;flex-direction:column;
    background:var(--panel);
  }

  /* ---------- top bar ---------- */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:.5rem;
    padding:calc(.5rem + env(safe-area-inset-top)) .7rem .5rem;
    background:linear-gradient(#fff8ea,#ffefd2);
    box-shadow:0 3px 0 rgba(59,42,32,.12);z-index:5;
  }
  .chip{
    display:flex;align-items:baseline;gap:.35rem;
    padding:.3rem .75rem;border-radius:999px;background:#fff;
    box-shadow:inset 0 0 0 3px rgba(59,42,32,.1);
    font-weight:900;font-size:clamp(1rem,4.2vw,1.35rem);
  }
  .chip .num{font-family:'Baloo 2',system-ui;font-size:clamp(1.3rem,5.5vw,1.7rem);line-height:1}
  .chip .lbl{font-size:.72rem;text-transform:lowercase;letter-spacing:.02em;color:var(--ink-soft);font-weight:800}
  .chip-score .num{color:var(--b1)}
  .chip-streak .num{color:#8E6BA8}
  .chip svg{width:1.1em;height:1.1em;align-self:center}
  .spacer{flex:1}
  .icon-btn{
    width:2.6rem;height:2.6rem;border-radius:50%;background:#fff;
    box-shadow:inset 0 0 0 3px rgba(59,42,32,.1);
    display:grid;place-items:center;color:var(--ink);
  }
  .icon-btn svg{width:1.4rem;height:1.4rem}
  .icon-btn:active{transform:translateY(2px)}

  /* ---------- stage ---------- */
  .stage{
    flex:1 1 auto;position:relative;min-height:0;
    display:flex;align-items:stretch;
  }
  .scene{position:absolute;inset:0;width:100%;height:100%}
  .scene svg{width:100%;height:100%;display:block}

  .bubble{
    position:absolute;right:2.5%;top:6%;width:min(46%,300px);
    background:#fff;border-radius:26px;padding:.7rem .9rem 1rem;
    box-shadow:0 5px 0 rgba(59,42,32,.18);
    text-align:center;z-index:3;
  }
  .bubble::after{
    content:"";position:absolute;left:-16px;top:46%;
    border:14px solid transparent;border-right-color:#fff;border-left:0;
    filter:drop-shadow(-3px 3px 0 rgba(59,42,32,.06));
  }
  .prompt{
    margin:0;font-family:'Baloo 2',system-ui;font-weight:800;
    font-size:clamp(2rem,9vw,3.2rem);line-height:1.05;letter-spacing:.01em;
  }
  .prompt .times{color:#8E6BA8}
  .hint{margin:.15rem 0 0;font-size:clamp(.8rem,3.4vw,1rem);color:var(--ink-soft);font-weight:800;min-height:1.2em}
  .hint.praise{font-size:clamp(1.05rem,4.6vw,1.45rem);color:#3F7145;font-weight:900;font-family:'Baloo 2',system-ui}
  .hint.big{color:#8E6BA8;font-size:clamp(1.25rem,5.4vw,1.7rem)}
  .help-btn{
    margin-top:.5rem;padding:.35rem .9rem;border-radius:999px;
    background:var(--panel-2);color:var(--ink-soft);font-weight:900;font-size:.85rem;
    box-shadow:inset 0 0 0 3px rgba(59,42,32,.08);
  }
  .dots{display:flex;flex-direction:column;gap:.3rem;align-items:center;margin-top:.55rem}
  .dots .row{display:flex;gap:.3rem;padding:.22rem;border-radius:999px;background:var(--panel-2)}
  .dots i{width:clamp(9px,2.6vw,14px);height:clamp(9px,2.6vw,14px);border-radius:50%;background:#8E6BA8;display:block}

  /* ---------- answers ---------- */
  .answers{
    flex:0 0 auto;padding:.6rem .6rem calc(.7rem + env(safe-area-inset-bottom));
    background:linear-gradient(#ffefd2,#ffe3b6);
    box-shadow:0 -3px 0 rgba(59,42,32,.12);z-index:4;
  }
  .bands{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem}
  .band{
    padding:.85rem .4rem;border-radius:20px;color:#fff;
    font-family:'Baloo 2',system-ui;font-weight:800;
    font-size:clamp(1.4rem,6.5vw,2rem);box-shadow:var(--shadow);
  }
  .band small{display:block;font-family:'Nunito';font-size:.6rem;font-weight:900;opacity:.85;letter-spacing:.08em;text-transform:uppercase}
  .band:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(59,42,32,.22)}
  .band.b1{background:var(--b1)} .band.b2{background:var(--b2)}
  .band.b3{background:var(--b3)} .band.b4{background:var(--b4)}

  .numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:.45rem}
  .numbers .back{
    grid-column:1 / -1;justify-self:start;
    padding:.3rem .9rem .3rem .6rem;border-radius:999px;background:#fff;
    font-weight:900;color:var(--ink-soft);display:flex;align-items:center;gap:.3rem;
    box-shadow:inset 0 0 0 3px rgba(59,42,32,.1);font-size:.9rem;
  }
  .tile{
    aspect-ratio:1/1;border-radius:18px;color:#fff;background:var(--tile,#666);
    font-family:'Baloo 2',system-ui;font-weight:800;
    font-size:clamp(1.2rem,6vw,2rem);box-shadow:var(--shadow);
    display:grid;place-items:center;transition:transform .12s,opacity .3s;
  }
  .tile:active{transform:translateY(4px)}
  .tile.gone{opacity:.28;transform:scale(.86);pointer-events:none}
  .tile.nudge{animation:wobble .45s}
  .tile.glow{animation:glow 1.1s infinite}
  .band.nudge{animation:wobble .45s}
  @keyframes wobble{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-3deg)}45%{transform:translateX(7px) rotate(3deg)}70%{transform:translateX(-4px)}}
  @keyframes glow{0%,100%{box-shadow:var(--shadow),0 0 0 0 rgba(244,183,64,.9)}50%{box-shadow:var(--shadow),0 0 0 12px rgba(244,183,64,0)}}

  /* ---------- cow motion ---------- */
  #cow{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.2s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translateY(0) rotate(-.8deg)}50%{transform:translateY(-4px) rotate(.8deg)}}
  #cow.jump{animation:hop .85s cubic-bezier(.3,1.5,.5,1)}
  @keyframes hop{0%{transform:translateY(0) scale(1,1)}18%{transform:translateY(4px) scale(1.08,.9)}45%{transform:translateY(-40px) scale(.94,1.1)}75%{transform:translateY(2px) scale(1.06,.94)}100%{transform:translateY(0) scale(1,1)}}
  #cow.shake{animation:cowshake .6s}
  @keyframes cowshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 6.5s infinite}
  @keyframes blink{0%,96%,100%{transform:scaleY(0)}98%{transform:scaleY(1)}}
  #tail{transform-box:fill-box;transform-origin:100% 0;animation:swish 3.4s ease-in-out infinite}
  @keyframes swish{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  #muzzle{transform-box:fill-box;transform-origin:50% 30%;animation:chew 2.6s ease-in-out infinite}
  @keyframes chew{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94) translateY(1px)}}
  .cloud{animation:drift 60s linear infinite}
  .cloud.c2{animation-duration:88s;animation-delay:-30s}
  @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(460px)}}
  .bloom{transform-box:fill-box;transform-origin:50% 100%;animation:sprout .6s cubic-bezier(.2,1.6,.4,1)}
  @keyframes sprout{from{transform:scale(0) translateY(8px)}to{transform:scale(1) translateY(0)}}
  #rainbow{opacity:0;transition:opacity .5s}
  #rainbow.on{opacity:.85}

  /* ---------- confetti ---------- */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
  .petal{position:absolute;width:14px;height:18px;border-radius:60% 60% 60% 60%/70% 70% 40% 40%;animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(105vh) rotate(720deg)}}

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:1rem;
    background:radial-gradient(circle at 50% 30%,#9ec9e2,#4d7f97);
    overflow:auto;
  }
  .overlay[hidden]{display:none}
  .card{
    width:min(440px,100%);background:var(--panel);border-radius:30px;
    padding:1.2rem 1.1rem 1.4rem;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.18);
  }
  .card h1{
    font-family:'Baloo 2',system-ui;font-weight:800;margin:.1rem 0 .1rem;
    font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.05;
  }
  .card p.sub{margin:0 0 .8rem;color:var(--ink-soft);font-weight:800;font-size:.95rem}
  .card .cowbox{width:min(230px,62%);margin:0 auto .3rem}
  label.field{display:block;text-align:left;font-weight:900;font-size:.85rem;color:var(--ink-soft);margin:.7rem .3rem .3rem}
  input[type=text]{
    width:100%;padding:.7rem .9rem;border-radius:18px;border:none;
    background:#fff;box-shadow:inset 0 0 0 3px rgba(59,42,32,.12);
    font-family:'Baloo 2',system-ui;font-weight:700;font-size:1.4rem;color:var(--ink);text-align:center;
  }
  input[type=text]:focus{outline:4px solid var(--gold);outline-offset:2px}
  .tables{display:flex;gap:.5rem;justify-content:center;margin-top:.3rem}
  .tbl{
    flex:1;padding:.6rem .2rem;border-radius:18px;background:#fff;color:var(--ink-soft);
    font-family:'Baloo 2',system-ui;font-weight:800;font-size:1.5rem;
    box-shadow:inset 0 0 0 3px rgba(59,42,32,.12);
  }
  .tbl small{display:block;font-family:'Nunito';font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
  .tbl[aria-pressed=true]{background:#8E6BA8;color:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
  .go{
    margin-top:1rem;width:100%;padding:.9rem;border-radius:22px;background:var(--gold);color:#4a3208;
    font-family:'Baloo 2',system-ui;font-weight:800;font-size:1.6rem;box-shadow:0 6px 0 #c98f16;
  }
  .go:active{transform:translateY(4px);box-shadow:0 2px 0 #c98f16}
  .go.alt{background:var(--b1);color:#fff;box-shadow:0 6px 0 #2f6b36}
  .go.alt:active{box-shadow:0 2px 0 #2f6b36}
  .ghost{margin-top:.5rem;width:100%;padding:.6rem;border-radius:18px;background:transparent;color:var(--ink-soft);font-weight:900}
  .bigstat{display:flex;gap:.6rem;justify-content:center;margin:.6rem 0 .2rem}
  .bigstat div{flex:1;background:#fff;border-radius:20px;padding:.6rem .3rem;box-shadow:inset 0 0 0 3px rgba(59,42,32,.1)}
  .bigstat b{display:block;font-family:'Baloo 2',system-ui;font-size:2.1rem;line-height:1}
  .bigstat span{font-size:.7rem;font-weight:900;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}

  /* ---------- landscape / wide ---------- */
  @media (min-width:720px) and (orientation:landscape){
    #app{flex-direction:row;flex-wrap:wrap}
    .topbar{width:100%}
    .stage{flex:1 1 55%;min-width:340px}
    .answers{flex:1 1 40%;display:flex;flex-direction:column;justify-content:center;min-width:320px}
    .bands{grid-template-columns:repeat(2,1fr);gap:.7rem}
    .band{padding:1.2rem .4rem}
    .numbers{gap:.6rem}
    .bubble{top:12%;width:min(46%,340px)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div id="app" aria-hidden="true">
  <header class="topbar">
    <div class="chip chip-score">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#4E9C55"><circle cx="12" cy="5.5" r="4"/><circle cx="18.5" cy="12" r="4"/><circle cx="12" cy="18.5" r="4"/><circle cx="5.5" cy="12" r="4"/></g><circle cx="12" cy="12" r="3.4" fill="#F4B740"/></svg>
      <span class="num" id="scoreVal">0</span><span class="lbl">right</span>
    </div>
    <div class="chip chip-streak">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#8E6BA8" d="M12 2l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.1 6.1 20.2l1.2-6.6L2.5 9l6.6-.9z"/></svg>
      <span class="num" id="streakVal">0</span><span class="lbl">in a row</span>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="soundBtn" aria-label="Turn sound off">
      <svg id="soundIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wave1" d="M16 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="wave2" d="M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="finishBtn" aria-label="Finish and see the score">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="2.2" height="18" rx="1.1"/><path d="M8 4h10l-2.2 4L18 12H8z"/></svg>
    </button>
  </header>

  <main class="stage">
    <div class="scene">
      <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7FB0D4"/><stop offset="1" stop-color="#D6E9F2"/>
          </linearGradient>
          <radialGradient id="sunGlow"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".95"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
          <clipPath id="skyClip"><rect x="0" y="0" width="400" height="200"/></clipPath>
        </defs>

        <rect width="400" height="300" fill="url(#sky)"/>
        <g clip-path="url(#skyClip)">
          <circle cx="330" cy="46" r="46" fill="url(#sunGlow)"/>
          <circle cx="330" cy="46" r="17" fill="#FFF0B8"/>
          <g class="cloud" fill="#ffffff" opacity=".85">
            <ellipse cx="70" cy="42" rx="28" ry="13"/><ellipse cx="52" cy="47" rx="18" ry="10"/><ellipse cx="90" cy="48" rx="20" ry="10"/>
          </g>
          <g class="cloud c2" fill="#ffffff" opacity=".65">
            <ellipse cx="200" cy="80" rx="22" ry="10"/><ellipse cx="184" cy="84" rx="14" ry="8"/><ellipse cx="216" cy="84" rx="15" ry="8"/>
          </g>
          <g id="rainbow" fill="none" stroke-width="7">
            <path d="M40 210a160 160 0 01320 0" stroke="#E4626F"/>
            <path d="M54 210a146 146 0 01292 0" stroke="#F0A24E"/>
            <path d="M68 210a132 132 0 01264 0" stroke="#F4D35E"/>
            <path d="M82 210a118 118 0 01236 0" stroke="#5FA155"/>
            <path d="M96 210a104 104 0 01208 0" stroke="#3E86B5"/>
            <path d="M110 210a90 90 0 01180 0" stroke="#8E6BA8"/>
          </g>
        </g>

        <!-- far hills -->
        <path d="M0 172c40-30 66-8 96-22s52-26 88-10 52 30 84 20 62-24 132-6v146H0z" fill="#8FAE9C"/>
        <path d="M0 196c56-26 92 4 140-12s86-18 130 2 78 16 130-2v116H0z" fill="#5C8C6A"/>
        <!-- heather band -->
        <g fill="#8E6BA8" opacity=".55">
          <ellipse cx="30" cy="205" rx="16" ry="5"/><ellipse cx="120" cy="200" rx="20" ry="5"/>
          <ellipse cx="250" cy="203" rx="18" ry="5"/><ellipse cx="350" cy="199" rx="22" ry="6"/>
        </g>
        <!-- meadow -->
        <path d="M0 212c60-14 120 10 200 2s140-16 200-4v90H0z" fill="#5FA155"/>
        <g stroke="#3F7145" stroke-width="3" stroke-linecap="round" opacity=".55">
          <path d="M18 236l-4-10M24 236l2-11M52 258l-5-12M58 258l3-12M300 244l-4-11M306 244l3-11M356 268l-5-12M362 268l3-12"/>
        </g>
        <g id="flowers"></g>

        <!-- ============ HAMISH ============ -->
        <g transform="translate(142 158) scale(.76)"><g id="cow">
          <ellipse cx="0" cy="92" rx="94" ry="13" fill="#2f5a38" opacity=".26"/>
          <!-- tail -->
          <g id="tail">
            <path d="M64 18c21 9 29 30 25 52" fill="none" stroke="#A9531C" stroke-width="9" stroke-linecap="round"/>
            <ellipse cx="87" cy="74" rx="10" ry="13" fill="#5A3218"/>
          </g>
          <!-- back legs -->
          <g fill="#A9531C">
            <rect x="-58" y="44" width="21" height="46" rx="10"/>
            <rect x="40" y="44" width="21" height="46" rx="10"/>
          </g>
          <g fill="#4A3327"><rect x="-59" y="76" width="23" height="15" rx="6"/><rect x="39" y="76" width="23" height="15" rx="6"/></g>
          <!-- front legs -->
          <g fill="#D9782F">
            <rect x="-37" y="48" width="24" height="43" rx="11"/>
            <rect x="14" y="48" width="24" height="43" rx="11"/>
          </g>
          <g fill="#4A3327"><rect x="-38" y="77" width="26" height="15" rx="6"/><rect x="13" y="77" width="26" height="15" rx="6"/></g>
          <!-- body -->
          <path d="M-76 6c0-33 34-49 76-49s76 16 76 49c0 28-20 46-44 50-7 7-14 7-18 0-9 5-22 5-31 0-5 7-12 7-18 0C-56 52-76 34-76 6z" fill="#D9782F"/>
          <path d="M-76 2c10 10 16-4 23 6s16-2 23 8 16-3 23 6 16-2 23 8 16-4 23 5 14-2 21 6c-17 13-46 18-68 18s-51-10-66-26z" fill="#C1631F" opacity=".5"/>
          <g stroke="#C1631F" stroke-width="3" stroke-linecap="round" opacity=".55" fill="none">
            <path d="M-54-20l-6 13M-31-31l-5 13M-6-35l-4 13M19-33l-4 13M43-25l-5 13M62-11l-7 12"/>
          </g>
          <!-- horns -->
          <g fill="#F4E8CD" stroke="#BFA87C" stroke-width="2.5" stroke-linejoin="round">
            <path d="M-38-71C-60-78-84-75-99-91c-2 20 8 33 27 38 11 3 21 2 30 1z"/>
            <path d="M38-71C60-78 84-75 99-91c2 20-8 33-27 38-11 3-21 2-30 1z"/>
          </g>
          <!-- ears -->
          <ellipse cx="-54" cy="-52" rx="15" ry="9" fill="#A9531C" transform="rotate(-20 -54 -52)"/>
          <ellipse cx="54" cy="-52" rx="15" ry="9" fill="#A9531C" transform="rotate(20 54 -52)"/>
          <!-- head -->
          <path d="M-50-60c0-24 22-40 50-40s50 16 50 40c0 16-3 27-9 36-8 15-24 25-41 25s-33-10-41-25c-6-9-9-20-9-36z" fill="#F0A257"/>
          <!-- eyes (peeking under the fringe) -->
          <g>
            <ellipse cx="-19" cy="-32" rx="8" ry="9" fill="#3A2317"/>
            <ellipse cx="19" cy="-32" rx="8" ry="9" fill="#3A2317"/>
            <circle cx="-16" cy="-35" r="2.8" fill="#fff"/>
            <circle cx="22" cy="-35" r="2.8" fill="#fff"/>
            <ellipse class="lid" cx="-19" cy="-41" rx="9" ry="10" fill="#F0A257"/>
            <ellipse class="lid" cx="19" cy="-41" rx="9" ry="10" fill="#F0A257"/>
          </g>
          <!-- shaggy fringe -->
          <path d="M-52-62C-52-90-27-102 0-102s52 12 52 40l-8 20-7-14-8 20-9-16-8 18-8-18-9 16-8-20-7 14z" fill="#D9782F"/>
          <g stroke="#C1631F" stroke-width="3" stroke-linecap="round" opacity=".6" fill="none">
            <path d="M-34-88l-4 22M-16-95l-3 24M2-96l-1 24M20-94l3 22M36-86l5 20"/>
          </g>
          <path d="M-40-82c8-11 22-16 40-16s32 5 40 16c-10-6-24-9-40-9s-30 3-40 9z" fill="#F0A257" opacity=".55"/>
          <!-- muzzle -->
          <g id="muzzle">
            <ellipse cx="0" cy="-6" rx="29" ry="21" fill="#F7E2C6"/>
            <ellipse cx="-11" cy="-12" rx="5" ry="6.5" fill="#B8846A"/>
            <ellipse cx="11" cy="-12" rx="5" ry="6.5" fill="#B8846A"/>
            <path id="smile" d="M-12 3c5 6 19 6 24 0" fill="none" stroke="#B8846A" stroke-width="3" stroke-linecap="round"/>
          </g>
        </g></g>
      </svg>
    </div>

    <div class="bubble">
      <p class="prompt" id="prompt" aria-live="polite">2 <span class="times">×</span> 2</p>
      <p class="hint" id="hint">Which patch is the answer in?</p>

    </div>
  </main>

</div>

        <path d="M-46-36c2-22 22-34 46-34s44 12 46 34c-4 4-8 2-10 8-3 8-9 6-12 12-3-8-9-6-12-12-3 8-9 8-12 14-3-8-9-6-12-14-3 8-9 4-12 12-3-6-9-4-12-12-2-6-6-4-10-8z" fill="#D9782F"/>
        <ellipse cx="-17" cy="-12" rx="7.5" ry="8.5" fill="#3A2317"/><ellipse cx="17" cy="-12" rx="7.5" ry="8.5" fill="#3A2317"/>
        <circle cx="-14.5" cy="-15" r="2.6" fill="#fff"/><circle cx="19.5" cy="-15" r="2.6" fill="#fff"/>
        <ellipse cx="0" cy="14" rx="27" ry="20" fill="#F7E2C6"/>
        <ellipse cx="-10" cy="8" rx="4.5" ry="6" fill="#B8846A"/><ellipse cx="10" cy="8" rx="4.5" ry="6" fill="#B8846A"/>

      <button class="tbl" data-t="2" aria-pressed="true">2<small>times</small></button>

  <div class="card">
    <h1 id="endTitle">Great playing!</h1>
    <p class="sub" id="endSub">Hamish is very impressed.</p>
    <div class="bigstat">
      <div><b id="endScore">0</b><span>right</span></div>
      <div><b id="endBest">0</b><span>best run</span></div>

    <button class="ghost" id="changeBtn">Change name or tables</button>

<div class="fx" id="fx"></div>

<script>
(function(){
  "use strict";

  /* ---------------- state ---------------- */
  var S = {
    name:"Robyn", tables:[2,3,4],
    score:0, streak:0, best:0,
    q:null, band:-1, wrongs:0, lastKey:"",
    sound:true, locked:false, bloomCount:0
  };

  var $ = function(id){ return document.getElementById(id); };
  var app=$("app"), step1=$("step1"), step2=$("step2"), promptEl=$("prompt"), hintEl=$("hint");
  var BANDS=[[1,10],[11,20],[21,30],[31,40]];
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- audio ---------------- */
  var ctx=null, master=null, ambientOn=false, birdTimer=null;

  function initAudio(){
    if(ctx) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
      startAmbience();
    }catch(e){ ctx=null; }
  }

  function startAmbience(){
    if(!ctx || ambientOn) return;
    ambientOn = true;
    var amb = ctx.createGain(); amb.gain.value = 0; amb.connect(master);
    amb.gain.linearRampToValueAtTime(0.16, ctx.currentTime + 4);

    // warm pad in D
    [73.42, 110.0, 164.81].forEach(function(f,i){
      var o=ctx.createOscillator(), g=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
      o.type = i===2 ? "triangle" : "sine"; o.frequency.value=f;
      g.gain.value = 0.10 - i*0.02;
      lfo.frequency.value = 0.05 + i*0.03; lg.gain.value = g.gain.value*0.6;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(amb); o.start();
    });

    // breeze
    var len = ctx.sampleRate*3, buf = ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i] = (Math.random()*2-1)*0.5;
    var noise = ctx.createBufferSource(); noise.buffer=buf; noise.loop=true;
    var bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=420; bp.Q.value=0.6;
    var ng = ctx.createGain(); ng.gain.value=0.05;
    var nlfo = ctx.createOscillator(); nlfo.frequency.value=0.07;
    var nlg = ctx.createGain(); nlg.gain.value=0.03;
    nlfo.connect(nlg); nlg.connect(ng.gain); nlfo.start();
    noise.connect(bp); bp.connect(ng); ng.connect(amb); noise.start();

    scheduleBird();
  }

  function scheduleBird(){
    clearTimeout(birdTimer);
    birdTimer = setTimeout(function(){
      if(S.sound) chirp();
      scheduleBird();
    }, 7000 + Math.random()*11000);
  }

  function chirp(){
    if(!ctx) return;
    var t=ctx.currentTime;
    for(var n=0;n<2+Math.floor(Math.random()*2);n++){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine";
      var base = 1800 + Math.random()*900, st = t + n*0.14;
      o.frequency.setValueAtTime(base, st);
      o.frequency.exponentialRampToValueAtTime(base*1.5, st+0.05);
      o.frequency.exponentialRampToValueAtTime(base*0.9, st+0.11);
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.05, st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.13);
      o.connect(g); g.connect(master); o.start(st); o.stop(st+0.16);
    }
  }

  function note(freq, start, dur, type, vol){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol||0.22, start+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    o.connect(g); g.connect(master); o.start(start); o.stop(start+dur+0.05);
  }

  function sndCorrect(){
    if(!ctx||!S.sound) return;
    var t=ctx.currentTime, f=[587.33,739.99,880,1174.66];
    f.forEach(function(hz,i){
      note(hz, t+i*0.075, 0.5, "triangle", 0.2);
      note(hz*2, t+i*0.075, 0.3, "sine", 0.06);
    });
  }

  function sndTry(){
    if(!ctx||!S.sound) return;
    var t=ctx.currentTime;
    note(392, t, 0.22, "sine", 0.14);
    note(329.63, t+0.13, 0.3, "sine", 0.12);
  }

  function sndTap(){
    if(!ctx||!S.sound) return;
    note(880, ctx.currentTime, 0.09, "sine", 0.08);
  }

  /* A moo is a vowel, not a tone. It travels "mmm-AWW-ooo-mmm" as the mouth
     opens and closes again, so the formants have to move with it. Three
     bandpass filters in parallel are the mouth; the sawtooth is the animal.
     A single swept lowpass — which is what this was — only ever sounds like
     a kazoo, because nothing in it is shaped like a vowel. */
  var mooNoise=null;
  function mooNoiseBuffer(){
    if(mooNoise) return mooNoise;
    var len=Math.floor(ctx.sampleRate*1.6);
    mooNoise=ctx.createBuffer(1,len,ctx.sampleRate);
    var d=mooNoise.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    return mooNoise;
  }

  function sndMoo(){
    if(!ctx||!S.sound) return;
    var t=ctx.currentTime, D=1.62, i;
    var times=[0,0.45,0.95,1.32,D];

    // The close has to stay audible: the final "mmm" is the most cow-like
    // part of the whole sound, and an exponential fall from the sustain
    // buries it before anyone hears it.
    var out=ctx.createGain();
    out.gain.setValueAtTime(0.0001,t);
    out.gain.exponentialRampToValueAtTime(0.62,t+0.10);
    out.gain.setValueAtTime(0.62,t+0.85);
    out.gain.exponentialRampToValueAtTime(0.50,t+1.15);
    out.gain.exponentialRampToValueAtTime(0.30,t+1.35);
    out.gain.exponentialRampToValueAtTime(0.0001,t+D);
    out.connect(master);

    // how far the mouth is open
    var mouth=ctx.createBiquadFilter();
    mouth.type="lowpass"; mouth.Q.value=0.7;
    mouth.frequency.setValueAtTime(600,t);
    mouth.frequency.linearRampToValueAtTime(3000,t+0.45);
    mouth.frequency.linearRampToValueAtTime(2500,t+0.95);
    mouth.frequency.linearRampToValueAtTime(900,t+1.32);
    mouth.frequency.linearRampToValueAtTime(640,t+D);
    mouth.connect(out);

    // the animal itself: a sawtooth for harmonics, a sine to fatten the
    // fundamental so it still carries on a phone speaker
    var saw=ctx.createOscillator(); saw.type="sawtooth";
    var body=ctx.createOscillator(); body.type="sine";
    var bodyG=ctx.createGain(); bodyG.gain.value=0.3;
    body.connect(bodyG); bodyG.connect(mouth);

    // pitch rises on the push of breath, then sags away at the end
    var f0=[118,150,146,138,112], f0t=[0,0.12,0.35,0.85,D];
    [saw,body].forEach(function(o){
      o.frequency.setValueAtTime(f0[0],t);
      for(var k=1;k<f0.length;k++) o.frequency.linearRampToValueAtTime(f0[k],t+f0t[k]);
    });

    // two wobbles at different speeds, so it breathes instead of droning
    var lfos=[];
    [[5.5,3.4],[1.7,1.6]].forEach(function(v){
      var lfo=ctx.createOscillator(); lfo.frequency.value=v[0];
      var dep=ctx.createGain(); dep.gain.value=v[1];
      lfo.connect(dep); dep.connect(saw.frequency); dep.connect(body.frequency);
      lfos.push(lfo);
    });

    // the mouth shape, travelling from "m" out to "aw" and back to "m"
    [{f:[250,620,560,300,240],q:7,g:1.00},
     {f:[880,1080,1020,900,850],q:9,g:0.42},
     {f:[2300,2600,2500,2350,2250],q:10,g:0.16}].forEach(function(spec){
      var bp=ctx.createBiquadFilter();
      bp.type="bandpass"; bp.Q.value=spec.q;
      bp.frequency.setValueAtTime(spec.f[0],t);
      for(var k=1;k<spec.f.length;k++) bp.frequency.linearRampToValueAtTime(spec.f[k],t+times[k]);
      var g=ctx.createGain(); g.gain.value=spec.g;
      saw.connect(bp); bp.connect(g); g.connect(out);
    });

    // air escaping as the mouth opens, and again as it shuts
    var n=ctx.createBufferSource(); n.buffer=mooNoiseBuffer();
    var nb=ctx.createBiquadFilter(); nb.type="bandpass"; nb.frequency.value=1050; nb.Q.value=0.8;
    var ng=ctx.createGain();
    ng.gain.setValueAtTime(0.0001,t);
    ng.gain.exponentialRampToValueAtTime(0.05,t+0.05);
    ng.gain.exponentialRampToValueAtTime(0.006,t+0.35);
    ng.gain.exponentialRampToValueAtTime(0.05,t+1.38);
    ng.gain.exponentialRampToValueAtTime(0.0001,t+D);
    n.connect(nb); nb.connect(ng); ng.connect(out);

    saw.start(t); body.start(t); n.start(t);
    saw.stop(t+D+0.05); body.stop(t+D+0.05); n.stop(t+D+0.05);
    for(i=0;i<lfos.length;i++){ lfos[i].start(t); lfos[i].stop(t+D+0.05); }
  }

  function sndFanfare(){
    if(!ctx||!S.sound) return;
    var t=ctx.currentTime, seq=[587.33,739.99,880,1108.73,1174.66];
    seq.forEach(function(hz,i){ note(hz, t+i*0.1, 0.6, "triangle", 0.18); });
  }

  /* ---------------- visuals ---------------- */
  var PETALS=["#C9A5DC","#F4B740","#FFFFFF","#8E6BA8","#F0A257"];
  function confetti(n){
    if(reduced) return;
    var fx=$("fx");
    for(var i=0;i<n;i++){
      var p=document.createElement("div");
      p.className="petal";
      p.style.left=(Math.random()*100)+"vw";
      p.style.background=PETALS[i%PETALS.length];
      p.style.animationDuration=(1.5+Math.random()*1.4)+"s";
      p.style.animationDelay=(Math.random()*0.4)+"s";
      p.style.opacity=0.9;
      fx.appendChild(p);
      (function(el){ setTimeout(function(){ el.remove(); }, 3400); })(p);
    }
  }

  var FLOWER_COLS=["#FFFFFF","#F4B740","#C9A5DC","#F58FA8"];
  function growFlower(){
    var g=document.getElementById("flowers");
    if(S.bloomCount>=26){ g.innerHTML=""; S.bloomCount=0; }
    var x = 20 + Math.random()*360, y = 224 + Math.random()*66;
    var c = FLOWER_COLS[Math.floor(Math.random()*FLOWER_COLS.length)];
    var s = (0.7 + Math.random()*0.5) * (y>260?1.25:1);
    var el = document.createElementNS("http://www.w3.org/2000/svg","g");
    el.setAttribute("class","bloom");
    el.setAttribute("transform","translate("+x.toFixed(1)+" "+y.toFixed(1)+") scale("+s.toFixed(2)+")");
    el.innerHTML =
      '<path d="M0 0v-9" stroke="#3F7145" stroke-width="2" stroke-linecap="round"/>'+
      '<g fill="'+c+'">'+
      '<circle cx="0" cy="-13" r="3.2"/><circle cx="-4" cy="-10" r="3.2"/><circle cx="4" cy="-10" r="3.2"/>'+
      '<circle cx="-3" cy="-16" r="3.2"/><circle cx="3" cy="-16" r="3.2"/></g>'+
      '<circle cx="0" cy="-13" r="1.8" fill="#F4B740"/>';
    g.appendChild(el);
    S.bloomCount++;
  }

  function cowAnim(cls, ms){
    var cow=document.getElementById("cow");
    cow.classList.remove("jump","shake");
    void cow.offsetWidth;
    cow.classList.add(cls);
    setTimeout(function(){ cow.classList.remove(cls); }, ms);
  }

  function rainbow(){
    var r=document.getElementById("rainbow");
    r.classList.add("on");
    setTimeout(function(){ r.classList.remove("on"); }, 3200);
  }

  /* ---------------- questions ---------------- */
  function newQuestion(){
    if(!$("endScreen").hidden || !$("startScreen").hidden) return;
    var a,b,key,guard=0;
    do{
      a = S.tables[Math.floor(Math.random()*S.tables.length)];
      b = 1 + Math.floor(Math.random()*10);
      key = a+"x"+b;
      guard++;
    }while(key===S.lastKey && guard<12);
    S.lastKey = key;
    S.q = {a:a, b:b, ans:a*b};
    S.band = -1; S.wrongs = 0; S.locked=false;
    promptEl.innerHTML = a + ' <span class="times">×</span> ' + b;
    hintEl.className = "hint";
    hintEl.textContent = "Which patch is the answer in?";
    $("dots").hidden = true;
    $("helpBtn").hidden = false;
    $("helpBtn").textContent = "Show me";
    showStep1();
  }

  function showStep1(){
    step2.hidden = true; step2.innerHTML = "";
    step1.hidden = false;
    step1.innerHTML = "";
    BANDS.forEach(function(r,i){
      var btn=document.createElement("button");
      btn.className="band b"+(i+1);
      btn.innerHTML = r[0]+"–"+r[1]+"<small>patch</small>";
      btn.setAttribute("aria-label","Numbers "+r[0]+" to "+r[1]);
      btn.addEventListener("click", function(){ pickBand(i, btn); });
      step1.appendChild(btn);
    });
  }

  function showStep2(i){
    step1.hidden = true;
    step2.hidden = false;
    step2.innerHTML = "";
    var back=document.createElement("button");
    back.className="back";
    back.innerHTML = "&#8592; other patch";
    back.addEventListener("click", function(){ sndTap(); hintEl.textContent="Which patch is the answer in?"; showStep1(); });
    step2.appendChild(back);
    var colour = getComputedStyle(document.documentElement).getPropertyValue("--b"+(i+1));
    for(var n=BANDS[i][0]; n<=BANDS[i][1]; n++){
      (function(num){
        var t=document.createElement("button");
        t.className="tile"; t.style.setProperty("--tile", colour.trim());
        t.textContent=num;
        t.addEventListener("click", function(){ pickNumber(num, t); });
        step2.appendChild(t);
      })(n);
    }
  }

  function pickBand(i, btn){
    if(S.locked) return;
    var correctBand = Math.floor((S.q.ans-1)/10);
    if(i!==correctBand){
      sndTry();
      btn.classList.add("nudge");
      setTimeout(function(){ btn.classList.remove("nudge"); }, 500);
      hintEl.textContent = "Not that patch — try another one.";
      cowAnim("shake",600);
      return;
    }
    sndTap();
    S.band = i;
    hintEl.textContent = "Now tap the answer.";
    showStep2(i);
  }

  function pickNumber(num, tile){
    if(S.locked) return;
    if(num !== S.q.ans){
      S.streak = 0; render();
      S.wrongs++;
      sndTry();
      tile.classList.add("nudge");
      setTimeout(function(){ tile.classList.add("gone"); tile.classList.remove("nudge"); }, 450);
      hintEl.textContent = S.wrongs>=2 ? "Look for the glowing one." : "Nearly! Have another go, " + S.name + ".";
      cowAnim("shake",600);
      if(S.wrongs>=2){
        var tiles=step2.querySelectorAll(".tile");
        for(var k=0;k<tiles.length;k++){
          if(parseInt(tiles[k].textContent,10)===S.q.ans) tiles[k].classList.add("glow");
        }
      }
      return;
    }
    // correct
    S.locked = true;
    S.score++;
    S.streak++;
    if(S.streak>S.best) S.best=S.streak;
    render();
    growFlower();
    cowAnim("jump",900);
    sndCorrect();
    confetti(S.streak%5===0 ? 34 : 16);

    var praise;
    if(S.streak>0 && S.streak%5===0){
      praise = S.streak + " in a row, " + S.name + "! Amazing!";
      hintEl.className = "hint praise big";
      hintEl.textContent = S.streak + " in a row!";
      rainbow(); sndFanfare();
      setTimeout(sndMoo, 700);
    }else{
      var lines=["Well done, "+S.name+"!","Brilliant, "+S.name+"!","That's it, "+S.name+"!","Super counting, "+S.name+"!","Yes! Great work, "+S.name+"!","Spot on, "+S.name+"!"];
      praise = lines[Math.floor(Math.random()*lines.length)];
      hintEl.className = "hint praise";
      hintEl.textContent = praise;
      if(Math.random()<0.3) setTimeout(sndMoo, 500);
    }
    $("helpBtn").hidden = true;
    $("dots").hidden = true;
    setTimeout(newQuestion, 2200);
  }

  function render(){
    $("scoreVal").textContent = S.score;
    $("streakVal").textContent = S.streak;
  }

  /* ---------------- helper dots ---------------- */
  $("helpBtn").addEventListener("click", function(){
    var d=$("dots");
    if(!d.hidden){ d.hidden=true; this.textContent="Show me"; sndTap(); return; }
    d.innerHTML="";
    for(var r=0;r<S.q.a;r++){
      var row=document.createElement("div"); row.className="row";
      for(var c=0;c<S.q.b;c++) row.appendChild(document.createElement("i"));
      d.appendChild(row);
    }
    d.hidden=false;
    this.textContent="Hide";
    sndTap();
  });

  /* ---------------- sound toggle ---------------- */
  $("soundBtn").addEventListener("click", function(){
    S.sound = !S.sound;
    this.setAttribute("aria-label", S.sound ? "Turn sound off" : "Turn sound on");
    $("wave1").style.opacity = S.sound?1:0.15;
    $("wave2").style.opacity = S.sound?1:0.15;
    if(master) master.gain.value = S.sound ? 0.9 : 0;
  });

  /* ---------------- start / finish ---------------- */
  document.querySelectorAll(".tbl").forEach(function(b){
    b.addEventListener("click", function(){
      var on = b.getAttribute("aria-pressed")==="true";
      var picked = document.querySelectorAll('.tbl[aria-pressed="true"]').length;
      if(on && picked<=1) return;
      b.setAttribute("aria-pressed", on?"false":"true");
    });
  });

  $("startBtn").addEventListener("click", function(){
    var v = $("nameInput").value.trim();
    S.name = v ? v.slice(0,14) : "Robyn";
    S.tables = Array.prototype.map.call(document.querySelectorAll('.tbl[aria-pressed="true"]'), function(b){
      return parseInt(b.dataset.t,10);
    });
    if(!S.tables.length) S.tables=[2,3,4];
    S.score=0; S.streak=0; S.best=0; S.bloomCount=0; S.lastKey="";
    document.getElementById("flowers").innerHTML="";
    render();
    $("startScreen").hidden = true;
    $("endScreen").hidden = true;
    app.setAttribute("aria-hidden","false");
    initAudio();
    if(ctx && ctx.state==="suspended") ctx.resume();
    promptEl.innerHTML = "Hi, " + S.name + "!";
    hintEl.className = "hint praise";
    hintEl.textContent = "Let's count with Hamish.";
    setTimeout(newQuestion, 1400);
  });

  $("finishBtn").addEventListener("click", function(){
    $("endScore").textContent = S.score;
    $("endBest").textContent = S.best;
    $("endTitle").textContent = S.score>0 ? "Great playing, " + S.name + "!" : "See you soon, " + S.name + "!";
    $("endSub").textContent = S.score>=10 ? "Hamish's field is full of flowers." : "Hamish had a lovely time.";
    $("endScreen").hidden = false;
    S.locked = true;
  });

  $("againBtn").addEventListener("click", function(){
    S.score=0; S.streak=0; S.best=0; S.bloomCount=0;
    document.getElementById("flowers").innerHTML="";
    render();
    $("endScreen").hidden = true;
    if(ctx && ctx.state==="suspended") ctx.resume();
    newQuestion();
  });

  $("changeBtn").addEventListener("click", function(){
    $("endScreen").hidden = true;
    $("startScreen").hidden = false;
    $("nameInput").value = S.name;
  });

  $("nameInput").addEventListener("keydown", function(e){
    if(e.key==="Enter") $("startBtn").click();
  });

  render();
})();
</script>
</body>
</html>
