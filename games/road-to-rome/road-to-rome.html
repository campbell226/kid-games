<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#a8402a">
<title>Juno's Road to Rome</title>
<!--
  Juno's Road to Rome. A young goose walks from Eboracum (York) to Rome
  for the Festival of the Geese, and on the way the friends she helps
  teach her Roman numbers. Each chapter's puzzle is also a piece of
  ordinary maths: grouping in fives and tens, making amounts and giving
  change, equality, exchange (carrying), sequences, ordering, arrays,
  place value and, at the very end, zero. Every answer is shown in our
  own digits too, coloured by place, so the Roman numbers lead back to
  the real ones rather than away from them. See DESIGN.md.

  The story is read aloud by the device's speech, where there is one.
  The puzzles themselves have no words. Everything is drawn and every
  sound synthesised in this file. The map's coast is Natural Earth's
  1:110m countries (public domain), baked by tools/road-to-rome-map.js.
-->
<style>
  :root { --rf: "Cinzel", "Trajan Pro", "Palatino Linotype", "Book Antiqua", Palatino, "Noto Serif", Georgia, serif; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #e9d9b2; overflow: hidden;
    touch-action: manipulation; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #2b2118;
  }
  button { font: inherit; color: inherit; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }
  .rnf { font-family: var(--rf); font-weight: 700; }
  .sans { font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-weight: 800; }

  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; display: block; overflow: visible; background: #cfe3e8; }
  #mapScr { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: #d9c596; }
  #mapSvg { display: block; width: 100%; max-width: min(100vw, 118vh); margin: 0 auto; height: auto; }
  #inset { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); width: clamp(104px, 23vmin, 180px); height: clamp(104px, 23vmin, 180px); border-radius: 20px; background: #a9d3dc; box-shadow: 0 5px 0 rgba(70,45,10,.35), inset 0 0 0 4px #c8962d; z-index: 12; overflow: hidden; }
  #inset svg { width: 100%; height: 100%; display: block; }
  #atlas { position: fixed; inset: 0; z-index: 44; background: rgba(40,28,12,.72); display: flex; align-items: center; justify-content: center; padding: 12px; }
  #atlasSvg { width: 100%; height: 100%; max-width: 900px; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 35; }

  #home { position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); width: 62px; height: 62px; border-radius: 50%; background: #fff7e6; box-shadow: 0 4px 0 rgba(70,45,10,.35); z-index: 26; display: flex; align-items: center; justify-content: center; }
  #home svg { width: 64%; height: 64%; }
  #leaves { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 3px; z-index: 26; pointer-events: none; }
  #leaves svg { width: clamp(28px, 6.4vmin, 44px); height: clamp(28px, 6.4vmin, 44px); display: block; }
  #leaves .now { animation: lnow 1.2s ease-in-out infinite; }
  @keyframes lnow { 50% { transform: scale(1.2); } }

  #dlgcatch { position: fixed; inset: 0; z-index: 29; }
  #dlg {
    position: fixed; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 70px); transform: translateX(-50%);
    width: min(94vw, 900px); background: #fffaf0; border: 4px solid #c8962d; border-radius: 22px;
    display: flex; align-items: center; gap: 14px; padding: 10px 40px 10px 10px; z-index: 30;
    box-shadow: 0 10px 30px rgba(40,25,5,.35);
  }
  @media (orientation: landscape) {
    #dlg { top: auto; bottom: max(10px, env(safe-area-inset-bottom)); width: min(60vw, 900px); }
  }
  #dlg[hidden], #dlgcatch[hidden] { display: none; }
  #dlg-face { width: clamp(66px, 16vmin, 118px); height: clamp(66px, 16vmin, 118px); flex: none; border-radius: 16px; background: #f1e4c4; overflow: hidden; }
  #dlg-face svg { width: 100%; height: 100%; display: block; }
  #dlg-body { flex: 1; min-width: 0; }
  #dlg-name { font-weight: 800; color: #a8402a; font-size: clamp(15px, 3.2vmin, 21px); }
  #dlg-text { font-size: clamp(18px, 4vmin, 29px); line-height: 1.28; min-height: 2.56em; }
  #dlg-text .c { visibility: hidden; }
  #dlg-text .c.v { visibility: visible; }
  #dlg-text .rn { font-family: var(--rf); font-weight: 700; color: #a8402a; letter-spacing: .03em; }
  #dlg-more { position: absolute; right: 14px; bottom: 10px; width: 22px; height: 16px; animation: more .9s ease-in-out infinite; }
  @keyframes more { 50% { transform: translateY(4px); } }

  #done { position: fixed; inset: 0; z-index: 32; background: rgba(40,25,10,.55); display: flex; align-items: center; justify-content: center; }
  #done .dcard { background: #fffaf0; border: 5px solid #c8962d; border-radius: 30px; padding: 14px 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: rise .45s ease-out; }
  #dWreath { width: min(72vw, 50vh, 330px); height: min(72vw, 50vh, 330px); display: block; }
  #dBtns { display: flex; gap: 18px; }
  .rb { width: clamp(64px, 15vmin, 92px); height: clamp(64px, 15vmin, 92px); border-radius: 50%; background: #f1e4c4; box-shadow: 0 5px 0 rgba(70,45,10,.3); display: flex; align-items: center; justify-content: center; }
  .rb.main { background: #a8402a; }
  .rb svg { width: 56%; height: 56%; }
  .rb:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(70,45,10,.3); }
  @keyframes rise { from { transform: scale(.7); opacity: 0; } }

  /* faces: the state is a class on the character, the art carries every version */
  .e-happy, .e-shut, .m-open, .zz { display: none; }
  .happy .e-open, .sleep .e-open, .happy .e-shut, .happy .lids, .sleep .lids { display: none; }
  .happy .e-happy, .sleep .e-shut, .sleep .zz { display: inline; }
  .talk .m-open { display: inline; animation: mo .26s steps(1) infinite; }
  .talk .m-shut { animation: ms .26s steps(1) infinite; }
  @keyframes mo { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes ms { 0% { opacity: 0; } 50% { opacity: 1; } }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .wag { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.4s ease-in-out infinite; }
  @keyframes wag { 50% { transform: rotate(14deg); } }
  .zz text { animation: zz 2.4s linear infinite; }
  .zz text:nth-child(2) { animation-delay: .8s; } .zz text:nth-child(3) { animation-delay: 1.6s; }
  @keyframes zz { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(30px,-60px); opacity: 0; } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .5s ease-in-out infinite alternate; }
  @keyframes flame { from { transform: scale(1, 1); } to { transform: scale(.9, 1.12); } }
  .twinkle { animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .3; } }
  .hit { fill: rgba(0,0,0,0); cursor: pointer; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.06); } }
  .nowring { transform-box: fill-box; transform-origin: center; animation: pulse 1.4s ease-in-out infinite; }
  .shk { animation: shk .4s; }
  @keyframes shk { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .in-scene .pl-btn { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .blink, .pulse, .nowring, #leaves .now, #dlg-more, .wag, .zz text, .flame, .twinkle { animation: none !important; }
    .pulse, .nowring { opacity: .9; }
    #done .dcard { animation: none; }
  }
</style>
</head>
<body>
<div id="mapScr"><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 3240" role="img" aria-label="The road to Rome"></svg></div>
<button id="inset" type="button" aria-label="Where in the world"><svg id="insetSvg" xmlns="http://www.w3.org/2000/svg"></svg></button>
<div id="atlas" class="hidden"><svg id="atlasSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<svg id="stage" class="hidden" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs id="defs"></defs>
  <g id="Lbg"></g><g id="Lworld"></g><g id="Lui"></g><g id="Lchar" pointer-events="none"></g><g id="Ltop" pointer-events="none"></g>
</svg>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="home" class="hidden" type="button" aria-label="Map"><svg viewBox="0 0 40 40"><path d="M6 20 L20 7 L34 20 M10 18 V33 H17 V24 H23 V33 H30 V18" fill="none" stroke="#7f2f1d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div id="leaves" class="hidden"></div>
<div id="dlgcatch" hidden></div>
<div id="dlg" hidden><div id="dlg-face"></div><div id="dlg-body"><div id="dlg-name"></div><div id="dlg-text"></div></div><svg id="dlg-more" viewBox="0 0 22 16"><path d="M2 2 L11 14 L20 2 Z" fill="#c8962d"/></svg></div>
<div id="done" class="hidden"><div class="dcard"><svg id="dWreath" viewBox="-170 -170 340 340" aria-hidden="true"></svg><div id="dBtns"></div></div></div>

<script>
// Adult gate. The same block sits in every game that has parent controls.
// A gear in the top-right flashes three times at launch so a grown-up knows
// it is there, then is invisible. Hold it for 1.5 s and it asks one
// random question with a number pad. Right opens the controls; wrong
// closes quietly. It is a speed bump for a button-bashing child, not security.
// Use: var gearBtn = AdultGate.attach(openParent);
var AdultGate = (function () {
  'use strict';
  var QS = [
    ['What is 2 to the power 3?', 8],
    ['What is the first digit of pi?', 3],
    ['What are the first two digits of pi after the point?', 14],
    ['How many days are there in a leap year?', 366],
    ['What is 7 × 8?', 56],
    ['What is the square root of 144?', 12],
    ['How many players are on the pitch for one football team?', 11],
    ['At what temperature in °C does water boil?', 100],
    ['How many minutes are there in a day?', 1440],
    ['What is the atomic number of carbon?', 6],
    ['What is 15% of 200?', 30],
    ['How many degrees do the angles of a triangle add up to?', 180]
  ];
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function css(n, s) { n.style.cssText = s; return n; }

  function attach(open) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Parent controls');
    btn.innerHTML = '<svg viewBox="0 0 40 40" width="100%" height="100%"><path fill="#fff" fill-rule="evenodd" d="M17.5 7.2L18.1 2.6L21.9 2.6L22.5 7.2L27.2 9.2L30.9 6.3L33.7 9.1L30.8 12.8L32.8 17.5L37.4 18.1L37.4 21.9L32.8 22.5L30.8 27.2L33.7 30.9L30.9 33.7L27.2 30.8L22.5 32.8L21.9 37.4L18.1 37.4L17.5 32.8L12.8 30.8L9.1 33.7L6.3 30.9L9.2 27.2L7.2 22.5L2.6 21.9L2.6 18.1L7.2 17.5L9.2 12.8L6.3 9.1L9.1 6.3L12.8 9.2ZM20 13.6a6.4 6.4 0 1 0 0.01 0Z"/></svg>';
    css(btn, 'position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));' +
      'width:56px;height:56px;padding:12px;border:0;border-radius:50%;background:rgba(0,0,0,0.35);' +
      'opacity:0;z-index:40;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;');
    document.body.appendChild(btn);

    // Three flashes, then gone. Reduced motion: held steady, then a fade.
    if (btn.animate) {
      btn.animate(RM
        ? [{ opacity: 0.8 }, { opacity: 0.8, offset: 0.8 }, { opacity: 0 }]
        : [{ opacity: 0 }, { opacity: 0.8, offset: 0.08 }, { opacity: 0, offset: 0.16 },
           { opacity: 0.8, offset: 0.32 }, { opacity: 0, offset: 0.4 },
           { opacity: 0.8, offset: 0.56 }, { opacity: 0 }],
        { duration: RM ? 3000 : 2400, delay: 700, fill: 'none' });
    }

    var t = 0;
    function stop() { clearTimeout(t); }
    btn.addEventListener('pointerdown', function () { stop(); t = setTimeout(ask, 1500); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (e) { btn.addEventListener(e, stop); });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    function ask() {
      var q = QS[Math.floor(Math.random() * QS.length)], typed = '';
      var wrap = css(document.createElement('div'),
        'position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;' +
        'background:rgba(12,24,40,0.6);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;');
      var box = css(document.createElement('div'),
        'background:#fdfaf3;color:#22303f;border-radius:18px;padding:18px;width:min(320px,92vw);' +
        'box-shadow:0 18px 50px rgba(0,0,0,0.35);text-align:center;');
      var qt = css(document.createElement('div'), 'font-size:16px;margin-bottom:10px;min-height:46px;');
      qt.textContent = q[0];
      var shown = css(document.createElement('div'),
        'font-size:30px;font-weight:700;height:46px;line-height:46px;border-radius:10px;background:#fff;border:2px solid #cfd8e0;margin-bottom:10px;');
      var pad = css(document.createElement('div'), 'display:grid;grid-template-columns:repeat(3,1fr);gap:8px;');
      box.appendChild(qt); box.appendChild(shown); box.appendChild(pad);
      wrap.appendChild(box);
      function close() { if (wrap.parentNode) { wrap.parentNode.removeChild(wrap); } document.removeEventListener('keydown', key); }
      function submit() { var ok = typed !== '' && +typed === q[1]; close(); if (ok) { open(); } }
      function press(k) {
        if (k === 'ok') { submit(); return; }
        if (k === 'del') { typed = typed.slice(0, -1); }
        else if (typed.length < 5) { typed += k; }
        shown.textContent = typed;
      }
      function key(e) {
        if (e.key === 'Escape') { close(); }
        else if (e.key === 'Enter') { submit(); }
        else if (e.key === 'Backspace') { press('del'); }
        else if (/^[0-9]$/.test(e.key)) { press(e.key); }
      }
      ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'].forEach(function (k) {
        var b = css(document.createElement('button'),
          'min-height:52px;border:2px solid #cfd8e0;border-radius:11px;background:' + (k === 'ok' ? '#c8102e' : '#fff') +
          ';color:' + (k === 'ok' ? '#fff' : '#22303f') + ';font:inherit;font-size:22px;font-weight:600;cursor:pointer;');
        b.type = 'button';
        b.textContent = k === 'del' ? '⌫' : (k === 'ok' ? '✓' : k);
        b.addEventListener('click', function () { press(k); });
        pad.appendChild(b);
      });
      wrap.addEventListener('click', function (e) { if (e.target === wrap) { close(); } });
      document.addEventListener('keydown', key);
      document.body.appendChild(wrap);
    }
    return btn;
  }
  return { attach: attach };
})();

// Players. The same block sits in every game that keeps one child's progress
// apart from another's (Chess Quest has its own older version). Each player
// owns the game's whole save. A game reads its save with Players.raw(),
// writes it with Players.write(data), and calls Players.start() once at the
// end of its set-up. The picker, the + tile, the parent's Players section and
// the adult gear all come from here. Changing player reloads the page, so a
// game never has to rebuild a scene for someone else.
//
//   var PL = Players.make({
//     key:     'game-players',        // where the envelope is kept
//     legacy:  ['game'],              // old single saves, copied in as Player 1
//     fresh:   function () { return {...}; },   // a new player's save
//     summary: function (data) { return '12 flowers'; },
//     btn:     'left:50%;margin-left:-27px;top:12px;',  // who button position
//     shared:  function (box, ui) { ... }       // game-wide parent settings
//   });
var Players = (function () {
  'use strict';
  var COLS = ['#ff6b6b', '#ff9b3d', '#f2b134', '#3a9d4d', '#4aa3ff', '#b07cff'];
  var MAX = 8;

  function el(tag, cls, parent, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    if (parent) { parent.appendChild(e); }
    return e;
  }

  function make(cfg) {
    var env = { players: [], cur: '' };
    var frozen = false, dirty = false, startCur = '', gear = null;
    var whoEl = null, btnEl = null, parentEl = null;

    function pid() { return 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e5).toString(36); }
    function find(id) { var i; for (i = 0; i < env.players.length; i++) { if (env.players[i].id === id) { return env.players[i]; } } return null; }
    function curP() { return find(env.cur); }
    function flush() { try { localStorage.setItem(cfg.key, JSON.stringify(env)); } catch (e) { /* private window: nothing lost that mattered */ } }
    function initialOf(n) { n = (n || '').trim(); return n ? Array.from(n)[0].toUpperCase() : '?'; }

    // ---- storage ----
    (function () {
      var o = null, d = null, k;
      try { o = JSON.parse(localStorage.getItem(cfg.key) || 'null'); } catch (e) { o = null; }
      if (o && Array.isArray(o.players)) {
        env.players = o.players.filter(function (p) { return p && typeof p.id === 'string' && p.data && typeof p.data === 'object'; });
        env.cur = typeof o.cur === 'string' ? o.cur : '';
      } else {
        // Before there were players there was one save. It becomes Player 1,
        // and the old key is left where it is as a spare copy.
        for (k = 0; k < (cfg.legacy || []).length && !d; k++) {
          try { d = JSON.parse(localStorage.getItem(cfg.legacy[k]) || 'null'); } catch (e) { d = null; }
          if (d && typeof d !== 'object') { d = null; }
        }
        if (d) {
          env.players = [{ id: pid(), name: 'Player 1', col: COLS[0], all: false, data: d }];
          env.cur = env.players[0].id;
          flush();
        }
      }
      if (!find(env.cur)) { env.cur = env.players.length === 1 ? env.players[0].id : ''; }
    })();

    function raw() { var p = curP(); return p ? p.data : null; }
    function write(data) { var p = curP(); if (p && !frozen) { p.data = data; flush(); } }
    function all() { var p = curP(); return !!(p && p.all); }

    function go() {
      try { history.replaceState(null, '', location.pathname + location.search + '#as'); } catch (e) { /* ignore */ }
      location.reload();
    }

    // ---- look ----
    function addStyle() {
      var s = document.createElement('style');
      s.textContent =
        '.pl-who[hidden],.pl-parent[hidden]{display:none!important;}' +
        '.pl-who{position:fixed;inset:0;z-index:50;background:linear-gradient(#2b3d78,#1e2a4a 70%);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:70px 16px 30px;font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:manipulation;}' +
        '.pl-who .wbox{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:22px;max-width:760px;margin:auto;}' +
        '.pl-who button,.pl-btn,.pl-parent button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0;}' +
        '.pl-tile{width:clamp(110px,26vw,170px);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:clamp(18px,4vmin,26px);font-weight:800;}' +
        '.pl-face{width:100%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(54px,13vmin,84px);font-weight:900;box-shadow:0 7px 0 rgba(0,0,0,.25);text-shadow:0 3px 0 rgba(0,0,0,.2);}' +
        '.pl-tile:active .pl-face{transform:scale(.93);}' +
        '.pl-tile.add .pl-face{background:rgba(255,255,255,.12);border:5px dashed rgba(255,255,255,.55);box-shadow:none;}' +
        '.pl-tile .pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}' +
        '.pl-form{display:flex;flex-direction:column;align-items:center;gap:22px;margin:auto;}' +
        '.pl-form input{font:inherit;font-size:clamp(28px,7vmin,44px);font-weight:800;text-align:center;padding:10px 14px;border-radius:18px;border:0;width:min(80vw,360px);color:#22303f;}' +
        '.pl-sw{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}' +
        '.pl-sw button{width:clamp(52px,12vmin,70px);height:clamp(52px,12vmin,70px);border-radius:50%;box-shadow:0 5px 0 rgba(0,0,0,.25);}' +
        '.pl-sw button.on{outline:6px solid #fff;outline-offset:2px;}' +
        '.pl-go{width:clamp(80px,18vmin,110px);height:clamp(80px,18vmin,110px);border-radius:50%;background:#3a9d4d!important;box-shadow:0 7px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;}' +
        '.pl-go svg,.pl-back svg{width:60%;height:60%;}' +
        '.pl-back{position:absolute;left:14px;top:14px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18)!important;display:flex;align-items:center;justify-content:center;}' +

    function paintBtn() {

      if (!p || (whoEl && !whoEl.hidden)) { btnEl.style.display = 'none'; return; }
      btnEl.style.background = p.col || COLS[0];
      btnEl.textContent = initialOf(p.name);
      btnEl.style.display = 'flex';
    }

    function gearVisible(on) {
      if (!gear) { return; }
      if (on && gear.getAnimations) { gear.getAnimations().forEach(function (a) { a.cancel(); }); }

      gear.style.zIndex = on ? '56' : '40';
    }

    function hideWho() { if (whoEl) { whoEl.hidden = true; } gearVisible(false); paintBtn(); }

    function showWho(adding) {
      var box, inp, sw, go2, ok, bk, col = COLS[env.players.length % COLS.length];
      if (!whoEl) { whoEl = el('div', 'pl-who', document.body); }

          bk = el('button', 'pl-back', whoEl);
          bk.innerHTML = '<svg viewBox="0 0 100 100"><path d="M62 18 L28 50 L62 82" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        el('div', 'pn', t, p.name);
        t.onclick = function () {
          if (p.id === startCur && p.id === env.cur) { hideWho(); return; }

        var a = el('button', 'pl-tile add', box);
        a.innerHTML = '<div class="pl-face"><svg viewBox="0 0 100 100" style="width:50%;height:50%"><path d="M50 18 V82 M18 50 H82" stroke="#fff" stroke-width="14" stroke-linecap="round"/></svg></div>';

        var card = el('div', 'plr', box), r = el('div', 'row', card), ni, sm = cfg.summary ? cfg.summary(p.data) : '';
