<title>Hoot's Postcards</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #070b1e;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas, svg.layer { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; }
  #scene { opacity: 0; visibility: hidden; }
  text { font-family: ui-rounded, "Arial Rounded MT Bold", "Baloo 2", "Comic Sans MS", system-ui, sans-serif; font-weight: 700; }
  /* Every scene is drawn twice, by day and by night, and the night copy
     fades in over the top as the sun goes down. */
  .nt { opacity: var(--n, 0); }
  .ntc { opacity: var(--nc, 0); }
  .nl { opacity: var(--n, 0); }
  .dl { opacity: var(--d, 1); }
  .hit { fill: transparent; }
</style>
</head>
<body>
<script>
// Full screen on the first touch, and a way back if it is off. Copied from
// Animal Band, which explains why it listens for the events it does.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#2c3a66" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

<svg id="over" class="layer" xmlns="http://www.w3.org/2000/svg" aria-label="Hoot's Postcards">

  <path id="routes" fill="none" stroke="#ffd36a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 6" opacity="0.55"/>
  <path id="trail" fill="none" stroke="#fff6dc" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.5 9" opacity="0"/>
  <path id="pvok" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.5 8"/>
  <path id="pvgrey" fill="none" stroke="#8a93b0" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 7"/>

  <g id="arrowg"></g>
  <g id="splashg"></g>
  <g id="marks"></g>
  <g id="ferryg"></g>
  <g id="ghoot"></g>
  <g id="counter" opacity="0"></g>
  <g id="ovhud"></g>
  <g id="cluezoom" display="none"></g>
</svg>

<svg id="scene" class="layer" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop id="sc-s0" offset="0" stop-color="#4c9fe6"/>
      <stop id="sc-s1" offset="1" stop-color="#cfe9fb"/>
    </linearGradient>
    <radialGradient id="sc-sunglow">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ffe9a0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-moonglow">
      <stop offset="0" stop-color="#e8eeff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8eeff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-soft">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-lampglow">
      <stop offset="0" stop-color="#fff0c0" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffd98a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <defs id="sc-defs"></defs>
  <rect id="sc-skyr" x="0" y="0" width="1000" height="640" fill="url(#sc-sky)"/>
  <g id="sc-stars"></g>
  <g id="sc-sun"><circle r="120" fill="url(#sc-sunglow)"/><circle r="36" fill="#fff4b8"/></g>
  <g id="sc-moon">
    <circle r="80" fill="url(#sc-moonglow)"/>
    <circle r="25" fill="#f2eedc"/>
    <circle cx="-7" cy="-6" r="5" fill="#dcd6c0"/><circle cx="8" cy="5" r="4" fill="#dcd6c0"/><circle cx="-3" cy="10" r="2.6" fill="#dcd6c0"/>
  </g>
  <g id="sc-skyfx"></g>
  <g id="sc-stage">
    <g id="sc-back"></g>
    <g id="sc-ground"></g>
    <g id="sc-dev"></g>
    <g id="sc-props"></g>
    <g id="sc-piles"></g>
    <g id="sc-animal"></g>
    <g id="sc-hoot"></g>
    <g id="sc-front"></g>
    <g id="sc-glow"></g>
    <g id="sc-parts"></g>
    <g id="sc-bubble"></g>
    <g id="sc-thought"></g>
  </g>
  <g id="sc-home" display="none"></g>
  <rect id="sc-warm" x="0" y="0" width="1000" height="640" fill="#ff8a4a" opacity="0" pointer-events="none"/>
  <g id="sc-hud"></g>
  <g id="sc-ui"></g>
  <g id="sc-fly"></g>
</svg>

      x: 0, y: 0, s: 1, lx: 0.6, ly: 0, flap: 0, flapAmp: 0, blink: 2 + Math.random() * 3, blinkV: 1,
      pop: 0, hootT: 0, wave: 0, fan: 0, lean: 0, squash: 0, shiver: 0, T: 0, gear: {}, op: 1

  function setGear(H, name, on) {
    if (!!H.gear[name] === on) { return; }

  function rotAll(nodes, deg, px, py) {
    var s = 'rotate(' + f2(deg) + ' ' + px + ' ' + py + ')';

  }
  function setAll(nodes, s) { for (var i = 0; i < nodes.length; i++) { nodes[i].setAttribute('transform', s); } }

  function poseHoot(H, dt) {
    H.T += dt;
    var calm = reduced ? 0 : 1;
    H.flap += dt * 13;
    var wing = Math.sin(H.flap) * 58 * H.flapAmp;
    var waveR = 0, fanL = 0;
    if (H.wave > 0) { H.wave -= dt; waveR = -75 - Math.sin(H.T * 14) * 22; }
    if (H.fan > 0) { H.fan -= dt; fanL = 45 + Math.sin(H.T * 20) * 18; }
    rotAll(H.wl, wing + fanL, -18, -38);
    rotAll(H.wr, -wing + waveR, 18, -38);
    setAll(H.pup, 'translate(' + f2(clamp(H.lx, -1, 1) * 3.6) + ',' + f2(clamp(H.ly, -1, 1) * 3) + ')');
    H.blink -= dt;
    if (H.blink <= 0) { H.blink = 2.5 + Math.random() * 4; H.blinkV = 0; }
    H.blinkV = Math.min(1, H.blinkV + dt * 7);
    var bk = reduced ? 1 : clamp(H.blinkV, 0.1, 1);
    setAll(H.eyes, 'translate(0,-37) scale(1,' + f2(bk) + ') translate(0,37)');
    var open = 0;
    if (H.hootT > 0) { H.hootT -= dt; open = Math.abs(Math.sin(H.hootT * 7)) * 0.7; }
    setAll(H.beak, 'translate(0,-29) scale(1,' + f2(1 + open) + ') translate(0,29)');
    H.pop = Math.max(0, H.pop - dt * 3.5);
    H.squash = Math.max(0, H.squash - dt * 4);
    var shake = 0, no = 0;
    if (H.shiver > 0) { H.shiver -= dt; shake = Math.sin(H.T * 70) * 1.3 * calm; }
    // a shake of the head, no
    if (H.shake > 0) { H.shake -= dt; no = Math.sin(H.shake * 24) * 9; }
    var bob = Math.sin(H.T * 2) * 0.8 * calm * (1 - H.flapAmp);
    var sq = Math.sin(H.squash * Math.PI) * calm;
    var sx = (1 + H.pop * 0.12) * (1 + sq * 0.1), sy = (1 + H.pop * 0.12) * (1 - sq * 0.14);
    setAll(H.all, 'translate(' + f2(shake) + ',' + f2(bob) + ') rotate(' + f2(H.lean + no) + ' 0 -30) scale(' + f2(sx) + ',' + f2(sy) + ')');
    H.g.setAttribute('transform', 'translate(' + f2(H.x) + ',' + f2(H.y) + ') scale(' + f2(H.s) + ')');
    H.g.setAttribute('opacity', f2(H.op));
  }

  // The postcard: picture on the left, name and hello on the right, a

    var pad = w * 0.045, picW = w * 0.6, ph = h - pad * 2, pw = picW - pad;
    var s = '<rect x="0" y="0" width="' + f2(w) + '" height="' + f2(h) + '" rx="' + f2(w * 0.035) + '" fill="' + (on ? '#fffaf0' : '#f3efe6') + '" stroke="' + (on ? '#e0cfae' : '#d8d2c4') + '" stroke-width="' + f2(Math.max(1, w * 0.008)) + '"/>';
    var c = p.card || ['#8fd0f5', '#8cc56a'];
    var icon = p.icon();
    if (on) {
      s += '<rect x="' + f2(pad) + '" y="' + f2(pad) + '" width="' + f2(pw) + '" height="' + f2(ph * 0.7) + '" fill="' + c[0] + '"/>';
      s += '<rect x="' + f2(pad) + '" y="' + f2(pad + ph * 0.7) + '" width="' + f2(pw) + '" height="' + f2(ph * 0.3) + '" fill="' + c[1] + '"/>';

    var rx = picW + pad * 0.5, rw = w - rx - pad;

      s += '<rect x="' + f2(sx) + '" y="' + f2(sy) + '" width="' + f2(sw) + '" height="' + f2(sh) + '" fill="#ffffff" stroke="#d7a64a" stroke-width="' + f2(Math.max(1, w * 0.006)) + '" stroke-dasharray="' + f2(sw * 0.08) + ' ' + f2(sw * 0.05) + '"/>';
      s += '<rect x="' + f2(sx + sw * 0.12) + '" y="' + f2(sy + sh * 0.1) + '" width="' + f2(sw * 0.76) + '" height="' + f2(sh * 0.8) + '" fill="' + c[0] + '"/>';
      s += '<g transform="translate(' + f2(sx + sw / 2) + ',' + f2(sy + sh * 0.84) + ') scale(' + f2(sh * 0.62 / 64) + ')">' + dayify(icon) + '</g>';

    var words = p.name.split(' '), lines = (p.name.length > 9 && words.length > 1) ? [words.slice(0, -1).join(' '), words[words.length - 1]] : [p.name];
    var longest = Math.max.apply(null, lines.map(function (x) { return x.length; }));
    var fs = Math.min(h * 0.17, rw * 1.75 / Math.max(4, longest));
    var ty = h * (lines.length > 1 ? 0.5 : 0.6);
    lines.forEach(function (ln, i) {
      s += '<text x="' + f2(rx + rw / 2) + '" y="' + f2(ty + i * fs * 1.05) + '" font-size="' + f2(fs) + '" text-anchor="middle" fill="' + (on ? '#3b3350' : '#b6ad9c') + '">' + ln + '</text>';

    for (var j = 0; j < 2; j++) {

  }

  // ==================================================================
  // The globe view: markers, Hoot, his trail and the miles counter
  // ==================================================================
  var markers = [], gh = null, counterText = null, counterBox = null;

  function buildMarkers() {
    clear(marksG);

    PLACES.forEach(function (p) {
      var g = el('g', {}, marksG);

      star.innerHTML = starArt();
      var need = el('g', { display: 'none' }, g);
      markers.push({ p: p, g: g, art: art, star: star, badges: badges, need: need, v: vec(p.lat, p.lon), sx: 0, sy: 0, z: 0, k: 1 });
    });

  }
  // Beside each place, once Hoot has been there, what can be had there
  // (made things on gold); above it, a friend's wish.
  function refreshMarkers() {
    markers.forEach(function (m) {
      var id = m.p.id;
      if (visits(id) > 0) { m.star.removeAttribute('display'); } else { m.star.setAttribute('display', 'none'); }
      var s = '';
      if (saved.seen[id]) {

            + '<g transform="translate(0,10) scale(0.38)">' + itemArt(it) + '</g></g>';

  function refreshStars() { refreshMarkers(); }

  // ------------------------------------------------------------------
  // The globe's HUD: the satchel and Hoot's puff, bottom left, and what

  // ------------------------------------------------------------------
  var hud = { g: $('ovhud'), slots: [], feathers: null, goal: null };
  var SLOT_PX = 58;

  function bagArt(cap, slot, items, gap) {
    var w = cap * (slot + gap) + gap, h = slot + gap * 2;

      + '<rect x="0" y="-6" width="' + f2(w) + '" height="' + f2(slot * 0.3) + '" rx="' + f2(slot * 0.15) + '" fill="#a06a3a"/>'
      + '<circle cx="' + f2(w / 2) + '" cy="' + f2(slot * 0.16 - 6) + '" r="' + f2(slot * 0.08) + '" fill="#f2c033"/>';

      if (items[i]) { s += '<g transform="translate(' + f2(cx) + ',' + f2(cy + slot * 0.33) + ') scale(' + f2(slot * 0.66 / 64) + ')">' + itemArt(items[i]) + '</g>'; }
    }

  }
  function goalArt(w, h) {
    var c = chapter();

  }

  function layoutGlobeHud() {

      hud.goalSize = [gw, gh2];

  }
  // One feather for every thousand miles Hoot can manage. While a trip is
  // being planned, the feathers it would use turn gold, and any it would
  // need beyond what he has show as dashed outlines: that's the shortfall.
  function refreshFeathers() {
    if (!hud.feathers) { return; }
    var cost = sel ? tripCost(here, sel) : 0, s = '', n = Math.max(saved.puff, cost);
    for (var i = 0; i < n; i++) {
      var x = i * 20;
      if (i >= saved.puff) { s += '<g transform="translate(' + x + ',0)">' + featherArt('none', '#a8b0c8', true) + '</g>'; }
      else { s += '<g transform="translate(' + x + ',0)">' + featherArt(i < cost ? '#ffd34a' : '#f2e2c4', i < cost ? '#b07a10' : '#a87b55') + '</g>'; }
    }
    hud.feathers.innerHTML = s;
  }
  function showGoalZoom(on) {
    var z = $('cluezoom');
    clear(z);
    if (!on) { z.setAttribute('display', 'none'); return; }
    var w = Math.min(VW * 0.86, VH * 1.1, 560), h = w * 0.7, art = goalArt(w, h);
    if (!art) { z.setAttribute('display', 'none'); return; }
    z.setAttribute('data-hit', 'cluezoom');
    el('rect', { x: 0, y: 0, width: VW, height: VH, fill: '#05081a', opacity: 0.6 }, z);
    var g = el('g', { transform: 'translate(' + f2((VW - w) / 2) + ',' + f2((VH - h) / 2) + ') rotate(-2 ' + f2(w / 2) + ' ' + f2(h / 2) + ')' }, z);
    g.innerHTML = art;
    z.removeAttribute('display');
    SND.rustle();
  }
  function goalLine() {
    var c = chapter();
    if (!c) { return ''; }
    if (saved.chState === 'find') { return 'Where was Granny when she sent this one?'; }
    if (saved.chState === 'need') { return c.say.ask; }
    return '';
  }

  function layoutCounter() {
    clear(counterG);
    var w = 210, h = 56;
    counterG.setAttribute('transform', 'translate(' + f2(VW / 2) + ',' + f2(Math.min(84, VH * 0.1)) + ')');
    counterBox = el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: '#0f1a44', stroke: '#8fb0ff', 'stroke-width': 2.5, opacity: 0.92 }, counterG);
    // a dotted trail ending in a tiny Hoot, for "how far he's flown"
    var ic = el('g', { transform: 'translate(' + (-w / 2 + 34) + ',4) scale(0.42)' }, counterG);
    ic.innerHTML = '<path d="M-44 6 Q-30 -14 -12 -4" stroke="#fff6dc" stroke-width="5" stroke-dasharray="1 10" stroke-linecap="round" fill="none"/>' + hootArt();
    counterText = el('text', { x: 18, y: 12, 'font-size': 32, 'text-anchor': 'middle', fill: '#ffffff' }, counterG);
    counterText.textContent = '0';
  }
  function setCounter(n) {
    counterText.textContent = Math.round(n).toLocaleString('en-GB');
  }

  // ==================================================================
  // The state of play
  // ==================================================================
  var mode = 'globe';   // globe, fly, land, zoomIn, scene, zoomOut
  var modeT = 0;
  var here = 'leeds';
  var view = { lon: -1.5, lat: 30 }, goal = { lon: -1.5, lat: 30 };
  var fl = null, zoom = 0, sceneA = 0, counterA = 0, trailA = 0;
  var drag = null;
  var sel = null;          // the place picked for the next flight, shown as a ghost trail
  var fe = null;           // a ride home on a sea creature's back, after running out of puff
  var splash = null;       // where Hoot came down in the sea
  var pointArrow = null;   // which way a puzzled friend pointed: { from, to }
  var saidTooFar = false;
  var MAX_TURN = 150;   // degrees a second; a finger can't spin the world faster

  // Taps are rationed: each target has a cooldown, and no more than four
  // taps a second count for anything at all.
  var cool = {}, tapTimes = [];
  function tapOk(key, gap) {
    var t = performance.now() / 1000;
    if (cool[key] && t < cool[key]) { return false; }
    tapTimes = tapTimes.filter(function (x) { return t - x < 1; });
    if (tapTimes.length >= 4) { return false; }
    tapTimes.push(t);
    cool[key] = t + gap;
    return true;
  }

  function unlock() { initAudio(); warmSpeech(); }

  // The view turns towards its goal at a capped speed, so dragging can't
  // fling the globe and letting go stops it where it is.
  function steerView(dt, maxSpeed, rate) {
    var dl = wrap180(goal.lon - view.lon), dp = goal.lat - view.lat;
    var k = 1 - Math.exp(-rate * dt);
    var ml = dl * k, mp = dp * k, len = Math.sqrt(ml * ml + mp * mp), cap = maxSpeed * dt;
    if (len > cap) { ml *= cap / len; mp *= cap / len; }
    view.lon = wrap180(view.lon + ml);
    view.lat = clamp(view.lat + mp, -70, 70);
  }

  function tripMiles(fromId, toId) {
    var A = BYID[fromId], B = BYID[toId];
    return angBetween(vec(A.lat, A.lon), vec(B.lat, B.lon)) * EARTH_MILES;
  }
  // A feather for every thousand miles or part of one.
  function tripCost(fromId, toId) { return Math.ceil(tripMiles(fromId, toId) / 1000 - 1e-6); }

  function select(id) {
    sel = id;
    refreshFeathers();
    if (!id) { return; }
    gh.pop = 0.6;
    SND.pop(0.9);
    var short = tripCost(here, id) > saved.puff;
    setGear(gh, 'sweat', short);
    if (short) {
      gh.shiver = 0.6;
      if (!saidTooFar) { saidTooFar = true; narrate('That’s too far for one go!'); }
    }
  }

  function startFlight(toId) {
    var A = BYID[here], B = BYID[toId];
    var a = vec(A.lat, A.lon), b = vec(B.lat, B.lon), ang = angBetween(a, b), miles = ang * EARTH_MILES;
    var cost = Math.ceil(miles / 1000 - 1e-6);
    fl = {
      from: A.id, to: B, a: a, b: b, ang: ang, miles: Math.round(miles), t: 0, done: 0,
      dur: reduced ? 0.6 : clamp(1.4 + ang * R2D / 42, 2, 5.6), nextFlap: 0, px: 0, py: 0,
      carry: saved.bag.length > 0,
      // if he hasn't the puff for it, how far along he'll get
      runAt: cost > saved.puff ? saved.puff * 1000 / miles : 0
    };
    sel = null; pointArrow = null;
    setGear(gh, 'sweat', false);
    refreshFeathers();
    mode = 'fly'; modeT = 0;
    gh.flapAmp = 1; gh.pop = 1;
    SND.flap();
    SND.whoosh(fl.dur);
    setCounter(0);
    if (reduced) {
      var ll = latlon(b);
      view.lon = goal.lon = ll[1]; view.lat = goal.lat = clamp(ll[0], -62, 62);
    }
  }

  // He lands, wherever that turned out to be.
  function arriveAt(id, miles, fromId, carry) {
    saved.miles = Math.min(999999, Math.round(saved.miles + miles));
    if (carry && fromId && fromId !== id) {
      var key = [fromId, id].sort().join('|');
      if (saved.routes.indexOf(key) < 0) { saved.routes.push(key); }
    }
    here = id;
    saved.here = id;
    persist();
    SND.ding();
    gh.flapAmp = 0; gh.squash = 1; gh.lean = 0;
    mode = 'land'; modeT = 0;
  }

  function flyFrame(dt) {
    fl.t += dt;
    var k = clamp(fl.t / fl.dur, 0, 1), u = fl.tired ? k : smooth(k);
    var P = slerp(fl.a, fl.b, u);
    var c = norm(slerp(P, fl.b, 0.3)), ll = latlon(c);
    goal.lon = ll[1]; goal.lat = clamp(ll[0], -62, 62);
    if (!reduced) { steerView(dt, 220, 3.2); }
    fl.P = P;
    fl.lift = fl.tired ? 1 + 0.05 * (1 - k) : 1 + 0.16 * Math.sin(Math.PI * k);
    setCounter(fl.done + fl.miles * u);
    if (!reduced && fl.t > fl.nextFlap && fl.t < fl.dur - 0.3) { fl.nextFlap = fl.t + (fl.tired ? 1.1 : 0.75); SND.flap(); }
    if (fl.runAt && u >= fl.runAt) { puffedOut(); return; }
    if (fl.t >= fl.dur) {
      setCounter(fl.done + fl.miles);
      arriveAt(fl.to.id, fl.done + fl.miles, fl.from, fl.carry);
    }
  }

  // Out of puff. Over land, a weary glide down to the nearest place; over
  // the sea, a splash and a slow ride on a turtle's back (in warm water)
  // or a whale's (in cold) to the nearest coast. Never to where he was
  // going, however close: falling short has to cost a turn. It never
  // costs anything he's carrying, and it can't be hurried.
  function puffedOut() {
    var P = slerp(fl.a, fl.b, fl.runAt), flown = fl.miles * fl.runAt, N = nearestPlace(P, fl.to.id);
    var b = vec(N.lat, N.lon), ang = angBetween(P, b), miles = Math.round(ang * EARTH_MILES);
    narrate('Oh no! I’m all puffed out!');
    tone({ f: 900, f2: 280, d: 0.8, type: 'triangle', g: 0.08, a: 0.02, s: 0.2 });
    if (isLand(P)) {
      fl = {
        from: fl.from, to: N, a: P, b: b, ang: ang, miles: miles, t: 0, done: flown, tired: true,
        dur: reduced ? 0.6 : clamp(1.6 + ang * R2D / 14, 1.8, 4), nextFlap: 0, px: fl.px, py: fl.py, carry: fl.carry, runAt: 0
      };

    } else {

      for (var s = 1; s <= 60; s++) { if (isLand(slerp(P, b, s / 60))) { shore = s / 60; break; } }

        dur: reduced ? 1.2 : clamp(3 + swim * R2D / 5, 3.5, 9), kind: Math.abs(lat) < 35 ? 'turtle' : 'whale', px: 0, rest: shore < 1
      };

      fl = null;
      gh.flapAmp = 0;

      $('ferryg').innerHTML = fe.kind === 'turtle' ? turtleArt() : whaleArt();
    }
  }
  function turtleArt() {
    return '<g class="fe-body"><ellipse cx="0" cy="0" rx="34" ry="10" fill="#2f6aa8" opacity="0.35"/>'
      + '<ellipse cx="-30" cy="-6" rx="10" ry="7" fill="#7fb45a"/><circle cx="-34" cy="-8" r="1.8" fill="#1a1a1a"/>'
      + '<path d="M-14 0 l-8 8 M14 0 l8 8" stroke="#7fb45a" stroke-width="6" stroke-linecap="round"/>'
      + '<ellipse cx="2" cy="-8" rx="24" ry="13" fill="#5f8a3a"/>'
      + '<path d="M-14 -8 h32 M-6 -18 l-4 10 M8 -19 l4 11" stroke="#4a6e2c" stroke-width="2"/></g>';
  }
  function whaleArt() {
    return '<g class="fe-body"><ellipse cx="0" cy="2" rx="44" ry="10" fill="#2f6aa8" opacity="0.35"/>'
      + '<path d="M-40 0 Q-30 -26 6 -26 Q34 -26 40 -6 L56 -18 L52 0 L56 10 L40 2 Q20 6 -40 0 Z" fill="#33445a"/>'
      + '<path d="M-36 -2 Q0 4 34 -2" stroke="#c8d4e0" stroke-width="3" fill="none"/>'
      + '<circle cx="-26" cy="-12" r="2.2" fill="#ffffff"/>'
      + '<path d="M-6 -26 q-4 -10 -10 -12 M-6 -26 q2 -10 8 -12" stroke="#cfeaf8" stroke-width="3" fill="none" stroke-linecap="round"/></g>';
  }

  function ferryFrame(dt) {
    fe.t += dt;

    setCounter(fe.done + fe.miles * k);
    if (k >= 1) {
      $('ferryg').innerHTML = '';
      var f = fe;
      fe = null;
      if (!f.rest) { arriveAt(f.to.id, f.done + f.miles, f.from, f.carry); return; }
      // ashore: a weary flight the rest of the way
      var ang = angBetween(f.b, f.end);
      fl = {
        from: f.from, to: f.to, a: f.b, b: f.end, ang: ang, miles: Math.round(ang * EARTH_MILES), t: 0, done: f.done + f.miles, tired: true,
        dur: reduced ? 0.6 : clamp(1.6 + ang * R2D / 14, 1.8, 4), nextFlap: 0, px: 0, py: 0, carry: f.carry, runAt: 0
      };

    }
  }

  function hopIn() {
    fl = null;
    gh.pop = 1; gh.squash = 1;
    SND.flap();
    mode = 'land'; modeT = 0;
  }

  function beginZoomIn() {
    var p = BYID[here];
    mode = 'zoomIn'; modeT = 0;
    goal.lon = p.lon; goal.lat = clamp(p.lat, -62, 62);
    buildScene(p);
    scene.style.visibility = 'visible';
  }

  function beginZoomOut() {
    var p = BYID[here];
    mode = 'zoomOut'; modeT = 0;
    view.lon = goal.lon = p.lon; view.lat = goal.lat = clamp(p.lat, -62, 62);
    zoom = reduced ? 0 : 1;
    fl = null;
    gh.op = 1; gh.flapAmp = 0;
    setGear(gh, 'bag', saved.prologue);
    refreshMarkers();
    layoutGlobeHud();
  }

  function globeTap(x, y) {
    var R = GR, best = null, bd = 1e9;
    // the place under the finger, or Hoot himself
    markers.forEach(function (m) {
      if (m.z < 0.12) { return; }
      var cy = m.sy - 30 * m.k, dx = x - m.sx, dy = y - cy, dd = dx * dx + dy * dy;
      var rr = Math.max(44, 52 * m.k);
      if (dd < rr * rr && dd < bd) { bd = dd; best = m.p; }
    });
    if (!best) {
      var w = unproject(x, y, R);
      if (w) {
        var ba = 1e9;
        PLACES.forEach(function (p) {
          var a = angBetween(w, vec(p.lat, p.lon));
          if (a < ba) { ba = a; best = p; }
        });
      }
    }
    if (!best) {
      select(null);
      if (tapOk('space', 1)) { SND.hoot(); gh.pop = 1; gh.hootT = 0.95; }
      return;
    }
    if (!tapOk('globe', 0.4)) { return; }
    // Tap a place once to see the trip, again to go. Hoot's own place
    // takes him in.

  }

  over.addEventListener('pointerdown', function (e) {

    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false, lon0: view.lon, lat0: view.lat, hit: h ? h.getAttribute('data-hit') : null };
    try { over.setPointerCapture(e.pointerId); } catch (err) { /* not every browser */ }
  });

    if (drag.moved && !drag.hit) {

      goal.lat = clamp(drag.lat0 + dy / GR * R2D, -62, 62);

    if (d.hit === 'cluezoom') { showGoalZoom(false); return; }

  over.addEventListener('pointercancel', function (e) { endDrag(e, true); });
  over.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function updateMarkers(R, alpha) {
    var base = clamp(GR * 0.16, 34, 60) / 60;
    markers.forEach(function (m) {
      var q = project(m.v, R);
      m.sx = q.x; m.sy = q.y; m.z = q.z;
      var vis = smooth((q.z - 0.08) / 0.22) * alpha;
      // Hoot stands in for the marker of wherever he is
      if (m.p.id === here && mode !== 'fly') { vis = 0; }
      if (vis <= 0.01) { m.g.setAttribute('display', 'none'); return; }
      m.g.removeAttribute('display');
      m.k = base * (0.55 + 0.45 * q.z);
      // the place picked for the next flight bounces gently
      var bob = (m.p.id === sel && !reduced) ? 1 + 0.12 * Math.abs(Math.sin(modeT * 4)) : 1;
      m.g.setAttribute('transform', 'translate(' + f2(q.x) + ',' + f2(q.y) + ') scale(' + f2(m.k * bob) + ')');
      m.g.setAttribute('opacity', f2(vis));
    });
  }

  function hootOnGlobe(dt, R, alpha) {

    else if (mode === 'ferry' && fe && fe.P) { P = fe.P; lift = 1.012; }
    else { P = vec(BYID[here].lat, BYID[here].lon); }
    var q = project(P, R * lift);

    var vis = smooth((q.z + 0.05) / 0.2) * alpha;

      var vx = (q.x - fl.px) / Math.max(dt, 0.001);
      fl.px = q.x; fl.py = q.y;

      gh.lean *= 0.9;

    if (drag) { gh.lx = clamp((drag.x0 - q.x) / 200, -1, 1); }

      fe.px = q.x;
      var bob2 = reduced ? 0 : Math.sin(modeT * 3) * 1.5;
      fg.setAttribute('transform', 'translate(' + f2(q.x) + ',' + f2(q.y + 4 + bob2) + ') scale(' + f2((vx2 < 0 ? 1 : -1) * gh.s * 0.9) + ',' + f2(gh.s * 0.9) + ')');

    }
  }

  // A great-circle arc from a to b, between fractions f0 and f1, drawn
  // only where it's on the near side of the globe.
  function arcPath(a, b, f0, f1, R, lift, steps) {
    var d = '', pen = false;
    steps = steps || 40;
    for (var i = 0; i <= steps; i++) {
      var f = lerp(f0, f1, i / steps);
      var q = project(slerp(a, b, f), R * (1 + lift * Math.sin(Math.PI * f)));
      if (q.z < 0.02) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + f2(q.x) + ' ' + f2(q.y) + ' ';
      pen = true;
    }
    return d;
  }

  // The trip being planned: white as far as Hoot's puff will take him,
  // grey beyond, and a feather pip at every thousand miles.
  var pipNodes = [];
  function previewFrame(R, alpha) {
    var ok = $('pvok'), grey = $('pvgrey'), pips = $('pvpips');
    if (!sel || mode !== 'globe' || alpha <= 0) {
      ok.setAttribute('d', ''); grey.setAttribute('d', ''); pips.setAttribute('display', 'none');
      return;
    }
    var A = BYID[here], B = BYID[sel], a = vec(A.lat, A.lon), b = vec(B.lat, B.lon);
    var miles = angBetween(a, b) * EARTH_MILES, reach = Math.min(1, saved.puff * 1000 / miles), lift = 0.07;
    ok.setAttribute('d', arcPath(a, b, 0, reach, R, lift));
    grey.setAttribute('d', reach < 1 ? arcPath(a, b, reach, 1, R, lift) : '');
    pips.removeAttribute('display');
    var n = Math.ceil(miles / 1000 - 1e-6);
    while (pipNodes.length < n) { pipNodes.push(el('g', {}, pips)); }
    for (var i = 0; i < pipNodes.length; i++) {
      var g = pipNodes[i];
      if (i >= n) { g.setAttribute('display', 'none'); continue; }
      var f = Math.min(1, (i + 1) * 1000 / miles), q = project(slerp(a, b, f), R * (1 + lift * Math.sin(Math.PI * f)));
      if (q.z < 0.02) { g.setAttribute('display', 'none'); continue; }
      var inReach = i < saved.puff, want = inReach ? 'y' : 'n';
      if (g.getAttribute('data-k') !== want) {
        g.setAttribute('data-k', want);
        g.innerHTML = '<circle r="11" fill="' + (inReach ? '#fff6dc' : '#4a5270') + '" stroke="' + (inReach ? '#b07a10' : '#8a93b0') + '" stroke-width="1.5"/>'
          + '<g transform="translate(0,8) scale(0.5)">' + featherArt(inReach ? '#ffd34a' : 'none', inReach ? '#b07a10' : '#a8b0c8', !inReach) + '</g>';
      }
      g.removeAttribute('display');
      g.setAttribute('transform', 'translate(' + f2(q.x) + ',' + f2(q.y) + ')');
    }
  }

  // Every journey that carried something leaves a faint gold line: the
  // world getting more connected, one delivery at a time.
  function routesFrame(R, alpha) {
    var d = '';
    if (alpha > 0) {
      saved.routes.forEach(function (key) {
        var ab = key.split('|'), A = BYID[ab[0]], B = BYID[ab[1]];
        if (!A || !B) { return; }
        d += arcPath(vec(A.lat, A.lon), vec(B.lat, B.lon), 0, 1, R, 0.02, 32);
      });
    }
    $('routes').setAttribute('d', d);
  }

  // Which way a puzzled friend pointed: an arrow along the true bearing.
  function arrowFrame(R, alpha) {
    var g = $('arrowg');
    if (!pointArrow || mode !== 'globe' || alpha <= 0) { g.setAttribute('display', 'none'); return; }
    var A = BYID[pointArrow.from], B = BYID[pointArrow.to], a = vec(A.lat, A.lon), b = vec(B.lat, B.lon);
    var f1 = Math.min(1, 0.4 / Math.max(0.05, angBetween(a, b))), pts = [];
    for (var i = 0; i <= 16; i++) {
      var q = project(slerp(a, b, f1 * i / 16), R * 1.01);
      if (q.z < 0.02) { break; }
      pts.push(q);
    }
    if (pts.length < 3) { g.setAttribute('display', 'none'); return; }
    var d = 'M' + pts.map(function (q) { return f2(q.x) + ' ' + f2(q.y); }).join(' L');
    var e = pts[pts.length - 1], p = pts[pts.length - 3], ang = Math.atan2(e.y - p.y, e.x - p.x) * R2D;
    var pulse = reduced ? 1 : 0.7 + 0.3 * Math.sin(modeT * 4);
    g.innerHTML = '<path d="' + d + '" fill="none" stroke="#ff9a3a" stroke-width="5" stroke-linecap="round" opacity="' + f2(pulse) + '"/>'
      + '<path d="M0 -11 L18 0 L0 11 Z" fill="#ff9a3a" transform="translate(' + f2(e.x) + ',' + f2(e.y) + ') rotate(' + f2(ang) + ')" opacity="' + f2(pulse) + '"/>';
    g.removeAttribute('display');
  }

  function splashFrame(dt, R) {
    var g = $('splashg');
    if (!splash) { g.innerHTML = ''; return; }
    splash.t += dt;
    var q = project(splash.P, R);
    if (splash.t > 1.4 || q.z < 0.02) { if (splash.t > 1.4) { splash = null; } g.innerHTML = ''; return; }
    var s = '';
    for (var i = 0; i < 3; i++) {
      var k = clamp((splash.t - i * 0.18) / 1, 0, 1);
      if (k <= 0) { continue; }
      s += '<ellipse cx="' + f2(q.x) + '" cy="' + f2(q.y) + '" rx="' + f2(6 + k * 34) + '" ry="' + f2(3 + k * 12) + '" fill="none" stroke="#ffffff" stroke-width="3" opacity="' + f2(1 - k) + '"/>';
    }
    g.innerHTML = s;
  }

  function trailFrame(R) {
    if (mode === 'fly' && fl) { trailA = Math.min(1, trailA + 0.08); }
    else { trailA = Math.max(0, trailA - 0.02); }
    trailEl.setAttribute('opacity', f2(trailA * 0.9 * clamp(1 - zoom * 3, 0, 1)));
    if (trailA <= 0 || !fl || !fl.P) { if (trailA <= 0) { trailEl.setAttribute('d', ''); } return; }

    var kmax = clamp(fl.t / fl.dur, 0, 1), umax = smooth(kmax);

      pen = true;
    }
    trailEl.setAttribute('d', d);
  }

  function globeFrame(dt) {
    modeT += dt;
    if (mode === 'globe') {
      steerView(dt, MAX_TURN, drag ? 14 : 8);
    } else if (mode === 'fly') {
      flyFrame(dt);
    } else if (mode === 'ferry') {
      ferryFrame(dt);
    } else if (mode === 'land') {
      if (modeT > (reduced ? 0.15 : 0.5)) { beginZoomIn(); }
    } else if (mode === 'zoomIn') {

    counterG.setAttribute('opacity', f2(counterA));

    routesFrame(R, mA);
    updateMarkers(R, mA);
    hootOnGlobe(dt, R, mA);
    trailFrame(R);
    previewFrame(R, mA);
    arrowFrame(R, mA);
    splashFrame(dt, R);

  // ==================================================================
  // Scenes
  // ==================================================================
  var S = null;
  var propsG = $('sc-props'), animalG = $('sc-animal'), hootG = $('sc-hoot'), partsG = $('sc-parts'), bubbleG = $('sc-bubble');
  var HOOT_X = 350, HOOT_Y = 528, HOOT_S = 2.1;

  function later(sec, fn) { if (S) { S.q.push({ at: S.time + sec, fn: fn }); } }

  function buildScene(p) {
    S = {
      place: p, time: 0, q: [], phase: 'pre', phaseT: 0, hoot: null, animal: null, props: [], parts: [], wx: [],
      bubble: null, greeted: false, ready: false, nightV: -1, elev: 0, raining: false, rainT: 0, card: null,
      sleepyHello: false, lookAt: null, nextShiver: 4, nextFan: 3, nextZ: 0, home: null, lampOn: true,
      tw: [], busy: false, piles: [], thought: null, swap: null, storyStarted: false, hinted: false
    };

    if (saved.prologue && !p.home && !saved.seen[p.id]) { saved.seen[p.id] = true; persist(); }
    var defs = p.defs ? p.defs() : '';
    $('sc-defs').innerHTML = defs ? (dayify(defs) + nightDefs(defs)) : '';
    ['sc-back', 'sc-ground', 'sc-dev', 'sc-props', 'sc-piles', 'sc-animal', 'sc-hoot', 'sc-front', 'sc-glow', 'sc-parts', 'sc-bubble', 'sc-thought', 'sc-ui', 'sc-fly', 'sc-skyfx', 'sc-home'].forEach(function (id) { clear($(id)); });
    if (p.home) {
      $('sc-stage').setAttribute('display', 'none');
      $('sc-home').removeAttribute('display');
      S.home = { cards: [] };
    } else {
      $('sc-stage').removeAttribute('display');
      $('sc-home').setAttribute('display', 'none');
      $('sc-back').innerHTML = dn(p.back());
      $('sc-ground').innerHTML = dn(p.ground());
      $('sc-front').innerHTML = p.front ? dn(p.front()) : '';
      $('sc-glow').innerHTML = p.glow ? dayify(p.glow()) : '';
      $('sc-skyfx').innerHTML = p.sky ? dn(p.sky()) : '';
      (p.props || []).forEach(function (pr) {
        var g = el('g', { 'data-hit': 'prop:' + pr.id, transform: 'translate(' + pr.x + ',' + pr.y + ')' }, propsG);
        var inner = el('g', {}, g);
        inner.innerHTML = dn(pr.art());
        el('rect', { class: 'hit', x: pr.hit[0], y: pr.hit[1], width: pr.hit[2], height: pr.hit[3] }, g);
        S.props.push({ sp: pr, g: g, inner: inner, t: 99, active: false, st: {}, q: function (c) { return list(inner, '.' + c); } });
      });
      S.animal = makeAnimal(p.animal);
      S.hoot = makeHoot(hootG, true);
      el('rect', { class: 'hit', x: -38, y: -78, width: 76, height: 84 }, S.hoot.g);
      S.hoot.g.setAttribute('data-hit', 'hoot');
      S.hoot.x = -200; S.hoot.y = -200; S.hoot.s = HOOT_S; S.hoot.op = 0;
      setGear(S.hoot, 'bag', saved.prologue);

    }
    startBed(p.bed);
    sceneLayout();
    skyFrame();
  }

  function endScene() {
    stopBed();

    S = null;
    scene.style.visibility = 'hidden';
    scene.style.opacity = '0';
    ['sc-back', 'sc-ground', 'sc-dev', 'sc-props', 'sc-piles', 'sc-animal', 'sc-hoot', 'sc-front', 'sc-glow', 'sc-parts', 'sc-bubble', 'sc-thought', 'sc-ui', 'sc-fly', 'sc-hud', 'sc-skyfx', 'sc-home', 'sc-stars'].forEach(function (id) { clear($(id)); });
  }

  // Stars over the scene, and the right constellation for the hemisphere:
  // the Plough in the north, the Southern Cross in the south.
  function buildStars() {

    clear(g);
    if (!S) { return; }
    var hy = S.place.home ? SH : stage.hy, seed = 11, s = '';
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < 90; i++) {
      var x = rnd() * 1000, y = rnd() * (hy - 40);
      s += '<circle cx="' + f2(x) + '" cy="' + f2(y) + '" r="' + f2(rnd() < 0.1 ? 2.4 : 0.9 + rnd() * 1.1) + '" fill="#eef2ff" opacity="' + f2(0.45 + rnd() * 0.55) + '"/>';
    }
    var cx = 690, cy = Math.max(70, hy * 0.25), pts, lines;
    if (S.place.lat >= 0) {
      pts = [[-70, -10], [-40, 4], [-12, 8], [14, 12], [20, 40], [60, 44], [64, 14]];
      lines = 'M-70 -10 L-40 4 L-12 8 L14 12 L20 40 L60 44 L64 14 L14 12';
      s += '<circle cx="' + (cx + 110) + '" cy="' + (cy - 50) + '" r="3" fill="#fff6e6"/>';
    } else {
      pts = [[0, -40], [0, 34], [-24, 0], [22, -6], [10, 14]];
      lines = 'M0 -40 L0 34 M-24 0 L22 -6';
      s += '<circle cx="' + (cx - 90) + '" cy="' + (cy + 40) + '" r="2.8" fill="#fff6e6"/><circle cx="' + (cx - 60) + '" cy="' + (cy + 52) + '" r="2.4" fill="#fff6e6"/>';
    }
    s += '<path d="' + lines + '" transform="translate(' + cx + ',' + cy + ')" stroke="#c9d4ff" stroke-width="1.4" fill="none" opacity="0.55"/>';
    pts.forEach(function (q) { s += '<circle cx="' + (cx + q[0]) + '" cy="' + (cy + q[1]) + '" r="3.2" fill="#ffffff"/>'; });
    g.innerHTML = s;
  }

  var SKY_KEYS = [[-12, '#060b24', '#111c4a'], [-5, '#1b2858', '#43407a'], [-1.5, '#34477f', '#ee8a5e'], [3, '#5c86c9', '#ffc887']];
  function skyCols(e, p) {
    var D = p.skyDay || ['#4c9fe6', '#cfe9fb'];
    var K = SKY_KEYS.concat([[11, D[0], D[1]]]);
    if (e <= K[0][0]) { return [K[0][1], K[0][2]]; }
    for (var i = 1; i < K.length; i++) {
      if (e <= K[i][0]) {
        var t = (e - K[i - 1][0]) / (K[i][0] - K[i - 1][0]);
        return [mixc(K[i - 1][1], K[i][1], t), mixc(K[i - 1][2], K[i][2], t)];
      }
    }
    return D;
  }

  function skyFrame() {
    var p = S.place, e = sunElev(p.lat, p.lon), H = hourAngle(p.lon);
    S.elev = e;
    var cols = skyCols(e, p);
    $('sc-s0').setAttribute('stop-color', cols[0]);
    $('sc-s1').setAttribute('stop-color', cols[1]);
    var n = smooth((2 - e) / 12);
    if (Math.abs(n - S.nightV) > 0.004) {
      S.nightV = n;
      scene.style.setProperty('--n', n.toFixed(3));
      scene.style.setProperty('--nc', (n * 0.72).toFixed(3));
      scene.style.setProperty('--d', (1 - n).toFixed(3));
    }
    $('sc-stars').setAttribute('opacity', f2(smooth((-3 - e) / 8)));
    var hy = p.home ? SH * 0.5 : stage.hy, south = p.lat < 0 ? -1 : 1;
    var sun = $('sc-sun'), moon = $('sc-moon');
    var sx = 500 + Math.sin(H * D2R) * 380 * south, sy = hy - clamp(e / 60, -0.3, 1) * (hy - 70);
    sun.setAttribute('transform', 'translate(' + f2(sx) + ',' + f2(sy) + ')');
    sun.setAttribute('opacity', e > -4 ? '1' : '0');
    var me = moonElev(p.lat, p.lon);
    var mx = 500 + Math.sin((H + 180) * D2R) * 380 * south, my = hy - clamp(me / 60, -0.3, 1) * (hy - 70);
    moon.setAttribute('transform', 'translate(' + f2(mx) + ',' + f2(my) + ')');
    moon.setAttribute('opacity', me > -4 ? f2(0.25 + 0.75 * n) : '0');
    var warm = Math.exp(-(e - 1) * (e - 1) / 20) * 0.15;
    $('sc-warm').setAttribute('opacity', f2(p.home ? 0 : warm));
  }

  // ------------------------------------------------------------------
  // Animals. Each is drawn facing left, towards Hoot, with its feet at the
  // origin, and with named parts the engine can turn: p-head, p-tail, p-arm,
  // p-arm2, p-ears, p-x1..p-x3 rotate about the pivots the animal gives;
  // p-mouth and p-eyes open and close. An animal's own act() poses it for
  // its trick, and it may pose its greeting, busy and sleeping states too.
  // ------------------------------------------------------------------
  var PARTS = ['head', 'tail', 'arm', 'arm2', 'ears', 'x1', 'x2', 'x3'];

  function makeAnimal(sp) {
    var node = el('g', { 'data-hit': 'animal' }, animalG);
    var flip = el('g', {}, node), bob = el('g', {}, flip);
    var art = sp.art();
    bob.innerHTML = '<g>' + dayify(art) + '</g><g class="ntc">' + nightify(art) + '</g>';
    el('rect', { class: 'hit', x: sp.hit[0], y: sp.hit[1], width: sp.hit[2], height: sp.hit[3] }, node);
    var parts = {};
    PARTS.concat(['mouth', 'eyes']).forEach(function (k) {
      var l = list(bob, '.p-' + k);
      if (l.length) { parts[k] = l; }
    });
    var asleep = wantsSleep(sp, sunElev(S.place.lat, S.place.lon), false);
    var A = {
      sp: sp, node: node, flip: flip, bob: bob, parts: parts,
      x: sp.x || 610, y: sp.y || 532, s: sp.scale || 1,
      face: asleep ? 1 : (sp.busyFace == null ? -1 : sp.busyFace), faceGoal: 0,
      mode: asleep ? 'sleep' : 'busy', mt: 0, T: Math.random() * 10, talk: 0, blink: 2, blinkV: 1,
      idleFor: 0, awakeUntil: 0, after: 'idle', st: {}
    };
    A.faceGoal = A.face;
    return A;
  }
  function wantsSleep(sp, e, asleep) {
    if (sp.nocturnal) { return asleep ? e > 2 : e > 6; }
    return asleep ? e < -2 : e < -6;
  }
  function setMode(A, m) {
    A.mode = m; A.mt = 0; A.idleFor = 0; A.st = {};
    if (m === 'turn') { A.faceGoal = 1; }
  }
  // A point drawn in the animal's own coordinates, in stage coordinates.
  function animalPoint(A, x, y) {
    var f = A.face >= 0 ? 1 : -1;
    return { x: A.x + x * A.s * f * Math.max(0.05, Math.abs(A.face)), y: A.y + y * A.s };
  }
  // The same, for a point on a part that has been turned about its pivot.
  function partPoint(A, x, y, deg, pv) {
    var a = deg * D2R, dx = x - pv[0], dy = y - pv[1];
    return animalPoint(A, pv[0] + dx * Math.cos(a) - dy * Math.sin(a), pv[1] + dx * Math.sin(a) + dy * Math.cos(a));
  }

  function poseAnimal(A, dt) {
    var sp = A.sp, m = A.mode, t, calm = reduced ? 0 : 1;
    A.mt += dt; A.T += dt; t = A.mt;
    var T = A.T;
    var P = { head: 0, tail: 0, arm: 0, arm2: 0, ears: 0, x1: 0, x2: 0, x3: 0, mouth: 0, eyes: 1, bx: 0, by: 0, br: 0, bcx: 0, bcy: 0, bsx: 1, bsy: 1 };
    P.bsy = 1 + Math.sin(T * 2.1) * 0.012 * calm;
    P.tail = Math.sin(T * 2.4) * 7 * calm;
    if (m === 'busy') {
      P.head = sp.busyHead || 0;
      P.mouth = (Math.sin(T * 9) > 0.2 ? 0.35 : 0) * calm;
      if (sp.busy) { sp.busy(A, t, P); }
    } else if (m === 'turn') {
      P.head = lerp(sp.busyHead || 0, 0, smooth(t / 0.4));
      P.by = -Math.sin(Math.PI * clamp(t / 0.4, 0, 1)) * 10 * calm;
      if (t >= 0.45) { setMode(A, 'greet'); }
    } else if (m === 'greet' || m === 'bye') {
      P.head = sp.greetHead || -6;
      if (sp.wave) { P.arm = sp.wave[0] + Math.sin(t * 11) * sp.wave[1]; }
      if (t < 0.6) { P.by = -Math.abs(Math.sin(t * 5)) * 6 * calm; }
      if (sp.greet) { sp.greet(A, t, P); }

  // Weather that fills the view: snow, rain and falling leaves, recycled.

      if (kind === 'rain') {

  // ------------------------------------------------------------------

  function tween(dur, fn, done) {

  }
  function tweenFrame(dt) {
    for (var i = S.tw.length - 1; i >= 0; i--) {

  // ------------------------------------------------------------------

  // Picking up from a basket. If the satchel's full, Hoot shakes his head

    var made = madeAt(p.id);
    if (made) {

      if (A.mode === 'sleep') { A.after = 'idle'; A.awakeUntil = S.time + 14; setMode(A, 'yawn'); }

  // ------------------------------------------------------------------
  // What happens in a scene, in order: Hoot glides in and lands, the
  // animal turns to him (waking first if it's asleep) and says hello, Hoot
  // hoots back. Then it's the child's to play with until Hoot is tapped.
  // ------------------------------------------------------------------
  function startArrival() {
    if (!S) { return; }
    S.phase = 'arrive'; S.phaseT = 0;
    if (S.place.home) { S.path = homeArrivalPath(); }
    else {
      S.path = { x0: stage.x0 - 90, y0: stage.y0 + 120, x1: HOOT_X, y1: HOOT_Y };
    }
    var H = S.hoot;
    H.op = 1; H.flapAmp = 1;
    if (reduced) {
      H.x = S.path.x1; H.y = S.path.y1; H.flapAmp = 0;
      S.phase = 'landed';
    }
    SND.flap();
  }

  function greetNow() {
    var p = S.place, A = S.animal, sleepy = S.sleepyHello;
    var callDur = p.animal.call ? (p.animal.call(now(), sleepy) || 0.6) : 0.6;
    A.talk = callDur;
    later(callDur + 0.15, function () {
      var d = sayHello(p, sleepy);

      showBubble();
      later(d + 0.35, function () {
        var H = S.hoot;
        SND.hoot();
        H.pop = 1; H.hootT = 0.95; H.wave = 1.2;

    });
  }

  function hootFlight(dt) {
    var H = S.hoot, P = S.path;
    if (S.phase === 'arrive') {
      S.phaseT += dt;
      var k = clamp(S.phaseT / 1.3, 0, 1), u = easeOut(k);
      H.x = lerp(P.x0, P.x1, u);
      H.y = lerp(P.y0, P.y1, u) - Math.sin(Math.PI * u) * 60;
      H.lean = (1 - k) * 12;
      if (k >= 1) {
        S.phase = 'landed'; S.phaseT = 0;
        H.flapAmp = 0; H.squash = 1; H.lean = 0;
        SND.thump();
      }
    } else if (S.phase === 'leave') {
      S.phaseT += dt;
      var k2 = clamp(S.phaseT / 1.1, 0, 1), u2 = easeIn(k2);
      H.x = lerp(P.x1, P.x2, u2);
      H.y = lerp(P.y1, P.y2, u2);
      H.lean = -10 * k2;
      if (k2 >= 1 && S.phase === 'leave') {

      }
    }
  }

  function leaveScene() {
    var H = S.hoot;
    S.phase = 'leave'; S.phaseT = 0;
    H.flapAmp = 1; H.pop = 1;
    SND.flap(); SND.hoot();
    H.hootT = 0.95;
    if (S.place.home) {
      S.path = { x1: H.x, y1: H.y, x2: H.x + 300, y2: -160 };
    } else {
      S.path = { x1: H.x, y1: H.y, x2: stage.x1 + 120, y2: stage.y0 - 60 };
      // a trick in progress finishes first, so nobody is left hanging mid-air
      var A = S.animal;
      if (A && A.mode !== 'sleep' && A.mode !== 'act') { setMode(A, 'bye'); A.faceGoal = 1; }
      clear(bubbleG); S.bubble = null;
      clear($('sc-thought')); S.thought = null;
      S.swap = null;

  }
  // Hoot's own postcard from a place comes the first time he leaves it.
  function leaveDone() {
    if (!S.place.home && visits(S.place.id) === 0) { startCard(S.place); } else { beginZoomOut(); }
  }

  function stageFrame(dt) {
    var p = S.place, A = S.animal, H = S.hoot, e = S.elev;
    hootFlight(dt);
    if (S.phase === 'landed') {
      S.phaseT += dt;
      if (!S.greeted) {
        if (A.mode === 'sleep') {
          if (S.phaseT > 0.5 && !S.st_hoot) { S.st_hoot = true; SND.hoot(0, 0.9); H.pop = 1; H.hootT = 0.95; }
          if (S.phaseT > 1.5 && !S.st_woke) {
            S.st_woke = true; S.sleepyHello = true;
            A.after = 'turn'; A.awakeUntil = S.time + 14;
            setMode(A, 'yawn');
            if (A.sp.yawnK) { SND.yawn(0, A.sp.yawnK); }
          }
        } else if (A.mode === 'busy' && S.phaseT > 0.25) {
          setMode(A, 'turn');
        } else if (A.mode === 'greet') {
          S.greeted = true;
          greetNow();
        }
      } else if (S.ready) {
        // sleep when it's night (or day, for a kiwi), wake when it isn't
        if (A.mode === 'sleep' && !wantsSleep(A.sp, e, true)) { A.after = 'idle'; setMode(A, 'yawn'); }
        else if (A.mode === 'idle' && A.idleFor > 9 && S.time > A.awakeUntil && wantsSleep(A.sp, e, false)) {
          A.after = 'sleep'; setMode(A, 'yawn');
          if (A.sp.yawnK) { SND.yawn(0, A.sp.yawnK); }
        }
      }
      // weather manners
      if (p.climate === 'cold' && S.time > S.nextShiver) { S.nextShiver = S.time + 6 + Math.random() * 4; H.shiver = 0.6; }
      if (p.climate === 'hot' && e > 2 && S.time > S.nextFan) { S.nextFan = S.time + 7 + Math.random() * 4; H.fan = 1.1; }
      // once hellos are done, the story has its turn
      if (S.ready && !S.storyStarted) { S.storyStarted = true; arrivalStory(); }
    }
    // a full satchel waits a few seconds to be told what to put back
    if (S.swap && S.time > S.swap.until) { S.swap = null; }
    if (shud.g) {
      var wig = S.swap && !reduced ? Math.sin(S.time * 18) * 2.5 : 0;
      shud.g.setAttribute('transform', 'translate(' + f2(shud.x0) + ',' + f2(shud.y0) + ') rotate(' + f2(wig) + ')');
    }
    if (S.phase === 'landed' || S.phase === 'leave') {
      var hot = p.climate === 'hot' && e > 2;
      var gearOn = {
        shades: hot && !S.raining,
        hat: p.climate === 'cold',
        scarf: p.climate === 'cold' || p.climate === 'cool',
        leaf: !!S.raining

      Object.keys(gearOn).forEach(function (k) {
        if (!!H.gear[k] !== gearOn[k]) { setGear(H, k, gearOn[k]); if (gearOn[k] && S.phase === 'landed') { SND.pop(1.2); } }

    // rain comes and goes

      S.raining = (S.rainT % 30) > 17 || !!S.forceRain;
      if (S.forceRain && S.rainT > S.forceRain) { S.forceRain = 0; }
      if (S.raining !== was) { if (S.raining) { startRainSound(); } else { stopRainSound(); } }
    }

    H.lx = lerp(H.lx, clamp((look.x - H.x) / 160, -1, 1), 0.15);
    H.ly = lerp(H.ly, clamp((look.y - (H.y - 80)) / 200, -1, 1), 0.15);
    poseHoot(H, dt);
    if (A) {
      poseAnimal(A, dt);
      if (A.mode === 'sleep' && !reduced && S.time > S.nextZ) {
        S.nextZ = S.time + 1.3;
        var z = animalPoint(A, (A.sp.zz || [-40, -160])[0], (A.sp.zz || [-40, -160])[1]);
        spawn({ kind: 'z', x: z.x, y: z.y, vx: 14, vy: -26, life: 2.4, r: 24 + Math.random() * 10, fill: '#ffffff', sway: 10, op: 0.9 });

  var rainNode = null;

  function sceneTap(key) {
    if (!S || S.phase === 'pre' || S.phase === 'arrive' || S.phase === 'leave' || S.phase === 'gone' || S.card) { return; }
    var p = S.place, A = S.animal, H = S.hoot;
    var slot = key.indexOf('slot:') === 0;
    if (S.swap && !slot) { S.swap = null; }
    if (key === 'hoot') {
      if (S.ready && !S.busy) { if (tapOk('hoot-go', 2)) { leaveScene(); } }
      else if (tapOk('hoot', 0.9)) { SND.hoot(); H.pop = 1; H.hootT = 0.95; }

      var i = +key.slice(5);
      if (S.swap) { swapOut(i); } else { offer(i); }
      return;

        setMode(A, 'act');
        A.awakeUntil = S.time + 14;
        if (room()) { hold(1); A.talk = (p.animal.call(now(), false) || 0.6) * 0.8; }
        H.pop = 0.6;
      }
      return;
    }
    if (key === 'bubble') {
      if (!S.bubble || !tapOk('bubble', 2)) { return; }
      S.bubble.pop = 1;
      if (A.mode === 'sleep') { return; }

      return;
    }
    if (key.indexOf('prop:') === 0) {

      S.props.forEach(function (x) { if (x.sp.id === id) { pr = x; } });

      pr.t = 0; pr.active = true;
      S.lookAt = { x: pr.sp.x, y: pr.sp.y - 80, until: S.time + 2 };

  function prologueFrame(dt) {
    var P = S.pro, ob = S.home.oldbag, r = S.home.rug;
    if (!ob) { return; }
    P.t += dt;
    if (P.stage === 'wait') {
      ob.setAttribute('transform', 'translate(' + f2(r.x) + ',-300)');
      if (P.t > 1.2) { P.stage = 'drop'; P.t = 0; SND.whoosh(0.5); }
    } else if (P.stage === 'drop') {
      var k = clamp(P.t / 0.6, 0, 1), y = lerp(-300, r.y, easeIn(k));
      ob.setAttribute('transform', 'translate(' + f2(r.x) + ',' + f2(y) + ')');
      if (k >= 1) { P.stage = 'rest'; P.t = 0; SND.thump(); S.hoot.pop = 1; S.hoot.hootT = 0.95; SND.hoot(now() + 0.3); }
    } else if (P.stage === 'rest') {

  // Opening Granny's satchel: her postcards and her letter come out, go
  // up on the board, and the satchel goes on Hoot.
  function openSatchel() {
    var P = S.pro, ob = S.home.oldbag, r = S.home.rug;
    P.stage = 'open';
    SND.rustle();
    var flap = list(ob, '.ob-flap');
    tween(0.4, function (k) { setAll(flap, 'rotate(' + f2(-150 * k) + ' 0 -86) '); });
    var cards = el('g', {}, $('sc-fly')), w = 150, h = 105, n = 4;
    var made = [];
    for (var i = 0; i < n; i++) {
      var cg = el('g', {}, cards);
      cg.innerHTML = i === 0 ? fadedCard(CHAPTERS[0], w, h) : cardStackArt(w, h * 1.16);
      made.push(cg);
    }
    var lg = el('g', {}, cards);
    lg.innerHTML = letterArt(w * 0.9, w * 0.9 * 0.62);
    tween(0.9, function (k) {
      var u = easeOut(k);
      made.forEach(function (cg, j) {
        var a = (j - (n - 1) / 2) * 22 * u, x = r.x - w / 2 + Math.sin(a * D2R) * 180 * u, y = r.y - 90 - (240 - Math.abs(j - 1.5) * 30) * u;
        cg.setAttribute('transform', 'translate(' + f2(x) + ',' + f2(y) + ') rotate(' + f2(a) + ' ' + f2(w / 2) + ' ' + f2(h / 2) + ') scale(' + f2(0.3 + 0.7 * u) + ')');
      });
      lg.setAttribute('transform', 'translate(' + f2(r.x - w * 0.45) + ',' + f2(r.y - 60 - 80 * u) + ') scale(' + f2(0.3 + 0.5 * u) + ')');
    });
    var d1 = narrate('Granny’s old satchel! She flew all over the world.');
    later(Math.max(1.4, d1), function () {
      // the letter comes to the front
      SND.sparkle();
      tween(0.6, function (k) {
        var u = easeOut(k);
        lg.setAttribute('transform', 'translate(' + f2(lerp(r.x - w * 0.45, 500 - w * 0.9 * 0.6, u)) + ',' + f2(lerp(r.y - 140, SH * 0.3, u)) + ') scale(' + f2(lerp(0.8, 1.35, u)) + ')');
      });
      var d2 = narrate('Her postcards… and a letter she never delivered.');
      later(Math.max(1.6, d2 + 0.3), function () {
        removeLater(cards, 0.5);
        saved.prologue = true;
        saved.pieces |= (1 << HOME_PIECE);
        saved.chState = 'find';
        persist();
        // the satchel goes onto Hoot
        var start = { x: r.x, y: r.y - 50 }, end = { x: S.hoot.x, y: S.hoot.y - 40 };
        if (ob.parentNode) { ob.parentNode.removeChild(ob); }
        S.home.oldbag = null;
        flyThing(oldBagArt(), start, end, 1, 0.3, 0.7, function () {
          S.pro = null;
          layoutHome();
          layoutSceneHud();
          layoutGlobeHud();
          S.hoot.pop = 1;
          SND.chime();
          var g = S.home.board;
          if (g) { g.setAttribute('opacity', '0'); tween(0.6, function (k) { g.setAttribute('opacity', f2(k)); }); }
          var d3 = narrate('Where was Granny when she sent this one?');
          later(d3, function () { S.busy = false; });
        });
      });
    });
  }

  // A closer look at the postcard or the letter, over everything.
  function showHomeZoom(what) {
    var z = el('g', { 'data-hit': 'zoom' }, $('sc-fly'));
    var w = Math.min(760, SH * 0.62 * 1.4), h = what === 'letter' ? w * 0.62 : w * 0.7;
    el('rect', { x: 0, y: 0, width: 1000, height: SH, fill: '#05081a', opacity: 0.55 }, z);
    var g = el('g', { transform: 'translate(' + f2((1000 - w) / 2) + ',' + f2((SH - h) / 2) + ') rotate(-2 ' + f2(w / 2) + ' ' + f2(h / 2) + ')' }, z);
    g.innerHTML = what === 'letter' ? letterArt(w, h) : (goalArt(w, h) || cardStackArt(w, h));
    S.zoomed = z;
    SND.rustle();
  }
  function showConfirm() {
    var z = el('g', {}, $('sc-fly'));
    el('rect', { x: 0, y: 0, width: 1000, height: SH, fill: '#05081a', opacity: 0.6, 'data-hit': 'confirm-no' }, z);
    var px = 500, py = SH / 2, pg = el('g', { transform: 'translate(' + px + ',' + f2(py) + ')' }, z);
    pg.innerHTML = '<rect x="-230" y="-110" width="460" height="220" rx="26" fill="#fffaf0" stroke="#c8b48c" stroke-width="3"/>'
      + '<g data-hit="confirm-yes"><rect x="-200" y="-30" width="180" height="70" rx="35" fill="#d9434e"/><text x="-110" y="14" font-size="24" text-anchor="middle" fill="#ffffff">Start again</text></g>'
      + '<g data-hit="confirm-no"><rect x="20" y="-30" width="180" height="70" rx="35" fill="#5fb85a"/><text x="110" y="14" font-size="24" text-anchor="middle" fill="#ffffff">Keep playing</text></g>';
    S.confirm = z;
  }

  function homeFrame(dt) {
    var H = S.hoot, h = S.home;
    hootFlight(dt);
    if (S.phase === 'landed') {
      S.phaseT += dt;
      if (!S.ready && S.phaseT > 0.4 && saved.prologue && !S.busy) { S.ready = true; }
    }
    var n = S.nightV;
    h.dim.setAttribute('opacity', f2(n * (S.lampOn ? 0.12 : 0.5)));
    h.glow.setAttribute('opacity', f2(S.lampOn ? 0.45 + 0.55 * n : 0));
    h.shade.setAttribute('fill', S.lampOn ? '#f4c96b' : '#c9b28a');
    if (S.pro) { prologueFrame(dt); }
    // the reset takes a two-second hold
    if (h.resetBar) {
      if (S.resetHold) {
        S.resetHold.t += dt;
        h.resetBar.setAttribute('width', f2(142 * clamp(S.resetHold.t / 2, 0, 1)));
        if (S.resetHold.t >= 2) { S.resetHold = null; showConfirm(); }
      } else { h.resetBar.setAttribute('width', '0'); }
    }
    // Hoot keeps an eye on the satchel, the board, and the window at night
    if (h.oldbag) { H.lx = lerp(H.lx, 0.9, 0.08); H.ly = lerp(H.ly, 0.8, 0.08); }
    else { H.lx = lerp(H.lx, n > 0.5 ? -0.6 : 0.8, 0.05); H.ly = lerp(H.ly, -0.4, 0.05); }
    // once he has somewhere to go, he's eager to be off
    if (S.ready && !S.busy && saved.prologue && !reduced && (S.time % 6) < 0.05) { H.wave = 0.6; }
    poseHoot(H, dt);
    bedFrame(n);
  }

  function homeTap(key) {
    if (S.confirm) {
      var z = S.confirm;
      S.confirm = null;
      if (z.parentNode) { z.parentNode.removeChild(z); }
      if (key === 'confirm-yes') { startAgain(); }
      return;
    }
    if (S.zoomed) {
      var zz = S.zoomed;
      S.zoomed = null;
      if (zz.parentNode) { zz.parentNode.removeChild(zz); }
      return;
    }
    if (key === 'reset') { S.resetHold = { t: 0 }; return; }
    if (key === 'lamp') {
      if (!tapOk('lamp', 0.5)) { return; }
      S.lampOn = !S.lampOn;
      SND.click();
      if (!S.lampOn) { S.hoot.pop = 1; }
      return;
    }
    if (key === 'oldbag') {
      if (S.pro && S.pro.stage === 'rest' && tapOk('oldbag', 1)) { openSatchel(); }
      return;
    }
    if (!saved.prologue || S.busy) { return; }
    if (key === 'goal' && tapOk('goal', 1)) { showHomeZoom('goal'); narrate(goalLine()); return; }
    if (key === 'letter' && tapOk('letter', 1.5)) { showHomeZoom('letter'); narrate('Who wrote this letter? And who is it for?'); return; }
    if (key === 'map' && tapOk('map', 2)) { S.hoot.pop = 1; narrate('Granny’s old map. So many pieces missing!'); }
  }

  // ==================================================================
  // The frame loop
  // ==================================================================
  var lastFrame = 0;
  function frame(ts) {
    var dt = lastFrame ? Math.min(0.05, (ts - lastFrame) / 1000) : 0.016;
    lastFrame = ts;
    // The next frame is asked for first, so that if anything below ever
    // throws, the game carries on rather than freezing.
    requestAnimationFrame(frame);
    tick(dt);
  }
  function tick(dt) {
    clock += dt;
    // A resize event can be missed (a phone's address bar, a pane opening),
    // so the size is checked every frame as well.
    if ((window.innerWidth !== VW || window.innerHeight !== VH) && !resizeTimer) { onResize(); }
    if (mode !== 'scene') { globeFrame(dt); }
    if (S && mode !== 'globe' && mode !== 'fly' && mode !== 'ferry' && mode !== 'land') {
      S.time += dt;
      for (var i = S.q.length - 1; i >= 0; i--) {
        if (S.q[i].at <= S.time) { var f = S.q[i].fn; S.q.splice(i, 1); f(); if (!S) { break; } }
      }
      if (S) { tweenFrame(dt); }
      if (S) {
        skyFrame();
        if (S.place.home) { homeFrame(dt); } else { stageFrame(dt); }
        if (S && S.card) { cardFrame(dt); }
      }
    }
    scene.style.opacity = f2(sceneA);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* later */ } }
  });
  var resizeTimer = 0;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { resizeTimer = 0; layout(); }, 120);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', onResize); }

  decodeWorld();
  buildLandMask();
  // anything in the save that no longer means anything is dropped
  if (!BYID[saved.here]) { saved.here = 'leeds'; }
  saved.bag = saved.bag.filter(function (k) { return !!ITEMS[k]; });
  here = saved.here;
  view.lon = goal.lon = BYID[here].lon;
  view.lat = goal.lat = clamp(BYID[here].lat - 20, -62, 62);
  layout();
  initGlobe();
  buildMarkers();
  gh = makeHoot(ghootG, false);
  setGear(gh, 'bag', saved.prologue);
  VR = viewRows(view.lon, view.lat);
  if (!saved.prologue) { openHome(); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
