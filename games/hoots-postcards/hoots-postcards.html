<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#070b1e">
<title>Hoot's Postcards</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #070b1e;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas, svg.layer { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; }
  #scene { opacity: 0; visibility: hidden; }
  #wxcv { pointer-events: none; opacity: 0; }
  text { font-family: ui-rounded, "Arial Rounded MT Bold", "Baloo 2", "Comic Sans MS", system-ui, sans-serif; font-weight: 700; }
  /* Every scene is drawn twice, by day and by night, and the night copy
     fades in over the top as the sun goes down. */
  .nt { opacity: var(--n, 0); }
  .ntc { opacity: var(--nc, 0); }
  .nl { opacity: var(--n, 0); }
  .dl { opacity: var(--d, 1); }
  .hit { fill: transparent; }
  /* Dialogue boxes, like the old Pokémon games. */
  #dlgcatch { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 19; }
  #dlg {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(94vw, 780px); z-index: 20; box-sizing: border-box;
    display: flex; align-items: center; gap: 14px; padding: 14px 18px 16px;
    background: #fffaf0; color: #2e2840; border: 4px solid #3b3350; border-radius: 20px;
    box-shadow: 0 0 0 4px #fffaf0, 0 8px 0 4px rgba(0, 0, 0, 0.28);
    font-family: ui-rounded, "Arial Rounded MT Bold", "Comic Sans MS", system-ui, sans-serif;
    font-size: clamp(19px, 4.6vw, 28px); line-height: 1.3; cursor: pointer;
  }
  #dlg[hidden], #dlgcatch[hidden] { display: none; }
  #dlg-face { flex: none; width: clamp(58px, 13vw, 88px); height: clamp(58px, 13vw, 88px); border-radius: 14px; background: #e3eef8; overflow: hidden; }
  #dlg-face svg { width: 100%; height: 100%; display: block; }
  #dlg-body { flex: 1; min-width: 0; }
  #dlg-name { font-size: 0.68em; font-weight: 800; color: #8a5a32; }
  #dlg-text { font-weight: 700; min-height: 2.6em; }
  #dlg-more { flex: none; align-self: flex-end; font-size: 0.8em; color: #d9434e; visibility: hidden; animation: dlgbob 0.8s ease-in-out infinite; }
  @keyframes dlgbob { 50% { transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { #dlg-more { animation: none; } }
  /* While Hoot explains something at the bottom of the screen, his box goes to the top. */
  #dlg.top { top: max(14px, env(safe-area-inset-top)); bottom: auto; }
  /* The spotlight on whatever is being explained. */
  #spot { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 18; pointer-events: none; }
  #spot[hidden] { display: none; }
  #spot svg { width: 100%; height: 100%; display: block; }
  .spot-ring { animation: spotring 1.1s ease-in-out infinite; }
  @keyframes spotring { 50% { stroke-width: 9px; stroke-opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .spot-ring { animation: none; } }
</style>
</head>

<script>
// Full screen on the first touch, and a way back if it is off. Copied from
// Animal Band, which explains why it listens for the events it does.
(function () {
  var el = document.documentElement;
  var go = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!go) { return; }
  var EVENTS = ['pointerup', 'touchend', 'click', 'mousedown'];
  var asking = false, done = false, btn = null, i;

  function isFull() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function request() {
    if (asking || isFull()) { return; }
    asking = true;
    try {
      var p = go.call(el);
      if (p && p.then) { p.then(function () { asking = false; }, function () { asking = false; }); }
      else { setTimeout(function () { asking = false; }, 500); }
    } catch (e) { asking = false; }
  }

  function stopAuto() {
    done = true;
    for (var k = 0; k < EVENTS.length; k++) {
      document.removeEventListener(EVENTS[k], autoTry, true);
    }
  }

  function autoTry() {
    if (done) { return; }
    if (isFull()) { stopAuto(); sync(); return; }
    request();
  }

  function sync() {
    var want = !isFull();
    if (want && !btn && document.body) {
      btn = document.createElement('button');
      btn.setAttribute('aria-label', 'Full screen');
      btn.style.cssText = 'position:fixed;top:5px;left:50%;transform:translateX(-50%);'
        + 'z-index:30;width:46px;height:46px;padding:0;line-height:0;border:0;'
        + 'border-radius:14px;background:rgba(255,255,255,0.68);cursor:pointer;'
        + 'box-shadow:0 1px 5px rgba(0,0,0,0.22);-webkit-tap-highlight-color:transparent;';
      btn.innerHTML = '<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">'
        + '<g fill="none" stroke="#2c3a66" stroke-width="3.4" stroke-linecap="round"'
        + ' stroke-linejoin="round">'
        + '<path d="M19 14 H14 V19 M27 14 H32 V19 M19 32 H14 V27 M27 32 H32 V27"/>'
        + '</g></svg>';
      btn.addEventListener('click', function (e) { e.stopPropagation(); request(); });
      document.body.appendChild(btn);
    }
    if (btn) { btn.style.display = want ? 'block' : 'none'; }
  }

  document.addEventListener('fullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  document.addEventListener('webkitfullscreenchange', function () {
    if (isFull()) { stopAuto(); }
    sync();
  });
  for (i = 0; i < EVENTS.length; i++) {
    document.addEventListener(EVENTS[i], autoTry, true);
  }
  sync();
})();
</script>

<svg id="scene" class="layer" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop id="sc-s0" offset="0" stop-color="#4c9fe6"/>
      <stop id="sc-s1" offset="1" stop-color="#cfe9fb"/>
    </linearGradient>
    <radialGradient id="sc-sunglow">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ffe9a0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-moonglow">
      <stop offset="0" stop-color="#e8eeff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8eeff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-soft">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sc-lampglow">
      <stop offset="0" stop-color="#fff0c0" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ffd98a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <defs id="sc-defs"></defs>
  <rect id="sc-skyr" x="0" y="0" width="1000" height="640" fill="url(#sc-sky)"/>
  <g id="sc-stars"></g>
  <g id="sc-sun"><circle r="120" fill="url(#sc-sunglow)"/><circle r="36" fill="#fff4b8"/></g>
  <g id="sc-moon">
    <circle r="80" fill="url(#sc-moonglow)"/>
    <circle r="25" fill="#f2eedc"/>
    <circle cx="-7" cy="-6" r="5" fill="#dcd6c0"/><circle cx="8" cy="5" r="4" fill="#dcd6c0"/><circle cx="-3" cy="10" r="2.6" fill="#dcd6c0"/>
  </g>
  <g id="sc-skyfx"></g>
  <g id="sc-stage">
    <g id="sc-back"></g>
    <g id="sc-ground"></g>
    <g id="sc-dev"></g>
    <g id="sc-props"></g>
    <g id="sc-piles"></g>
    <g id="sc-animal"></g>
    <g id="sc-hoot"></g>
    <g id="sc-front"></g>
    <g id="sc-glow"></g>
    <g id="sc-parts"></g>
    <g id="sc-bubble"></g>
    <g id="sc-thought"></g>
  </g>
  <g id="sc-home" display="none"></g>
  <rect id="sc-warm" x="0" y="0" width="1000" height="640" fill="#ff8a4a" opacity="0" pointer-events="none"/>
  <g id="sc-hud"></g>
  <g id="sc-ui"></g>
  <g id="sc-fly"></g>
  <g id="sc-think" pointer-events="none"></g>
</svg>

    var waveR = 0, fanL = 0;

  // The postcard: picture on the left, name and hello on the right, a

      s += '<rect x="' + f2(pad) + '" y="' + f2(pad + ph * 0.7) + '" width="' + f2(pw) + '" height="' + f2(ph * 0.3) + '" fill="' + c[1] + '"/>';

      s += '<rect x="' + f2(sx + sw * 0.12) + '" y="' + f2(sy + sh * 0.1) + '" width="' + f2(sw * 0.76) + '" height="' + f2(sh * 0.8) + '" fill="' + c[0] + '"/>';
      s += '<g transform="translate(' + f2(sx + sw / 2) + ',' + f2(sy + sh * 0.84) + ') scale(' + f2(sh * 0.62 / 64) + ')">' + dayify(icon) + '</g>';

  var IN_NAMES = { usa: 'the USA', arctic: 'the Arctic', galapagos: 'the Galápagos' };

  // Offering what's in a slot to whoever is here.

  // The chapter's friend takes one of the things it needs. If that's all

  // ------------------------------------------------------------------

  var compareCount = 0;

  // Something goes into the satchel from a friend's hands. If it's full,

  // After the story: the polar bears always have a letter for the penguins,

  // ------------------------------------------------------------------
  // What happens in a scene, in order: Hoot glides in and lands, the
  // animal turns to him (waking first if it's asleep) and says hello, Hoot
  // hoots back. Then it's the child's to play with until Hoot is tapped.
  // ------------------------------------------------------------------
  function startArrival() {

      var i = +key.slice(5);

    // The board: Granny's map, the postcard Hoot's looking for (or the

    if (saved.prologue) {
      var mx = bd.x + 18, my = bd.y + 18, mw, side;

      else { mw = bd.w - 36; side = { x: bd.x + 18, y: my + mw / 2 + 34, w: bd.w - 36 }; }

      var mg = el('g', { 'data-hit': 'map', transform: 'translate(' + f2(mx) + ',' + f2(my) + ')' }, bg);
      mg.innerHTML = grannyMapArt(mw, mh) + pin(-2, -2) + pin(mw + 2, -2);
      var gw, gh2, gx, gy, lw, lh, lx, ly;

        gw = side.w; gh2 = gw * 0.7; gx = side.x; gy = side.y;

      } else {
        gw = side.w * 0.56; gh2 = gw * 0.7; gx = side.x; gy = side.y;

      }
      var art = goalArt(gw, gh2) || (storyDone() ? cardArt(BYID.antarctica, gw, gh2, true) : '');
      if (art) {

        gg.innerHTML = art + pin(gw / 2, 4);

        lg2.innerHTML = (storyDone() ? replyArt(lw, lh) : letterArt(lw, lh)) + pin(lw / 2, 4);
      }
    }

    // Hoot's perch and his lamp
    var pg = el('g', {}, hg);
    var poleTop = perch.y + 6;
    pg.innerHTML = '<rect x="' + (perch.x - 50) + '" y="' + (floorY - 12) + '" width="100" height="16" rx="8" fill="#6b4a2f"/>'

      + '<rect x="' + (perch.x - 70) + '" y="' + (perch.y - 2) + '" width="140" height="14" rx="7" fill="#8a5a33"/>';
    var lg = el('g', { 'data-hit': 'lamp', transform: 'translate(' + lampP.x + ',' + lampP.y + ')' }, hg);
    lg.innerHTML = '<circle class="lampglow" cx="0" cy="-258" r="190" fill="url(#sc-lampglow)"/>'
      + '<ellipse cx="0" cy="-4" rx="40" ry="10" fill="#6b4a2f"/>'
      + '<rect x="-5" y="-240" width="10" height="236" fill="#6b4a2f"/>'
      + '<path d="M-48 -230 L-30 -296 H30 L48 -230 Z" fill="#f4c96b"/>'
      + '<path d="M-48 -230 H48" stroke="#d9a440" stroke-width="5"/>'
      + '<path d="M10 -230 V-190" stroke="#3b3350" stroke-width="2.5"/><circle cx="10" cy="-186" r="5" fill="#3b3350"/>'
      + '<rect class="hit" x="-70" y="-310" width="140" height="310"/>';
    S.home.glow = lg.querySelector('.lampglow');
    S.home.shade = lg.querySelector('path');
    var dim = el('rect', { x: 0, y: 0, width: 1000, height: H, fill: '#0d1440', opacity: 0, 'pointer-events': 'none' }, hg);
    S.home.dim = dim;

    // Granny's satchel, before it's been opened, lying on the rug
    S.home.rug = { x: land ? 560 : 500, y: floorY + (H - floorY) * 0.55 };
    if (!saved.prologue) {
      var ob = el('g', { 'data-hit': 'oldbag' }, hg);
      ob.innerHTML = '<g class="ob-in">' + oldBagArt() + '</g><rect class="hit" x="-80" y="-160" width="160" height="170"/>';
      S.home.oldbag = ob;
    }

    // a parent's control, small and out of the way: hold it, then confirm
    var rx = land ? 1000 - 16 - 170 : 500 - 85, ry = H - 16 - 46;
    var rs = el('g', { 'data-hit': 'reset', transform: 'translate(' + f2(rx) + ',' + f2(ry) + ')' }, hg);
    rs.innerHTML = '<rect width="170" height="46" rx="23" fill="#efe2c8" opacity="0.85" stroke="#c8b48c" stroke-width="2"/>'

      + '<rect class="rs-bar" x="14" y="38" width="0" height="5" rx="2.5" fill="#d9434e"/>';
    S.home.resetBar = rs.querySelector('.rs-bar');

    // Hoot goes on top of all that
    var keep = S.hoot ? { x: S.hoot.x, y: S.hoot.y, op: S.hoot.op, gear: S.hoot.gear } : null;
    S.hoot = makeHoot(hg, false);
    S.hoot.g.setAttribute('data-hit', 'hoot');
    el('rect', { class: 'hit', x: -38, y: -78, width: 76, height: 84 }, S.hoot.g);
    S.hoot.s = land ? 1.7 : 2.3;
    setGear(S.hoot, 'bag', saved.prologue);
    if (keep && S.phase !== 'pre') {
      S.hoot.op = keep.op;
      if (S.phase === 'landed') { S.hoot.x = perch.x; S.hoot.y = perch.y; } else { S.hoot.x = keep.x; S.hoot.y = keep.y; }
    } else {
      S.hoot.x = -300; S.hoot.y = -300; S.hoot.op = 0;
    }
    S.home.perch = perch;
    S.home.floorY = floorY;
  }

  // Granny's satchel: older, bigger and more battered than anything Hoot

      + '<path d="M-62 0 V-72 Q-62 -86 -48 -86 H48 Q62 -86 62 -72 V0 Z" fill="#7a4a26"/>'
      + '<path d="M-44 -22 l12 4 M30 -14 l14 -3 M-20 -6 l8 2" stroke="#5a3418" stroke-width="2.4"/>'

      + '<path d="M28 -76 q8 -10 16 -2 q-8 8 -16 2 Z M30 -74 l12 -4" fill="#efe6d8" stroke="#a8998a" stroke-width="1.2"/></g>';

  // Opening the game for the first time: Hoot at home, and a dusty old
  // satchel about to drop out of the loft.
  function openHome() {
    here = 'leeds';
    buildScene(BYID.leeds);
    scene.style.visibility = 'visible';
    mode = 'scene'; modeT = 0; sceneA = 1;
    S.phase = 'landed'; S.phaseT = 0;
    S.hoot.x = S.home.perch.x; S.hoot.y = S.home.perch.y; S.hoot.op = 1;
    if (!saved.prologue) {
      S.pro = { stage: 'wait', t: 0, wig: 0 };
      S.busy = true;
    }
  }

  function prologueFrame(dt) {
    var P = S.pro, ob = S.home.oldbag, r = S.home.rug;
    if (!ob) { return; }
    P.t += dt;
    if (P.stage === 'wait') {
      ob.setAttribute('transform', 'translate(' + f2(r.x) + ',-300)');
      if (P.t > 1.2) { P.stage = 'drop'; P.t = 0; SND.whoosh(0.5); }
    } else if (P.stage === 'drop') {
      var k = clamp(P.t / 0.6, 0, 1), y = lerp(-300, r.y, easeIn(k));
      ob.setAttribute('transform', 'translate(' + f2(r.x) + ',' + f2(y) + ')');
      if (k >= 1) { P.stage = 'rest'; P.t = 0; SND.thump(); S.hoot.pop = 1; S.hoot.hootT = 0.95; SND.hoot(now() + 0.3); }
    } else if (P.stage === 'rest') {
      // it wiggles now and then, until someone opens it
      var w = (P.t % 2.6) < 0.5 && !reduced ? Math.sin(P.t * 30) * 4 : 0;
      ob.setAttribute('transform', 'translate(' + f2(r.x) + ',' + f2(r.y) + ') rotate(' + f2(w) + ')');
    }
  }

  // Opening Granny's satchel: her postcards and her letter come out, go
  // up on the board, and the satchel goes on Hoot.
  function openSatchel() {
    var P = S.pro, ob = S.home.oldbag, r = S.home.rug;
    P.stage = 'open';
    SND.rustle();
    var flap = list(ob, '.ob-flap');
    tween(0.4, function (k) { setAll(flap, 'rotate(' + f2(-150 * k) + ' 0 -86) '); });
    var cards = el('g', {}, $('sc-fly')), w = 150, h = 105, n = 4;
    var made = [];
    for (var i = 0; i < n; i++) {
      var cg = el('g', {}, cards);
      cg.innerHTML = i === 0 ? fadedCard(CHAPTERS[0], w, h) : cardStackArt(w, h * 1.16);
      made.push(cg);
    }
    var lg = el('g', {}, cards);
    lg.innerHTML = letterArt(w * 0.9, w * 0.9 * 0.62);
    tween(0.9, function (k) {
      var u = easeOut(k);
      made.forEach(function (cg, j) {
        var a = (j - (n - 1) / 2) * 22 * u, x = r.x - w / 2 + Math.sin(a * D2R) * 180 * u, y = r.y - 90 - (240 - Math.abs(j - 1.5) * 30) * u;
        cg.setAttribute('transform', 'translate(' + f2(x) + ',' + f2(y) + ') rotate(' + f2(a) + ' ' + f2(w / 2) + ' ' + f2(h / 2) + ') scale(' + f2(0.3 + 0.7 * u) + ')');
      });
      lg.setAttribute('transform', 'translate(' + f2(r.x - w * 0.45) + ',' + f2(r.y - 60 - 80 * u) + ') scale(' + f2(0.3 + 0.5 * u) + ')');
    });
    later(0.9, function () {
    talk([
      { who: 'hoot', text: 'What’s this? It’s Granny’s old satchel!' },
      { who: 'hoot', text: 'Granny was a postal owl too. She flew all over the world.' },
      { who: 'hoot', text: 'And these are her postcards, from all the places she went.' }
    ], function () {
      // the letter comes to the front
      SND.sparkle();
      tween(0.6, function (k) {
        var u = easeOut(k);
        lg.setAttribute('transform', 'translate(' + f2(lerp(r.x - w * 0.45, 500 - w * 0.9 * 0.6, u)) + ',' + f2(lerp(r.y - 140, SH * 0.3, u)) + ') scale(' + f2(lerp(0.8, 1.35, u)) + ')');
      });
      talk([
        { who: 'hoot', text: 'And a letter. It’s still sealed! Granny never delivered it.' },
        { who: 'hoot', text: 'There’s a paw print for a stamp, and a penguin drawn on the front. How strange!' }
      ], function () {
        removeLater(cards, 0.5);
        saved.prologue = true;
        saved.pieces |= (1 << HOME_PIECE);
        saved.chState = 'find';
        persist();
        // the satchel goes onto Hoot
        var start = { x: r.x, y: r.y - 50 }, end = { x: S.hoot.x, y: S.hoot.y - 40 };
        if (ob.parentNode) { ob.parentNode.removeChild(ob); }
        S.home.oldbag = null;
        flyThing(oldBagArt(), start, end, 1, 0.3, 0.7, function () {
          S.pro = null;
          layoutHome();
          layoutSceneHud();
          layoutGlobeHud();
          S.hoot.pop = 1;
          SND.chime();
          var g = S.home.board;
          if (g) { g.setAttribute('opacity', '0'); tween(0.6, function (k) { g.setAttribute('opacity', f2(k)); }); }
          var c0 = CHAPTERS[0];
          talk([
            { who: 'hoot', text: 'I’ll take Granny’s satchel with me. Maybe her friends can tell me about the letter.' },
            { who: 'hoot', text: 'Here’s the first postcard. I can just read Granny’s writing…' },
            { who: 'card', text: c0.clue },
            { who: 'hoot', text: 'Where could that be? I’ll fly out and look!' }
          ], function () { S.busy = false; });
        });
      });
    });
    });
  }

  // A closer look at the postcard or the letter, over everything.
  function showHomeZoom(what) {
    var z = el('g', { 'data-hit': 'zoom' }, $('sc-fly'));
    var w = Math.min(760, SH * 0.62 * 1.4), h = what === 'letter' ? w * 0.62 : w * 0.7;
    el('rect', { x: 0, y: 0, width: 1000, height: SH, fill: '#05081a', opacity: 0.55 }, z);
    var g = el('g', { transform: 'translate(' + f2((1000 - w) / 2) + ',' + f2((SH - h) / 2) + ') rotate(-2 ' + f2(w / 2) + ' ' + f2(h / 2) + ')' }, z);
    g.innerHTML = what === 'letter' ? (storyDone() ? replyArt(w, h) : letterArt(w, h)) : (goalArt(w, h) || (storyDone() ? cardArt(BYID.antarctica, w, h, true) : cardStackArt(w, h)));
    S.zoomed = z;
    SND.rustle();
  }
  function showConfirm() {
    var z = el('g', {}, $('sc-fly'));
    el('rect', { x: 0, y: 0, width: 1000, height: SH, fill: '#05081a', opacity: 0.6, 'data-hit': 'confirm-no' }, z);
    var px = 500, py = SH / 2, pg = el('g', { transform: 'translate(' + px + ',' + f2(py) + ')' }, z);
    pg.innerHTML = '<rect x="-230" y="-110" width="460" height="220" rx="26" fill="#fffaf0" stroke="#c8b48c" stroke-width="3"/>'
      + '<g data-hit="confirm-yes"><rect x="-200" y="-30" width="180" height="70" rx="35" fill="#d9434e"/><text x="-110" y="14" font-size="24" text-anchor="middle" fill="#ffffff">Start again</text></g>'
      + '<g data-hit="confirm-no"><rect x="20" y="-30" width="180" height="70" rx="35" fill="#5fb85a"/><text x="110" y="14" font-size="24" text-anchor="middle" fill="#ffffff">Keep playing</text></g>';
    S.confirm = z;
  }

  function homeFrame(dt) {
    var H = S.hoot, h = S.home;
    hootFlight(dt);
    if (S.phase === 'landed') {
      S.phaseT += dt;
      if (!S.ready && S.phaseT > 0.4 && saved.prologue && !S.busy) { S.ready = true; }
    }
    var n = S.nightV;
    h.dim.setAttribute('opacity', f2(n * (S.lampOn ? 0.12 : 0.5)));
    h.glow.setAttribute('opacity', f2(S.lampOn ? 0.45 + 0.55 * n : 0));
    h.shade.setAttribute('fill', S.lampOn ? '#f4c96b' : '#c9b28a');
    if (S.pro) { prologueFrame(dt); }
    // the reset takes a two-second hold
    if (h.resetBar) {
      if (S.resetHold) {
        S.resetHold.t += dt;
        h.resetBar.setAttribute('width', f2(142 * clamp(S.resetHold.t / 2, 0, 1)));
        if (S.resetHold.t >= 2) { S.resetHold = null; showConfirm(); }
      } else { h.resetBar.setAttribute('width', '0'); }
    }
    // Hoot keeps an eye on the satchel, the board, and the window at night
    if (h.oldbag) { H.lx = lerp(H.lx, 0.9, 0.08); H.ly = lerp(H.ly, 0.8, 0.08); }
    else { H.lx = lerp(H.lx, n > 0.5 ? -0.6 : 0.8, 0.05); H.ly = lerp(H.ly, -0.4, 0.05); }
    // once he has somewhere to go, he's eager to be off
    if (S.ready && !S.busy && saved.prologue && !reduced && (S.time % 6) < 0.05) { H.wave = 0.6; }
    poseHoot(H, dt);
    bedFrame(n);
  }

  function homeTap(key) {
    if (S.confirm) {
      var z = S.confirm;
      S.confirm = null;
      if (z.parentNode) { z.parentNode.removeChild(z); }
      if (key === 'confirm-yes') { startAgain(); }
      return;
    }
    if (S.zoomed) {
      var zz = S.zoomed;
      S.zoomed = null;
      if (zz.parentNode) { zz.parentNode.removeChild(zz); }
      return;
    }
    if (key === 'reset') { S.resetHold = { t: 0 }; return; }
    if (key === 'lamp') {
      if (!tapOk('lamp', 0.5)) { return; }
      S.lampOn = !S.lampOn;
      SND.click();
      if (!S.lampOn) { S.hoot.pop = 1; }
      return;
    }
    if (key === 'oldbag') {
      if (S.pro && S.pro.stage === 'rest' && tapOk('oldbag', 1)) { openSatchel(); }
      return;
    }
    if (!saved.prologue || S.busy) { return; }
    if (key === 'goal' && tapOk('goal', 1)) { showHomeZoom('goal'); talk(goalLines(), closeHomeZoom); return; }
    if (key === 'letter' && tapOk('letter', 1.5)) { showHomeZoom('letter'); talk(letterLines(), closeHomeZoom); return; }
    if (key === 'map' && tapOk('map', 2)) { S.hoot.pop = 1; talk(mapLines()); }
  }
  function closeHomeZoom() {
    if (S && S.zoomed) { var z = S.zoomed; S.zoomed = null; if (z.parentNode) { z.parentNode.removeChild(z); } }
  }
  // What Hoot has worked out about the letter so far.
  function letterLines() {
    if (storyDone()) { return [{ who: 'hoot', text: 'The penguins wrote to say thank you. It came all the way from the bottom of the world!' }]; }
    var out = [{ who: 'hoot', text: 'Granny’s letter. It’s still sealed, so I mustn’t open it.' }];
    var told = (saved.ch > 0 || saved.chState === 'done') ? Math.min(CHAPTERS.length, saved.ch + (saved.chState === 'done' ? 1 : 0)) : 0;
    for (var i = 0; i < told; i++) {
      var m = CHAPTERS[i].clueLetter;
      if (m) { out.push({ who: 'hoot', text: m }); }
    }
    if (out.length === 1) { out.push({ who: 'hoot', text: 'A paw print for a stamp, and a penguin on the front. Who could it be from?' }); }
    return out;
  }
  function mapLines() {
    var n = 0;
    for (var i = 0; i < 8; i++) { if (saved.pieces & (1 << i)) { n += 1; } }
    if (n >= 8 && storyDone()) { return [{ who: 'hoot', text: 'Granny’s map is whole again, and her letter got there in the end.' }]; }
    if (n >= 8) { return [{ who: 'hoot', text: 'Granny’s map is whole again! Her journey ends in the cold sea, far in the south.' }]; }
    return [{ who: 'hoot', text: 'Granny’s old map. I’ve found ' + n + ' of the 8 pieces.' }];
  }

  // ==================================================================
  // The frame loop
  // ==================================================================
  var lastFrame = 0;
  function frame(ts) {
    var dt = lastFrame ? Math.min(0.05, (ts - lastFrame) / 1000) : 0.016;
    lastFrame = ts;
    // The next frame is asked for first, so that if anything below ever
    // throws, the game carries on rather than freezing.
    requestAnimationFrame(frame);
    tick(dt);
  }
  function tick(dt) {
    clock += dt * (mode === 'scene' ? DAY_SECONDS / SCENE_DAY_SECONDS : 1);
    dlgFrame(dt);
    spotFrame();
    globeLessons();
    // A resize event can be missed (a phone's address bar, a pane opening),
    // so the size is checked every frame as well.
    if ((window.innerWidth !== VW || window.innerHeight !== VH) && !resizeTimer) { onResize(); }
    if (mode !== 'scene') { globeFrame(dt); }
    if (S && mode !== 'globe' && mode !== 'fly' && mode !== 'ferry' && mode !== 'land') {
      S.time += dt;
      for (var i = S.q.length - 1; i >= 0; i--) {
        if (S.q[i].at <= S.time) { var f = S.q[i].fn; S.q.splice(i, 1); f(); if (!S) { break; } }
      }
      if (S) { tweenFrame(dt); }
      if (S) {
        skyFrame();
        if (S.place.home) { homeFrame(dt); } else { stageFrame(dt); }
        if (S && S.card) { cardFrame(dt); }
      }
    }
    scene.style.opacity = f2(sceneA);
    var wa = S && !S.place.home ? f2(sceneA) : '0';
    if (wa !== wxShown) { wxShown = wa; wxcv.style.opacity = wa; if (wa === '0') { wxc.setTransform(1, 0, 0, 1, 0, 0); wxc.clearRect(0, 0, wxcv.width, wxcv.height); } }
    thinkFrame(dt);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) { /* later */ } }
  });
  var resizeTimer = 0;
  function onResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { resizeTimer = 0; layout(); }, 120);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', onResize); }

  decodeWorld();
  buildLandMask();
  PLACES.forEach(function (p) { if (p.animal && !p.animal.name) { p.animal.name = ANIMAL_NAMES[p.id] || p.name; } });
  // anything in the save that no longer means anything is dropped
  if (!BYID[saved.here]) { saved.here = 'leeds'; }
  saved.bag = saved.bag.filter(function (k) { return !!ITEMS[k]; });
  // a save from when the story was one chapter long, finished, carries on
  // with the next
  if (saved.ch >= CHAPTERS.length) { saved.ch = CHAPTERS.length - 1; }
  if (saved.chState === 'done' && CHAPTERS[saved.ch + 1]) { saved.ch += 1; saved.chState = CHAPTERS[saved.ch].start || 'find'; }
  here = saved.here;
  view.lon = goal.lon = BYID[here].lon;
  view.lat = goal.lat = clamp(BYID[here].lat - 20, -62, 62);
  layout();
  initGlobe();
  buildMarkers();
  gh = makeHoot(ghootG, false);
  setGear(gh, 'bag', saved.prologue);
  VR = viewRows(view.lon, view.lat);
  if (!saved.prologue) { openHome(); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
