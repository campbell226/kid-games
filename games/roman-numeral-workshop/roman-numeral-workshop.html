<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8402a">
<title>Roman Numeral Workshop</title>
<style>
  :root {
    --ink: #2b2118; --cream: #fbf4e2; --gold: #c8962d; --gold-d: #8a6414;
    --terra: #a8402a; --terra-d: #7f2f1d; --stone: #e9dfc8;
    --serif: "Trajan Pro", "Cinzel", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --sans: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: clip; }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: var(--sans); color: var(--ink);
    background:
      radial-gradient(ellipse at 15% 8%, rgba(255,255,255,.85), transparent 50%),
      radial-gradient(ellipse at 85% 75%, rgba(214,196,160,.55), transparent 55%),
      linear-gradient(135deg, #f7eed8, #eadfc2);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .veins { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 62rem; margin: 0 auto; padding: .6rem .7rem 2rem; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  :focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* banner */
  .banner {
    position: relative; margin: .3rem auto 1rem; max-width: 40rem;
    background: linear-gradient(#bd4d33, var(--terra)); color: #fff8e8;
    border: 3px solid var(--gold); border-radius: .5rem;
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    padding: .5rem 1rem; box-shadow: 0 4px 10px rgba(80,40,10,.3);
  }
  .banner::before, .banner::after {
    content: ""; position: absolute; top: .55rem; width: 1.6rem; height: 100%;
    background: var(--terra-d); z-index: -1; border: 3px solid var(--gold);
  }
  .banner::before { left: -1.3rem; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 35% 50%); }
  .banner::after { right: -1.3rem; clip-path: polygon(0 0, 100% 0, 65% 50%, 100% 100%, 0 100%); }
  .banner h1 { margin: 0; font: 700 clamp(1.15rem, 5vw, 2rem)/1.1 var(--serif); letter-spacing: .05em; text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .banner svg { width: clamp(2rem, 7vw, 3rem); height: auto; flex: none; }

  /* layout */
  .stage { display: grid; grid-template-columns: 1fr; gap: .6rem; align-items: start; }
  .col { display: none; }
  .col svg { display: block; width: 74px; height: min(540px, 72vh); }
  @media (min-width: 860px) and (min-height: 600px) {
    .stage { grid-template-columns: auto minmax(0, 1fr) auto; }
    .col { display: block; }
  }
  .panel {
    background: linear-gradient(180deg, #fffaf0, var(--cream));
    border: 4px double var(--gold); border-radius: 1rem;
    box-shadow: 0 6px 16px rgba(80,50,10,.25), inset 0 0 0 2px rgba(255,255,255,.7);
    padding: .5rem .8rem 1rem; position: relative;
  }
  .meander { display: block; width: 100%; height: 18px; }
  .hello { display: flex; align-items: center; gap: .6rem; min-height: 4.2rem; margin: .4rem 0; }
  .lion { flex: none; width: 4.2rem; height: 4.2rem; }
  .bubble {
    position: relative; background: #fff; border: 2px solid var(--gold); border-radius: 1rem;
    padding: .5rem .8rem; font-size: clamp(1rem, 3.2vw, 1.15rem); line-height: 1.3;
  }
  .bubble::before {
    content: ""; position: absolute; left: -9px; top: 50%; margin-top: -8px;
    border: 8px solid transparent; border-right-color: var(--gold); border-left: 0;
  }
  .bubble[hidden] { display: none; }

  .bar-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: center; margin: .4rem 0 .7rem; }
  .btn {
    min-height: 3rem; min-width: 3rem; padding: .4rem 1rem; border-radius: .9rem;
    border: 2px solid var(--gold-d); background: linear-gradient(#fff, var(--stone));
    font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    box-shadow: 0 3px 0 var(--gold-d);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-d); }
  .btn.red { background: linear-gradient(#c15338, var(--terra)); color: #fff; border-color: var(--terra-d); box-shadow: 0 3px 0 var(--terra-d); font-size: 1.15rem; }
  .btn.red:active { box-shadow: 0 1px 0 var(--terra-d); }
  .btn svg { width: 1.5rem; height: 1.5rem; flex: none; }
  .btn[aria-pressed="true"] { background: linear-gradient(#f4d77c, #e6b94a); }
  .wreaths { display: inline-flex; align-items: center; gap: .3rem; font: 700 1.3rem var(--serif); min-height: 3rem; padding: 0 .4rem; }
  .wreaths svg { width: 2.6rem; height: 2.6rem; }

  /* direction toggle */
  .dir { display: flex; justify-content: center; margin: .2rem 0 .6rem; }
  .seg { display: inline-flex; border: 3px solid var(--gold-d); border-radius: 1.2rem; overflow: hidden; background: var(--stone); max-width: 100%; }
  .seg button {
    border: 0; background: transparent; min-height: 3.6rem; padding: .3rem .9rem; font-weight: 800;
    display: flex; align-items: center; gap: .5rem; font-size: clamp(.95rem, 3.4vw, 1.2rem);
  }
  .seg button + button { border-left: 3px solid var(--gold-d); }
  .seg button[aria-pressed="true"] { background: linear-gradient(#c15338, var(--terra)); color: #fff; }
  .seg .face { font: 700 1.05em var(--serif); }
  .seg svg { width: 1.6rem; height: 1.6rem; flex: none; transition: transform .3s; }
  .seg button:last-child svg { transform: scaleX(-1); }

  /* input */
  .numrow { text-align: center; margin: .4rem 0; }
  .numrow label { display: block; font-weight: 700; margin-bottom: .2rem; }
  #num {
    width: min(100%, 22rem); min-height: 4rem; font: 800 clamp(1.8rem, 8vw, 2.6rem) var(--sans);
    text-align: center; border: 3px solid var(--gold-d); border-radius: 1rem; background: #fff; color: var(--ink); padding: .2rem .6rem;
  }
  #num::placeholder { color: #8d7f6a; font-weight: 600; }

  /* output */
  .out { --tw: clamp(2.2rem, 8.6vw, 3.8rem); min-height: 9rem; padding: 1.1rem .2rem .3rem; text-align: center; }
  .ph { color: #8d7f6a; font: 700 clamp(1.4rem, 6vw, 2rem) var(--serif); margin: 2rem 0; opacity: .8; }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem; padding-top: .55rem; }
  .groups { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem .55rem; }
  .chunk {
    display: flex; flex-direction: column; align-items: center; padding: .15rem .4rem .3rem;
    border: 2px solid var(--cb); border-radius: .8rem; background: rgba(255,255,255,.45);
  }
  .chunk small { font: 800 clamp(.85rem, 2.8vw, 1.05rem) var(--sans); margin-top: .1rem; }
  .tile {
    position: relative; display: inline-grid; place-items: center;
    width: var(--tw); height: calc(var(--tw) * 1.25);
    font: 700 calc(var(--tw) * .78)/1 var(--serif); color: var(--ink);
    text-shadow: 0 1px 0 rgba(255,255,255,.75), 0 -1px 0 rgba(0,0,0,.28);
    border-radius: .3em;
    background: linear-gradient(160deg, rgba(255,255,255,.65), rgba(255,255,255,0) 50%), repeating-linear-gradient(100deg, rgba(0,0,0,.025) 0 3px, transparent 3px 7px), var(--c);
    box-shadow: inset 0 2px 3px rgba(255,255,255,.8), inset 0 -3px 5px rgba(0,0,0,.2), 0 2px 3px rgba(60,40,10,.35);
  }
  .tile.b::before {
    content: ""; position: absolute; left: 6%; right: 6%; top: calc(var(--tw) * -.2); height: calc(var(--tw) * .1); min-height: 4px;
    border-radius: 3px; background: linear-gradient(#f6d77a, #b8860b); box-shadow: 0 1px 1px rgba(0,0,0,.3);
  }
  .p0 { --c: #cfe3f6; --cb: #6f9bc9; } .p1 { --c: #d3ecc4; --cb: #7fb064; }
  .p2 { --c: #f8dcb2; --cb: #d49a4a; } .p3 { --c: #f2cadb; --cb: #c9708f; }
  .bp0 { --c: #aebdf0; --cb: #5b6fc4; } .bp1 { --c: #a3dccf; --cb: #3f9c88; }
  .bp2 { --c: #dcbaee; --cb: #9a5fbe; } .bp3 { --c: #f5b9a3; --cb: #c8583a; }
  .tile.pop { animation: pop .28s ease-out; }
  @keyframes pop { 0% { transform: scale(.6) rotate(-5deg); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: none; } }
  .tile.bad { outline: 3px dashed var(--gold); outline-offset: 3px; animation: nudge .5s ease-in-out 2; }
  @keyframes nudge { 0%, 100% { transform: none; } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .sum { font: 700 clamp(1.1rem, 4.4vw, 1.5rem) var(--sans); margin-top: .8rem; overflow-wrap: anywhere; }
  .big { font: 800 clamp(2rem, 9vw, 3.2rem) var(--sans); margin: .6rem 0 0; }
  .big.faint { color: #b4a78f; }
  .note { margin: .5rem auto 0; max-width: 34rem; font-size: clamp(1rem, 3.4vw, 1.2rem); line-height: 1.4; min-height: 1.4em; }
  .note .tile { --tw: 1.7rem; vertical-align: middle; margin: 0 .05rem; }
  .note .tiles { display: inline-flex; padding-top: .4rem; vertical-align: middle; gap: .1rem; }
  .nulla { font: 700 clamp(2.2rem, 10vw, 3.6rem) var(--serif); margin: .4rem 0; }
  .qcard { background: #fff7e0; border: 2px dashed var(--gold); border-radius: 1rem; padding: .5rem .8rem; margin-bottom: .6rem; }
  .qprompt { font: 700 clamp(1.2rem, 5vw, 1.7rem) var(--sans); }
  .qprompt b { font: 800 1.5em var(--serif); color: var(--terra); }
  .live { margin-top: .7rem; font: 700 clamp(1.1rem, 4.4vw, 1.5rem) var(--sans); }
  .live b { font-size: 1.5em; }
  .ghost { margin-top: .4rem; }
  .ghost .chunk { opacity: .85; border-style: dashed; }

  /* quest bar */
  .qbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: center; margin: .2rem 0 .6rem; }
  .lv { min-width: 3rem; padding: .3rem .5rem; font-family: var(--serif); }
  .pips { display: inline-flex; gap: .3rem; padding: 0 .3rem; }
  .pip { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid var(--gold-d); background: #fff; }
  .pip.on { background: var(--gold); }

  /* keypad */
  .pad { display: flex; flex-wrap: wrap; justify-content: center; gap: .45rem; margin: .5rem auto; max-width: 36rem; }
  .pad[hidden], .numrow[hidden], .qbar[hidden] { display: none; }
  .key {
    position: relative; width: clamp(3.1rem, 11.5vw, 4.4rem); height: clamp(3.6rem, 13vw, 5rem);
    border: 2px solid #8d7f6a; border-radius: .7rem; font: 700 clamp(1.5rem, 6vw, 2.2rem) var(--serif);
    background: linear-gradient(160deg, #fff, #e0d4b9); box-shadow: 0 4px 0 #8d7f6a;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 #8d7f6a; }
  .pad.bar-on .key.l::before {
    content: ""; position: absolute; left: 14%; right: 14%; top: 7px; height: 5px; border-radius: 3px;
    background: linear-gradient(#f6d77a, #b8860b);
  }
  .key.wide { width: auto; padding: 0 .8rem; font: 800 clamp(.95rem, 3.4vw, 1.15rem) var(--sans); display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
  .key.wide svg { width: 1.7rem; height: 1.7rem; }
  .key[aria-pressed="true"] { background: linear-gradient(#f4d77c, #e6b94a); border-color: var(--gold-d); box-shadow: 0 4px 0 var(--gold-d); }
  .barmark { display: inline-block; width: 1.5rem; height: 5px; border-radius: 3px; background: linear-gradient(#f6d77a, #b8860b); box-shadow: 0 0 0 1px var(--gold-d); }

  /* celebration + dialog */
  #cheer { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(60,40,20,.55); }
  #cheer[hidden] { display: none; }
  .cheercard { background: var(--cream); border: 4px double var(--gold); border-radius: 1.4rem; padding: 1rem 1.6rem 1.2rem; text-align: center; animation: rise .4s ease-out; max-width: 90vw; }
  @keyframes rise { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  .wreathbig { position: relative; width: min(60vw, 14rem); margin: 0 auto; }
  .wreathbig svg { width: 100%; height: auto; display: block; }
  .wreathbig span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 clamp(1.5rem, 8vw, 2.4rem) var(--serif); color: var(--terra); }
  .lvl { font: 700 1.3rem var(--serif); margin: .2rem 0 .6rem; }
  dialog { border: 4px double var(--gold); border-radius: 1.2rem; background: var(--cream); color: var(--ink); max-width: min(92vw, 30rem); padding: 1rem 1.2rem; text-align: center; }
  dialog::backdrop { background: rgba(60,40,20,.55); }
  dialog p { font-size: 1.25rem; font-weight: 700; margin: .3rem 0 .8rem; }
  .demo { --tw: 3.6rem; display: flex; align-items: center; justify-content: center; gap: .8rem; padding: 1.2rem 0 .8rem; flex-wrap: wrap; }
  .dt { display: flex; flex-direction: column; align-items: center; gap: .3rem; font: 800 1.4rem var(--sans); }
  .times { font: 800 1.4rem var(--sans); color: var(--terra); }
  .demo .b.drop::before { animation: drop 3s ease-in-out infinite; }
  @keyframes drop { 0%, 15% { transform: translateY(-28px); opacity: 0; } 35%, 85% { transform: none; opacity: 1; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .tile.pop, .tile.bad, .cheercard, .demo .b.drop::before, .seg svg { animation: none !important; transition: none !important; }
    .btn:active, .key:active { transform: none; }
  }
</style>
</head>
<body>
<svg class="veins" viewBox="0 0 800 600" preserveAspectRatio="none" aria-hidden="true">
  <path d="M-20 120 C150 60 250 220 420 150 S700 60 830 180" fill="none" stroke="rgba(120,105,80,.13)" stroke-width="2.5"/>
  <path d="M-20 420 C120 380 300 520 470 440 S720 380 830 470" fill="none" stroke="rgba(120,105,80,.11)" stroke-width="2"/>
  <path d="M200 -10 C240 120 160 220 260 330 S340 520 300 620" fill="none" stroke="rgba(120,105,80,.09)" stroke-width="1.8"/>
</svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="rn-shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9cdb0"/><stop offset=".35" stop-color="#fffaf0"/><stop offset="1" stop-color="#cbbd9b"/>
    </linearGradient>
    <linearGradient id="rn-cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#d4c7a6"/></linearGradient>
    <linearGradient id="rn-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d77a"/><stop offset="1" stop-color="#b8860b"/></linearGradient>
    <pattern id="rn-mean" width="24" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 16 H24 M18 16 V3 H6 V11 H12" fill="none" stroke="#c8962d" stroke-width="2.4" stroke-linejoin="miter"/>
    </pattern>
  </defs>
</svg>

<div class="wrap">
  <div class="banner">
    <span data-wreath="left"></span>
    <h1>Roman Numeral Workshop</h1>
    <span data-wreath="right"></span>
  </div>

  <div class="stage">
    <div class="col" data-col aria-hidden="true"></div>

    <main class="panel">
      <svg class="meander" aria-hidden="true"><rect width="100%" height="18" fill="url(#rn-mean)"/></svg>

      <div class="hello">
        <svg class="lion" viewBox="0 0 80 80" aria-hidden="true">
          <g fill="#c77a2b">
            <circle cx="68" cy="40" r="11"/><circle cx="60" cy="60" r="11"/><circle cx="40" cy="68" r="11"/><circle cx="20" cy="60" r="11"/>
            <circle cx="12" cy="40" r="11"/><circle cx="20" cy="20" r="11"/><circle cx="40" cy="12" r="11"/><circle cx="60" cy="20" r="11"/>
          </g>
          <circle cx="40" cy="42" r="23" fill="#f3c76f"/>
          <circle cx="24" cy="26" r="6" fill="#f3c76f"/><circle cx="56" cy="26" r="6" fill="#f3c76f"/>
          <circle cx="32" cy="38" r="3.2" fill="#2b2118"/><circle cx="48" cy="38" r="3.2" fill="#2b2118"/>
          <circle cx="33" cy="37" r="1" fill="#fff"/><circle cx="49" cy="37" r="1" fill="#fff"/>
          <path d="M36 46 H44 L40 51 Z" fill="#a8402a"/>
          <path d="M33 54 Q36.5 58 40 52 Q43.5 58 47 54" fill="none" stroke="#2b2118" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <div class="bubble" id="say" hidden></div>
      </div>

      <div class="bar-row">
        <button class="btn red" id="questBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z" fill="#f6d77a" stroke="#fff" stroke-width="1.2"/></svg>
          Quest!
        </button>
        <button class="btn" id="barHelp" type="button">What's that bar?</button>
        <span class="wreaths" title="Wreaths earned"><span data-wreath="count"></span><span id="wcount">0</span></span>
        <button class="btn" id="mute" type="button" aria-pressed="false" aria-label="Sound"></button>
      </div>

      <div id="qbar" class="qbar" hidden></div>

      <div class="dir">
        <div class="seg" role="group" aria-label="Direction">
          <button type="button" id="dirA" aria-pressed="true">
            <span class="face">123</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h15M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="face">XIV</span>
            <span class="sr">Number to Roman</span>
          </button>
          <button type="button" id="dirB" aria-pressed="false">
            <span class="face">XIV</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h15M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="face">123</span>
            <span class="sr">Roman to Number</span>
          </button>
        </div>
      </div>

      <div class="numrow" id="numRow">
        <label for="num" id="numLabel" class="sr">Type a number</label>
        <input id="num" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>

      <div class="pad" id="pad" role="group" aria-label="Numeral keys" hidden>
        <button class="key l" type="button" data-l="I">I</button>
        <button class="key l" type="button" data-l="V">V</button>
        <button class="key l" type="button" data-l="X">X</button>
        <button class="key l" type="button" data-l="L">L</button>
        <button class="key l" type="button" data-l="C">C</button>
        <button class="key l" type="button" data-l="D">D</button>
        <button class="key l" type="button" data-l="M">M</button>
        <button class="key wide" type="button" id="barKey" aria-pressed="false"><span class="barmark"></span>×1000 bar</button>
        <button class="key wide" type="button" id="backKey" aria-label="Backspace">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11v14H9L3 12z M12 9l6 6M18 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
        <button class="key wide" type="button" id="clearKey" aria-label="Clear all">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="out" id="out"></div>
      <div class="note" id="note"></div>
      <div class="sr" id="sr" aria-live="polite"></div>

      <svg class="meander" aria-hidden="true"><rect width="100%" height="18" fill="url(#rn-mean)"/></svg>
    </main>

    <div class="col" data-col aria-hidden="true"></div>
  </div>
</div>

<div id="cheer" hidden>
  <div class="cheercard" role="status">
    <div class="wreathbig"><span data-wreath="big"></span><span id="cheerWord">Salve!</span></div>
    <div class="lvl" id="cheerLvl" hidden></div>
    <button class="btn red" id="cheerNext" type="button" aria-label="Next quest">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<dialog id="barDlg" aria-labelledby="barTitle">
  <h2 id="barTitle" class="sr">What's that bar?</h2>
  <p>A line on top means ×1000!</p>
  <div class="demo">
    <div class="dt"><span class="tile p0">V</span>5</div>
    <span class="times">×1000</span>
    <div class="dt"><span class="tile bp0 b drop">V</span>5,000</div>
  </div>
  <button class="btn red" id="barClose" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</dialog>

<script>

    render();
  }

  // ---------- wiring ----------
  $('num').addEventListener('input', onNum);
  $('num').addEventListener('paste', function () { setTimeout(onNum, 0); });
  $('pad').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null; if (!b) { return; }
    if (b.dataset.l) { press(b.dataset.l); }
    else if (b.id === 'barKey') { toggleBar(); }
    else if (b.id === 'backKey') { back(); }
    else if (b.id === 'clearKey') { clearAll(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || !padActive()) { return; }
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') { return; }
    var k = e.key;
    if (k === 'Backspace') { e.preventDefault(); back(); }
    else if (k === '_' || k === "'") { e.preventDefault(); toggleBar(); }
    else if (k && k.length === 1 && 'IVXLCDM'.indexOf(k.toUpperCase()) >= 0) { e.preventDefault(); press(k.toUpperCase()); }
  });
  $('dirA').addEventListener('click', function () { setMode('n2r'); });
  $('dirB').addEventListener('click', function () { setMode('r2n'); });
  $('mute').addEventListener('click', function () { P.mute = !P.mute; save(); drawMute(); if (!P.mute) { sndTap(); } });
  $('questBtn').addEventListener('click', function () { if (!celebrating) { sndTap(); newQuest(); } });
  $('qbar').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null; if (!b || celebrating) { return; }
    if (b.dataset.lv) { P.level = Number(b.dataset.lv); P.done = 0; save(); newQuest(); }
    else if (b.id === 'hintBtn') { if (S.quest && S.quest.hint < 2) { S.quest.hint++; } render(); }
    else if (b.id === 'skipBtn') { newQuest(); }
    else if (b.id === 'quitBtn') { endQuest(); }
  });
  $('cheerNext').addEventListener('click', newQuest);
  $('barHelp').addEventListener('click', function () { var d = $('barDlg'); if (d.showModal) { d.showModal(); } else { d.setAttribute('open', ''); } });
  $('barClose').addEventListener('click', function () { var d = $('barDlg'); if (d.close) { d.close(); } else { d.removeAttribute('open'); } });

  drawMute();
  render();

  // test hook for scripted checks (harmless)
  window.__rn = { S: S, P: P, press: press, setMode: setMode, newQuest: newQuest };
})();
</script>
</body>
</html>
