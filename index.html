<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141d3a">
<title>Kid Games</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #141d3a;
    color: #eef2ff;
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(1.5rem, 6vw, 4rem) clamp(1rem, 4vw, 3rem) 4rem;
    background-image: radial-gradient(ellipse at 50% 0%, #2c3566 0%, #141d3a 70%);
    background-repeat: no-repeat;
  }
  h1 {
    margin: 0 0 clamp(1.5rem, 5vw, 3rem);
    font-size: clamp(1.6rem, 7vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
    gap: clamp(1rem, 3vw, 2rem);
    width: 100%;
    max-width: 60rem;
  }
  .game {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #1e2952;
    border: 2px solid #35407a;
    border-radius: 1.4rem;
    overflow: hidden;
    box-shadow: 0 0.6rem 1.6rem rgba(0, 0, 0, 0.35);
    transition: transform 140ms ease, border-color 140ms ease;
  }
  .game:hover, .game:focus-visible { border-color: #7d8ada; transform: translateY(-3px); }
  .game:active { transform: translateY(0) scale(0.985); }
  .game svg { display: block; width: 100%; height: auto; }
  .game span {
    display: block;
    padding: 0.9rem 1.1rem 1.1rem;
    font-size: clamp(1.1rem, 4vw, 1.35rem);
    font-weight: 700;
  }
  @media (prefers-reduced-motion: reduce) {
    .game { transition: none; }
    .game:hover, .game:focus-visible, .game:active { transform: none; }
  }
</style>
</head>
<body>
  <h1>Kid Games</h1>

  <div class="shelf">
    <a class="game" href="games/animal-band/animal-band.html">

          <linearGradient id="t-cur" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7d1f38"/><stop offset="0.5" stop-color="#c0344f"/><stop offset="1" stop-color="#7d1f38"/>
          </linearGradient>
          <linearGradient id="t-wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cf9459"/><stop offset="1" stop-color="#a4703c"/>
          </linearGradient>
        </defs>
        <rect width="320" height="200" fill="url(#t-sky)"/>
        <rect x="0" y="132" width="320" height="34" fill="url(#t-wood)"/>
        <rect x="0" y="166" width="320" height="34" fill="#7a4f28"/>
        <rect x="0" y="0" width="22" height="200" fill="url(#t-cur)"/>
        <rect x="298" y="0" width="22" height="200" fill="url(#t-cur)"/>
        <rect x="0" y="0" width="320" height="16" fill="url(#t-cur)"/>

        <!-- frog -->

          <circle cx="-12" cy="-36" r="4" fill="#22203a"/><circle cx="12" cy="-36" r="4" fill="#22203a"/>
          <path d="M -17 -21 Q 0 -10 17 -21 Q 0 -17 -17 -21 Z" fill="#2c5a22"/>
        </g>

        <!-- cat -->
        <g transform="translate(160,132)">
          <ellipse cx="0" cy="-22" rx="20" ry="22" fill="#93949c"/>
          <path d="M -17 -60 L -5 -68 L -4 -52 Z" fill="#93949c"/>
          <path d="M 17 -60 L 5 -68 L 4 -52 Z" fill="#93949c"/>
          <circle cx="0" cy="-51" r="16" fill="#93949c"/>

          <ellipse cx="0" cy="-20" rx="11" ry="13" fill="#fbe0a2"/>
          <circle cx="0" cy="-50" r="14" fill="#f2b134"/>
          <ellipse cx="-1" cy="-64" rx="3" ry="7" fill="#d68d1d"/>
          <circle cx="-6" cy="-53" r="5" fill="#fff"/><circle cx="6" cy="-53" r="5" fill="#fff"/>
          <circle cx="-6" cy="-52" r="3" fill="#22203a"/><circle cx="6" cy="-52" r="3" fill="#22203a"/>
          <path d="M -6 -45 L 6 -45 L 0 -39 Z" fill="#ef7d29"/>
        </g>

        <g fill="#ffe9a8">
          <circle cx="40" cy="182" r="5"/><circle cx="72" cy="182" r="5" opacity="0.45"/>
          <circle cx="104" cy="182" r="5" opacity="0.45"/><circle cx="136" cy="182" r="5"/>
          <circle cx="168" cy="182" r="5" opacity="0.45"/><circle cx="200" cy="182" r="5" opacity="0.45"/>
          <circle cx="232" cy="182" r="5"/><circle cx="264" cy="182" r="5" opacity="0.45"/>
        </g>
      </svg>
      <span>Animal Band</span>
    </a>

    <a class="game" href="games/hamish-times-tables/hamish-times-tables.html">
      <svg viewBox="0 0 320 200" role="img" aria-label="Hamish's Times Tables">

          <path d="M-46-36c2-22 22-34 46-34s44 12 46 34c-4 4-8 2-10 8-3 8-9 6-12 12-3-8-9-6-12-12-3 8-9 8-12 14-3-8-9-6-12-14-3 8-9 4-12 12-3-6-9-4-12-12-2-6-6-4-10-8z" fill="#D9782F"/>
          <ellipse cx="-17" cy="-12" rx="7.5" ry="8.5" fill="#3A2317"/><ellipse cx="17" cy="-12" rx="7.5" ry="8.5" fill="#3A2317"/>
          <circle cx="-14.5" cy="-15" r="2.6" fill="#fff"/><circle cx="19.5" cy="-15" r="2.6" fill="#fff"/>
          <ellipse cx="0" cy="14" rx="27" ry="20" fill="#F7E2C6"/>
          <ellipse cx="-10" cy="8" rx="4.5" ry="6" fill="#B8846A"/><ellipse cx="10" cy="8" rx="4.5" ry="6" fill="#B8846A"/>
          <path d="M-11 22c5 6 17 6 22 0" fill="none" stroke="#B8846A" stroke-width="3" stroke-linecap="round"/>
        </g>

        <g transform="translate(46 168)">
          <rect x="-34" y="-19" width="68" height="38" rx="19" fill="#ffffff" opacity="0.94"/>
          <text x="0" y="7" text-anchor="middle" font-family="ui-rounded, system-ui, sans-serif"
                font-size="21" font-weight="800" fill="#8E6BA8">3 × 4</text>
        </g>
      </svg>
      <span>Hamish's Times Tables</span>
    </a>
  </div>
</body>
</html>
