<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#141d3a">
<title>Kid Games</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #141d3a;
    color: #eef2ff;
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(1.5rem, 6vw, 4rem) clamp(1rem, 4vw, 3rem) 4rem;
    background-image: radial-gradient(ellipse at 50% 0%, #2c3566 0%, #141d3a 70%);
    background-repeat: no-repeat;
  }
  h1 {
    margin: 0 0 clamp(1.5rem, 5vw, 3rem);
    font-size: clamp(1.6rem, 7vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
    gap: clamp(1rem, 3vw, 2rem);
    width: 100%;
    max-width: 60rem;
  }
  .game {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #1e2952;
    border: 2px solid #35407a;
    border-radius: 1.4rem;
    overflow: hidden;
    box-shadow: 0 0.6rem 1.6rem rgba(0, 0, 0, 0.35);
    transition: transform 140ms ease, border-color 140ms ease;
  }
  .game:hover, .game:focus-visible { border-color: #7d8ada; transform: translateY(-3px); }
  .game:active { transform: translateY(0) scale(0.985); }
  .game svg { display: block; width: 100%; height: auto; }
  .game span {
    display: block;
    padding: 0.9rem 1.1rem 1.1rem;
    font-size: clamp(1.1rem, 4vw, 1.35rem);
    font-weight: 700;
  }
  @media (prefers-reduced-motion: reduce) {
    .game { transition: none; }
    .game:hover, .game:focus-visible, .game:active { transform: none; }
  }
</style>
