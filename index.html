<!doctype html>

<head>

<title>Kid Games</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #141d3a;
    color: #eef2ff;
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(1.5rem, 6vw, 4rem) clamp(1rem, 4vw, 3rem) 4rem;
    background-image: radial-gradient(ellipse at 50% 0%, #2c3566 0%, #141d3a 70%);
    background-repeat: no-repeat;
  }
  h1 {
    margin: 0 0 clamp(1.5rem, 5vw, 3rem);
    font-size: clamp(1.6rem, 7vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  #latest {
    margin-top: clamp(1.5rem, 5vw, 3rem);
    font-size: 0.85rem;
    color: #8b96c8;
    text-align: center;
  }
  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
    gap: clamp(1rem, 3vw, 2rem);
    width: 100%;
    max-width: 60rem;
  }
  .game {
    display: block;
    text-decoration: none;
    color: inherit;
    background: #1e2952;
    border: 2px solid #35407a;
    border-radius: 1.4rem;
    overflow: hidden;
    box-shadow: 0 0.6rem 1.6rem rgba(0, 0, 0, 0.35);
    transition: transform 140ms ease, border-color 140ms ease;
  }
  .game:hover, .game:focus-visible { border-color: #7d8ada; transform: translateY(-3px); }
  .game:active { transform: translateY(0) scale(0.985); }
  .game svg { display: block; width: 100%; height: auto; }
  .game span {
    display: block;
    padding: 0.9rem 1.1rem 1.1rem;
    font-size: clamp(1.1rem, 4vw, 1.35rem);
    font-weight: 700;
  }
  @media (prefers-reduced-motion: reduce) {
    .game { transition: none; }
    .game:hover, .game:focus-visible, .game:active { transform: none; }
  }
</style>
</head>

<script>
// Which game was touched last, and when.
//
// Read from GitHub, not from a list kept here. A list kept here was tried
// first and was wrong within the hour: the times were typed rather than
// looked up, and the footer confidently announced a change three hours
// into the future. Anything hand-maintained is a claim; this is the
// repository answering for itself.
//
// Two unauthenticated calls, because the commit list does not say which
// files a commit touched and the single-commit endpoint does. Sixty an
// hour is the limit and the answer is cached for five minutes, so opening
// the launcher repeatedly costs nothing.
//
// The game names come from the tiles above rather than from a second list
// here, so adding a game to the shelf is all it takes for the footer to
// know about it.
(function () {
  var REPO = 'campbell226/kid-games';
  var STORE = 'kid-games-latest';
  var FRESH = 5 * 60 * 1000;

  var out = document.getElementById('latest');
  if (!out) { return; }

  function names() {
    var map = {}, links = document.querySelectorAll('a.game'), i, m, span;
    for (i = 0; i < links.length; i++) {
      m = /games\/([^/]+)\//.exec(links[i].getAttribute('href') || '');
      span = links[i].querySelector('span');
      if (m && span) { map[m[1]] = span.textContent.trim(); }
    }
    return map;
  }

  // Always UK time, whatever the tablet thinks it is. Europe/London
  // rather than a fixed offset, so this is BST in September and GMT in
  // January without anybody having to remember which.
  function render(name, iso) {
    var d = new Date(iso), when, at;
    try {
      var UK = { timeZone: 'Europe/London' };
      // en-CA gives YYYY-MM-DD, which subtracts cleanly. Comparing
      // against the viewer's own midnight would call this evening
      // yesterday for anyone already past theirs.
      function day(x) { return x.toLocaleDateString('en-CA', UK); }
      var diff = Math.round((Date.parse(day(new Date())) - Date.parse(day(d))) / 86400000);
      if (diff <= 0) { when = 'today'; }
      else if (diff === 1) { when = 'yesterday'; }
      else {
        when = d.toLocaleDateString('en-GB',
          { timeZone: 'Europe/London', day: 'numeric', month: 'long' });
        if (day(d).slice(0, 4) !== day(new Date()).slice(0, 4)) {
          when += ' ' + day(d).slice(0, 4);
        }
      }
      at = d.toLocaleTimeString('en-GB',
        { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
    } catch (e) {
      when = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
      at = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }
    out.textContent = 'Last updated: ' + name + ' — ' + when + ' at ' + at;
    out.setAttribute('title', d.toISOString());
  }

  function cached() {
    try { return JSON.parse(window.localStorage.getItem(STORE)); }
    catch (e) { return null; }
  }

  function keep(v) {
    try { window.localStorage.setItem(STORE, JSON.stringify(v)); }
    catch (e) { /* private browsing; it will just ask again next time */ }
  }

  // Show what we knew straight away, so an offline launcher still says
  // something true as of the last time it could ask.
  var have = cached();
  if (have && have.name && have.iso) { render(have.name, have.iso); }
  if (have && (Date.now() - (have.got || 0)) < FRESH) { return; }

  var api = 'https://api.github.com/repos/' + REPO + '/commits';

  fetch(api + '?per_page=1&path=games')
    .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
    .then(function (list) {
      if (!list || !list.length) { throw new Error('no commits'); }
      var sha = list[0].sha;
      var iso = list[0].commit && list[0].commit.committer && list[0].commit.committer.date;
      return fetch(api + '/' + sha).then(function (r) {
        if (!r.ok) { throw new Error(r.status); }
        return r.json();
      }).then(function (commit) {
        var map = names(), files = commit.files || [], i, m;
        for (i = 0; i < files.length; i++) {
          m = /^games\/([^/]+)\//.exec(files[i].filename || '');
          if (m && map[m[1]]) {
            return { name: map[m[1]], iso: iso, got: Date.now() };
          }
        }
        return null;
      });
    })
    .then(function (v) {
      if (!v) { return; }
      keep(v);
      render(v.name, v.iso);
    })
    ['catch'](function () {
      // Offline, rate limited, or GitHub having a moment. Whatever is
      // already on screen from the cache stays there, and saying nothing
      // beats saying something invented - which is how this started.
    });
})();
</script>
